name: kokuno-agent5-local-pressure-admission-routing

on:
  push:
    branches:
      - codex/kokuno-a5-local-pressure-admission-048
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-local-pressure-admission-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-pressure-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_local_pressure_coordinate.py \
            src/openai_ns_reconstruction/kokuno_agent4_pa10_local_pressure_coordinate_audit.py \
            src/openai_ns_reconstruction/kokuno_local_pressure_admission_routing_checkpoint.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_local_pressure_coordinate.py \
            tests/test_constrained_kokuno_agent4_pa10_local_pressure_coordinate_audit.py \
            tests/test_constrained_kokuno_local_pressure_admission_routing_checkpoint.py
      - name: Fresh Agent4 public-only audit replay
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_agent4_pa10_local_pressure_coordinate_audit \
            --output artifacts/kokuno_agent5/local_pressure_admission/a4_fresh_replay.json
      - name: Generate deterministic Agent5 checkpoint
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_local_pressure_admission_routing_checkpoint \
            --output artifacts/kokuno_agent5/local_pressure_admission/checkpoint.json
      - name: Validate immutable truth boundary and report
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          from openai_ns_reconstruction.kokuno_local_pressure_admission_routing_checkpoint import (
              FORMAL_GATES,
              validate_checkpoint,
          )

          path = Path('artifacts/kokuno_agent5/local_pressure_admission/checkpoint.json')
          payload = json.loads(path.read_text())
          validate_checkpoint(payload)
          assert payload['formal_gates_unchanged'] == FORMAL_GATES
          states = payload['states']
          assert states['selected_pressure_local_coordinate_independently_admitted'] is True
          assert states['leading_ready'] is False
          assert states['source_pressure_radius_one_ball_bounds_ready'] is False
          assert states['global_matched_pressure_ready'] is False
          assert states['correction_ready'] is False
          assert states['candidate_artifact_instantiated'] is False
          assert states['pde_validated'] is False
          newer = payload['upstream']['newer_sibling_work']
          assert newer['agent4_pressure_ball_audit']['resolved_at_checkpoint_freeze'] is False
          assert newer['agent4_pressure_ball_audit']['admitted_by_this_checkpoint'] is False
          raw = path.read_bytes()
          print('exact_head=', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          print('checkpoint_file_sha256=', hashlib.sha256(raw).hexdigest())
          print('checkpoint_sha256=', payload['checkpoint_sha256'])
          print('metrics=', payload['independent_local_pressure_metrics'])
          print('states=', states)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-local-pressure-admission-routing-checkpoint-v48
          path: artifacts/kokuno_agent5/local_pressure_admission/
