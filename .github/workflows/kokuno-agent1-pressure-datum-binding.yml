name: kokuno-agent1-pressure-datum-binding

on:
  push:
    branches:
      - codex/kokuno-a1-pressure-datum-binding-015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a1-pressure-datum-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pressure-datum-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pressure_datum_binding.py
      - name: Generate selected pressure-datum receipt
        run: |
          python -m openai_ns_reconstruction.kokuno_pressure_datum_binding \
            --probe-maxdegree 14 \
            --probe-eta-nodes 65 \
            --appendix-b-eta 0.0 \
            --output artifacts/kokuno_agent1/pressure_datum_binding/report.json
      - name: Show scientific receipt
        run: cat artifacts/kokuno_agent1/pressure_datum_binding/report.json
      - name: Export receipt states
        id: receipt_meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/kokuno_agent1/pressure_datum_binding/report.json').read_text())
          core = report['finite_core_probe']
          appendix = report['appendix_B_probe']
          print('core_status=' + core['status'])
          print('appendix_status=' + appendix['status'])
          print('core_error=' + core.get('error_type', 'none'))
          print('appendix_error=' + appendix.get('error_type', 'none'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pressure-datum-binding-v1-${{ steps.receipt_meta.outputs.core_status }}-${{ steps.receipt_meta.outputs.core_error }}-${{ steps.receipt_meta.outputs.appendix_status }}-${{ steps.receipt_meta.outputs.appendix_error }}
          path: artifacts/kokuno_agent1/pressure_datum_binding/report.json
