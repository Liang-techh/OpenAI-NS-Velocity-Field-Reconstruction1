name: kokuno-agent5-current-xi-moment-discrepancy-ingest

on:
  push:
    branches:
      - codex/kokuno-a5-current-xi-moment-discrepancy-ingest-089
  pull_request:
    branches:
      - codex/kokuno-a5-actual-final-bridge-xi110-ingest-088
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_current_xi_moment_discrepancy_ingest_contract.py"
      - "tests/test_kokuno_a5_current_xi_moment_discrepancy_ingest_contract.py"
      - ".github/workflows/kokuno-agent5-current-xi-moment-discrepancy-ingest.yml"

permissions:
  contents: read

jobs:
  current-xi-moment-discrepancy-ingest-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Agent-5 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out head, parent ancestry, and bounded diff
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT_HEAD: a732424661a615f24b7034f733bf5f281ac9a2d2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT_HEAD" HEAD
          test "$(git ls-tree "$PARENT_HEAD" -- src/openai_ns_reconstruction/kokuno_a5_actual_final_bridge_xi110_ingest_contract.py | awk '{print $3}')" = "fc0f463a451fd26d0d7a5e90570a2c1698f725e6"
          test "$(git ls-tree "$PARENT_HEAD" -- tests/test_kokuno_a5_actual_final_bridge_xi110_ingest_contract.py | awk '{print $3}')" = "8372a6a612839077d1d7e88f50dfe61edeab7c19"
          test "$(git ls-tree "$PARENT_HEAD" -- .github/workflows/kokuno-agent5-actual-final-bridge-xi110-ingest.yml | awk '{print $3}')" = "5391fe52e78b280628e7e62c71f7686842b1a3ef"
          mapfile -t changed < <(git diff --name-only "$PARENT_HEAD" HEAD | sort)
          expected=(
            ".github/workflows/kokuno-agent5-current-xi-moment-discrepancy-ingest.yml"
            "src/openai_ns_reconstruction/kokuno_a5_current_xi_moment_discrepancy_ingest_contract.py"
            "tests/test_kokuno_a5_current_xi_moment_discrepancy_ingest_contract.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          echo "exact_head=$EXPECTED_HEAD"

      - name: Fetch and verify pinned Agent-1, Agent-3, and Agent-4 artifacts
        shell: bash
        run: |
          set -euo pipefail
          A1_HEAD=2797eed8e3b9b3374c676d8f517f05e3f0fc3e6b
          A3_HEAD=87c1ef765d6bf3613c7c6c301669ffccf5260117
          A4_HEAD=d366a8aa3b36bb41825e5f5927548cc8bab58eaf
          git fetch --no-tags origin \
            agent-kokuno-1/actual-xi-moments-089 \
            codex/kokuno-a3-current-xi-moment-bridge-091 \
            codex/kokuno-a4-actual-xi-prefix-moments-independent-audit-091
          test "$(git rev-parse "$A1_HEAD")" = "$A1_HEAD"
          test "$(git rev-parse "$A3_HEAD")" = "$A3_HEAD"
          test "$(git rev-parse "$A4_HEAD")" = "$A4_HEAD"
          test "$(git ls-tree "$A1_HEAD" -- src/openai_ns_reconstruction/kokuno_pa10_actual_xi_prefix_moments.py | awk '{print $3}')" = "92dce65c9a8793e06497a7e7347c832861032238"
          test "$(git ls-tree "$A1_HEAD" -- tests/test_kokuno_pa10_actual_xi_prefix_moments.py | awk '{print $3}')" = "169a6282e1fd0e20225c669ff4473958d6e8e014"
          test "$(git ls-tree "$A1_HEAD" -- .github/workflows/kokuno-agent1-actual-xi-prefix-moments.yml | awk '{print $3}')" = "58a1b0c07cd7137d943a437d78f8db223d584652"
          test "$(git ls-tree "$A3_HEAD" -- src/openai_ns_reconstruction/kokuno_current_xi_moment_discrepancy_bridge.py | awk '{print $3}')" = "223058e2132bb22298c6a642b0f2a55562181e25"
          test "$(git ls-tree "$A3_HEAD" -- tests/test_constrained_kokuno_current_xi_moment_discrepancy_bridge.py | awk '{print $3}')" = "875bd551924a988b6adbc8f8f98180cddd78b04c"
          test "$(git ls-tree "$A3_HEAD" -- .github/workflows/kokuno-agent3-current-xi-moment-discrepancy-bridge.yml | awk '{print $3}')" = "23493753b08408826d54464a2646f95a3f8c33aa"
          test "$(git ls-tree "$A4_HEAD" -- src/openai_ns_reconstruction/kokuno_a4_actual_xi_prefix_moments_independent_audit.py | awk '{print $3}')" = "b503283bfe7f5e36a4f1da82d4fec559fcf3e171"
          test "$(git ls-tree "$A4_HEAD" -- tests/test_constrained_kokuno_a4_actual_xi_prefix_moments_independent_audit.py | awk '{print $3}')" = "6bdb06c8fbeec5a42b1af5091c46cc7f4837a61d"
          test "$(git ls-tree "$A4_HEAD" -- .github/workflows/kokuno-agent4-actual-xi-prefix-moments-independent-audit.yml | awk '{print $3}')" = "3b3af059ac84e3ae6314a8aba25f9e19ca5d6fd0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile and run parent plus current Agent-5 contract tests
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a5_current_xi_moment_discrepancy_ingest_contract.py \
            tests/test_kokuno_a5_current_xi_moment_discrepancy_ingest_contract.py
          python -m pytest -q -W error \
            tests/test_kokuno_a5_actual_final_bridge_xi110_ingest_contract.py \
            tests/test_kokuno_a5_current_xi_moment_discrepancy_ingest_contract.py

      - name: Materialize fail-closed Agent-5 Xi discrepancy ingest receipt
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m openai_ns_reconstruction.kokuno_a5_current_xi_moment_discrepancy_ingest_contract \
            --exact-head "$EXACT_HEAD" \
            --output artifacts/kokuno_a5_current_xi_moment_discrepancy_ingest_contract.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/kokuno_a5_current_xi_moment_discrepancy_ingest_contract.json")
          contract = json.loads(path.read_text(encoding="utf-8"))
          a1 = contract["agent1_xi_prefix_moments"]
          a3 = contract["agent3_xi_discrepancy_bridge"]
          a4 = contract["agent4_xi_moment_audit"]
          seam = contract["xi_moment_discrepancy_ingest_seam"]
          truth = contract["truth_boundary"]
          assert a1["candidate_side_actual_minus_ideal_discrepancy_materialized"] is True
          assert a1["G_i_ell_i_bound_into_pa16_shaped_input"] is True
          assert a3["upstream_agent1_head"] == a1["head"]
          assert a3["current_candidate_side_discrepancy_consumed"] is True
          assert a3["discrepancy_from_complete_ns_defect"] is False
          assert a3["authorized_for_gain_gated_ns_stage"] is False
          assert a4["audited_agent1_head"] == a1["head"]
          assert a4["saved_reloaded_public_profile_values_only"] is True
          assert a4["production_moment_integrator_used_as_reference"] is False
          assert a4["independent_xi_moment_audit_registered"] is True
          assert a4["independent_xi_moment_audit_admitted"] is False
          assert seam["queued_or_unresolved_ci_is_pass"] is False
          assert seam["source_moment_discrepancy_is_complete_ns_defect"] is False
          assert seam["source_moment_discrepancy_authorizes_correction_stage"] is False
          assert seam["row_transform_is_pa16_repair"] is False
          assert truth["current_candidate_side_xi_prefix_moment_discrepancy_materialized"] is True
          assert truth["pa16_repair_applied"] is False
          assert truth["actual_inner_to_outer_global_join_materialized"] is False
          assert truth["matched_cartesian_pressure_materialized"] is False
          assert truth["restricted_forcing_materialized"] is False
          assert truth["real_agent3_correction_velocity_materialized"] is False
          assert truth["same_protocol_full_ns_residual_available"] is False
          assert contract["final_gate"]["normalized_momentum_volume_l2"] == 1e-3
          assert contract["final_gate"]["divergence_volume_l2"] == 1e-5
          assert contract["readiness"]["leading_ready"] is False
          assert contract["readiness"]["correction_ready"] is False
          assert contract["readiness"]["pde_validated"] is False
          PY

      - name: Upload Agent-5 current-Xi discrepancy ingest contract
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a5-current-xi-moment-discrepancy-ingest-contract
          path: artifacts/kokuno_a5_current_xi_moment_discrepancy_ingest_contract.json
          if-no-files-found: error
