name: kokuno-agent5-multiband-audit-routing

on:
  push:
    branches:
      - codex/kokuno-a5-multiband-audit-routing-028
  pull_request:
    branches:
      - codex/kokuno-a2-two-band-physical-family-028
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-multiband-audit-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused stable Agent-2 plus Agent-5 routing tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_multiband_real_pair_family.py
          tests/test_constrained_kokuno_multiband_audit_routing_checkpoint.py
      - name: Generate deterministic Agent-5 checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_multiband_audit_routing_checkpoint
          --output artifacts/kokuno_agent5/multiband_audit_routing_checkpoint_v28/checkpoint.json
      - name: Show checkpoint
        run: cat artifacts/kokuno_agent5/multiband_audit_routing_checkpoint_v28/checkpoint.json
      - name: Upload routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-multiband-audit-routing-checkpoint-v28
          path: artifacts/kokuno_agent5/multiband_audit_routing_checkpoint_v28
