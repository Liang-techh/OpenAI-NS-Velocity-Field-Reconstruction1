name: kokuno-agent3-actual-signed-mean-readiness

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_actual_signed_mean_correction_gate.py'
      - 'src/openai_ns_reconstruction/actual_signed_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_physical_covariance_rank_screen.py'
      - 'tests/test_actual_signed_mean_defect.py'
      - 'tests/test_constrained_kokuno_signed_physical_covariance_rank_screen.py'
      - 'tests/test_constrained_kokuno_actual_signed_mean_correction_gate.py'
      - '.github/workflows/kokuno-agent3-actual-signed-mean-readiness.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_actual_signed_mean_correction_gate.py'
      - 'src/openai_ns_reconstruction/actual_signed_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_physical_covariance_rank_screen.py'
      - 'tests/test_actual_signed_mean_defect.py'
      - 'tests/test_constrained_kokuno_signed_physical_covariance_rank_screen.py'
      - 'tests/test_constrained_kokuno_actual_signed_mean_correction_gate.py'
      - '.github/workflows/kokuno-agent3-actual-signed-mean-readiness.yml'

permissions:
  contents: read

jobs:
  actual-signed-mean-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused formal-defect, signed-rank, and Agent-3 readiness tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_actual_signed_mean_defect.py
          tests/test_constrained_kokuno_signed_physical_covariance_rank_screen.py
          tests/test_constrained_kokuno_actual_signed_mean_correction_gate.py
      - name: Compile readiness gate
        run: >-
          python -m compileall -q
          src/openai_ns_reconstruction/kokuno_actual_signed_mean_correction_gate.py
