name: kokuno-agent4-public-oscillatory-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_independent_audit.py"
      - "tests/test_constrained_kokuno_public_oscillatory_independent_audit.py"
      - ".github/workflows/kokuno-agent4-public-oscillatory-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile independent validator
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_public_oscillatory_independent_audit.py
      - name: Run parent and independent focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_candidate_velocity.py
          tests/test_constrained_kokuno_public_oscillatory_independent_audit.py
      - name: Generate frozen independent receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_public_oscillatory_independent_audit
          --output outputs/kokuno_agent4_public_oscillatory_independent_audit.json
      - name: Validate receipt truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/kokuno_agent4_public_oscillatory_independent_audit.json')
          r = json.loads(p.read_text())
          assert r['schema'] == 'kokuno-agent4-public-oscillatory-independent-audit-v1'
          assert r['parent_agent2_head'] == '46c1699c7fc7ab2dc103d5cf430ead3a39bbbc1e'
          assert r['truth_boundary']['formal_full_domain_pde_gate_assessed'] is False
          assert r['truth_boundary']['heldout_ns_residual_assessed'] is False
          assert r['truth_boundary']['pde_validated'] is False
          PY
      - name: Extract receipt metrics
        id: metrics
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r = json.loads(Path('outputs/kokuno_agent4_public_oscillatory_independent_audit.json').read_text())
          rows = r['divergence']['rows']
          refs = r['divergence']['relative_rms_refinement_ratios']
          cov = r['phase_mean_covariance']
          support = r['support']
          params = r['parameter_perturbation']
          print(f"r0={rows[0]['relative_rms']:.4e}")
          print(f"r1={rows[1]['relative_rms']:.4e}")
          print(f"r2={rows[2]['relative_rms']:.4e}")
          print(f"rr={min(refs):.3e}")
          print(f"rank={min(x['rank_ratio'] for x in cov['rows']):.4e}")
          print(f"drift={max(cov['relative_drift_to_finest']):.3e}")
          print(f"axz={support['project_axial_exterior_absolute_max']:.4e}")
          print(f"vrms={r['nontriviality']['heldout_velocity_rms']:.4e}")
          print(f"hchg={min(params['h_minus_10pct_relative_change'], params['h_plus_10pct_relative_change']):.3e}")
          print(f"mut={r['divergence_mutation']['relative_rms']:.3e}")
          print(f"div={int(r['divergence']['local_divergence_passed'])}")
          print(f"cov={int(cov['covariance_rank_preflight_passed'])}")
          print(f"rad={int(support['radial_axis_support_passed'])}")
          print(f"axial={int(support['project_axial_support_passed'])}")
          print(f"overall={int(r['public_oscillatory_preflight_passed'])}")
          PY
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: k4osc-r0-${{ steps.metrics.outputs.r0 }}-r1-${{ steps.metrics.outputs.r1 }}-r2-${{ steps.metrics.outputs.r2 }}-rr-${{ steps.metrics.outputs.rr }}-rank-${{ steps.metrics.outputs.rank }}-drift-${{ steps.metrics.outputs.drift }}-axz-${{ steps.metrics.outputs.axz }}-vrms-${{ steps.metrics.outputs.vrms }}-hchg-${{ steps.metrics.outputs.hchg }}-mut-${{ steps.metrics.outputs.mut }}-div-${{ steps.metrics.outputs.div }}-cov-${{ steps.metrics.outputs.cov }}-rad-${{ steps.metrics.outputs.rad }}-axial-${{ steps.metrics.outputs.axial }}-overall-${{ steps.metrics.outputs.overall }}
          path: outputs/kokuno_agent4_public_oscillatory_independent_audit.json
          if-no-files-found: error
