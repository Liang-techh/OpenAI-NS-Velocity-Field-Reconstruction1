name: kokuno-agent4-public-oscillatory-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_independent_audit.py"
      - "tests/test_constrained_kokuno_public_oscillatory_independent_audit.py"
      - ".github/workflows/kokuno-agent4-public-oscillatory-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile independent validator
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_public_oscillatory_independent_audit.py
      - name: Run parent and independent focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_candidate_velocity.py
          tests/test_constrained_kokuno_public_oscillatory_independent_audit.py
      - name: Generate frozen independent receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_public_oscillatory_independent_audit
          --output outputs/kokuno_agent4_public_oscillatory_independent_audit.json
      - name: Validate receipt truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/kokuno_agent4_public_oscillatory_independent_audit.json')
          r = json.loads(p.read_text())
          assert r['schema'] == 'kokuno-agent4-public-oscillatory-independent-audit-v1'
          assert r['parent_agent2_head'] == '46c1699c7fc7ab2dc103d5cf430ead3a39bbbc1e'
          assert r['truth_boundary']['formal_full_domain_pde_gate_assessed'] is False
          assert r['truth_boundary']['heldout_ns_residual_assessed'] is False
          assert r['truth_boundary']['pde_validated'] is False
          PY
      - name: Extract receipt metrics
        id: metrics
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r = json.loads(Path('outputs/kokuno_agent4_public_oscillatory_independent_audit.json').read_text())
          finest = r['divergence']['rows'][-1]
          cov = r['phase_mean_covariance']
          print(f"drms={finest['relative_rms']:.6e}")
          print(f"dmax={finest['relative_max']:.6e}")
          print(f"rank={min(x['rank_ratio'] for x in cov['rows']):.6e}")
          print(f"axz={r['support']['project_axial_exterior_absolute_max']:.6e}")
          print(f"local={int(r['local_curl_covariance_preflight_passed'])}")
          print(f"support={int(r['project_support_preflight_passed'])}")
          print(f"overall={int(r['public_oscillatory_preflight_passed'])}")
          PY
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-public-osc-drms-${{ steps.metrics.outputs.drms }}-dmax-${{ steps.metrics.outputs.dmax }}-rank-${{ steps.metrics.outputs.rank }}-axz-${{ steps.metrics.outputs.axz }}-local-${{ steps.metrics.outputs.local }}-support-${{ steps.metrics.outputs.support }}-overall-${{ steps.metrics.outputs.overall }}
          path: outputs/kokuno_agent4_public_oscillatory_independent_audit.json
          if-no-files-found: error
