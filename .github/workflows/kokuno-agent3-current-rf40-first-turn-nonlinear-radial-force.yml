name: kokuno-agent3-current-rf40-first-turn-nonlinear-radial-force

on:
  push:
    branches:
      - codex/kokuno-a3-rf40-first-turn-radial-force-108
  pull_request:
    branches:
      - codex/kokuno-a3-rf40-first-turn-radial-stress-107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact A3 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a3
          fetch-depth: 0

      - name: Verify exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 1dde810a0a3f2f93c268ca10a86b3443dea14e9f HEAD
          test "$(git rev-list --count 1dde810a0a3f2f93c268ca10a86b3443dea14e9f..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only 1dde810a0a3f2f93c268ca10a86b3443dea14e9f..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent3-current-rf40-first-turn-nonlinear-radial-force.yml \
            src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_nonlinear_radial_force.py \
            tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_radial_force.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact A3 head
        shell: bash
        run: python -m pip install -e './a3[dev]'

      - name: Authenticate exact A3 parent source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_nonlinear_radial_stress.py)" = \
            "6334b2fa37d49b60548147e6ae5beca6da652d80"
          git -C a3 merge-base --is-ancestor 1dde810a0a3f2f93c268ca10a86b3443dea14e9f HEAD

      - name: Check out exact corrected Kokuno reader
        uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: kokuno-reader
          fetch-depth: 1

      - name: Verify corrected reader blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C kokuno-reader rev-parse HEAD)" = "143f6773feb424ad9ed3a8d116653200f20346b7"
          test "$(git -C kokuno-reader hash-object navier-stokes/navier_stokes_workbench.tex)" = \
            "205a99807302e21a51c5eaf223390c0dfc42bcd0"

      - name: Run focused A3 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a3/src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_nonlinear_radial_force.py \
            a3/tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_radial_force.py
          python -m pytest -q -W error \
            a3/tests/test_constrained_kokuno_current_partial_nonlinear_radial_force.py \
            a3/tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_radial_stress.py \
            a3/tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_radial_force.py

      - name: Check out exact A2 RF40-first-turn composite
        uses: actions/checkout@v4
        with:
          ref: 2a2fad307a674ec1eb5a2bc426c0d01c3a0e7377
          path: a2
          fetch-depth: 1

      - name: Check out exact A1 RF40-first-turn leading
        uses: actions/checkout@v4
        with:
          ref: 23c00b98526e187ff04d432745300a084ec859f2
          path: a1
          fetch-depth: 1

      - name: Authenticate sibling heads and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "2a2fad307a674ec1eb5a2bc426c0d01c3a0e7377"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_leading_oscillatory_identity.py)" = \
            "c126dace161e5dae1745185c79152736817994b8"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = \
            "12df3bf6c949baeebf609b366f2973e7f515a157"
          test "$(git -C a1 rev-parse HEAD)" = "23c00b98526e187ff04d432745300a084ec859f2"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_first_turn.py)" = \
            "bf71948cbdb827d791b86ab8f00496bd1b231961"

      - name: Materialize real RF40-first-turn radial-force receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import openai_ns_reconstruction

          pkg = openai_ns_reconstruction
          a1_pkg = str(Path('a1/src/openai_ns_reconstruction').resolve())
          a2_pkg = str(Path('a2/src/openai_ns_reconstruction').resolve())
          a3_pkg = str(Path('a3/src/openai_ns_reconstruction').resolve())

          pkg.__path__.insert(0, a1_pkg)
          pkg.__path__.insert(0, a2_pkg)
          from openai_ns_reconstruction.kokuno_current_rf40_first_turn_leading_oscillatory_identity import (
              default_field,
          )
          from openai_ns_reconstruction.kokuno_oscillatory_batch_differentials import (
              evaluate_oscillatory_batch_differentials,
          )
          field = default_field()

          pkg.__path__.insert(0, a3_pkg)
          from openai_ns_reconstruction.kokuno_current_rf40_first_turn_nonlinear_mean_attribution import (
              ExactCurrentRF40FirstTurnNonlinearBackend,
          )
          from openai_ns_reconstruction.kokuno_current_rf40_first_turn_nonlinear_radial_force import (
              materialize_current_rf40_first_turn_nonlinear_radial_force,
              truth_boundary,
          )
          from openai_ns_reconstruction.kokuno_strict_inner_transport_radial_stress import (
              StrictInnerTransportRadialGeometry,
          )

          backend = ExactCurrentRF40FirstTurnNonlinearBackend.bind(
              field, evaluate_oscillatory_batch_differentials
          )
          radii = np.linspace(0.02, 0.44, 22)
          geometry = StrictInnerTransportRadialGeometry(
              time=0.39,
              axial_z=-0.08,
              radii=tuple(float(v) for v in radii),
              bump_center=0.30,
              bump_halfwidth=0.10,
          )
          witness = materialize_current_rf40_first_turn_nonlinear_radial_force(
              backend, geometry
          )
          receipt = witness.to_receipt()
          receipt['a3_truth_boundary'] = truth_boundary()
          receipt['candidate_residual_evidence'] = False
          Path('receipts/kokuno_a3_current_rf40_first_turn_nonlinear_radial_force.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload receipt before gate enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a3-current-rf40-first-turn-nonlinear-radial-force
          path: receipts/kokuno_a3_current_rf40_first_turn_nonlinear_radial_force.json
          if-no-files-found: error

      - name: Enforce scoped radial-force gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import math

          receipt = json.loads(
              Path('receipts/kokuno_a3_current_rf40_first_turn_nonlinear_radial_force.json').read_text()
          )
          assert receipt['backend_kind'] == (
              'exact-current-a3-pr1000-first-turn-axial-stress-to-radial-force'
          )
          assert receipt['source_radial_force_formula'] == '(div T)_r = partial_z sigma_1'
          assert receipt['parent_agent3_1000_source_blob'] == (
              '6334b2fa37d49b60548147e6ae5beca6da652d80'
          )
          assert receipt['z_derivative_step_ladder'] == [0.02, 0.01, 0.005]
          assert receipt['aggregate_derivative_stability_preflight_passed'] is True
          assert max(receipt['piece_closure_relative_max_levels']) <= 5e-10

          aggregate = receipt['aggregate']
          assert aggregate['finest_radial_force_rms'] > 1e-14
          assert aggregate['finest_radial_force_max_abs'] > 1e-14
          for piece in ('quadratic', 'mixed', 'aggregate'):
              block = receipt[piece]
              assert math.isfinite(float(block['finest_radial_force_rms']))
              assert math.isfinite(float(block['finest_radial_force_max_abs']))
              assert len(block['levels']) == 3
              assert len(block['coarse_to_fine_relative_rms_differences']) == 2

          assert receipt['candidate_residual_evidence'] is False
          boundary = receipt['a3_truth_boundary']
          assert boundary['current_RF40_first_turn_axial_e1_stress_consumed'] is True
          assert boundary['current_RF40_first_turn_radial_force_from_dz_sigma1_materialized'] is True
          assert boundary['quadratic_mixed_aggregate_radial_force_attribution_materialized'] is True
          assert boundary['independent_third_radial_moment_inverse_introduced'] is False
          assert boundary['recorded_radial_mean_equated_to_radial_force'] is False
          assert boundary['agent2_curl_or_jacobian_reimplemented_by_agent3'] is False
          for key in (
              'velocity_after_RF40_first_turn_materialized',
              'RF40_axial_shutdown_current_lineage_consumed',
              'RF40_lambda_turn_current_lineage_consumed',
              'full_post_XR_RF40_current_lineage_materialized',
              'outer_global_leading_velocity_materialized',
              'matched_global_pressure_materialized',
              'restricted_forcing_materialized',
              'complete_ns_defect',
              'full_three_component_ns_correction_object_materialized',
              'scoped_current_RF40_first_turn_stress_authorized_as_correction_target',
              'mean_correction_velocity_materialized',
              'current_real_ns_correction_velocity_materialized',
              'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed',
              'residual_reduction_claimed',
              'same_protocol_comparable_to_st006',
              'pde_validated',
              'paper_exact',
              'openai_field_identified',
              'blowup_proved',
          ):
              assert boundary[key] is False, key
          assert boundary['final_normalized_momentum_gate'] == 1e-3
          assert boundary['final_normalized_divergence_gate'] == 1e-5
          PY
