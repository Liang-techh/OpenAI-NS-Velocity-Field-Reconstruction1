name: kokuno-agent5-segmented-frontier-routing

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_segmented_leading_assembly.py'
      - 'src/openai_ns_reconstruction/kokuno_segmented_leading_independent.py'
      - 'src/openai_ns_reconstruction/kokuno_segmented_frontier_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_segmented_leading_assembly.py'
      - 'tests/test_constrained_kokuno_segmented_leading_independent.py'
      - 'tests/test_constrained_kokuno_segmented_frontier_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-segmented-frontier-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-segmented-frontier-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-1/4/5 segmented-frontier tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_segmented_leading_assembly.py
          tests/test_constrained_kokuno_segmented_leading_independent.py
          tests/test_constrained_kokuno_segmented_frontier_routing_checkpoint.py
      - name: Generate segmented-frontier routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_segmented_frontier_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/segmented_frontier_routing_checkpoint_v16
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/segmented_frontier_routing_checkpoint_v16/segmented_frontier_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-segmented-frontier-routing-checkpoint-v16
          path: artifacts/kokuno_agent5/segmented_frontier_routing_checkpoint_v16
