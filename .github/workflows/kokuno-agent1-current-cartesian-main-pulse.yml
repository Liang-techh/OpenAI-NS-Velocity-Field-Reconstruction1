name: kokuno-agent1-current-cartesian-main-pulse

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_main_pulse.py"
      - "tests/test_kokuno_pa16_current_cartesian_main_pulse.py"
      - ".github/workflows/kokuno-agent1-current-cartesian-main-pulse.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Authenticate exact #1094 parent
        shell: bash
        run: |
          git merge-base --is-ancestor dc33914d3dd60c1dc4c8dfaab0760ef071385d54 HEAD
          test "$(git show -s --format=%H dc33914d3dd60c1dc4c8dfaab0760ef071385d54)" = "dc33914d3dd60c1dc4c8dfaab0760ef071385d54"
          echo "authenticated #1094 parent dc33914d3dd60c1dc4c8dfaab0760ef071385d54"

      - name: Enforce minimal three-file increment
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only dc33914d3dd60c1dc4c8dfaab0760ef071385d54...HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent1-current-cartesian-main-pulse.yml"
            "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_main_pulse.py"
            "tests/test_kokuno_pa16_current_cartesian_main_pulse.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_main_pulse.py
          python -m py_compile tests/test_kokuno_pa16_current_cartesian_main_pulse.py

      - name: Run current Cartesian main-pulse regressions
        run: python -m pytest -q tests/test_kokuno_pa16_current_cartesian_main_pulse.py

      - name: Emit deterministic scoped receipt
        run: |
          mkdir -p artifacts/kokuno_agent1_current_cartesian_main_pulse
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_main_pulse import (
              KokunoPA16CurrentCartesianMainPulse,
          )

          root = Path("artifacts/kokuno_agent1_current_cartesian_main_pulse")
          candidate = KokunoPA16CurrentCartesianMainPulse()
          receipt = candidate.receipt()
          config = candidate.configuration()
          truth = receipt["truth_boundary"]
          assert truth["current_cartesian_main_pulse_prefix_materialized"] is True
          assert truth["current_pulse_M_and_M_eta_history_integrated"] is True
          assert truth["repository_autonomous_principal_amplitude_consumed"] is True
          assert truth["source_exact_amplitude_root_materialized"] is False
          assert truth["source_pulse_end_MJ_corrections_materialized"] is False
          assert truth["full_source_xi_11_current_cartesian_materialized"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False
          assert 8.0 < receipt["domain"]["xi_materializable_max"] < 11.0

          mutated = copy.deepcopy(config)
          mutated["bound_scope"]["amplitude_role"] = "source_exact"
          try:
              KokunoPA16CurrentCartesianMainPulse.from_configuration(mutated)
          except ValueError:
              pass
          else:
              raise SystemExit("source-exact amplitude mutation did not fail closed")

          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload scoped receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-current-cartesian-main-pulse
          path: artifacts/kokuno_agent1_current_cartesian_main_pulse/
