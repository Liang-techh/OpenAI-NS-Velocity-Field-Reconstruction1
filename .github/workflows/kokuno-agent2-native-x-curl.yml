name: kokuno-agent2-native-x-curl

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_similarity_coordinates.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_native_x_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_native_x_curl_screen.py'
      - 'src/openai_ns_reconstruction/kokuno_reference_continuation.py'
      - 'tests/test_constrained_kokuno_native_x_curl.py'
      - '.github/workflows/kokuno-agent2-native-x-curl.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_similarity_coordinates.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_native_x_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_native_x_curl_screen.py'
      - 'src/openai_ns_reconstruction/kokuno_reference_continuation.py'
      - 'tests/test_constrained_kokuno_native_x_curl.py'
      - '.github/workflows/kokuno-agent2-native-x-curl.yml'

permissions:
  contents: read

jobs:
  native-x-complete-curl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused structural tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_reference_continuation.py
          tests/test_constrained_kokuno_complete_curl.py
          tests/test_constrained_kokuno_native_x_curl.py
      - name: Generate frozen post-core diagnostic
        run: >-
          python -m openai_ns_reconstruction.kokuno_native_x_curl_screen
          --count 4
          --output artifacts/kokuno_agent2/native_x_curl_v6/report.json
      - name: Show report
        run: cat artifacts/kokuno_agent2/native_x_curl_v6/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-native-x-curl-v6
          path: artifacts/kokuno_agent2/native_x_curl_v6
