name: kokuno-agent4-reference-stress-xi110-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a4_reference_stress_xi110_independent_audit.py"
      - "tests/test_constrained_kokuno_a4_reference_stress_xi110_independent_audit.py"
      - ".github/workflows/kokuno-agent4-reference-stress-xi110-independent-audit.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert stacked A1 ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 15791891fbbcfdaa614930791a843983afde2b4d HEAD

      - name: Verify exact Agent-1 source blob
        shell: bash
        run: |
          test "$(git rev-parse 15791891fbbcfdaa614930791a843983afde2b4d:src/openai_ns_reconstruction/kokuno_pa10_autonomous_reference_stress_xi110.py)" = "d534da9efed25df9d281bd0c78fc18ec9b706c09"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a4_reference_stress_xi110_independent_audit.py
          python -m py_compile tests/test_constrained_kokuno_a4_reference_stress_xi110_independent_audit.py

      - name: Materialize real save-reload independent receipt
        id: real_audit
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/kokuno_a4
          python -m openai_ns_reconstruction.kokuno_a4_reference_stress_xi110_independent_audit \
            --output artifacts/kokuno_a4/reference_stress_xi110_independent_receipt.json

      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-reference-stress-xi110-independent-receipt
          path: artifacts/kokuno_a4/reference_stress_xi110_independent_receipt.json
          if-no-files-found: warn

      - name: Run parent and Agent-4 focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_autonomous_reference_stress_xi110.py \
            tests/test_constrained_kokuno_a4_reference_stress_xi110_independent_audit.py

      - name: Enforce real audit receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/kokuno_a4/reference_stress_xi110_independent_receipt.json")
          if not path.exists():
              raise SystemExit("real independent receipt was not materialized")
          receipt = json.loads(path.read_text())
          if receipt.get("passed") is not True:
              raise SystemExit(
                  "frozen A4 Xi110 independent audit failed:\n"
                  + json.dumps(
                      {
                          "gates": receipt.get("gates"),
                          "resolution_metrics": receipt.get("resolution_metrics"),
                          "resolution_stability": receipt.get("resolution_stability"),
                          "worst_witness": receipt.get("worst_witness"),
                          "mutation_checks": receipt.get("mutation_checks"),
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )
          if receipt["truth_boundary"].get("pde_validated") is not False:
              raise SystemExit("scoped audit illegally promoted pde_validated")
          print(json.dumps(
              {
                  "passed": receipt["passed"],
                  "artifact_semantic_sha256": receipt["artifact_semantic_sha256"],
                  "receipt_sha256": receipt["receipt_sha256"],
                  "gates": receipt["gates"],
                  "worst_witness": receipt["worst_witness"],
              },
              indent=2,
              sort_keys=True,
          ))
          PY
