name: kokuno-agent2-corrected-oscillation-source-ledger

on:
  push:
    branches:
      - codex/kokuno-a2-corrected-oscillation-source-ledger-088
  pull_request:
    branches:
      - codex/kokuno-a2-rf40-power-law-composite-087
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact A2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a2
          fetch-depth: 0

      - name: Verify exact parent ancestry and strict three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a2
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor e36d9da4b7f037e998f5b1658f8c0ea291a76b80 HEAD
          test "$(git rev-list --count e36d9da4b7f037e998f5b1658f8c0ea291a76b80..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only e36d9da4b7f037e998f5b1658f8c0ea291a76b80..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent2-corrected-oscillation-source-ledger.yml \
            src/openai_ns_reconstruction/kokuno_corrected_oscillation_source_ledger.py \
            tests/test_constrained_kokuno_corrected_oscillation_source_ledger.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git hash-object src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py)" = \
            "4f1dc0566c041b9de20f18b4ae9c49d9fd93c58d"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install A2 test dependencies
        shell: bash
        run: python -m pip install -e './a2[dev]'

      - name: Compile and run focused source-ledger tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a2/src/openai_ns_reconstruction/kokuno_corrected_oscillation_source_ledger.py \
            a2/tests/test_constrained_kokuno_corrected_oscillation_source_ledger.py
          PYTHONPATH="$PWD/a2/src" python -m pytest -q \
            a2/tests/test_constrained_kokuno_corrected_oscillation_source_ledger.py

      - name: Check out exact corrected Kokuno public source
        uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: source
          fetch-depth: 1

      - name: Authenticate corrected reader and source bundle bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "143f6773feb424ad9ed3a8d116653200f20346b7"
          test "$(git -C source hash-object navier-stokes/navier_stokes_workbench.tex)" = \
            "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          test "$(git -C source hash-object navier-stokes/navier_stokes_checks.json)" = \
            "03c5063968de0bbc3b9a34462494859df677fff7"
          test "$(git -C source hash-object navier-stokes/navier_stokes_source_bundle.zip)" = \
            "b3cf96edff06e39e066a4a6b9522362975d3fbb1"
          test "$(sha256sum source/navier-stokes/navier_stokes_source_bundle.zip | awk '{print $1}')" = \
            "43b128e24f395327b2dd0f9874ca1ff120a52d625ab454f7df97d51f10c328c5"

      - name: Materialize exact source-ledger receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          PYTHONPATH="$PWD/a2/src" python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import zipfile

          from openai_ns_reconstruction.kokuno_corrected_oscillation_source_ledger import (
              OSCILLATION_COMPONENT_SHA256,
              SOURCE_BUNDLE_SHA256,
              SOURCE_CHECKS_RECORDED_JSON_SHA256,
              SOURCE_PDF_SHA256,
              SOURCE_READER_PAGES,
              default_kokuno_corrected_oscillation_source_ledger,
          )

          bundle_path = Path("source/navier-stokes/navier_stokes_source_bundle.zip")
          assert hashlib.sha256(bundle_path.read_bytes()).hexdigest() == SOURCE_BUNDLE_SHA256

          verified = {}
          with zipfile.ZipFile(bundle_path) as archive:
              names = archive.namelist()
              for relative, expected in OSCILLATION_COMPONENT_SHA256.items():
                  matches = [name for name in names if name.endswith(relative)]
                  assert len(matches) == 1, (relative, matches)
                  actual = hashlib.sha256(archive.read(matches[0])).hexdigest()
                  assert actual == expected, (relative, actual, expected)
                  verified[relative] = actual

          checks = json.loads(
              Path("source/navier-stokes/navier_stokes_checks.json").read_text(encoding="utf-8")
          )
          # These values are recorded by the corrected source's own checks manifest.
          assert checks.get("reader_pages") == SOURCE_READER_PAGES
          assert checks.get("pdf_sha256") == SOURCE_PDF_SHA256
          assert checks.get("json_sha256") == SOURCE_CHECKS_RECORDED_JSON_SHA256
          assert checks.get("zip_sha256") == SOURCE_BUNDLE_SHA256

          ledger = default_kokuno_corrected_oscillation_source_ledger()
          ledger_path = Path("receipts/kokuno_a2_corrected_oscillation_source_ledger.json")
          ledger.save_manifest(ledger_path)
          receipt = {
              "schema": "kokuno-agent2-corrected-oscillation-source-ledger-receipt-v1",
              "ledger_semantic_sha256": ledger.semantic_sha256,
              "source_bundle_sha256": SOURCE_BUNDLE_SHA256,
              "source_bundle_components_verified": verified,
              "source_bundle_component_count": len(verified),
              "source_formula_status": "confirmed_in_corrected_208p_workbench_and_source_bundle",
              "current_runtime_mapping_status": "not_verified",
              "paper_exact": False,
              "pde_validated": False,
          }
          Path("receipts/kokuno_a2_corrected_oscillation_source_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload ledger and receipt before gate enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a2-corrected-oscillation-source-ledger
          path: |
            receipts/kokuno_a2_corrected_oscillation_source_ledger.json
            receipts/kokuno_a2_corrected_oscillation_source_receipt.json
          if-no-files-found: error

      - name: Enforce source-to-runtime truth boundary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/a2/src" python - <<'PY'
          import json
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_corrected_oscillation_source_ledger import (
              KokunoCorrectedOscillationSourceLedger,
              OSCILLATION_COMPONENT_SHA256,
          )

          ledger = KokunoCorrectedOscillationSourceLedger.load_manifest(
              "receipts/kokuno_a2_corrected_oscillation_source_ledger.json"
          )
          receipt = json.loads(
              Path("receipts/kokuno_a2_corrected_oscillation_source_receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          assert receipt["ledger_semantic_sha256"] == ledger.semantic_sha256
          assert receipt["source_bundle_components_verified"] == OSCILLATION_COMPONENT_SHA256
          assert receipt["source_bundle_component_count"] == len(OSCILLATION_COMPONENT_SHA256)
          assert receipt["current_runtime_mapping_status"] == "not_verified"
          assert receipt["paper_exact"] is False
          assert receipt["pde_validated"] is False
          truth = ledger.truth_boundary_payload()
          assert truth["current_runtime_phase_source_exact"] is False
          assert truth["current_runtime_support_source_exact"] is False
          assert truth["current_runtime_complete_curl_source_equivalence_verified"] is False
          assert truth["source_to_runtime_parameter_map_complete"] is False
          assert truth["matched_pressure_materialized"] is False
          assert truth["restricted_forcing_materialized"] is False
          assert truth["complete_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          PY
