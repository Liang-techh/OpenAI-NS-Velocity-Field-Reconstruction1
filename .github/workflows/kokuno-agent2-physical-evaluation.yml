name: kokuno-agent2-physical-evaluation

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_physical_evaluation.py'
      - 'tests/test_constrained_kokuno_physical_evaluation.py'
      - '.github/workflows/kokuno-agent2-physical-evaluation.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_physical_evaluation.py'
      - 'tests/test_constrained_kokuno_physical_evaluation.py'
      - '.github/workflows/kokuno-agent2-physical-evaluation.yml'

permissions:
  contents: read

jobs:
  physical-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused physical-evaluation tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_physical_evaluation.py
