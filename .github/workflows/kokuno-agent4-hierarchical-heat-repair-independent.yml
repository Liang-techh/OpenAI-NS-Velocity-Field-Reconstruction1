name: kokuno-agent4-hierarchical-heat-repair-independent

on:
  push:
    branches:
      - codex/kokuno-a4-hierarchical-heat-repair-independent-014
  pull_request:
    branches:
      - codex/kokuno-a4-hierarchical-heat-repair-independent-014
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a4-hierarchical-heat-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused independent tests
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_hierarchical_heat_repair.py \
            tests/test_constrained_kokuno_hierarchical_heat_repair_independent.py
      - name: Generate independent rejection report
        run: |
          python -m openai_ns_reconstruction.kokuno_hierarchical_heat_repair_independent \
            --output artifacts/kokuno_agent4/hierarchical_heat_repair_independent.json \
            || test -s artifacts/kokuno_agent4/hierarchical_heat_repair_independent.json
          cat artifacts/kokuno_agent4/hierarchical_heat_repair_independent.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-hierarchical-heat-repair-independent
          path: artifacts/kokuno_agent4/hierarchical_heat_repair_independent.json
