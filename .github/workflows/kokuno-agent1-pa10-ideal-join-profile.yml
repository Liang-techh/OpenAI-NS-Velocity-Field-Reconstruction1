name: kokuno-agent1-pa10-ideal-join-profile

on:
  push:
    branches:
      - codex/kokuno-a1-ideal-join-target-075
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_ideal_join_profile_contract.py"
      - "tests/test_kokuno_pa10_ideal_join_profile_contract.py"
      - ".github/workflows/kokuno-agent1-pa10-ideal-join-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-ideal-join-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ideal-join-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile executable ideal-join target
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_ideal_join_profile_contract.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_ideal_join_profile_contract.py
      - name: Emit source-scale and truth-boundary receipt
        run: |
          python - <<'PY'
          import json
          import math
          from openai_ns_reconstruction.kokuno_pa10_ideal_join_profile_contract import (
              KokunoPA10IdealJoinProfileContract,
          )

          candidate = KokunoPA10IdealJoinProfileContract()
          report = candidate.report()
          gap = report['join_gap']
          truth = report['truth_boundary']
          assert candidate.C == 1000.0
          assert candidate.P_star == 1.0
          assert abs(candidate.X_h / candidate.X_R - math.exp(-5.0)) < 2e-17
          assert gap['source_join_is_outside_current_inner_domain'] is True
          assert truth['public_ideal_join_target_executable'] is True
          assert truth['source_P_star_numerically_identified'] is False
          assert truth['five_bump_nonlinear_repair_materialized'] is False
          assert truth['source_join_neighborhood_width_known'] is False
          assert truth['outer_global_leading_velocity_materialized'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False
          print(json.dumps({
              'semantic_sha256': report['semantic_sha256'],
              'X_R': candidate.X_R,
              'X_h': candidate.X_h,
              'join_gap': gap,
              'probe_at_X_h_eta_0p5': report['probe_at_X_h_eta_0p5'],
          }, indent=2, sort_keys=True))
          PY
