name: kokuno-agent2-laplacian-vector-identity

on:
  push:
    branches:
      - codex/kokuno-a2-laplacian-vector-identity-048
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_laplacian_identity.py"
      - "tests/test_constrained_kokuno_public_oscillatory_laplacian_identity.py"
      - ".github/workflows/kokuno-agent2-laplacian-vector-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent2-laplacian-vector-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laplacian-vector-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_public_oscillatory_laplacian_identity.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_oscillatory_laplacian_identity.py
          tests/test_constrained_kokuno_public_oscillatory_spatial_laplacian.py
          tests/test_constrained_kokuno_public_oscillatory_vorticity_time_commutation.py
      - name: Generate immutable Laplacian identity receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_public_oscillatory_laplacian_identity
          --output artifacts/kokuno_agent2_laplacian_vector_identity_v1.json
      - name: Check provenance, frozen guards and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent2_laplacian_vector_identity_v1.json')
          r = json.loads(p.read_text())
          assert r['parent_agent2_pr'] == 708
          assert r['parent_agent2_head'] == '9f8bae37c4d3b2559bee6db050655702e4c058e9'
          assert r['velocity_pr'] == 561
          assert r['first_derivative_steps'] == [0.018, 0.009, 0.0045]
          assert r['comparison_laplacian_step'] == 0.0045
          assert r['failed_guards'] == []
          assert r['self_diagnostic_passed'] is True
          t = r['truth_boundary']
          assert t['velocity_candidate_changed'] is False
          assert t['oscillatory_coefficients_retuned'] is False
          assert t['source_formula_changed'] is False
          assert t['laplacian_vector_identity_self_diagnostic_only'] is True
          assert t['viscous_term_formula_or_pressure_fit_changed'] is False
          assert t['independent_agent4_validation_replaced'] is False
          assert t['independent_agent4_vector_potential_audit_required'] is True
          assert t['agent3_momentum_defect_or_correction_duplicated'] is False
          assert t['heldout_ns_momentum_residual_assessed'] is False
          assert t['formal_full_domain_pde_gate_assessed'] is False
          assert t['pde_validated'] is False
          assert t['paper_exact'] is False
          print('identity_sha256=', r['identity_sha256'])
          print('nested_fd4_refinement=', r['nested_fd4_ladder']['successive_difference_refinement_ratio'])
          print('finest_identity_vs_fd6_relative_rms=', r['finest_identity_vs_fd6_relative_rms'])
          print('finest_identity_vs_fd6_relative_sampled_max=', r['finest_identity_vs_fd6_relative_sampled_max'])
          print('finest_grad_div_relative_rms=', r['finest_grad_div_relative_rms'])
          print('manufactured_relative_max_error=', r['manufactured_polynomial']['relative_max_error'])
          print('support_exterior_absolute_max=', r['support_exterior_absolute_max'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-laplacian-vector-identity-v1
          path: artifacts/kokuno_agent2_laplacian_vector_identity_v1.json
          if-no-files-found: error
