name: agent7-st051b-frozen-redistribution-transfer
on:
  pull_request:
    paths:
      - 'experiments/root_st051/agent7_st051b_frozen_redistribution_transfer.py'
      - 'experiments/root_st051/test_agent7_st051b_frozen_redistribution_transfer.py'
      - '.github/workflows/agent7-st051b-frozen-redistribution-transfer.yml'
permissions:
  contents: read
jobs:
  frozen-transfer-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Focused contract tests
        run: python -m pytest -q -W error experiments/root_st051/test_agent7_st051b_frozen_redistribution_transfer.py
      - name: Execute preregistered frozen-profile transfer
        run: |
          mkdir -p outputs/agent7-st051b-frozen-redistribution-transfer
          python experiments/root_st051/agent7_st051b_frozen_redistribution_transfer.py \
            --out outputs/agent7-st051b-frozen-redistribution-transfer/report.json
      - name: Verify truth boundary and frozen identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/agent7-st051b-frozen-redistribution-transfer/report.json')
          r=json.loads(p.read_text())
          assert r['prereg_issue']==468
          assert r['parent_id']=='ST051-B'
          assert r['parent_head']=='4b784f1b8457af2ead49295631d834d4e882000b'
          assert r['source_transfer_pr']==458
          assert r['source_parent_id']=='ST050R-C'
          assert abs(r['frozen_transform']['alpha']-2.520520814687742)<1e-15
          assert r['frozen_transform']['gain']==0.025
          assert r['parameter_scan_performed'] is False
          assert r['diagnostic_added_velocity_degrees']==1
          assert r['canonical_velocity_changed'] is False
          assert r['candidate_artifact_changed'] is False
          assert r['pressure_or_force_changed'] is False
          assert r['held_out_pde_residual_evaluated'] is False
          assert r['material_paths_integrated'] is False
          assert r['public_image_used'] is False
          assert r['visualization_ready'] is False
          assert r['visual_correspondence_verified'] is False
          assert r['pde_validated'] is False
          assert r['source_correspondence_verified'] is False
          print('clean_frozen_profile_transfer=',r['row']['clean_frozen_profile_transfer'])
          print('normalization=',r['row']['normalization'])
          print('alpha_that_would_rebalance_parent=',r['balance_on_st051b']['alpha_that_would_rebalance_parent'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-st051b-frozen-redistribution-transfer
          path: outputs/agent7-st051b-frozen-redistribution-transfer/
          if-no-files-found: error
