name: kokuno-agent1-postswirl-release1

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postswirl_release1.py"
      - "tests/test_kokuno_pa16_current_cartesian_postswirl_release1.py"
      - ".github/workflows/kokuno-agent1-postswirl-release1.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert exact A1 ancestry and minimal three-file scope
        shell: bash
        run: |
          git merge-base --is-ancestor 8c5c5b6d55a68de8285ed1dd0ebb55128f3078a4 HEAD
          mapfile -t changed < <(git diff --name-only 8c5c5b6d55a68de8285ed1dd0ebb55128f3078a4...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent1-postswirl-release1.yml"
            "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postswirl_release1.py"
            "tests/test_kokuno_pa16_current_cartesian_postswirl_release1.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Verify pinned corrected-source blob
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://raw.githubusercontent.com/KokunoYumeto/yang-mills-interacting-workbench/143f6773feb424ad9ed3a8d116653200f20346b7/navier-stokes/navier_stokes_workbench.tex"
          data = urllib.request.urlopen(url, timeout=30).read()
          digest = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          expected = "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          if digest != expected:
              raise SystemExit(f"corrected source blob drifted: {digest} != {expected}")
          print("corrected 2026-09-09 source blob pinned")
          PY

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postswirl_release1.py
          python -m py_compile tests/test_kokuno_pa16_current_cartesian_postswirl_release1.py

      - name: Run exact parent and new focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py \
            tests/test_kokuno_pa16_current_cartesian_postswirl_release1.py

      - name: Emit deterministic first-release receipt
        run: |
          mkdir -p artifacts/kokuno_agent1_postswirl_release1
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_postswirl_release1 import (
              KokunoPA16CurrentCartesianPostSwirlRelease1,
          )

          root = Path("artifacts/kokuno_agent1_postswirl_release1")
          candidate = KokunoPA16CurrentCartesianPostSwirlRelease1()
          receipt = candidate.release_report()
          config = candidate.configuration()
          truth = receipt["truth_boundary"]

          assert receipt["parent_child_decimal_seam_exact"] is True
          assert abs(receipt["sigma_integral_end"] - 0.5) <= 2e-14
          assert abs(receipt["ell_start"] + candidate.lambda_value) <= 2e-15
          assert abs(receipt["ell_end"] + 1.0) <= 2e-15
          assert truth["post_relative_swirl_release1_materialized"] is True
          assert truth["source_l_minus1_hold_materialized"] is False
          assert truth["source_l_minus1_to_minus_h_transition_materialized"] is False
          assert truth["source_terminal_multiplier_materialized"] is False
          assert truth["source_exterior_heat_replacement_materialized"] is False
          assert truth["outer_global_leading_velocity_materialized"] is False
          assert truth["unified_global_cartesian_velocity_export_ready"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False
          assert truth["openai_field_identified"] is False

          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload first-release receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-postswirl-release1
          path: artifacts/kokuno_agent1_postswirl_release1/
