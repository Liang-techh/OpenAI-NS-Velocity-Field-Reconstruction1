name: agent9-st052-material-path

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_st052_material_path.py'
      - 'tests/test_constrained_st052_material_path.py'
      - 'docs/external_methods/CR-A9-058-st052-material-path.md'
      - '.github/workflows/agent9-st052-material-path.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout Agent-9 branch
        uses: actions/checkout@v4

      - name: Checkout exact frozen ST052-M source
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: b3b8bfdbe1077f9ec967d158602951997d81e17d
          path: external/st052
          persist-credentials: false

      - name: Checkout exact frozen Agent-9 path engine
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 6699a698c9fb2f0a0986e7aefc5fe0ee431cd5ad
          path: external/agent9_path
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'

      - name: Verify exact source identities
        run: |
          test "$(git -C external/st052 rev-parse HEAD)" = "b3b8bfdbe1077f9ec967d158602951997d81e17d"
          test "$(git -C external/agent9_path rev-parse HEAD)" = "6699a698c9fb2f0a0986e7aefc5fe0ee431cd5ad"

      - name: Warning-clean compile and focused regressions
        run: |
          python -W error -m py_compile src/openai_ns_reconstruction/constrained_st052_material_path.py
          python -W error -m pytest -q tests/test_constrained_st052_material_path.py

      - name: Execute exact frozen material-path replay
        run: |
          set -o pipefail
          mkdir -p outputs/agent9-st052-material-path
          python -m openai_ns_reconstruction.constrained_st052_material_path \
            --st052-root external/st052 \
            --agent9-root external/agent9_path \
            --out outputs/agent9-st052-material-path/report.json \
            | tee outputs/agent9-st052-material-path/run.log

      - name: Verify fail-closed receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent9-st052-material-path/report.json').read_text())
          assert r['task_id']=='CR-A9-058'
          assert r['base_main_sha']=='f0193d66c9d92948b4820ebcb70263673995b324'
          assert r['lineage']['candidate']=='ST052-M'
          assert r['lineage']['candidate_head']=='b3b8bfdbe1077f9ec967d158602951997d81e17d'
          assert r['lineage']['parent_candidate']=='ST051-B'
          assert r['lineage']['agent9_path_engine_head']=='6699a698c9fb2f0a0986e7aefc5fe0ee431cd5ad'
          c=r['frozen_material_path_contract']
          assert c['path_count']==48 and c['paired_material_line_count']==24
          for key in ('parent_material_paths','st052_material_paths'):
              assert r[key]['path_count']==48
              assert r[key]['paired_material_line_count']==24
          truth=r['truth_boundary']
          for key in ('canonical_velocity_changed','production_candidate_selected',
                      'held_out_pde_residual_recomputed_in_this_increment','parent_pde_receipt_transferred',
                      'st052_existing_pde_receipt_promoted_by_this_increment','visualization_ready',
                      'visual_correspondence_verified','pde_validated','source_correspondence_verified',
                      'paper_exact','openai_field_identified','blowup_proved'):
              assert truth[key] is False
          assert truth['visual_acceptance_threshold_defined'] is False
          assert truth['comparison_is_descriptive_not_acceptance'] is True
          assert r['st052_existing_scientific_context']['pde_validated'] is False
          print('report_sha256=',r['report_sha256'])
          print('st052_vs_parent=',r['st052_vs_parent'])
          print('by_radius=',r['st052_vs_parent_by_seed_radius'])
          PY

      - name: Publish exact-head numerical receipt
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/agent9-receipt.md
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent9-st052-material-path/report.json').read_text())
          p=r['parent_material_paths']; c=r['st052_material_paths']; d=r['st052_vs_parent']
          print('### CR-A9-058 exact-head numerical receipt')
          print()
          print(f"report SHA-256: `{r['report_sha256']}`")
          print()
          print('| metric | ST051-B parent | ST052-M | relative change |')
          print('|---|---:|---:|---:|')
          print(f"| mean absolute turns | {p['mean_absolute_turns']:.10g} | {c['mean_absolute_turns']:.10g} | {100*d['mean_absolute_turns_relative']:+.4f}% |")
          print(f"| maximum absolute turns | {p['maximum_absolute_turns']:.10g} | {c['maximum_absolute_turns']:.10g} | {100*d['maximum_absolute_turns_relative']:+.4f}% |")
          print(f"| contraction magnitude | {abs(p['mean_radius_change']):.10g} | {abs(c['mean_radius_change']):.10g} | {100*d['radial_contraction_magnitude_relative']:+.4f}% |")
          print(f"| mean axial-pair separation change | {p['mean_pair_axial_separation_change']:.10g} | {c['mean_pair_axial_separation_change']:.10g} | {100*d['mean_pair_axial_separation_change_relative']:+.4f}% |")
          print(f"| inward paths | {p['inward_path_count']}/48 | {c['inward_path_count']}/48 | — |")
          print(f"| grow/shrink pairs | {p['pair_axial_separation_growth_count']}/{p['pair_axial_separation_shrink_count']} | {c['pair_axial_separation_growth_count']}/{c['pair_axial_separation_shrink_count']} | — |")
          print()
          print('By seed radius (ST052-M vs ST051-B):')
          for radius,row in r['st052_vs_parent_by_seed_radius'].items():
              print(f"- r={radius}: {100*row['mean_absolute_turns_relative']:+.4f}% winding; {100*row['radial_contraction_magnitude_relative']:+.4f}% contraction magnitude")
          print()
          print('This is descriptive candidate-side kinematics only. The existing ST052 PDE receipt remains failed at the unchanged 1e-3 momentum gate and is not rerun or promoted here.')
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/agent9-receipt.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST052-M-frozen-material-path
          path: outputs/agent9-st052-material-path/
          if-no-files-found: error
          retention-days: 30
