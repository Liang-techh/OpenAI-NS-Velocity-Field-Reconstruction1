name: st047-source-ingest
on:
  push:
    branches: [research/st047-preconditioned-coupling]
    paths: [.github/workflows/st047-ingest.yml]
permissions:
  contents: write
jobs:
  restore-reviewed-source:
    if: github.repository == 'Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/st047-preconditioned-coupling
      - name: Restore exact reviewed source on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,urllib.request
          from pathlib import Path
          repo='Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
          ids=['f262601efe3a7be915484233d27905a1f6eecd36','90d22bce20cae9cb11189dc248fae1dcea3f4d47','07a10b5b5e9be44de0d3f5f83102ee7f2ae0e8f7','e2009d907fd6b04557039e99b1a9b7e06dbd52d3','e76d773fa8741a68d33b5b09ee8d9c9141593b9e','0aa264bbc43eaae6571829969c07e85ebfb312db']
          def gh(b):return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          parts=[]
          for sha in ids:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ST047-source-publication'})
              with urllib.request.urlopen(req,timeout=60) as response: data=json.load(response)
              raw=base64.b64decode(data['content']);assert gh(raw)==sha
              parts.append(raw.decode('ascii'))
          # Three transport-only transcription insertions are reversed, and
          # ORIGINAL part hashes plus the entire payload hash are then verified.
          parts[0]=parts[0].replace('PyQeyzijzijLJRE','PyQeyzijLJRE')
          parts[1]=parts[1].replace('QIyYeJeReRAG','QIyYeJeRAG')
          parts[2]=parts[2].replace('BLIP4h/9','BLIP4/9')
          assert gh(parts[0].encode())=='fffd37ec045c7d50396579d93b41170ceb32de24'
          assert gh(parts[1].encode())=='9c197708c1469f911fcf1cba8703e1f9b1b0a096'
          assert gh(parts[2].encode())=='8f000e62eadbf5aa963d6e17310c06ca3bb1ecba'
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='43d1aa8d300d99ce472f502e21c19054fd315135f5eaa5e5535fad6cea929413'
          entries=json.loads(gzip.decompress(packed));prefix='experiments/root_st047/'
          names={'README.md','continuation.py','dense_check.py','recipes.json','replay_st047.py','results.json','structure_and_particles.py','test_continuation.py'}
          assert set(entries)=={prefix+n for n in names}
          root=Path.cwd().resolve()
          for name,text in entries.items():
              assert isinstance(text,str)
              p=(root/name).resolve();assert p.is_relative_to(root) and '..' not in Path(name).parts
              payload=text.encode('utf-8')
              if p.exists():assert p.read_bytes()==payload,'Refusing different existing source'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(payload)
              print(name,hashlib.sha256(payload).hexdigest())
          print('Eight original source/recipe/results files restored. Scientific acceptance NOT implied.')
          PY
      - name: Commit only new files on isolated research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/root_st047
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish ST047 coupled continuation, particle diagnostics and frozen recipes'
          git push origin HEAD:research/st047-preconditioned-coupling
