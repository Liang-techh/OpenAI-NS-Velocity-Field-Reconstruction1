name: kokuno-agent4-pa10-source-r1-zeta-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-r1-zeta-independent-audit-059
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_r1_zeta_independent_audit.py"
      - "tests/test_constrained_kokuno_pa10_source_r1_zeta_independent_audit.py"
      - ".github/workflows/kokuno-agent4-pa10-source-r1-zeta-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-source-r1-zeta-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-r1-zeta-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_zeta_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_zeta_independent_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_r1_zeta_ordinary_slot.py \
            tests/test_constrained_kokuno_pa10_source_r1_zeta_independent_audit.py
      - name: Generate exact-head Agent-4 receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_r1_zeta_independent_audit \
            --output artifacts/kokuno_agent4/pa10_source_r1_zeta_independent_audit_v1/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_source_r1_zeta_independent_audit_v1/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)

          assert payload['agent1_pr'] == 707
          assert payload['agent1_exact_head'] == '3068062f92dcf9c9eb1276a014bed1f36bb8aa86'
          assert payload['failed_guards'] == []
          assert payload['source_R1_zeta_ordinary_slot_independent_preflight_passed'] is True

          ratios = payload['public_over_independent_ratios']
          assert min(ratios['fixed'].values()) >= 1.0
          assert min(ratios['R1_zeta_slot'].values()) >= 1.0

          real = payload['fresh_real_offgrid_replay']
          assert real['finite'] is True
          assert real['relative_max_mismatch'] <= 1e-12
          assert real['zeta_rms'] > 1e-8
          assert real['sigma_pm_0p1_percent_max_relative_response'] > 1e-8

          complex_stress = payload['fresh_complex_cauchy_stress']
          assert complex_stress['finite'] is True
          assert complex_stress['dominated'] is True
          assert 0.0 < complex_stress['stress_ratio'] <= 1.0

          neg = payload['negative_controls']
          assert all(neg['fixed_0p999_detected'].values())
          assert all(neg['slot_0p99_detected'].values())
          assert neg['real_value_sign_flip_detected'] is True

          truth = payload['truth_boundary']
          assert truth['source_R1_zeta_ordinary_slot_independently_audited'] is True
          assert truth['source_R1_other_ordinary_slots_independently_audited'] is False
          assert truth['full_R1_independent_agent4_admission'] is False
          assert truth['full_R2_independent_agent4_admission'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['pde_validated'] is False

          gates = payload['immutable_project_gates']
          assert gates['normalized_momentum_max'] == 1e-3
          assert gates['normalized_momentum_L2'] == 1e-3
          assert gates['divergence_max'] == 1e-5
          assert gates['divergence_L2'] == 1e-5

          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('fixed_ratios=', ratios['fixed'])
          print('slot_ratios=', ratios['R1_zeta_slot'])
          print('real_offgrid=', real)
          print('complex_stress=', complex_stress)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-source-r1-zeta-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_source_r1_zeta_independent_audit_v1/report.json
          if-no-files-found: error
