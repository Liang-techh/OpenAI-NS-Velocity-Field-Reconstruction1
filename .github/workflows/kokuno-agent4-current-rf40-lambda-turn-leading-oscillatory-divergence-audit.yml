name: kokuno-agent4-current-rf40-lambda-turn-leading-oscillatory-divergence-audit

on:
  push:
    branches:
      - codex/kokuno-a4-rf40-lambda-turn-composite-divergence-audit-101
  pull_request:
    branches:
      - codex/kokuno-a2-rf40-lambda-turn-composite-086
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact A4 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a4
          fetch-depth: 0

      - name: Verify exact A2 base ancestry and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a4
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor e9697cdfe2249e1b8bc2f9241bd16d456c60418f HEAD
          test "$(git rev-list --count e9697cdfe2249e1b8bc2f9241bd16d456c60418f..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only e9697cdfe2249e1b8bc2f9241bd16d456c60418f..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent4-current-rf40-lambda-turn-leading-oscillatory-divergence-audit.yml \
            src/openai_ns_reconstruction/kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit.py \
            tests/test_constrained_kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install A4 dependencies
        shell: bash
        run: python -m pip install -e './a4[dev]'

      - name: Compile and run implementation-distinct unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a4/src/openai_ns_reconstruction/kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit.py \
            a4/tests/test_constrained_kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit.py
          PYTHONPATH="$PWD/a4/src" python -m pytest -q \
            a4/tests/test_constrained_kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit.py

      - name: Check out exact Agent-1 RF40 lambda-turn sibling
        uses: actions/checkout@v4
        with:
          ref: 43b295444b1e9558222d757cb551e04385eddcb5
          path: a1
          fetch-depth: 1

      - name: Authenticate A2 #1004 and A1 #998 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a1 rev-parse HEAD)" = "43b295444b1e9558222d757cb551e04385eddcb5"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_lambda_turn.py)" = \
            "07743c30978360e305a8863e05e7ed322d818b32"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_lambda_turn_leading_oscillatory_identity.py)" = \
            "def2998256b2339115c2400c75b6db6ab58dfe95"
          test "$(git -C a4 hash-object .github/workflows/kokuno-agent2-current-rf40-lambda-turn-leading-oscillatory.yml)" = \
            "3dcf132cd9fe8b9101a7e5ca6058c3b44b4a8a34"

      - name: Materialize real independent lambda-turn divergence receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          PYTHONPATH="$PWD/a1/src" python - <<'PY'
          from pathlib import Path
          import json
          import openai_ns_reconstruction

          # Keep A1's exact runtime available while preferring A4/A2 modules for the
          # composite and independent validator.
          a4_pkg = str(Path("a4/src/openai_ns_reconstruction").resolve())
          openai_ns_reconstruction.__path__.insert(0, a4_pkg)

          import openai_ns_reconstruction.kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit as audit
          import openai_ns_reconstruction.kokuno_current_rf40_lambda_turn_leading_oscillatory_identity as upstream

          field = upstream.default_field()
          candidate_path = Path("receipts/kokuno_a2_rf40_lambda_turn_candidate.json")
          field.save_candidate(candidate_path)
          loaded = upstream.CurrentRF40LambdaTurnLeadingOscillatoryField.load_candidate(candidate_path)
          assert loaded.semantic_sha256 == field.semantic_sha256

          receipt = audit.write_receipt(
              "receipts/kokuno_a4_rf40_lambda_turn_divergence_receipt.json"
          )
          # Print compact real numerical summary to the Action log without claiming PASS.
          fine = receipt["resolution_ladder"][-1]
          print(json.dumps({
              "step": fine["step"],
              "inner_total_max": fine["inner"]["total"]["sampled_max"],
              "inner_total_weighted_rms": fine["inner"]["total"]["weighted_rms"],
              "lambda_total_max": fine["lambda_turn"]["total"]["sampled_max"],
              "lambda_total_weighted_rms": fine["lambda_turn"]["total"]["weighted_rms"],
              "lambda_leading_max": fine["lambda_turn"]["leading"]["sampled_max"],
              "lambda_osc_increment_max": fine["lambda_turn"]["oscillatory_increment"]["sampled_max"],
              "X2_seam_total_max": fine["X2_seam"]["total"]["sampled_max"],
              "axis_total_max": fine["axis"]["total"]["sampled_max"],
          }, sort_keys=True))
          PY

      - name: Upload candidate and receipt before scientific enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-rf40-lambda-turn-independent-divergence
          path: |
            receipts/kokuno_a2_rf40_lambda_turn_candidate.json
            receipts/kokuno_a4_rf40_lambda_turn_divergence_receipt.json
          if-no-files-found: error

      - name: Enforce preregistered scoped divergence and firewall gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/a1/src" python - <<'PY'
          from pathlib import Path
          import json
          import openai_ns_reconstruction

          a4_pkg = str(Path("a4/src/openai_ns_reconstruction").resolve())
          openai_ns_reconstruction.__path__.insert(0, a4_pkg)
          import openai_ns_reconstruction.kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit as audit

          receipt = json.loads(
              Path("receipts/kokuno_a4_rf40_lambda_turn_divergence_receipt.json").read_text(encoding="utf-8")
          )
          audit.enforce_receipt(receipt)
          PY
