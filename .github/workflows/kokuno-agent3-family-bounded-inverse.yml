name: kokuno-agent3-family-bounded-inverse

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_family_bounded_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_family_covariance_cross_terms.py'
      - 'src/openai_ns_reconstruction/kokuno_second_column_bounded_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_missing_covariance_column_target.py'
      - 'tests/test_constrained_kokuno_family_bounded_inverse.py'
      - '.github/workflows/kokuno-agent3-family-bounded-inverse.yml'

permissions:
  contents: read

jobs:
  family-bounded-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_family_bounded_inverse.py
          tests/test_constrained_kokuno_family_covariance_cross_terms.py
          tests/test_constrained_kokuno_second_column_bounded_inverse.py
      - name: Measure real duplicate-family calibration
        run: >-
          python -m openai_ns_reconstruction.kokuno_family_bounded_inverse
          --output artifacts/kokuno_agent3/family_bounded_inverse_report.json
          --target-output artifacts/kokuno_agent3/family_bounded_inverse_target.json
      - name: Show report
        run: cat artifacts/kokuno_agent3/family_bounded_inverse_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-family-bounded-inverse
          path: |
            artifacts/kokuno_agent3/family_bounded_inverse_report.json
            artifacts/kokuno_agent3/family_bounded_inverse_target.json
