name: kokuno-agent3-independent-radial-stress-admission

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_independent_radial_stress_admission.py'
      - 'tests/test_constrained_kokuno_independent_radial_stress_admission.py'
      - 'artifacts/constrained/kokuno_agent3/agent4_595_independent_radial_stress_audit.json'
      - '.github/workflows/kokuno-agent3-independent-radial-stress-admission.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_independent_radial_stress_admission.py'
      - 'tests/test_constrained_kokuno_independent_radial_stress_admission.py'
      - 'artifacts/constrained/kokuno_agent3/agent4_595_independent_radial_stress_audit.json'
      - '.github/workflows/kokuno-agent3-independent-radial-stress-admission.yml'

permissions:
  contents: read

jobs:
  independent-radial-stress-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-3 radial-stress admission tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_independent_radial_stress_admission.py
      - name: Compile Agent-3 radial-stress admission module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_independent_radial_stress_admission.py
      - name: Generate independent radial-stress admission receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_independent_radial_stress_admission
          --audit artifacts/constrained/kokuno_agent3/agent4_595_independent_radial_stress_audit.json
          --output kokuno_agent3_independent_radial_stress_admission.json
      - name: Check narrow operator promotion and fail-closed correction boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('kokuno_agent3_independent_radial_stress_admission.json').read_text())
          assert r['execution_identity_bound'] is True
          assert r['independent_compact_radial_stress_cross_audit_passed'] is True
          assert r['compact_radial_stress_operator_independently_admitted'] is True
          assert r['full_composite_radial_stress_execution_allowed_when_actual_defect_available'] is True
          assert r['failed_guards'] == []
          assert r['full_same_cycle_composite_requested_stress_materialized'] is False
          assert r['candidate_finite_head_mean_debt_materialized'] is False
          assert r['real_full_candidate_defect_consumed'] is False
          assert r['signed_mean_inverse_input_ready'] is False
          assert r['public_velocity_correction_materialized'] is False
          assert r['finite_correction_cycle_rerun_allowed'] is False
          assert r['finite_correction_cycle_run'] is False
          assert r['heldout_ns_residual_assessed'] is False
          assert r['residual_reduction_claimed'] is False
          assert r['pde_validated'] is False
          assert r['surrogate_defect_used'] is False
          PY
      - name: Upload Agent-3 radial-stress admission receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-independent-radial-stress-admission-v1
          path: kokuno_agent3_independent_radial_stress_admission.json
