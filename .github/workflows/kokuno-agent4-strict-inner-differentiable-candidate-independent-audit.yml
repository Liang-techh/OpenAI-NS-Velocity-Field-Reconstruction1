name: kokuno-agent4-strict-inner-differentiable-candidate-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-strict-inner-differentiable-candidate-audit-077
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_a4_strict_inner_differentiable_candidate_independent_audit.py'
      - 'tests/test_constrained_kokuno_a4_strict_inner_differentiable_candidate_independent_audit.py'
      - '.github/workflows/kokuno-agent4-strict-inner-differentiable-candidate-independent-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout and Agent-2 ancestry
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          A2_HEAD='68f84128f07b6743d368a9ab7a051e441f5a59b2'
          A2_BLOB='8c09048a1d15dff321642e21ee699cce7d19831a'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor "$A2_HEAD" HEAD
          test "$(git rev-parse "$A2_HEAD":src/openai_ns_reconstruction/kokuno_strict_inner_leading_oscillatory_differentiable_candidate.py)" = "$A2_BLOB"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: python -m pip install -e '.[dev]'

      - name: Compile and run focused warnings-as-errors regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a4_strict_inner_differentiable_candidate_independent_audit.py \
            tests/test_constrained_kokuno_a4_strict_inner_differentiable_candidate_independent_audit.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_a4_strict_inner_differentiable_candidate_independent_audit.py

      - name: Fetch exact Agent-1 strict-inner differentiable backend
        shell: bash
        run: |
          set -euo pipefail
          A1_HEAD='300919075c07396e4e466f553be78eaae0707df2'
          A1_BLOB='5076ffa69748c2d7e68289a155b67288eab6dab4'
          git fetch --no-tags origin "$A1_HEAD"
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD)" = "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = "$A1_BLOB"

      - name: Generate exact-head black-box velocity_dt receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/kokuno_agent4
          python - <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_a4_strict_inner_differentiable_candidate_independent_audit import (
              AGENT1_REFERENCE_BLOB,
              AGENT1_REFERENCE_HEAD,
              AGENT2_DIFFERENTIABLE_CANDIDATE_BLOB,
              AGENT2_DIFFERENTIABLE_CANDIDATE_HEAD,
              HELDOUT_SEED,
              RICHARDSON_TIME_STEPS,
              component_error_metrics,
              frozen_gate_failures,
              level_error_metrics,
              public_contract as a4_public_contract,
              refinement_ratio,
              richardson_time_level,
              vector_rms,
          )
          from openai_ns_reconstruction.kokuno_strict_inner_leading_oscillatory_differentiable_candidate import (
              KokunoStrictInnerLeadingOscillatoryDifferentiableCandidate,
              public_contract as a2_public_contract,
          )

          random_count = 128
          axis_near_count = 6
          rng = np.random.default_rng(HELDOUT_SEED)
          a1 = Path(os.environ['A1_WORKTREE'])
          output = Path('artifacts/kokuno_agent4/strict_inner_differentiable_candidate_independent_receipt.json')
          manifest_path = Path('artifacts/kokuno_agent4/strict_inner_differentiable_candidate_manifest.json')

          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous
          field = KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'temporal_derivative_sha256': field.temporal_derivative_sha256,
                      'source_X_interval': list(field.spatial.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op in ('velocity','velocity_dt'):
                  method = getattr(field, op)
                  out = method(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''
          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code], cwd=a1, env=env,
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          meta = ask({'op':'meta'})

          class ExactAgent1DifferentiableBackend:
              field_sha256 = meta['field_sha256']
              temporal_derivative_sha256 = meta['temporal_derivative_sha256']

              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )

              def _call(self, op, x, y, z, t):
                  x, y, z, t = self._arrays(x, y, z, t)
                  out = ask({
                      'op': op, 'x': x.tolist(), 'y': y.tolist(),
                      'z': z.tolist(), 't': t.tolist(),
                  })
                  return np.asarray(out['value'], dtype=float)

              def velocity(self, x, y, z, t):
                  return self._call('velocity', x, y, z, t)

              def velocity_dt(self, x, y, z, t):
                  return self._call('velocity_dt', x, y, z, t)

          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 time interval')
          if meta['source_X_interval'][1] < 0.30:
              raise RuntimeError('unexpected Agent-1 strict-inner X domain')

          # Source coordinates select fresh legal physical points only.  Numerical
          # differentiation below sees only the manifest-reloaded public velocity.
          X_random = rng.uniform(0.155, 0.265, size=random_count)
          eta_random = rng.uniform(-0.24, 0.24, size=random_count)
          t_random = rng.uniform(0.455, 0.545, size=random_count)
          theta_random = rng.uniform(0.0, 2.0 * math.pi, size=random_count)
          X_axis = np.asarray((0.0, 0.0, 0.0, 1.0e-14, 1.0e-12, 1.0e-10))
          eta_axis = np.asarray((-0.18, 0.0, 0.18, -1.0e-8, 1.0e-8, 0.08))
          t_axis = np.asarray((0.47, 0.50, 0.53, 0.48, 0.52, 0.50))
          theta_axis = np.asarray((0.13, 1.03, 2.07, 0.61, 1.71, 2.81))
          X = np.concatenate((X_random, X_axis))
          eta = np.concatenate((eta_random, eta_axis))
          source_t = np.concatenate((t_random, t_axis))
          theta = np.concatenate((theta_random, theta_axis))
          mapped = ask({
              'op':'forward', 'X':X.tolist(), 'eta':eta.tolist(),
              't':source_t.tolist(), 'theta':theta.tolist(),
          })
          x = np.asarray(mapped['x'], dtype=float)
          y = np.asarray(mapped['y'], dtype=float)
          z = np.asarray(mapped['z'], dtype=float)
          tt = np.asarray(mapped['t'], dtype=float)
          if x.size != random_count + axis_near_count:
              raise RuntimeError('held-out sample count drifted')

          backend = ExactAgent1DifferentiableBackend()
          original = KokunoStrictInnerLeadingOscillatoryDifferentiableCandidate(backend)
          manifest = original.save_manifest(manifest_path)
          candidate = KokunoStrictInnerLeadingOscillatoryDifferentiableCandidate.load_manifest(
              backend, manifest_path
          )
          if candidate.velocity_candidate_sha256 != original.velocity_candidate_sha256:
              raise RuntimeError('save/reload changed base velocity candidate identity')
          if candidate.differentiable_sha256 != original.differentiable_sha256:
              raise RuntimeError('save/reload changed differentiable candidate identity')

          # Candidate-facing production quantity under audit.
          production_dt = np.asarray(candidate.velocity_dt(x, y, z, tt), dtype=float)
          # Independent numerical reference: ONLY the reloaded public velocity.
          levels = tuple(
              richardson_time_level(candidate.velocity, x, y, z, tt, step=h)
              for h in RICHARDSON_TIME_STEPS
          )
          failures = frozen_gate_failures(production_dt, levels)
          metrics = [level_error_metrics(production_dt, level) for level in levels]
          coarse_to_medium, medium_to_fine, ratio = refinement_ratio(*levels)
          fine = levels[-1].velocity_dt
          component_metrics = component_error_metrics(production_dt, fine)

          delta = fine - production_dt
          point_error = np.linalg.norm(delta, axis=-1)
          worst_index = int(np.argmax(point_error))
          worst_component = int(np.argmax(np.abs(delta[worst_index])))
          labels = ('u_t','v_t','w_t')

          # Exact-axis symmetry is checked only on the three X=0 probes.  The
          # radius-near-axis probes are required finite but not incorrectly zeroed.
          exact_axis_slice = slice(random_count, random_count + 3)
          axis_transverse_max = float(np.max(np.abs(production_dt[exact_axis_slice, :2])))
          if axis_transverse_max > 1.0e-12:
              failures.append('exact_axis_transverse_velocity_dt')
          near_axis_finite = bool(np.all(np.isfinite(production_dt[random_count + 3:])))
          if not near_axis_finite:
              failures.append('axis_near_velocity_dt_finite')

          scaled_failures = frozen_gate_failures(0.99 * production_dt, levels)
          flipped = production_dt.copy()
          flipped[..., 2] *= -1.0
          axial_flip_failures = frozen_gate_failures(flipped, levels)
          scale_mutation_detected = bool(
              {'fine_relative_rms','fine_relative_sampled_max'}.intersection(scaled_failures)
          )
          axial_flip_detected = bool(
              {'fine_relative_rms','fine_relative_sampled_max'}.intersection(axial_flip_failures)
          )
          if not scale_mutation_detected:
              failures.append('mutation_velocity_dt_scale_not_detected')
          if not axial_flip_detected:
              failures.append('mutation_velocity_dt_axial_sign_not_detected')

          def canonical(payload):
              return json.dumps(payload, sort_keys=True, separators=(',', ':'), allow_nan=False)

          def rehash(payload):
              payload = copy.deepcopy(payload)
              payload.pop('manifest_sha256', None)
              payload['manifest_sha256'] = hashlib.sha256(canonical(payload).encode()).hexdigest()
              return payload

          identity_mutation = copy.deepcopy(manifest)
          identity_mutation['differentiable_sha256'] = '0' * 64
          identity_mutation = rehash(identity_mutation)
          try:
              KokunoStrictInnerLeadingOscillatoryDifferentiableCandidate.from_manifest(
                  backend, identity_mutation
              )
          except ValueError:
              identity_mutation_rejected = True
          else:
              identity_mutation_rejected = False
              failures.append('checksum_valid_differentiable_identity_mutation_not_rejected')

          gate_mutation = copy.deepcopy(manifest)
          gate_mutation['scientific_gates']['momentum_max_l2'] = 1.001e-3
          gate_mutation = rehash(gate_mutation)
          try:
              KokunoStrictInnerLeadingOscillatoryDifferentiableCandidate.from_manifest(
                  backend, gate_mutation
              )
          except ValueError:
              gate_mutation_rejected = True
          else:
              gate_mutation_rejected = False
              failures.append('checksum_valid_momentum_gate_mutation_not_rejected')

          contract = a4_public_contract()
          a2_contract = a2_public_contract()
          truth = contract['truth_boundary']
          required_false = (
              'global_leading_velocity_materialized', 'outer_join_materialized',
              'matched_pressure_included', 'restricted_forcing_included',
              'correction_velocity_included', 'complete_kokuno_candidate_assembled',
              'leading_only_ns_residual_assessed',
              'leading_plus_oscillatory_ns_residual_assessed',
              'after_correction_ns_residual_assessed',
              'heldout_ns_momentum_residual_assessed',
              'formal_full_domain_pde_gate_assessed', 'pde_validated',
          )
          if any(truth[name] for name in required_false):
              failures.append('truth_boundary_promoted')
          if a2_contract['forbidden_velocity_inputs_present']:
              failures.append('a2_velocity_exposes_forbidden_scientific_knob')
          if a2_contract['forbidden_velocity_dt_inputs_present']:
              failures.append('a2_velocity_dt_exposes_forbidden_scientific_knob')

          # Observation-only sensitivity to a small evaluation-time perturbation.
          # This is not a model-parameter retune and never changes acceptance.
          time_shift = 1.0e-4
          shifted = np.asarray(candidate.velocity_dt(x, y, z, tt + time_shift), dtype=float)
          time_shift_sensitivity_rms = vector_rms(shifted - production_dt)

          receipt = {
              'schema': contract['schema'],
              'task': contract['task'],
              'exact_head': os.environ['EXPECTED_HEAD'],
              'agent2_exact_head': AGENT2_DIFFERENTIABLE_CANDIDATE_HEAD,
              'agent2_source_blob': AGENT2_DIFFERENTIABLE_CANDIDATE_BLOB,
              'agent1_exact_head': AGENT1_REFERENCE_HEAD,
              'agent1_source_blob': AGENT1_REFERENCE_BLOB,
              'seed': HELDOUT_SEED,
              'random_offgrid_count': random_count,
              'axis_and_axis_near_count': axis_near_count,
              'candidate_identity': {
                  'velocity_candidate_sha256': candidate.velocity_candidate_sha256,
                  'differentiable_sha256': candidate.differentiable_sha256,
                  'manifest_sha256': manifest['manifest_sha256'],
              },
              'independent_reference': contract['independent_reference'],
              'resolution_metrics': metrics,
              'refinement': {
                  'coarse_to_medium_rms': coarse_to_medium,
                  'medium_to_fine_rms': medium_to_fine,
                  'ratio': ratio,
              },
              'fine_component_errors': component_metrics,
              'production_velocity_dt_rms': vector_rms(production_dt),
              'exact_axis_transverse_velocity_dt_max': axis_transverse_max,
              'axis_near_velocity_dt_finite': near_axis_finite,
              'worst_error': {
                  'index': worst_index,
                  'component': labels[worst_component],
                  'x': float(x[worst_index]), 'y': float(y[worst_index]),
                  'z': float(z[worst_index]), 't': float(tt[worst_index]),
                  'X': float(X[worst_index]), 'eta': float(eta[worst_index]),
                  'production': float(production_dt[worst_index, worst_component]),
                  'independent': float(fine[worst_index, worst_component]),
                  'absolute_component_error': float(abs(delta[worst_index, worst_component])),
              },
              'mutations': {
                  'production_scale_0p99_detected': scale_mutation_detected,
                  'production_axial_sign_flip_detected': axial_flip_detected,
                  'checksum_valid_differentiable_identity_mutation_rejected': identity_mutation_rejected,
                  'checksum_valid_momentum_gate_0p1pct_relaxation_rejected': gate_mutation_rejected,
              },
              'sensitivity_observation_only': {
                  'evaluation_time_shift': time_shift,
                  'velocity_dt_change_rms': time_shift_sensitivity_rms,
                  'used_for_retuning': False,
                  'candidate_exposes_tunable_scientific_parameter_knob': False,
              },
              'frozen_gates': contract['frozen_gates'],
              'norm_scope': contract['norm_scope'],
              'truth_boundary': truth,
              'failures': sorted(set(failures)),
              'scientific_gate_pass': not failures,
          }
          digest_payload = dict(receipt)
          receipt['receipt_sha256'] = hashlib.sha256(canonical(digest_payload).encode()).hexdigest()
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))

          assert manifest['scientific_gates']['momentum_max_l2'] == 1.0e-3
          assert manifest['scientific_gates']['divergence_max_l2'] == 1.0e-5
          proc.stdin.close()
          if proc.wait(timeout=10) != 0:
              assert proc.stderr is not None
              raise RuntimeError('Agent-1 backend failed: ' + proc.stderr.read())
          PY

      - name: Enforce frozen scientific gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/kokuno_agent4/strict_inner_differentiable_candidate_independent_receipt.json')
          report = json.loads(path.read_text())
          if not report['scientific_gate_pass']:
              raise SystemExit('frozen A4 differentiable-artifact gate failed: ' + ', '.join(report['failures']))
          assert report['truth_boundary']['pde_validated'] is False
          assert report['truth_boundary']['heldout_ns_momentum_residual_assessed'] is False
          PY

      - name: Upload exact-head manifest and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-strict-inner-differentiable-candidate-independent-audit-v1
          path: |
            artifacts/kokuno_agent4/strict_inner_differentiable_candidate_manifest.json
            artifacts/kokuno_agent4/strict_inner_differentiable_candidate_independent_receipt.json
          if-no-files-found: warn
