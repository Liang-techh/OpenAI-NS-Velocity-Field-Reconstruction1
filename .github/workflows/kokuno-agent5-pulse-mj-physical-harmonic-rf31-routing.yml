name: kokuno-agent5-pulse-mj-physical-harmonic-rf31-routing

on:
  push:
    branches:
      - kokuno-agent5/pulse-mj-physical-harmonic-rf31-routing-114
  pull_request:
    branches:
      - kokuno-agent5/xi11-composite-i4-force-routing-113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Authenticate exact parent and delivered sibling heads
        shell: bash
        run: |
          set -euo pipefail
          fetch_and_check() {
            local branch="$1" expected_head="$2" path="$3" expected_blob="$4"
            git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
            actual_head="$(git rev-parse "refs/remotes/origin/${branch}")"
            test "${actual_head}" = "${expected_head}"
            actual_blob="$(git rev-parse "${expected_head}:${path}")"
            test "${actual_blob}" = "${expected_blob}"
          }

          fetch_and_check \
            'kokuno-agent5/xi11-composite-i4-force-routing-113' \
            '337ad149f6227fd054e496f4f38e48216b2ff2f4' \
            'src/openai_ns_reconstruction/kokuno_a5_xi11_composite_i4_force_routing.py' \
            '9559ea30dcc6bea7c4d8179b555e4884108c240a'
          fetch_and_check \
            'agent1/current-pulse-entry-mj-20260922' \
            '4be97cbeb3b78b4d6a162447ae8fea73d0c2c477' \
            'src/openai_ns_reconstruction/kokuno_current_pulse_entry_moments.py' \
            'd4cad0001552a88f682230a6b7fc13c993797497'
          fetch_and_check \
            'codex/k2-osc-102-physical-scaling' \
            'bab607c1a4f93a586dc8a1a9fa3c0d8b5badeb58' \
            'src/openai_ns_reconstruction/kokuno_source_physicalized_localized_harmonic.py' \
            'b19805fc2e78d6a51b6ead6c141125a662d3ec4c'
          fetch_and_check \
            'agent3/rf30-rf31-typed-mean-correction-20260922' \
            'edcf3a3a2e87f335c268460ca0d4b3b23f4a9847' \
            'src/openai_ns_reconstruction/kokuno_rf30_rf31_typed_mean_correction.py' \
            'fa31fdf12adceaa5b295db502cf0ccaaad778307'
          fetch_and_check \
            'agent3/current-i4-radial-force-20260921' \
            '922f7aa10460ded44af212d313eceff33a2ac647' \
            'src/openai_ns_reconstruction/kokuno_current_i4_nonlinear_radial_force.py' \
            'e28eac6f7fb7f3191a024b052bcf677cff8d74d2'
          fetch_and_check \
            'kokuno-agent4/current-i4-radial-stress-independent-audit-115' \
            '3f3fd169ce79a2e44b90b50353415d057119e63f' \
            'src/openai_ns_reconstruction/kokuno_a4_current_i4_radial_stress_independent_audit.py' \
            '97387bcab05098ecc622372ec3aa08150d79b89d'
          fetch_and_check \
            'kokuno-agent4/current-i4-radial-force-independent-audit-116' \
            'add922982c2f3a4cf5a72d84910817e63f05c487' \
            'src/openai_ns_reconstruction/kokuno_a4_current_i4_radial_force_independent_audit.py' \
            'c254b248e2703eaec1c4f757657ca40b9e211c7d'

      - name: Authenticate corrected public source provenance
        uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Verify corrected source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = '143f6773feb424ad9ed3a8d116653200f20346b7'
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = '205a99807302e21a51c5eaf223390c0dfc42bcd0'

      - name: Enforce minimal three-file Agent-5 delta
        shell: bash
        run: |
          set -euo pipefail
          parent='337ad149f6227fd054e496f4f38e48216b2ff2f4'
          git merge-base --is-ancestor "${parent}" HEAD
          test "$(git rev-list --count "${parent}"..HEAD)" -eq 6
          mapfile -t changed < <(git diff --name-only "${parent}..HEAD" | sort)
          expected=(
            '.github/workflows/kokuno-agent5-pulse-mj-physical-harmonic-rf31-routing.yml'
            'src/openai_ns_reconstruction/kokuno_a5_pulse_mj_physical_harmonic_rf31_routing.py'
            'tests/test_kokuno_a5_pulse_mj_physical_harmonic_rf31_routing.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --diff-filter=D --name-only "${parent}..HEAD")"

      - name: Run focused parent and new Agent-5 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a5_pulse_mj_physical_harmonic_rf31_routing.py \
            tests/test_kokuno_a5_pulse_mj_physical_harmonic_rf31_routing.py
          pytest -q \
            tests/test_kokuno_a5_xi11_composite_i4_force_routing.py \
            tests/test_kokuno_a5_pulse_mj_physical_harmonic_rf31_routing.py

      - name: Materialize deterministic routing artifact
        run: |
          mkdir -p artifacts/kokuno/agent5
          python -m openai_ns_reconstruction.kokuno_a5_pulse_mj_physical_harmonic_rf31_routing \
            --output artifacts/kokuno/agent5/pulse_mj_physical_harmonic_rf31_routing.json

      - name: Upload registration artifact before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-pulse-mj-physical-harmonic-rf31-routing-v114
          path: artifacts/kokuno/agent5/pulse_mj_physical_harmonic_rf31_routing.json
          if-no-files-found: error

      - name: Final fail-closed truth enforcement
        run: |
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_a5_pulse_mj_physical_harmonic_rf31_routing import load_registration
          reg = load_registration('artifacts/kokuno/agent5/pulse_mj_physical_harmonic_rf31_routing.json')
          truth = reg['truth_boundary']
          audit = reg['frontiers']['current_i4_radial_force_validator']
          gates = reg['frozen_gates']

          assert truth['current_lineage_J_entry_materialized'] is True
          assert truth['current_cartesian_end_compensation_composed'] is False
          assert truth['source_physicalized_localized_harmonic_materialized'] is True
          assert truth['source_physicalized_harmonic_self_contained_velocity_xyzt_provider'] is False
          assert truth['rf30_rf31_formula_executor_materialized'] is True
          assert truth['current_i4_source_fixed_q_backend_materialized'] is False
          assert truth['current_i4_rf30_defect_materialized'] is False
          assert truth['correction_coefficients_solved'] is False
          assert truth['agent4_matching_current_i4_radial_force_audit_present'] is True
          assert truth['agent4_matching_current_i4_radial_force_audit_registered'] is True
          assert truth['agent4_matching_current_i4_radial_force_audit_scoped_gate_passed'] is None
          assert truth['agent4_matching_current_i4_radial_force_audit_admitted'] is False
          assert audit['pr'] == 1127
          assert audit['head'] == 'add922982c2f3a4cf5a72d84910817e63f05c487'
          assert audit['scoped_gate_passed'] is None
          assert audit['scientifically_admitted'] is False
          assert audit['authorizes_complete_ns_correction'] is False
          assert truth['complete_identity_bound_ns_defect_materialized'] is False
          assert truth['pde_validated'] is False
          assert gates['normalized_momentum_sampled_max'] == 1e-3
          assert gates['normalized_momentum_volume_l2'] == 1e-3
          assert gates['normalized_divergence_sampled_max'] == 1e-5
          assert gates['normalized_divergence_volume_l2'] == 1e-5
          assert gates['canonical_quadrature'] == [24, 48, 96]
          assert gates['residual_defined_free_forcing_allowed'] is False
          PY
