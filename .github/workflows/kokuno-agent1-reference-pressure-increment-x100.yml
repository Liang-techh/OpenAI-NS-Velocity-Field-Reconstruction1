name: kokuno-agent1-reference-pressure-increment-x100

on:
  push:
    branches:
      - codex/kokuno-a1-reference-pressure-increment-x100-081
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_reference_pressure_increment_x100.py"
      - "tests/test_kokuno_pa10_reference_pressure_increment_x100.py"
      - ".github/workflows/kokuno-agent1-reference-pressure-increment-x100.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-reference-pressure-increment-x100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-pressure-increment-x100:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile executable reference pressure increment
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_reference_pressure_increment_x100.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_reference_plateau_x100.py \
            tests/test_kokuno_pa10_reference_pressure_increment_x100.py
      - name: Emit reference pressure increment X100 receipt
        run: |
          python - <<'PY'
          import json
          from openai_ns_reconstruction.kokuno_pa10_reference_pressure_increment_x100 import (
              KokunoPA10ReferencePressureIncrementToX100,
          )

          pressure = KokunoPA10ReferencePressureIncrementToX100()
          report = pressure.report()
          truth = report['truth_boundary']
          probe = report['X100_handoff_probe']
          assert max(probe['C_p_reference']) > 1.0e-12
          assert min(probe['C_p_reference_X']) > 0.0
          assert truth['reference_pressure_increment_to_X100_executable'] is True
          assert truth['absolute_axis_pressure_Pi0_materialized'] is False
          assert truth['absolute_reference_pressure_materialized'] is False
          assert truth['reference_nsr_materialized'] is False
          assert truth['outer_global_leading_velocity_materialized'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          print(json.dumps({
              'semantic_sha256': report['semantic_sha256'],
              'X100_handoff_probe': probe,
          }, indent=2, sort_keys=True))
          PY
