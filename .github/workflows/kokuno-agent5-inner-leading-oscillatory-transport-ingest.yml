name: kokuno-agent5-inner-leading-oscillatory-transport-ingest

on:
  push:
    branches:
      - codex/kokuno-a5-inner-leading-oscillatory-transport-ingest-075
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_cartesian_center_spatial_derivative_audit_ingest_contract.py"
      - "src/openai_ns_reconstruction/kokuno_a5_inner_leading_oscillatory_transport_ingest_contract.py"
      - "tests/test_kokuno_a5_cartesian_center_spatial_derivative_audit_ingest_contract.py"
      - "tests/test_kokuno_a5_inner_leading_oscillatory_transport_ingest_contract.py"
      - ".github/workflows/kokuno-agent5-inner-leading-oscillatory-transport-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-inner-leading-oscillatory-transport-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-inner-leading-oscillatory-transport-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          echo "exact_head=$ACTUAL_HEAD"
      - name: Verify frozen Agent-1 Laplacian source blob
        env:
          AGENT1_HEAD: e96ee90144976a992b62d76d4361a94eb16bd91e
          EXPECTED_BLOB: 74b0e185e8e0bbb08695d493e0a091c305a03006
        run: |
          git fetch --no-tags origin "$AGENT1_HEAD"
          ACTUAL_BLOB="$(git rev-parse "$AGENT1_HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_laplacian.py")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "agent1_laplacian_blob=$ACTUAL_BLOB"
      - name: Verify frozen Agent-2 transport source blob
        env:
          AGENT2_HEAD: 016e3c152d7d11e4fedcd79b819df337f8942983
          EXPECTED_BLOB: d6082ebd346ba8150321bf3d62f104c107a70300
        run: |
          git fetch --no-tags origin "$AGENT2_HEAD"
          ACTUAL_BLOB="$(git rev-parse "$AGENT2_HEAD:src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport.py")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "agent2_transport_blob=$ACTUAL_BLOB"
      - name: Verify frozen Agent-4 independent-audit source blob
        env:
          AGENT4_HEAD: fca8c7e0bcfa1a96eb073a9cde8826553d19aae9
          EXPECTED_BLOB: bd372dae8b665c44ecaf6b2706ebebe53cd7936b
        run: |
          git fetch --no-tags origin "$AGENT4_HEAD"
          ACTUAL_BLOB="$(git rev-parse "$AGENT4_HEAD:src/openai_ns_reconstruction/kokuno_a4_inner_leading_oscillatory_transport_independent_audit.py")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "agent4_transport_audit_blob=$ACTUAL_BLOB"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile integration seam
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_a5_cartesian_center_spatial_derivative_audit_ingest_contract.py \
            src/openai_ns_reconstruction/kokuno_a5_inner_leading_oscillatory_transport_ingest_contract.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_a5_cartesian_center_spatial_derivative_audit_ingest_contract.py \
            tests/test_kokuno_a5_inner_leading_oscillatory_transport_ingest_contract.py
      - name: Generate exact-head transport-ingest artifact
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python -W error -m openai_ns_reconstruction.kokuno_a5_inner_leading_oscillatory_transport_ingest_contract \
            --exact-head "$HEAD_SHA" \
            --output artifacts/kokuno_agent5/inner_leading_oscillatory_transport_ingest_v1/report.json
      - name: Validate frozen transport audit scope and truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent5/inner_leading_oscillatory_transport_ingest_v1/report.json')
          payload = json.loads(path.read_text())
          exact_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert payload['exact_head'] == exact_head
          assert payload['schema'] == 'kokuno-a5-inner-leading-oscillatory-transport-ingest-contract-v1'
          assert payload['parent_a5'] == {
              'pr': 833,
              'head': 'c4d29ea5987e297977676bb786b3425634f58fd2',
          }

          a1 = payload['agent1_laplacian_binding']
          assert a1['pr'] == 839
          assert a1['head'] == 'e96ee90144976a992b62d76d4361a94eb16bd91e'
          assert a1['source_blob_sha'] == '74b0e185e8e0bbb08695d493e0a091c305a03006'
          assert a1['dedicated_run'] == 35510543422
          assert a1['tests_run'] == 35510543420
          assert a1['production_spatial_step'] == 1e-3

          a2 = payload['agent2_transport_binding']
          assert a2['pr'] == 840
          assert a2['head'] == '016e3c152d7d11e4fedcd79b819df337f8942983'
          assert a2['source_blob_sha'] == 'd6082ebd346ba8150321bf3d62f104c107a70300'
          assert a2['dedicated_run'] == 35511160478
          assert a2['tests_run'] == 35511160452
          assert a2['schema'] == 'kokuno-a2-inner-leading-oscillatory-transport-v1'
          protocol = a2['protocol']
          assert protocol['viscosity'] == 0.01
          assert protocol['agent2_independent_fd4_steps'] == [0.004, 0.002, 0.001]
          assert protocol['agent2_stabilization_ratio_gate'] == 4.0
          assert protocol['agent2_finest_relative_rms_gate'] == 2e-2
          assert protocol['agent2_finest_relative_sampled_max_gate'] == 5e-2
          assert protocol['post_observation_retuning_allowed'] is False

          a4 = payload['agent4_transport_audit_binding']
          assert a4['pr'] == 842
          assert a4['head'] == 'fca8c7e0bcfa1a96eb073a9cde8826553d19aae9'
          assert a4['source_blob_sha'] == 'bd372dae8b665c44ecaf6b2706ebebe53cd7936b'
          assert a4['dedicated_run'] == 35511772346
          assert a4['tests_run'] == 35511772368
          assert a4['schema'] == 'kokuno-a4-inner-leading-oscillatory-transport-independent-audit-v1'
          assert a4['audited_agent2_pr'] == 840
          assert a4['audited_agent2_head'] == '016e3c152d7d11e4fedcd79b819df337f8942983'
          assert a4['protocol']['seed'] == 9173501
          assert a4['protocol']['fd8_steps'] == [0.002, 0.001, 0.0005]
          assert a4['protocol']['transport_consistency_relative_rms_gate'] == 1.5e-2
          assert a4['protocol']['transport_consistency_relative_sampled_max_gate'] == 4e-2
          assert a4['protocol']['divergence_sampled_max_gate'] == 1e-5
          assert a4['protocol']['divergence_sampled_rms_gate'] == 1e-5
          scope = a4['norm_scope_firewall']
          assert scope['agent4_relative_transport_consistency_is_cr001_momentum_residual'] is False
          assert scope['agent4_transport_consistency_directly_comparable_to_ST006_full_residual'] is False
          assert scope['agent4_divergence_rms_is_sampled_rms'] is True
          assert scope['agent4_divergence_rms_is_canonical_volume_weighted_L2'] is False

          assert payload['evidence'] == {
              'parent_inner_spatial_derivative_ingest_admitted': False,
              'agent1_laplacian_exact_head_ci_conclusion': None,
              'agent2_transport_exact_head_ci_conclusion': None,
              'agent4_dedicated_transport_audit_present': True,
              'agent4_transport_exact_head_ci_conclusion': None,
              'agent4_transport_audit_conclusion': None,
              'agent4_transport_scientific_receipt_admitted': False,
              'strict_inner_transport_scientifically_admitted': False,
          }

          handoff = payload['transport_operator_handoff']
          assert handoff['registered'] is True
          assert handoff['status'] == 'registered_unresolved'
          assert handoff['construction_authority'] == 'Agent2#840'
          assert handoff['independent_audit_available'] is True
          assert handoff['independent_audit_status'] == 'registered_unresolved'
          assert handoff['independent_audit_authority'] == 'Agent4#842'
          assert handoff['includes_velocity_dt'] is True
          assert handoff['includes_full_strict_inner_advection'] is True
          assert handoff['includes_base_viscosity'] is True
          assert handoff['includes_pressure_gradient'] is False
          assert handoff['includes_restricted_forcing'] is False
          assert handoff['includes_correction_velocity'] is False
          assert handoff['complete_ns_momentum_residual'] is False
          assert handoff['usable_as_actual_defect_input_now'] is False
          assert handoff['usable_for_final_independent_pde_validation'] is False

          staged = payload['staged_residual_availability']
          assert staged['leading_only_full_ns_residual_available'] is False
          assert staged['leading_plus_oscillatory_full_ns_residual_available'] is False
          assert staged['after_correction_full_ns_residual_available'] is False
          assert staged['same_protocol_ST006_comparison_legal'] is False

          api = payload['candidate_api_handoff']
          assert api['pressure'] is None
          assert api['forcing'] is None
          assert api['complete_candidate_api_ready'] is False

          status = payload['ingest_status']
          assert status['typed_strict_inner_leading_oscillatory_transport_registered'] is True
          assert status['typed_strict_inner_transport_independent_audit_registered'] is True
          assert status['strict_inner_leading_oscillatory_transport_ingest_admitted'] is False
          assert status['strict_inner_transport_ready'] is False
          assert status['leading_ready'] is False

          assert payload['stage_state'] == {
              'leading_ready': False,
              'oscillatory_ready': True,
              'correction_ready': False,
              'velocity_export_ready': False,
              'pde_validated': False,
          }
          assert payload['baseline_vs_kokuno']['kokuno_same_protocol_full_candidate_residual_available'] is False
          assert payload['baseline_vs_kokuno']['comparison_performed'] is False
          assert payload['final_project_gates_unchanged'] == {
              'normalized_momentum_max': 1e-3,
              'normalized_momentum_L2': 1e-3,
              'divergence_max': 1e-5,
              'divergence_L2': 1e-5,
          }

          truth = payload['truth_boundary']
          true_keys = {
              'strict_inner_transport_surface_registered',
              'agent4_transport_audit_surface_registered',
              'registration_not_scientific_admission',
          }
          for key in true_keys:
              assert truth[key] is True
          for key, value in truth.items():
              if key in true_keys:
                  continue
              assert value is False, (key, value)

          print('artifact_sha256=', hashlib.sha256(path.read_bytes()).hexdigest())
          print('contract_sha256=', payload['contract_sha256'])
          print('exact_head=', exact_head)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-inner-leading-oscillatory-transport-ingest-contract-v1
          path: artifacts/kokuno_agent5/inner_leading_oscillatory_transport_ingest_v1/report.json
          if-no-files-found: error
