name: kokuno-agent5-current-rf40-lambda-turn-composite-ingest

on:
  push:
    branches:
      - codex/kokuno-a5-rf40-lambda-turn-composite-ingest-099
  pull_request:
    branches:
      - codex/kokuno-a5-rf40-axial-shutdown-composite-ingest-098
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact A5 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a5
          fetch-depth: 0

      - name: Verify exact A5 parent ancestry and strict three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a5
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor bb3d943461820fe43c0bdb2063cb11b428c4ea1c HEAD
          test "$(git rev-list --count bb3d943461820fe43c0bdb2063cb11b428c4ea1c..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only bb3d943461820fe43c0bdb2063cb11b428c4ea1c..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent5-current-rf40-lambda-turn-composite-ingest.yml \
            src/openai_ns_reconstruction/kokuno_a5_current_rf40_lambda_turn_composite_ingest_contract.py \
            tests/test_kokuno_a5_current_rf40_lambda_turn_composite_ingest_contract.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git hash-object src/openai_ns_reconstruction/kokuno_a5_current_rf40_axial_shutdown_composite_ingest_contract.py)" = \
            "6ac6d7c41f921b52e8bc32f6ffcde5cd37602360"
          test "$(git hash-object tests/test_kokuno_a5_current_rf40_axial_shutdown_composite_ingest_contract.py)" = \
            "1efd89b81ca785da555bfdcfc36b4f67ede7285c"
          test "$(git hash-object .github/workflows/kokuno-agent5-current-rf40-axial-shutdown-composite-ingest.yml)" = \
            "228104b1ec697c8cfff0ebc8a3b8759cfb08c1b8"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install A5 dependencies
        shell: bash
        run: python -m pip install -e './a5[dev]'

      - name: Compile and run parent plus new A5 fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a5/src/openai_ns_reconstruction/kokuno_a5_current_rf40_lambda_turn_composite_ingest_contract.py \
            a5/tests/test_kokuno_a5_current_rf40_lambda_turn_composite_ingest_contract.py
          PYTHONPATH="$PWD/a5/src" python -m pytest -q -W error \
            a5/tests/test_kokuno_a5_current_rf40_axial_shutdown_composite_ingest_contract.py \
            a5/tests/test_kokuno_a5_current_rf40_lambda_turn_composite_ingest_contract.py

      - name: Check out exact A2 lambda-turn composite
        uses: actions/checkout@v4
        with:
          ref: e9697cdfe2249e1b8bc2f9241bd16d456c60418f
          path: a2
          fetch-depth: 1

      - name: Check out exact A4 lambda-turn independent audit
        uses: actions/checkout@v4
        with:
          ref: 8b5b337940edd568bf30ddba7afe68815bce1fd9
          path: a4
          fetch-depth: 1

      - name: Check out exact A1 power-law sibling
        uses: actions/checkout@v4
        with:
          ref: 2c76ebdc41d6c566f43a1305034ba2ff9dce410b
          path: a1
          fetch-depth: 1

      - name: Check out exact A3 first-turn radial-force sibling
        uses: actions/checkout@v4
        with:
          ref: 2c10faab7c229b801cb868355e0a1de0a729445c
          path: a3
          fetch-depth: 1

      - name: Authenticate exact sibling heads and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "e9697cdfe2249e1b8bc2f9241bd16d456c60418f"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_lambda_turn_leading_oscillatory_identity.py)" = "def2998256b2339115c2400c75b6db6ab58dfe95"
          test "$(git -C a2 hash-object tests/test_constrained_kokuno_current_rf40_lambda_turn_leading_oscillatory_identity.py)" = "f8880d7ead60a89be60803435c106c7b075c0f2b"
          test "$(git -C a2 hash-object .github/workflows/kokuno-agent2-current-rf40-lambda-turn-leading-oscillatory.yml)" = "3dcf132cd9fe8b9101a7e5ca6058c3b44b4a8a34"

          test "$(git -C a4 rev-parse HEAD)" = "8b5b337940edd568bf30ddba7afe68815bce1fd9"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit.py)" = "2ae59ab9bc8480979f0b0660b1db8b801fe847c1"
          test "$(git -C a4 hash-object tests/test_constrained_kokuno_a4_current_rf40_lambda_turn_leading_oscillatory_divergence_independent_audit.py)" = "813dfc007f248e5297829330df243df43db59ed7"
          test "$(git -C a4 hash-object .github/workflows/kokuno-agent4-current-rf40-lambda-turn-leading-oscillatory-divergence-audit.yml)" = "0fc520a698d94026ca82738dc4ab5f57252c52da"

          test "$(git -C a1 rev-parse HEAD)" = "2c76ebdc41d6c566f43a1305034ba2ff9dce410b"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_power_law.py)" = "36a0183352a2005bd0b5f477594e05a2e4fe3868"
          test "$(git -C a1 hash-object tests/test_kokuno_pa16_current_cartesian_rf40_power_law.py)" = "9c88ab44c3a195b42f6f600b54563491869be64f"
          test "$(git -C a1 hash-object .github/workflows/kokuno-agent1-current-cartesian-rf40-power-law.yml)" = "2f871a63034ca0284761e97cdd014766c9820d94"

          test "$(git -C a3 rev-parse HEAD)" = "2c10faab7c229b801cb868355e0a1de0a729445c"
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_nonlinear_radial_force.py)" = "d73a1d6e6b7c0cc341dd99f92d6f20d6eb53acff"
          test "$(git -C a3 hash-object tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_radial_force.py)" = "a52ae206c588f89690fed5aa2bd2d5dfc416feca"
          test "$(git -C a3 hash-object .github/workflows/kokuno-agent3-current-rf40-first-turn-nonlinear-radial-force.yml)" = "c974546fc915b731801d620ae4f00d49b8cb4c1c"

      - name: Materialize checksum-bound A5 registration receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          PYTHONPATH="$PWD/a5/src" python -m \
            openai_ns_reconstruction.kokuno_a5_current_rf40_lambda_turn_composite_ingest_contract \
            --output receipts/kokuno_a5_current_rf40_lambda_turn_composite_ingest.json
          cat receipts/kokuno_a5_current_rf40_lambda_turn_composite_ingest.json

      - name: Upload registration receipt before enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a5-current-rf40-lambda-turn-composite-ingest
          path: receipts/kokuno_a5_current_rf40_lambda_turn_composite_ingest.json
          if-no-files-found: error

      - name: Enforce A5 frozen truth boundary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/a5/src" python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction import kokuno_a5_current_rf40_lambda_turn_composite_ingest_contract as mod

          receipt = json.loads(
              Path("receipts/kokuno_a5_current_rf40_lambda_turn_composite_ingest.json").read_text(
                  encoding="utf-8"
              )
          )
          mod.enforce_registration_receipt(receipt)
          assert receipt["registration"]["readiness"]["pde_validated"] is False
          assert receipt["registration"]["truth_boundary"]["heldout_normalized_ns_residual_assessed"] is False
          assert receipt["registration"]["truth_boundary"]["leading_plus_oscillatory_velocity_through_power_law_materialized"] is False
          assert receipt["registration"]["frozen_science"]["residual_defined_free_forcing_forbidden"] is True
          PY
