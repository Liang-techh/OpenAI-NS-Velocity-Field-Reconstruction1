name: kokuno-agent5-xi13-axissafe-rf39-routing

on:
  push:
    branches:
      - kokuno-agent5/xi13-axissafe-rf39-routing-115
  pull_request:
    branches:
      - kokuno-agent5/pulse-mj-physical-harmonic-rf31-routing-114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Authenticate exact parent and delivered sibling heads
        shell: bash
        run: |
          set -euo pipefail
          fetch_and_check() {
            local branch="$1" expected_head="$2" path="$3" expected_blob="$4"
            git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
            actual_head="$(git rev-parse "refs/remotes/origin/${branch}")"
            test "${actual_head}" = "${expected_head}"
            actual_blob="$(git rev-parse "${expected_head}:${path}")"
            test "${actual_blob}" = "${expected_blob}"
          }

          fetch_and_check \
            'kokuno-agent5/pulse-mj-physical-harmonic-rf31-routing-114' \
            'f69f5842ea77d0837fc47ed9036b2e7cf799d101' \
            'src/openai_ns_reconstruction/kokuno_a5_pulse_mj_physical_harmonic_rf31_routing.py' \
            '4a0d14b06301b8d2db6f5925676f29eea38e3c52'
          fetch_and_check \
            'agent1/current-cartesian-pulse-end-20260922' \
            '3b4af71c4ab547bc11f9f3e320afa4b62c25b930' \
            'src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_pulse_end_compensated.py' \
            '4b8fad0781d74c934b6cc6fe7805a11d16807a92'
          fetch_and_check \
            'codex/k2-osc-103-axis-safe-physical-velocity' \
            '1693c6b0e0e337e7fab3914bbcfcab8ad54bbf3a' \
            'src/openai_ns_reconstruction/kokuno_source_axis_safe_physical_velocity.py' \
            '9067cb68dc49e08a3da7aaa429366f11d2073cdd'
          fetch_and_check \
            'agent3/rf34-rf39-compact-mean-correction-20260922' \
            'ecbc7e3702e366a5f355800dd662b11766273a41' \
            'src/openai_ns_reconstruction/kokuno_rf34_rf39_compact_mean_correction.py' \
            '392975eafd3787c91e2dc82ad9b735567513271d'
          fetch_and_check \
            'agent3/current-i4-radial-force-20260921' \
            '922f7aa10460ded44af212d313eceff33a2ac647' \
            'src/openai_ns_reconstruction/kokuno_current_i4_nonlinear_radial_force.py' \
            'e28eac6f7fb7f3191a024b052bcf677cff8d74d2'
          fetch_and_check \
            'kokuno-agent4/current-i4-radial-force-independent-audit-116' \
            'add922982c2f3a4cf5a72d84910817e63f05c487' \
            'src/openai_ns_reconstruction/kokuno_a4_current_i4_radial_force_independent_audit.py' \
            'c254b248e2703eaec1c4f757657ca40b9e211c7d'

      - name: Authenticate corrected public source provenance
        uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Verify corrected source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = '143f6773feb424ad9ed3a8d116653200f20346b7'
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = '205a99807302e21a51c5eaf223390c0dfc42bcd0'

      - name: Enforce minimal three-file Agent-5 delta
        shell: bash
        run: |
          set -euo pipefail
          parent='f69f5842ea77d0837fc47ed9036b2e7cf799d101'
          git merge-base --is-ancestor "${parent}" HEAD
          test "$(git rev-list --count "${parent}"..HEAD)" -eq 3
          mapfile -t changed < <(git diff --name-only "${parent}..HEAD" | sort)
          expected=(
            '.github/workflows/kokuno-agent5-xi13-axissafe-rf39-routing.yml'
            'src/openai_ns_reconstruction/kokuno_a5_xi13_axissafe_rf39_routing.py'
            'tests/test_kokuno_a5_xi13_axissafe_rf39_routing.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --diff-filter=D --name-only "${parent}..HEAD")"

      - name: Run focused parent and new Agent-5 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a5_xi13_axissafe_rf39_routing.py \
            tests/test_kokuno_a5_xi13_axissafe_rf39_routing.py
          pytest -q \
            tests/test_kokuno_a5_pulse_mj_physical_harmonic_rf31_routing.py \
            tests/test_kokuno_a5_xi13_axissafe_rf39_routing.py

      - name: Materialize deterministic routing artifact
        run: |
          mkdir -p artifacts/kokuno/agent5
          python -m openai_ns_reconstruction.kokuno_a5_xi13_axissafe_rf39_routing \
            --output artifacts/kokuno/agent5/xi13_axissafe_rf39_routing.json

      - name: Upload registration artifact before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-xi13-axissafe-rf39-routing-v115
          path: artifacts/kokuno/agent5/xi13_axissafe_rf39_routing.json
          if-no-files-found: error

      - name: Final fail-closed truth enforcement
        run: |
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_a5_xi13_axissafe_rf39_routing import load_registration
          reg = load_registration('artifacts/kokuno/agent5/xi13_axissafe_rf39_routing.json')
          truth = reg['truth_boundary']
          gates = reg['frozen_gates']
          a1 = reg['frontiers']['leading']
          a2 = reg['frontiers']['source_axis_safe_harmonic_sibling']
          a3 = reg['frontiers']['rf34_rf39_mechanics_sibling']
          a4 = reg['frontiers']['current_i4_radial_force_validator']

          assert a1['pr'] == 1133 and a1['public_pulse_endpoint_xi'] == 13.0
          assert truth['current_cartesian_end_compensation_composed'] is True
          assert truth['terminal_global_leading_velocity_materialized'] is False
          assert truth['matching_xi13_agent2_project_composite_materialized'] is False
          assert a2['provider_driven_velocity_xyzt_materialized'] is True
          assert a2['self_contained_velocity_xyzt_provider'] is False
          assert truth['latest_self_contained_project_composite_is_agent2_1117'] is True
          assert a3['rf34_rf39_compact_realization_executable'] is True
          assert a3['current_i4_source_chart_backend_materialized'] is False
          assert a3['current_i4_rf30_defect_materialized'] is False
          assert a3['current_i4_rf34_rf39_correction_materialized'] is False
          assert a4['pr'] == 1127
          assert a4['scoped_gate_passed'] is None
          assert a4['scientifically_admitted'] is False
          assert truth['complete_candidate_api_ready'] is False
          assert truth['complete_identity_bound_ns_defect_materialized'] is False
          assert truth['pde_validated'] is False
          assert reg['core_state'] == {
              'leading_ready': False,
              'oscillatory_ready': True,
              'correction_ready': False,
              'velocity_export_ready': False,
              'pde_validated': False,
          }
          assert gates['normalized_momentum_sampled_max'] == 1e-3
          assert gates['normalized_momentum_volume_l2'] == 1e-3
          assert gates['normalized_divergence_sampled_max'] == 1e-5
          assert gates['normalized_divergence_volume_l2'] == 1e-5
          assert gates['canonical_quadrature'] == [24, 48, 96]
          assert gates['residual_defined_free_forcing_allowed'] is False
          PY
