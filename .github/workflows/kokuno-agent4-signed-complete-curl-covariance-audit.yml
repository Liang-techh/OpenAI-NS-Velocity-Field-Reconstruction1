name: kokuno-agent4-signed-complete-curl-covariance-audit

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_agent4_signed_complete_curl_covariance_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_source_signed_complete_curl_family.py'
      - 'tests/test_constrained_kokuno_agent4_signed_complete_curl_covariance_audit.py'
      - 'tests/test_constrained_kokuno_source_signed_complete_curl_family.py'
      - '.github/workflows/kokuno-agent4-signed-complete-curl-covariance-audit.yml'
  workflow_dispatch:

jobs:
  signed-complete-curl-covariance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile audit source
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_agent4_signed_complete_curl_covariance_audit.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_signed_complete_curl_family.py
          tests/test_constrained_kokuno_agent4_signed_complete_curl_covariance_audit.py
      - name: Generate independent audit receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_agent4_signed_complete_curl_covariance_audit
          --output artifacts/constrained/kokuno_agent4_signed_complete_curl_covariance_audit.json
      - name: Display scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/constrained/kokuno_agent4_signed_complete_curl_covariance_audit.json')
          r = json.loads(p.read_text())
          print('local_physical_covariance_preflight_passed=', r['local_physical_covariance_preflight_passed'])
          print(json.dumps(r['metrics'], indent=2, sort_keys=True))
          PY
      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-signed-complete-curl-covariance-audit-v1
          path: artifacts/constrained/kokuno_agent4_signed_complete_curl_covariance_audit.json
