name: kokuno-agent5-same-cycle-defect-routing

on:
  push:
    branches:
      - codex/kokuno-a5-same-cycle-defect-routing-v47
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py'
      - 'src/openai_ns_reconstruction/kokuno_same_cycle_defect_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_same_cycle_defect_contract.py'
      - 'tests/test_constrained_kokuno_same_cycle_defect_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-same-cycle-defect-routing.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  same-cycle-defect-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile producer and Agent-5 router
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_routing_checkpoint.py
      - name: Focused warnings-as-errors regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_same_cycle_defect_contract.py
          tests/test_constrained_kokuno_same_cycle_defect_routing_checkpoint.py
      - name: Generate deterministic Agent-5 routing checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_same_cycle_defect_routing_checkpoint
          --output kokuno_agent5_same_cycle_defect_routing_v47.json
      - name: Validate fail-closed routing and fixed final gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_same_cycle_defect_routing_checkpoint import validate_checkpoint

          path = Path('kokuno_agent5_same_cycle_defect_routing_v47.json')
          checkpoint = json.loads(path.read_text())
          validate_checkpoint(checkpoint)
          s = checkpoint['states']
          assert s['same_cycle_momentum_defect_contract_ready'] is True
          assert s['actual_momentum_defect_formula_executable'] is True
          assert s['same_cycle_identity_enforced'] is True
          assert s['restricted_forcing_provider_required'] is True
          assert s['heldin_heldout_disjointness_enforced'] is True
          assert s['restricted_forcing_semantics_independently_validated'] is False
          assert s['real_full_candidate_defect_consumed'] is False
          assert s['correction_ready'] is False
          assert s['candidate_artifact_instantiated'] is False
          assert s['formal_full_domain_pde_gate_assessed'] is False
          assert s['pde_validated'] is False
          assert checkpoint['formal_gates_unchanged']['held_out_normalized_momentum_max'] == 1e-3
          assert checkpoint['formal_gates_unchanged']['held_out_normalized_momentum_l2'] == 1e-3
          assert checkpoint['formal_gates_unchanged']['held_out_divergence_max'] == 1e-5
          assert checkpoint['formal_gates_unchanged']['held_out_divergence_l2'] == 1e-5
          print('checkpoint_sha256=', checkpoint['checkpoint_sha256'])
          print('agent3_analytic_error=', checkpoint['upstream']['agent3_same_cycle_defect_contract']['analytic_maximum_absolute_error'])
          print('full_kokuno_same_protocol_residual=', checkpoint['baseline_vs_kokuno']['kokuno_full_same_protocol_residual_available'])
          PY
      - name: Upload Agent-5 routing checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-same-cycle-defect-routing-checkpoint-v47
          path: kokuno_agent5_same_cycle_defect_routing_v47.json
