name: kokuno-agent3-independent-oscillatory-admission

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_independent_oscillatory_admission.py'
      - 'tests/test_constrained_kokuno_independent_oscillatory_admission.py'
      - '.github/workflows/kokuno-agent3-independent-oscillatory-admission.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_independent_oscillatory_admission.py'
      - 'tests/test_constrained_kokuno_independent_oscillatory_admission.py'
      - '.github/workflows/kokuno-agent3-independent-oscillatory-admission.yml'

permissions:
  contents: read

jobs:
  independent-oscillatory-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-3 admission tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_independent_oscillatory_admission.py
      - name: Compile admission module
        run: >-
          python -m py_compile
          src/openai_ns_reconstruction/kokuno_independent_oscillatory_admission.py
