name: kokuno-agent4-pa10-source-axis-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-source-axis-independent-audit-050
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-source-axis-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-source-axis-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_axis_domain.py \
            src/openai_ns_reconstruction/kokuno_agent4_pa10_source_axis_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_axis_domain.py \
            tests/test_constrained_kokuno_agent4_pa10_source_axis_audit.py
      - name: Generate exact-head independent receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_agent4_pa10_source_axis_audit \
            --output artifacts/kokuno_agent4/pa10_source_axis_audit/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_source_axis_audit/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          assert payload['source_axis_domain_independent_preflight_passed'] is True
          assert payload['failed_guards'] == []
          assert payload['real_axis']['nonvacuous_K_and_Hsmall'] is True
          assert payload['real_axis']['PA8_independent_sampling_passed'] is True
          assert payload['complex_zero_exclusion']['independent_zero_exclusion_passed'] is True
          assert payload['g_coefficient_norm']['independent_norm_domination_passed'] is True
          assert all(payload['mutation'].values())
          truth = payload['truth_boundary']
          assert truth['source_Phi_radius_one_ball_norm_machine_bound'] is False
          assert truth['source_R1_R2_machine_bound'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['formal_full_domain_pde_gate_assessed'] is False
          assert truth['pde_validated'] is False
          gates = payload['frozen_protocol']['final_project_gates_unchanged']
          assert gates['normalized_momentum_max'] == 1.0e-3
          assert gates['normalized_momentum_L2'] == 1.0e-3
          assert gates['divergence_max'] == 1.0e-5
          assert gates['divergence_L2'] == 1.0e-5
          print('receipt_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('real_finest=', payload['real_axis']['levels'][-1])
          print('complex=', payload['complex_zero_exclusion'])
          print('g=', payload['g_coefficient_norm'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-source-axis-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_source_axis_audit/report.json
