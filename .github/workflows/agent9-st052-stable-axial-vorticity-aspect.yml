name: agent9-st052-stable-axial-vorticity-aspect

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_identity_bound_axial_vorticity_aspect.py'
      - 'tests/test_st052_stable_identity_bound_axial_vorticity_aspect.py'
      - '.github/workflows/agent9-st052-stable-axial-vorticity-aspect.yml'
  push:
    branches: ['agent9/st052-stable-axial-rerun-109']
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_identity_bound_axial_vorticity_aspect.py'
      - 'tests/test_st052_stable_identity_bound_axial_vorticity_aspect.py'
      - '.github/workflows/agent9-st052-stable-axial-vorticity-aspect.yml'

permissions:
  contents: read

jobs:
  exact-source-st052-stable-axial-aspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact Agent-9 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact event-head checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Checkout accepted constrained ST052 runtime lineage
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 6a293b3c870d70b8d8aece1b12d68685c9b8b010
          path: constrained-st052
          persist-credentials: false

      - name: Checkout exact ST052 source runtime
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: b3b8bfdbe1077f9ec967d158602951997d81e17d
          path: source-st052
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused numerical/test runtime
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'

      - name: Run fresh stable-axial regressions
        run: PYTHONPATH=src python -m pytest -q -W error tests/test_st052_stable_identity_bound_axial_vorticity_aspect.py

      - name: Materialize exact parent while retaining expected momentum rejection
        shell: bash
        run: |
          mkdir -p outputs
          set +e
          (
            cd source-st052
            python experiments/root_st052/replay_st052.py \
              --out ../outputs/ST052-M-parent \
              --seed 9175291 \
              --validate
          )
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('outputs/ST052-M-parent/validation.json').read_text())
          assert report['pde_validated'] is False
          assert report['all_numeric_gates_pass'] is False
          assert report['gates']['momentum_max'] is False
          assert report['gates']['momentum_L2'] is False
          print('Exact ST052 parent retained expected momentum rejection.')
          PY

      - name: Rebuild authenticated legacy whole-child bundle
        run: |
          PYTHONPATH=constrained-st052/src python constrained-st052/scripts/verify_st052_linear_temporal_capsule.py \
            --source-root source-st052 \
            --parent-dir outputs/ST052-M-parent \
            --out outputs \
            --report outputs/ST052-M-linear-temporal-child-v1/capsule_receipt.json

      - name: Execute fresh stable-identity-bound axial aspect diagnostic
        run: |
          mkdir -p outputs/ST052-M-stable-identity-bound-axial-aspect
          PYTHONPATH=src python -m openai_ns_reconstruction.st052_stable_identity_bound_axial_vorticity_aspect \
            --constrained-root constrained-st052 \
            --source-root source-st052 \
            --bundle-dir outputs/ST052-M-linear-temporal-child-v1 \
            --report outputs/ST052-M-stable-identity-bound-axial-aspect/receipt.json \
            | tee outputs/ST052-M-stable-identity-bound-axial-aspect/summary.txt

      - name: Assert fresh stable identity and truth boundary
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          p = Path('outputs/ST052-M-stable-identity-bound-axial-aspect/receipt.json')
          r = json.loads(p.read_text())
          assert r['task_id'] == 'CR-A9-109'
          i = r['stable_candidate_identity']
          assert i['candidate_id'] == 'ST052-M-linear-temporal-child-v1'
          assert i['candidate_semantic_identity_sha256'] == '2b2e743e72e31f69ad4232340f52d48b5759ac8aad1dfb735708112276c0b9c4'
          assert i['velocity_semantic_identity_sha256'] == '7738013a4fe4cacbfebfb4e8822bb4ee815b1d3bab744b90f9473ad9424f4f41'
          m = r['measurement']['metrics']
          assert math.isfinite(m['full_axial_rms']) and m['full_axial_rms'] > 0.0
          assert math.isfinite(m['full_radial_rms']) and m['full_radial_rms'] > 0.0
          assert math.isfinite(m['full_aspect_ratio']) and m['full_aspect_ratio'] > 0.0
          assert r['public_observable']['numerical_target'] is None
          assert r['protocol']['source_numeric_targets_used'] is False
          assert r['protocol']['renderer_or_camera_used'] is False
          assert r['materialization_join']['included_in_measurement_binding'] is False
          assert r['truth_boundary']['historical_cr_a9_104_receipt_reused'] is False
          assert r['truth_boundary']['stable_semantic_identity_bound'] is True
          assert r['truth_boundary']['axial_stretching_correspondence_verified'] is False
          assert r['truth_boundary']['visualization_ready'] is False
          assert r['truth_boundary']['pde_validated'] is False
          print('candidate_semantic=', i['candidate_semantic_identity_sha256'])
          print('velocity_semantic=', i['velocity_semantic_identity_sha256'])
          print('fresh_legacy_materialization=', r['materialization_join']['legacy_whole_candidate_identity_sha256'])
          print('full_aspect_ratio=', m['full_aspect_ratio'])
          print('axially_elongated_proxy=', m['axially_elongated_proxy'])
          print('measurement_sha256=', r['measurement_sha256'])
          PY

      - name: Upload fresh stable axial-aspect receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST052-M-stable-identity-bound-axial-vorticity-aspect
          path: outputs/ST052-M-stable-identity-bound-axial-aspect/
          if-no-files-found: error
