name: kokuno-agent2-homogeneous-spatial-sensitivity

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_homogeneous_spatial_sensitivity.py'
      - 'tests/test_constrained_kokuno_source_homogeneous_spatial_sensitivity.py'
      - '.github/workflows/kokuno-agent2-homogeneous-spatial-sensitivity.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_homogeneous_spatial_sensitivity.py'
      - 'tests/test_constrained_kokuno_source_homogeneous_spatial_sensitivity.py'
      - '.github/workflows/kokuno-agent2-homogeneous-spatial-sensitivity.yml'

permissions:
  contents: read

jobs:
  homogeneous-spatial-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused homogeneous spatial-sensitivity tests
        run: python -m pytest -q -s -W error tests/test_constrained_kokuno_source_homogeneous_spatial_sensitivity.py
