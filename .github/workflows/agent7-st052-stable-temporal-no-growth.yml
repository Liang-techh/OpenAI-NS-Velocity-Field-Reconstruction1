name: agent7-st052-stable-temporal-no-growth

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_temporal_no_growth_decision.py'
      - 'tests/test_st052_stable_temporal_no_growth_decision.py'
      - '.github/workflows/agent7-st052-stable-temporal-no-growth.yml'
  push:
    branches: ['agent7/st052m-stable-temporal-no-growth-145']
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_temporal_no_growth_decision.py'
      - 'tests/test_st052_stable_temporal_no_growth_decision.py'
      - '.github/workflows/agent7-st052-stable-temporal-no-growth.yml'

permissions:
  contents: read
  actions: read

jobs:
  exact-admitted-receipt-temporal-no-growth:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Agent-7 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact event-head checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test runtime
        run: python -m pip install 'pytest>=8,<10'

      - name: Run focused fail-closed regressions
        run: PYTHONPATH=src python -m pytest -q -W error tests/test_st052_stable_temporal_no_growth_decision.py

      - name: Download exact successful upstream morphology receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upstream outputs
          gh run download 35745851137 \
            --repo Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1 \
            --name ST052-M-stable-core-contraction-speed \
            --dir upstream
          test -f upstream/receipt.json

      - name: Authenticate admitted evidence and materialize no-growth decision
        run: |
          PYTHONPATH=src python -m openai_ns_reconstruction.st052_stable_temporal_no_growth_decision \
            --receipt upstream/receipt.json \
            --report outputs/temporal_no_growth_decision.json

      - name: Assert bounded truth and routing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('outputs/temporal_no_growth_decision.json').read_text())
          assert r['task_id'] == 'CR003-ST052M-STABLE-TEMPORAL-NO-GROWTH-145'
          assert r['issue'] == 1231
          assert r['upstream']['pr'] == 1222
          assert r['upstream']['successful_exact_head_run'] == 35745851137
          assert r['upstream']['measurement_sha256'] == 'f8595de192fe1e54c56d92269a35ebfb874ee2658726a98071e50ad954b32c7c'
          d = r['decision']
          assert d['coarse_missing_shrink_speedup_trigger_closed'] is True
          assert d['new_temporal_basis_authorized_from_this_observable'] is False
          assert d['sixth_basis_authorized'] is False
          assert d['coefficient_selection_authorized'] is False
          assert d['candidate_mutation_authorized'] is False
          assert d['existing_offgrid_temporal_capacity_pr'] == 1178
          assert d['offgrid_capacity_promotion_authorized'] is False
          t = r['truth_boundary']
          assert t['velocity_changed'] is False
          assert t['basis_dimension_changed'] is False
          assert t['visualization_fingerprint_direct_improvement'] == 0.0
          assert t['visualization_ready'] is False
          assert t['pde_validated'] is False
          print('widths=', r['authenticated_evidence']['widths'])
          print('peak_speeds=', r['authenticated_evidence']['peak_speeds'])
          print('decision=', d['next_step'])
          PY

      - name: Upload decision receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST052-M-stable-temporal-no-growth-decision
          path: outputs/temporal_no_growth_decision.json
          if-no-files-found: error
