name: kokuno-agent5-source-leading-admission-firewall-v2

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v2.py"
      - "tests/test_kokuno_a5_source_leading_admission_firewall_v2.py"
      - ".github/workflows/kokuno-agent5-source-leading-admission-firewall-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-source-leading-admission-firewall-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-leading-admission-firewall-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile v1 and v2 admission firewalls
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall.py
          src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v2.py
      - name: Run focused warnings-as-errors regressions
        run: >-
          python -m pytest -q -W error
          tests/test_kokuno_a5_source_leading_admission_firewall.py
          tests/test_kokuno_a5_source_leading_admission_firewall_v2.py
      - name: Generate exact-head fail-closed admission receipt
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python -W error -m openai_ns_reconstruction.kokuno_a5_source_leading_admission_firewall_v2 \
            --exact-head "$HEAD_SHA" \
            --output artifacts/kokuno_agent5_source_leading_admission_firewall_v2.json
      - name: Enforce exact Agent-4 receipts and immutable project gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent5_source_leading_admission_firewall_v2.json')
          r = json.loads(path.read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert r['schema'] == 'kokuno-a5-source-leading-admission-firewall-v2'
          assert r['exact_head'] == head
          assert len(r['receipt_sha256']) == 64

          receipts = r['new_independent_receipts']
          algebraic = receipts['algebraic_r2_ordinary']
          assert algebraic['pr'] == 695
          assert algebraic['head'] == 'c38112a8d0172825119ef4f174b3b57af3a369ea'
          assert algebraic['workflow_id'] == 35465298813
          assert algebraic['workflow_conclusion'] == 'success'
          assert algebraic['artifact_id'] == 10592754015
          assert algebraic['artifact_digest'] == 'sha256:ecc963121d006a8ae1ab064f6c0f91701b92b439b29847ffe43814bb5d0cfb7b'

          derivative = receipts['derivative_r2_ordinary']
          assert derivative['pr'] == 704
          assert derivative['head'] == 'a96bef02c0cb5c2fdc292d4dc340e5eb464f8d42'
          assert derivative['workflow_id'] == 35468474402
          assert derivative['workflow_conclusion'] == 'success'
          assert derivative['artifact_id'] == 10592174398
          assert derivative['artifact_digest'] == 'sha256:deec2ddd2b04f7a6d8dcfd4eba0d743482c90055d5062149891f43d64eed3dfb'

          e = r['evidence']
          assert e['algebraic_r2_ordinary']['producer'] == 'Agent 4'
          assert e['algebraic_r2_ordinary']['pr'] == 695
          assert e['algebraic_r2_ordinary']['workflow_conclusion_at_freeze'] == 'success'
          assert e['algebraic_r2_ordinary']['independently_admitted'] is True
          assert e['derivative_r2_ordinary']['producer'] == 'Agent 4'
          assert e['derivative_r2_ordinary']['pr'] == 704
          assert e['derivative_r2_ordinary']['workflow_conclusion_at_freeze'] == 'success'
          assert e['derivative_r2_ordinary']['independently_admitted'] is True

          s = r['derived_state']
          assert s['source_r2_algebraic_ordinary_slots_independently_admitted'] is True
          assert s['source_r2_derivative_ordinary_slots_independently_admitted'] is True
          assert s['source_r2_all_ordinary_slots_independently_admitted'] is True
          assert s['source_full_post_J1_R2_independently_admitted'] is False
          assert s['all_R1_ordinary_slots_source_bound'] is False
          assert s['global_matched_pressure_materialized'] is False
          assert s['global_leading_velocity_materialized'] is False
          assert s['restricted_forcing_semantics_independently_validated'] is False
          assert s['leading_ready'] is False
          assert s['correction_ready'] is False
          assert s['velocity_export_ready'] is False
          assert s['formal_heldout_pde_gate_assessed'] is False
          assert s['pde_validated'] is False

          assert r['final_project_gates_unchanged'] == {
              'normalized_momentum_max': 1e-3,
              'normalized_momentum_L2': 1e-3,
              'divergence_max': 1e-5,
              'divergence_L2': 1e-5,
          }
          t = r['truth_boundary']
          assert t['single_integration_increment'] == 'admit independently audited ordinary-R2 subsets'
          assert t['agent4_independent_receipt_required'] is True
          assert t['ordinary_r2_subset_is_not_full_post_J1_R2'] is True
          assert t['queued_workflow_treated_as_success'] is False
          assert t['agent1_self_certificate_treated_as_independent_admission'] is False
          assert t['free_residual_defined_forcing_allowed'] is False
          assert t['threshold_relaxed'] is False
          assert t['pde_validated'] is False
          print('exact_head=', head)
          print('receipt_sha256=', r['receipt_sha256'])
          print('derived_state=', s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-source-leading-admission-firewall-v2
          path: artifacts/kokuno_agent5_source_leading_admission_firewall_v2.json
          if-no-files-found: error
