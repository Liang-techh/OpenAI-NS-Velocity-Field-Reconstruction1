name: kokuno-agent1-fixed-kappa-x100

on:
  push:
    branches:
      - codex/kokuno-a1-fixed-kappa-x100-084
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_fixed_kappa_x100.py"
      - "tests/test_kokuno_pa10_fixed_kappa_x100.py"
      - ".github/workflows/kokuno-agent1-fixed-kappa-x100.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-fixed-kappa-x100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-kappa-x100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head and A1 ancestry
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_PARENT: c5ccdb8fd790c62cfb760139e5ec108c26d88a81
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile fixed-kappa continuation
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_fixed_kappa_x100.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_stress_activation_collar.py \
            tests/test_kokuno_pa10_autonomous_reference_ns_x100.py \
            tests/test_kokuno_pa10_fixed_kappa_x100.py
      - name: Emit fixed-kappa X100 receipt
        run: |
          mkdir -p outputs/kokuno-agent1
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_pa10_fixed_kappa_x100 import (
              KokunoPA10FixedKappaContinuationToX100,
          )

          field = KokunoPA10FixedKappaContinuationToX100()
          report = field.report()
          truth = report['truth_boundary']
          geometry = report['geometry']
          probe = report['X100_handoff_probe']

          assert geometry['X_1'] < geometry['X_b_ref'] == 100.0
          assert geometry['selected_kappa0'] == 0.1
          assert np.max(np.abs(np.asarray(probe['F_fixed_kappa'], dtype=float))) > 1.0e-12
          assert np.max(np.abs(np.asarray(probe['U_fixed_kappa'], dtype=float))) > 1.0e-12
          assert truth['public_fixed_kappa_continuation_formula_executable'] is True
          assert truth['candidate_side_fixed_kappa_continuation_to_X100_executable'] is True
          assert truth['selected_kappa0_global_source_smallness_admitted'] is False
          assert truth['source_prepared_reference_nsr_materialized'] is False
          assert truth['source_exact_fixed_kappa_continuation_to_X100_materialized'] is False
          assert truth['final_interpolation_to_Xi_materialized'] is False
          assert truth['outer_global_leading_velocity_materialized'] is False
          assert truth['matched_global_pressure_materialized'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          out = Path('outputs/kokuno-agent1/fixed_kappa_x100_receipt.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'semantic_sha256': report['semantic_sha256'],
              'geometry': geometry,
              'X100_handoff_probe': probe,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-fixed-kappa-x100-receipt
          path: outputs/kokuno-agent1/fixed_kappa_x100_receipt.json
          if-no-files-found: warn
