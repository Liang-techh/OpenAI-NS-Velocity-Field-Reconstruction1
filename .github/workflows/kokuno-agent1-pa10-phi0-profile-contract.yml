name: kokuno-agent1-pa10-phi0-profile-contract

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-phi0-profile-contract-066
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_phi0_profile_contract.py"
      - "tests/test_constrained_kokuno_pa10_phi0_profile_contract.py"
      - ".github/workflows/kokuno-agent1-pa10-phi0-profile-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-phi0-profile-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phi0-profile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_axis_domain.py \
            src/openai_ns_reconstruction/kokuno_pa10_leading_axis_profile_contract.py \
            src/openai_ns_reconstruction/kokuno_pa10_phi0_profile_contract.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_leading_axis_profile_contract.py \
            tests/test_constrained_kokuno_pa10_phi0_profile_contract.py
      - name: Generate exact-head Phi0 receipt and reloadable config
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_phi0_profile_contract \
            --output artifacts/kokuno_agent1/pa10_phi0_profile_contract_v1/report.json \
            --config-output artifacts/kokuno_agent1/pa10_phi0_profile_contract_v1/config.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          from openai_ns_reconstruction.kokuno_pa10_phi0_profile_contract import (
              KokunoPA10Phi0ProfileContract,
          )

          root = Path('artifacts/kokuno_agent1/pa10_phi0_profile_contract_v1')
          report_path = root / 'report.json'
          config_path = root / 'config.json'
          payload = json.loads(report_path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          report_path.write_text(raw)

          contract = KokunoPA10Phi0ProfileContract.load_configuration(config_path)
          assert contract.configuration() == payload['configuration']
          mapping = payload['coordinate_contract']
          assert mapping['native_similarity_coordinates'] == ['Y', 'eta']
          assert mapping['repository_X_identification_asserted'] is False
          assert mapping['physical_F_from_Phi_mapping_resolved'] is False

          checks = payload['machine_checks']
          assert checks['Phi0_axis_value_exact_one_on_probe'] is True
          assert checks['Phi0_nontrivial_off_axis_on_probe'] is True
          assert checks['f0_source_ode_max_abs_error'] < 2e-14
          assert checks['all_profile_values_finite'] is True
          assert payload['numerical_realization']['maximum_probe_tail_upper'] < 1e-140

          truth = payload['truth_boundary']
          assert truth['source_native_phi0_contraction_center_executable'] is True
          assert truth['source_native_phi0_analytic_derivatives_executable'] is True
          assert truth['source_phi0_is_contraction_center_not_final_corrected_Phi'] is True
          assert truth['repository_X_identified_with_source_Y'] is False
          assert truth['physical_F_from_Phi_mapping_resolved'] is False
          assert truth['fixed_point_correction_materialized'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['complete_kokuno_composite_velocity'] is False
          assert truth['unified_cartesian_velocity_export_ready'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('machine_checks=', checks)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-phi0-profile-contract-v1
          path: artifacts/kokuno_agent1/pa10_phi0_profile_contract_v1/
          if-no-files-found: error
