name: kokuno-agent4-pa10-source-r1-hstar-phi-eta-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-r1-hstar-phi-eta-independent-audit-063
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_r1_hstar_phi_eta_independent_audit.py"
      - "tests/test_constrained_kokuno_pa10_source_r1_hstar_phi_eta_independent_audit.py"
      - ".github/workflows/kokuno-agent4-pa10-source-r1-hstar-phi-eta-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-source-r1-hstar-phi-eta-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-hstar-phi-eta-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "expected_head=${EXPECTED_HEAD}"
          echo "actual_head=${ACTUAL_HEAD}"
          test "${ACTUAL_HEAD}" = "${EXPECTED_HEAD}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_derivative_ordinary_slots.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_hstar_phi_eta_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_hstar_phi_eta_independent_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_derivative_ordinary_slots.py \
            tests/test_constrained_kokuno_pa10_source_r1_hstar_phi_eta_ordinary_slot.py \
            tests/test_constrained_kokuno_pa10_source_r1_hstar_phi_eta_independent_audit.py
      - name: Generate independent Agent-4 receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_r1_hstar_phi_eta_independent_audit \
            --output artifacts/kokuno_agent4/pa10_source_r1_hstar_phi_eta_independent_audit_v1/report.json
      - name: Bind exact head and enforce immutable truth boundary
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(
              'artifacts/kokuno_agent4/'
              'pa10_source_r1_hstar_phi_eta_independent_audit_v1/report.json'
          )
          payload = json.loads(path.read_text())
          assert payload['audited_agent1_pr'] == 741
          assert payload['audited_agent1_exact_head'] == '20b600e7bf34aef63cecf74715180e7e06da231d'
          assert payload['passed'] is True
          assert payload['failed_guards'] == []
          assert all(payload['negative_controls'].values())
          assert all(
              1.0 <= value <= 1.01
              for value in payload['public_to_independent_ratios'].values()
          )

          stress = payload['fresh_offgrid_Hstar_stress']
          assert stress['finite'] is True
          assert stress['dominated'] is True
          assert stress['nontrivial'] is True
          assert stress['j0_pm_0p1_percent_response'] > 0.0
          assert stress['quadratic_sign_mutation_detected'] is True

          gates = payload['project_gates_unchanged']
          assert gates['normalized_momentum_max'] == 1.0e-3
          assert gates['normalized_momentum_L2'] == 1.0e-3
          assert gates['divergence_max'] == 1.0e-5
          assert gates['divergence_L2'] == 1.0e-5
          assert gates['free_residual_defined_forcing_allowed'] is False

          truth = payload['truth_boundary']
          assert truth['source_R1_Hstar_Phi_eta_ordinary_slot_independently_audited'] is True
          assert truth['source_R1_all_ordinary_slots_independently_admitted'] is False
          assert truth['source_full_post_J2_R1_independently_admitted'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['pde_validated'] is False

          payload['exact_head'] = os.environ['EXPECTED_HEAD']
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('ratios=', payload['public_to_independent_ratios'])
          print('independent_values=', payload['independent_values'])
          print('stress=', stress)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-source-r1-hstar-phi-eta-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_source_r1_hstar_phi_eta_independent_audit_v1/report.json
          if-no-files-found: error
