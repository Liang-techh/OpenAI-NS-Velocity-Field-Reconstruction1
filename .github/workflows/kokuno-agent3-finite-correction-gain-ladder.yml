name: kokuno-agent3-finite-correction-gain-ladder

on:
  push:
    branches:
      - codex/kokuno-a3-gain-ladder-050
  pull_request:
    paths:
      - "configs/constraints.json"
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_damping.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_gain_ladder.py"
      - "tests/test_constrained_kokuno_same_cycle_defect_contract.py"
      - "tests/test_constrained_kokuno_finite_correction_cycle_contract.py"
      - "tests/test_constrained_kokuno_finite_correction_cycle_ledger.py"
      - "tests/test_constrained_kokuno_finite_correction_damping.py"
      - "tests/test_constrained_kokuno_finite_correction_gain_ladder.py"
      - ".github/workflows/kokuno-agent3-finite-correction-gain-ladder.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-finite-correction-gain-ladder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-gain-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent-3 finite correction chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py
          src/openai_ns_reconstruction/kokuno_finite_correction_damping.py
          src/openai_ns_reconstruction/kokuno_finite_correction_gain_ladder.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_same_cycle_defect_contract.py
          tests/test_constrained_kokuno_finite_correction_cycle_contract.py
          tests/test_constrained_kokuno_finite_correction_cycle_ledger.py
          tests/test_constrained_kokuno_finite_correction_damping.py
          tests/test_constrained_kokuno_finite_correction_gain_ladder.py
      - name: Emit deterministic gain-ladder receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_finite_correction_gain_ladder
          --output artifacts/kokuno_agent3_finite_correction_gain_ladder_v1.json
      - name: Check frozen derivative-ladder truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/kokuno_agent3_finite_correction_gain_ladder_v1.json').read_text())
          assert r['schema'] == 'kokuno-a3-finite-correction-gain-ladder-v1'
          assert r['provenance']['parent_agent3_pr'] == 650
          assert r['provenance']['parent_agent3_head'] == '2a743997d4883967c6b7930e150df773c86d922e'
          q = r['analytic_mechanics_regression']['report']
          assert q['selected_alpha'] == .5
          assert q['alpha_selected_at_spatial_step'] == .005
          assert q['project_derivative_steps'] == [.02, .01, .005]
          assert q['heldout_used_for_alpha_selection'] is False
          assert q['alpha_retuned_across_derivative_steps'] is False
          assert q['all_derivative_levels_gain_guard_passed'] is True
          assert len(q['levels']) == 3
          for level in q['levels']:
              assert abs(level['held_in_rms_ratio'] - .2) <= 2e-9
              assert abs(level['held_out_rms_ratio'] - .2) <= 2e-9
              assert level['finite_step_gain_guard_passed'] is True
          b = r['truth_boundary']
          assert b['project_derivative_ladder_gain_audit_executable'] is True
          assert b['project_thresholds_fail_closed_against_config_drift'] is True
          assert b['sampled_rms_relabelled_as_volume_weighted_project_l2'] is False
          assert b['formal_kokuno_correction_cycle_gain_bound_claimed'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['real_candidate_finite_correction_cycle_run'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed_for_real_candidate'] is False
          assert b['pde_validated'] is False
          assert b['final_normalized_momentum_max_gate'] == 1e-3
          assert b['final_normalized_momentum_l2_gate'] == 1e-3
          assert b['final_normalized_divergence_max_gate'] == 1e-5
          assert b['final_normalized_divergence_l2_gate'] == 1e-5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-finite-correction-gain-ladder-v1
          path: artifacts/kokuno_agent3_finite_correction_gain_ladder_v1.json
          if-no-files-found: error
      - name: Comment exact gain-ladder receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_finite_correction_gain_ladder_v1.json', 'utf8'));
            const q = r.analytic_mechanics_regression.report;
            const lines = [
              '### Kokuno Agent 3 exact-head derivative-ladder correction-gain audit',
              '',
              `selected alpha (held-in, finest h only): **${q.selected_alpha}**`,
              `frozen derivative ladder: **${JSON.stringify(q.project_derivative_steps)}**`,
              `held-out RMS factors: **${JSON.stringify(q.levels.map(x => x.held_out_rms_ratio))}**`,
              `all registered derivative levels pass actual-defect gain guard: **${q.all_derivative_levels_gain_guard_passed}**`,
              '',
              'The same alpha is replayed without retuning at every registered h. This is an analytic mechanics regression and discretization-robustness guard, not a real Kokuno composite residual reduction, not the volume-weighted final L2 gate, and not a formal correction-cycle theorem.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
