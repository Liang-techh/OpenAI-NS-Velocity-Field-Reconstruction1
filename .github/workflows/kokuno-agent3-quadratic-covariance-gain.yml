name: kokuno-agent3-quadratic-covariance-gain

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_quadratic_covariance_gain_guard.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_coordinate_covariance.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'src/openai_ns_reconstruction/kokuno_family_bounded_inverse.py'
      - 'tests/test_constrained_kokuno_quadratic_covariance_gain_guard.py'
      - 'tests/test_constrained_kokuno_bounded_coordinate_covariance.py'
      - '.github/workflows/kokuno-agent3-quadratic-covariance-gain.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_quadratic_covariance_gain_guard.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_coordinate_covariance.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'src/openai_ns_reconstruction/kokuno_family_bounded_inverse.py'
      - 'tests/test_constrained_kokuno_quadratic_covariance_gain_guard.py'
      - 'tests/test_constrained_kokuno_bounded_coordinate_covariance.py'
      - '.github/workflows/kokuno-agent3-quadratic-covariance-gain.yml'

permissions:
  contents: read

jobs:
  quadratic-covariance-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused quadratic covariance gain tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_quadratic_covariance_gain_guard.py
          tests/test_constrained_kokuno_bounded_coordinate_covariance.py
          tests/test_constrained_kokuno_family_bounded_inverse.py
      - name: Real-defect quadratic covariance report
        run: >-
          python -m openai_ns_reconstruction.kokuno_quadratic_covariance_gain_guard
          --output artifacts/kokuno_agent3/quadratic_covariance_gain_guard_report.json
          --target-output artifacts/kokuno_agent3/quadratic_covariance_gain_guard_target.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-quadratic-covariance-gain
          path: |
            artifacts/kokuno_agent3/quadratic_covariance_gain_guard_report.json
            artifacts/kokuno_agent3/quadratic_covariance_gain_guard_target.json
