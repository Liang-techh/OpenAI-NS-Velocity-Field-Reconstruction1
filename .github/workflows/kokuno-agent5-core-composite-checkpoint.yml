name: kokuno-agent5-core-composite-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_core_composite_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_core_series.py'
      - 'src/openai_ns_reconstruction/kokuno_similarity_coordinates.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_axis_profiles.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_independent_leading_core.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_correction_cycle.py'
      - 'tests/test_constrained_kokuno_core_composite_checkpoint.py'
      - '.github/workflows/kokuno-agent5-core-composite-checkpoint.yml'

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused integration tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_core_composite_checkpoint.py
          tests/test_constrained_kokuno_leading_core_series.py
          tests/test_constrained_kokuno_complete_curl.py
      - name: Generate core-composite checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_core_composite_checkpoint
          --output-dir artifacts/kokuno_agent5/core_composite_checkpoint_v3
          --points 24
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/core_composite_checkpoint_v3/integration_checkpoint.json
      - name: Upload checkpoint bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-core-composite-checkpoint-v3
          path: artifacts/kokuno_agent5/core_composite_checkpoint_v3
