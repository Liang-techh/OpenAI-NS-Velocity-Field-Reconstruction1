name: kokuno-agent3-actual-oscillatory-mean-stress

on:
  push:
    branches:
      - codex/kokuno-a3-actual-osc-mean-stress-039
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_actual_oscillatory_mean_stress.py"
      - "tests/test_constrained_kokuno_actual_oscillatory_mean_stress.py"
      - ".github/workflows/kokuno-agent3-actual-oscillatory-mean-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent3-actual-oscillatory-mean-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-oscillatory-mean-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent-3 module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_actual_oscillatory_mean_stress.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_actual_oscillatory_mean_stress.py
          tests/test_constrained_kokuno_public_oscillatory_time_derivative.py
          tests/test_constrained_kokuno_public_z_pullback_velocity.py
      - name: Generate actual oscillatory mean-stress receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_actual_oscillatory_mean_stress
          --output artifacts/kokuno_agent3_actual_oscillatory_mean_stress_v1.json
          --radial-count 49 --angular-count 48 --time 0.5 --z 0.08
          --fd4-step 0.005 --nu 0.01
      - name: Check fail-closed truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent3_actual_oscillatory_mean_stress_v1.json')
          r = json.loads(p.read_text())
          assert r['provenance']['admitted_agent2_head'] == '732800ce4990464b49c8aa32d0dff4580f6684d4'
          assert r['provenance']['independent_agent4_head'] == '9b0f86012c53fa8e32a19f766dbc150931870425'
          assert r['anti_surrogate_contract']['caller_supplied_target_parameters'] == []
          assert r['anti_surrogate_contract']['surrogate_defect_used'] is False
          t = r['truth_boundary']
          assert t['real_oscillatory_self_defect_component_consumed'] is True
          assert t['real_oscillatory_quadratic_mean_component_measured'] is True
          assert t['oscillatory_requested_stress_component_materialized'] is True
          assert t['full_same_cycle_composite_requested_stress_materialized'] is False
          assert t['candidate_finite_head_mean_debt_materialized'] is False
          assert t['signed_mean_inverse_input_ready'] is False
          assert t['public_velocity_correction_materialized'] is False
          assert t['finite_correction_cycle_rerun_allowed'] is False
          assert t['heldout_ns_residual_assessed'] is False
          assert t['residual_reduction_claimed'] is False
          assert t['pde_validated'] is False
          assert r['mean_operator']['raw_mean_vector_rms'] > 0.0
          assert r['requested_stress_component']['requested_stress_rms'] > 0.0
          print('mean_operator=', r['mean_operator'])
          print('requested_stress_rms=', r['requested_stress_component']['requested_stress_rms'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-actual-oscillatory-mean-stress-v1
          path: artifacts/kokuno_agent3_actual_oscillatory_mean_stress_v1.json
          if-no-files-found: error
