name: kokuno-agent2-source-dr-pulse-bridge

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_dr_pulse_bridge.py'
      - 'tests/test_constrained_kokuno_source_dr_pulse_bridge.py'
      - '.github/workflows/kokuno-agent2-source-dr-pulse-bridge.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_dr_pulse_bridge.py'
      - 'tests/test_constrained_kokuno_source_dr_pulse_bridge.py'
      - '.github/workflows/kokuno-agent2-source-dr-pulse-bridge.yml'

permissions:
  contents: read

jobs:
  source-dr-pulse-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused source Dr pulse bridge tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_source_dr_pulse_bridge.py
