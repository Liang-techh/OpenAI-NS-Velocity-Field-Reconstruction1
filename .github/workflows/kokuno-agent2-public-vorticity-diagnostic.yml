name: kokuno-agent2-public-vorticity-diagnostic

on:
  push:
    branches:
      - codex/kokuno-a2-public-vorticity-diagnostic-045
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py"
      - "tests/test_constrained_kokuno_public_oscillatory_vorticity_diagnostic.py"
      - ".github/workflows/kokuno-agent2-public-vorticity-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent2-public-vorticity-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-vorticity-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_oscillatory_vorticity_diagnostic.py
          tests/test_constrained_kokuno_public_oscillatory_bundle.py
          tests/test_constrained_kokuno_public_z_pullback_velocity.py
      - name: Generate immutable diagnostic receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_public_oscillatory_vorticity_diagnostic
          --output artifacts/kokuno_agent2_public_oscillatory_vorticity_diagnostic_v1.json
      - name: Check provenance and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent2_public_oscillatory_vorticity_diagnostic_v1.json')
          r = json.loads(p.read_text())
          assert r['parent_agent2_head'] == 'dfea7e7297d07154adbb59c30e74c81410cf0d58'
          assert r['velocity_pr'] == 561
          assert r['derivative_resolution_ladder']['steps'] == [0.018, 0.009, 0.0045]
          assert [x['resolution'] for x in r['morphology_resolution_ladder']] == [17, 25, 33]
          assert r['self_diagnostic_passed'] == (r['failed_guards'] == [])
          t = r['truth_boundary']
          assert t['velocity_candidate_changed'] is False
          assert t['oscillatory_coefficients_retuned'] is False
          assert t['source_formula_changed'] is False
          assert t['numerical_fd6_diagnostic_only'] is True
          assert t['independent_agent4_validation_replaced'] is False
          assert t['agent3_momentum_defect_or_correction_duplicated'] is False
          assert t['heldout_ns_momentum_residual_assessed'] is False
          assert t['formal_full_domain_pde_gate_assessed'] is False
          assert t['pde_validated'] is False
          assert t['paper_exact'] is False
          print('identity_sha256=', r['identity_sha256'])
          print('failed_guards=', r['failed_guards'])
          print('fd6_refinement_ratio=', r['derivative_resolution_ladder']['successive_difference_refinement_ratio'])
          print('finest_relative_divergence_rms=', r['derivative_resolution_ladder']['finest_relative_divergence_rms'])
          print('support_exterior_absolute_max=', r['support_exterior_absolute_max'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-public-vorticity-diagnostic-v1
          path: artifacts/kokuno_agent2_public_oscillatory_vorticity_diagnostic_v1.json
          if-no-files-found: error
