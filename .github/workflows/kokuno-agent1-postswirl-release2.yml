name: kokuno-agent1-postswirl-release2

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postswirl_release2.py"
      - "tests/test_kokuno_pa16_current_cartesian_postswirl_release2.py"
      - ".github/workflows/kokuno-agent1-postswirl-release2.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert exact A1 ancestry and minimal three-file scope
        shell: bash
        run: |
          git merge-base --is-ancestor e0cf691884fd371c477de5ae55a18cdabbd72e81 HEAD
          mapfile -t changed < <(git diff --name-only e0cf691884fd371c477de5ae55a18cdabbd72e81...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent1-postswirl-release2.yml"
            "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postswirl_release2.py"
            "tests/test_kokuno_pa16_current_cartesian_postswirl_release2.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Verify pinned corrected-source schedule
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://raw.githubusercontent.com/KokunoYumeto/yang-mills-interacting-workbench/143f6773feb424ad9ed3a8d116653200f20346b7/navier-stokes/navier_stokes_workbench.tex"
          data = urllib.request.urlopen(url, timeout=30).read()
          digest = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          expected = "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          if digest != expected:
              raise SystemExit(f"corrected source blob drifted: {digest} != {expected}")
          text = data.decode("utf-8")
          required = (
              "hold $l=-1$ for $4\\log(1/h)$",
              "and vary from $-1$ to $-h$",
              "in a unit interval, all using $\\sigma$",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"public -1 -> -h schedule missing from pinned source: {missing}")
          print("corrected 2026-09-09 source blob and -1 -> -h unit transition pinned")
          PY

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postswirl_release2.py
          python -m py_compile tests/test_kokuno_pa16_current_cartesian_postswirl_release2.py

      - name: Run parent and new focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa16_current_cartesian_postswirl_lminus1_hold.py \
            tests/test_kokuno_pa16_current_cartesian_postswirl_release2.py

      - name: Emit deterministic release2 receipt
        run: |
          mkdir -p artifacts/kokuno_agent1_postswirl_release2
          python - <<'PY'
          import json, math
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_postswirl_release2 import (
              KokunoPA16CurrentCartesianPostSwirlRelease2,
          )

          root = Path("artifacts/kokuno_agent1_postswirl_release2")
          candidate = KokunoPA16CurrentCartesianPostSwirlRelease2()
          receipt = candidate.release2_report()
          config = candidate.configuration()
          truth = receipt["truth_boundary"]
          h = candidate.h_value

          assert 0.0 < h < 0.01
          assert receipt["parent_child_decimal_seam_exact"] is True
          assert abs(receipt["ell_start"] + 1.0) <= 2e-15
          assert abs(receipt["ell_end"] + h) <= 2e-15
          assert abs(receipt["sigma_integral_end"] - 0.5) <= 2e-14
          assert abs(receipt["E_ratio_end_min"] / math.exp(-1.0 - 0.5*h) - 1.0) <= 1e-12
          assert abs(receipt["F_ratio_end_min"] / math.exp(-1.5 - 0.5*h) - 1.0) <= 1e-12
          assert truth["source_l_minus1_hold_materialized"] is True
          assert truth["source_l_minus1_to_minus_h_transition_materialized"] is True
          assert truth["current_cartesian_l_minus1_to_minus_h_composed"] is True
          assert truth["source_exact_h_recovered"] is False
          assert truth["overflow_safe_log_F_materialized"] is True
          assert truth["decimal_output_encoding_materialized"] is True
          assert truth["end_to_end_96digit_arithmetic_materialized"] is False
          assert truth["source_terminal_multiplier_materialized"] is False
          assert truth["source_exterior_heat_replacement_materialized"] is False
          assert truth["outer_global_leading_velocity_materialized"] is False
          assert truth["unified_global_cartesian_velocity_export_ready"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False
          assert truth["openai_field_identified"] is False

          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload release2 receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-postswirl-release2
          path: artifacts/kokuno_agent1_postswirl_release2/
