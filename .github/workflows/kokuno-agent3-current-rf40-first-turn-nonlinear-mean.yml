name: kokuno-agent3-current-rf40-first-turn-nonlinear-mean

on:
  push:
    branches:
      - codex/kokuno-a3-rf40-first-turn-nonlinear-mean-106
  pull_request:
    branches:
      - codex/kokuno-a3-current-exterior-xr-nonlinear-mean-105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact A3 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a3
          fetch-depth: 0

      - name: Verify A3 parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor fa95dee3709a82326167af1a2cb42b9b5f9a88a5 HEAD
          test "$(git rev-list --count fa95dee3709a82326167af1a2cb42b9b5f9a88a5..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only fa95dee3709a82326167af1a2cb42b9b5f9a88a5..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent3-current-rf40-first-turn-nonlinear-mean.yml \
            src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_nonlinear_mean_attribution.py \
            tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_mean_attribution.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact A3 head
        shell: bash
        run: python -m pip install -e './a3[dev]'

      - name: Run focused A3 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a3/src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_nonlinear_mean_attribution.py \
            a3/tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_mean_attribution.py
          python -m pytest -q -W error \
            a3/tests/test_constrained_kokuno_current_exterior_xr_nonlinear_mean_attribution.py \
            a3/tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_mean_attribution.py

      - name: Check out exact A2 RF40 first-turn composite
        uses: actions/checkout@v4
        with:
          ref: 2a2fad307a674ec1eb5a2bc426c0d01c3a0e7377
          path: a2
          fetch-depth: 1

      - name: Check out exact A1 RF40 first-turn leading
        uses: actions/checkout@v4
        with:
          ref: 23c00b98526e187ff04d432745300a084ec859f2
          path: a1
          fetch-depth: 1

      - name: Authenticate sibling heads and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "2a2fad307a674ec1eb5a2bc426c0d01c3a0e7377"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_leading_oscillatory_identity.py)" = \
            "c126dace161e5dae1745185c79152736817994b8"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = \
            "12df3bf6c949baeebf609b366f2973e7f515a157"
          test "$(git -C a1 rev-parse HEAD)" = "23c00b98526e187ff04d432745300a084ec859f2"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_first_turn.py)" = \
            "bf71948cbdb827d791b86ab8f00496bd1b231961"

      - name: Materialize real current-lineage RF40-first-turn nonlinear mean receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import numpy as np
          import openai_ns_reconstruction

          pkg = openai_ns_reconstruction
          a1_pkg = str(Path('a1/src/openai_ns_reconstruction').resolve())
          a2_pkg = str(Path('a2/src/openai_ns_reconstruction').resolve())
          a3_pkg = str(Path('a3/src/openai_ns_reconstruction').resolve())

          pkg.__path__.insert(0, a1_pkg)
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_rf40_first_turn import (
              KokunoPA16CurrentCartesianRF40FirstTurn,
          )
          leading = KokunoPA16CurrentCartesianRF40FirstTurn()

          pkg.__path__.insert(0, a2_pkg)
          from openai_ns_reconstruction.kokuno_current_rf40_first_turn_leading_oscillatory_identity import (
              CurrentRF40FirstTurnLeadingOscillatoryField,
          )
          from openai_ns_reconstruction.kokuno_oscillatory_batch_differentials import (
              evaluate_oscillatory_batch_differentials,
          )
          field = CurrentRF40FirstTurnLeadingOscillatoryField(leading)

          pkg.__path__.insert(0, a3_pkg)
          from openai_ns_reconstruction.kokuno_current_rf40_first_turn_nonlinear_mean_attribution import (
              ExactCurrentRF40FirstTurnNonlinearBackend,
              materialize_current_rf40_first_turn_nonlinear_mean_attribution,
              truth_boundary,
          )

          backend = ExactCurrentRF40FirstTurnNonlinearBackend.bind(
              field, evaluate_oscillatory_batch_differentials
          )

          inner = materialize_current_rf40_first_turn_nonlinear_mean_attribution(
              backend,
              np.asarray([math.hypot(0.41, -0.17)], dtype=float),
              np.asarray([-0.08], dtype=float),
              np.asarray([0.39], dtype=float),
          )

          X_turn = field.X_R * math.exp(0.35)
          eta_turn = 0.17
          t_turn = 0.53
          q_turn = (1.0 - t_turn) / (1.0 - eta_turn * eta_turn)
          r_turn = math.sqrt(2.0 * q_turn * X_turn)
          z_turn = (q_turn ** field.D) * eta_turn
          first_turn = materialize_current_rf40_first_turn_nonlinear_mean_attribution(
              backend,
              np.asarray([r_turn], dtype=float),
              np.asarray([z_turn], dtype=float),
              np.asarray([t_turn], dtype=float),
          )

          receipt = {
              "inner": inner.to_receipt(),
              "first_turn": first_turn.to_receipt(),
              "first_turn_probe": {
                  "X_over_XR": X_turn / field.X_R,
                  "X_over_X1": X_turn / field.X_1,
                  "eta": eta_turn,
                  "time": t_turn,
              },
              "a3_truth_boundary": truth_boundary(),
          }
          Path('receipts/kokuno_a3_current_rf40_first_turn_nonlinear_mean.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload receipt before gate enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a3-current-rf40-first-turn-nonlinear-mean
          path: receipts/kokuno_a3_current_rf40_first_turn_nonlinear_mean.json
          if-no-files-found: error

      - name: Enforce scoped scientific gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          receipt = json.loads(
              Path('receipts/kokuno_a3_current_rf40_first_turn_nonlinear_mean.json').read_text()
          )
          inner = receipt['inner']
          first_turn = receipt['first_turn']
          expected_kind = 'exact-current-a2-pr992-through-rf40-first-turn-nonlinear-attribution'
          assert inner['backend_kind'] == expected_kind
          assert first_turn['backend_kind'] == expected_kind

          assert inner['pointwise_three_piece_closure_absolute_max'] <= 5e-13
          assert inner['projected_three_piece_closure_absolute_max'] <= 1e-12
          assert inner['quadratic_mean_rms'] > 1e-12
          assert first_turn['pointwise_three_piece_closure_absolute_max'] <= 5e-13
          assert first_turn['projected_three_piece_closure_absolute_max'] <= 1e-12

          probe = receipt['first_turn_probe']
          assert probe['X_over_XR'] > 1.0
          assert probe['X_over_X1'] < 1.0

          backend = inner['agent2_backend']
          assert backend['agent2_composite_pr'] == 992
          assert backend['agent2_composite_head'] == '2a2fad307a674ec1eb5a2bc426c0d01c3a0e7377'
          assert backend['agent1_leading_pr'] == 986
          assert backend['agent1_leading_head'] == '23c00b98526e187ff04d432745300a084ec859f2'

          boundary = receipt['a3_truth_boundary']
          assert boundary['current_leading_plus_oscillation_through_RF40_first_turn_consumed'] is True
          assert boundary['post_XR_RF40_first_turn_velocity_materialized'] is True
          assert boundary['current_RF40_first_turn_mixed_nonlinear_mean_materialized'] is True
          assert boundary['current_RF40_first_turn_quadratic_nonlinear_mean_materialized'] is True
          for key in (
              'velocity_after_RF40_first_turn_materialized',
              'full_post_XR_RF40_current_lineage_materialized',
              'RF40_axial_shutdown_current_lineage_materialized',
              'RF40_lambda_turn_current_lineage_materialized',
              'RF40_power_law_current_lineage_materialized',
              'outer_global_leading_velocity_materialized',
              'radial_inverse_performed_in_this_increment',
              'pressure_gradient_included',
              'restricted_forcing_included',
              'complete_ns_defect',
              'scoped_nonlinear_mean_authorized_as_correction_target',
              'mean_correction_velocity_materialized',
              'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed',
              'residual_reduction_claimed',
              'same_protocol_comparable_to_st006',
              'pde_validated',
              'blowup_proved',
          ):
              assert boundary[key] is False, key
          assert boundary['final_normalized_momentum_gate'] == 1e-3
          assert boundary['final_normalized_divergence_gate'] == 1e-5
          PY
