name: kokuno-agent1-current-exterior-qs-release2

on:
  push:
    branches:
      - agent1/current-exterior-qs-release2-20260922
  pull_request:
    paths:
      - src/openai_ns_reconstruction/kokuno_current_exterior_qs_release2_state.py
      - tests/test_kokuno_current_exterior_qs_release2_state.py
      - .github/workflows/kokuno-agent1-current-exterior-qs-release2.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact ancestry and bounded delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3978560078104bff7c9d5556bd9e658e4874c963 HEAD
          changed="$(git diff --name-only 3978560078104bff7c9d5556bd9e658e4874c963...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/kokuno-agent1-current-exterior-qs-release2.yml' \
            'src/openai_ns_reconstruction/kokuno_current_exterior_qs_release2_state.py' \
            'tests/test_kokuno_current_exterior_qs_release2_state.py' | sort)"
          test "$changed" = "$expected"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Syntax compile
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_current_exterior_qs_release2_state.py \
            tests/test_kokuno_current_exterior_qs_release2_state.py

      - name: Focused regressions
        run: |
          pytest -q \
            tests/test_kokuno_public_ideal_exterior_qs_schedule.py \
            tests/test_kokuno_current_exterior_qs_release2_state.py

      - name: Emit deterministic current-state receipt
        run: |
          python - <<'PY'
          import json
          from openai_ns_reconstruction.kokuno_current_exterior_qs_release2_state import (
              KokunoCurrentExteriorQsRelease2State,
          )
          state = KokunoCurrentExteriorQsRelease2State()
          print(json.dumps(state.report(), indent=2, sort_keys=True, allow_nan=False))
          truth = state.truth_boundary
          assert truth['current_q_s_release2_endpoint_materialized'] is True
          assert truth['source_ideal_q_s_relabelled_as_current'] is False
          assert truth['current_l_minus_h_matching_bridge_materialized'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False
          PY
