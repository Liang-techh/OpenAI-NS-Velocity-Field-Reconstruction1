name: agent7-st052-stable-tip-taper-proxy

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_identity_bound_tip_taper_proxy.py'
      - 'tests/test_st052_stable_identity_bound_tip_taper_proxy.py'
      - '.github/workflows/agent7-st052-stable-tip-taper-proxy.yml'
  push:
    branches: ['agent7/st052m-stable-tip-taper-proxy-141']
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_identity_bound_tip_taper_proxy.py'
      - 'tests/test_st052_stable_identity_bound_tip_taper_proxy.py'
      - '.github/workflows/agent7-st052-stable-tip-taper-proxy.yml'

permissions:
  contents: read

jobs:
  exact-source-st052-stable-tip-taper:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact Agent-7 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact event-head checkout and frozen upstream
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          from pathlib import Path
          text = Path('src/openai_ns_reconstruction/st052_stable_identity_bound_axial_vorticity_aspect.py').read_text()
          assert 'TASK_ID = "CR-A9-109"' in text
          assert 'EXPECTED_STABLE_CANDIDATE_IDENTITY = "2b2e743e72e31f69ad4232340f52d48b5759ac8aad1dfb735708112276c0b9c4"' in text
          assert 'EXPECTED_STABLE_VELOCITY_IDENTITY = "7738013a4fe4cacbfebfb4e8822bb4ee815b1d3bab744b90f9473ad9424f4f41"' in text
          PY

      - name: Checkout accepted constrained ST052 runtime lineage
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 6a293b3c870d70b8d8aece1b12d68685c9b8b010
          path: constrained-st052
          persist-credentials: false

      - name: Checkout exact ST052 source runtime
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: b3b8bfdbe1077f9ec967d158602951997d81e17d
          path: source-st052
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused numerical/test runtime
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'

      - name: Run stable-tip focused regressions
        run: PYTHONPATH=src python -m pytest -q -W error tests/test_st052_stable_identity_bound_tip_taper_proxy.py

      - name: Materialize exact parent while retaining expected momentum rejection
        shell: bash
        run: |
          mkdir -p outputs
          set +e
          (
            cd source-st052
            python experiments/root_st052/replay_st052.py \
              --out ../outputs/ST052-M-parent \
              --seed 9175291 \
              --validate
          )
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('outputs/ST052-M-parent/validation.json').read_text())
          assert report['pde_validated'] is False
          assert report['all_numeric_gates_pass'] is False
          assert report['gates']['momentum_max'] is False
          assert report['gates']['momentum_L2'] is False
          print('Exact ST052 parent retained expected momentum rejection.')
          PY

      - name: Rebuild authenticated legacy whole-child bundle
        run: |
          PYTHONPATH=constrained-st052/src python constrained-st052/scripts/verify_st052_linear_temporal_capsule.py \
            --source-root source-st052 \
            --parent-dir outputs/ST052-M-parent \
            --out outputs \
            --report outputs/ST052-M-linear-temporal-child-v1/capsule_receipt.json

      - name: Execute stable-identity-bound tip taper proxy
        run: |
          mkdir -p outputs/ST052-M-stable-tip-taper-proxy
          PYTHONPATH=src python -m openai_ns_reconstruction.st052_stable_identity_bound_tip_taper_proxy \
            --constrained-root constrained-st052 \
            --source-root source-st052 \
            --bundle-dir outputs/ST052-M-linear-temporal-child-v1 \
            --report outputs/ST052-M-stable-tip-taper-proxy/receipt.json \
            | tee outputs/ST052-M-stable-tip-taper-proxy/summary.txt

      - name: Assert stable identity and truth boundary
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          p = Path('outputs/ST052-M-stable-tip-taper-proxy/receipt.json')
          r = json.loads(p.read_text())
          assert r['task_id'] == 'CR003-ST052M-STABLE-TIP-TAPER-PROXY-141'
          assert r['prereg_issue'] == 1194
          i = r['stable_candidate_identity']
          assert i['candidate_id'] == 'ST052-M-linear-temporal-child-v1'
          assert i['candidate_semantic_identity_sha256'] == '2b2e743e72e31f69ad4232340f52d48b5759ac8aad1dfb735708112276c0b9c4'
          assert i['velocity_semantic_identity_sha256'] == '7738013a4fe4cacbfebfb4e8822bb4ee815b1d3bab744b90f9473ad9424f4f41'
          m = r['measurement']['metrics']
          for key in ('tip_radial_rms_upper', 'tip_radial_rms_lower', 'central_radial_rms', 'worst_tip_radial_rms', 'worst_tip_to_central_ratio'):
              assert math.isfinite(m[key]) and m[key] > 0.0
          assert m['both_tips_radially_tapered_proxy'] is (m['worst_tip_radial_rms'] < m['central_radial_rms'])
          assert r['public_context']['public_numerical_target'] is None
          assert r['protocol']['source_numeric_targets_used'] is False
          assert r['materialization_join']['included_in_measurement_binding'] is False
          assert r['routing']['tip_specific_basis_growth_authorized'] is False
          assert r['routing']['axial_turnover_change_authorized'] is False
          assert r['truth_boundary']['candidate_velocity_changed'] is False
          assert r['truth_boundary']['basis_dimension_changed'] is False
          assert r['truth_boundary']['direct_visualization_fingerprint_improvement'] == 0.0
          assert r['truth_boundary']['visualization_ready'] is False
          assert r['truth_boundary']['pde_validated'] is False
          print('tip_upper=', m['tip_radial_rms_upper'])
          print('tip_lower=', m['tip_radial_rms_lower'])
          print('central=', m['central_radial_rms'])
          print('worst_tip_to_central_ratio=', m['worst_tip_to_central_ratio'])
          print('both_tips_radially_tapered_proxy=', m['both_tips_radially_tapered_proxy'])
          print('routing=', r['routing']['classification'])
          PY

      - name: Upload stable tip-taper receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST052-M-stable-identity-bound-tip-taper-proxy
          path: outputs/ST052-M-stable-tip-taper-proxy/
          if-no-files-found: error
