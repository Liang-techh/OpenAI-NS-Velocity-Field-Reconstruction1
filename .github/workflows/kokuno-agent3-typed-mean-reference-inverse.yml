name: kokuno-agent3-typed-mean-reference-inverse

on:
  push:
    branches:
      - codex/kokuno-a3-typed-reference-inverse-055
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_finite_head_debt.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_inverse_rhs.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_reference_inverse.py"
      - "tests/test_kokuno_typed_mean_inverse_rhs.py"
      - "tests/test_kokuno_typed_mean_reference_inverse.py"
      - ".github/workflows/kokuno-agent3-typed-mean-reference-inverse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-typed-mean-reference-inverse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typed-mean-reference-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile typed actual-defect to reference-inverse chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py
          src/openai_ns_reconstruction/kokuno_typed_mean_finite_head_debt.py
          src/openai_ns_reconstruction/kokuno_typed_mean_inverse_rhs.py
          src/openai_ns_reconstruction/kokuno_typed_mean_reference_inverse.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_kokuno_typed_mean_inverse_rhs.py
          tests/test_kokuno_typed_mean_reference_inverse.py
      - name: Emit deterministic typed reference-inverse receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_typed_mean_reference_inverse
          --output artifacts/kokuno_agent3_typed_mean_reference_inverse_v1.json
      - name: Check no-surrogate reference-inverse truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/kokuno_agent3_typed_mean_reference_inverse_v1.json').read_text())
          assert r['schema'] == 'kokuno-a3-typed-mean-reference-inverse-v1'
          assert r['provenance']['parent_agent3_pr'] == 696
          assert r['provenance']['parent_agent3_head'] == 'a8b87637710df0469333e1c3fec03f3713fe4e0e'
          q = r['analytic_regression']['evaluation']
          assert q['reference_operator']['source_reference_operator_certified'] is False
          assert q['inverse_rhs']['reference_scale']['source_reference_scale_certified'] is False
          h = q['signed_reference_inverse']
          assert h['delta_y_vector_rms'] > 0.0
          assert abs(h['minimum_abs_determinant'] - 12.0) <= 2e-14
          assert abs(h['maximum_condition_number'] - 1.5) <= 2e-14
          assert h['reconstruction_closure_max_abs'] <= 1e-14
          b = r['truth_boundary']
          assert b['raw_same_cycle_providers_required'] is True
          assert b['caller_supplied_inverse_rhs_allowed'] is False
          assert b['caller_supplied_signed_coordinates_allowed'] is False
          assert b['provenance_bearing_reference_operator_required'] is True
          assert b['forbidden_public_parameters_absent'] is True
          assert b['typed_reference_inverse_algebra_executable'] is True
          assert b['source_h_ref_materialized_for_full_candidate'] is False
          assert b['source_epsilon_materialized_for_full_candidate'] is False
          assert b['base_positive_amplitudes_materialized'] is False
          assert b['delta_amplitudes_materialized'] is False
          assert b['signed_mean_inverse_input_ready'] is False
          assert b['public_velocity_correction_materialized'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed'] is False
          assert b['pde_validated'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-typed-mean-reference-inverse-v1
          path: artifacts/kokuno_agent3_typed_mean_reference_inverse_v1.json
          if-no-files-found: error
      - name: Comment exact reference-inverse receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_typed_mean_reference_inverse_v1.json', 'utf8'));
            const q = r.analytic_regression.evaluation;
            const h = q.signed_reference_inverse;
            const lines = [
              '### Kokuno Agent 3 exact-head typed DeltaC/epsilon -> H_ref inverse seam',
              '',
              `signed-reference delta_y vector RMS: **${h.delta_y_vector_rms}**`,
              `minimum |det(H_ref)|: **${h.minimum_abs_determinant}**`,
              `maximum cond(H_ref): **${h.maximum_condition_number}**`,
              `H_ref reconstruction closure max abs: **${h.reconstruction_closure_max_abs}**`,
              '',
              'This receipt recomputes the nonzero actual defect from raw same-cycle fields and solves only an analytic, explicitly non-source-certified H_ref regression operator. Source-certified epsilon/H_ref, base positive amplitudes, delta_a, correction velocity, held-out normalized NS residual reduction, and PDE validation remain unclaimed.'
            ];
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: lines.join('\n')});
