name: kokuno-agent5-source-torus-binding-routing

on:
  push:
    branches:
      - codex/kokuno-a5-source-torus-binding-routing-025
  pull_request:
    branches:
      - codex/kokuno-a4-source-torus-binding-audit-024
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-source-torus-binding-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-2/4/5 source-torus tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_physical_evaluation.py
          tests/test_constrained_kokuno_source_torus_binding_independent.py
          tests/test_constrained_kokuno_source_torus_binding_routing_checkpoint.py
      - name: Generate deterministic Agent-5 checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_source_torus_binding_routing_checkpoint
          --output artifacts/kokuno_agent5/source_torus_binding_routing_checkpoint_v25/checkpoint.json
      - name: Show checkpoint
        run: cat artifacts/kokuno_agent5/source_torus_binding_routing_checkpoint_v25/checkpoint.json
      - name: Upload routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-source-torus-binding-routing-checkpoint-v25
          path: artifacts/kokuno_agent5/source_torus_binding_routing_checkpoint_v25
