name: agent7-compact-poloidal-joint-renorm-report

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_eq45_bipolar_compact_poloidal_joint_renorm.py'
      - 'tests/test_constrained_eq45_bipolar_compact_poloidal_joint_renorm.py'
      - '.github/workflows/agent7-compact-poloidal-joint-renorm-report.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test compact poloidal joint renormalization audit
        run: python -m pytest -q -W error tests/test_constrained_eq45_bipolar_compact_poloidal_joint_renorm.py
      - name: Generate refined joint-renormalization report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.constrained_eq45_bipolar_compact_poloidal_joint_renorm import audit_compact_poloidal_joint_renormalization
          report = audit_compact_poloidal_joint_renormalization(
              trial_magnitude=0.25,
              quadrature_orders=(96, 192),
              morphology_grid_size=25,
          )
          path = Path('artifacts/bipolar_compact_poloidal_joint_renorm/report.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload joint-renormalization report
        uses: actions/upload-artifact@v4
        with:
          name: agent7-compact-poloidal-joint-renorm-report
          path: artifacts/bipolar_compact_poloidal_joint_renorm/report.json
