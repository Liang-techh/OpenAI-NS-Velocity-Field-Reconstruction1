name: kokuno-agent5-current-rf40-first-turn-composite-ingest

on:
  push:
    branches:
      - codex/kokuno-a5-rf40-first-turn-composite-ingest-097
  pull_request:
    branches:
      - codex/kokuno-a5-current-exterior-xr-composite-ingest-096
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact A5 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a5
          fetch-depth: 0

      - name: Verify exact parent ancestry and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a5
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 92def17ccab4192a7bd270a4f4d637138e953266 HEAD
          test "$(git rev-list --count 92def17ccab4192a7bd270a4f4d637138e953266..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only 92def17ccab4192a7bd270a4f4d637138e953266..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent5-current-rf40-first-turn-composite-ingest.yml \
            src/openai_ns_reconstruction/kokuno_a5_current_rf40_first_turn_composite_ingest_contract.py \
            tests/test_kokuno_a5_current_rf40_first_turn_composite_ingest_contract.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install A5 test dependencies
        shell: bash
        run: python -m pip install -e './a5[dev]'

      - name: Compile and run parent plus new A5 fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a5/src/openai_ns_reconstruction/kokuno_a5_current_rf40_first_turn_composite_ingest_contract.py \
            a5/tests/test_kokuno_a5_current_rf40_first_turn_composite_ingest_contract.py
          PYTHONPATH="$PWD/a5/src" python -m pytest -q \
            a5/tests/test_kokuno_a5_current_exterior_xr_composite_ingest_contract.py \
            a5/tests/test_kokuno_a5_current_rf40_first_turn_composite_ingest_contract.py

      - name: Check out exact A2 first-turn composite
        uses: actions/checkout@v4
        with:
          ref: 2a2fad307a674ec1eb5a2bc426c0d01c3a0e7377
          path: a2
          fetch-depth: 1

      - name: Check out exact A3 first-turn nonlinear mean
        uses: actions/checkout@v4
        with:
          ref: 6088e3d3055e2792ba20fbd703fcc238ce1b27b5
          path: a3
          fetch-depth: 1

      - name: Check out exact A4 first-turn independent audit
        uses: actions/checkout@v4
        with:
          ref: 70cd44ed0b5cabbcf5103df8959ff008377d17fa
          path: a4
          fetch-depth: 1

      - name: Check out exact A1 axial-shutdown sibling
        uses: actions/checkout@v4
        with:
          ref: 2ac6460b483efb1c07f2fa65e7fed781a32f2718
          path: a1
          fetch-depth: 1

      - name: Authenticate exact sibling heads and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "2a2fad307a674ec1eb5a2bc426c0d01c3a0e7377"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_leading_oscillatory_identity.py)" = "c126dace161e5dae1745185c79152736817994b8"
          test "$(git -C a2 hash-object tests/test_constrained_kokuno_current_rf40_first_turn_leading_oscillatory_identity.py)" = "173ddce0ce9e1b5e89a663fd450e0fc135e156b3"
          test "$(git -C a2 hash-object .github/workflows/kokuno-agent2-current-rf40-first-turn-leading-oscillatory.yml)" = "6931746518d2e54cf178550f21f0ef0d5b531ead"

          test "$(git -C a3 rev-parse HEAD)" = "6088e3d3055e2792ba20fbd703fcc238ce1b27b5"
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_first_turn_nonlinear_mean_attribution.py)" = "0f0e1f5c31cf33e28fb6f2851c2df7250bc582d1"
          test "$(git -C a3 hash-object tests/test_constrained_kokuno_current_rf40_first_turn_nonlinear_mean_attribution.py)" = "580692ba7045f9c22419b756b4a736253b852edf"
          test "$(git -C a3 hash-object .github/workflows/kokuno-agent3-current-rf40-first-turn-nonlinear-mean.yml)" = "88e565296814e284ff03c36578049ecfe71f66c8"

          test "$(git -C a4 rev-parse HEAD)" = "70cd44ed0b5cabbcf5103df8959ff008377d17fa"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_a4_current_rf40_first_turn_leading_oscillatory_divergence_independent_audit.py)" = "3881a0bb98e6369cf8fde85556c9d7ac0c2db7fc"
          test "$(git -C a4 hash-object tests/test_constrained_kokuno_a4_current_rf40_first_turn_leading_oscillatory_divergence_independent_audit.py)" = "edc7bb9add03adb3babddd9961d1c52e614fd679"
          test "$(git -C a4 hash-object .github/workflows/kokuno-agent4-current-rf40-first-turn-leading-oscillatory-divergence-audit.yml)" = "58fc18ff4fb1410603a7d45a5a07f6e6b83ade8a"

          test "$(git -C a1 rev-parse HEAD)" = "2ac6460b483efb1c07f2fa65e7fed781a32f2718"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_axial_shutdown.py)" = "057a0514c8a941c3e59922b8158f480434b4441e"
          test "$(git -C a1 hash-object tests/test_kokuno_pa16_current_cartesian_rf40_axial_shutdown.py)" = "b1703748f567d7d7d505bf7f2e07aa287a8c0559"
          test "$(git -C a1 hash-object .github/workflows/kokuno-agent1-current-cartesian-rf40-axial-shutdown.yml)" = "a5f485f89456c7171bf3789d11f677c4d800658a"

      - name: Materialize checksum-bound A5 registration receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          head="$(git -C a5 rev-parse HEAD)"
          PYTHONPATH="$PWD/a5/src" python -m \
            openai_ns_reconstruction.kokuno_a5_current_rf40_first_turn_composite_ingest_contract \
            --exact-head "$head" \
            --output receipts/kokuno_a5_current_rf40_first_turn_composite_ingest.json

      - name: Upload registration receipt before any scientific interpretation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a5-current-rf40-first-turn-composite-ingest
          path: receipts/kokuno_a5_current_rf40_first_turn_composite_ingest.json
          if-no-files-found: error

      - name: Re-read and enforce receipt fail closed
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/a5/src" python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction import kokuno_a5_current_rf40_first_turn_composite_ingest_contract as mod

          receipt = json.loads(
              Path("receipts/kokuno_a5_current_rf40_first_turn_composite_ingest.json").read_text(
                  encoding="utf-8"
              )
          )
          mod.verify_contract(receipt)
          assert receipt["truth_boundary"]["agent4_995_independent_first_turn_composite_divergence_audit_admitted"] is False
          assert receipt["truth_boundary"]["heldout_normalized_ns_residual_assessed"] is False
          assert receipt["readiness"]["pde_validated"] is False
          assert receipt["frozen_science"]["residual_defined_free_forcing_forbidden"] is True
          PY
