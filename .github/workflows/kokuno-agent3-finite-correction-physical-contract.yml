name: kokuno-agent3-finite-correction-physical-contract

on:
  push:
    branches:
      - codex/kokuno-a3-finite-correction-physical-contract-083
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_finite_correction_fixed_physical_contract.py"
      - "tests/test_constrained_kokuno_finite_correction_fixed_physical_contract.py"
      - ".github/workflows/kokuno-agent3-finite-correction-physical-contract.yml"

jobs:
  fixed-physical-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify pinned Agent-3 and CR002 source identities
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 3fd33d3ca20d3ebed7dad872d3264036bdd9cb51^{commit}
          test "$(git rev-parse 3fd33d3ca20d3ebed7dad872d3264036bdd9cb51:src/openai_ns_reconstruction/kokuno_finite_correction_stage.py)" = "4fc931fe7703b8b8e05efb41af957b54c9f7a4f9"

          git fetch origin 32c1c8f9779a1da077d0f21019e2658315e9eb62 --depth=1
          test "$(git rev-parse 32c1c8f9779a1da077d0f21019e2658315e9eb62:configs/kokuno_finite_correction_physical_contract_scope.json)" = "a210483d413602f450cec3c769925c24a7a212da"
          test "$(git rev-parse 32c1c8f9779a1da077d0f21019e2658315e9eb62:src/openai_ns_reconstruction/audit_kokuno_finite_correction_physical_contract_scope.py)" = "c2c709e3f836975cd3e3d006cecf65b39591186a"

      - name: Run parent and fixed-contract focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_finite_correction_stage.py \
            tests/test_constrained_kokuno_finite_correction_fixed_physical_contract.py

      - name: Emit mechanics-only fixed-contract receipt
        run: |
          mkdir -p outputs
          python -m openai_ns_reconstruction.kokuno_finite_correction_fixed_physical_contract \
            --output outputs/kokuno_agent3_finite_correction_fixed_physical_contract.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/kokuno_agent3_finite_correction_fixed_physical_contract.json")
          data = json.loads(path.read_text())
          receipt = data["mechanics_stage_receipt"]
          boundary = data["truth_boundary"]

          assert data["mechanics_only"] is True
          assert data["candidate_residual_evidence"] is False
          assert receipt["parent_stage"]["stage_accepted"] is True
          assert receipt["stage_accepted"] is True
          assert receipt["physical_contract_identity_preserved"] is True
          assert receipt["residual_evaluations_bound_to_physical_contract"] is True
          assert receipt["fixed_physical_contract_residual_contraction_verified"] is False
          assert boundary["current_scoped_transport_source_admitted"] is False
          assert boundary["real_candidate_finite_correction_cycle_run"] is False
          assert boundary["fixed_physical_contract_residual_contraction_verified"] is False
          assert boundary["pde_validated"] is False
          PY

      - name: Upload mechanics-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-finite-correction-fixed-physical-contract
          path: outputs/kokuno_agent3_finite_correction_fixed_physical_contract.json
          if-no-files-found: warn
