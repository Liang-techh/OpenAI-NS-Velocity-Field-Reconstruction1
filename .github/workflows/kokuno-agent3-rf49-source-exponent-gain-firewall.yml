name: kokuno-agent3-rf49-source-exponent-gain-firewall

on:
  push:
    branches:
      - agent3/rf49-source-exponent-gain-firewall-20260922
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_rf49_source_exponent_gain_firewall.py'
      - 'tests/test_constrained_kokuno_rf49_source_exponent_gain_firewall.py'
      - '.github/workflows/kokuno-agent3-rf49-source-exponent-gain-firewall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact Agent-3 parent and strict scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor d4ff4357b1619cc13eeacfc88d453f73976fc17c HEAD
          test "$(git rev-parse d4ff4357b1619cc13eeacfc88d453f73976fc17c:src/openai_ns_reconstruction/kokuno_rf44_rf49_postupdate_recompute.py)" = \
            "f6dac0be5cf88f39ca94a6066cdbf1f9270293fb"
          test "$(git rev-list --count d4ff4357b1619cc13eeacfc88d453f73976fc17c..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only d4ff4357b1619cc13eeacfc88d453f73976fc17c..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx 'src/openai_ns_reconstruction/kokuno_rf49_source_exponent_gain_firewall.py'
          printf '%s\n' "${files[@]}" | grep -Fx 'tests/test_constrained_kokuno_rf49_source_exponent_gain_firewall.py'
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/kokuno-agent3-rf49-source-exponent-gain-firewall.yml'

      - name: Verify pinned corrected-reader RF49 and cycle-gain source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/KokunoYumeto/yang-mills-interacting-workbench.git kokuno-reader
          git -C kokuno-reader checkout --quiet 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C kokuno-reader rev-parse HEAD:navier-stokes/navier_stokes_workbench.tex)" = \
            "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          python - <<'PY'
          from pathlib import Path
          text = Path("kokuno-reader/navier-stokes/navier_stokes_workbench.tex").read_text(encoding="utf-8")
          for phrase in (
              r"\tag{RF49}",
              r"Four-step correction-cycle gain and invariant audit",
              r"0.4-\kappa_s=0.39999",
              r"0.9-4\kappa_s=0.89996",
              r"full tangential-mean gain of \(0.17\)",
              r"required \(1/10\)",
          ):
              if phrase not in text:
                  raise SystemExit(f"missing corrected-reader RF49/cycle-gain phrase: {phrase}")
          print("corrected-reader RF49 exponent-gain arithmetic pinned")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Agent-3 head
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_rf49_source_exponent_gain_firewall.py \
            tests/test_constrained_kokuno_rf49_source_exponent_gain_firewall.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_rf30_rf31_typed_mean_correction.py \
            tests/test_constrained_kokuno_rf34_rf39_compact_mean_correction.py \
            tests/test_constrained_kokuno_rf44_rf49_postupdate_recompute.py \
            tests/test_constrained_kokuno_rf49_source_exponent_gain_firewall.py

      - name: Generate deterministic mechanics receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_rf49_source_exponent_gain_firewall \
            --out artifacts/kokuno_agent3/rf49_source_exponent_gain_firewall_mechanics.json

      - name: Upload raw receipt before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-rf49-source-exponent-gain-firewall
          path: artifacts/kokuno_agent3/rf49_source_exponent_gain_firewall_mechanics.json
          if-no-files-found: warn

      - name: Fail closed on scientific promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_rf49_source_exponent_gain_firewall import (
              AUTONOMOUS_DEFECT_NORM_NONEXPANSION_LIMIT,
              AUTONOMOUS_RATIO_ROUNDOFF,
              build_mechanics_report,
              truth_boundary,
          )
          report = build_mechanics_report(); receipt = report["receipt"]; truth = truth_boundary()
          assert report["mechanics_only"] is True and report["candidate_residual_evidence"] is False
          a = receipt["source_arithmetic"]
          assert a["wave_residual_exponent_gain"] == 0.39999
          assert a["retained_tangential_mean_exponent_gain"] == 0.17
          assert a["defect_exponent_gain"] == 0.89996
          assert a["source_required_exponent_gain"] == 0.1
          assert a["source_exponent_gain_certified"] is True
          expected = receipt["observed_rf44_defect_norm_ratio_after_over_before"] <= (
              AUTONOMOUS_DEFECT_NORM_NONEXPANSION_LIMIT + AUTONOMOUS_RATIO_ROUNDOFF
          )
          assert receipt["autonomous_divergence_guard_passed"] is expected
          assert receipt["source_specific_mean_handoff_accepted"] is expected
          assert receipt["repository_candidate_gain_evidence"] is False
          assert receipt["current_i4_candidate_gain_evidence"] is False
          assert receipt["complete_ns_cycle_gain"] is False
          assert truth["source_exponent_gain_is_multiplicative_norm_contraction"] is False
          assert truth["new_project_scientific_acceptance_threshold_introduced"] is False
          for key in (
              "current_i4_source_chart_backend_materialized", "current_i4_candidate_gain_evidence",
              "cartesian_correction_velocity_materialized", "complete_ns_defect", "complete_ns_cycle_gain",
              "real_candidate_finite_correction_cycle_run", "heldout_normalized_ns_residual_assessed",
              "residual_reduction_claimed", "same_protocol_comparable_to_st006", "pde_validated",
          ):
              assert truth[key] is False, key
          assert truth["final_normalized_momentum_gate"] == 1e-3
          assert truth["final_normalized_divergence_gate"] == 1e-5
          assert truth["residual_defined_free_forcing_allowed"] is False
          PY
