name: kokuno-agent4-public-time-derivative-audit

on:
  push:
    branches:
      - codex/kokuno-a4-public-time-derivative-audit-042
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_agent4_public_time_derivative_audit.py"
      - "tests/test_constrained_kokuno_agent4_public_time_derivative_audit.py"
      - ".github/workflows/kokuno-agent4-public-time-derivative-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-public-time-derivative-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-time-derivative-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile audit module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_agent4_public_time_derivative_audit.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_agent4_public_time_derivative_audit.py
          tests/test_constrained_kokuno_public_oscillatory_time_derivative.py
      - name: Generate independent time-derivative receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_agent4_public_time_derivative_audit
          --output artifacts/kokuno_agent4_public_time_derivative_audit_v1.json
      - name: Check fail-closed truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent4_public_time_derivative_audit_v1.json')
          r = json.loads(p.read_text())
          assert r['audited_agent2_pr'] == 579
          assert r['audited_agent2_head'] == '6c8e71c800a17c0e9df1802042f9feebf9dbce04'
          assert r['independence']['public_values_only'] is True
          assert r['independence']['agent2_fd6_verifier_reused'] is False
          assert r['truth_boundary']['heldout_ns_momentum_residual_assessed'] is False
          assert r['truth_boundary']['formal_full_domain_pde_gate_assessed'] is False
          assert r['truth_boundary']['pde_validated'] is False
          print('scientific_pass=', r['public_time_derivative_preflight_passed'])
          print('failed_guards=', r['failed_guards'])
          print('fd4_comparison=', r['fd4_comparison'])
          print('fundamental_theorem=', r['fundamental_theorem'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-public-time-derivative-audit-v1
          path: artifacts/kokuno_agent4_public_time_derivative_audit_v1.json
          if-no-files-found: error
