name: agent7-st048s-piola-warp-screen

on:
  pull_request:
    paths:
      - 'experiments/root_st048/agent7_st048s_piola_warp_screen.py'
      - 'experiments/root_st048/test_agent7_st048s_piola_warp_screen.py'
      - '.github/workflows/agent7-st048s-piola-warp-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Test ST048-S Piola warp screen
        working-directory: experiments/root_st048
        run: python -m pytest -q -W error test_agent7_st048s_piola_warp_screen.py
      - name: Generate ST048-S Piola warp report
        working-directory: experiments/root_st048
        run: |
          python agent7_st048s_piola_warp_screen.py --output ../../artifacts/st048_agent7_piola_warp_screen/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../../artifacts/st048_agent7_piola_warp_screen/report.json').read_text())
          print('smallest_clean_beta=',r['smallest_preregistered_clean_beta'])
          for row in r['rows']:
              print(json.dumps({
                  'beta':row['beta'],
                  'scale':row['common_energy_normalization_scale'],
                  'preflight':row['preflight_pass'],
                  'clean':row['reused_clean_extension_rule_pass'],
                  'axial':row['axial_rms_relative_changes'],
                  'radial':row['radial_rms_relative_changes'],
                  'q90':row['q90_deltas_over_support'],
                  'q99':row['q99_deltas_over_support'],
                  'collar':row['collar_enstrophy_ratios'],
                  'tail075':row['outer_075_enstrophy_relative_changes'],
              },sort_keys=True))
          print(r['routing'])
          PY
      - name: Upload ST048-S Piola warp report
        uses: actions/upload-artifact@v4
        with:
          name: agent7-st048s-piola-warp-screen
          path: artifacts/st048_agent7_piola_warp_screen/report.json
