name: st040-source-ingest
on:
  push:
    branches: [research/st040-structure-residual]
    paths: [.github/workflows/st040-ingest.yml]
permissions:
  contents: write
jobs:
  restore-reviewed-source:
    if: github.repository == 'Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/st040-structure-residual
      - name: Restore verified source texts to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, urllib.request
          from pathlib import Path
          repo='Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
          ids=['81dbd6f3879fc6a4531c14b058eeb2ec77a91a8a','4d20e17320eabd89c0d7a24b660dc3503cb8c97a','f7655caf6725901ba2cbfad049a94aa4c9e37b1a','f61b76e9b9ab06ae1b6d3f6097aa4f5ecdc6a955']
          parts=[]
          for sha in ids:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ST040-source-publication'})
              with urllib.request.urlopen(req,timeout=60) as response: data=json.load(response)
              raw=base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()==sha
              parts.append(raw.decode('ascii'))
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='40899880c29b01838d4de5912501990c96e93fd3937d7b569fd2a7bc7818e77b'
          entries=json.loads(gzip.decompress(packed))
          expected={'README.md','bootstrap.py','controlled_fit.py','temporal_fit.py','structure_audit.py','replay.py','recipes.json','results.json','test_progress.py'}
          prefix='experiments/root_st040/'
          assert set(entries)=={prefix+n for n in expected}
          root=Path.cwd().resolve()
          for name,text in entries.items():
              assert isinstance(text,str)
              p=(root/name).resolve()
              assert p.is_relative_to(root) and '..' not in Path(name).parts
              payload=text.encode('utf-8')
              if p.exists(): assert p.read_bytes()==payload, 'Refusing to overwrite different source'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(payload)
              print(name,hashlib.sha256(payload).hexdigest())
          print('Verified and restored nine source/recipe/report files; no scientific acceptance implied.')
          PY
      - name: Commit source only to the isolated research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/root_st040
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish ST040 structural audit and ST041/ST042 frozen replay sources'
          git push origin HEAD:research/st040-structure-residual
