name: kokuno-agent3-rf44-rf49-postupdate-recompute

on:
  push:
    branches:
      - agent3/rf44-rf49-postupdate-recompute-20260922
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_rf44_rf49_postupdate_recompute.py'
      - 'tests/test_constrained_kokuno_rf44_rf49_postupdate_recompute.py'
      - '.github/workflows/kokuno-agent3-rf44-rf49-postupdate-recompute.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact Agent-3 parent and strict scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor ecbc7e3702e366a5f355800dd662b11766273a41 HEAD
          test "$(git rev-parse ecbc7e3702e366a5f355800dd662b11766273a41:src/openai_ns_reconstruction/kokuno_rf34_rf39_compact_mean_correction.py)" = \
            "392975eafd3787c91e2dc82ad9b735567513271d"
          test "$(git rev-list --count ecbc7e3702e366a5f355800dd662b11766273a41..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only ecbc7e3702e366a5f355800dd662b11766273a41..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx 'src/openai_ns_reconstruction/kokuno_rf44_rf49_postupdate_recompute.py'
          printf '%s\n' "${files[@]}" | grep -Fx 'tests/test_constrained_kokuno_rf44_rf49_postupdate_recompute.py'
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/kokuno-agent3-rf44-rf49-postupdate-recompute.yml'

      - name: Verify pinned corrected-reader RF44-RF49 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/KokunoYumeto/yang-mills-interacting-workbench.git kokuno-reader
          git -C kokuno-reader checkout --quiet 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C kokuno-reader rev-parse HEAD:navier-stokes/navier_stokes_workbench.tex)" = \
            "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          python - <<'PY'
          from pathlib import Path
          text = Path("kokuno-reader/navier-stokes/navier_stokes_workbench.tex").read_text(encoding="utf-8")
          for phrase in (r"\tag{RF44}", r"\tag{RF45}", r"\tag{RF46}", r"\tag{RF47}", r"\tag{RF48}", r"\tag{RF49}",
                         r"P_{\rm new}", r"(J_\theta)_{\rm new}", r"(J_z)_{\rm new}"):
              if phrase not in text:
                  raise SystemExit(f"missing corrected-reader RF44--RF49 phrase: {phrase}")
          print("corrected-reader RF44--RF49 structure pinned")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Agent-3 head
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_rf44_rf49_postupdate_recompute.py \
            tests/test_constrained_kokuno_rf44_rf49_postupdate_recompute.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_rf30_rf31_typed_mean_correction.py \
            tests/test_constrained_kokuno_rf34_rf39_compact_mean_correction.py \
            tests/test_constrained_kokuno_rf44_rf49_postupdate_recompute.py

      - name: Generate deterministic mechanics receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_rf44_rf49_postupdate_recompute \
            --out artifacts/kokuno_agent3/rf44_rf49_postupdate_recompute_mechanics.json

      - name: Fail closed on scientific promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import math
          from openai_ns_reconstruction.kokuno_rf44_rf49_postupdate_recompute import RF47_REL_TOL, build_mechanics_report, truth_boundary
          report = build_mechanics_report(); receipt = report["receipt"]; truth = truth_boundary()
          assert report["mechanics_only"] is True and report["candidate_residual_evidence"] is False
          assert receipt["source_rf44_rf49_recompute_materialized"] is True
          assert receipt["repository_candidate_recompute_evidence"] is False
          assert receipt["current_i4_candidate_evidence"] is False
          assert receipt["rf47_closure_max_relative"] <= RF47_REL_TOL
          assert math.isfinite(receipt["defect_gain_ratio_2"])
          assert receipt["nonlinear_remainder_nonzero"] is True
          assert truth["source_specific_defect_gain_diagnostic_materialized"] is True
          assert truth["new_gain_acceptance_threshold_introduced"] is False
          for key in ("current_i4_source_chart_backend_materialized", "current_i4_rf30_defect_materialized",
                      "current_i4_rf34_rf39_correction_materialized", "current_i4_rf44_rf49_remainder_recomputed",
                      "cartesian_correction_velocity_materialized", "complete_ns_defect",
                      "real_candidate_finite_correction_cycle_run", "heldout_normalized_ns_residual_assessed",
                      "residual_reduction_claimed", "same_protocol_comparable_to_st006", "pde_validated"):
              assert truth[key] is False, key
          assert truth["final_normalized_momentum_gate"] == 1e-3
          assert truth["final_normalized_divergence_gate"] == 1e-5
          assert truth["residual_defined_free_forcing_allowed"] is False
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-rf44-rf49-postupdate-recompute
          path: artifacts/kokuno_agent3/rf44_rf49_postupdate_recompute_mechanics.json
          if-no-files-found: warn
