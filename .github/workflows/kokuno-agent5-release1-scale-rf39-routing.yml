name: Kokuno A5 Release1 Scale RF39 Routing

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_a5_release1_scale_rf39_routing.py'
      - 'tests/test_kokuno_a5_release1_scale_rf39_routing.py'
      - '.github/workflows/kokuno-agent5-release1-scale-rf39-routing.yml'
  workflow_dispatch:

jobs:
  routing-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependency
        run: python -m pip install --upgrade pytest

      - name: Enforce exact A5 ancestry and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          parent='9f4bc6b415e2e0334ccdc1b681b83539972cee52'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          test "$(git rev-list --count "$parent"..HEAD)" -eq 3
          actual="$(git diff --name-only "$parent"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/kokuno-agent5-release1-scale-rf39-routing.yml' \
            'src/openai_ns_reconstruction/kokuno_a5_release1_scale_rf39_routing.py' \
            'tests/test_kokuno_a5_release1_scale_rf39_routing.py' | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --diff-filter=D --name-only "$parent"..HEAD)"

      - name: Authenticate exact sibling heads and source blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            head="$1"; path="$2"; blob="$3"
            git fetch --no-tags origin "$head"
            test "$(git show "$head:$path" | git hash-object --stdin)" = "$blob"
          }
          check_blob f5b5b8b532e0802e181bfead5e748cd4008906bf \
            src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postswirl_release1.py \
            98be6d0d31a382ad7638318cec670d317bcc5cce
          check_blob 7e9d8ce853f43f96eecde9343dcbe0c3138a6042 \
            src/openai_ns_reconstruction/kokuno_source_bounded_scale_oriented_multiharmonic_velocity.py \
            26b59059b2341f7a6a4d1f985fb719df007b4d19
          check_blob 21b0ade966fda3b7344273c7bff2efe7e7b9a93e \
            src/openai_ns_reconstruction/kokuno_current_i4_rf34_rf39_correction.py \
            fe08f93f48aeb2d4055b12889325a6ae5e05a5a6
          check_blob 5e12ed7dc55e0740a40f9a210e23e98cd71707e2 \
            src/openai_ns_reconstruction/kokuno_a4_relative_swirl_decimal_total_independent_audit.py \
            9fbc39f4e9740a504e277a9cb758a144eb219c62

      - name: Compile routing files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a5_release1_scale_rf39_routing.py
          python -m py_compile tests/test_kokuno_a5_release1_scale_rf39_routing.py

      - name: Materialize deterministic routing artifact before enforcement
        run: |
          PYTHONPATH=src python - <<'PY'
          from openai_ns_reconstruction.kokuno_a5_release1_scale_rf39_routing import dump_artifact
          dump_artifact('artifacts/kokuno_a5_release1_scale_rf39_routing.json')
          PY

      - name: Run parent and new fail-closed regressions
        run: |
          PYTHONPATH=src pytest -q \
            tests/test_kokuno_a5_decimal_total_oriented_rf30_audit_routing.py \
            tests/test_kokuno_a5_release1_scale_rf39_routing.py

      - name: Revalidate emitted truth boundary
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_a5_release1_scale_rf39_routing import validate_artifact
          p = Path('artifacts/kokuno_a5_release1_scale_rf39_routing.json')
          payload = json.loads(p.read_text(encoding='utf-8'))
          validate_artifact(payload)
          assert payload['core_states']['pde_validated'] is False
          assert payload['upstream_routes']['agent4']['audits_latest_agent1_release1'] is False
          assert payload['upstream_routes']['agent3']['repository_candidate_scientific_correction_materialized'] is False
          PY

      - name: Upload routing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a5-release1-scale-rf39-routing
          path: artifacts/kokuno_a5_release1_scale_rf39_routing.json
          if-no-files-found: warn
