name: kokuno-agent3-missing-covariance-column-target

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_missing_covariance_column_target.py'
      - 'src/openai_ns_reconstruction/kokuno_phase_orbit_covariance_rank.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_covariance_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_core_series.py'
      - 'tests/test_constrained_kokuno_missing_covariance_column_target.py'
      - '.github/workflows/kokuno-agent3-missing-covariance-column-target.yml'

permissions:
  contents: read

jobs:
  missing-covariance-column-target:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_phase_orbit_covariance_rank.py
          tests/test_constrained_kokuno_missing_covariance_column_target.py
      - name: Build real missing second-column target
        run: >-
          python -m openai_ns_reconstruction.kokuno_missing_covariance_column_target
          --output artifacts/kokuno_agent3/missing_covariance_column_target_report.json
          --radial-count 33
          --angular-count 8
          --phase-count 8
      - name: Show report
        run: cat artifacts/kokuno_agent3/missing_covariance_column_target_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-missing-covariance-column-target
          path: artifacts/kokuno_agent3/missing_covariance_column_target_report.json
