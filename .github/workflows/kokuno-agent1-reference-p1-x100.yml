name: kokuno-agent1-reference-p1-x100

on:
  push:
    branches:
      - codex/kokuno-a1-reference-p1-x100-080
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_reference_p1_x100.py"
      - "tests/test_kokuno_pa10_reference_p1_x100.py"
      - ".github/workflows/kokuno-agent1-reference-p1-x100.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-reference-p1-x100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-p1-x100:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile executable reference p1 primitive
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_reference_p1_x100.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_reference_plateau_x100.py \
            tests/test_kokuno_pa10_reference_p1_x100.py
      - name: Emit reference p1 X100 receipt
        run: |
          python - <<'PY'
          import json
          from openai_ns_reconstruction.kokuno_pa10_reference_p1_x100 import (
              KokunoPA10ReferenceP1ToX100,
          )

          primitive = KokunoPA10ReferenceP1ToX100()
          report = primitive.report()
          truth = report['truth_boundary']
          probe = report['probe']
          assert report['geometry']['X_b_ref'] == 100.0
          assert max(abs(x) for x in probe['p1_X100']) > 1.0e-12
          assert truth['public_reference_p1_ode_executable_to_X100'] is True
          assert truth['reference_eta_jets_analytic'] is False
          assert truth['reference_nsr_materialized'] is False
          assert truth['kappa0_continuation_to_X100_materialized'] is False
          assert truth['outer_global_leading_velocity_materialized'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          print(json.dumps({
              'semantic_sha256': report['semantic_sha256'],
              'geometry': report['geometry'],
              'probe': probe,
          }, indent=2, sort_keys=True))
          PY
