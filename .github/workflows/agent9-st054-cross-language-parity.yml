name: agent9-st054-cross-language-parity
on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/st054_snapshot.py'
      - 'src/openai_ns_reconstruction/__init__.py'
      - 'scripts/st054_cross_language_fixture.py'
      - 'visualization/matlab/ns_basis.m'
      - 'visualization/matlab/ns_cylindrical.m'
      - 'visualization/matlab/ns_evaluate.m'
      - 'visualization/matlab/ns_cross_language_parity.m'
      - 'visualization/matlab/data/st054_models.mat'
      - '.github/workflows/agent9-st054-cross-language-parity.yml'
  push:
    branches: [main]
    paths:
      - 'src/openai_ns_reconstruction/st054_snapshot.py'
      - 'src/openai_ns_reconstruction/__init__.py'
      - 'scripts/st054_cross_language_fixture.py'
      - 'visualization/matlab/ns_basis.m'
      - 'visualization/matlab/ns_cylindrical.m'
      - 'visualization/matlab/ns_evaluate.m'
      - 'visualization/matlab/ns_cross_language_parity.m'
      - 'visualization/matlab/data/st054_models.mat'
      - '.github/workflows/agent9-st054-cross-language-parity.yml'
permissions:
  contents: read
concurrency:
  group: agent9-st054-cross-language-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-native-matlab-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository package
        run: python -m pip install -e .
      - name: Generate frozen Python off-grid velocity fixture
        run: python scripts/st054_cross_language_fixture.py --output /tmp/ns-st054-parity-fixture
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
      - name: Compare native MATLAB against Python continuous velocity
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('visualization/matlab'); dataFile=fullfile(pwd,'visualization','matlab','data','st054_models.mat'); ns_cross_language_parity(dataFile,'/tmp/ns-st054-parity-fixture','/tmp/ns-st054-parity-receipt');
      - name: Enforce software-only truth boundary and frozen parity gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/ns-st054-parity-receipt/cross_language_parity_receipt.json')
          r = json.loads(p.read_text())
          assert r['schema'] == 'st054_python_native_matlab_offgrid_parity_v1'
          assert r['parity_pass'] is True
          assert r['engineering_atol'] == 1e-8
          assert max(r['max_component_error']) <= 1e-8
          for key in ('pde_validated','visual_correspondence_verified','source_correspondence_verified','paper_exact','openai_field_identified','blowup_proved'):
              assert r[key] is False, (key, r[key])
          print(json.dumps(r, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST054-python-native-MATLAB-offgrid-parity
          path: |
            /tmp/ns-st054-parity-fixture/
            /tmp/ns-st054-parity-receipt/
          if-no-files-found: error
