name: agent7-st052m-representation-archetype-left-null-preflight

on:
  pull_request:
    paths:
      - 'experiments/root_st052/agent7_st052m_representation_archetype_left_null_preflight.py'
      - 'experiments/root_st052/test_agent7_st052m_representation_archetype_left_null_preflight.py'
      - '.github/workflows/agent7-st052m-representation-archetype-left-null-preflight.yml'
  workflow_dispatch:

jobs:
  representation-archetype-left-null-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate bounded three-file delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=dc801576b7037667642db49665f97b3dead29033
          git cat-file -e "${BASE}^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            ".github/workflows/agent7-st052m-representation-archetype-left-null-preflight.yml"
            "experiments/root_st052/agent7_st052m_representation_archetype_left_null_preflight.py"
            "experiments/root_st052/test_agent7_st052m_representation_archetype_left_null_preflight.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 3
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Install numerical test dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Run focused representation-preflight regressions
        run: python experiments/root_st052/test_agent7_st052m_representation_archetype_left_null_preflight.py

      - name: Execute exact frozen representation-archetype preflight
        run: |
          mkdir -p outputs
          python experiments/root_st052/agent7_st052m_representation_archetype_left_null_preflight.py \
            --out outputs/agent7_st052m_representation_archetype_left_null_preflight.json

      - name: Enforce truth boundary and preregistered protocol
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/agent7_st052m_representation_archetype_left_null_preflight.json')
          r = json.loads(p.read_text())
          assert r['task_id'] == 'CR003-ST052M-REPRESENTATION-ARCHETYPE-LEFT-NULL-PREFLIGHT-136'
          assert r['prereg_issue'] == 1146
          assert r['stack_base']['pr'] == 1139
          assert r['stack_base']['head'] == 'dc801576b7037667642db49665f97b3dead29033'
          expected = [
              'poloidal_scalar_space_extension',
              'compact_toroidal_envelope_extension',
              'time_skewed_poloidal_extension',
          ]
          assert r['frozen_protocol']['probe_names'] == expected
          assert r['frozen_protocol']['streamfunction_vector_potential_same_poloidal_class'] is True
          assert r['frozen_protocol']['candidate_basis_dimension_added'] == 0
          assert set(r['probe_results']) == set(expected)
          for name in expected:
              q = r['probe_results'][name]
              assert 0.0 <= q['left_null_novelty_fraction_l2'] <= 1.00000001
              assert 0.0 <= q['existing_span_fraction_l2'] <= 1.00000001
              assert q['rank_gain'] in (0, 1)
              assert q['structural_guard']['passes'] is True
              assert q['structural_guard']['centered_divergence_max_abs'] <= 5e-7
              assert q['structural_guard']['outside_support_max_abs_velocity'] <= 1e-12
              assert q['structural_guard']['axis_transverse_max_abs_velocity'] <= 1e-12
              if q['independent_preflight_eligible']:
                  assert q['derivative_stable'] is True
                  assert q['rank_gain'] == 1
                  assert q['augmented_normalized_column_condition'] <= 25.0
                  assert q['max_abs_probe_existing_cosine'] < 0.995
          assert r['decision']['basis_candidate_promoted'] is None
          assert r['decision']['candidate_mutation_authorized'] is False
          assert r['decision']['coefficient_selection_authorized'] is False
          assert r['candidate_velocity_changed'] is False
          assert r['canonical_velocity_changed'] is False
          assert r['saved_velocity_changed'] is False
          assert r['basis_dimension_changed'] is False
          assert r['coefficient_selected'] is False
          assert r['pressure_or_force_changed'] is False
          assert r['held_out_pde_residual_evaluated'] is False
          assert r['public_image_numeric_target_used'] is False
          assert r['direct_visualization_fingerprint_improvement'] == 0.0
          assert r['closer_visualization_delivery_established'] is False
          assert r['pde_validated'] is False
          assert r['paper_exact'] is False
          assert r['openai_field_identified'] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-st052m-representation-archetype-left-null-preflight
          path: outputs/agent7_st052m_representation_archetype_left_null_preflight.json
          if-no-files-found: warn
