name: st043-source-ingest
on:
  push:
    branches: [research/st043-coupled-core-momentum]
    paths: [.github/workflows/st043-ingest.yml]
permissions:
  contents: write
jobs:
  restore-reviewed-source:
    if: github.repository == 'Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/st043-coupled-core-momentum
      - name: Restore exact reviewed source on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,urllib.request
          from pathlib import Path
          repo='Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
          ids=['b62f1af0f6073a7aa22b405358e458043570d891','a53d7a6e5a88f9423cc4e9e01b024a3d754fb21b','b24bd4429171867a7dbfc953a9cf0fbff85173d6']
          parts=[]
          def git_hash(b):return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          for sha in ids:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ST043-source-publication'})
              with urllib.request.urlopen(req,timeout=60) as response: data=json.load(response)
              raw=base64.b64decode(data['content'])
              assert git_hash(raw)==sha
              parts.append(raw.decode('ascii'))
          # Restore two known transport-only transcription substitutions, then
          # verify the ORIGINAL part identity and entire compressed payload.
          parts[0]=parts[0].replace('YQC4dMV+CyEuG','YQC4dMV+CAEuG').replace('CvN+GtUQM','CvN+KrUQM')
          assert git_hash(parts[0].encode())=='c0b6f9d4a922529239da6e136c95530d973d87df'
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='3e8a23d3ffbb496c2b436a6197fa00b1e97f97773ef4aa87f6904f8076f5de72'
          entries=json.loads(gzip.decompress(packed))
          names={'README.md','additional_checks.py','bootstrap.py','coupled_fit.py','frozen_replay.py','localized_model.py','recipes.json','results.json','structural_report.py','test_coupled.py'}
          prefix='experiments/root_st043/'
          assert set(entries)=={prefix+n for n in names}
          root=Path.cwd().resolve()
          for name,text in entries.items():
              assert isinstance(text,str)
              p=(root/name).resolve()
              assert p.is_relative_to(root) and '..' not in Path(name).parts
              payload=text.encode('utf-8')
              if p.exists():assert p.read_bytes()==payload,'Refusing to overwrite different source'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(payload)
              print(name,hashlib.sha256(payload).hexdigest())
          print('Ten original source/recipe/result files restored; no scientific acceptance implied.')
          PY
      - name: Commit only new research files on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/root_st043
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish ST043-ST045 coupled structure and residual research sources'
          git push origin HEAD:research/st043-coupled-core-momentum
