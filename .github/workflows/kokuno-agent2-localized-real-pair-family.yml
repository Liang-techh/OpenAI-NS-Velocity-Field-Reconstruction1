name: kokuno-agent2-localized-real-pair-family

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_localized_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_partition_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_support_localized_curl.py'
      - 'tests/test_constrained_kokuno_source_localized_real_pair_family.py'
      - '.github/workflows/kokuno-agent2-localized-real-pair-family.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_localized_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_partition_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_support_localized_curl.py'
      - 'tests/test_constrained_kokuno_source_localized_real_pair_family.py'
      - '.github/workflows/kokuno-agent2-localized-real-pair-family.yml'

permissions:
  contents: read

jobs:
  localized-real-pair-family:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused localized real-pair family tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_source_localized_real_pair_family.py
          tests/test_constrained_kokuno_source_partition_family.py
          tests/test_constrained_kokuno_source_support_localized_curl.py
