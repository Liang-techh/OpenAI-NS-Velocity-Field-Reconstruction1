name: kokuno-agent4-radial-stress-independent

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_independent_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'tests/test_constrained_kokuno_independent_radial_stress.py'
      - 'tests/test_constrained_kokuno_radial_stress.py'
      - 'tests/test_constrained_kokuno_mean_defect.py'
      - 'tests/test_constrained_kokuno_complete_curl.py'
      - 'artifacts/bipolar_joint_capped/candidate.json'
      - '.github/workflows/kokuno-agent4-radial-stress-independent.yml'

permissions:
  contents: read

jobs:
  independent-radial-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run focused independent and upstream regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_independent_radial_stress.py
          tests/test_constrained_kokuno_radial_stress.py
          tests/test_constrained_kokuno_mean_defect.py
          tests/test_constrained_kokuno_complete_curl.py
      - name: Generate independent real-artifact radial-stress report
        run: python -m openai_ns_reconstruction.kokuno_independent_radial_stress
      - name: Show report
        run: cat artifacts/kokuno_independent_validation/radial_stress_preflight.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-radial-stress-independent
          path: artifacts/kokuno_independent_validation/radial_stress_preflight.json
