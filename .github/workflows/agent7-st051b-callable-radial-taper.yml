name: agent7-st051b-callable-radial-taper

on:
  pull_request:
    paths:
      - "experiments/root_st051/agent7_st051b_callable_piola_transfer.py"
      - "experiments/root_st051/agent7_st051b_callable_radial_taper.py"
      - "experiments/root_st051/test_agent7_st051b_callable_radial_taper.py"
      - ".github/workflows/agent7-st051b-callable-radial-taper.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  callable-radial-taper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Agent 7 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused warning-clean regressions
        env:
          PYTHONPATH: experiments/root_st051
        run: |
          python -W error -m py_compile experiments/root_st051/agent7_st051b_callable_piola_transfer.py
          python -W error -m py_compile experiments/root_st051/agent7_st051b_callable_radial_taper.py
          python -W error -m pytest -q experiments/root_st051/test_agent7_st051b_callable_radial_taper.py

      - name: Run fixed callable-parent radial taper screen
        env:
          PYTHONPATH: experiments/root_st051
        run: |
          mkdir -p artifacts/agent7_st051b_callable_radial_taper
          python experiments/root_st051/agent7_st051b_callable_radial_taper.py \
            --out artifacts/agent7_st051b_callable_radial_taper/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/agent7_st051b_callable_radial_taper/report.json").read_text())
          if report["prereg_issue"] != 519:
              raise SystemExit("preregistration identity drift")
          if report["taper"]["tau"] != 0.05 or report["taper"]["tau_scan_performed"]:
              raise SystemExit("fixed taper contract drift")
          if not report["taper"]["callable_parent_used"]:
              raise SystemExit("callable-parent contract drift")
          if any(report["truth"].values()):
              raise SystemExit("truth boundary unexpectedly promoted")
          print(json.dumps({
              "clean_taper_capacity": report["clean_taper_capacity"],
              "energy_finest": report["energy_quadrature"][-1],
              "morphology": [
                  {
                      "time": row["time"],
                      "tip_radial_rms_relative": row["tip_radial_rms_relative"],
                      "central_radial_rms_relative": row["central_radial_rms_relative"],
                      "global_axial_rms_relative": row["global_axial_rms_relative"],
                      "tip_absolute_enstrophy_ratio": row["tip_absolute_enstrophy_ratio"],
                      "collar_absolute_ratio": row["collar_absolute_ratio"],
                  }
                  for row in report["morphology"]
              ],
              "structure": report["structure"],
              "response": report["response_diagnostics"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload Agent 7 radial taper receipt
        uses: actions/upload-artifact@v4
        with:
          name: ST051-B-callable-radial-taper
          path: artifacts/agent7_st051b_callable_radial_taper/report.json
          if-no-files-found: error
          retention-days: 30
