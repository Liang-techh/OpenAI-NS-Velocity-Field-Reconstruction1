name: kokuno-agent5-terminal-tail-routing-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_terminal_tail_routing_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_terminal_tail_schedule.py'
      - 'src/openai_ns_reconstruction/kokuno_independent_terminal_tail_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_heat_v2_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_terminal_tail_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_terminal_tail_schedule.py'
      - 'tests/test_constrained_kokuno_independent_terminal_tail_audit.py'
      - '.github/workflows/kokuno-agent5-terminal-tail-routing-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-1/4/5 terminal-tail routing tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_terminal_tail_routing_checkpoint.py
          tests/test_constrained_kokuno_terminal_tail_schedule.py
          tests/test_constrained_kokuno_independent_terminal_tail_audit.py
      - name: Generate terminal-tail routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_terminal_tail_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/terminal_tail_routing_checkpoint_v12
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/terminal_tail_routing_checkpoint_v12/terminal_tail_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-terminal-tail-routing-checkpoint-v12
          path: artifacts/kokuno_agent5/terminal_tail_routing_checkpoint_v12
