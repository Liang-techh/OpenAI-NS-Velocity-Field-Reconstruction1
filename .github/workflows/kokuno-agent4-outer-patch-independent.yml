name: Kokuno Agent4 outer patch independent audit

on:
  push:
    branches:
      - agent-kokuno-4/outer-reserved-patch-independent-011
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_outer_patch_independent_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_outer_reserved_patch_schedule.py'
      - 'tests/test_constrained_kokuno_outer_patch_independent_audit.py'
      - 'tests/test_constrained_kokuno_outer_reserved_patch_schedule.py'
      - '.github/workflows/kokuno-agent4-outer-patch-independent.yml'
  workflow_dispatch:

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run focused independent tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_outer_patch_independent_audit.py
          tests/test_constrained_kokuno_outer_reserved_patch_schedule.py
      - name: Generate independent report
        run: >-
          python -m openai_ns_reconstruction.kokuno_outer_patch_independent_audit
          --output artifacts/kokuno_agent4/outer_reserved_patch_independent_report.json
          --seed 9173061
          --samples-per-case 12
      - name: Display report
        run: cat artifacts/kokuno_agent4/outer_reserved_patch_independent_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-outer-reserved-patch-independent
          path: artifacts/kokuno_agent4/outer_reserved_patch_independent_report.json
          if-no-files-found: error
