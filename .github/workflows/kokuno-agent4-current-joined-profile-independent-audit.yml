name: kokuno-agent4-current-joined-profile-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a4_current_joined_profile_independent_audit.py"
      - "tests/test_constrained_kokuno_a4_current_joined_profile_independent_audit.py"
      - ".github/workflows/kokuno-agent4-current-joined-profile-independent-audit.yml"
  push:
    branches:
      - "agent-kokuno-4/current-joined-profile-independent-audit-093"
  workflow_dispatch:

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert exact Agent-1 parent ancestry and blob
        shell: bash
        run: |
          git merge-base --is-ancestor 61b8730fba5623c5acfbd3ec42d54f7cc4f45748 HEAD
          test "$(git rev-parse 61b8730fba5623c5acfbd3ec42d54f7cc4f45748:src/openai_ns_reconstruction/kokuno_pa16_current_joined_profile.py)" = "e38b9b79378aaf97a17226e41da75b477f26ae23"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a4_current_joined_profile_independent_audit.py
          python -m py_compile tests/test_constrained_kokuno_a4_current_joined_profile_independent_audit.py

      - name: Run parent and Agent-4 regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa16_current_joined_profile.py \
            tests/test_constrained_kokuno_a4_current_joined_profile_independent_audit.py

      - name: Materialize real save-reload receipt
        run: |
          mkdir -p artifacts/kokuno_agent4_current_joined_profile_independent_audit
          python -m openai_ns_reconstruction.kokuno_a4_current_joined_profile_independent_audit \
            --output artifacts/kokuno_agent4_current_joined_profile_independent_audit/receipt.json
          cat artifacts/kokuno_agent4_current_joined_profile_independent_audit/receipt.json

      - name: Upload receipt before scientific enforcement
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-current-joined-profile-independent-audit
          path: artifacts/kokuno_agent4_current_joined_profile_independent_audit/receipt.json

      - name: Enforce frozen scientific gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_a4_current_joined_profile_independent_audit import (
              enforce_current_joined_profile_independent_audit,
          )

          path = Path("artifacts/kokuno_agent4_current_joined_profile_independent_audit/receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          enforce_current_joined_profile_independent_audit(receipt)
          print("frozen Agent-4 joined-profile audit gates passed")
          PY
