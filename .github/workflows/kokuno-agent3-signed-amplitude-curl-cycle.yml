name: kokuno-agent3-signed-amplitude-curl-cycle

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_signed_amplitude_curl_cycle.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_covariance_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_core_series.py'
      - 'tests/test_constrained_kokuno_signed_amplitude_curl_cycle.py'
      - '.github/workflows/kokuno-agent3-signed-amplitude-curl-cycle.yml'

permissions:
  contents: read

jobs:
  signed-amplitude-curl-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_signed_amplitude_curl_cycle.py
          tests/test_constrained_kokuno_signed_covariance_inverse.py
          tests/test_constrained_kokuno_radial_stress.py
          tests/test_constrained_kokuno_mean_defect.py
          tests/test_constrained_kokuno_complete_curl.py
      - name: Run real leading-core signed-amplitude correction cycle
        run: >-
          python -m openai_ns_reconstruction.kokuno_signed_amplitude_curl_cycle
          --output artifacts/kokuno_agent3/signed_amplitude_curl_cycle_report.json
          --radial-count 33
          --angular-count 8
          --phase-count 8
          --train-count 16
          --held-out-count 32
      - name: Show report
        run: cat artifacts/kokuno_agent3/signed_amplitude_curl_cycle_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-signed-amplitude-curl-cycle
          path: artifacts/kokuno_agent3/signed_amplitude_curl_cycle_report.json
