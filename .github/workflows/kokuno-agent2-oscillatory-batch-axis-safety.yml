name: kokuno-agent2-oscillatory-batch-axis-safety

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py'
      - 'tests/test_constrained_kokuno_oscillatory_batch_axis_safety.py'
      - '.github/workflows/kokuno-agent2-oscillatory-batch-axis-safety.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert pinned A2 ancestry and public velocity identity
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor fc89770a9ee2ed1897e53ca83f57b995e7b1250d HEAD
          test "$(git rev-parse fc89770a9ee2ed1897e53ca83f57b995e7b1250d:src/openai_ns_reconstruction/kokuno_public_z_pullback_velocity.py)" = "4a3abc1a11f7e054f651dd7bace8ada6d5a6b653"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: >-
          python -m py_compile
          src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py
          tests/test_constrained_kokuno_oscillatory_batch_axis_safety.py

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_oscillatory_batch_axis_safety.py
          tests/test_constrained_kokuno_oscillatory_stokes_circulation.py

      - name: Materialize batch/axis-safety receipt
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_oscillatory_batch_axis_safety import (
              materialize_batch_axis_safety_receipt,
          )

          receipt = materialize_batch_axis_safety_receipt()
          receipt['git_sha'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          Path('artifacts/kokuno_agent2_oscillatory_batch_axis_safety.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt['diagnostic'], indent=2, sort_keys=True))
          PY

      - name: Upload batch/axis-safety receipt before gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-oscillatory-batch-axis-safety
          path: artifacts/kokuno_agent2_oscillatory_batch_axis_safety.json
          if-no-files-found: warn

      - name: Enforce frozen batch/axis-safety gates
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_oscillatory_batch_axis_safety import (
              INTERIOR_SIGNAL_FLOOR,
              SCALAR_REPLAY_ATOL,
          )

          receipt = json.loads(
              Path('artifacts/kokuno_agent2_oscillatory_batch_axis_safety.json').read_text()
          )
          diagnostic = receipt['diagnostic']
          contract = receipt['public_contract']
          failed = []

          if diagnostic['scalar_replay_max_abs'] > SCALAR_REPLAY_ATOL:
              failed.append('scalar_replay')
          if diagnostic['masked_speed_max'] != 0.0:
              failed.append('masked_support_not_exact_zero')
          if diagnostic['interior_vector_rms'] < INTERIOR_SIGNAL_FLOOR:
              failed.append('trivial_interior_signal')
          if diagnostic['batch_shape'] != [8, 3]:
              failed.append('batch_shape')
          if contract['forbidden_inputs_present']:
              failed.append('forbidden_tuning_inputs')
          if not contract['vectorized_batch_api'] or not contract['shape_preserving']:
              failed.append('batch_contract')
          if not contract['axis_safe_by_strict_support_mask']:
              failed.append('axis_safety_contract')
          if contract['complete_curl_reimplemented']:
              failed.append('duplicate_curl_implementation')
          if contract['mean_projection_performed'] or contract['radial_inverse_performed'] or contract['correction_velocity_constructed']:
              failed.append('agent3_lane_crossed')
          if contract['complete_ns_residual'] or contract['paper_exact'] or contract['pde_validated']:
              failed.append('scientific_boundary_promoted')

          if failed:
              raise SystemExit('oscillatory batch/axis-safety gate failed: ' + ', '.join(failed))
          print('oscillatory batch/axis-safety gates passed')
          PY
