name: kokuno-agent4-public-ideal-qs-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a4_public_ideal_qs_independent_audit.py"
      - "tests/test_constrained_kokuno_a4_public_ideal_qs_independent_audit.py"
      - ".github/workflows/kokuno-agent4-public-ideal-qs-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact A1 ancestry and minimal three-file scope
        shell: bash
        run: |
          set -euo pipefail
          parent=3978560078104bff7c9d5556bd9e658e4874c963
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-list --count "$parent"..HEAD)" -eq 3
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent4-public-ideal-qs-independent-audit.yml"
            "src/openai_ns_reconstruction/kokuno_a4_public_ideal_qs_independent_audit.py"
            "tests/test_constrained_kokuno_a4_public_ideal_qs_independent_audit.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Compile independent validator and focused regression
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a4_public_ideal_qs_independent_audit.py
          python -m py_compile tests/test_constrained_kokuno_a4_public_ideal_qs_independent_audit.py

      - name: Materialize save-reloaded schedule and raw independent report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kokuno_agent4_public_ideal_qs_independent_audit
          python - <<'PY'
          import json
          import traceback
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_a4_public_ideal_qs_independent_audit import (
              TASK,
              UPSTREAM_HEAD,
              audit_loaded_public_ideal_schedule,
              default_schedule,
          )
          from openai_ns_reconstruction.kokuno_public_ideal_exterior_qs_schedule import (
              KokunoPublicIdealExteriorQsSchedule,
          )

          root = Path("artifacts/kokuno_agent4_public_ideal_qs_independent_audit")
          candidate_path = root / "candidate.json"
          report_path = root / "independent_report.json"
          schedule = default_schedule()
          schedule.save_configuration(candidate_path)
          loaded = KokunoPublicIdealExteriorQsSchedule.load_configuration(candidate_path)
          try:
              report = audit_loaded_public_ideal_schedule(loaded, schedule)
          except Exception as exc:
              report = {
                  "schema": "kokuno-a4-public-ideal-qs-independent-audit-exception-v1",
                  "task": TASK,
                  "upstream_head": UPSTREAM_HEAD,
                  "candidate_semantic_sha256": loaded.semantic_sha256,
                  "audit_exception_type": type(exc).__name__,
                  "audit_exception": str(exc),
                  "traceback": traceback.format_exc(),
                  "pde_validated": False,
              }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload raw candidate and independent receipt before enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-public-ideal-qs-independent-audit
          path: artifacts/kokuno_agent4_public_ideal_qs_independent_audit/

      - name: Run parent and independent focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_public_ideal_exterior_qs_schedule.py \
            tests/test_constrained_kokuno_a4_public_ideal_qs_independent_audit.py

      - name: Enforce preregistered K4-VAL-127 gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_a4_public_ideal_qs_independent_audit import (
              enforce_preregistered_gates,
              public_api_has_no_scientific_tuning_knobs,
          )

          path = Path("artifacts/kokuno_agent4_public_ideal_qs_independent_audit/independent_report.json")
          report = json.loads(path.read_text())
          if "audit_exception" in report:
              raise AssertionError(
                  f"K4-VAL-127 audit raised {report.get('audit_exception_type')}: "
                  f"{report['audit_exception']}"
              )
          enforce_preregistered_gates(report)
          assert public_api_has_no_scientific_tuning_knobs() is True
          assert report["truth_boundary"]["current_candidate_q_s_audited"] is False
          assert report["truth_boundary"]["pde_validated"] is False
          assert report["final_project_admission_ready"] is False
          assert report["gates"]["final_project_momentum_gate_unchanged"] == 1.0e-3
          assert report["gates"]["final_project_divergence_gate_unchanged"] == 1.0e-5
          assert report["gates"]["final_project_quadrature_unchanged"] == [24, 48, 96]
          PY
