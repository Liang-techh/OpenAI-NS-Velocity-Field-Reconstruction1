name: kokuno-agent3-heldin-damped-correction-search

on:
  push:
    branches:
      - codex/kokuno-a3-heldin-damped-search-049
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_damping.py"
      - "tests/test_constrained_kokuno_same_cycle_defect_contract.py"
      - "tests/test_constrained_kokuno_finite_correction_cycle_contract.py"
      - "tests/test_constrained_kokuno_finite_correction_cycle_ledger.py"
      - "tests/test_constrained_kokuno_finite_correction_damping.py"
      - ".github/workflows/kokuno-agent3-heldin-damped-correction-search.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-heldin-damped-correction-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-heldin-damped-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent-3 damping chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py
          src/openai_ns_reconstruction/kokuno_finite_correction_damping.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_same_cycle_defect_contract.py
          tests/test_constrained_kokuno_finite_correction_cycle_contract.py
          tests/test_constrained_kokuno_finite_correction_cycle_ledger.py
          tests/test_constrained_kokuno_finite_correction_damping.py
      - name: Emit deterministic damped-search receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_finite_correction_damping
          --output artifacts/kokuno_agent3_heldin_damped_correction_search_v1.json
      - name: Check held-in-only selection truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/kokuno_agent3_heldin_damped_correction_search_v1.json').read_text())
          assert r['schema'] == 'kokuno-a3-heldin-damped-correction-search-v1'
          assert r['provenance']['parent_agent3_head'] == 'ce93d1681f6ad879b9ca2d33e595ca479cacbf9f'
          q = r['analytic_mechanics_regression']
          a = q['report']
          assert a['damping_grid'] == [1.0, .5, .25, .125]
          assert a['selected_alpha'] == .5
          assert a['selected_trial_index'] == 1
          assert a['heldout_used_for_alpha_selection'] is False
          assert a['heldout_trial_evaluation_count'] == 1
          assert a['trials'][0]['held_in_eligible'] is False
          assert abs(a['trials'][0]['held_in_rms_ratio'] - 1.4) <= 2e-9
          assert abs(a['trials'][1]['held_in_rms_ratio'] - .2) <= 2e-9
          assert abs(a['selected_transition']['held_out_rms_ratio'] - .2) <= 2e-9
          assert a['selected_step_admitted'] is True
          b = r['truth_boundary']
          assert b['heldin_only_frozen_grid_damping_search_executable'] is True
          assert b['alpha_selection_uses_heldout'] is False
          assert b['heldout_evaluated_only_after_alpha_selection'] is True
          assert b['heldout_failure_causes_rejection_without_retuning'] is True
          assert b['actual_defect_recomputed_from_raw_providers'] is True
          assert b['caller_supplied_residual_allowed'] is False
          assert b['caller_supplied_defect_allowed'] is False
          assert b['caller_supplied_stress_allowed'] is False
          assert b['caller_supplied_target_allowed'] is False
          assert b['caller_supplied_gain_allowed'] is False
          assert b['caller_supplied_normalized_score_allowed'] is False
          assert b['caller_supplied_scientific_threshold_allowed'] is False
          assert b['formal_kokuno_correction_cycle_gain_bound_claimed'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['real_candidate_finite_correction_cycle_run'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed_for_real_candidate'] is False
          assert b['pde_validated'] is False
          assert b['final_normalized_momentum_gate'] == 1e-3
          assert b['final_normalized_divergence_gate'] == 1e-5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-heldin-damped-correction-search-v1
          path: artifacts/kokuno_agent3_heldin_damped_correction_search_v1.json
          if-no-files-found: error
      - name: Comment exact damped-search receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_heldin_damped_correction_search_v1.json', 'utf8'));
            const a = r.analytic_mechanics_regression.report;
            const lines = [
              '### Kokuno Agent 3 exact-head held-in-only damped correction search',
              '',
              `frozen damping grid: **${JSON.stringify(a.damping_grid)}**`,
              `selected alpha: **${a.selected_alpha}**`,
              `held-in RMS factors: **${JSON.stringify(a.trials.map(x => x.held_in_rms_ratio))}**`,
              `selected held-out RMS factor: **${a.selected_transition.held_out_rms_ratio}**`,
              `held-out used for alpha selection: **${a.heldout_used_for_alpha_selection}**`,
              `held-out trial evaluations: **${a.heldout_trial_evaluation_count}**`,
              `selected actual-defect step admitted: **${a.selected_step_admitted}**`,
              '',
              'This is an analytic mechanics regression for held-in-only damping selection, not a real Kokuno candidate residual reduction or formal correction-cycle theorem. The damping grid is repository engineering, held-out is not used to tune alpha, and real full-candidate defect consumption / normalized 1e-3 PDE validation remain false.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
