name: kokuno-agent1-pa10-stress-activation-collar

on:
  push:
    branches:
      - codex/kokuno-a1-stress-activation-collar-078
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_stress_activation_collar.py"
      - "tests/test_kokuno_pa10_stress_activation_collar.py"
      - ".github/workflows/kokuno-agent1-pa10-stress-activation-collar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-stress-activation-collar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-activation-collar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile executable stress activation collar
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_stress_activation_collar.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_reference_continuation_collar.py \
            tests/test_kokuno_pa10_stress_activation_collar.py
      - name: Emit source stress-activation receipt
        run: |
          python - <<'PY'
          import json
          from openai_ns_reconstruction.kokuno_pa10_stress_activation_collar import (
              KokunoPA10StressActivationCollar,
          )

          collar = KokunoPA10StressActivationCollar()
          report = collar.report()
          truth = report['truth_boundary']
          geometry = report['geometry']
          probe = report['endpoint_probe']
          assert geometry['displayed_kappa0_range_satisfied'] is True
          assert geometry['X_0'] < geometry['X_1']
          assert max(abs(x - 1.0) for x in probe['start_kappa']) == 0.0
          assert max(abs(x - geometry['selected_kappa0']) for x in probe['end_kappa']) == 0.0
          assert probe['start_delta_log_F_max'] == 0.0
          assert probe['start_delta_U_max'] == 0.0
          assert truth['public_stress_activation_formula_executable'] is True
          assert truth['stress_activation_materialized'] is True
          assert truth['selected_kappa0_chosen_from_ns_residual'] is False
          assert truth['selected_kappa0_global_source_smallness_admitted'] is False
          assert truth['stress_activation_cone_admissibility_independently_certified'] is False
          assert truth['kappa0_continuation_to_X100_materialized'] is False
          assert truth['final_interpolation_to_Xi_materialized'] is False
          assert truth['actual_inner_to_outer_bridge_materialized'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          print(json.dumps({
              'semantic_sha256': report['semantic_sha256'],
              'geometry': geometry,
              'endpoint_probe': probe,
          }, indent=2, sort_keys=True))
          PY
