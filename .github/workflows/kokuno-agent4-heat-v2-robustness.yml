name: kokuno-agent4-heat-v2-robustness

on:
  push:
    branches:
      - codex/kokuno-a4-heat-v2-robustness-010
  pull_request:
    branches:
      - codex/kokuno-a4-heat-v2-robustness-010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a4-heat-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused independent tests
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_heat_discrepancy_independent.py \
            tests/test_constrained_kokuno_heat_replacement_discrepancy_v2.py \
            tests/test_constrained_kokuno_heat_v2_robustness.py
      - name: Generate independent robustness report
        run: |
          python -m openai_ns_reconstruction.kokuno_heat_discrepancy_v2_robustness \
            --output artifacts/kokuno_agent4/heat_v2_robustness_report.json
          cat artifacts/kokuno_agent4/heat_v2_robustness_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-heat-v2-robustness
          path: artifacts/kokuno_agent4/heat_v2_robustness_report.json
