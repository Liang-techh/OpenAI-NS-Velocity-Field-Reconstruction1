name: kokuno-agent4-rational-rectangle-independent-audit

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_rational_rectangle_separation.py'
      - 'src/openai_ns_reconstruction/kokuno_rational_rectangle_independent_audit.py'
      - 'tests/test_constrained_kokuno_rational_rectangle_separation.py'
      - 'tests/test_constrained_kokuno_rational_rectangle_independent_audit.py'
      - '.github/workflows/kokuno-agent4-rational-rectangle-independent-audit.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_rational_rectangle_separation.py'
      - 'src/openai_ns_reconstruction/kokuno_rational_rectangle_independent_audit.py'
      - 'tests/test_constrained_kokuno_rational_rectangle_separation.py'
      - 'tests/test_constrained_kokuno_rational_rectangle_independent_audit.py'
      - '.github/workflows/kokuno-agent4-rational-rectangle-independent-audit.yml'

permissions:
  contents: read

jobs:
  independent-rational-rectangle-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused parent plus independent tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_rational_rectangle_separation.py
          tests/test_constrained_kokuno_rational_rectangle_independent_audit.py
      - name: Generate frozen independent audit report
        run: >-
          python -m openai_ns_reconstruction.kokuno_rational_rectangle_independent_audit
          --output artifacts/constrained/kokuno_agent4_rational_rectangle_independent_audit.json
      - name: Upload independent audit report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-rational-rectangle-independent-audit
          path: artifacts/constrained/kokuno_agent4_rational_rectangle_independent_audit.json
          if-no-files-found: error
