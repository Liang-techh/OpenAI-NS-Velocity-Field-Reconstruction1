name: kokuno-agent3-oscillatory-quadratic-mean

on:
  push:
    branches:
      - codex/kokuno-a3-oscillatory-quadratic-mean-064
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_oscillatory_quadratic_mean.py"
      - "tests/test_constrained_kokuno_oscillatory_quadratic_mean.py"
      - ".github/workflows/kokuno-agent3-oscillatory-quadratic-mean.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent3-oscillatory-quadratic-mean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-oscillatory-quadratic-mean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      A2_HEAD: a20878fb781fe75698ab22cfbe5c36a78f33ddc5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Agent-3 head
        run: |
          git rev-parse HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Install Agent-3 branch
        run: python -m pip install -e '.[dev]'
      - name: Compile and run focused projection regressions
        run: |
          python -W error -m py_compile \
            src/openai_ns_reconstruction/kokuno_oscillatory_quadratic_mean.py \
            tests/test_constrained_kokuno_oscillatory_quadratic_mean.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_oscillatory_quadratic_mean.py
      - name: Emit projection-contract receipt
        run: >-
          python -W error -m
          openai_ns_reconstruction.kokuno_oscillatory_quadratic_mean
          --output artifacts/kokuno_agent3_oscillatory_quadratic_mean_contract_v1.json
      - name: Fetch exact Agent-2 self-advection producer
        run: |
          git fetch --no-tags origin "$A2_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$A2_HEAD"
          rm -rf /tmp/kokuno-a2
          git worktree add --detach /tmp/kokuno-a2 "$A2_HEAD"
          test "$(git -C /tmp/kokuno-a2 rev-parse HEAD)" = "$A2_HEAD"
      - name: Project real frozen A2 quadratic interaction onto cylindrical mean
        run: |
          python -W error - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import openai_ns_reconstruction
          from openai_ns_reconstruction.kokuno_oscillatory_quadratic_mean import (
              AGENT2_HEAD,
              AGENT2_SOURCE_BLOB_SHA,
              ExactAgent2SelfAdvectionBackend,
              materialize_agent2_oscillatory_quadratic_mean,
          )

          assert AGENT2_HEAD == "a20878fb781fe75698ab22cfbe5c36a78f33ddc5"
          openai_ns_reconstruction.__path__.insert(
              0, "/tmp/kokuno-a2/src/openai_ns_reconstruction"
          )
          from openai_ns_reconstruction.kokuno_public_oscillatory_self_advection import (
              evaluate_oscillatory_self_advection_fd6,
          )

          backend = ExactAgent2SelfAdvectionBackend.bind(
              evaluate_oscillatory_self_advection_fd6
          )
          assert backend.source_blob_sha == AGENT2_SOURCE_BLOB_SHA

          radius = np.asarray([0.47, 0.58, 0.69, 0.80, 0.91, 0.76])
          z = np.asarray([-1.00, -0.60, -0.20, 0.20, 0.60, 1.00])
          t = np.asarray([0.42, 0.42, 0.50, 0.50, 0.58, 0.58])
          witness = materialize_agent2_oscillatory_quadratic_mean(
              backend, radius, z, t
          )
          receipt = witness.to_receipt()
          receipt["agent2_exact_head_runtime"] = AGENT2_HEAD
          receipt["preregistered_ring_count"] = 6
          receipt["projection_stability_gate"] = 1.0e-5
          receipt["nonzero_mean_floor"] = 1.0e-12
          Path("artifacts").mkdir(exist_ok=True)
          Path(
              "artifacts/kokuno_agent3_oscillatory_quadratic_mean_a2_v1.json"
          ).write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")

          assert receipt["backend"]["source_blob_matches_pinned"] is True
          assert receipt["angular_orders"] == [32, 64, 128]
          assert max(receipt["successive_mean_relative_differences"]) <= 1.0e-5
          assert receipt["full_ring_self_advection_rms"] >= receipt["mean_rms"]
          assert receipt["mean_to_full_rms_ratio"] <= 1.0 + 1.0e-12
          assert receipt["mean_rms"] >= 1.0e-12
          boundary = receipt["truth_boundary"]
          assert boundary["quadratic_mean_is_complete_ns_defect"] is False
          assert boundary["pressure_gradient_included"] is False
          assert boundary["restricted_forcing_included"] is False
          assert boundary["mean_correction_velocity_materialized_from_this_witness"] is False
          assert boundary["heldout_normalized_ns_residual_assessed"] is False
          assert boundary["residual_reduction_claimed"] is False
          assert boundary["pde_validated"] is False
          print("a2_quadratic_mean_projection=PASS")
          print("mean_rms=", receipt["mean_rms"])
          print("full_ring_rms=", receipt["full_ring_self_advection_rms"])
          print("mean_to_full_ratio=", receipt["mean_to_full_rms_ratio"])
          print("mean_cylindrical=", receipt["mean_cylindrical"])
          PY
      - name: Freeze contract truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(
              Path(
                  "artifacts/kokuno_agent3_oscillatory_quadratic_mean_contract_v1.json"
              ).read_text()
          )
          assert r["schema"] == "kokuno-a3-oscillatory-quadratic-mean-v1"
          assert r["task"] == "KOKUNO-A3-OSCILLATORY-QUADRATIC-MEAN-064"
          assert r["parent_agent3_head"] == "076dd9e7ca1b53d439761d5b726d4028ad51d587"
          assert r["agent2_expected_head"] == "a20878fb781fe75698ab22cfbe5c36a78f33ddc5"
          assert r["projection_ladder"] == [32, 64, 128]
          assert r["analytic_projection_absolute_max_error"] < 2.0e-14
          assert r["real_agent2_numeric_mean_observed_in_this_receipt"] is False
          b = r["truth_boundary"]
          assert b["agent2_self_advection_reimplemented_by_agent3"] is False
          assert b["cylindrical_m0_projection_executable"] is True
          assert b["projection_uses_naive_cartesian_vector_mean"] is False
          assert b["quadratic_mean_is_complete_ns_defect"] is False
          assert b["caller_supplied_residual_allowed"] is False
          assert b["caller_supplied_mean_values_allowed"] is False
          assert b["pde_validated"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-oscillatory-quadratic-mean-v1
          path: |
            artifacts/kokuno_agent3_oscillatory_quadratic_mean_contract_v1.json
            artifacts/kokuno_agent3_oscillatory_quadratic_mean_a2_v1.json
          if-no-files-found: error
