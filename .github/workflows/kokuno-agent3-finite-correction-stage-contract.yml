name: kokuno-agent3-finite-correction-stage-contract

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_finite_correction_stage.py'
      - 'tests/test_constrained_kokuno_finite_correction_stage.py'
      - '.github/workflows/kokuno-agent3-finite-correction-stage-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: python -m pip install -e '.[dev]'

      - name: Compile and run focused regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_finite_correction_stage.py \
            tests/test_constrained_kokuno_finite_correction_stage.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_strict_inner_transport_first_cell_nested_refinement.py \
            tests/test_constrained_kokuno_finite_correction_stage.py

      - name: Verify exact parent Agent-3 radial source identity
        run: |
          set -euo pipefail
          PARENT_HEAD='29b385398d0c7636ed8d4049821a534d80728b33'
          PARENT_BLOB='734f7513d2c6fce9053f878ec15833ba0f1bc797'
          git fetch --no-tags --depth=1 origin "$PARENT_HEAD"
          test "$(git rev-parse "$PARENT_HEAD":src/openai_ns_reconstruction/kokuno_strict_inner_transport_first_cell_nested_refinement.py)" = "$PARENT_BLOB"

      - name: Generate mechanics-only finite correction stage receipt
        run: |
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_finite_correction_stage \
            --output artifacts/kokuno_agent3/finite_correction_stage_contract_mechanics.json

      - name: Enforce current scoped-source fail-closed boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/kokuno_agent3/finite_correction_stage_contract_mechanics.json')
          receipt = json.loads(path.read_text())
          admission = receipt['current_scoped_source_admission']
          boundary = receipt['truth_boundary']
          stage = receipt['mechanics_stage_receipt']

          assert receipt['mechanics_only'] is True
          assert receipt['candidate_residual_evidence'] is False
          assert stage['stage_accepted'] is True
          assert stage['mechanics_only'] is True
          assert stage['pde_validated'] is False
          assert admission['admitted_to_real_finite_correction_cycle'] is False
          assert admission['surrogate_defect_substitution_allowed'] is False
          assert admission['residual_as_forcing_shortcut_allowed'] is False
          missing = set(admission['missing_requirements'])
          assert {
              'complete_ns_defect',
              'pressure_gradient_included',
              'restricted_forcing_included',
              'scoped_transport_stress_authorized_as_correction_target',
          } <= missing
          assert boundary['analytic_kokuno_gain_bindings_complete'] is False
          assert boundary['analytic_kokuno_gain_available'] is False
          assert boundary['observed_gain_is_analytic_kokuno_bound'] is False
          assert boundary['real_candidate_finite_correction_cycle_run'] is False
          assert boundary['heldout_normalized_ns_residual_assessed'] is False
          assert boundary['residual_reduction_claimed'] is False
          assert boundary['same_protocol_comparable_to_st006'] is False
          assert boundary['pde_validated'] is False
          PY

      - name: Upload finite correction stage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-finite-correction-stage-contract
          path: artifacts/kokuno_agent3/finite_correction_stage_contract_mechanics.json
          if-no-files-found: error
