name: kokuno-agent2-oscillatory-stokes-circulation

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_stokes_circulation.py'
      - 'tests/test_constrained_kokuno_oscillatory_stokes_circulation.py'
      - '.github/workflows/kokuno-agent2-oscillatory-stokes-circulation.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert pinned A2 ancestry
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 34e0fd5efab6604f9719ed54a49dd58741ed2308 HEAD
          test "$(git rev-parse 34e0fd5efab6604f9719ed54a49dd58741ed2308:src/openai_ns_reconstruction/kokuno_public_z_pullback_velocity.py)" = "4a3abc1a11f7e054f651dd7bace8ada6d5a6b653"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: >-
          python -m py_compile
          src/openai_ns_reconstruction/kokuno_oscillatory_stokes_circulation.py
          tests/test_constrained_kokuno_oscillatory_stokes_circulation.py

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_oscillatory_stokes_circulation.py
          tests/test_constrained_kokuno_oscillatory_closed_surface_flux.py

      - name: Materialize public-velocity Stokes receipt
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_oscillatory_stokes_circulation import (
              KokunoOscillatoryStokesCirculation,
              public_contract,
          )

          obj = KokunoOscillatoryStokesCirculation()
          result = obj.materialize()
          receipt = {
              'schema': 'kokuno-a2-oscillatory-stokes-circulation-receipt-v1',
              'git_sha': os.environ.get('GITHUB_SHA'),
              'stokes_circulation_sha256': obj.stokes_circulation_sha256,
              'semantic_payload': obj.semantic_payload(),
              'result': result.summary_payload(),
              'public_contract': public_contract(),
          }
          Path('artifacts/kokuno_agent2_oscillatory_stokes_circulation.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'fd_steps': [x['fd_step'] for x in receipt['result']['levels']],
              'level_max_relative_mismatch': [x['max_relative_mismatch'] for x in receipt['result']['levels']],
              'level_min_signal_scale': [x['min_signal_scale'] for x in receipt['result']['levels']],
              'shifted_fine_max_relative_mismatch': receipt['result']['shifted_fine']['max_relative_mismatch'],
              'shifted_fine_min_signal_scale': receipt['result']['shifted_fine']['min_signal_scale'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload Stokes receipt before scientific gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-oscillatory-stokes-circulation
          path: artifacts/kokuno_agent2_oscillatory_stokes_circulation.json
          if-no-files-found: warn

      - name: Enforce frozen Stokes gates
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_oscillatory_stokes_circulation import (
              COARSE_RELATIVE_MISMATCH_MAX,
              FINE_RELATIVE_MISMATCH_MAX,
              MEDIUM_RELATIVE_MISMATCH_MAX,
              SHIFTED_FINE_RELATIVE_MISMATCH_MAX,
              STOKES_SIGNAL_FLOOR,
          )

          receipt = json.loads(Path('artifacts/kokuno_agent2_oscillatory_stokes_circulation.json').read_text())
          result = receipt['result']
          contract = receipt['public_contract']
          failed = []

          limits = (
              COARSE_RELATIVE_MISMATCH_MAX,
              MEDIUM_RELATIVE_MISMATCH_MAX,
              FINE_RELATIVE_MISMATCH_MAX,
          )
          for index, (level, limit) in enumerate(zip(result['levels'], limits)):
              if level['max_relative_mismatch'] > limit:
                  failed.append(f'level_{index}_relative_mismatch')
              if level['min_signal_scale'] < STOKES_SIGNAL_FLOOR:
                  failed.append(f'level_{index}_trivial_signal')

          shifted = result['shifted_fine']
          if shifted['max_relative_mismatch'] > SHIFTED_FINE_RELATIVE_MISMATCH_MAX:
              failed.append('shifted_fine_relative_mismatch')
          if shifted['min_signal_scale'] < STOKES_SIGNAL_FLOOR:
              failed.append('shifted_fine_trivial_signal')

          if contract['forbidden_materialize_inputs_present']:
              failed.append('forbidden_inputs')
          if not contract['uses_only_public_velocity_values']:
              failed.append('nonpublic_velocity_dependency')
          if contract['production_jacobian_used'] or contract['production_divergence_used'] or contract['production_vorticity_used']:
              failed.append('production_derivative_self_certification')
          if contract['mean_projection_performed'] or contract['radial_inverse_performed'] or contract['correction_velocity_constructed']:
              failed.append('agent3_lane_crossed')
          if contract['complete_ns_residual'] or contract['paper_exact'] or contract['pde_validated']:
              failed.append('scientific_boundary_promoted')

          if failed:
              raise SystemExit('oscillatory Stokes gate failed: ' + ', '.join(failed))
          print('oscillatory Stokes gates passed')
          PY
