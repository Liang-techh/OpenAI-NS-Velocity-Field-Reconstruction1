name: kokuno-agent2-current-i4-rf44-firewall-a2-960-restack

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py'
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py'
      - 'src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py'
      - 'tests/test_constrained_kokuno_current_i4_rf44_firewall_a2_960_restack.py'
      - '.github/workflows/kokuno-agent2-current-i4-rf44-firewall-a2-960-restack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact A2 restack head
        uses: actions/checkout@v4
        with:
          path: a2
          fetch-depth: 0

      - name: Verify exact parent, five-file scope, and byte-identical runtime imports
        shell: bash
        run: |
          set -euo pipefail
          parent=107cac08050fddeab778416c1caf019be0f5795b
          git -C a2 merge-base --is-ancestor "$parent" HEAD
          test "$(git -C a2 rev-list --count "$parent"..HEAD)" -eq 1
          git -C a2 diff --name-only "$parent"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/kokuno-agent2-current-i4-rf44-firewall-a2-960-restack.yml
          src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py
          src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py
          src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py
          tests/test_constrained_kokuno_current_i4_rf44_firewall_a2_960_restack.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_i4_rf44_prestate_provider.py)" = 0d8bb6471a4b7825b1b4b428d3b2c38d207729fd
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_i4_exact_backend_correction_firewall.py)" = 0152a85f7fbaf9c32c24c9d5c7d0d11166e3b157
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = 12df3bf6c949baeebf609b366f2973e7f515a157
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py)" = 599baa190ec742d0e532e5517078534124e68d6b
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py)" = 4ae525bad1e4b83c9dcabc1a97d3931562d099a5
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_public_z_pullback_velocity.py)" = 4a3abc1a11f7e054f651dd7bace8ada6d5a6b653
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_public_candidate_velocity.py)" = a0e1b07981ba23a6bd547df14e8cdc89ad0d89ca
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_public_carrier_resolved_velocity.py)" = 77edc85e4ac7aced997c90c2d93e7552e7d0c39b
          test ! -e a2/src/openai_ns_reconstruction/kokuno_current_i4_leading_oscillatory_identity.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install restacked A2 tree
        run: python -m pip install -e 'a2[dev]'

      - name: Compile and run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a2/src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py \
            a2/src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py \
            a2/src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py \
            a2/tests/test_constrained_kokuno_current_i4_rf44_firewall_a2_960_restack.py
          python -m pytest -q -W error \
            a2/tests/test_constrained_kokuno_current_i4_rf44_exact_backend_restack.py \
            a2/tests/test_constrained_kokuno_current_i4_rf44_firewall_a2_960_restack.py

      - name: Materialize unified-lineage receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=a2/src python - <<'PY'
          import inspect
          import json
          from pathlib import Path

          import openai_ns_reconstruction.kokuno_current_i4_exact_backend_correction_firewall as fw
          import openai_ns_reconstruction.kokuno_current_i4_rf44_prestate_provider as pre
          from openai_ns_reconstruction import kokuno_oscillatory_batch_differentials as diff
          from openai_ns_reconstruction.kokuno_current_i4_nonlinear_mean_attribution import (
              AGENT2_DIFFERENTIAL_FUNCTION,
              AGENT2_DIFFERENTIAL_MODULE,
              AGENT2_DIFFERENTIAL_SOURCE_BLOB,
              _git_blob_sha1,
          )

          root = Path('a2/src/openai_ns_reconstruction')
          source = inspect.getsourcefile(diff.evaluate_oscillatory_batch_differentials)
          differential_authenticated = bool(
              source
              and diff.evaluate_oscillatory_batch_differentials.__module__ == AGENT2_DIFFERENTIAL_MODULE
              and diff.evaluate_oscillatory_batch_differentials.__name__ == AGENT2_DIFFERENTIAL_FUNCTION
              and _git_blob_sha1(source) == AGENT2_DIFFERENTIAL_SOURCE_BLOB
              and AGENT2_DIFFERENTIAL_SOURCE_BLOB == '12df3bf6c949baeebf609b366f2973e7f515a157'
          )
          composite_present = (root / 'kokuno_current_i4_leading_oscillatory_identity.py').exists()

          receipt = {
              'schema': 'kokuno-a2-current-i4-rf44-firewall-a2-960-restack-v1',
              'task': 'K2-OSC-115',
              'parent_a2_1224_head': '107cac08050fddeab778416c1caf019be0f5795b',
              'source_a3_1226_head': '571abc47c98001886cdcc6042832635e7bd93f31',
              'source_a2_960_head': '6d2fb1f701a34f783dca15a267ae2ce0734ba741',
              'rf44_prestate_blob': '0d8bb6471a4b7825b1b4b428d3b2c38d207729fd',
              'exact_backend_firewall_blob': '0152a85f7fbaf9c32c24c9d5c7d0d11166e3b157',
              'exact_a2_960_differential_blob': '12df3bf6c949baeebf609b366f2973e7f515a157',
              'exact_a2_960_axis_safety_blob': '599baa190ec742d0e532e5517078534124e68d6b',
              'exact_a2_960_vorticity_diagnostic_blob': '4ae525bad1e4b83c9dcabc1a97d3931562d099a5',
              'same_lineage_rf44_prestate_firewall_a2_960': True,
              'rf44_prestate_materialized': pre.truth_boundary()['rf44_preupdate_state_materialized'],
              'exact_backend_rebind_required': fw.truth_boundary()['exact_backend_rebind_required'],
              'exact_a2_960_differential_runtime_authenticated': differential_authenticated,
              'exact_a2_1080_composite_module_present': composite_present,
              'full_exact_backend_rebind_ready_from_this_stack': differential_authenticated and composite_present,
              'real_exact_backend_bind_executed': False,
              'repository_candidate_rf30_rf39_execution_promoted': False,
              'rf44_postupdate_state_materialized': False,
              'rf44_correction_increment_materialized': False,
              'cartesian_delta_u_materialized': False,
              'finite_correction_cycle_run': False,
              'heldout_ns_residual_assessed': False,
              'residual_reduction_claimed': False,
              'pde_validated': False,
              'final_normalized_momentum_gate': 1.0e-3,
              'final_normalized_divergence_gate': 1.0e-5,
              'residual_defined_free_forcing_allowed': False,
              'remaining_blocker': None if composite_present else (
                  'exact A2 #1080 current-I4 composite runtime remains absent; '
                  'do not execute/promote candidate correction evidence yet'
              ),
          }
          Path('artifacts/current_i4_rf44_firewall_a2_960_restack_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload receipt before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-current-i4-rf44-firewall-a2-960-restack
          path: artifacts/

      - name: Enforce narrow truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/current_i4_rf44_firewall_a2_960_restack_receipt.json').read_text())
          assert p['same_lineage_rf44_prestate_firewall_a2_960'] is True
          assert p['rf44_prestate_materialized'] is True
          assert p['exact_backend_rebind_required'] is True
          assert p['exact_a2_960_differential_runtime_authenticated'] is True
          assert p['exact_a2_1080_composite_module_present'] is False
          assert p['full_exact_backend_rebind_ready_from_this_stack'] is False
          assert p['real_exact_backend_bind_executed'] is False
          assert p['repository_candidate_rf30_rf39_execution_promoted'] is False
          assert p['rf44_postupdate_state_materialized'] is False
          assert p['rf44_correction_increment_materialized'] is False
          assert p['cartesian_delta_u_materialized'] is False
          assert p['finite_correction_cycle_run'] is False
          assert p['heldout_ns_residual_assessed'] is False
          assert p['residual_reduction_claimed'] is False
          assert p['pde_validated'] is False
          assert p['final_normalized_momentum_gate'] == 1.0e-3
          assert p['final_normalized_divergence_gate'] == 1.0e-5
          assert p['residual_defined_free_forcing_allowed'] is False
          assert p['remaining_blocker']
          PY
