name: kokuno-agent3-gain-gated-finite-correction-cycle

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_gain_gated_finite_correction_cycle.py'
      - 'tests/test_constrained_kokuno_gain_gated_finite_correction_cycle.py'
      - '.github/workflows/kokuno-agent3-gain-gated-finite-correction-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact Agent-3 parent and source blob
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 09a74866b6ae7e05626463aed9e22ae0a9b3a57d HEAD
          test "$(git rev-parse 09a74866b6ae7e05626463aed9e22ae0a9b3a57d:src/openai_ns_reconstruction/kokuno_gain_gated_finite_correction_stage.py)" = "192108e125071d1f3fe85a83532f6a43b57b3272"

      - name: Verify pinned corrected-reader five-moment source
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/KokunoYumeto/yang-mills-interacting-workbench.git kokuno-reader
          git -C kokuno-reader checkout --quiet 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C kokuno-reader rev-parse HEAD:navier-stokes/navier_stokes_workbench.tex)" = "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          python - <<'PY'
          from pathlib import Path
          text = Path('kokuno-reader/navier-stokes/navier_stokes_workbench.tex').read_text(encoding='utf-8')
          for phrase in (
              'Explicit five-dimensional moment correction',
              'The complete radial obstruction and the five-equation correction',
          ):
              if phrase not in text:
                  raise SystemExit(f'missing corrected-reader phrase: {phrase}')
          print('corrected-reader finite correction structure pinned')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Agent-3 head
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_gain_gated_finite_correction_cycle.py \
            tests/test_constrained_kokuno_gain_gated_finite_correction_cycle.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_five_moment_correction_gain.py \
            tests/test_constrained_kokuno_finite_correction_fixed_physical_contract.py \
            tests/test_constrained_kokuno_gain_gated_finite_correction_stage.py \
            tests/test_constrained_kokuno_gain_gated_finite_correction_cycle.py

      - name: Generate deterministic four-stage mechanics receipt
        run: |
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_gain_gated_finite_correction_cycle \
            --out artifacts/kokuno_agent3/gain_gated_finite_correction_cycle_mechanics.json

      - name: Fail closed on scientific promotion
        run: |
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_gain_gated_finite_correction_cycle import (
              build_mechanics_report,
              truth_boundary,
          )
          report = build_mechanics_report()
          receipt = report['cycle_receipt']
          truth = truth_boundary()
          assert receipt['fixed_max_stages'] == 4
          assert receipt['stages_attempted'] == 4
          assert receipt['stages_accepted'] == 4
          assert receipt['stop_reason'] == 'fixed_stage_budget_exhausted'
          assert abs(report['final_amplitude'] - 0.0625) <= 1e-14
          assert all(abs(r['held_out_momentum_contraction_factor'] - 0.5) <= 1e-14 for r in receipt['rounds'])
          assert receipt['candidate_lineage_preserved_across_accepted_stages'] is True
          assert receipt['physical_contract_preserved_across_accepted_stages'] is True
          assert receipt['residual_protocol_preserved_across_accepted_stages'] is True
          assert receipt['held_out_excluded_from_every_correction_fit'] is True
          assert receipt['mechanics_only'] is True
          assert receipt['candidate_residual_evidence'] is False
          assert receipt['real_candidate_finite_correction_cycle_run'] is False
          assert receipt['repository_numeric_gate_met'] is False
          for key in (
              'analytic_full_ns_cycle_gain_available',
              'current_real_five_moment_discrepancy_materialized',
              'current_real_ns_correction_velocity_materialized',
              'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed',
              'residual_reduction_claimed',
              'same_protocol_comparable_to_st006',
              'finite_stage_numeric_gate_is_blowup_proof',
              'pde_validated',
          ):
              assert truth[key] is False, key
          assert truth['final_normalized_momentum_gate'] == 1e-3
          assert truth['final_normalized_divergence_gate'] == 1e-5
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-gain-gated-finite-correction-cycle
          path: artifacts/kokuno_agent3/gain_gated_finite_correction_cycle_mechanics.json
          if-no-files-found: warn
