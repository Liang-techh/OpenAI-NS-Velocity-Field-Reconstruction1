name: publication-ingest
on:
  push:
    branches: [research/publish-st006-organize]
    paths: [.github/workflows/publication-ingest.yml]
permissions:
  contents: write
jobs:
  restore-frozen-bytes:
    if: github.repository == 'Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/publish-st006-organize
      - name: Reconstruct and verify immutable transport blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, urllib.request
          from pathlib import Path
          repo='Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
          def blob(sha):
              url=f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ST006-publication'})
              with urllib.request.urlopen(req,timeout=60) as response: data=json.load(response)
              raw=base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()==sha
              return raw.decode('ascii')
          ids=['a30b7ac4dbbe4a12cc87818402397f0098848d5d','f4f0239156183bc67ba7e9fa20a5b9a57d690ae3','625f906641b7c88bcb9900554bc6f7b1059dfb78','4a64f389fa37337b372ca2ade54eb69b2c201caf']
          parts=[blob(s) for s in ids]
          # Correct three transport transcription errors BEFORE checking the original part identity.
          parts[2]=parts[2].replace('E29Ffqwjj3/','E29Ffqwj3/').replace('MosTqB+0b7u7+5','MosTqB+0b7u+5').replace('AtLMnUEJ2','AtLMn+J2')
          raw=parts[2].encode()
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()=='43fdb9cc17098bef0b4aa7472646fc84eb47101c'
          candidate=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          expected='6b4d84b48ab9dbcd2ee1a1858d3e56ef81523f5864369d7e96c6431fccf107a3'
          assert hashlib.sha256(candidate).hexdigest()==expected
          p=json.loads(candidate)
          assert len(p['coefficients'])==1946 and p['pde_validated'] is False
          root=Path('artifacts/research/ST006'); root.mkdir(parents=True,exist_ok=True)
          def write_exact(path,data):
              if path.exists(): assert path.read_bytes()==data, 'Refusing to replace different bytes'
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          write_exact(root/'candidate.json',candidate)
          entries=json.loads(gzip.decompress(base64.b64decode(blob('44c5abe56fe4f400b26314d647a14f5278dd9ef4'),validate=True)))
          checks={'round2/ST006_validation.json':'314ae319fc6d4e6883664db044573bc31b8b1bbc6ae63d7967501833ab0e609a','round2/additional_refinement.json':'ff3fdc9bb762e51c9d487c55b834c7ef35eaa7c4138a6c574b85ffb1ee2d1ed7','round2/summary.json':'0635d2e5482bd814352e527dd0229970074b3d08f5efe9d4a85947d2d577d0bb'}
          assert set(entries)==set(checks)
          for name,text in entries.items():
              data=text.encode();assert hashlib.sha256(data).hexdigest()==checks[name]
              write_exact(root/'evidence'/name,data)
          print('Verified original ST006 SHA256:',expected)
          print('Verified original evidence documents:',len(entries))
          PY
      - name: Commit exact frozen artifacts to the isolated publication branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/research/ST006/candidate.json artifacts/research/ST006/evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish exact ST006 parameters and original independent validation evidence'
          git push origin HEAD:research/publish-st006-organize
