name: agent7-axial-envelope-joint-renorm-screen

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_eq45_axial_envelope_joint_renorm_screen.py'
      - 'tests/test_constrained_eq45_axial_envelope_joint_renorm_screen.py'
      - '.github/workflows/agent7-axial-envelope-joint-renorm-screen.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test joint-renormalized axial-envelope screen
        run: python -m pytest -q -W error tests/test_constrained_eq45_axial_envelope_joint_renorm_screen.py
      - name: Generate joint-renormalized axial-envelope report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.constrained_eq45_axial_envelope_joint_renorm_screen import audit_axial_envelope_joint_renorm_screen
          report = audit_axial_envelope_joint_renorm_screen(
              quadrature_orders=(64, 96),
              morphology_grid_size=33,
          )
          path = Path('artifacts/axial_envelope_joint_renorm_screen/report.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload joint-renormalized axial-envelope report
        uses: actions/upload-artifact@v4
        with:
          name: agent7-axial-envelope-joint-renorm-screen
          path: artifacts/axial_envelope_joint_renorm_screen/report.json
