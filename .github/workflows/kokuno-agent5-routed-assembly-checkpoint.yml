name: kokuno-agent5-routed-assembly-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_routed_assembly_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_heat_exterior_profile.py'
      - 'src/openai_ns_reconstruction/kokuno_core_composite_checkpoint.py'
      - 'tests/test_constrained_kokuno_routed_assembly_checkpoint.py'
      - 'tests/test_constrained_kokuno_heat_exterior_profile.py'
      - '.github/workflows/kokuno-agent5-routed-assembly-checkpoint.yml'

permissions:
  contents: read

jobs:
  routed-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused integration tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_routed_assembly_checkpoint.py
          tests/test_constrained_kokuno_heat_exterior_profile.py
      - name: Generate routed assembly checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_routed_assembly_checkpoint
          --output-dir artifacts/kokuno_agent5/routed_assembly_checkpoint_v4
      - name: Show checkpoint
        run: cat artifacts/kokuno_agent5/routed_assembly_checkpoint_v4/assembly_checkpoint.json
      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-routed-assembly-checkpoint-v4
          path: artifacts/kokuno_agent5/routed_assembly_checkpoint_v4
