name: kokuno-agent4-current-rf40-power-law-leading-oscillatory-divergence-audit

on:
  push:
    branches:
      - codex/kokuno-a4-rf40-power-law-composite-divergence-audit-102
  pull_request:
    branches:
      - codex/kokuno-a2-rf40-power-law-composite-087
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact A4 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a4
          fetch-depth: 0

      - name: Verify exact A2 base ancestry and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a4
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor e36d9da4b7f037e998f5b1658f8c0ea291a76b80 HEAD
          test "$(git rev-list --count e36d9da4b7f037e998f5b1658f8c0ea291a76b80..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only e36d9da4b7f037e998f5b1658f8c0ea291a76b80..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent4-current-rf40-power-law-leading-oscillatory-divergence-audit.yml \
            src/openai_ns_reconstruction/kokuno_a4_current_rf40_power_law_leading_oscillatory_divergence_independent_audit.py \
            tests/test_constrained_kokuno_a4_current_rf40_power_law_leading_oscillatory_divergence_independent_audit.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git show e36d9da4b7f037e998f5b1658f8c0ea291a76b80:src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py | git hash-object --stdin)" = \
            "$(git hash-object src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install A4 test dependencies
        shell: bash
        run: python -m pip install -e './a4[dev]'

      - name: Compile and run A4 scoped independent-validator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a4/src/openai_ns_reconstruction/kokuno_a4_current_rf40_power_law_leading_oscillatory_divergence_independent_audit.py \
            a4/tests/test_constrained_kokuno_a4_current_rf40_power_law_leading_oscillatory_divergence_independent_audit.py
          PYTHONPATH="$PWD/a4/src" python -m pytest -q \
            a4/tests/test_constrained_kokuno_a4_current_rf40_power_law_leading_oscillatory_divergence_independent_audit.py

      - name: Check out exact Agent-1 RF40 power-law sibling
        uses: actions/checkout@v4
        with:
          ref: 2c76ebdc41d6c566f43a1305034ba2ff9dce410b
          path: a1
          fetch-depth: 1

      - name: Authenticate exact Agent-1 sibling and A2 binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a1 rev-parse HEAD)" = "2c76ebdc41d6c566f43a1305034ba2ff9dce410b"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_power_law.py)" = \
            "36a0183352a2005bd0b5f477594e05a2e4fe3868"
          grep -q 'AGENT1_HEAD = "2c76ebdc41d6c566f43a1305034ba2ff9dce410b"' \
            a4/src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py
          grep -q 'TASK = "K2-OSC-087"' \
            a4/src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py

      - name: Materialize exact independent power-law divergence receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          PYTHONPATH="$PWD/a1/src" python - <<'PY'
          from pathlib import Path
          import openai_ns_reconstruction

          a4_pkg = str((Path("a4/src/openai_ns_reconstruction")).resolve())
          openai_ns_reconstruction.__path__.insert(0, a4_pkg)

          import openai_ns_reconstruction.kokuno_a4_current_rf40_power_law_leading_oscillatory_divergence_independent_audit as mod

          receipt = mod.write_receipt(
              Path("receipts/kokuno_a4_current_rf40_power_law_divergence_receipt.json")
          )
          assert receipt["upstream"]["pr"] == 1010
          assert receipt["upstream"]["head"] == "e36d9da4b7f037e998f5b1658f8c0ea291a76b80"
          assert receipt["agent1"]["pr"] == 1005
          assert receipt["probe_counts"] == {
              "inner": 32,
              "power_law": 72,
              "X3_seam": 16,
              "axis": 5,
          }
          PY

      - name: Upload real receipt before scientific enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-current-rf40-power-law-divergence-audit
          path: receipts/kokuno_a4_current_rf40_power_law_divergence_receipt.json
          if-no-files-found: error

      - name: Enforce preregistered scientific and firewall gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/a1/src" python - <<'PY'
          from pathlib import Path
          import json
          import openai_ns_reconstruction

          a4_pkg = str((Path("a4/src/openai_ns_reconstruction")).resolve())
          openai_ns_reconstruction.__path__.insert(0, a4_pkg)

          import openai_ns_reconstruction.kokuno_a4_current_rf40_power_law_leading_oscillatory_divergence_independent_audit as mod

          path = Path("receipts/kokuno_a4_current_rf40_power_law_divergence_receipt.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          mod.enforce_receipt(receipt)

          fine = receipt["resolution_ladder"][-1]
          for region in ("inner", "power_law"):
              print(region)
              for stage in ("leading", "total", "oscillatory_increment"):
                  row = fine[region][stage]
                  print(
                      stage,
                      "max=", row["sampled_max"],
                      "weighted_rms=", row["weighted_rms"],
                      "volume_l2=", row["volume_l2_estimate"],
                      "normalized_max=", row["normalized_sampled_max"],
                  )
          print("X3_seam_total_max=", fine["X3_seam"]["total"]["sampled_max"])
          print("axis_total_max=", fine["axis"]["total"]["sampled_max"])
          PY
