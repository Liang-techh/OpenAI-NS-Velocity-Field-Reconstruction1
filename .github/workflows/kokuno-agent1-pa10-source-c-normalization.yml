name: kokuno-agent1-pa10-source-c-normalization

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-source-c-normalization-068
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_c_normalized_physical_center.py"
      - "tests/test_constrained_kokuno_pa10_source_c_normalized_physical_center.py"
      - ".github/workflows/kokuno-agent1-pa10-source-c-normalization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-source-c-normalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-c-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_axis_domain.py \
            src/openai_ns_reconstruction/kokuno_pa10_leading_axis_profile_contract.py \
            src/openai_ns_reconstruction/kokuno_pa10_phi0_profile_contract.py \
            src/openai_ns_reconstruction/kokuno_pa10_physical_center_profile_contract.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_c_normalized_physical_center.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_physical_center_profile_contract.py \
            tests/test_constrained_kokuno_pa10_source_c_normalized_physical_center.py
      - name: Generate exact-head source-C receipt and reloadable config
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_c_normalized_physical_center \
            --output artifacts/kokuno_agent1/pa10_source_c_normalization_v1/report.json \
            --config-output artifacts/kokuno_agent1/pa10_source_c_normalization_v1/config.json
      - name: Bind exact head and validate truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          from openai_ns_reconstruction.kokuno_pa10_source_c_normalized_physical_center import (
              KokunoPA10SourceCNormalizedPhysicalCenter,
          )

          root = Path('artifacts/kokuno_agent1/pa10_source_c_normalization_v1')
          report_path = root / 'report.json'
          config_path = root / 'config.json'
          payload = json.loads(report_path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          report_path.write_text(raw)

          profile = KokunoPA10SourceCNormalizedPhysicalCenter.load_configuration(config_path)
          assert profile.configuration() == payload['configuration']
          certificate = payload['source_C_certificate']
          assert certificate['configured_C'] == 1000.0
          assert certificate['phi_star_complex_sup_upper'] < 1000.0
          assert certificate['normalized_g_complex_sup_upper'] < 1.0
          assert certificate['source_complex_C_normalization_agent1_machine_certified'] is True
          assert certificate['source_complex_C_normalization_independently_admitted'] is False

          normalization = payload['normalization_contract']
          assert normalization['same_C_in_physical_F'] is True
          assert normalization['same_C_in_outer_schedule'] is True
          assert normalization['CR001_energy_normalization_used_as_source_C_proof'] is False
          assert normalization['source_C_used_as_CR001_energy_normalizer'] is False

          truth = payload['truth_boundary']
          assert truth['source_complex_C_normalization_agent1_machine_certified'] is True
          assert truth['source_complex_C_normalization_independently_admitted'] is False
          assert truth['selected_C_chosen_from_ns_residual'] is False
          assert truth['selected_C_is_CR001_energy_normalizer'] is False
          assert truth['source_center_is_final_corrected_fixed_point'] is False
          assert truth['fixed_point_correction_materialized'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['cartesian_spacetime_velocity_materialized'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          gates = payload['scientific_gates']
          assert gates['momentum_max_l2'] == 1e-3
          assert gates['divergence_max_l2'] == 1e-5
          assert gates['free_residual_defined_forcing_forbidden'] is True

          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('source_C_certificate=', certificate)
          print('machine_checks=', payload['machine_checks'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-source-c-normalization-v1
          path: artifacts/kokuno_agent1/pa10_source_c_normalization_v1/
          if-no-files-found: error
