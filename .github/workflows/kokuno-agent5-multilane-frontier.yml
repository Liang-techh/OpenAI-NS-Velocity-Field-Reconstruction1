name: kokuno-agent5-multilane-frontier

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_multilane_frontier_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_support_localization_resolution_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_multilane_frontier_checkpoint.py'
      - 'tests/test_constrained_kokuno_support_localization_resolution_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-multilane-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-multilane-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-5 frontier tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_support_localization_resolution_routing_checkpoint.py
          tests/test_constrained_kokuno_multilane_frontier_checkpoint.py
      - name: Generate fail-closed frontier bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_multilane_frontier_checkpoint
          --output-dir artifacts/kokuno_agent5/multilane_frontier_checkpoint_v19
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/multilane_frontier_checkpoint_v19/multilane_frontier_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-multilane-frontier-checkpoint-v19
          path: artifacts/kokuno_agent5/multilane_frontier_checkpoint_v19
