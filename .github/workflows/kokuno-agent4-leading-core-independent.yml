name: kokuno-agent4-leading-core-independent

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_independent_leading_core.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_core_series.py'
      - 'src/openai_ns_reconstruction/kokuno_similarity_coordinates.py'
      - 'src/openai_ns_reconstruction/paper_core_series.py'
      - 'tests/test_constrained_kokuno_independent_leading_core.py'
      - 'tests/test_constrained_kokuno_leading_core_series.py'
      - '.github/workflows/kokuno-agent4-leading-core-independent.yml'

permissions:
  contents: read

jobs:
  independent-leading-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run focused independent and upstream regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_independent_leading_core.py
          tests/test_constrained_kokuno_leading_core_series.py
      - name: Generate independent leading-core report
        run: python -m openai_ns_reconstruction.kokuno_independent_leading_core
      - name: Show report
        run: cat artifacts/kokuno_independent_validation/leading_core_preflight.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-leading-core-independent
          path: artifacts/kokuno_independent_validation/leading_core_preflight.json
