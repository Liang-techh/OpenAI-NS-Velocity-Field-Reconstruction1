name: agent9-st051b-gain005-material-path

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_st051b_gain005_material_path.py'
      - 'tests/test_constrained_st051b_gain005_material_path.py'
      - 'docs/external_methods/CR-A9-055-st051b-gain005-material-path.md'
      - '.github/workflows/agent9-st051b-gain005-material-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout Agent-9 branch
        uses: actions/checkout@v4

      - name: Checkout exact Agent-7 ST051-B static headroom source
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 187157d377b14bae56415648ac100342f2b8bbb0
          path: external/st051b_source

      - name: Checkout exact frozen Agent-9 path engine
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 6699a698c9fb2f0a0986e7aefc5fe0ee431cd5ad
          path: external/agent9_path_source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'

      - name: Warning-clean compile and focused regressions
        run: |
          python -W error -m py_compile src/openai_ns_reconstruction/constrained_st051b_gain005_material_path.py
          python -W error -m pytest -q tests/test_constrained_st051b_gain005_material_path.py

      - name: Execute exact-source static gain .05 material-path replay
        run: |
          mkdir -p outputs/agent9-st051b-gain005-material-path
          PYTHONPATH=src python src/openai_ns_reconstruction/constrained_st051b_gain005_material_path.py \
            --candidate-root external/st051b_source \
            --agent9-root external/agent9_path_source \
            --out outputs/agent9-st051b-gain005-material-path/report.json \
            | tee outputs/agent9-st051b-gain005-material-path/run.log

      - name: Verify fail-closed truth boundary and frozen population
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/agent9-st051b-gain005-material-path/report.json')
          r=json.loads(p.read_text())
          assert r['task_id']=='CR-A9-055'
          assert r['lineage']['parent_candidate']=='ST051-B'
          assert r['lineage']['parent_head']=='4b784f1b8457af2ead49295631d834d4e882000b'
          assert r['lineage']['agent7_headroom_head']=='187157d377b14bae56415648ac100342f2b8bbb0'
          assert r['lineage']['agent9_path_engine_head']=='6699a698c9fb2f0a0986e7aefc5fe0ee431cd5ad'
          assert r['frozen_material_path_contract']['path_count']==48
          assert r['frozen_material_path_contract']['paired_material_line_count']==24
          assert r['redistribution']['lower_gain_control']==0.025
          assert r['redistribution']['higher_gain_under_test']==0.05
          assert r['redistribution']['frozen_source_alpha']==2.520520814687742
          assert r['redistribution']['transform_rebalanced_on_st051b'] is False
          assert r['redistribution']['gain_values_outside_preregistered_grid_evaluated'] is False
          for key in ('parent_material_paths','lower_gain_material_paths','higher_gain_material_paths'):
              assert r[key]['path_count']==48
              assert r[key]['paired_material_line_count']==24
          assert r['truth_boundary']['canonical_velocity_changed'] is False
          assert r['truth_boundary']['held_out_pde_residual_evaluated'] is False
          assert r['truth_boundary']['production_redistribution_gain_selected'] is False
          assert r['truth_boundary']['visualization_ready'] is False
          assert r['truth_boundary']['visual_correspondence_verified'] is False
          assert r['truth_boundary']['pde_validated'] is False
          assert r['truth_boundary']['paper_exact'] is False
          print('report_sha256=', r['report_sha256'])
          print('higher_vs_lower=', r['higher_vs_lower'])
          print('higher_vs_lower_by_radius=', r['higher_vs_lower_by_seed_radius'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST051-B-static-gain005-material-path
          path: outputs/agent9-st051b-gain005-material-path/
          if-no-files-found: error
