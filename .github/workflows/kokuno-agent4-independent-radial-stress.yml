name: kokuno-agent4-independent-radial-stress

on:
  push:
    branches:
      - codex/kokuno-a4-independent-radial-stress-043
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_agent4_independent_radial_stress_audit.py"
      - "tests/test_constrained_kokuno_agent4_independent_radial_stress_audit.py"
      - ".github/workflows/kokuno-agent4-independent-radial-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-independent-radial-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-radial-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent-4 independent audit
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_agent4_independent_radial_stress_audit.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_agent4_independent_radial_stress_audit.py
      - name: Generate deterministic independent radial-stress receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_agent4_independent_radial_stress_audit
          --output artifacts/kokuno_agent4_independent_radial_stress_audit_v1.json
      - name: Check fail-closed truth boundary and print scientific verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent4_independent_radial_stress_audit_v1.json')
          r = json.loads(p.read_text())
          t = r['truth_boundary']
          assert r['provenance']['parent_agent3_head'] == '2271c52412922c8255cede8aee9a01e68ba55a55'
          assert r['provenance']['admitted_agent2_head'] == '732800ce4990464b49c8aa32d0dff4580f6684d4'
          assert t['public_black_box_velocity_consumed'] is True
          assert t['public_black_box_time_derivative_consumed'] is True
          assert t['agent3_fd4_self_defect_helper_used'] is False
          assert t['agent3_compact_stress_constructor_used'] is False
          assert t['agent3_radial_derivative_used'] is False
          assert t['full_same_cycle_composite_requested_stress_materialized'] is False
          assert t['public_velocity_correction_materialized'] is False
          assert t['heldout_ns_momentum_residual_assessed'] is False
          assert t['formal_full_domain_pde_gate_assessed'] is False
          assert t['pde_validated'] is False
          print('independent_radial_stress_preflight_passed=', r['independent_radial_stress_preflight_passed'])
          print('failed_guards=', r['failed_guards'])
          for channel in ('theta_e2', 'axial_e1'):
              c = r['convergence'][channel]
              print(channel, 'relative_rms_by_radial_count=', c['relative_rms_by_radial_count'])
              print(channel, 'refinement_ratios=', c['refinement_ratios'])
              print(channel, 'finest_relative_max=', c['finest_relative_max'])
              print(channel, 'finest_moment_complement_relative=', c['finest_moment_complement_relative'])
              print(channel, 'finest_edge_relative=', c['finest_edge_relative'])
              print(channel, 'sign_flip_mutation=', c['finest_sign_flip_mutation_relative_rms'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-independent-radial-stress-audit-v1
          path: artifacts/kokuno_agent4_independent_radial_stress_audit_v1.json
          if-no-files-found: error
