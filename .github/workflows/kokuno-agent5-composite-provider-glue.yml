name: kokuno-agent5-composite-provider-glue

on:
  push:
    branches:
      - codex/kokuno-a5-composite-provider-glue-051
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_composite_provider_glue.py"
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py"
      - "tests/test_constrained_kokuno_a5_composite_provider_glue.py"
      - ".github/workflows/kokuno-agent5-composite-provider-glue.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent5-composite-provider-glue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-composite-provider-glue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile typed glue and imported Agent-3 contracts
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py
          src/openai_ns_reconstruction/kokuno_a5_composite_provider_glue.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_same_cycle_defect_contract.py
          tests/test_constrained_kokuno_finite_correction_cycle_contract.py
          tests/test_constrained_kokuno_a5_composite_provider_glue.py
      - name: Emit deterministic Agent-5 glue receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_a5_composite_provider_glue
          --output artifacts/kokuno_agent5_composite_provider_glue_v1.json
      - name: Check fail-closed truth boundary and fixed gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/kokuno_agent5_composite_provider_glue_v1.json').read_text())
          assert r['schema'] == 'kokuno-a5-composite-provider-glue-v1'
          assert r['provenance']['parent_a5_head'] == 'e95cdd5875c90824a55922cc27ee0d7c81da471f'
          q = r['manufactured_regression']
          assert q['assembly_max_abs_error'] == 0.0
          assert q['same_cycle_defect_max_abs_error'] <= 2e-11
          assert q['held_in_vector_rms'] > 0.0
          assert q['held_out_vector_rms'] > 0.0
          b = r['truth_boundary']
          assert b['typed_composite_velocity_provider_executable'] is True
          assert b['leading_plus_oscillatory_assembly_executable'] is True
          assert b['optional_correction_slot_executable'] is True
          assert b['bundle_velocity_velocity_dt_adapter_executable'] is True
          assert b['pressure_forwarded_without_fit'] is True
          assert b['restricted_forcing_forwarded_without_redefinition'] is True
          assert b['caller_supplied_residual_allowed'] is False
          assert b['caller_supplied_defect_allowed'] is False
          assert b['caller_supplied_stress_allowed'] is False
          assert b['caller_supplied_target_allowed'] is False
          assert b['real_agent1_global_leading_handoff_available_here'] is False
          assert b['real_agent1_matched_pressure_handoff_available_here'] is False
          assert b['restricted_forcing_semantics_independently_validated_here'] is False
          assert b['real_full_candidate_instantiated'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['correction_ready'] is False
          assert b['candidate_artifact_instantiated'] is False
          assert b['velocity_export_ready'] is False
          assert b['formal_full_domain_pde_gate_assessed'] is False
          assert b['pde_validated'] is False
          assert b['final_normalized_momentum_gate'] == 1e-3
          assert b['final_normalized_divergence_gate'] == 1e-5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-composite-provider-glue-v1
          path: artifacts/kokuno_agent5_composite_provider_glue_v1.json
          if-no-files-found: error
      - name: Comment exact glue receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent5_composite_provider_glue_v1.json', 'utf8'));
            const q = r.manufactured_regression;
            const b = r.truth_boundary;
            const lines = [
              '### Kokuno Agent 5 exact-head composite-provider glue',
              '',
              `manufactured assembly max abs error: **${q.assembly_max_abs_error}**`,
              `manufactured same-cycle defect max abs error: **${q.same_cycle_defect_max_abs_error}**`,
              `held-in raw defect RMS: **${q.held_in_vector_rms}**`,
              `held-out raw defect RMS: **${q.held_out_vector_rms}**`,
              '',
              `typed composite provider executable: **${b.typed_composite_velocity_provider_executable}**`,
              `real full candidate instantiated: **${b.real_full_candidate_instantiated}**`,
              `pde_validated: **${b.pde_validated}**`,
              '',
              'This is integration mechanics only. It adds the typed leading + oscillatory + optional-correction provider seam consumed by the existing Agent-3 raw-defect contract. It does not fabricate the missing Agent-1 global leading/matched pressure, does not redefine restricted forcing, and is not a Kokuno full-candidate residual.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
