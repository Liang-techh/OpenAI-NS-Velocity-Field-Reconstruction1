name: kokuno-agent5-support-localization-routing

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_support_localized_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_support_localized_cartesian_independent.py'
      - 'src/openai_ns_reconstruction/kokuno_support_localization_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_source_support_localized_curl.py'
      - 'tests/test_constrained_kokuno_support_localized_cartesian_independent.py'
      - 'tests/test_constrained_kokuno_support_localization_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-support-localization-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-support-localization-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-2/4/5 support-localization tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_support_localized_curl.py
          tests/test_constrained_kokuno_support_localized_cartesian_independent.py
          tests/test_constrained_kokuno_support_localization_routing_checkpoint.py
      - name: Generate fail-closed routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_support_localization_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/support_localization_routing_checkpoint_v17
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/support_localization_routing_checkpoint_v17/support_localization_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-support-localization-routing-checkpoint-v17
          path: artifacts/kokuno_agent5/support_localization_routing_checkpoint_v17
