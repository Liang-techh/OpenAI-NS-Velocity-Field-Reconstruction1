name: kokuno-agent5-integration-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_integration_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_axis_profiles.py'
      - 'src/openai_ns_reconstruction/kokuno_similarity_coordinates.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_independent_radial_stress.py'
      - 'tests/test_constrained_kokuno_integration_checkpoint.py'
      - 'artifacts/bipolar_joint_capped/candidate.json'
      - '.github/workflows/kokuno-agent5-integration-checkpoint.yml'

permissions:
  contents: read

jobs:
  integration-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run focused Agent-5 integration regression
        run: python -m pytest -q -W error tests/test_constrained_kokuno_integration_checkpoint.py
      - name: Generate reproducible Agent-1--4 integration checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_integration_checkpoint
          --output-dir artifacts/kokuno_agent5/integration_checkpoint_v2
          --time 0.5
          --radial-count 65
          --angular-count 16
      - name: Show checkpoint receipt
        run: cat artifacts/kokuno_agent5/integration_checkpoint_v2/integration_checkpoint.json
      - name: Upload checkpoint bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-integration-checkpoint
          path: artifacts/kokuno_agent5/integration_checkpoint_v2/
