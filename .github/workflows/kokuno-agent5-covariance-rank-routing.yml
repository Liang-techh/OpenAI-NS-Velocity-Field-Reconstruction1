name: kokuno-agent5-covariance-rank-routing

on:
  push:
    branches:
      - codex/kokuno-a5-covariance-rank-routing-029
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_multiband_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_multiband_independent_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_covariance_rank_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_source_multiband_real_pair_family.py'
      - 'tests/test_constrained_kokuno_source_multiband_independent_audit.py'
      - 'tests/test_constrained_kokuno_covariance_rank_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-covariance-rank-routing.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_multiband_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_multiband_independent_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_covariance_rank_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_source_multiband_real_pair_family.py'
      - 'tests/test_constrained_kokuno_source_multiband_independent_audit.py'
      - 'tests/test_constrained_kokuno_covariance_rank_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-covariance-rank-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-covariance-rank-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused executable-ancestry plus Agent-5 tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_multiband_real_pair_family.py
          tests/test_constrained_kokuno_source_multiband_independent_audit.py
          tests/test_constrained_kokuno_covariance_rank_routing_checkpoint.py
      - name: Generate deterministic Agent-5 checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_covariance_rank_routing_checkpoint
          --output artifacts/kokuno_agent5/covariance_rank_routing_checkpoint_v29/checkpoint.json
      - name: Show checkpoint
        run: cat artifacts/kokuno_agent5/covariance_rank_routing_checkpoint_v29/checkpoint.json
      - name: Upload routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-covariance-rank-routing-checkpoint-v29
          path: artifacts/kokuno_agent5/covariance_rank_routing_checkpoint_v29
          if-no-files-found: error
