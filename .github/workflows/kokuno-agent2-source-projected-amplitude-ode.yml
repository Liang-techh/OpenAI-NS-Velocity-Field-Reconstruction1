name: kokuno-agent2-source-projected-amplitude-ode

on:
  push:
    branches:
      - codex/kokuno-a2-source-projected-amplitude-ode-092
  pull_request:
    branches:
      - codex/kokuno-a2-source-background-phase-jet-091
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact A2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a2
          fetch-depth: 0

      - name: Verify exact parent ancestry and strict three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a2
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor f3a8ac969832f73aa13d9af260593ea0bd730e46 HEAD
          test "$(git rev-list --count f3a8ac969832f73aa13d9af260593ea0bd730e46..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only f3a8ac969832f73aa13d9af260593ea0bd730e46..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent2-source-projected-amplitude-ode.yml \
            src/openai_ns_reconstruction/kokuno_source_projected_amplitude_ode.py \
            tests/test_constrained_kokuno_source_projected_amplitude_ode.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git hash-object src/openai_ns_reconstruction/kokuno_source_background_phase_jet.py)" = \
            "c3b455923bf697b15a4c20d5bb6fd678b526d475"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install A2 test dependencies
        shell: bash
        run: python -m pip install -e './a2[dev]'

      - name: Compile and run focused projected-amplitude tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a2/src/openai_ns_reconstruction/kokuno_source_projected_amplitude_ode.py \
            a2/tests/test_constrained_kokuno_source_projected_amplitude_ode.py
          PYTHONPATH="$PWD/a2/src" python -m pytest -q \
            a2/tests/test_constrained_kokuno_source_phase_coefficient_jet.py \
            a2/tests/test_constrained_kokuno_source_background_phase_jet.py \
            a2/tests/test_constrained_kokuno_source_projected_amplitude_ode.py

      - name: Check out exact corrected Kokuno public source
        uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: source
          fetch-depth: 1

      - name: Authenticate corrected source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "143f6773feb424ad9ed3a8d116653200f20346b7"
          test "$(git -C source hash-object navier-stokes/navier_stokes_workbench.tex)" = \
            "205a99807302e21a51c5eaf223390c0dfc42bcd0"

      - name: Materialize projected-amplitude ODE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          PYTHONPATH="$PWD/a2/src" python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import numpy as np

          from openai_ns_reconstruction.kokuno_source_phase_coefficient_jet import (
              SourceBackgroundPhaseJet,
              source_phase_vector_jet,
          )
          from openai_ns_reconstruction.kokuno_source_projected_amplitude_ode import (
              source_projected_amplitude_ode_contract,
              source_projected_amplitude_ode_rhs,
          )

          radius = np.array([0.83, 1.27, 1.61])
          zed = np.array([-0.31, 0.44, 0.12])
          pulse_v = np.array([0.35, 0.58, 0.41])
          epsilon = 0.17
          p = 2.0
          p_z = -0.75
          k = 5.0
          m = -2
          bg = SourceBackgroundPhaseJet(
              f=radius**2 + zed**2,
              g=radius * zed,
              f_r=2.0 * radius,
              g_r=zed,
              f_z=2.0 * zed,
              g_z=radius,
              f_rr=2.0 * np.ones_like(radius),
              g_rr=np.zeros_like(radius),
              f_rz=np.zeros_like(radius),
              g_rz=np.ones_like(radius),
              f_zz=2.0 * np.ones_like(radius),
              g_zz=np.zeros_like(radius),
          )
          phase = source_phase_vector_jet(
              radius,
              np.array([0.2, -0.6, 0.4]),
              zed,
              pulse_v,
              bg,
              epsilon=epsilon,
              p=p,
              p_z=p_z,
              x_0=0.41,
          )
          seed = np.broadcast_to(
              np.array([0.31 + 0.17j, -0.22 + 0.09j, 0.43 - 0.11j]),
              phase.n_phi.shape,
          )
          t_m = np.cross(phase.n_phi, seed)
          forcing = np.broadcast_to(
              np.array([0.07 - 0.03j, -0.11 + 0.05j, 0.09 + 0.02j]),
              phase.n_phi.shape,
          ).copy()
          result = source_projected_amplitude_ode_rhs(
              radius,
              bg,
              phase,
              t_m,
              forcing,
              epsilon=epsilon,
              p=p,
              p_z=p_z,
              k=k,
              m=m,
          )
          contract = source_projected_amplitude_ode_contract()
          constraint_error = result.constraint_derivative - result.expected_constraint_derivative
          receipt = {
              "schema": "kokuno-agent2-source-projected-amplitude-ode-receipt-v1",
              "head": "${{ github.event.pull_request.head.sha || github.sha }}",
              "source_commit": contract["source_commit"],
              "source_workbench_blob": contract["source_workbench_blob"],
              "batch_size": int(radius.size),
              "mode_m": int(m),
              "carrier_k": float(k),
              "damping_min": float(np.min(result.damping)),
              "full_equation_residual_abs_max": float(
                  np.max(np.abs(result.full_equation_residual))
              ),
              "transverse_constraint_abs_max": float(np.max(np.abs(result.constraint))),
              "constraint_evolution_abs_max_error": float(
                  np.max(np.abs(constraint_error))
              ),
              "pressure_finite": bool(
                  np.all(np.isfinite(result.pressure.real))
                  and np.all(np.isfinite(result.pressure.imag))
              ),
              "source_projected_amplitude_rhs_materialized": contract[
                  "source_projected_amplitude_rhs_materialized"
              ],
              "source_pressure_elimination_executable": contract[
                  "source_pressure_elimination_executable"
              ],
              "caller_supplies_n_phi_prime": contract["caller_supplies_n_phi_prime"],
              "caller_supplies_mode_pressure_pi_m": contract[
                  "caller_supplies_mode_pressure_pi_m"
              ],
              "source_zero_data_ivp_solver_materialized": contract[
                  "source_zero_data_ivp_solver_materialized"
              ],
              "source_amplitude_directional_jet_materialized": contract[
                  "source_amplitude_directional_jet_materialized"
              ],
              "source_amplitude_ode_materialized": contract[
                  "source_amplitude_ode_materialized"
              ],
              "self_contained_velocity_xyzt_provider": contract[
                  "self_contained_velocity_xyzt_provider"
              ],
              "paper_exact": contract["paper_exact"],
              "complete_ns_residual_assessed": contract["complete_ns_residual_assessed"],
              "residual_reduction_claimed": contract["residual_reduction_claimed"],
              "pde_validated": contract["pde_validated"],
          }
          Path("receipts/kokuno_a2_source_projected_amplitude_ode.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload receipt before gate enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a2-source-projected-amplitude-ode
          path: receipts/kokuno_a2_source_projected_amplitude_ode.json
          if-no-files-found: error

      - name: Enforce corrected ODE algebra and truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("receipts/kokuno_a2_source_projected_amplitude_ode.json").read_text(
                  encoding="utf-8"
              )
          )
          assert receipt["batch_size"] == 3
          assert receipt["mode_m"] == -2
          assert receipt["carrier_k"] == 5.0
          assert receipt["damping_min"] > 0.0
          assert receipt["full_equation_residual_abs_max"] <= 5.0e-13
          assert receipt["transverse_constraint_abs_max"] <= 5.0e-13
          assert receipt["constraint_evolution_abs_max_error"] <= 5.0e-13
          assert receipt["pressure_finite"] is True
          assert receipt["source_projected_amplitude_rhs_materialized"] is True
          assert receipt["source_pressure_elimination_executable"] is True
          assert receipt["caller_supplies_n_phi_prime"] is False
          assert receipt["caller_supplies_mode_pressure_pi_m"] is False
          assert receipt["source_zero_data_ivp_solver_materialized"] is False
          assert receipt["source_amplitude_directional_jet_materialized"] is False
          assert receipt["source_amplitude_ode_materialized"] is False
          assert receipt["self_contained_velocity_xyzt_provider"] is False
          assert receipt["paper_exact"] is False
          assert receipt["complete_ns_residual_assessed"] is False
          assert receipt["residual_reduction_claimed"] is False
          assert receipt["pde_validated"] is False
          PY
