name: agent7-st052m-reservoir-axial-stretch-audit

on:
  pull_request:
    paths:
      - 'experiments/root_st052/agent7_st052m_reservoir_axial_stretch_audit.py'
      - 'experiments/root_st052/test_agent7_st052m_reservoir_axial_stretch_audit.py'
      - '.github/workflows/agent7-st052m-reservoir-axial-stretch-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reservoir-axial-stretch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Verify exact PR head checkout
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Focused contract tests
        run: python -m pytest -q -W error experiments/root_st052/test_agent7_st052m_reservoir_axial_stretch_audit.py
      - name: Execute preregistered axial-stretch audit
        run: |
          mkdir -p outputs/agent7-st052m-reservoir-axial-stretch-audit
          python experiments/root_st052/agent7_st052m_reservoir_axial_stretch_audit.py \
            --out outputs/agent7-st052m-reservoir-axial-stretch-audit/report.json
      - name: Verify frozen truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-reservoir-axial-stretch-audit/report.json').read_text())
          assert r['task_id']=='CR003-ST052M-RESERVOIR-AXIAL-STRETCH-AUDIT-111'
          assert r['prereg_issue']==784
          assert r['source_parent']=={'pr':775,'head':'93887a59729d22113badf2ae4dac2f7d868e2703'}
          g=r['analytic_root_geometry']
          assert abs(g['physical_r_root']-1.0585450412096833) < 1e-12
          assert 0 < g['core_cross_section_area_fraction'] < 1
          assert r['live_visible_probe_signs']['all_gates_pass'] is True
          assert r['axial_flux_refinement']['passes'] is True
          d=r['capacity_conclusion']
          assert d['reservoir_channel_has_visible_inward_radial_and_core_axial_stretch_capacity'] is True
          assert d['second_poloidal_basis_justified_by_this_audit'] is False
          assert d['retune_775_from_this_audit_allowed'] is False
          assert r['candidate_velocity_changed'] is False
          assert r['basis_dimension_changed'] is False
          assert r['candidate_coefficient_changed'] is False
          assert r['held_out_pde_residual_evaluated'] is False
          assert r['visual_correspondence_verified'] is False
          assert r['pde_validated'] is False
          print('root=',g)
          print('probes=',r['live_visible_probe_signs'])
          print('peaks=',r['radial_peak_geometry'])
          print('flux=',r['axial_flux_refinement'])
          PY
      - name: Publish compact numerical receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/agent7-reservoir-axial-stretch-receipt.md
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-reservoir-axial-stretch-audit/report.json').read_text())
          g=r['analytic_root_geometry']; p=r['radial_peak_geometry']; f=r['axial_flux_refinement']
          print('<!-- agent7-st052m-reservoir-axial-stretch-audit-receipt -->')
          print('**Agent 7 outer-reservoir axial-stretch/core-radius audit (issue #784):**')
          print()
          print(f"- physical axial sign-change radius r*: `{g['physical_r_root']:.12g}`; core area fraction: `{g['core_cross_section_area_fraction']:.6f}`")
          print(f"- positive core peak C_z/Z: `{p['positive_core_peak_Cz_over_Z']:.9g}` at r `{p['positive_core_peak_radius']:.6f}`")
          print(f"- negative annular peak C_z/Z: `{p['negative_annular_peak_Cz_over_Z']:.9g}` at r `{p['negative_annular_peak_radius']:.6f}`")
          print(f"- finest full-disk signed axial-flux balance error: `{f['max_abs_finest_balance']:.3e}`; medium->fine max change: `{f['max_medium_to_fine_change']:.3e}`")
          print('- live probes at |z|=1.55 retain radial inwardness on both z signs while showing core axial stretch and annular axial return.')
          print()
          print('Truth boundary: representation-capacity evidence only. No velocity/coefficient/time-law change, no fresh-path consumption, no PDE residual, no source numeric core-thickness target, and no visual-correspondence/PDE/exact-field claim.')
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/agent7-reservoir-axial-stretch-receipt.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-st052m-reservoir-axial-stretch-audit
          path: outputs/agent7-st052m-reservoir-axial-stretch-audit/
          if-no-files-found: error

# Scientific question and gates were frozen in issue #784 before implementation.
