name: kokuno-agent5-independent-routing-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_independent_routing_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_independent_signed_curl_cycle.py'
      - 'tests/test_constrained_kokuno_independent_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_independent_signed_curl_cycle.py'
      - '.github/workflows/kokuno-agent5-independent-routing-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused integration and independent-validation tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_independent_routing_checkpoint.py
          tests/test_constrained_kokuno_independent_signed_curl_cycle.py
          tests/test_constrained_kokuno_closure_frontier_checkpoint.py
      - name: Generate independent-routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_independent_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/independent_routing_checkpoint_v7
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/independent_routing_checkpoint_v7/independent_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-independent-routing-checkpoint-v7
          path: artifacts/kokuno_agent5/independent_routing_checkpoint_v7
