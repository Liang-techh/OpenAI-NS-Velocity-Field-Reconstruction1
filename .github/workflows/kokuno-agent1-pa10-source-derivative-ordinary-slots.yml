name: kokuno-agent1-pa10-source-derivative-ordinary-slots

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-derivative-ordinary-slots-056
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_derivative_ordinary_slots.py"
      - "tests/test_constrained_kokuno_pa10_source_derivative_ordinary_slots.py"
      - ".github/workflows/kokuno-agent1-pa10-source-derivative-ordinary-slots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-source-derivative-ordinary-slots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-derivative-ordinary-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_mixed_jnu_seams.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_u_ball.py \
            src/openai_ns_reconstruction/kokuno_pa10_post_j_remainder_bridge.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_pressure_ordinary_slots.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_algebraic_ordinary_slots.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_derivative_ordinary_slots.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_mixed_jnu_seams.py \
            tests/test_constrained_kokuno_pa10_source_u_ball.py \
            tests/test_constrained_kokuno_pa10_post_j_remainder_bridge.py \
            tests/test_constrained_kokuno_pa10_source_pressure_ordinary_slots.py \
            tests/test_constrained_kokuno_pa10_source_algebraic_ordinary_slots.py \
            tests/test_constrained_kokuno_pa10_source_derivative_ordinary_slots.py
      - name: Generate exact-head Agent-1 receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_derivative_ordinary_slots \
            --output artifacts/kokuno_agent1/pa10_source_derivative_ordinary_slots_v1/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent1/pa10_source_derivative_ordinary_slots_v1/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)

          progress = payload['ledger_progress']
          assert progress['R2_source_bound_ordinary_slots_count'] == 11
          assert progress['R2_total_ordinary_slots'] == 11
          assert progress['R2_ordinary_slots_still_required'] == 0
          assert progress['R1_ordinary_slots_still_required'] == 11
          assert progress['full_R2_agent1_self_certificate_materialized'] is True
          assert progress['full_R2_independent_admission'] is False
          assert progress['full_R1_still_open'] is True

          expected_derivative = {
              'W_star_times_Y_u_Y',
              'lambda_inv_2D_eta_Au_times_Y_u_Y',
              'H_star_times_u_eta',
              'lambda_inv_d_u_u_eta',
          }
          assert set(payload['R2_derivative_ordinary_after_J1']) == expected_derivative
          assert len(payload['R2_all_ordinary_after_J1']) == 11
          for item in payload['R2_derivative_ordinary_after_J1'].values():
              assert item['norm'] > 0.0
              assert item['lipschitz'] > 0.0

          audit = payload['independent_audit_boundary']
          assert audit['A4_source_axis_independent_PASS_exists'] is True
          assert audit['A4_pressure_slots_independent_PASS_exists'] is True
          assert audit['A4_source_u_ball_independent_PASS_exists'] is True
          assert audit['A1_algebraic_slots_still_requires_independent_A4_audit'] is True
          assert audit['this_derivative_subset_requires_independent_A4_audit'] is True
          assert audit['full_R2_independent_A4_admission'] is False

          truth = payload['truth_boundary']
          assert truth['source_compatible_R2_derivative_ordinary_post_J1_slots_machine_bound'] is True
          assert truth['source_compatible_all_R2_ordinary_post_J1_slots_machine_bound'] is True
          assert truth['source_compatible_full_post_J1_R2_radius_one_ball_bound_agent1_self_certificate'] is True
          assert truth['full_R2_independent_agent4_admission'] is False
          assert truth['standalone_Y_u_Y_coefficient_norm_invented'] is False
          assert truth['standalone_u_eta_coefficient_norm_invented'] is False
          assert truth['all_R1_ordinary_slots_source_bound'] is False
          assert truth['source_full_post_J2_R1_radius_one_ball_bound_machine_bound'] is False
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False

          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('fixed=', payload['fixed_multiplier_bounds'])
          print('u_ball=', payload['source_compatible_radius_one_u_ball'])
          print('derivative_post_J1=', payload['R2_derivative_ordinary_after_J1'])
          print('mixed_post_J1=', payload['R2_mixed_after_J1'])
          print('full_R2_post_J1=', payload['R2_full_after_J1_agent1_self_certificate'])
          print('progress=', progress)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-source-derivative-ordinary-slots-v1
          path: artifacts/kokuno_agent1/pa10_source_derivative_ordinary_slots_v1/report.json
          if-no-files-found: error
