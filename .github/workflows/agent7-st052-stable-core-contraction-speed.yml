name: agent7-st052-stable-core-contraction-speed

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_identity_bound_core_contraction_speed.py'
      - 'tests/test_st052_stable_identity_bound_core_contraction_speed.py'
      - '.github/workflows/agent7-st052-stable-core-contraction-speed.yml'
  push:
    branches: ['agent7/st052m-stable-core-contraction-speed-144']
    paths:
      - 'src/openai_ns_reconstruction/st052_stable_identity_bound_core_contraction_speed.py'
      - 'tests/test_st052_stable_identity_bound_core_contraction_speed.py'
      - '.github/workflows/agent7-st052-stable-core-contraction-speed.yml'

permissions:
  contents: read

jobs:
  exact-source-st052-stable-core-contraction-speed:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact Agent-7 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact event-head checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Checkout accepted constrained ST052 runtime lineage
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 6a293b3c870d70b8d8aece1b12d68685c9b8b010
          path: constrained-st052
          persist-credentials: false

      - name: Checkout exact ST052 source runtime
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: b3b8bfdbe1077f9ec967d158602951997d81e17d
          path: source-st052
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused numerical/test runtime
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'

      - name: Run focused core-trend regressions
        run: PYTHONPATH=src python -m pytest -q -W error tests/test_st052_stable_identity_bound_core_contraction_speed.py

      - name: Materialize exact parent while retaining expected momentum rejection
        shell: bash
        run: |
          mkdir -p outputs
          set +e
          (
            cd source-st052
            python experiments/root_st052/replay_st052.py \
              --out ../outputs/ST052-M-parent \
              --seed 9175291 \
              --validate
          )
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('outputs/ST052-M-parent/validation.json').read_text())
          assert report['pde_validated'] is False
          assert report['all_numeric_gates_pass'] is False
          assert report['gates']['momentum_max'] is False
          assert report['gates']['momentum_L2'] is False
          print('Exact ST052 parent retained expected momentum rejection.')
          PY

      - name: Rebuild authenticated frozen whole-child bundle
        run: |
          PYTHONPATH=constrained-st052/src python constrained-st052/scripts/verify_st052_linear_temporal_capsule.py \
            --source-root source-st052 \
            --parent-dir outputs/ST052-M-parent \
            --out outputs \
            --report outputs/ST052-M-linear-temporal-child-v1/capsule_receipt.json

      - name: Execute stable-identity-bound three-time core trend diagnostic
        run: |
          mkdir -p outputs/ST052-M-stable-core-contraction-speed
          PYTHONPATH=src python -m openai_ns_reconstruction.st052_stable_identity_bound_core_contraction_speed \
            --constrained-root constrained-st052 \
            --source-root source-st052 \
            --bundle-dir outputs/ST052-M-linear-temporal-child-v1 \
            --report outputs/ST052-M-stable-core-contraction-speed/receipt.json \
            | tee outputs/ST052-M-stable-core-contraction-speed/summary.txt

      - name: Assert frozen protocol, stable identity and truth boundary
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          p = Path('outputs/ST052-M-stable-core-contraction-speed/receipt.json')
          r = json.loads(p.read_text())
          assert r['task_id'] == 'CR003-ST052M-STABLE-CORE-CONTRACTION-SPEED-144'
          assert r['issue'] == 1220
          i = r['stable_candidate_identity']
          assert i['candidate_id'] == 'ST052-M-linear-temporal-child-v1'
          assert i['candidate_semantic_identity_sha256'] == '2b2e743e72e31f69ad4232340f52d48b5759ac8aad1dfb735708112276c0b9c4'
          assert i['velocity_semantic_identity_sha256'] == '7738013a4fe4cacbfebfb4e8822bb4ee815b1d3bab744b90f9473ad9424f4f41'
          proto = r['protocol']
          assert proto['times'] == [0.25, 0.5, 0.75]
          assert proto['z'] == 0.0
          assert len(proto['core_radii']) == 15
          assert proto['core_radii'][0] == 0.2
          assert proto['core_radii'][-1] == 1.6
          assert proto['azimuth_count'] == 16
          assert proto['source_numeric_targets_used'] is False
          assert proto['renderer_or_camera_used'] is False
          assert proto['pixel_loss_used'] is False
          assert r['public_observable']['numerical_target'] is None
          assert r['materialization_join']['included_in_measurement_binding'] is False

          m = r['measurement']
          d = m['derived']
          assert len(m['core_speed_proxy']) == 3
          assert len(d['speed_weighted_rms_radius_by_time']) == 3
          assert len(d['peak_ring_mean_speed_by_time']) == 3
          assert math.isfinite(d['endpoint_width_fraction'])
          assert math.isfinite(d['endpoint_peak_speed_fraction'])
          assert isinstance(d['endpoint_shrink_and_speedup_proxy'], bool)
          assert isinstance(d['three_time_monotone_proxy'], bool)
          route = m['routing']
          assert route['candidate_mutation_authorized'] is False
          assert route['sixth_basis_authorized'] is False
          assert route['coefficient_selection_authorized'] is False

          truth = r['truth_boundary']
          assert truth['candidate_changed'] is False
          assert truth['basis_dimension_changed'] is False
          assert truth['coefficient_selected'] is False
          assert truth['visualization_fingerprint_direct_improvement'] == 0.0
          assert truth['visualization_ready'] is False
          assert truth['source_correspondence_verified'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          print('core_widths=', d['speed_weighted_rms_radius_by_time'])
          print('peak_speeds=', d['peak_ring_mean_speed_by_time'])
          print('endpoint_width_fraction=', d['endpoint_width_fraction'])
          print('endpoint_peak_speed_fraction=', d['endpoint_peak_speed_fraction'])
          print('endpoint_proxy=', d['endpoint_shrink_and_speedup_proxy'])
          print('three_time_monotone_proxy=', d['three_time_monotone_proxy'])
          print('routing=', route['decision'])
          print('measurement_sha256=', r['measurement_sha256'])
          PY

      - name: Upload stable core-trend diagnostic receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST052-M-stable-core-contraction-speed
          path: outputs/ST052-M-stable-core-contraction-speed/
          if-no-files-found: error
