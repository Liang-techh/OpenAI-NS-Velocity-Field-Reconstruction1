name: kokuno-agent4-pa10-local-pressure-coordinate-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-local-coordinate-independent-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-local-pressure-coordinate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-local-pressure-coordinate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_local_pressure_coordinate.py \
            src/openai_ns_reconstruction/kokuno_agent4_pa10_local_pressure_coordinate_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_local_pressure_coordinate.py \
            tests/test_constrained_kokuno_agent4_pa10_local_pressure_coordinate_audit.py
      - name: Generate exact-head independent receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_agent4_pa10_local_pressure_coordinate_audit \
            --output artifacts/kokuno_agent4/pa10_local_pressure_coordinate_audit/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_local_pressure_coordinate_audit/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          assert payload['local_pressure_coordinate_independent_preflight_passed'] is True
          assert payload['failed_guards'] == []
          assert payload['truth_boundary']['prior_eta_only_preflight_passed'] is False
          assert payload['truth_boundary']['global_pressure_matched'] is False
          assert payload['truth_boundary']['global_leading_profile_reconstructed'] is False
          assert payload['truth_boundary']['heldout_ns_momentum_residual_assessed'] is False
          assert payload['truth_boundary']['formal_full_domain_pde_gate_assessed'] is False
          assert payload['truth_boundary']['pde_validated'] is False
          assert payload['frozen_protocol']['final_project_gates_unchanged']['normalized_momentum_max'] == 1.0e-3
          assert payload['frozen_protocol']['final_project_gates_unchanged']['normalized_momentum_L2'] == 1.0e-3
          assert payload['frozen_protocol']['final_project_gates_unchanged']['divergence_max'] == 1.0e-5
          assert payload['frozen_protocol']['final_project_gates_unchanged']['divergence_L2'] == 1.0e-5
          print('receipt_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('candidate_sha256=', payload['candidate_sha256'])
          print('p_s_fd8_levels=', payload['p_s_fd8_levels'])
          print('local_fundamental_theorem_levels=', payload['local_fundamental_theorem_levels'])
          print('physical_chain_rule=', payload['physical_chain_rule_from_value_fd8'])
          print('two_term_eta_mapping=', payload['two_term_eta_mapping'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-local-pressure-coordinate-audit-v1
          path: artifacts/kokuno_agent4/pa10_local_pressure_coordinate_audit/report.json
