name: kokuno-agent5-source-compatible-partition-routing

on:
  push:
    branches:
      - codex/kokuno-a5-source-compatible-partition-routing-021
  pull_request:
    branches:
      - codex/kokuno-a4-source-compatible-partition-independent-021
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-source-compatible-partition-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-2/4/5 tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_compatible_partition.py
          tests/test_constrained_kokuno_source_compatible_partition_independent.py
          tests/test_constrained_kokuno_source_compatible_partition_routing_checkpoint.py
      - name: Generate deterministic Agent-5 bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_source_compatible_partition_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/source_compatible_partition_routing_checkpoint_v21
      - name: Show checkpoint
        run: |
          cat artifacts/kokuno_agent5/source_compatible_partition_routing_checkpoint_v21/source_compatible_partition_routing_checkpoint.json
          cat artifacts/kokuno_agent5/source_compatible_partition_routing_checkpoint_v21/manifest.json
      - name: Upload routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-source-compatible-partition-routing-checkpoint-v21
          path: artifacts/kokuno_agent5/source_compatible_partition_routing_checkpoint_v21
