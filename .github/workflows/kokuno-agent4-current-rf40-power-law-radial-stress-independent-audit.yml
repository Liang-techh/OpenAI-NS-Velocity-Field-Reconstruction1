name: kokuno-agent4-current-rf40-power-law-radial-stress-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-rf40-power-law-radial-stress-audit-106
  pull_request:
    branches:
      - codex/kokuno-a3-rf40-power-law-radial-stress-113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact A4 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a4
          fetch-depth: 0

      - name: Verify exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a4
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9a5cdcdf78b7862d5ebe171efb9ca56d53664612 HEAD
          test "$(git rev-list --count 9a5cdcdf78b7862d5ebe171efb9ca56d53664612..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only 9a5cdcdf78b7862d5ebe171efb9ca56d53664612..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent4-current-rf40-power-law-radial-stress-independent-audit.yml \
            src/openai_ns_reconstruction/kokuno_a4_current_rf40_power_law_radial_stress_independent_audit.py \
            tests/test_constrained_kokuno_a4_current_rf40_power_law_radial_stress_independent_audit.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact A4 head
        shell: bash
        run: python -m pip install -e './a4[dev]'

      - name: Authenticate exact A3 parent sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_power_law_nonlinear_radial_stress.py)" = \
            "44dc6d61bc965cef08b119aa5df3026175abd5de"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_power_law_nonlinear_mean_attribution.py)" = \
            "4ec98a6adbb7afd16d6595cc24072fe18e62fa87"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_strict_inner_transport_first_cell_polynomial_radial_stress.py)" = \
            "19f8cf9fa909fef7be2cf53c84df269e696b647c"

      - name: Run focused A4 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a4/src/openai_ns_reconstruction/kokuno_a4_current_rf40_power_law_radial_stress_independent_audit.py \
            a4/tests/test_constrained_kokuno_a4_current_rf40_power_law_radial_stress_independent_audit.py
          python -m pytest -q -W error \
            a4/tests/test_constrained_kokuno_current_rf40_power_law_nonlinear_radial_stress.py \
            a4/tests/test_constrained_kokuno_a4_current_rf40_power_law_radial_stress_independent_audit.py

      - name: Check out exact A2 RF40 power-law composite
        uses: actions/checkout@v4
        with:
          ref: e36d9da4b7f037e998f5b1658f8c0ea291a76b80
          path: a2
          fetch-depth: 1

      - name: Check out exact A1 RF40 power-law leading
        uses: actions/checkout@v4
        with:
          ref: 2c76ebdc41d6c566f43a1305034ba2ff9dce410b
          path: a1
          fetch-depth: 1

      - name: Authenticate sibling heads and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "e36d9da4b7f037e998f5b1658f8c0ea291a76b80"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py)" = \
            "4f1dc0566c041b9de20f18b4ae9c49d9fd93c58d"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = \
            "12df3bf6c949baeebf609b366f2973e7f515a157"
          test "$(git -C a1 rev-parse HEAD)" = "2c76ebdc41d6c566f43a1305034ba2ff9dce410b"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_power_law.py)" = \
            "36a0183352a2005bd0b5f477594e05a2e4fe3868"

      - name: Materialize and independently audit real A3 X4 stress receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          from pathlib import Path
          import copy
          import json
          import numpy as np
          import openai_ns_reconstruction

          pkg = openai_ns_reconstruction
          a1_pkg = str(Path('a1/src/openai_ns_reconstruction').resolve())
          a2_pkg = str(Path('a2/src/openai_ns_reconstruction').resolve())
          a4_pkg = str(Path('a4/src/openai_ns_reconstruction').resolve())

          pkg.__path__.insert(0, a1_pkg)
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_rf40_power_law import (
              KokunoPA16CurrentCartesianRF40PowerLaw,
          )
          leading = KokunoPA16CurrentCartesianRF40PowerLaw()

          pkg.__path__.insert(0, a2_pkg)
          from openai_ns_reconstruction.kokuno_current_rf40_power_law_leading_oscillatory_identity import (
              CurrentRF40PowerLawLeadingOscillatoryField,
          )
          from openai_ns_reconstruction.kokuno_oscillatory_batch_differentials import (
              evaluate_oscillatory_batch_differentials,
          )
          field = CurrentRF40PowerLawLeadingOscillatoryField(leading)

          pkg.__path__.insert(0, a4_pkg)
          from openai_ns_reconstruction.kokuno_current_rf40_power_law_nonlinear_mean_attribution import (
              ExactCurrentRF40PowerLawNonlinearBackend,
          )
          from openai_ns_reconstruction.kokuno_current_rf40_power_law_nonlinear_radial_stress import (
              materialize_current_rf40_power_law_nonlinear_radial_stress,
          )
          from openai_ns_reconstruction.kokuno_strict_inner_transport_radial_stress import (
              StrictInnerTransportRadialGeometry,
          )
          from openai_ns_reconstruction.kokuno_a4_current_rf40_power_law_radial_stress_independent_audit import (
              FROZEN_BUMP_CENTER,
              FROZEN_BUMP_HALFWIDTH,
              FROZEN_TIME,
              FROZEN_Z,
              audit_serialized_receipts,
              enforce_scientific_gates,
              frozen_radial_grids,
          )

          backend = ExactCurrentRF40PowerLawNonlinearBackend.bind(
              field, evaluate_oscillatory_batch_differentials
          )

          public_receipts = []
          for index, radii in enumerate(frozen_radial_grids()):
              geometry = StrictInnerTransportRadialGeometry(
                  time=FROZEN_TIME,
                  axial_z=FROZEN_Z,
                  radii=tuple(float(v) for v in radii),
                  bump_center=FROZEN_BUMP_CENTER,
                  bump_halfwidth=FROZEN_BUMP_HALFWIDTH,
              )
              witness = materialize_current_rf40_power_law_nonlinear_radial_stress(
                  backend, geometry
              )
              public = json.loads(json.dumps(witness.to_receipt(), sort_keys=True))
              public_receipts.append(public)
              Path(
                  f'receipts/kokuno_a3_rf40_power_law_radial_stress_level_{index}.json'
              ).write_text(
                  json.dumps(public, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )

          report = audit_serialized_receipts(public_receipts)
          Path(
              'receipts/kokuno_a4_rf40_power_law_radial_stress_independent_audit.json'
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          mutated = copy.deepcopy(public_receipts)
          radii = np.asarray(mutated[2]['geometry']['radii'], dtype=float)
          stress = np.asarray(mutated[2]['theta_e2']['aggregate']['stress'], dtype=float)
          scale = max(float(np.max(np.abs(stress))), 1e-12)
          tangent = 0.35 * scale * np.sin(
              np.pi * (radii - radii[0]) / (radii[-1] - radii[0])
          )
          mutated[2]['theta_e2']['aggregate']['stress'] = (stress + tangent).tolist()
          mutation_report = audit_serialized_receipts(mutated)
          assert mutation_report['audit_pass'] is False
          try:
              enforce_scientific_gates(mutation_report)
          except RuntimeError:
              pass
          else:
              raise AssertionError('endpoint-preserving stress mutation escaped A4 gate')

          mutated = copy.deepcopy(public_receipts)
          mutated[2]['geometry']['bump_center'] = FROZEN_BUMP_CENTER + 0.005
          try:
              audit_serialized_receipts(mutated)
          except ValueError:
              pass
          else:
              raise AssertionError('bump-center drift escaped A4 fail-closed parser')

          mutated = copy.deepcopy(public_receipts)
          mean = mutated[2]['current_rf40_power_law_mean_witness']
          aggregate = np.asarray(mean['mean_aggregate_nonlinear_cylindrical'], dtype=float)
          aggregate[len(aggregate) // 2, 1] += 1e-4
          mean['mean_aggregate_nonlinear_cylindrical'] = aggregate.tolist()
          try:
              audit_serialized_receipts(mutated)
          except ValueError:
              pass
          else:
              raise AssertionError('mean-attribution drift escaped A4 fail-closed parser')

          mutated = copy.deepcopy(public_receipts)
          mutated[2]['truth_boundary']['pde_validated'] = True
          try:
              audit_serialized_receipts(mutated)
          except ValueError:
              pass
          else:
              raise AssertionError('truth-state mutation escaped A4 fail-closed parser')
          PY

      - name: Upload real receipts before scientific enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-current-rf40-power-law-radial-stress-independent-audit
          path: receipts/*.json
          if-no-files-found: error

      - name: Enforce preregistered scoped scientific gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from openai_ns_reconstruction.kokuno_a4_current_rf40_power_law_radial_stress_independent_audit import (
              enforce_scientific_gates,
          )

          report = json.loads(
              Path(
                  'receipts/kokuno_a4_rf40_power_law_radial_stress_independent_audit.json'
              ).read_text(encoding='utf-8')
          )
          enforce_scientific_gates(report)
          boundary = report['truth_boundary']
          assert boundary['complete_ns_defect'] is False
          assert boundary['authorized_correction_target'] is False
          assert boundary['cartesian_correction_velocity_materialized'] is False
          assert boundary['after_correction_ns_residual_assessed'] is False
          assert boundary['same_protocol_comparable_to_st006'] is False
          assert boundary['pde_validated'] is False
          assert boundary['final_normalized_momentum_gate'] == 1e-3
          assert boundary['final_normalized_divergence_gate'] == 1e-5
          PY
