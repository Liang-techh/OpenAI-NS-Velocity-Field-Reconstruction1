name: kokuno-agent2-oscillatory-momentum-screen

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_momentum.py'
      - 'tests/test_constrained_kokuno_complete_curl.py'
      - 'tests/test_constrained_kokuno_oscillatory_momentum.py'
      - '.github/workflows/kokuno-agent2-oscillatory-momentum-screen.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run focused Agent-2 tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_complete_curl.py tests/test_constrained_kokuno_oscillatory_momentum.py
      - name: Generate frozen-amplitude real-bridge report
        run: python -m openai_ns_reconstruction.kokuno_oscillatory_momentum --points 96
      - name: Show report
        run: cat artifacts/kokuno_agent2/oscillatory_momentum_screen.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-oscillatory-momentum-screen
          path: artifacts/kokuno_agent2/oscillatory_momentum_screen.json
