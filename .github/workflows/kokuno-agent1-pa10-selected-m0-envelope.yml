name: kokuno-agent1-pa10-selected-m0-envelope

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-selected-m0-envelope
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-selected-m0-envelope-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  pa10-selected-m0-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile envelope
        run: python -m compileall -q src/openai_ns_reconstruction/kokuno_pa10_selected_m0_envelope.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_choice_order_guard.py \
            tests/test_constrained_kokuno_pa10_l0_binding.py \
            tests/test_constrained_kokuno_pa10_selected_m0_envelope.py
      - name: Generate selected-reference M0 receipt
        run: |
          python -m openai_ns_reconstruction.kokuno_pa10_selected_m0_envelope \
            --output artifacts/kokuno_agent1/pa10_selected_m0_envelope/report.json
      - name: Validate candidate-only truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/kokuno_agent1/pa10_selected_m0_envelope/report.json"
              ).read_text()
          )
          truth = report["truth_boundary"]
          numerical = report["numerical_envelope"]
          fine = numerical["fine"]

          assert fine["sample_max_abs_p1_reference"] > 3.0
          assert fine["sample_min_p1_reference"] > 0.0
          assert numerical["M0_candidate_upper_envelope"] > fine[
              "sample_max_abs_p1_reference"
          ]
          assert numerical["nested_grid_relative_drift"] <= numerical[
              "max_allowed_refinement_drift_fraction"
          ]
          assert numerical["numerical_envelope_guard_passed"] is True
          assert numerical["continuum_supremum_proved"] is False
          assert truth["selected_reference_M0_numerical_envelope_materialized"] is True
          assert truth["selected_reference_is_source_fixed_point"] is False
          assert truth["selected_M0_envelope_is_continuum_interval_proof"] is False
          assert truth["source_M0_machine_bound"] is False
          assert truth["source_B0_dependencies_machine_bound"] is False
          assert truth["source_B0_analytic_bound_proved"] is False
          assert truth["source_T_sh_lower_bound_verified"] is False
          assert truth["selected_pa16_handoff_allowed"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False

          print("envelope_sha256=", report["envelope_sha256"])
          print("sample_M0_fine=", fine["sample_max_abs_p1_reference"])
          print("M0_candidate_upper_envelope=", numerical["M0_candidate_upper_envelope"])
          print("nested_grid_relative_drift=", numerical["nested_grid_relative_drift"])
          print("sample_max_eta=", fine["sample_max_eta"])
          print("sample_max_X=", fine["sample_max_X"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-selected-m0-envelope-v1
          path: artifacts/kokuno_agent1/pa10_selected_m0_envelope/report.json
