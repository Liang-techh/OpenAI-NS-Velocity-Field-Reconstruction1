name: kokuno-agent4-reference-continuation-fd2

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_reference_continuation.py'
      - 'src/openai_ns_reconstruction/kokuno_independent_reference_continuation.py'
      - 'tests/test_constrained_kokuno_reference_continuation.py'
      - 'tests/test_constrained_kokuno_independent_reference_continuation.py'
      - '.github/workflows/kokuno-agent4-reference-continuation-fd2.yml'

permissions:
  contents: read

jobs:
  independent-reference-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused independent tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_reference_continuation.py
          tests/test_constrained_kokuno_independent_reference_continuation.py
      - name: Generate independent seam-stratified report
        run: >-
          python -m openai_ns_reconstruction.kokuno_independent_reference_continuation
          --count 4
          --output artifacts/kokuno_agent4/reference_continuation_fd2/report.json
      - name: Show report
        run: cat artifacts/kokuno_agent4/reference_continuation_fd2/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-reference-continuation-fd2
          path: artifacts/kokuno_agent4/reference_continuation_fd2
