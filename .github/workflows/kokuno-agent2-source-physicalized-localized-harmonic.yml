name: kokuno-agent2-source-physicalized-localized-harmonic
on:
  push:
    branches: [codex/k2-osc-102-physical-scaling]
  pull_request:
    branches: [codex/k2-osc-101-logx-composite]
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Verify exact A2 stack and scope
        shell: bash
        run: |
          set -euo pipefail
          base=27741d9c0a27262f7fabf61eebaa2fbd507e9f03
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-list --count "$base"..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only "$base"..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx src/openai_ns_reconstruction/kokuno_source_physicalized_localized_harmonic.py
          printf '%s\n' "${files[@]}" | grep -Fx tests/test_constrained_kokuno_source_physicalized_localized_harmonic.py
          printf '%s\n' "${files[@]}" | grep -Fx .github/workflows/kokuno-agent2-source-physicalized-localized-harmonic.yml
          test "$(git show 27741d9c0a27262f7fabf61eebaa2fbd507e9f03:src/openai_ns_reconstruction/kokuno_current_main_pulse_logx_leading_oscillatory_identity.py | git hash-object --stdin)" = 5504c2cde2eb69bfcdb4e4a87cc48f541bb9f8d3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install branch
        run: python -m pip install -e '.[dev]'

      - name: Focused A2 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_source_physicalized_localized_harmonic.py \
            tests/test_constrained_kokuno_source_physicalized_localized_harmonic.py
          pytest -q tests/test_constrained_kokuno_source_physicalized_localized_harmonic.py

      - uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Authenticate corrected 2026-09-09 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = 205a99807302e21a51c5eaf223390c0dfc42bcd0

      - name: Materialize physical-scaling receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_source_physicalized_localized_harmonic import (
              source_chart_to_physical_rzt,
              source_physical_scaling,
              source_physicalized_localized_harmonic_contract,
          )

          s = source_physical_scaling(ell=20, h=0.006)
          r, z, t = source_chart_to_physical_rzt(
              [0.4, 0.9, 1.3], [-0.5, 0.0, 0.7], [0.2, 0.8, 1.1], ell=20, h=0.006
          )
          receipt = {
              'contract': source_physicalized_localized_harmonic_contract(),
              'scaling': {
                  'ell': s.ell,
                  'h': s.h,
                  'Q': s.Q,
                  'A': s.A,
                  'D': s.D,
                  'epsilon': s.epsilon,
                  'vector_potential_scale': s.vector_potential_scale,
                  'velocity_scale': s.velocity_scale,
                  'curl_scaling_closure': s.vector_potential_scale * s.curl_derivative_scale / s.velocity_scale,
              },
              'mapped_probe': {'r': r.tolist(), 'z': z.tolist(), 't': t.tolist()},
          }
          assert abs(receipt['scaling']['curl_scaling_closure'] - 1.0) < 5e-15
          assert receipt['contract']['source_physical_Q_scaling_applied'] is True
          assert receipt['contract']['self_contained_velocity_xyzt_provider'] is False
          assert receipt['contract']['complete_ns_residual_assessed'] is False
          assert receipt['contract']['paper_exact'] is False
          assert receipt['contract']['pde_validated'] is False
          Path('receipts/physical_scaling_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload raw receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-source-physicalized-localized-harmonic
          path: receipts
          if-no-files-found: error
