name: kokuno-agent2-oscillatory-transport-handoff

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_transport_handoff.py'
      - 'tests/test_constrained_kokuno_oscillatory_transport_handoff.py'
      - '.github/workflows/kokuno-agent2-oscillatory-transport-handoff.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and pinned ancestry
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor a467bc175a801ed69c197fc9e38ca68ac8c0b86b HEAD
          test "$(git rev-parse 616e61abd2420a7c7aff3590a08393360039cd1a:src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport_delta.py)" = "$(git rev-parse HEAD:src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport_delta.py)"
          test "$(git rev-parse a467bc175a801ed69c197fc9e38ca68ac8c0b86b:src/openai_ns_reconstruction/kokuno_oscillatory_source_contract.py)" = "$(git rev-parse HEAD:src/openai_ns_reconstruction/kokuno_oscillatory_source_contract.py)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_oscillatory_transport_handoff.py

      - name: Fetch exact Agent-1 strict-inner backend
        run: |
          git fetch origin 300919075c07396e4e466f553be78eaae0707df2
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" 300919075c07396e4e466f553be78eaae0707df2
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD)" = "300919075c07396e4e466f553be78eaae0707df2"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = "5076ffa69748c2d7e68289a155b67288eab6dab4"

      - name: Real strict-inner Agent-2 to Agent-3 handoff receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_oscillatory_transport_handoff import (
              PARENT_AGENT2_HEAD,
              TRANSPORT_DELTA_HEAD,
              KokunoOscillatoryTransportHandoff,
              public_contract,
          )
          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_transport_delta import (
              evaluate_inner_leading_oscillatory_transport_delta,
          )

          a1 = Path(os.environ['A1_WORKTREE'])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous
          field = KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {'field_sha256': field.field_sha256}
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t')}
              elif op in ('velocity','velocity_dt','self_advection','velocity_laplacian'):
                  method = getattr(field, op)
                  out = method(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''

          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          meta = ask({'op':'meta'})

          class ExactAgent1Backend:
              field_sha256 = meta['field_sha256']
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def _call(self, op, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  result = ask({
                      'op':op, 'x':x.tolist(), 'y':y.tolist(),
                      'z':z.tolist(), 't':t.tolist(),
                  })
                  return np.asarray(result['value'], dtype=float)
              def velocity(self, x, y, z, t):
                  return self._call('velocity', x, y, z, t)
              def velocity_dt(self, x, y, z, t):
                  return self._call('velocity_dt', x, y, z, t)
              def self_advection(self, x, y, z, t):
                  return self._call('self_advection', x, y, z, t)
              def velocity_laplacian(self, x, y, z, t):
                  return self._call('velocity_laplacian', x, y, z, t)

          # Fixed source-interior probes chosen before this workflow sees numerical output.
          X = np.asarray([0.176,0.194,0.212,0.230,0.248,0.266,0.284,0.202], dtype=float)
          eta = np.asarray([-0.28,-0.20,-0.12,-0.04,0.04,0.12,0.20,0.28], dtype=float)
          tt = np.asarray([0.474,0.482,0.490,0.498,0.506,0.514,0.522,0.530], dtype=float)
          theta = np.asarray([0.31,0.79,1.27,1.75,2.23,2.71,-2.81,-1.91], dtype=float)
          mapped = ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),'t':tt.tolist(),'theta':theta.tolist()})
          x = np.asarray(mapped['x'], dtype=float)
          y = np.asarray(mapped['y'], dtype=float)
          z = np.asarray(mapped['z'], dtype=float)
          t = np.asarray(mapped['t'], dtype=float)

          backend = ExactAgent1Backend()
          handoff = KokunoOscillatoryTransportHandoff(backend)
          result = handoff.evaluate(x, y, z, t)
          parent = evaluate_inner_leading_oscillatory_transport_delta(backend, x, y, z, t)

          replay_max = float(np.max(np.abs(
              result.oscillatory_transport_increment - parent.oscillatory_transport_increment
          )))
          nonlinear_replay_max = float(np.max(np.abs(
              result.oscillatory_nonlinear_increment - parent.oscillatory_nonlinear_increment
          )))

          def vrms(value):
              value = np.asarray(value, dtype=float)
              return float(np.sqrt(np.mean(np.sum(value * value, axis=-1))))

          Path('artifacts').mkdir(exist_ok=True)
          manifest_path = Path('artifacts/kokuno_agent2_oscillatory_transport_handoff_manifest.json')
          manifest = handoff.save_manifest(manifest_path)
          rebound = KokunoOscillatoryTransportHandoff.load_manifest(backend, manifest_path)
          rebound_delta = rebound.transport_delta(x, y, z, t)
          rebound_max = float(np.max(np.abs(
              rebound_delta - result.oscillatory_transport_increment
          )))

          contract = public_contract()
          failed=[]
          if replay_max > 1.0e-13: failed.append('parent_delta_replay')
          if nonlinear_replay_max > 1.0e-13: failed.append('parent_nonlinear_replay')
          if rebound_max > 1.0e-13: failed.append('manifest_rebind_replay')
          if result.decomposition_closure_abs_max > 5.0e-13: failed.append('decomposition_closure')
          if manifest['payload']['backend_field_sha256'] != meta['field_sha256']: failed.append('backend_field_identity')
          if manifest['payload']['source_contract_sha256'] != contract['source_contract_sha256']: failed.append('source_contract_identity')
          if contract['forbidden_evaluate_inputs_present']: failed.append('forbidden_public_inputs')
          quantity = manifest['payload']['quantity_contract']
          if quantity['complete_ns_residual']: failed.append('complete_residual_promotion')
          if quantity['mean_projection_performed']: failed.append('agent3_mean_lane_reimplemented')
          if quantity['radial_inverse_performed']: failed.append('agent3_radial_lane_reimplemented')
          if quantity['correction_velocity_constructed']: failed.append('agent3_correction_reimplemented')
          truth = manifest['payload']['scientific_boundary']
          forbidden_true = (
              'global_leading_join_included','matched_pressure_included',
              'restricted_forcing_included','same_protocol_st006_comparison_valid',
              'residual_reduction_claimed','paper_exact','pde_validated',
          )
          if any(truth[key] for key in forbidden_true): failed.append('truth_boundary_promotion')

          receipt={
              'schema':'kokuno-a2-oscillatory-transport-handoff-receipt-v1',
              'parent_agent2_head':PARENT_AGENT2_HEAD,
              'transport_delta_head':TRANSPORT_DELTA_HEAD,
              'agent1_reference_head':'300919075c07396e4e466f553be78eaae0707df2',
              'agent1_field_sha256':meta['field_sha256'],
              'handoff_sha256':handoff.handoff_sha256,
              'source_contract_sha256':handoff.source_contract_sha256,
              'manifest_handoff_sha256':manifest['handoff_sha256'],
              'sample_count':int(x.size),
              'source_X_range':[float(np.min(X)),float(np.max(X))],
              'oscillatory_transport_delta_rms':vrms(result.oscillatory_transport_increment),
              'oscillatory_nonlinear_increment_rms':vrms(result.oscillatory_nonlinear_increment),
              'oscillatory_time_increment_rms':vrms(result.oscillatory_time_increment),
              'oscillatory_viscous_increment_rms':vrms(result.oscillatory_viscous_increment),
              'decomposition_closure_abs_max':result.decomposition_closure_abs_max,
              'parent_delta_replay_abs_max':replay_max,
              'parent_nonlinear_replay_abs_max':nonlinear_replay_max,
              'manifest_rebind_abs_max':rebound_max,
              'classification':'raw Cartesian strict-inner pressure/forcing-free oscillatory transport increment',
              'agent3_mean_projection_performed':False,
              'complete_ns_residual':False,
              'same_protocol_st006_comparison_valid':False,
              'failed_guards':failed,
          }
          Path('artifacts/kokuno_agent2_oscillatory_transport_handoff_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None: proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if failed:
              raise SystemExit('failed guards: ' + ', '.join(failed))
          PY

      - name: Upload handoff manifest and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-oscillatory-transport-handoff-v1
          path: |
            artifacts/kokuno_agent2_oscillatory_transport_handoff_manifest.json
            artifacts/kokuno_agent2_oscillatory_transport_handoff_receipt.json
          if-no-files-found: warn
