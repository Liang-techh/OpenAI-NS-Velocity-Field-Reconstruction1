name: kokuno-agent5-signed-physical-covariance-routing

on:
  push:
    branches:
      - codex/kokuno-a5-signed-physical-covariance-routing-031
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_signed_complete_curl_family.py'
      - 'src/openai_ns_reconstruction/kokuno_agent4_signed_complete_curl_covariance_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_physical_covariance_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_source_signed_complete_curl_family.py'
      - 'tests/test_constrained_kokuno_agent4_signed_complete_curl_covariance_audit.py'
      - 'tests/test_constrained_kokuno_signed_physical_covariance_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-signed-physical-covariance-routing.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_signed_complete_curl_family.py'
      - 'src/openai_ns_reconstruction/kokuno_agent4_signed_complete_curl_covariance_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_physical_covariance_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_source_signed_complete_curl_family.py'
      - 'tests/test_constrained_kokuno_agent4_signed_complete_curl_covariance_audit.py'
      - 'tests/test_constrained_kokuno_signed_physical_covariance_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-signed-physical-covariance-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-signed-physical-covariance-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused physical-family, independent-audit and Agent-5 tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_signed_complete_curl_family.py
          tests/test_constrained_kokuno_agent4_signed_complete_curl_covariance_audit.py
          tests/test_constrained_kokuno_signed_physical_covariance_routing_checkpoint.py
      - name: Generate deterministic Agent-5 checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_signed_physical_covariance_routing_checkpoint
          --output artifacts/kokuno_agent5/signed_physical_covariance_routing_checkpoint_v31/checkpoint.json
      - name: Show checkpoint
        run: cat artifacts/kokuno_agent5/signed_physical_covariance_routing_checkpoint_v31/checkpoint.json
      - name: Upload routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-signed-physical-covariance-routing-checkpoint-v31
          path: artifacts/kokuno_agent5/signed_physical_covariance_routing_checkpoint_v31
          if-no-files-found: error
