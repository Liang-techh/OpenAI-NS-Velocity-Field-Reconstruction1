name: kokuno-agent3-gain-gated-finite-correction-stage

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_gain_gated_finite_correction_stage.py'
      - 'tests/test_constrained_kokuno_gain_gated_finite_correction_stage.py'
      - '.github/workflows/kokuno-agent3-gain-gated-finite-correction-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact Agent-3 parent and source blobs
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 5029b6f88bfbbc4a498c3a9f9522f0ad2d79ecc1 HEAD
          test "$(git rev-parse 5029b6f88bfbbc4a498c3a9f9522f0ad2d79ecc1:src/openai_ns_reconstruction/kokuno_five_moment_correction_gain.py)" = "6625db71ec8478db5d6ec09cabb7033a03e658a4"
          test "$(git rev-parse 5029b6f88bfbbc4a498c3a9f9522f0ad2d79ecc1:src/openai_ns_reconstruction/kokuno_finite_correction_fixed_physical_contract.py)" = "0cd41dfcc998064c37075b6086a246e93831ebfd"

      - name: Verify pinned corrected-reader source
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/KokunoYumeto/yang-mills-interacting-workbench.git kokuno-reader
          git -C kokuno-reader checkout --quiet 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C kokuno-reader rev-parse HEAD:navier-stokes/navier_stokes_workbench.tex)" = "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          python - <<'PY'
          from pathlib import Path
          text = Path('kokuno-reader/navier-stokes/navier_stokes_workbench.tex').read_text(encoding='utf-8')
          required = (
              'Explicit five-dimensional moment correction',
              'G_q=0',
              'V_q=a(\\eta)x^{-1-2\\lambda}',
              'The complete radial obstruction and the five-equation correction',
          )
          for phrase in required:
              if phrase not in text:
                  raise SystemExit(f'missing corrected-reader phrase: {phrase}')
          print('corrected-reader five-moment structure pinned')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Agent-3 head
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_gain_gated_finite_correction_stage.py \
            tests/test_constrained_kokuno_gain_gated_finite_correction_stage.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_five_moment_correction_gain.py \
            tests/test_constrained_kokuno_finite_correction_fixed_physical_contract.py \
            tests/test_constrained_kokuno_gain_gated_finite_correction_stage.py

      - name: Generate deterministic mechanics receipt
        run: |
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_gain_gated_finite_correction_stage \
            --out artifacts/kokuno_agent3/gain_gated_finite_correction_stage_mechanics.json

      - name: Fail closed on scientific promotion
        run: |
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_gain_gated_finite_correction_stage import (
              build_mechanics_report,
              truth_boundary,
          )
          report = build_mechanics_report()
          receipt = report['mechanics_stage_receipt']
          truth = truth_boundary()
          assert receipt['local_five_moment_gain_gate_passed'] is True
          assert receipt['correction_materialized_only_after_gain_gate'] is True
          assert receipt['correction_bound_to_exact_solve'] is True
          assert receipt['held_out_excluded_from_correction_fit'] is True
          assert receipt['stage_accepted'] is True
          assert receipt['mechanics_only'] is True
          assert receipt['candidate_residual_evidence'] is False
          assert abs(report['observed_held_out_momentum_contraction_factor'] - 0.5) <= 1e-14
          assert truth['local_five_moment_analytic_contraction_gate_integrated'] is True
          for key in (
              'analytic_full_ns_cycle_gain_available',
              'current_real_five_moment_discrepancy_materialized',
              'current_real_ns_correction_velocity_materialized',
              'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed',
              'residual_reduction_claimed',
              'same_protocol_comparable_to_st006',
              'pde_validated',
          ):
              assert truth[key] is False, key
          assert truth['final_normalized_momentum_gate'] == 1e-3
          assert truth['final_normalized_divergence_gate'] == 1e-5
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-gain-gated-finite-correction-stage
          path: artifacts/kokuno_agent3/gain_gated_finite_correction_stage_mechanics.json
          if-no-files-found: warn
