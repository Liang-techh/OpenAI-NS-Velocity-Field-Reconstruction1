name: kokuno-agent1-pa10-source-u-ball

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-source-u-ball-052
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-source-u-ball-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-u-ball:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_axis_domain.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_phi_ball.py \
            src/openai_ns_reconstruction/kokuno_pa10_mixed_jnu_seams.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_u_ball.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_axis_domain.py \
            tests/test_constrained_kokuno_pa10_source_phi_ball.py \
            tests/test_constrained_kokuno_pa10_mixed_jnu_seams.py \
            tests/test_constrained_kokuno_pa10_source_u_ball.py
      - name: Generate exact-head source-u receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_u_ball \
            --output artifacts/kokuno_agent1/pa10_source_u_ball/report.json
      - name: Bind exact head and validate truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent1/pa10_source_u_ball/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)

          cert = payload['u0_coefficient_certificate']
          u_ball = payload['source_compatible_radius_one_u_ball']
          mixed = payload['source_compatible_mixed_post_Jnu_handoff']
          truth = payload['truth_boundary']
          assert payload['selected_source_compatible_inputs']['rho'] == 1e-6
          assert cert['cauchy_L_abs_lower'] > 0
          assert cert['cauchy_one_plus_z2_abs_lower'] > 0
          assert cert['u0_coefficient_norm_upper'] > 0
          assert math.isfinite(cert['u0_coefficient_norm_upper'])
          assert math.isfinite(u_ball['norm']) and u_ball['norm'] > 1
          assert u_ball['lipschitz'] == 1.0
          for key in ('post_J2_d_detaAu_YPhiY', 'post_J1_d_detaAu_YuY'):
              assert math.isfinite(mixed[key]['norm']) and mixed[key]['norm'] > 0
              assert math.isfinite(mixed[key]['lipschitz']) and mixed[key]['lipschitz'] > 0
          assert truth['source_compatible_u0_coefficient_norm_machine_bound'] is True
          assert truth['source_compatible_u_radius_one_ball_norm_machine_bound'] is True
          assert truth['source_compatible_post_J2_R1_mixed_numeric_ball_bound_executable'] is True
          assert truth['source_compatible_post_J1_R2_mixed_numeric_ball_bound_executable'] is True
          assert truth['source_R1_radius_one_ball_norm_machine_bound'] is False
          assert truth['source_R2_radius_one_ball_norm_machine_bound'] is False
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert payload['heldout_ns_residual_assessed'] is False
          assert payload['pde_validated'] is False
          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('u0_coefficient_certificate=', cert)
          print('u_ball=', u_ball)
          print('mixed_post_Jnu=', mixed)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-source-u-ball-v1
          path: artifacts/kokuno_agent1/pa10_source_u_ball/report.json
