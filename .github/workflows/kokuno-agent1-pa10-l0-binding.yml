name: kokuno-agent1-pa10-l0-binding

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-l0-binding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-l0-binding-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  pa10-l0-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile binding
        run: python -m compileall -q src/openai_ns_reconstruction/kokuno_pa10_l0_binding.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_choice_order_guard.py \
            tests/test_constrained_kokuno_pa10_l0_binding.py
      - name: Generate selected-Lambda L0 receipt
        run: |
          python -m openai_ns_reconstruction.kokuno_pa10_l0_binding \
            --output artifacts/kokuno_agent1/pa10_l0_binding/report.json
      - name: Validate partial B0 dependency truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/kokuno_agent1/pa10_l0_binding/report.json").read_text()
          )
          truth = report["truth_boundary"]
          bound = report["binding"]

          assert bound["selected_Lambda"] > 0.0
          assert bound["X_0"] > 0.0
          assert bound["L_0_stable"] >= 0.0
          assert bound["identity_within_8ulp"] is True
          assert report["resolved_source_B0_dependencies"] == ["L_0"]
          assert report["unresolved_source_B0_dependencies"] == [
              "||log phi_*+log Phi(4,.)||_{C^0_eta}",
              "M_0",
          ]
          assert truth["source_L0_machine_bound"] is True
          assert truth["selected_Lambda_is_autonomous_conditioning_choice"] is True
          assert truth["source_hidden_Lambda_recovered"] is False
          assert truth["source_B0_dependencies_machine_bound"] is False
          assert truth["source_B0_analytic_bound_proved"] is False
          assert truth["source_T_sh_lower_bound_verified"] is False
          assert truth["selected_pa16_handoff_allowed"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False

          print("binding_sha256=", report["binding_sha256"])
          print("selected_Lambda=", bound["selected_Lambda"])
          print("X_0=", bound["X_0"])
          print("L_0=", bound["L_0_stable"])
          print("remaining_B0_dependencies=", report["unresolved_source_B0_dependencies"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-l0-binding-v1
          path: artifacts/kokuno_agent1/pa10_l0_binding/report.json
