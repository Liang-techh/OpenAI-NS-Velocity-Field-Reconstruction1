name: kokuno-agent5-current-i4-mean-audit-pulse-routing

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_current_i4_mean_audit_pulse_routing.py"
      - "tests/test_kokuno_a5_current_i4_mean_audit_pulse_routing.py"
      - ".github/workflows/kokuno-agent5-current-i4-mean-audit-pulse-routing.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Authenticate parent A5 and fresh A1-A4 heads
        shell: bash
        run: |
          set -euo pipefail
          PARENT=666d5dad83dee8a9313c3a59bf102b10bb2917cc
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse "$PARENT")" = "$PARENT"
          test "$(git rev-parse "$PARENT:src/openai_ns_reconstruction/kokuno_a5_post_i4_routing_i2_force_audit_ingest.py")" = "59be383c2f266ed83cc5518ce4b43746f52161e1"

          git fetch --no-tags origin pull/1100/head:refs/remotes/origin/a5-a1-1100
          git fetch --no-tags origin pull/1099/head:refs/remotes/origin/a5-a2-1099
          git fetch --no-tags origin pull/1101/head:refs/remotes/origin/a5-a3-1101
          git fetch --no-tags origin pull/1102/head:refs/remotes/origin/a5-a4-1102

          test "$(git rev-parse refs/remotes/origin/a5-a1-1100)" = "2a6c58ff6bf6d1ba6b875bca0e6abf9d1118e156"
          test "$(git rev-parse refs/remotes/origin/a5-a2-1099)" = "3f0988ff016f41126ec546681cba696c5fa8001d"
          test "$(git rev-parse refs/remotes/origin/a5-a3-1101)" = "6c9a4e7b0dec4b3669fb1dc60297b18f10163e0b"
          test "$(git rev-parse refs/remotes/origin/a5-a4-1102)" = "d3999c0e4e0e3483d4199f009e936060c42848c8"

          test "$(git rev-parse 2a6c58ff6bf6d1ba6b875bca0e6abf9d1118e156:src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_main_pulse.py)" = "efcce36612ffc1cb3a74f5eb9c9ae6c86748f60d"
          test "$(git rev-parse 3f0988ff016f41126ec546681cba696c5fa8001d:src/openai_ns_reconstruction/kokuno_source_shell_edge_localized_harmonic.py)" = "a16fba5d2c77fe952d39ae0dae9be2c04b2031fd"
          test "$(git rev-parse 6c9a4e7b0dec4b3669fb1dc60297b18f10163e0b:src/openai_ns_reconstruction/kokuno_current_i4_nonlinear_mean_attribution.py)" = "10d067570ddba834db3f19c9859c2efdad16b3e8"
          test "$(git rev-parse d3999c0e4e0e3483d4199f009e936060c42848c8:src/openai_ns_reconstruction/kokuno_a4_current_i4_nonlinear_mean_independent_audit.py)" = "5f50c05f5fc106c0a9e9a59be1b0f2ff687c9b9c"

      - name: Enforce minimal three-file increment
        shell: bash
        run: |
          set -euo pipefail
          PARENT=666d5dad83dee8a9313c3a59bf102b10bb2917cc
          mapfile -t files < <(git diff --name-only "$PARENT"...HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent5-current-i4-mean-audit-pulse-routing.yml"
            "src/openai_ns_reconstruction/kokuno_a5_current_i4_mean_audit_pulse_routing.py"
            "tests/test_kokuno_a5_current_i4_mean_audit_pulse_routing.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --diff-filter=D --name-only "$PARENT"...HEAD)"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a5_current_i4_mean_audit_pulse_routing.py
          python -m py_compile tests/test_kokuno_a5_current_i4_mean_audit_pulse_routing.py

      - name: Run parent and new A5 regressions
        run: |
          python -m pytest -q \
            tests/test_kokuno_a5_post_i4_routing_i2_force_audit_ingest.py \
            tests/test_kokuno_a5_current_i4_mean_audit_pulse_routing.py

      - name: Materialize deterministic registration artifact
        run: |
          mkdir -p artifacts/kokuno_agent5_current_i4_mean_audit_pulse_routing
          python -m openai_ns_reconstruction.kokuno_a5_current_i4_mean_audit_pulse_routing \
            --output artifacts/kokuno_agent5_current_i4_mean_audit_pulse_routing/registration.json
          cat artifacts/kokuno_agent5_current_i4_mean_audit_pulse_routing/registration.json

      - name: Upload routing artifact before final truth enforcement
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-current-i4-mean-audit-pulse-routing
          path: artifacts/kokuno_agent5_current_i4_mean_audit_pulse_routing/registration.json

      - name: Enforce frozen truth boundary and final gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_a5_current_i4_mean_audit_pulse_routing import validate_registration

          p = Path('artifacts/kokuno_agent5_current_i4_mean_audit_pulse_routing/registration.json')
          r = json.loads(p.read_text())
          validate_registration(r)
          t = r['truth_boundary']
          assert t['correction_frontier_stage'] == 'current-I4-nonlinear-mean'
          assert t['agent4_matching_current_i4_nonlinear_mean_audit_registered'] is True
          assert t['agent4_matching_current_i4_nonlinear_mean_audit_admitted'] is False
          assert t['current_i4_compact_radial_stress_materialized'] is False
          assert t['current_i4_radial_force_materialized'] is False
          assert t['matching_main_pulse_agent2_project_cartesian_composite_materialized'] is False
          assert t['complete_identity_bound_ns_defect_materialized'] is False
          assert t['pde_validated'] is False
          g = r['final_gates']
          assert g['normalized_momentum_sampled_max'] == 1e-3
          assert g['normalized_momentum_volume_l2'] == 1e-3
          assert g['normalized_divergence_sampled_max'] == 1e-5
          assert g['normalized_divergence_volume_l2'] == 1e-5
          assert g['canonical_quadrature'] == [24, 48, 96]
          assert g['residual_defined_free_forcing_allowed'] is False
          PY
