name: kokuno-agent4-fixed-kappa-x100-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-fixed-kappa-x100-independent-audit-086
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_a4_fixed_kappa_x100_independent_audit.py'
      - 'tests/test_constrained_kokuno_a4_fixed_kappa_x100_independent_audit.py'
      - '.github/workflows/kokuno-agent4-fixed-kappa-x100-independent-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-fixed-kappa-x100-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head, Agent-1 ancestry, and pinned source blob
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_PARENT: 1f3dec711f8ce2052276cd951b2f44d2849579bf
          EXPECTED_A1_BLOB: 818d965d82bd92505bd6d3e805e698e1e0da64d8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_fixed_kappa_x100.py)" = "$EXPECTED_A1_BLOB"
          echo "exact_head=$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Agent-4 head
        run: python -m pip install -e '.[dev]'

      - name: Compile and run focused warnings-as-errors regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a4_fixed_kappa_x100_independent_audit.py \
            tests/test_constrained_kokuno_a4_fixed_kappa_x100_independent_audit.py
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_fixed_kappa_x100.py \
            tests/test_constrained_kokuno_a4_fixed_kappa_x100_independent_audit.py

      - name: Emit real save-reload independent receipt
        if: always()
        run: |
          mkdir -p artifacts/kokuno_agent4
          python -m openai_ns_reconstruction.kokuno_a4_fixed_kappa_x100_independent_audit \
            --out artifacts/kokuno_agent4/fixed_kappa_x100_independent_audit.json

      - name: Fail closed on full-NS promotion
        if: always()
        run: |
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_a4_fixed_kappa_x100_independent_audit import (
              FROZEN_FINAL_GATES,
              TRUTH_BOUNDARY,
          )
          assert FROZEN_FINAL_GATES['normalized_momentum_max'] == 1e-3
          assert FROZEN_FINAL_GATES['normalized_momentum_volume_l2'] == 1e-3
          assert FROZEN_FINAL_GATES['divergence_max'] == 1e-5
          assert FROZEN_FINAL_GATES['divergence_volume_l2'] == 1e-5
          for key in (
              'outer_global_leading_velocity_materialized',
              'matched_global_pressure_materialized',
              'cartesian_matched_pressure_gradient_materialized',
              'restricted_forcing_materialized',
              'correction_velocity_materialized',
              'leading_only_ns_residual_assessed',
              'leading_plus_oscillatory_ns_residual_assessed',
              'after_correction_ns_residual_assessed',
              'heldout_complete_ns_residual_assessed',
              'same_protocol_comparable_to_st006',
              'pde_validated',
          ):
              assert TRUTH_BOUNDARY[key] is False, key
          PY

      - name: Upload independent audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-fixed-kappa-x100-independent-audit
          path: artifacts/kokuno_agent4/fixed_kappa_x100_independent_audit.json
          if-no-files-found: warn
