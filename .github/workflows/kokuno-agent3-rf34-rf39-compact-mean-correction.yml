name: kokuno-agent3-rf34-rf39-compact-mean-correction

on:
  push:
    branches:
      - agent3/rf34-rf39-compact-mean-correction-20260922
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_rf34_rf39_compact_mean_correction.py'
      - 'tests/test_constrained_kokuno_rf34_rf39_compact_mean_correction.py'
      - '.github/workflows/kokuno-agent3-rf34-rf39-compact-mean-correction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact Agent-3 parent and strict scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor edcf3a3a2e87f335c268460ca0d4b3b23f4a9847 HEAD
          test "$(git rev-parse edcf3a3a2e87f335c268460ca0d4b3b23f4a9847:src/openai_ns_reconstruction/kokuno_rf30_rf31_typed_mean_correction.py)" = \
            "fa31fdf12adceaa5b295db502cf0ccaaad778307"
          test "$(git rev-list --count edcf3a3a2e87f335c268460ca0d4b3b23f4a9847..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only edcf3a3a2e87f335c268460ca0d4b3b23f4a9847..HEAD)
          test "${#files[@]}" -eq 3

      - name: Verify pinned corrected-reader RF29/RF33-RF39/RF43 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/KokunoYumeto/yang-mills-interacting-workbench.git kokuno-reader
          git -C kokuno-reader checkout --quiet 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C kokuno-reader rev-parse HEAD:navier-stokes/navier_stokes_workbench.tex)" = \
            "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          python - <<'PY'
          from pathlib import Path
          text = Path("kokuno-reader/navier-stokes/navier_stokes_workbench.tex").read_text(encoding="utf-8")
          required = (
              "Explicit five-dimensional moment correction",
              r"\tag{RF33}",
              r"\tag{RF34}",
              r"\tag{RF35}",
              r"\tag{RF36}",
              r"\tag{RF37}",
              r"\tag{RF38}",
              r"\tag{RF39}",
              r"\tag{RF43}",
          )
          for phrase in required:
              if phrase not in text:
                  raise SystemExit(f"missing corrected-reader source phrase: {phrase}")
          print("corrected-reader RF34--RF39 structure pinned")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Agent-3 head
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_rf34_rf39_compact_mean_correction.py \
            tests/test_constrained_kokuno_rf34_rf39_compact_mean_correction.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_rf30_rf31_typed_mean_correction.py \
            tests/test_constrained_kokuno_rf34_rf39_compact_mean_correction.py

      - name: Generate deterministic mechanics receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_rf34_rf39_compact_mean_correction \
            --out artifacts/kokuno_agent3/rf34_rf39_compact_mean_correction_mechanics.json

      - name: Fail closed on scientific promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_rf34_rf39_compact_mean_correction import (
              build_mechanics_report,
              truth_boundary,
          )
          report = build_mechanics_report()
          receipt = report["receipt"]
          truth = truth_boundary()
          assert report["mechanics_only"] is True
          assert report["candidate_residual_evidence"] is False
          assert receipt["source_rf34_rf39_correction_materialized"] is True
          assert receipt["repository_candidate_correction_evidence"] is False
          assert receipt["five_row_closure_max_relative"] <= 2e-7
          assert receipt["coefficient_direct_solve_max_relative"] <= 2e-7
          assert receipt["correction_chart_l2"] > 0.0
          assert truth["concrete_bump_realization_classification"] == "autonomous_repository_choice"
          assert truth["source_exact_bump_recovered"] is False
          for key in (
              "current_i4_source_chart_backend_materialized",
              "current_i4_rf30_defect_materialized",
              "current_i4_rf34_rf39_correction_materialized",
              "correction_applied_to_candidate",
              "rf44_rf49_nonlinear_remainder_recomputed",
              "cartesian_correction_velocity_materialized",
              "complete_ns_defect",
              "real_candidate_finite_correction_cycle_run",
              "heldout_normalized_ns_residual_assessed",
              "residual_reduction_claimed",
              "same_protocol_comparable_to_st006",
              "pde_validated",
          ):
              assert truth[key] is False, key
          assert truth["final_normalized_momentum_gate"] == 1e-3
          assert truth["final_normalized_divergence_gate"] == 1e-5
          assert truth["residual_defined_free_forcing_allowed"] is False
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-rf34-rf39-compact-mean-correction
          path: artifacts/kokuno_agent3/rf34_rf39_compact_mean_correction_mechanics.json
          if-no-files-found: warn
