name: kokuno-agent2-bounded-family-coefficients

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'src/openai_ns_reconstruction/kokuno_source_localized_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_compatible_partition.py'
      - 'tests/test_constrained_kokuno_bounded_family_coefficients.py'
      - 'tests/test_constrained_kokuno_source_localized_real_pair_family.py'
      - 'tests/test_constrained_kokuno_source_compatible_partition.py'
      - '.github/workflows/kokuno-agent2-bounded-family-coefficients.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'src/openai_ns_reconstruction/kokuno_source_localized_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_compatible_partition.py'
      - 'tests/test_constrained_kokuno_bounded_family_coefficients.py'
      - 'tests/test_constrained_kokuno_source_localized_real_pair_family.py'
      - 'tests/test_constrained_kokuno_source_compatible_partition.py'
      - '.github/workflows/kokuno-agent2-bounded-family-coefficients.yml'

permissions:
  contents: read

jobs:
  bounded-family-coefficients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused bounded-family coefficient tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_bounded_family_coefficients.py
          tests/test_constrained_kokuno_source_localized_real_pair_family.py
          tests/test_constrained_kokuno_source_compatible_partition.py
