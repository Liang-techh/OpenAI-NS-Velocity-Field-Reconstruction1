name: kokuno-agent2-strict-inner-velocity-vorticity-morphology

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_strict_inner_velocity_vorticity_morphology.py'
      - 'tests/test_constrained_kokuno_strict_inner_velocity_vorticity_morphology.py'
      - '.github/workflows/kokuno-agent2-strict-inner-velocity-vorticity-morphology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused warnings-as-errors regression
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_strict_inner_leading_oscillatory_vorticity_candidate.py
          tests/test_constrained_kokuno_strict_inner_velocity_vorticity_morphology.py

      - name: Verify frozen parent and fetch exact Agent-1 runtime
        run: |
          test "$(git rev-parse ded8c88dd03b784368cf1a30601faf76a3682c64:src/openai_ns_reconstruction/kokuno_strict_inner_leading_oscillatory_vorticity_candidate.py)" = "9dd3b7400fea8f2d4462cda86561103e29a1d053"
          git fetch origin 300919075c07396e4e466f553be78eaae0707df2
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" 300919075c07396e4e466f553be78eaae0707df2
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD)" = "300919075c07396e4e466f553be78eaae0707df2"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = "5076ffa69748c2d7e68289a155b67288eab6dab4"

      - name: Materialize exact strict-inner morphology receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
        run: |
          mkdir -p artifacts/kokuno_agent2
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_strict_inner_leading_oscillatory_vorticity_candidate import (
              KokunoStrictInnerLeadingOscillatoryVorticityCandidate,
          )
          from openai_ns_reconstruction.kokuno_strict_inner_velocity_vorticity_morphology import (
              ANGULAR_RESOLUTIONS,
              SOURCE_RINGS,
              materialize_strict_inner_morphology,
          )

          a1 = Path(os.environ["A1_WORKTREE"])
          server = r"""
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous

          field = KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              q = json.loads(line)
              op = q["op"]
              if op == "meta":
                  out = {
                      "field_sha256": field.field_sha256,
                      "temporal_derivative_sha256": field.temporal_derivative_sha256,
                      "spatial_derivative_sha256": field.spatial_derivative_sha256,
                  }
              elif op == "forward":
                  raw = field.field.cartesian_from_similarity(
                      np.asarray(q["X"], dtype=float),
                      np.asarray(q["eta"], dtype=float),
                      np.asarray(q["t"], dtype=float),
                      np.asarray(q["theta"], dtype=float),
                  )
                  out = {k: np.asarray(raw[k], dtype=float).tolist() for k in ("x", "y", "z", "t")}
              elif op in ("velocity", "velocity_dt"):
                  raw = getattr(field, op)(
                      np.asarray(q["x"], dtype=float),
                      np.asarray(q["y"], dtype=float),
                      np.asarray(q["z"], dtype=float),
                      np.asarray(q["t"], dtype=float),
                  )
                  out = {"value": np.asarray(raw, dtype=float).tolist()}
              elif op == "velocity_jacobian":
                  raw = field.spatial.velocity_jacobian(
                      np.asarray(q["x"], dtype=float),
                      np.asarray(q["y"], dtype=float),
                      np.asarray(q["z"], dtype=float),
                      np.asarray(q["t"], dtype=float),
                  )
                  out = {"value": np.asarray(raw, dtype=float).tolist()}
              else:
                  raise RuntimeError(op)
              print(json.dumps(out, sort_keys=True), flush=True)
          """
          env = os.environ.copy()
          env["PYTHONPATH"] = str(a1 / "src")
          proc = subprocess.Popen(
              [sys.executable, "-u", "-c", server],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              proc.stdin.write(json.dumps(payload, separators=(",", ":")) + "\n")
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  raise RuntimeError(proc.stderr.read())
              return json.loads(line)

          meta = ask({"op": "meta"})

          class Backend:
              field_sha256 = meta["field_sha256"]
              temporal_derivative_sha256 = meta["temporal_derivative_sha256"]
              spatial_derivative_sha256 = meta["spatial_derivative_sha256"]

              @staticmethod
              def _arr(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float),
                      np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float),
                      np.asarray(t, dtype=float),
                  )

              def _call(self, op, x, y, z, t):
                  x, y, z, t = self._arr(x, y, z, t)
                  return np.asarray(
                      ask({
                          "op": op,
                          "x": x.tolist(),
                          "y": y.tolist(),
                          "z": z.tolist(),
                          "t": t.tolist(),
                      })["value"],
                      dtype=float,
                  )

              def velocity(self, x, y, z, t):
                  return self._call("velocity", x, y, z, t)

              def velocity_dt(self, x, y, z, t):
                  return self._call("velocity_dt", x, y, z, t)

              def velocity_jacobian(self, x, y, z, t):
                  return self._call("velocity_jacobian", x, y, z, t)

          def forward_mapper(X, eta, t, theta):
              X, eta, t, theta = np.broadcast_arrays(
                  np.asarray(X, dtype=float),
                  np.asarray(eta, dtype=float),
                  np.asarray(t, dtype=float),
                  np.asarray(theta, dtype=float),
              )
              raw = ask({
                  "op": "forward",
                  "X": X.tolist(),
                  "eta": eta.tolist(),
                  "t": t.tolist(),
                  "theta": theta.tolist(),
              })
              return {k: np.asarray(raw[k], dtype=float) for k in ("x", "y", "z", "t")}

          candidate = KokunoStrictInnerLeadingOscillatoryVorticityCandidate(Backend())
          receipt = materialize_strict_inner_morphology(candidate, forward_mapper)
          out = Path("artifacts/kokuno_agent2/strict_inner_velocity_vorticity_morphology.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")

          summary = {
              "candidate_identity": receipt["candidate_identity"],
              "source_rings": SOURCE_RINGS,
              "angular_resolutions": ANGULAR_RESOLUTIONS,
              "gate_values": receipt["gate_values"],
              "gate_checks": receipt["gate_checks"],
              "passed": receipt["strict_inner_three_resolution_morphology_gate_passed"],
              "receipt_sha256": receipt["receipt_sha256"],
              "truth_boundary": receipt["truth_boundary"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          proc.stdin.close()
          rc = proc.wait(timeout=10)
          if rc != 0:
              raise RuntimeError(proc.stderr.read())
          if not receipt["strict_inner_three_resolution_morphology_gate_passed"]:
              raise SystemExit("strict-inner three-resolution morphology gate failed")
          PY

      - name: Upload morphology receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-strict-inner-velocity-vorticity-morphology
          path: artifacts/kokuno_agent2/strict_inner_velocity_vorticity_morphology.json
          if-no-files-found: warn
