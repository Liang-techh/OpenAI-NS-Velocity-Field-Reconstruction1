name: agent7-interior-compact-swirl-capacity-report

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_eq45_bipolar_f20_capacity.py'
      - 'src/openai_ns_reconstruction/constrained_eq45_bipolar_interior_compact_swirl_capacity.py'
      - 'tests/test_constrained_eq45_bipolar_interior_compact_swirl_capacity.py'
      - '.github/workflows/agent7-interior-compact-swirl-capacity-report.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test interior compact swirl capacity
        run: python -m pytest -q -W error tests/test_constrained_eq45_bipolar_interior_compact_swirl_capacity.py
      - name: Generate interior compact swirl capacity report
        run: python -m openai_ns_reconstruction.constrained_eq45_bipolar_interior_compact_swirl_capacity
      - name: Upload capacity report
        uses: actions/upload-artifact@v4
        with:
          name: agent7-interior-compact-swirl-capacity-report
          path: artifacts/bipolar_interior_compact_swirl_capacity/report.json
