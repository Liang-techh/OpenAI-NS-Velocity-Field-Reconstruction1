name: kokuno-agent3-radial-force-spacetime-envelope

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_radial_force_spacetime_envelope.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_force_completeness_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_core_series.py'
      - 'src/openai_ns_reconstruction/kokuno_spacetime_covariance_preflight.py'
      - 'tests/test_constrained_kokuno_radial_force_spacetime_envelope.py'
      - 'tests/test_constrained_kokuno_radial_force_completeness_audit.py'
      - '.github/workflows/kokuno-agent3-radial-force-spacetime-envelope.yml'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_radial_force_spacetime_envelope.py
          tests/test_constrained_kokuno_radial_force_completeness_audit.py
          tests/test_constrained_kokuno_radial_stress.py
          tests/test_constrained_kokuno_mean_defect.py

  measure-cell:
    needs: focused-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        time: [0.375, 0.5, 0.625]
        z: [0.06, 0.08, 0.10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Measure one real radial-force cell
        run: >-
          python -m openai_ns_reconstruction.kokuno_radial_force_spacetime_envelope
          --cell-time '${{ matrix.time }}'
          --cell-z '${{ matrix.z }}'
          --cell-output 'artifacts/cells/t${{ matrix.time }}_z${{ matrix.z }}.json'
      - name: Upload cell receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a3-radial-cell-t${{ matrix.time }}-z${{ matrix.z }}
          path: artifacts/cells/*.json

  aggregate:
    needs: measure-cell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Download frozen cell receipts
        uses: actions/download-artifact@v4
        with:
          pattern: kokuno-a3-radial-cell-*
          path: artifacts/kokuno_agent3/radial_force_spacetime_cells
          merge-multiple: true
      - name: Aggregate conservative spacetime envelope
        run: >-
          python -m openai_ns_reconstruction.kokuno_radial_force_spacetime_envelope
          --summarize-cell-dir artifacts/kokuno_agent3/radial_force_spacetime_cells
          --output-dir artifacts/kokuno_agent3/radial_force_spacetime_envelope_v17
      - name: Copy cell receipts into report bundle
        run: >-
          cp -R artifacts/kokuno_agent3/radial_force_spacetime_cells
          artifacts/kokuno_agent3/radial_force_spacetime_envelope_v17/cells
      - name: Show summary
        run: cat artifacts/kokuno_agent3/radial_force_spacetime_envelope_v17/summary.json
      - name: Upload report bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-radial-force-spacetime-envelope-v17
          path: artifacts/kokuno_agent3/radial_force_spacetime_envelope_v17
