name: kokuno-agent3-mean-correction-cycle

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_mean_correction_cycle.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'tests/test_constrained_kokuno_mean_correction_cycle.py'
      - 'docs/KOKUNO_MEAN_CORRECTION_CYCLE.md'
      - '.github/workflows/kokuno-agent3-mean-correction-cycle.yml'

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_mean_correction_cycle.py tests/test_constrained_kokuno_radial_stress.py tests/test_constrained_kokuno_mean_defect.py tests/test_constrained_kokuno_complete_curl.py
      - name: Generate real-artifact one-step mean-correction report
        run: python -m openai_ns_reconstruction.kokuno_mean_correction_cycle --radial-count 65 --angular-count 16
      - name: Show report
        run: cat artifacts/kokuno_agent3/mean_correction_cycle_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-mean-correction-cycle-report
          path: artifacts/kokuno_agent3/mean_correction_cycle_report.json
