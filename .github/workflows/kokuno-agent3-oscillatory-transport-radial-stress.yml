name: kokuno-agent3-oscillatory-transport-radial-stress

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_transport_radial_stress.py'
      - 'tests/test_constrained_kokuno_oscillatory_transport_radial_stress.py'
      - '.github/workflows/kokuno-agent3-oscillatory-transport-radial-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact Agent-3 ancestry and source identities
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor baa36f77039423ec5c6b86a8d0a60da5d2fa9811 HEAD
          test "$(git rev-parse HEAD:src/openai_ns_reconstruction/kokuno_oscillatory_transport_mean.py)" = '08933745fa25d0f1a8a136843f855cee7675bf75'
          test "$(git rev-parse HEAD:src/openai_ns_reconstruction/kokuno_strict_inner_transport_first_cell_polynomial_radial_stress.py)" = '19f8cf9fa909fef7be2cf53c84df269e696b647c'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent-3 head
        run: python -m pip install -e '.[dev]'

      - name: Focused Agent-3 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_oscillatory_transport_radial_stress.py \
            tests/test_constrained_kokuno_oscillatory_transport_radial_stress.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_oscillatory_transport_mean.py \
            tests/test_constrained_kokuno_oscillatory_transport_radial_stress.py

      - name: Generate mechanics-only receipt
        run: |
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_oscillatory_transport_radial_stress \
            --output artifacts/kokuno_agent3/oscillatory_transport_radial_stress_mechanics.json

      - name: Fetch exact Agent-2 handoff and Agent-1 backend
        run: |
          set -euo pipefail
          git fetch origin 4a78b06afbab95c108c184a32cb5951e66f42991
          git worktree add --detach "$RUNNER_TEMP/kokuno-a2-901" 4a78b06afbab95c108c184a32cb5951e66f42991
          test "$(git -C "$RUNNER_TEMP/kokuno-a2-901" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_oscillatory_transport_handoff.py)" = '57932afda3b65e4cb63e9ae7c8ceeb0aba141cc5'
          git fetch origin 300919075c07396e4e466f553be78eaae0707df2
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" 300919075c07396e4e466f553be78eaae0707df2
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = '5076ffa69748c2d7e68289a155b67288eab6dab4'

      - name: Exact A2-to-A3 oscillatory radial-stress receipt
        env:
          A2_WORKTREE: ${{ runner.temp }}/kokuno-a2-901
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import numpy as np

          from openai_ns_reconstruction.kokuno_oscillatory_transport_mean import (
              ExactAgent2OscillatoryTransportHandoff,
          )
          from openai_ns_reconstruction.kokuno_oscillatory_transport_radial_stress import (
              MEAN_ATTRIBUTION_ABSOLUTE_GATE,
              STRESS_ATTRIBUTION_RELATIVE_GATE,
              materialize_oscillatory_transport_radial_stress,
              truth_boundary,
          )
          from openai_ns_reconstruction.kokuno_strict_inner_transport_radial_stress import (
              StrictInnerTransportRadialGeometry,
          )
          import openai_ns_reconstruction as package

          a2 = Path(os.environ['A2_WORKTREE'])
          a1 = Path(os.environ['A1_WORKTREE'])
          package.__path__.insert(0, str(a2 / 'src' / 'openai_ns_reconstruction'))
          from openai_ns_reconstruction.kokuno_oscillatory_transport_handoff import (
              KokunoOscillatoryTransportHandoff,
          )

          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous
          field = KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {'field_sha256': field.field_sha256}
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t')}
              elif op in ('velocity','velocity_dt','self_advection','velocity_laplacian'):
                  out = getattr(field, op)(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''
          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1, env=env,
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          meta = ask({'op':'meta'})

          class ExactAgent1Backend:
              field_sha256 = meta['field_sha256']
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def _call(self, op, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  result = ask({
                      'op':op, 'x':x.tolist(), 'y':y.tolist(),
                      'z':z.tolist(), 't':t.tolist(),
                  })
                  return np.asarray(result['value'], dtype=float)
              def velocity(self, x, y, z, t): return self._call('velocity', x, y, z, t)
              def velocity_dt(self, x, y, z, t): return self._call('velocity_dt', x, y, z, t)
              def self_advection(self, x, y, z, t): return self._call('self_advection', x, y, z, t)
              def velocity_laplacian(self, x, y, z, t): return self._call('velocity_laplacian', x, y, z, t)

          # Fixed before numerical output: 17-node strict-inner radial profile.
          count = 17
          X = np.linspace(0.02, 0.34, count)
          eta = np.full(count, 0.15)
          source_t = np.full(count, 0.50)
          mapped = ask({
              'op':'forward',
              'X':X.tolist(), 'eta':eta.tolist(), 't':source_t.tolist(),
              'theta':np.zeros(count).tolist(),
          })
          x0 = np.asarray(mapped['x'], dtype=float)
          y0 = np.asarray(mapped['y'], dtype=float)
          z = np.asarray(mapped['z'], dtype=float)
          t = np.asarray(mapped['t'], dtype=float)
          radius = np.hypot(x0, y0)
          if np.max(np.abs(z-z[0])) > 1.0e-13 or np.max(np.abs(t-t[0])) > 1.0e-15:
              raise RuntimeError('frozen oscillatory radial-stress profile is not fixed-(z,t)')
          if not np.all(np.diff(radius) > 0.0):
              raise RuntimeError('frozen physical radii are not strictly increasing')

          raw_handoff = KokunoOscillatoryTransportHandoff(ExactAgent1Backend())
          exact = ExactAgent2OscillatoryTransportHandoff.bind(raw_handoff)
          span = float(radius[-1]-radius[0])
          geometry = StrictInnerTransportRadialGeometry(
              time=float(t[0]), axial_z=float(z[0]),
              radii=tuple(float(v) for v in radius),
              bump_center=float(0.5*(radius[0]+radius[-1])),
              bump_halfwidth=float(0.45*span),
          )
          result = materialize_oscillatory_transport_radial_stress(exact, geometry)
          receipt = result.to_receipt()

          failed=[]
          mean = result.mean_witness
          if max(mean.successive_transport_mean_relative_differences) > 1.0e-5:
              failed.append('angular_convergence')
          if mean.pointwise_decomposition_closure_absolute_max > 5.0e-13:
              failed.append('pointwise_decomposition')
          if mean.pointwise_before_after_closure_absolute_max > 1.0e-12:
              failed.append('pointwise_before_after')
          if mean.projected_decomposition_closure_absolute_max > 1.0e-12:
              failed.append('projected_decomposition')
          if mean.projected_before_after_closure_absolute_max > 1.0e-12:
              failed.append('projected_before_after')
          if result.mean_attribution_closure_absolute_max > MEAN_ATTRIBUTION_ABSOLUTE_GATE:
              failed.append('mean_attribution')
          if result.theta_stress_attribution_relative_max > STRESS_ATTRIBUTION_RELATIVE_GATE:
              failed.append('theta_stress_attribution')
          if result.axial_stress_attribution_relative_max > STRESS_ATTRIBUTION_RELATIVE_GATE:
              failed.append('axial_stress_attribution')

          for name, stress in (
              ('theta', result.theta_delta_stress),
              ('axial', result.axial_delta_stress),
          ):
              moment = abs(float(stress['weighted_moment']))
              complement = abs(float(stress['moment_complement_weighted_moment']))
              if stress['first_cell_polynomial_degree'] != 2:
                  failed.append(name + '_first_cell_degree')
              if abs(float(stress['bump_weighted_integral']) - 1.0) > 1.0e-11:
                  failed.append(name + '_bump_normalization')
              if complement > 1.0e-9 * max(1.0, moment):
                  failed.append(name + '_moment_complement')
              if abs(float(stress['stress_outer_edge'])) > 1.0e-9 * max(1.0, float(stress['stress_max_abs'])):
                  failed.append(name + '_outer_edge')

          boundary = truth_boundary()
          for key in (
              'pressure_gradient_included', 'restricted_forcing_included',
              'global_corrected_leading_join_materialized', 'complete_ns_defect',
              'scoped_transport_stress_authorized_as_correction_target',
              'mean_correction_velocity_materialized',
              'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed', 'residual_reduction_claimed',
              'same_protocol_comparable_to_st006', 'pde_validated',
          ):
              if boundary[key]: failed.append('truth_laundering_' + key)

          receipt.update({
              'schema':'kokuno-a3-oscillatory-transport-radial-stress-exact-receipt-v1',
              'agent2_exact_head':'4a78b06afbab95c108c184a32cb5951e66f42991',
              'agent1_reference_head':'300919075c07396e4e466f553be78eaae0707df2',
              'source_X':X.tolist(), 'source_eta':eta.tolist(),
              'engineering_gates':{
                  'angular_relative_difference_max':1.0e-5,
                  'mean_attribution_absolute_max':MEAN_ATTRIBUTION_ABSOLUTE_GATE,
                  'stress_attribution_relative_max':STRESS_ATTRIBUTION_RELATIVE_GATE,
              },
              'failed_guards':failed,
              'classification':'strict-inner pressure/forcing-free oscillatory transport radial stress',
              'candidate_residual_evidence':False,
              'correction_authorized':False,
          })
          Path('artifacts/kokuno_agent3').mkdir(parents=True, exist_ok=True)
          Path('artifacts/kokuno_agent3/oscillatory_transport_radial_stress_exact.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None: proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if failed:
              raise SystemExit('failed preregistered guards: ' + ', '.join(failed))
          PY

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-oscillatory-transport-radial-stress-v1
          path: artifacts/kokuno_agent3/*.json
          if-no-files-found: warn
