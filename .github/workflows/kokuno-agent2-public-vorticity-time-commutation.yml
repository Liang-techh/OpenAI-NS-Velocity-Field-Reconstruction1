name: kokuno-agent2-public-vorticity-time-commutation

on:
  push:
    branches:
      - codex/kokuno-a2-vorticity-time-commutation-046
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_time_commutation.py"
      - "tests/test_constrained_kokuno_public_oscillatory_vorticity_time_commutation.py"
      - ".github/workflows/kokuno-agent2-public-vorticity-time-commutation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent2-public-vorticity-time-commutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-vorticity-time-commutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_time_commutation.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_oscillatory_vorticity_time_commutation.py
          tests/test_constrained_kokuno_public_oscillatory_vorticity_diagnostic.py
          tests/test_constrained_kokuno_public_oscillatory_time_derivative.py
      - name: Generate immutable commutation receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_public_oscillatory_vorticity_time_commutation
          --output artifacts/kokuno_agent2_public_oscillatory_vorticity_time_commutation_v1.json
      - name: Check provenance, frozen guards and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent2_public_oscillatory_vorticity_time_commutation_v1.json')
          r = json.loads(p.read_text())
          assert r['parent_agent2_pr'] == 669
          assert r['parent_agent2_head'] == 'f40436f2eddb77db94b07921fefa1e09ab94b134'
          assert r['velocity_pr'] == 561
          assert r['velocity_dt_pr'] == 579
          assert r['time_steps'] == [0.016, 0.008, 0.004]
          assert r['spatial_stability_steps'] == [0.018, 0.009, 0.0045]
          assert r['failed_guards'] == []
          assert r['self_diagnostic_passed'] is True
          t = r['truth_boundary']
          assert t['velocity_candidate_changed'] is False
          assert t['velocity_time_derivative_changed'] is False
          assert t['oscillatory_coefficients_retuned'] is False
          assert t['source_formula_changed'] is False
          assert t['numerical_curl_time_commutation_diagnostic_only'] is True
          assert t['independent_agent4_validation_replaced'] is False
          assert t['independent_agent4_vector_potential_audit_required'] is True
          assert t['agent3_momentum_defect_or_correction_duplicated'] is False
          assert t['heldout_ns_momentum_residual_assessed'] is False
          assert t['formal_full_domain_pde_gate_assessed'] is False
          assert t['pde_validated'] is False
          assert t['paper_exact'] is False
          print('identity_sha256=', r['identity_sha256'])
          print('time_refinement=', r['time_commutation_ladder']['successive_rms_refinement_ratios'])
          print('finest_relative_rms=', r['time_commutation_ladder']['rows'][-1]['relative_rms_error'])
          print('finest_relative_max=', r['time_commutation_ladder']['rows'][-1]['relative_max_error'])
          print('spatial_refinement=', r['spatial_stability_ladder']['successive_difference_refinement_ratio'])
          print('support_exterior_absolute_max=', r['support_exterior_absolute_max'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-public-vorticity-time-commutation-v1
          path: artifacts/kokuno_agent2_public_oscillatory_vorticity_time_commutation_v1.json
          if-no-files-found: error
