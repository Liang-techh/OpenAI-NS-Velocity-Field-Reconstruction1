name: kokuno-agent2-core-phase-screen

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_core_phase.py'
      - 'tests/test_constrained_kokuno_oscillatory_core_phase.py'
      - '.github/workflows/kokuno-agent2-core-phase-screen.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run focused Agent-2 phase tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_oscillatory_core_phase.py
      - name: Generate core phase screen
        run: python -m openai_ns_reconstruction.kokuno_oscillatory_core_phase
      - name: Show report
        run: cat artifacts/kokuno_agent2/core_phase_screen_004/phase_screen_report.json
      - name: Upload report and candidate
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-core-phase-screen-004
          path: artifacts/kokuno_agent2/core_phase_screen_004/
