name: kokuno-agent3-carrier-resolved-audit-admission

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_carrier_resolved_audit_admission.py'
      - 'tests/test_constrained_kokuno_carrier_resolved_audit_admission.py'
      - 'artifacts/constrained/kokuno_agent3/agent4_553_carrier_resolved_independent_audit.json'
      - '.github/workflows/kokuno-agent3-carrier-resolved-audit-admission.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_carrier_resolved_audit_admission.py'
      - 'tests/test_constrained_kokuno_carrier_resolved_audit_admission.py'
      - 'artifacts/constrained/kokuno_agent3/agent4_553_carrier_resolved_independent_audit.json'
      - '.github/workflows/kokuno-agent3-carrier-resolved-audit-admission.yml'

permissions:
  contents: read

jobs:
  carrier-resolved-audit-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-3 admission tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_oscillatory_audit_identity_admission.py
          tests/test_constrained_kokuno_carrier_resolved_audit_admission.py
      - name: Compile Agent-3 admission module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_carrier_resolved_audit_admission.py
      - name: Generate carrier-resolved admission receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_carrier_resolved_audit_admission
          --audit artifacts/constrained/kokuno_agent3/agent4_553_carrier_resolved_independent_audit.json
          --output kokuno_agent3_carrier_resolved_audit_admission.json
      - name: Check partial promotion and fail-closed correction boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('kokuno_agent3_carrier_resolved_audit_admission.json').read_text())
          assert r['execution_identity_bound'] is True
          assert r['project_support_preflight_passed'] is True
          assert r['independent_candidate_covariance_rank_preflight_passed'] is True
          assert r['divergence_max_passed'] is True
          assert r['divergence_rms_passed'] is False
          assert r['divergence_refinement_passed'] is False
          assert r['public_oscillatory_preflight_passed'] is False
          assert r['correction_ingest_allowed'] is False
          assert r['same_cycle_requested_stress_materialization_allowed'] is False
          assert r['finite_correction_cycle_rerun_allowed'] is False
          assert r['heldout_ns_residual_assessed'] is False
          assert r['residual_reduction_claimed'] is False
          assert r['pde_validated'] is False
          PY
      - name: Upload Agent-3 admission receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-carrier-resolved-audit-admission-v1
          path: kokuno_agent3_carrier_resolved_audit_admission.json
