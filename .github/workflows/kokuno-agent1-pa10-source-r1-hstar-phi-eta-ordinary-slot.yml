name: kokuno-agent1-pa10-source-r1-hstar-phi-eta-ordinary-slot

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-r1-hstar-phi-eta-slot-062
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_r1_hstar_phi_eta_ordinary_slot.py"
      - "tests/test_constrained_kokuno_pa10_source_r1_hstar_phi_eta_ordinary_slot.py"
      - ".github/workflows/kokuno-agent1-pa10-source-r1-hstar-phi-eta-ordinary-slot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-source-r1-hstar-phi-eta-ordinary-slot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-r1-hstar-phi-eta-ordinary-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        run: |
          echo "exact_head=$(git rev-parse HEAD)"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_axis_domain.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_phi_ball.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_u_ball.py \
            src/openai_ns_reconstruction/kokuno_pa10_post_j_remainder_bridge.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_derivative_ordinary_slots.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_algebraic_ordinary_slots.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_zeta_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_averaged_eta_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_wstar_logradial_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_averaged_logradial_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_hstar_phi_eta_ordinary_slot.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_derivative_ordinary_slots.py \
            tests/test_constrained_kokuno_pa10_source_r1_averaged_logradial_ordinary_slot.py \
            tests/test_constrained_kokuno_pa10_source_r1_hstar_phi_eta_ordinary_slot.py
      - name: Generate exact-head Agent-1 receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_r1_hstar_phi_eta_ordinary_slot \
            --output artifacts/kokuno_agent1/pa10_source_r1_hstar_phi_eta_ordinary_slot_v1/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path(
              'artifacts/kokuno_agent1/'
              'pa10_source_r1_hstar_phi_eta_ordinary_slot_v1/report.json'
          )
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)

          expected_new = {'H_star_times_Phi_eta'}
          assert set(payload['R1_Hstar_Phi_eta_ordinary_after_J2']) == expected_new
          item = payload['R1_Hstar_Phi_eta_ordinary_after_J2'][
              'H_star_times_Phi_eta'
          ]
          assert item['norm'] > 0.0
          assert item['lipschitz'] > 0.0

          rho = payload['selected_source_compatible_inputs']['rho']
          certificate = payload['operator_certificate']
          assert certificate['post_J2_single_eta_factor_upper'] >= 80.0 / rho
          assert certificate['standalone_Phi_eta_norm_used'] is False
          assert certificate['J2_already_in_source_single_eta_factor'] is True
          assert certificate['ordinary_bridge_J2_reapplied'] is False
          assert certificate['Hstar_coefficient_bound_reused_not_duplicated'] is True

          progress = payload['ledger_progress']
          assert progress['R1_post_J2_source_bound_ordinary_slots_count'] == 10
          assert progress['R1_total_ordinary_slots'] == 11
          assert progress['R1_ordinary_slots_still_required'] == 1
          assert progress['R1_remaining_ordinary_slots'] == [
              'lambda_inv_d_u_times_Phi_eta',
          ]
          assert progress['R1_numerator_space_source_bound_count_remains_six'] is True
          assert progress['full_R1_still_open'] is True
          assert progress['M_K_not_promoted'] is True

          truth = payload['truth_boundary']
          assert truth['source_Hstar_coefficient_norm_machine_bound_reused'] is True
          assert truth['source_single_eta_post_J2_rule_executable'] is True
          assert truth['standalone_Phi_eta_coefficient_norm_invented'] is False
          assert truth['ordinary_bridge_J2_reapplied'] is False
          assert truth[
              'source_compatible_all_R1_ordinary_post_J2_slots_machine_bound'
          ] is False
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False

          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print(
              'R1_Hstar_Phi_eta_after_J2=',
              payload['R1_Hstar_Phi_eta_ordinary_after_J2'],
          )
          print('progress=', progress)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-source-r1-hstar-phi-eta-ordinary-slot-v1
          path: artifacts/kokuno_agent1/pa10_source_r1_hstar_phi_eta_ordinary_slot_v1/report.json
          if-no-files-found: error
