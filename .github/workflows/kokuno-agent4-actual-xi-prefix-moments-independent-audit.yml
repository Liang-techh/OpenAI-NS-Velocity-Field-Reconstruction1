name: kokuno-agent4-actual-xi-prefix-moments-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a4_actual_xi_prefix_moments_independent_audit.py"
      - "tests/test_constrained_kokuno_a4_actual_xi_prefix_moments_independent_audit.py"
      - ".github/workflows/kokuno-agent4-actual-xi-prefix-moments-independent-audit.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert stacked Agent-1 ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 2797eed8e3b9b3374c676d8f517f05e3f0fc3e6b HEAD

      - name: Verify exact Agent-1 source blob
        shell: bash
        run: |
          test "$(git rev-parse 2797eed8e3b9b3374c676d8f517f05e3f0fc3e6b:src/openai_ns_reconstruction/kokuno_pa10_actual_xi_prefix_moments.py)" = "92dce65c9a8793e06497a7e7347c832861032238"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a4_actual_xi_prefix_moments_independent_audit.py
          python -m py_compile tests/test_constrained_kokuno_a4_actual_xi_prefix_moments_independent_audit.py

      - name: Materialize real save-reload independent receipt
        id: real_audit
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/kokuno_a4
          python -m openai_ns_reconstruction.kokuno_a4_actual_xi_prefix_moments_independent_audit \
            --output artifacts/kokuno_a4/actual_xi_prefix_moments_independent_receipt.json \
            --no-enforce

      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-actual-xi-prefix-moments-independent-receipt
          path: artifacts/kokuno_a4/actual_xi_prefix_moments_independent_receipt.json
          if-no-files-found: warn

      - name: Run Agent-1 and Agent-4 focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_actual_xi_prefix_moments.py \
            tests/test_constrained_kokuno_a4_actual_xi_prefix_moments_independent_audit.py

      - name: Enforce frozen real-audit gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/kokuno_a4/actual_xi_prefix_moments_independent_receipt.json")
          if not path.exists():
              raise SystemExit("real independent Xi-moment receipt was not materialized")
          receipt = json.loads(path.read_text())
          if receipt.get("passed") is not True:
              raise SystemExit(
                  "frozen A4 Xi-prefix-moment audit failed:\n"
                  + json.dumps(
                      {
                          "gates": receipt.get("gates"),
                          "physical_resolution_metrics": receipt.get("physical_resolution_metrics"),
                          "discrepancy_resolution_metrics": receipt.get("discrepancy_resolution_metrics"),
                          "physical_resolution_stability": receipt.get("physical_resolution_stability"),
                          "discrepancy_resolution_stability": receipt.get("discrepancy_resolution_stability"),
                          "discrepancy_worst_witness": receipt.get("discrepancy_worst_witness"),
                          "mutation_checks": receipt.get("mutation_checks"),
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )
          truth = receipt["truth_boundary"]
          if truth.get("pde_validated") is not False:
              raise SystemExit("scoped Xi-moment audit illegally promoted pde_validated")
          if truth.get("heldout_complete_ns_residual_assessed") is not False:
              raise SystemExit("scoped Xi-moment audit illegally claimed full NS residual")
          print(
              json.dumps(
                  {
                      "passed": receipt["passed"],
                      "artifact_semantic_sha256": receipt["artifact_semantic_sha256"],
                      "receipt_sha256": receipt["receipt_sha256"],
                      "max_independent_discrepancy_l2": receipt["max_independent_discrepancy_l2"],
                      "gates": receipt["gates"],
                      "physical_finest": receipt["physical_resolution_metrics"][-1],
                      "discrepancy_finest": receipt["discrepancy_resolution_metrics"][-1],
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
