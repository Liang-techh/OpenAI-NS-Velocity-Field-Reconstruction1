name: kokuno-agent2-candidate-mass-bound-phase-curl

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_candidate_mass_bound_phase_curl.py"
      - "tests/test_constrained_kokuno_candidate_mass_bound_phase_curl.py"
      - ".github/workflows/kokuno-agent2-candidate-mass-bound-phase-curl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-mass-bound-phase-curl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile new source
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_candidate_mass_bound_phase_curl.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_candidate_mass_bound_phase_curl.py
          tests/test_constrained_kokuno_source_signed_covariance_mass.py
          tests/test_constrained_kokuno_source_phase_bound_signed_curl.py
          tests/test_constrained_kokuno_source_signed_complete_curl_family.py
