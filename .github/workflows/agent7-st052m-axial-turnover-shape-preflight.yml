name: agent7-st052m-axial-turnover-shape-preflight

on:
  pull_request:
    paths:
      - 'experiments/root_st052/agent7_st052m_axial_turnover_shape_preflight.py'
      - 'experiments/root_st052/test_agent7_st052m_axial_turnover_shape_preflight.py'
      - '.github/workflows/agent7-st052m-axial-turnover-shape-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  axial-turnover-shape-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Verify exact PR head checkout
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Focused frozen-protocol tests
        run: python -m pytest -q -W error experiments/root_st052/test_agent7_st052m_axial_turnover_shape_preflight.py
      - name: Execute preregistered axial-turnover preflight
        run: |
          mkdir -p outputs/agent7-st052m-axial-turnover-shape-preflight
          python experiments/root_st052/agent7_st052m_axial_turnover_shape_preflight.py \
            --out outputs/agent7-st052m-axial-turnover-shape-preflight/report.json
      - name: Verify frozen ancestry, capacity gates and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-axial-turnover-shape-preflight/report.json').read_text())
          assert r['task_id']=='CR003-ST052M-AXIAL-TURNOVER-SHAPE-PREFLIGHT-122'
          assert r['prereg_issue']==861
          assert r['source_parent']=={'pr':855,'head':'47a59dee5ec5bb0a1bcd61c04796638640bb26ed'}
          assert r['source_child']=={'pr':775,'head':'93887a59729d22113badf2ae4dac2f7d868e2703'}
          assert r['source_radial_shape']=={'pr':810,'head':'b077eaffabfe66ce0b15ac29601a82bfddeb4cf9'}
          assert r['frozen_family']['turnovers']==[1.75,1.8,1.85]
          assert r['frozen_family']['basis_dimension_increment']==0
          assert r['live_shape_exact_replay']['passes'] is True
          assert r['turnover_sign_witness']['passes'] is True
          j=r['three_coordinate_identifiability']
          assert j['normalized_column_rank']==3
          assert j['max_abs_pairwise_cosine'] < .995
          assert j['normalized_condition'] <= 25.0
          assert j['passes'] is True
          assert r['structural_guards']['all_pass'] is True
          assert r['fresh_714_path_data_used'] is False
          assert r['candidate_turnover_selected'] is False
          assert r['held_out_pde_residual']['evaluated'] is False
          assert r['held_out_pde_residual']['st006_comparison_performed'] is False
          assert r['pressure_or_force_changed'] is False
          assert r['visual_correspondence_verified'] is False
          assert r['source_correspondence_verified'] is False
          assert r['pde_validated'] is False
          assert r['paper_exact'] is False
          assert r['openai_field_identified'] is False
          assert r['axial_turnover_shape_preflight_passed'] is True
          print('screen_pass=', r['axial_turnover_shape_preflight_passed'])
          print('identifiability=', j)
          print('sign_witness=', r['turnover_sign_witness'])
          print('calibration=', r['calibration'])
          PY
      - name: Publish compact receipt
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f outputs/agent7-st052m-axial-turnover-shape-preflight/report.json ]; then exit 0; fi
          python - <<'PY' > /tmp/agent7-axial-turnover-receipt.md
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-axial-turnover-shape-preflight/report.json').read_text())
          j=r['three_coordinate_identifiability']
          print('<!-- agent7-st052m-axial-turnover-shape-preflight-receipt -->')
          print('**Agent 7 frozen axial-turnover shape receipt (issue #861):**')
          print()
          print(f"- preflight pass: `{r['axial_turnover_shape_preflight_passed']}`")
          print(f"- exact live s=1.80 replay: `{r['live_shape_exact_replay']['passes']}`")
          print(f"- rank / condition / max |cosine|: `{j['normalized_column_rank']}` / `{j['normalized_condition']:.6g}` / `{j['max_abs_pairwise_cosine']:.6g}`")
          print(f"- pairwise cosines: `{j['pairwise_cosines']}`")
          for key,row in r['calibration'].items():
              print(f"- {key}: alpha `{row['derived_alpha']:.9g}`, alpha/live `{row['alpha_over_live']:.9g}`")
          print(f"- turnover sign witness at |z|=1.80: `{r['turnover_sign_witness']['passes']}`")
          print('- held-out full-PDE residual: `not evaluated`; no ST006 comparison or PDE-improvement claim.')
          print()
          print('Truth boundary: this is a same-dimension morphology-capacity preflight. It selects no turnover and does not establish visual/source correspondence, PDE validation, paper exactness, exact OpenAI-field identity, or blow-up.')
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/agent7-axial-turnover-receipt.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-st052m-axial-turnover-shape-preflight
          path: outputs/agent7-st052m-axial-turnover-shape-preflight/
          if-no-files-found: warn

# Family, response cloud and gates were frozen in issue #861 before execution.
