name: kokuno-agent1-current-relative-swirl-decimal-composed

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py"
      - "tests/test_kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py"
      - ".github/workflows/kokuno-agent1-current-relative-swirl-decimal-composed.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert exact A1 ancestry and minimal three-file scope
        shell: bash
        run: |
          git merge-base --is-ancestor 657818dd83e119e6091bd2490d3804c04c3ef723 HEAD
          mapfile -t changed < <(git diff --name-only 657818dd83e119e6091bd2490d3804c04c3ef723...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent1-current-relative-swirl-decimal-composed.yml"
            "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py"
            "tests/test_kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Verify pinned corrected-source blob
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://raw.githubusercontent.com/KokunoYumeto/yang-mills-interacting-workbench/143f6773feb424ad9ed3a8d116653200f20346b7/navier-stokes/navier_stokes_workbench.tex"
          data = urllib.request.urlopen(url, timeout=30).read()
          digest = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          expected = "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          if digest != expected:
              raise SystemExit(f"corrected source blob drifted: {digest} != {expected}")
          print("corrected 2026-09-09 source blob pinned")
          PY

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py
          python -m py_compile tests/test_kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py

      - name: Run parent and new focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_current_relative_swirl_absolute_target.py \
            tests/test_kokuno_pa16_current_cartesian_relative_swirl_split.py \
            tests/test_kokuno_pa16_current_cartesian_relative_swirl_decimal_composed.py

      - name: Emit deterministic precision-qualified receipt
        run: |
          mkdir -p artifacts/kokuno_agent1_current_relative_swirl_decimal_composed
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from decimal import Decimal
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_relative_swirl_decimal_composed import (
              KokunoPA16CurrentCartesianRelativeSwirlDecimalComposed,
          )

          root = Path("artifacts/kokuno_agent1_current_relative_swirl_decimal_composed")
          candidate = KokunoPA16CurrentCartesianRelativeSwirlDecimalComposed()
          receipt = candidate.representation_report()
          config = candidate.configuration()
          truth = receipt["truth_boundary"]

          assert receipt["binary64_erases_all_active_components"] is True
          assert receipt["decimal_total_retains_all_active_components"] is True
          assert receipt["decimal_total_minus_base_replays_delta"] is True
          assert receipt["precision_margin_available"] >= 0
          assert truth["current_cartesian_relative_swirl_composed"] is True
          assert truth["precision_qualified_public_velocity_materialized"] is True
          assert truth["binary64_total_relative_swirl_sum_is_resolved"] is False
          assert truth["unified_global_cartesian_velocity_export_ready"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False
          assert truth["openai_field_identified"] is False

          log_X = candidate.log_X_flatten_end + candidate.compensator.y1
          radius = math.exp(0.5 * (math.log(2.0) + log_X))
          export = candidate.export_velocity_decimal_json(
              root / "velocity_decimal.json", radius, 0.0, 0.0, 0.0
          )
          vals = [Decimal(v) for v in export["values_row_major"]]
          assert any(v != 0 for v in vals)

          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload precision-qualified receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-current-relative-swirl-decimal-composed
          path: artifacts/kokuno_agent1_current_relative_swirl_decimal_composed/
