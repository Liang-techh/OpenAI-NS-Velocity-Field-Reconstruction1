name: kokuno-agent5-reference-integration-checkpoint

on:
  pull_request:
  workflow_dispatch:

jobs:
  reference-integration-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-5 integration tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_reference_composite_checkpoint.py
      - name: Generate replayable integration checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_reference_composite_checkpoint
          --output-dir artifacts/kokuno_agent5/reference_integration_checkpoint_v5
      - name: Show checkpoint
        run: cat artifacts/kokuno_agent5/reference_integration_checkpoint_v5/integration_checkpoint.json
      - name: Upload checkpoint bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-reference-integration-checkpoint-v5
          path: artifacts/kokuno_agent5/reference_integration_checkpoint_v5
