name: kokuno-agent5-source-wave-shell-rejection-routing

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_wave_shell.py'
      - 'src/openai_ns_reconstruction/kokuno_source_partition_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_wave_shell_cartesian_independent.py'
      - 'src/openai_ns_reconstruction/kokuno_source_wave_shell_rejection_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_source_wave_shell_cartesian_independent.py'
      - 'tests/test_constrained_kokuno_source_wave_shell_rejection_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-source-wave-shell-rejection-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-source-wave-shell-rejection-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-2/4/5 source-shell tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_wave_shell_cartesian_independent.py
          tests/test_constrained_kokuno_source_wave_shell_rejection_routing_checkpoint.py
      - name: Generate fail-closed routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_source_wave_shell_rejection_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/source_wave_shell_rejection_routing_checkpoint_v19
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/source_wave_shell_rejection_routing_checkpoint_v19/source_wave_shell_rejection_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-source-wave-shell-rejection-routing-checkpoint-v19
          path: artifacts/kokuno_agent5/source_wave_shell_rejection_routing_checkpoint_v19
