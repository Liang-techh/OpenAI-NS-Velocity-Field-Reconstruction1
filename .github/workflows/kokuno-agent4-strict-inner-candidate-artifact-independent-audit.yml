name: kokuno-agent4-strict-inner-candidate-artifact-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-strict-inner-candidate-artifact-audit-076
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_a4_strict_inner_candidate_artifact_independent_audit.py'
      - 'tests/test_constrained_kokuno_a4_strict_inner_candidate_artifact_independent_audit.py'
      - '.github/workflows/kokuno-agent4-strict-inner-candidate-artifact-independent-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout and pinned A2 candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          A2_HEAD='a586b7afe4bb47dbfd4b25177586c79d362afff9'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor "$A2_HEAD" HEAD
          test "$(git rev-parse "$A2_HEAD":src/openai_ns_reconstruction/kokuno_strict_inner_leading_oscillatory_candidate.py)" = "82e732af14695c39afa3b631c00b7f20960976da"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: python -m pip install -e '.[dev]'

      - name: Compile and run focused regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a4_strict_inner_candidate_artifact_independent_audit.py \
            tests/test_constrained_kokuno_a4_strict_inner_candidate_artifact_independent_audit.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_a4_strict_inner_candidate_artifact_independent_audit.py

      - name: Fetch exact Agent-1 strict-inner backend
        shell: bash
        run: |
          set -euo pipefail
          A1_HEAD='300919075c07396e4e466f553be78eaae0707df2'
          A1_BLOB='5076ffa69748c2d7e68289a155b67288eab6dab4'
          git fetch --no-tags origin "$A1_HEAD"
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD)" = "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = "$A1_BLOB"

      - name: Generate exact-head black-box candidate receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_a4_strict_inner_candidate_artifact_independent_audit import (
              AGENT1_REFERENCE_BLOB,
              AGENT1_REFERENCE_HEAD,
              AGENT2_CANDIDATE_BLOB,
              AGENT2_CANDIDATE_HEAD,
              DIVERGENCE_SAMPLED_MAX_GATE,
              DIVERGENCE_SAMPLED_RMS_GATE,
              RICHARDSON_STEPS,
              divergence_metrics,
              frozen_gate_failures,
              public_contract as a4_public_contract,
              richardson_divergence_level,
              scalar_rms,
              vector_rms,
          )
          from openai_ns_reconstruction.kokuno_strict_inner_leading_oscillatory_candidate import (
              KokunoStrictInnerLeadingOscillatoryCandidate,
              public_contract as a2_public_contract,
          )

          seed = 9173521
          random_count = 96
          axis_near_count = 6
          rng = np.random.default_rng(seed)
          a1 = Path(os.environ['A1_WORKTREE'])

          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous
          field = KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'source_X_interval': list(field.spatial.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op == 'velocity':
                  out = field.velocity(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''
          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code], cwd=a1, env=env,
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          meta = ask({'op': 'meta'})

          class ExactAgent1VelocityBackend:
              field_sha256 = meta['field_sha256']
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def velocity(self, x, y, z, t):
                  x, y, z, t = self._arrays(x, y, z, t)
                  out = ask({'op':'velocity','x':x.tolist(),'y':y.tolist(),
                             'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)

          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 time interval')
          if meta['source_X_interval'][1] < 0.35:
              raise RuntimeError('unexpected Agent-1 strict-inner X domain')

          # Frozen fresh held-out source-interior probes; these only select legal
          # physical points.  All scientific derivatives below consume the
          # manifest-reloaded candidate.velocity surface as a black box.
          X_random = rng.uniform(0.165, 0.255, size=random_count)
          eta_random = rng.uniform(-0.22, 0.22, size=random_count)
          t_random = rng.uniform(0.46, 0.54, size=random_count)
          theta_random = rng.uniform(0.0, 2.0 * math.pi, size=random_count)
          X_axis = np.asarray((0.0, 0.0, 0.0, 1.0e-14, 1.0e-12, 1.0e-10))
          eta_axis = np.asarray((-0.18, 0.0, 0.18, -1.0e-8, 1.0e-8, 0.08))
          t_axis = np.asarray((0.47, 0.50, 0.53, 0.48, 0.52, 0.50))
          theta_axis = np.asarray((0.13, 1.03, 2.07, 0.61, 1.71, 2.81))
          X = np.concatenate((X_random, X_axis))
          eta = np.concatenate((eta_random, eta_axis))
          source_t = np.concatenate((t_random, t_axis))
          theta = np.concatenate((theta_random, theta_axis))
          forward = ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),
                         't':source_t.tolist(),'theta':theta.tolist()})
          x = np.asarray(forward['x'], dtype=float)
          y = np.asarray(forward['y'], dtype=float)
          z = np.asarray(forward['z'], dtype=float)
          tt = np.asarray(forward['t'], dtype=float)
          if x.size != random_count + axis_near_count:
              raise RuntimeError('held-out sample count drifted')

          backend = ExactAgent1VelocityBackend()
          Path('artifacts').mkdir(exist_ok=True)
          manifest_path = Path('artifacts/kokuno_a4_candidate_under_audit_manifest.json')
          source_candidate = KokunoStrictInnerLeadingOscillatoryCandidate(backend)
          manifest = source_candidate.save_manifest(manifest_path)
          candidate = KokunoStrictInnerLeadingOscillatoryCandidate.load_manifest(
              backend, manifest_path
          )

          # Scientific numerical path: only the manifest-reloaded public velocity.
          provider = candidate.velocity
          levels = tuple(
              richardson_divergence_level(provider, x, y, z, tt, step=h)
              for h in RICHARDSON_STEPS
          )
          failures = frozen_gate_failures(levels)
          fine = levels[-1]

          # Axis and near-axis are reported separately, not forced to identical behavior.
          axis_slice = slice(random_count, random_count + axis_near_count)
          axis_near_divergence_max = float(np.max(np.abs(fine.divergence[axis_slice])))
          axis_near_divergence_rms = scalar_rms(fine.divergence[axis_slice])

          # Mutation control: inject known +1e-3 divergence through the public surface.
          def divergence_mutation(xx, yy, zz, time):
              base = np.asarray(candidate.velocity(xx, yy, zz, time), dtype=float)
              xb, yb, zb, tb = np.broadcast_arrays(
                  np.asarray(xx, dtype=float), np.asarray(yy, dtype=float),
                  np.asarray(zz, dtype=float), np.asarray(time, dtype=float),
              )
              delta = np.stack((1.0e-3 * xb, np.zeros_like(yb), np.zeros_like(zb)), axis=-1)
              return base + delta

          mutated_levels = tuple(
              richardson_divergence_level(divergence_mutation, x, y, z, tt, step=h)
              for h in RICHARDSON_STEPS
          )
          mutation_failures = frozen_gate_failures(mutated_levels)
          divergence_mutation_detected = (
              'divergence_sampled_max' in mutation_failures
              and 'divergence_sampled_rms' in mutation_failures
          )
          if not divergence_mutation_detected:
              failures.append('divergence_mutation_control')

          # Artifact-integrity mutations recompute the top-level manifest digest so
          # rejection must occur at semantic/scientific identity, not merely JSON hash.
          def canonical(payload):
              return json.dumps(payload, sort_keys=True, separators=(',', ':'), allow_nan=False)
          def refresh_manifest_sha(payload):
              q = copy.deepcopy(payload)
              q.pop('manifest_sha256', None)
              q['manifest_sha256'] = hashlib.sha256(canonical(q).encode()).hexdigest()
              return q

          semantic_mutation = copy.deepcopy(manifest)
          semantic_mutation['candidate_sha256'] = 'f' * 64
          semantic_mutation = refresh_manifest_sha(semantic_mutation)
          semantic_rejected = False
          try:
              KokunoStrictInnerLeadingOscillatoryCandidate.from_manifest(backend, semantic_mutation)
          except ValueError:
              semantic_rejected = True
          if not semantic_rejected:
              failures.append('semantic_manifest_mutation_not_rejected')

          gate_mutation = copy.deepcopy(manifest)
          gate_mutation['scientific_gates']['momentum_max_l2'] = 1.001e-3
          gate_mutation = refresh_manifest_sha(gate_mutation)
          gate_rejected = False
          try:
              KokunoStrictInnerLeadingOscillatoryCandidate.from_manifest(backend, gate_mutation)
          except ValueError:
              gate_rejected = True
          if not gate_rejected:
              failures.append('scientific_gate_parameter_mutation_not_rejected')

          a2_contract = a2_public_contract()
          if a2_contract['forbidden_velocity_inputs_present']:
              failures.append('candidate_velocity_exposes_forbidden_scientific_knobs')
          if candidate.candidate_sha256 != manifest['candidate_sha256']:
              failures.append('candidate_sha256_roundtrip')

          div_abs = np.abs(fine.divergence)
          worst = int(np.argmax(div_abs))
          receipt = {
              'schema': 'kokuno-a4-strict-inner-candidate-artifact-independent-receipt-v1',
              'exact_a4_head': os.environ['EXPECTED_HEAD'],
              'agent2_candidate_head': AGENT2_CANDIDATE_HEAD,
              'agent2_candidate_blob': AGENT2_CANDIDATE_BLOB,
              'agent1_reference_head': AGENT1_REFERENCE_HEAD,
              'agent1_reference_blob': AGENT1_REFERENCE_BLOB,
              'agent1_field_sha256': meta['field_sha256'],
              'candidate_sha256': candidate.candidate_sha256,
              'manifest_sha256': manifest['manifest_sha256'],
              'seed': seed,
              'random_offgrid_count': random_count,
              'axis_near_count': axis_near_count,
              'sample_count': int(x.size),
              'derivative_method': 'Richardson-extrapolated centered two-point Cartesian derivative',
              'nominal_steps': list(RICHARDSON_STEPS),
              'resolution_metrics': [divergence_metrics(level) for level in levels],
              'finest_velocity_rms': vector_rms(fine.velocity),
              'axis_near_finest_divergence_sampled_max': axis_near_divergence_max,
              'axis_near_finest_divergence_sampled_rms': axis_near_divergence_rms,
              'worst_finest_divergence': {
                  'abs_value': float(div_abs[worst]),
                  'signed_value': float(fine.divergence[worst]),
                  'x': float(x[worst]), 'y': float(y[worst]), 'z': float(z[worst]), 't': float(tt[worst]),
                  'source_X': float(X[worst]), 'source_eta': float(eta[worst]),
              },
              'divergence_mutation_detected': divergence_mutation_detected,
              'semantic_manifest_mutation_rejected': semantic_rejected,
              'scientific_gate_parameter_mutation_rejected': gate_rejected,
              'public_velocity_has_tunable_scientific_inputs': bool(a2_contract['forbidden_velocity_inputs_present']),
              'parameter_perturbation_note': 'artifact has no tunable velocity scientific knobs; frozen momentum gate was perturbed by +0.1% in a checksum-valid manifest and had to be rejected',
              'scoped_divergence_gate': {
                  'sampled_max': DIVERGENCE_SAMPLED_MAX_GATE,
                  'sampled_rms': DIVERGENCE_SAMPLED_RMS_GATE,
              },
              'norm_scope': {
                  'l2_label': 'held-out sampled RMS, not whole-domain volume L2',
                  'complete_ns_residual_assessed': False,
                  'same_protocol_st006_comparison_valid': False,
              },
              'failed_guards': failures,
              'a4_contract': a4_public_contract(),
          }
          receipt['truth_boundary'] = receipt['a4_contract']['truth_boundary']
          receipt_text = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          receipt_path = Path('artifacts/kokuno_a4_strict_inner_candidate_artifact_independent_receipt.json')
          receipt_path.write_text(receipt_text)
          receipt_sha256 = hashlib.sha256(receipt_text.encode()).hexdigest()
          Path('artifacts/kokuno_a4_strict_inner_candidate_artifact_independent_receipt.sha256').write_text(
              receipt_sha256 + '  ' + receipt_path.name + '\n'
          )
          print(receipt_text)
          print('receipt_sha256=' + receipt_sha256)

          if proc.stdin is not None:
              proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if failures:
              raise SystemExit('failed guards: ' + ', '.join(failures))
          PY

      - name: Upload exact-head independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-strict-inner-candidate-artifact-independent-audit-v1
          path: |
            artifacts/kokuno_a4_candidate_under_audit_manifest.json
            artifacts/kokuno_a4_strict_inner_candidate_artifact_independent_receipt.json
            artifacts/kokuno_a4_strict_inner_candidate_artifact_independent_receipt.sha256
          if-no-files-found: warn
