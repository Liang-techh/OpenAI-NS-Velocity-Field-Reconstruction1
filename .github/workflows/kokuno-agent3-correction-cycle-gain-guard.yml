name: kokuno-agent3-correction-cycle-gain-guard

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_correction_cycle_gain_guard.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_amplitude_curl_cycle.py'
      - 'src/openai_ns_reconstruction/kokuno_signed_covariance_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_core_series.py'
      - 'tests/test_constrained_kokuno_correction_cycle_gain_guard.py'
      - 'tests/test_constrained_kokuno_signed_amplitude_curl_cycle.py'
      - '.github/workflows/kokuno-agent3-correction-cycle-gain-guard.yml'

permissions:
  contents: read

jobs:
  correction-cycle-gain-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_correction_cycle_gain_guard.py
          tests/test_constrained_kokuno_signed_amplitude_curl_cycle.py
      - name: Replay real cycle through gain guard
        run: >-
          python -m openai_ns_reconstruction.kokuno_correction_cycle_gain_guard
          --output artifacts/kokuno_agent3/correction_cycle_gain_guard_report.json
          --cycle-output artifacts/kokuno_agent3/correction_cycle_gain_guard_cycle_replay.json
      - name: Show report
        run: cat artifacts/kokuno_agent3/correction_cycle_gain_guard_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-correction-cycle-gain-guard
          path: |
            artifacts/kokuno_agent3/correction_cycle_gain_guard_report.json
            artifacts/kokuno_agent3/correction_cycle_gain_guard_cycle_replay.json
