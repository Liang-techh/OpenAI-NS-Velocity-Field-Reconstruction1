name: kokuno-agent2-source-bounded-scale-oriented-multiharmonic

on:
  push:
    branches: [codex/kokuno-a2-bounded-scale-110]
  pull_request:
    branches: [kokuno-agent2-oriented-multiharmonic-diagnostics-109]
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Verify exact A2 parent and minimal scope
        shell: bash
        run: |
          set -euo pipefail
          base=3bdf0d6a33a629c4262875b146e1378d550023d0
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-list --count "$base"..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only "$base"..HEAD | sort)
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent2-source-bounded-scale-oriented-multiharmonic.yml"
            "src/openai_ns_reconstruction/kokuno_source_bounded_scale_oriented_multiharmonic_velocity.py"
            "tests/test_constrained_kokuno_source_bounded_scale_oriented_multiharmonic_velocity.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_oriented_multiharmonic_diagnostics.py | git hash-object --stdin)" = 16efe4ab3521f10c4d15f166fa054ab9bef2bae8
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity.py | git hash-object --stdin)" = ca8acae2c3a53b79528cb55f45502443f6ffb2b6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install branch
        run: python -m pip install -e '.[dev]'

      - name: Focused A2 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_source_bounded_scale_oriented_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_bounded_scale_oriented_multiharmonic_velocity.py
          pytest -q \
            tests/test_constrained_kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_oriented_multiharmonic_diagnostics.py \
            tests/test_constrained_kokuno_source_bounded_scale_oriented_multiharmonic_velocity.py

      - uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Authenticate corrected 2026-09-09 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = 205a99807302e21a51c5eaf223390c0dfc42bcd0

      - name: Materialize bounded-scale complete-curl receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          import numpy as np

          from openai_ns_reconstruction.kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity import (
              KokunoAzimuthalFrameOrientedBoundedMultiHarmonicPhysicalVelocity,
          )
          from openai_ns_reconstruction.kokuno_source_bounded_scale_oriented_multiharmonic_velocity import (
              KokunoBoundedIsotropicScaleOrientedMultiHarmonicPhysicalVelocity,
              bounded_isotropic_scale_contract,
              public_contract,
          )

          ns = runpy.run_path(
              "tests/test_constrained_kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity.py"
          )
          raw = ns["_parent_field"]()
          parent = KokunoAzimuthalFrameOrientedBoundedMultiHarmonicPhysicalVelocity(
              raw, frame_azimuth=0.63
          )
          scale = 1.37
          field = KokunoBoundedIsotropicScaleOrientedMultiHarmonicPhysicalVelocity(
              parent, spatial_scale=scale
          )
          xp, yp, zp, t = ns["_physical"](
              raw,
              np.asarray([0.31, 0.45, 0.63]),
              np.asarray([-0.16, 0.05, 0.21]),
              np.asarray([0.34, 0.51, 0.67]),
              np.asarray([-0.41, 0.79, 1.43]),
          )
          ref = parent.evaluate(xp, yp, zp, t)
          got = field.evaluate(scale * xp, scale * yp, scale * zp, t)
          potential_error = float(np.max(np.abs(
              got.complex_vector_potential_cartesian_physical
              - scale * ref.complex_vector_potential_cartesian_physical
          )))
          complex_velocity_error = float(np.max(np.abs(
              got.complex_velocity_cartesian_physical
              - ref.complex_velocity_cartesian_physical
          )))
          real_velocity_error = float(np.max(np.abs(
              got.real_pair_velocity_cartesian_physical
              - ref.real_pair_velocity_cartesian_physical
          )))
          contract = bounded_isotropic_scale_contract()
          public = public_contract()
          receipt = {
              "task": "K2-OSC-110",
              "field_semantic_sha256": field.semantic_sha256,
              "parent_semantic_sha256": parent.semantic_sha256,
              "spatial_scale": scale,
              "potential_dilation_max_abs_error": potential_error,
              "complex_velocity_dilation_max_abs_error": complex_velocity_error,
              "real_velocity_dilation_max_abs_error": real_velocity_error,
              "active_term_count_replayed": bool(np.array_equal(
                  got.active_term_count, ref.active_term_count
              )),
              "contract": contract,
              "public_contract": public,
          }
          Path("receipts/bounded_scale_complete_curl.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload raw receipt before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-source-bounded-scale-oriented-multiharmonic
          path: receipts
          if-no-files-found: error

      - name: Enforce scoped mechanics and scientific truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_source_bounded_scale_oriented_multiharmonic_velocity import (
              bounded_isotropic_scale_contract,
              public_contract,
          )

          report = json.loads(Path("receipts/bounded_scale_complete_curl.json").read_text())
          assert report["potential_dilation_max_abs_error"] <= 1e-12
          assert report["complex_velocity_dilation_max_abs_error"] <= 1e-12
          assert report["real_velocity_dilation_max_abs_error"] <= 1e-12
          assert report["active_term_count_replayed"] is True

          c = bounded_isotropic_scale_contract()
          p = public_contract()
          assert c["bounded_isotropic_physical_scale_materialized"] is True
          assert c["independent_scale_parameter_materialized"] is True
          assert c["curl_contract_preserved_by_constant_dilation_chain_rule"] is True
          assert c["divergence_free_contract_preserved_by_constant_dilation"] is True
          assert c["post_velocity_hard_support_mask_used"] is False
          assert c["source_exact_scale_recovered"] is False
          assert c["source_exact_scale_claimed"] is False
          assert c["self_contained_velocity_xyzt_provider"] is False
          assert c["complete_ns_residual_assessed"] is False
          assert c["oscillation_before_after_ns_residual_compared"] is False
          assert c["residual_reduction_claimed"] is False
          assert c["paper_exact"] is False
          assert c["pde_validated"] is False
          assert p["forbidden_velocity_inputs_present"] == []
          PY
