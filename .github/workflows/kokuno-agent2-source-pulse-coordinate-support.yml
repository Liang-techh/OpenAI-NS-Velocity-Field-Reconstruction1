name: kokuno-agent2-source-pulse-coordinate-support

on:
  push:
    branches: [kokuno-agent2-pulse-coordinate-support-107]
  pull_request:
    branches: [kokuno-agent2-support-certified-multiharmonic-106]
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Verify exact A2 parent and minimal scope
        shell: bash
        run: |
          set -euo pipefail
          base=f2b7ddb909b8fc2bcf575942ed63ec4a1fbc98bf
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-list --count "$base"..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only "$base"..HEAD | sort)
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent2-source-pulse-coordinate-support.yml"
            "src/openai_ns_reconstruction/kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py"
            "tests/test_constrained_kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_support_certified_multiharmonic_velocity.py | git hash-object --stdin)" = 5b2bdab4e7fff24ecec8f8cb0fbd8d118a862381
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_bounded_multiharmonic_velocity.py | git hash-object --stdin)" = 06bc24722b4219419e91cd2d5b08cb1294665f24
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_axis_safe_physical_velocity.py | git hash-object --stdin)" = 9067cb68dc49e08a3da7aaa429366f11d2073cdd

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install branch
        run: python -m pip install -e '.[dev]'

      - name: Focused A2 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py
          pytest -q \
            tests/test_constrained_kokuno_source_bounded_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_bounded_multiharmonic_diagnostics.py \
            tests/test_constrained_kokuno_source_support_certified_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py

      - uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Authenticate corrected 2026-09-09 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = 205a99807302e21a51c5eaf223390c0dfc42bcd0

      - name: Materialize pulse-coordinate support receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          import numpy as np

          from openai_ns_reconstruction.kokuno_source_pulse_coordinate_support_multiharmonic_velocity import (
              KokunoPulseCoordinateSupportBoundedMultiHarmonicPhysicalVelocity,
              public_contract,
              pulse_coordinate_support_multiharmonic_contract,
          )

          ns = runpy.run_path(
              "tests/test_constrained_kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py"
          )
          harmonic_calls = {}
          pulse_calls = {}
          _, term = ns["_term"](
              harmonic_calls=harmonic_calls,
              pulse_calls=pulse_calls,
              pulse_offset=2.0,
          )
          field = KokunoPulseCoordinateSupportBoundedMultiHarmonicPhysicalVelocity(
              (term,), ell=8, h=0.004
          )
          R = np.full(3, 0.45)
          Z = np.zeros(3)
          T = np.asarray([0.10, 0.50, 0.90])
          x, y, z, t = ns["_physical"](field, R, Z, T)
          out = field.evaluate(x, y, z, t)
          contract = pulse_coordinate_support_multiharmonic_contract()
          public = public_contract()

          assert np.array_equal(out.active_term_count, np.asarray([0, 1, 0]))
          assert np.array_equal(out.real_pair_velocity_cartesian_physical[[0, 2]], np.zeros((2, 3)))
          assert np.linalg.norm(out.real_pair_velocity_cartesian_physical[1]) > 0.0
          assert pulse_calls == {"calls": 1, "points": 3}
          assert harmonic_calls == {"calls": 1, "points": 1}
          assert contract["provider_certified_pulse_coordinate_support_materialized"] is True
          assert contract["source_exact_pulse_coordinate_mapping_recovered"] is False
          assert contract["source_exact_pulse_support_interval_recovered"] is False
          assert contract["source_pulse_coordinate_identified_with_chart_T"] is False
          assert contract["physical_time_support_certificate_materialized"] is False
          assert contract["complete_ns_residual_assessed"] is False
          assert contract["paper_exact"] is False
          assert contract["pde_validated"] is False
          assert public["forbidden_velocity_inputs_present"] == []

          receipt = {
              "task": "K2-OSC-107",
              "field_semantic_sha256": field.semantic_sha256,
              "pulse_support_certificate": field.configuration()["pulse_terms"][0]["pulse_support_certificate"],
              "pulse_coordinate_provider_id": field.configuration()["pulse_terms"][0]["pulse_coordinate_provider_id"],
              "probe_chart_T": T.tolist(),
              "probe_provider_v": (T + 2.0).tolist(),
              "active_term_count": out.active_term_count.tolist(),
              "pulse_coordinate_calls": pulse_calls,
              "harmonic_provider_calls": harmonic_calls,
              "contract": contract,
              "public_contract": public,
          }
          Path("receipts/pulse_coordinate_support_multiharmonic.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload raw receipt before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-source-pulse-coordinate-support
          path: receipts
          if-no-files-found: error

      - name: Enforce scientific truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_source_pulse_coordinate_support_multiharmonic_velocity import (
              public_contract,
              pulse_coordinate_support_multiharmonic_contract,
          )
          c = pulse_coordinate_support_multiharmonic_contract()
          p = public_contract()
          assert c["provider_certified_outer_spatial_support_inherited"] is True
          assert c["provider_certified_pulse_coordinate_support_materialized"] is True
          assert c["pulse_coordinate_mapping_identity_bound"] is True
          assert c["pulse_coordinate_exact_zero_skips_harmonic_provider_evaluation"] is True
          assert c["pulse_coordinate_support_applied_as_execution_skip_not_velocity_hard_mask"] is True
          assert c["smooth_pulse_zero_extension_certificate_required"] is True
          assert c["source_exact_pulse_coordinate_mapping_recovered"] is False
          assert c["source_exact_pulse_support_interval_recovered"] is False
          assert c["source_exact_pulse_support_numbers_claimed"] is False
          assert c["source_pulse_coordinate_identified_with_chart_T"] is False
          assert c["source_pulse_coordinate_identified_with_physical_t"] is False
          assert c["physical_time_support_certificate_materialized"] is False
          assert c["self_contained_velocity_xyzt_provider"] is False
          assert c["complete_ns_residual_assessed"] is False
          assert c["oscillation_before_after_ns_residual_compared"] is False
          assert c["residual_reduction_claimed"] is False
          assert c["paper_exact"] is False
          assert c["pde_validated"] is False
          assert p["forbidden_velocity_inputs_present"] == []
          PY
