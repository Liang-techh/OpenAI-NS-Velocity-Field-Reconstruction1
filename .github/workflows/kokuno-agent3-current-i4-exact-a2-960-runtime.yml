name: kokuno-agent3-current-i4-exact-a2-960-runtime

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py'
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py'
      - 'src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py'
      - 'tests/test_constrained_kokuno_current_i4_exact_a2_960_runtime.py'
      - '.github/workflows/kokuno-agent3-current-i4-exact-a2-960-runtime.yml'

permissions:
  contents: read

jobs:
  exact-a2-960-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact Agent-3 PR head
        uses: actions/checkout@v4
        with:
          path: a3
          fetch-depth: 0

      - name: Verify bounded successor stack and byte-exact A2 runtime closure
        shell: bash
        run: |
          set -euo pipefail
          parent=25f2793091cbf8dc2d8f966b941c32eaff63d876
          git -C a3 merge-base --is-ancestor "$parent" HEAD
          test "$(git -C a3 rev-list --count "$parent"..HEAD)" -eq 3
          git -C a3 diff --name-only "$parent"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/kokuno-agent3-current-i4-exact-a2-960-runtime.yml
          src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py
          src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py
          src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py
          tests/test_constrained_kokuno_current_i4_exact_a2_960_runtime.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = 12df3bf6c949baeebf609b366f2973e7f515a157
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py)" = 599baa190ec742d0e532e5517078534124e68d6b
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py)" = 4ae525bad1e4b83c9dcabc1a97d3931562d099a5
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_public_z_pullback_velocity.py)" = 4a3abc1a11f7e054f651dd7bace8ada6d5a6b653
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_public_candidate_velocity.py)" = a0e1b07981ba23a6bd547df14e8cdc89ad0d89ca
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_public_carrier_resolved_velocity.py)" = 77edc85e4ac7aced997c90c2d93e7552e7d0c39b
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_i4_exact_backend_correction_firewall.py)" = 0152a85f7fbaf9c32c24c9d5c7d0d11166e3b157

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent-3 tree
        run: python -m pip install -e a3

      - name: Compile and run focused exact-runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile a3/src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py
          python -m py_compile a3/src/openai_ns_reconstruction/kokuno_oscillatory_batch_axis_safety.py
          python -m py_compile a3/src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py
          python -m py_compile a3/tests/test_constrained_kokuno_current_i4_exact_a2_960_runtime.py
          python -m pytest -q -W error \
            a3/tests/test_constrained_kokuno_current_i4_exact_a2_960_runtime.py \
            a3/tests/test_constrained_kokuno_current_i4_exact_backend_correction_firewall.py

      - name: Materialize exact-runtime availability receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=a3/src python - <<'PY'
          import inspect
          import json
          from pathlib import Path

          from openai_ns_reconstruction import kokuno_oscillatory_batch_differentials as diff
          from openai_ns_reconstruction.kokuno_current_i4_nonlinear_mean_attribution import (
              AGENT2_DIFFERENTIAL_FUNCTION,
              AGENT2_DIFFERENTIAL_MODULE,
              AGENT2_DIFFERENTIAL_SOURCE_BLOB,
              _git_blob_sha1,
          )

          root = Path('a3/src/openai_ns_reconstruction')
          composite_path = root / 'kokuno_current_i4_leading_oscillatory_identity.py'
          differential_path = root / 'kokuno_oscillatory_batch_differentials.py'
          source = inspect.getsourcefile(diff.evaluate_oscillatory_batch_differentials)
          differential_authenticated = bool(
              source
              and diff.evaluate_oscillatory_batch_differentials.__module__ == AGENT2_DIFFERENTIAL_MODULE
              and diff.evaluate_oscillatory_batch_differentials.__name__ == AGENT2_DIFFERENTIAL_FUNCTION
              and _git_blob_sha1(source) == AGENT2_DIFFERENTIAL_SOURCE_BLOB
          )
          composite_present = composite_path.exists()

          payload = {
              'schema': 'kokuno-a3-current-i4-exact-a2-960-runtime-receipt-v1',
              'exact_parent_a3_1214': '25f2793091cbf8dc2d8f966b941c32eaff63d876',
              'exact_a2_960_head': '6d2fb1f701a34f783dca15a267ae2ce0734ba741',
              'exact_a2_960_differential_source_blob': AGENT2_DIFFERENTIAL_SOURCE_BLOB,
              'exact_a2_960_differential_module_present': differential_path.exists(),
              'exact_a2_960_differential_runtime_authenticated': differential_authenticated,
              'exact_a2_1080_composite_module_present': composite_present,
              'full_exact_backend_rebind_ready_from_this_stack': differential_authenticated and composite_present,
              'real_rf30_rf34_rf39_correction_numerically_executed_here': False,
              'rf44_post_update_materialized_here': False,
              'cartesian_delta_u_materialized_here': False,
              'heldout_complete_ns_residual_assessed_here': False,
              'residual_reduction_claimed': False,
              'pde_validated': False,
              'final_normalized_momentum_gate': 1.0e-3,
              'final_normalized_divergence_gate': 1.0e-5,
              'residual_defined_free_forcing_allowed': False,
              'remaining_blocker': None if composite_present else (
                  'exact A2 #1080 composite runtime closure remains absent; '
                  'do not promote #1210 fixture correction evidence'
              ),
          }
          Path('artifacts/current_i4_exact_a2_960_runtime_receipt.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload receipt before enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-current-i4-exact-a2-960-runtime
          path: artifacts/

      - name: Enforce narrow truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/current_i4_exact_a2_960_runtime_receipt.json').read_text())
          assert p['exact_a2_960_differential_module_present'] is True
          assert p['exact_a2_960_differential_runtime_authenticated'] is True
          assert p['real_rf30_rf34_rf39_correction_numerically_executed_here'] is False
          assert p['rf44_post_update_materialized_here'] is False
          assert p['cartesian_delta_u_materialized_here'] is False
          assert p['heldout_complete_ns_residual_assessed_here'] is False
          assert p['residual_reduction_claimed'] is False
          assert p['pde_validated'] is False
          assert p['final_normalized_momentum_gate'] == 1.0e-3
          assert p['final_normalized_divergence_gate'] == 1.0e-5
          assert p['residual_defined_free_forcing_allowed'] is False
          if not p['exact_a2_1080_composite_module_present']:
              assert p['full_exact_backend_rebind_ready_from_this_stack'] is False
              assert p['remaining_blocker']
          PY
