name: kokuno-agent4-pa10-source-phi-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-source-phi-independent-audit-051
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-source-phi-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-source-phi-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_axis_domain.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_phi_ball.py \
            src/openai_ns_reconstruction/kokuno_agent4_pa10_source_phi_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_phi_ball.py \
            tests/test_constrained_kokuno_agent4_pa10_source_phi_audit.py
      - name: Generate exact-head independent receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_agent4_pa10_source_phi_audit \
            --output artifacts/kokuno_agent4/pa10_source_phi_audit/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_source_phi_audit/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          assert payload['source_phi_ball_independent_preflight_passed'] is True
          assert payload['failed_guards'] == []
          assert all(payload['guards'].values())
          assert all(payload['mutation'].values())
          truth = payload['truth_boundary']
          assert truth['source_axis_domain_independent_A4_admission_required_separately'] is True
          assert truth['source_mixed_Y_Phi_Y_radius_one_ball_bound_machine_bound'] is False
          assert truth['source_mixed_Y_u_Y_radius_one_ball_bound_machine_bound'] is False
          assert truth['source_R1_R2_machine_bound'] is False
          assert truth['source_operator_M_K_machine_bound'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['formal_full_domain_pde_gate_assessed'] is False
          assert truth['pde_validated'] is False
          gates = payload['frozen_protocol']['final_project_gates_unchanged']
          assert gates['normalized_momentum_max'] == 1.0e-3
          assert gates['normalized_momentum_L2'] == 1.0e-3
          assert gates['divergence_max'] == 1.0e-5
          assert gates['divergence_L2'] == 1.0e-5
          print('receipt_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('chi=', payload['independent_chi'])
          print('inverse=', payload['independent_inverse_and_ball'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-source-phi-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_source_phi_audit/report.json
