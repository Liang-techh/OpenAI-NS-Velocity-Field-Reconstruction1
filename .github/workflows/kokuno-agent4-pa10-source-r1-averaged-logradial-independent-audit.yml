name: kokuno-agent4-pa10-source-r1-averaged-logradial-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-r1-averaged-logradial-independent-audit-062
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_r1_averaged_logradial_ordinary_slot.py"
      - "src/openai_ns_reconstruction/kokuno_pa10_source_r1_averaged_logradial_independent_audit.py"
      - "tests/test_constrained_kokuno_pa10_source_r1_averaged_logradial_ordinary_slot.py"
      - "tests/test_constrained_kokuno_pa10_source_r1_averaged_logradial_independent_audit.py"
      - ".github/workflows/kokuno-agent4-pa10-source-r1-averaged-logradial-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-source-r1-averaged-logradial-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-r1-averaged-logradial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact head
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_averaged_logradial_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_averaged_logradial_independent_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_r1_averaged_logradial_ordinary_slot.py \
            tests/test_constrained_kokuno_pa10_source_r1_averaged_logradial_independent_audit.py
      - name: Generate exact-head Agent-4 receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_r1_averaged_logradial_independent_audit \
            --output artifacts/kokuno_agent4/pa10_source_r1_averaged_logradial_independent_audit_v1/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path(
              'artifacts/kokuno_agent4/'
              'pa10_source_r1_averaged_logradial_independent_audit_v1/report.json'
          )
          payload = json.loads(path.read_text())
          expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected
          payload['exact_head'] = actual

          assert payload['agent1_pr'] == 733
          assert payload['agent1_exact_head'] == 'e2333474234e0f509d6cfab04b94b01f5a952b04'
          assert payload['failed_guards'] == []
          assert payload[
              'source_R1_averaged_logradial_ordinary_slot_independent_preflight_passed'
          ] is True

          ratios = payload['public_over_independent_ratios']
          assert min(ratios.values()) >= 1.0
          assert max(ratios.values()) <= 1.01
          assert all(payload['negative_controls'].values())

          offgrid = payload['fresh_offgrid_eta_stress']
          assert offgrid['fresh_random_offgrid_points'] == 8192
          assert offgrid['finite'] is True
          assert offgrid['dominated'] is True
          assert offgrid['axis_nontrivial'] is True

          identity = payload['manufactured_averaging_identity_stress']
          assert identity['cases'] == 512
          assert identity['identity_passed'] is True
          assert identity['wrong_sign_mutation_detected'] is True
          assert identity['nontrivial'] is True

          truth = payload['truth_boundary']
          assert truth[
              'source_R1_averaged_logradial_ordinary_slot_independently_audited'
          ] is True
          assert truth[
              'source_R1_Wstar_logradial_ordinary_slot_independent_audit_pending'
          ] is True
          assert truth['all_R1_ordinary_slots_independently_audited'] is False
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['pde_validated'] is False

          gates = payload['immutable_project_gates']
          assert gates['normalized_momentum_max'] == 1e-3
          assert gates['normalized_momentum_L2'] == 1e-3
          assert gates['divergence_max'] == 1e-5
          assert gates['divergence_L2'] == 1e-5
          assert gates['free_residual_defined_forcing_allowed'] is False

          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('ratios=', ratios)
          print('negative_controls=', payload['negative_controls'])
          print('identity_stress=', identity)
          print('offgrid_stress=', offgrid)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-source-r1-averaged-logradial-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_source_r1_averaged_logradial_independent_audit_v1/report.json
          if-no-files-found: error
