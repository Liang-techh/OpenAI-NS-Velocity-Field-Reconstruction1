name: kokuno-agent3-numpy2-reference-inverse-repair

on:
  push:
    branches:
      - codex/kokuno-a3-numpy2-reference-inverse-repair-058
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_typed_mean_reference_inverse.py"
      - "tests/test_kokuno_typed_mean_reference_inverse.py"
      - ".github/workflows/kokuno-agent3-numpy2-reference-inverse-repair.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-numpy2-reference-inverse-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent3-reference-inverse-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Record exact checked-out head
        run: |
          git rev-parse HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Compile repaired Agent-3 correction chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_typed_mean_reference_inverse.py
          src/openai_ns_reconstruction/kokuno_typed_mean_amplitude_differential.py
          src/openai_ns_reconstruction/kokuno_typed_mean_velocity_correction_handoff.py
      - name: Run focused warnings-as-errors regressions
        run: >-
          python -m pytest -q -W error
          tests/test_kokuno_typed_mean_reference_inverse.py
          tests/test_kokuno_typed_mean_amplitude_differential.py
          tests/test_constrained_kokuno_typed_mean_velocity_correction_handoff.py
      - name: Emit repaired reference-inverse receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_typed_mean_reference_inverse
          --output artifacts/kokuno_agent3_numpy2_reference_inverse_repair_v1.json
      - name: Verify repair and truth boundary
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          p = Path('artifacts/kokuno_agent3_numpy2_reference_inverse_repair_v1.json')
          r = json.loads(p.read_text())
          inv = r['analytic_regression']['evaluation']['signed_reference_inverse']
          assert len(inv['rhs']) == 49
          assert len(inv['delta_y']) == 49
          assert all(len(row) == 2 for row in inv['rhs'])
          assert all(len(row) == 2 for row in inv['delta_y'])
          assert inv['delta_y_vector_rms'] > 0.0
          assert abs(inv['minimum_abs_determinant'] - 12.0) <= 2e-14
          assert abs(inv['maximum_condition_number'] - 1.5) <= 2e-14
          assert inv['reconstruction_closure_max_abs'] <= 1e-14
          b = r['truth_boundary']
          assert b['caller_supplied_inverse_rhs_allowed'] is False
          assert b['public_velocity_correction_materialized'] is False
          assert b['real_candidate_finite_correction_cycle_run'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed'] is False
          assert b['pde_validated'] is False
          meta = {
              'schema': 'kokuno-a3-numpy2-reference-inverse-repair-v1',
              'exact_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'parent_agent3_pr': 717,
              'parent_agent3_head': 'dd7edcc13fc16e59e4d53d5e4e36646c0c827526',
              'failed_upstream_pr': 703,
              'failed_upstream_run': 35468271608,
              'failure_classification': 'NumPy>=2 stacked-vector RHS API shape mismatch; not a scientific guard failure',
              'old_solve': 'np.linalg.solve(matrices, target)',
              'new_solve': 'np.linalg.solve(matrices, target[..., np.newaxis])[..., 0]',
              'matrix_formula_changed': False,
              'rhs_changed': False,
              'forcing_changed': False,
              'scientific_threshold_changed': False,
              'source_certified_full_candidate_inputs_available': False,
              'real_candidate_residual_reduction_claimed': False,
              'pde_validated': False,
          }
          Path('artifacts/kokuno_agent3_numpy2_reference_inverse_repair_meta_v1.json').write_text(
              json.dumps(meta, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-numpy2-reference-inverse-repair-v1
          path: |
            artifacts/kokuno_agent3_numpy2_reference_inverse_repair_v1.json
            artifacts/kokuno_agent3_numpy2_reference_inverse_repair_meta_v1.json
          if-no-files-found: error
      - name: Comment exact-head repair receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_numpy2_reference_inverse_repair_v1.json', 'utf8'));
            const m = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_numpy2_reference_inverse_repair_meta_v1.json', 'utf8'));
            const h = r.analytic_regression.evaluation.signed_reference_inverse;
            const lines = [
              '### Kokuno Agent 3 exact-head NumPy-2 reference-inverse repair',
              '',
              `exact head: \`${m.exact_head}\``,
              `delta_y vector RMS (analytic mechanics only): **${h.delta_y_vector_rms}**`,
              `minimum |det(H_ref)|: **${h.minimum_abs_determinant}**`,
              `maximum cond(H_ref): **${h.maximum_condition_number}**`,
              `reconstruction closure max abs: **${h.reconstruction_closure_max_abs}**`,
              '',
              'This repairs only NumPy >=2 stacked-vector solve semantics. H_ref, DeltaC/epsilon, forcing, thresholds and scientific truth flags are unchanged. No real full-candidate residual reduction or PDE validation is claimed.'
            ];
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: lines.join('\n')});
