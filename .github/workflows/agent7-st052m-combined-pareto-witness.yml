name: agent7-st052m-combined-pareto-witness

on:
  pull_request:
    paths:
      - 'experiments/root_st052/agent7_st052m_combined_pareto_witness.py'
      - 'experiments/root_st052/test_agent7_st052m_combined_pareto_witness.py'
      - '.github/workflows/agent7-st052m-combined-pareto-witness.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  combined-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Focused contract tests
        run: python -m pytest -q -W error experiments/root_st052/test_agent7_st052m_combined_pareto_witness.py
      - name: Execute preregistered nonlinear one-point verification
        run: |
          mkdir -p outputs/agent7-st052m-combined-pareto-witness
          python experiments/root_st052/agent7_st052m_combined_pareto_witness.py \
            --out outputs/agent7-st052m-combined-pareto-witness/report.json
      - name: Verify frozen contract and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-combined-pareto-witness/report.json').read_text())
          assert r['prereg_issue']==651
          assert r['sources']['first_order_cone']['pr']==642
          assert r['sources']['first_order_cone']['head']=='f523c221847e1a587ec9af4ec053f6f864ce90c4'
          assert r['frozen_witness']['swirl_a']==0.065899695471146
          assert r['frozen_witness']['shoulder_b']==-1.0
          assert r['frozen_witness']['shoulder_lambda']==-0.02
          assert r['frozen_witness']['parameter_grid_scan_performed'] is False
          assert r['frozen_witness']['optimization_performed'] is False
          assert r['nonlinear_pareto_rule']['tolerance']==5e-5
          assert r['canonical_velocity_changed'] is False
          assert r['saved_velocity_changed'] is False
          assert r['new_spatial_basis_added'] is False
          assert r['new_temporal_basis_added'] is False
          assert r['held_out_pde_residual_evaluated'] is False
          assert r['visual_correspondence_verified'] is False
          assert r['pde_validated'] is False
          print('verified=',r['combined_child_target_free_pareto_verified'])
          print('witness=',r['frozen_witness'])
          print('increments=',r['nonlinear_oriented_desirability_increments_vs_linear'])
          print('pareto=',r['nonlinear_pareto_rule'])
          print('midtime_morphology=',r['midtime_morphology_relative_to_control'])
          print('paths=',r['path_relative_to_control'])
          print('late_morphology=',r['late_morphology_relative_to_control_descriptive_only'])
          print('structure=',r['structure_preflight'])
          print('energy=',r['midpoint_energy'])
          print('routing=',r['routing'])
          PY
      - name: Publish compact numerical receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/agent7-combined-witness-receipt.md
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-combined-pareto-witness/report.json').read_text())
          print('<!-- agent7-st052m-combined-pareto-witness-receipt -->')
          print('**Agent 7 numerical receipt (issue #651; exact one-point combined-child verification):**')
          print()
          print(f"- nonlinear target-free Pareto verified: `{r['combined_child_target_free_pareto_verified']}`")
          print(f"- frozen witness: `{r['frozen_witness']}`")
          print(f"- desirability increments vs #587: `{r['nonlinear_oriented_desirability_increments_vs_linear']}`")
          print(f"- Pareto rule: `{r['nonlinear_pareto_rule']}`")
          print(f"- midpoint morphology vs control: `{r['midtime_morphology_relative_to_control']}`")
          print(f"- material paths vs control: `{r['path_relative_to_control']}`")
          print(f"- descriptive late morphology vs control: `{r['late_morphology_relative_to_control_descriptive_only']}`")
          print(f"- structure: `{r['structure_preflight']}`")
          print(f"- midpoint energy: `{r['midpoint_energy']}`")
          print(f"- routing: {r['routing']}")
          print()
          print('Truth boundary: exact nonlinear expression-capacity / morphology-trajectory evidence only. No canonical/saved velocity mutation, parameter scan, image-derived target, pressure/forcing rebuild, held-out PDE receipt, visual-correspondence verification, PDE validation, exact-field claim, or blow-up proof.')
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/agent7-combined-witness-receipt.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-st052m-combined-pareto-witness
          path: outputs/agent7-st052m-combined-pareto-witness/
          if-no-files-found: error

# Witness, operators, tolerance and no-retuning rule were frozen in issue #651 before evaluation.
