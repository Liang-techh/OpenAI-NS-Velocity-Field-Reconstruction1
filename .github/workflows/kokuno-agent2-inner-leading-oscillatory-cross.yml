name: kokuno-agent2-inner-leading-oscillatory-cross

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_cross_advection.py'
      - 'tests/test_constrained_kokuno_public_inner_leading_oscillatory_cross_advection.py'
      - '.github/workflows/kokuno-agent2-inner-leading-oscillatory-cross.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_inner_leading_oscillatory_cross_advection.py

      - name: Fetch exact Agent-1 inner Cartesian head
        run: |
          git fetch origin 0666fff748d7c2659774b0aacba70042d045aab5
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-803" 0666fff748d7c2659774b0aacba70042d045aab5
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-803" rev-parse HEAD)" = "0666fff748d7c2659774b0aacba70042d045aab5"

      - name: Exact A1 inner-field plus A2 oscillation cross receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-803
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_cross_advection import (
              AGENT1_HEAD,
              AGENT1_PR,
              DIRECTIONAL_FD4_STEPS,
              INNER_LEADING_FD4_STEP,
              OSCILLATORY_FD6_STEP,
              directional_fd4_cross_advection,
              evaluate_inner_leading_oscillatory_cross_advection,
              public_contract,
          )

          a1 = Path(os.environ["A1_WORKTREE"])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_velocity import KokunoPA10CartesianCenterVelocity
          field = KokunoPA10CartesianCenterVelocity()
          for line in sys.stdin:
              request = json.loads(line)
              op = request["op"]
              if op == "meta":
                  result = {
                      "field_sha256": field.field_sha256,
                      "source_X_interval": list(field.source_X_interval),
                      "time_interval": list(field.time_interval),
                  }
              elif op == "forward":
                  out = field.cartesian_from_similarity(
                      np.asarray(request["X"], dtype=float),
                      np.asarray(request["eta"], dtype=float),
                      np.asarray(request["t"], dtype=float),
                      np.asarray(request["theta"], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ("x","y","z","t","X","eta")}
              elif op == "velocity":
                  out = field.velocity(
                      np.asarray(request["x"], dtype=float),
                      np.asarray(request["y"], dtype=float),
                      np.asarray(request["z"], dtype=float),
                      np.asarray(request["t"], dtype=float),
                  )
                  result = {"velocity": np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f"unknown op {op}")
              print(json.dumps(result, sort_keys=True), flush=True)
          '''

          env = os.environ.copy()
          env["PYTHONPATH"] = str(a1 / "src")
          proc = subprocess.Popen(
              [sys.executable, "-u", "-c", server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(",", ":")) + "\n")
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError("Agent-1 backend exited: " + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1Backend:
              def velocity(self, x, y, z, t):
                  x, y, z, t = np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float)
                  )
                  out = ask({"op":"velocity", "x":x.tolist(), "y":y.tolist(), "z":z.tolist(), "t":t.tolist()})
                  return np.asarray(out["velocity"], dtype=float)

          meta = ask({"op":"meta"})
          if meta["source_X_interval"][1] < 0.39:
              raise RuntimeError("unexpected Agent-1 inner X domain")
          if meta["time_interval"] != [0.25, 0.75]:
              raise RuntimeError("unexpected Agent-1 time interval")

          X = np.asarray([0.18,0.21,0.24,0.27,0.30,0.33,0.19,0.22,0.25,0.28,0.31,0.34], dtype=float)
          eta = np.asarray([-0.56,-0.43,-0.29,-0.12,0.09,0.25,0.41,0.55,-0.49,-0.21,0.18,0.47], dtype=float)
          t = np.asarray([0.46,0.46,0.48,0.48,0.50,0.50,0.52,0.52,0.54,0.54,0.50,0.50], dtype=float)
          theta = np.asarray([0.17,0.71,1.24,1.89,2.41,2.96,-2.72,-2.11,-1.56,-0.93,-0.37,0.44], dtype=float)
          forward = ask({"op":"forward", "X":X.tolist(), "eta":eta.tolist(), "t":t.tolist(), "theta":theta.tolist()})
          x = np.asarray(forward["x"], dtype=float)
          y = np.asarray(forward["y"], dtype=float)
          z = np.asarray(forward["z"], dtype=float)
          tt = np.asarray(forward["t"], dtype=float)

          backend = ExactAgent1Backend()
          production = evaluate_inner_leading_oscillatory_cross_advection(
              backend, x, y, z, tt,
              inner_leading_spatial_step=INNER_LEADING_FD4_STEP,
              oscillatory_spatial_step=OSCILLATORY_FD6_STEP,
          )

          direct = [
              directional_fd4_cross_advection(backend, x, y, z, tt, directional_step=h)
              for h in DIRECTIONAL_FD4_STEPS
          ]
          reference = np.asarray(production.cross_advection, dtype=float)

          def vrms(a):
              a = np.asarray(a, dtype=float)
              return float(np.sqrt(np.mean(np.sum(a*a, axis=-1))))

          def relative_rms(a, b):
              return vrms(np.asarray(a)-np.asarray(b)) / max(vrms(a), np.finfo(float).tiny)

          def relative_max(a, b):
              a = np.asarray(a, dtype=float); b = np.asarray(b, dtype=float)
              return float(np.max(np.linalg.norm(a-b,axis=-1)) / max(np.max(np.linalg.norm(a,axis=-1)), np.finfo(float).tiny))

          successive_coarse = vrms(direct[0] - direct[1])
          successive_fine = vrms(direct[1] - direct[2])
          refinement = successive_coarse / max(successive_fine, np.finfo(float).tiny)
          finest_rms = relative_rms(reference, direct[-1])
          finest_max = relative_max(reference, direct[-1])
          composite_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_velocity
              - production.inner_leading_velocity
              - production.oscillatory_velocity
          )))
          term_closure = float(np.max(np.abs(
              production.cross_advection
              - production.inner_advects_oscillation
              - production.oscillation_advects_inner
          )))

          failed = []
          if refinement < 6.0: failed.append("directional_fd4_refinement")
          if finest_rms > 5.0e-3: failed.append("finest_relative_rms")
          if finest_max > 1.0e-2: failed.append("finest_relative_sampled_max")
          if vrms(reference) < 1.0e-10: failed.append("cross_advection_nontrivial")
          if vrms(production.inner_plus_oscillatory_velocity) < 1.0e-8: failed.append("composite_velocity_nontrivial")
          if composite_closure > 1.0e-14: failed.append("composite_velocity_closure")
          if term_closure > 1.0e-13: failed.append("cross_term_closure")
          contract = public_contract()
          if contract["forbidden_public_inputs_present"]: failed.append("forbidden_public_inputs")
          truth = contract["truth_boundary"]
          required_false = [
              "agent1_exact_head_ci_assumed_passed",
              "agent4_inner_field_independent_admission_assumed",
              "inner_leading_is_final_corrected_fixed_point",
              "global_leading_velocity_materialized",
              "outer_join_materialized",
              "matched_pressure_included",
              "restricted_forcing_included",
              "agent3_mean_radial_chain_reimplemented",
              "complete_kokuno_candidate_assembled",
              "heldout_ns_residual_assessed",
              "residual_reduction_claimed",
              "paper_exact",
              "pde_validated",
          ]
          if any(truth[name] for name in required_false): failed.append("truth_boundary_promotion")

          receipt = {
              "schema": "kokuno-a2-inner-leading-oscillatory-cross-receipt-v1",
              "agent1_pr": AGENT1_PR,
              "agent1_head": AGENT1_HEAD,
              "agent1_field_sha256": meta["field_sha256"],
              "sample_count": int(x.size),
              "sample_times": sorted({float(v) for v in tt}),
              "source_X_range": [float(np.min(X)), float(np.max(X))],
              "inner_leading_fd4_step": INNER_LEADING_FD4_STEP,
              "oscillatory_fd6_step": OSCILLATORY_FD6_STEP,
              "directional_fd4_steps": list(DIRECTIONAL_FD4_STEPS),
              "directional_successive_refinement_ratio": refinement,
              "finest_directional_relative_rms": finest_rms,
              "finest_directional_relative_sampled_max": finest_max,
              "cross_advection_rms": vrms(reference),
              "inner_plus_oscillatory_velocity_rms": vrms(production.inner_plus_oscillatory_velocity),
              "composite_velocity_closure_abs_max": composite_closure,
              "cross_term_closure_abs_max": term_closure,
              "failed_guards": failed,
              "truth_boundary": truth,
          }
          Path("artifacts/kokuno_agent2_inner_leading_oscillatory_cross_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None:
              proc.stdin.close()
          proc.terminate()
          proc.wait(timeout=10)
          if failed:
              raise SystemExit("failed guards: " + ", ".join(failed))
          PY

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-inner-leading-oscillatory-cross-v1
          path: artifacts/kokuno_agent2_inner_leading_oscillatory_cross_receipt.json
          if-no-files-found: error
