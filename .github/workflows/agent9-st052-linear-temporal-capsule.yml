name: agent9-st052-linear-temporal-capsule

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/st052_linear_temporal_capsule.py'
      - 'tests/test_st052_linear_temporal_capsule.py'
      - 'scripts/verify_st052_linear_temporal_capsule.py'
      - '.github/workflows/agent9-st052-linear-temporal-capsule.yml'
  push:
    branches:
      - 'agent9/st052-linear-temporal-capsule-069'
      - 'codex/cr001-constraints'
    paths:
      - 'src/openai_ns_reconstruction/st052_linear_temporal_capsule.py'
      - 'tests/test_st052_linear_temporal_capsule.py'
      - 'scripts/verify_st052_linear_temporal_capsule.py'
      - '.github/workflows/agent9-st052-linear-temporal-capsule.yml'

permissions:
  contents: read

jobs:
  exact-source-whole-child-capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: src
    steps:
      - name: Checkout Agent 9 branch
        uses: actions/checkout@v4

      - name: Checkout exact ST052-M source
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: b3b8bfdbe1077f9ec967d158602951997d81e17d
          path: source-st052

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen-source runtime and tests
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'

      - name: Focused checksum and truth-boundary tests
        run: python -m pytest -q -W error tests/test_st052_linear_temporal_capsule.py

      - name: Materialize exact ST052-M parent with expected scientific rejection
        shell: bash
        run: |
          mkdir -p outputs
          set +e
          (
            cd source-st052
            python experiments/root_st052/replay_st052.py \
              --out ../outputs/ST052-M-parent \
              --seed 9175291 \
              --validate
          )
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/ST052-M-parent')
          r=json.loads((p/'validation.json').read_text())
          assert r['pde_validated'] is False
          assert r['all_numeric_gates_pass'] is False
          assert r['gates']['momentum_max'] is False
          assert r['gates']['momentum_L2'] is False
          print('Exact parent replay retained expected momentum rejection.')
          PY

      - name: Build, reload, and compare whole temporal child
        run: |
          python scripts/verify_st052_linear_temporal_capsule.py \
            --source-root source-st052 \
            --parent-dir outputs/ST052-M-parent \
            --out outputs \
            --report outputs/ST052-M-linear-temporal-child-v1/agent9_receipt.json \
            | tee outputs/whole_child_receipt.txt
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/ST052-M-linear-temporal-child-v1/agent9_receipt.json').read_text())
          assert r['task_id']=='CR-A9-069'
          assert r['parity']['passed'] is True
          assert r['parity']['max_component_error'] <= 5e-12
          assert r['parent_scientific_receipt']['pde_validated'] is False
          assert r['parent_scientific_receipt']['transferred_to_temporal_child'] is False
          assert r['truth_boundary']['visualization_ready'] is False
          assert r['truth_boundary']['pde_validated'] is False
          print('whole_candidate_identity_sha256=',r['whole_candidate_identity_sha256'])
          print('max_component_error=',r['parity']['max_component_error'])
          PY

      - name: Upload whole-child capsule and exact receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST052-M-linear-temporal-whole-candidate-capsule
          path: |
            outputs/ST052-M-linear-temporal-child-v1/
            outputs/whole_child_receipt.txt
          if-no-files-found: error
