name: agent7-st052m-compensated-visual-fingerprint
on:
  pull_request:
    paths:
      - 'experiments/root_st052/agent7_st052m_compensated_visual_fingerprint.py'
      - 'experiments/root_st052/test_agent7_st052m_compensated_visual_fingerprint.py'
      - '.github/workflows/agent7-st052m-compensated-visual-fingerprint.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  compensated-visual-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Focused contract tests
        run: python -m pytest -q -W error experiments/root_st052/test_agent7_st052m_compensated_visual_fingerprint.py
      - name: Execute preregistered fixed-grid morphology preservation screen
        run: |
          mkdir -p outputs/agent7-st052m-compensated-visual-fingerprint
          python experiments/root_st052/agent7_st052m_compensated_visual_fingerprint.py \
            --out outputs/agent7-st052m-compensated-visual-fingerprint/report.json
      - name: Verify frozen identity and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-compensated-visual-fingerprint/report.json').read_text())
          assert r['prereg_issue']==567
          assert r['source_compensated_head']=='39b106ad8cb8df2064cabead3a12682089575e74'
          assert r['source_render_head']=='619e3d2ff8c0231c9aced4ce20216c03d78cdef8'
          assert r['source_path_head']=='196bcc5445039a2b3533128daa5c20cbb151cd58'
          assert r['frozen_transform']['redistribution_gain']==0.05
          assert r['frozen_transform']['taper_tau']==0.05
          assert r['frozen_transform']['taper_window_abs_z_over_2']==[0.5,0.82]
          assert r['frozen_transform']['shoulder_window_abs_z_over_2']==[0.36,0.49]
          assert abs(r['frozen_transform']['beta']-0.08837490297155456)<2e-10
          assert r['frozen_transform']['post_transform_common_scale']==1.0
          assert r['protocol']['grid_levels']==[25,33]
          assert r['protocol']['parameter_scan_performed'] is False
          assert r['protocol']['image_or_openai_numeric_target_used'] is False
          assert r['protocol']['visual_acceptance_threshold_used'] is False
          assert r['canonical_velocity_changed'] is False
          assert r['saved_velocity_changed'] is False
          assert r['pressure_or_force_changed'] is False
          assert r['held_out_pde_residual_evaluated'] is False
          assert r['material_paths_integrated_this_round'] is False
          assert r['visualization_ready'] is False
          assert r['visual_correspondence_verified'] is False
          assert r['pde_validated'] is False
          print('clean=',r['clean_compensated_visual_fingerprint_preservation'])
          for n in ('25','33'):
              for row in r['levels'][n]:
                  print(n,row['time'],row['relative_compensated_vs_control'],row['compensated_axial_gain_retention_of_taper'])
          PY
      - name: Publish compact numerical receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/agent7-receipt.md
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st052m-compensated-visual-fingerprint/report.json').read_text())
          print('<!-- agent7-st052m-compensated-visual-fingerprint-receipt -->')
          print('**Agent 7 numerical receipt (issue #567; fixed-grid target-free morphology preservation screen):**')
          print()
          print(f"- exact #559 beta replay: `{r['frozen_transform']['beta']}`; common scale `{r['frozen_transform']['post_transform_common_scale']}`")
          print(f"- clean compensated visual-fingerprint preservation: `{r['clean_compensated_visual_fingerprint_preservation']}`")
          for n in ('25','33'):
              print(f'- grid `{n}^3`:')
              for row in r['levels'][n]:
                  q=row['relative_compensated_vs_control']; ret=row['compensated_axial_gain_retention_of_taper']
                  print(f"  - t={row['time']:.2f}: top axial `{100*q['top_axial_rms']:+.4f}%`, top radial `{100*q['top_radial_rms']:+.4f}%`, tip radial `{100*q['tip_radial_rms']:+.4f}%`, central radial `{100*q['central_radial_rms']:+.4f}%`, axial-gain retention `{ret}`")
          print()
          print('Truth boundary: target-free visualization-morphology capacity only. No OpenAI numeric/image target, material-path integration in this round, pressure/forcing refit, held-out PDE promotion, production selection, or exact-field claim.')
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/agent7-receipt.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-st052m-compensated-visual-fingerprint
          path: outputs/agent7-st052m-compensated-visual-fingerprint/
          if-no-files-found: error
# Scientific grids, times, quantile, bands and clean-preservation guards were frozen in issue #567 before evaluation.
