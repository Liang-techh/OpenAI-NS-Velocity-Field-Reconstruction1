name: kokuno-agent2-source-phase-label

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_phase_label.py'
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_phase.py'
      - 'tests/test_constrained_kokuno_source_phase_label.py'
      - 'tests/test_constrained_kokuno_oscillatory_phase.py'
      - '.github/workflows/kokuno-agent2-source-phase-label.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_phase_label.py'
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_phase.py'
      - 'tests/test_constrained_kokuno_source_phase_label.py'
      - 'tests/test_constrained_kokuno_oscillatory_phase.py'
      - '.github/workflows/kokuno-agent2-source-phase-label.yml'

permissions:
  contents: read

jobs:
  source-phase-label:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused source phase-label tests
        run: python -m pytest -q -s -W error tests/test_constrained_kokuno_source_phase_label.py tests/test_constrained_kokuno_oscillatory_phase.py
