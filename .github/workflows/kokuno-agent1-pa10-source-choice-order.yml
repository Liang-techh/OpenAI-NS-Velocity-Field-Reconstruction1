name: kokuno-agent1-pa10-source-choice-order

on:
  push:
    branches:
      - codex/kokuno-a1-source-choice-order-pa10-guard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-source-choice-order-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  pa10-source-choice-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile guard
        run: python -m compileall -q src/openai_ns_reconstruction/kokuno_pa10_source_choice_order_guard.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_coupled_c_appendix_b_normalization.py \
            tests/test_constrained_kokuno_pa10_source_choice_order_guard.py
      - name: Generate source-order receipt
        run: |
          python -m openai_ns_reconstruction.kokuno_pa10_source_choice_order_guard \
            --log-c-factor 32 \
            --output artifacts/kokuno_agent1/pa10_source_choice_order/report.json
      - name: Validate source choice-order truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/kokuno_agent1/pa10_source_choice_order/report.json").read_text()
          )
          truth = report["truth_boundary"]
          selected = report["selected_coupled_candidate"]
          order = report["source_choice_order"]

          assert order.index("B_k_and_T_sh") < order.index("C_and_X_R")
          assert truth["source_B_k_fixed_before_C"] is True
          assert truth["source_T_sh_fixed_before_C"] is True
          assert truth["source_ell_i_C_cancellation_executable"] is True
          assert truth["C_oversize_may_discharge_source_B0_or_T_sh"] is False
          assert selected["autonomous_coupled_C_pointwise_screen_passed"] is True
          assert selected["autonomous_pointwise_strict_margin"] > 0.0
          assert selected["source_choice_order_allows_C_to_reparameterize_upstream_phi"] is False
          assert selected["source_choice_order_allows_C_to_discharge_B0_or_T_sh"] is False
          assert selected["source_B0_dependencies_machine_bound"] is False
          assert selected["source_B0_analytic_bound_proved"] is False
          assert selected["source_T_sh_lower_bound_verified"] is False
          assert selected["selected_pa16_handoff_allowed"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False

          print("guard_sha256=", report["guard_sha256"])
          print("source_choice_order=", order)
          print("autonomous_pointwise_pass=", selected["autonomous_coupled_C_pointwise_screen_passed"])
          print("autonomous_pointwise_ell_i=", selected["autonomous_pointwise_ell_i"])
          print("autonomous_pointwise_margin=", selected["autonomous_pointwise_strict_margin"])
          print("source_pa16_handoff_allowed=", selected["selected_pa16_handoff_allowed"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-source-choice-order-v1
          path: artifacts/kokuno_agent1/pa10_source_choice_order/report.json
