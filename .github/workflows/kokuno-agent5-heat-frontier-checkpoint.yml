name: kokuno-agent5-heat-frontier-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_heat_frontier_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_independent_heat_repair.py'
      - 'src/openai_ns_reconstruction/kokuno_heat_discrepancy_repair.py'
      - 'tests/test_constrained_kokuno_heat_frontier_checkpoint.py'
      - 'tests/test_constrained_kokuno_independent_heat_repair.py'
      - 'tests/test_constrained_kokuno_heat_discrepancy_repair.py'
      - '.github/workflows/kokuno-agent5-heat-frontier-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-1/4/5 frontier tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_heat_frontier_checkpoint.py
          tests/test_constrained_kokuno_independent_heat_repair.py
          tests/test_constrained_kokuno_heat_discrepancy_repair.py
      - name: Generate heat-frontier bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_heat_frontier_checkpoint
          --output-dir artifacts/kokuno_agent5/heat_frontier_checkpoint_v8
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/heat_frontier_checkpoint_v8/heat_frontier_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-heat-frontier-checkpoint-v8
          path: artifacts/kokuno_agent5/heat_frontier_checkpoint_v8
