name: kokuno-agent4-candidate-mass-derivative-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_candidate_mass_derivative_independent_audit.py"
      - "tests/test_constrained_kokuno_candidate_mass_derivative_independent_audit.py"
      - ".github/workflows/kokuno-agent4-candidate-mass-derivative-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile independent validator
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_candidate_mass_derivative_independent_audit.py
      - name: Run parent and independent focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_candidate_mass_bound_phase_curl.py
          tests/test_constrained_kokuno_candidate_mass_derivative_independent_audit.py
      - name: Generate frozen independent receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_candidate_mass_derivative_independent_audit
          --output outputs/kokuno_agent4_candidate_mass_derivative_independent_audit.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-candidate-mass-derivative-independent-audit-v1
          path: outputs/kokuno_agent4_candidate_mass_derivative_independent_audit.json
          if-no-files-found: error
