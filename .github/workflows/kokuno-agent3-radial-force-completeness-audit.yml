name: kokuno-agent3-radial-force-completeness-audit

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_radial_force_completeness_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_leading_core_series.py'
      - 'tests/test_constrained_kokuno_radial_force_completeness_audit.py'
      - '.github/workflows/kokuno-agent3-radial-force-completeness-audit.yml'

permissions:
  contents: read

jobs:
  radial-force-completeness-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_radial_force_completeness_audit.py
          tests/test_constrained_kokuno_radial_stress.py
          tests/test_constrained_kokuno_mean_defect.py
      - name: Measure real radial force completeness
        run: >-
          python -m openai_ns_reconstruction.kokuno_radial_force_completeness_audit
          --output artifacts/kokuno_agent3/radial_force_completeness_audit_report.json
      - name: Show report
        run: cat artifacts/kokuno_agent3/radial_force_completeness_audit_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-radial-force-completeness-audit
          path: artifacts/kokuno_agent3/radial_force_completeness_audit_report.json
