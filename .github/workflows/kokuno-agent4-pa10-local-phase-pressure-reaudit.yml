name: kokuno-agent4-pa10-local-phase-pressure-reaudit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-local-phase-pressure-reaudit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-local-phase-pressure-reaudit-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  independent-pressure-reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile independent validator
        run: python -m compileall -q src/openai_ns_reconstruction/kokuno_agent4_pa10_local_phase_pressure_reaudit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_local_phase_pressure_repair.py \
            tests/test_constrained_kokuno_agent4_pa10_local_phase_pressure_reaudit.py
      - name: Generate independent scientific receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_agent4_pa10_local_phase_pressure_reaudit \
            --output artifacts/kokuno_agent4/pa10_local_phase_pressure_reaudit/report.json
      - name: Validate immutable truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(
              "artifacts/kokuno_agent4/pa10_local_phase_pressure_reaudit/report.json"
          ).read_text())
          assert payload["frozen_protocol"]["final_project_gates_unchanged"] == {
              "divergence_L2": 1e-5,
              "divergence_max": 1e-5,
              "normalized_momentum_L2": 1e-3,
              "normalized_momentum_max": 1e-3,
          }
          truth = payload["truth_boundary"]
          assert truth["source_pressure_radius_one_ball_bound_assessed"] is False
          assert truth["global_pressure_matched"] is False
          assert truth["global_leading_profile_reconstructed"] is False
          assert truth["full_same_cycle_requested_stress_materialized"] is False
          assert truth["public_velocity_correction_materialized"] is False
          assert truth["leading_only_ns_residual_assessed"] is False
          assert truth["leading_plus_oscillatory_ns_residual_assessed"] is False
          assert truth["after_correction_ns_residual_assessed"] is False
          assert truth["heldout_ns_momentum_residual_assessed"] is False
          assert truth["formal_full_domain_pde_gate_assessed"] is False
          assert truth["pde_validated"] is False
          print("scientific_preflight_passed=", payload[
              "repaired_public_p_eta_independent_preflight_passed"
          ])
          print("failed_guards=", payload["failed_guards"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-local-phase-pressure-independent-reaudit-v1
          path: artifacts/kokuno_agent4/pa10_local_phase_pressure_reaudit/report.json
