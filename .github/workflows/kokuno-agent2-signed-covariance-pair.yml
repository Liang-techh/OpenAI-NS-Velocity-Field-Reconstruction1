name: kokuno-agent2-signed-covariance-pair

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_source_signed_covariance_pair.py"
      - "tests/test_constrained_kokuno_source_signed_covariance_pair.py"
      - ".github/workflows/kokuno-agent2-signed-covariance-pair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-covariance-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile new source
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_source_signed_covariance_pair.py
      - name: Run focused warnings-as-errors tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_source_signed_covariance_pair.py
