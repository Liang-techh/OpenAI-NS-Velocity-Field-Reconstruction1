name: kokuno-agent2-public-oscillatory-morphology

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_morphology.py"
      - "tests/test_constrained_kokuno_public_oscillatory_morphology.py"
      - ".github/workflows/kokuno-agent2-public-oscillatory-morphology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morphology-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile new source
        run: python -W error -m py_compile src/openai_ns_reconstruction/kokuno_public_oscillatory_morphology.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_oscillatory_morphology.py
          tests/test_constrained_kokuno_public_z_pullback_velocity.py
          tests/test_constrained_kokuno_public_carrier_resolved_velocity.py
          tests/test_constrained_kokuno_public_candidate_velocity.py
      - name: Generate target-free three-resolution morphology receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_public_oscillatory_morphology
          --output artifacts/kokuno_agent2_public_oscillatory_morphology_v1.json
      - name: Upload morphology receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-public-oscillatory-morphology-v1
          path: artifacts/kokuno_agent2_public_oscillatory_morphology_v1.json
