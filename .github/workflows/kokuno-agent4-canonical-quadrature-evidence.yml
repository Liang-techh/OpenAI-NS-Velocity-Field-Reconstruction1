name: kokuno-agent4-canonical-quadrature-evidence

on:
  push:
    branches:
      - codex/kokuno-a4-canonical-quadrature-evidence-082
  pull_request:
    branches:
      - codex/kokuno-a4-blackbox-full-ns-validator-contract-081

jobs:
  canonical-quadrature-evidence-firewall:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run parent and evidence-bound Agent-4 tests
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_a4_blackbox_full_ns_validator.py \
            tests/test_constrained_kokuno_a4_canonical_quadrature_evidence.py

      - name: Materialize fail-closed quadrature evidence contract receipt
        run: |
          python - <<'PY'
          import inspect
          import json
          from pathlib import Path
          from openai_ns_reconstruction import kokuno_a4_canonical_quadrature_evidence as q

          contract = q.public_contract()
          signature = inspect.signature(q.validate_complete_candidate_with_canonical_quadrature)
          assert "quadrature_ladder_assessed" not in signature.parameters
          assert contract["quadrature_orders_per_axis"] == [24, 48, 96]
          assert contract["derivative_steps"] == [0.02, 0.01, 0.005]
          assert contract["frozen_gates"]["momentum_volume_l2"] == 1e-3
          assert contract["frozen_gates"]["divergence_volume_l2"] == 1e-5
          assert contract["bare_quadrature_ladder_assessed_parameter_present"] is False
          assert contract["caller_sample_weights_are_canonical_quadrature"] is False
          assert contract["typed_canonical_quadrature_evidence_required_for_pde_promotion"] is True
          assert contract["current_ineligibility"]["complete_blackbox_candidate_available"] is False
          assert contract["current_ineligibility"]["canonical_quadrature_evidence_available"] is False
          assert contract["truth_boundary"]["real_canonical_quadrature_run_completed"] is False
          assert contract["truth_boundary"]["pde_validated"] is False

          out = Path("artifacts/kokuno_a4_canonical_quadrature_evidence_contract.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps(
                  {
                      "contract": contract,
                      "scientific_result": "not_run_current_candidate_ineligible",
                      "bare_boolean_promotion_blocked": True,
                      "real_canonical_quadrature_receipt": None,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence contract receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-canonical-quadrature-evidence-contract
          path: artifacts/kokuno_a4_canonical_quadrature_evidence_contract.json
          if-no-files-found: error
