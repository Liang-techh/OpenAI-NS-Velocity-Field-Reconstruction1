name: kokuno-agent3-typed-mean-finite-head-debt

on:
  push:
    branches:
      - codex/kokuno-a3-typed-mean-debt-053
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py"
      - "src/openai_ns_reconstruction/kokuno_autonomous_oscillatory_mean_debt.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_finite_head_debt.py"
      - "tests/test_kokuno_typed_mean_radial_stress.py"
      - "tests/test_kokuno_typed_mean_finite_head_debt.py"
      - ".github/workflows/kokuno-agent3-typed-mean-finite-head-debt.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-typed-mean-finite-head-debt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typed-mean-finite-head-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile typed actual-defect to finite-head chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py
          src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py
          src/openai_ns_reconstruction/kokuno_autonomous_oscillatory_mean_debt.py
          src/openai_ns_reconstruction/kokuno_typed_mean_finite_head_debt.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_kokuno_typed_mean_radial_stress.py
          tests/test_kokuno_typed_mean_finite_head_debt.py
      - name: Emit deterministic typed finite-head mean-debt receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_typed_mean_finite_head_debt
          --output artifacts/kokuno_agent3_typed_mean_finite_head_debt_v1.json
      - name: Check no-surrogate debt handoff and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/kokuno_agent3_typed_mean_finite_head_debt_v1.json').read_text())
          assert r['schema'] == 'kokuno-a3-typed-mean-finite-head-debt-v1'
          assert r['provenance']['parent_agent3_pr'] == 677
          assert r['provenance']['parent_agent3_head'] == '56024553b981833a283f98648c8599011d6f38ab'
          q = r['analytic_regression']
          assert abs(q['autonomous_missing_weight'] - 0.28410624176179694) <= 5e-15
          assert abs(q['debt_to_requested_stress_rms_ratio'] - q['autonomous_missing_weight']) <= 2e-15
          d = q['evaluation']['finite_head_mean_debt']
          assert d['requested_stress_rms'] > 0.0
          assert d['debt_rms'] > 0.0
          assert d['identity_closure_max_abs'] <= 1e-14
          f = q['evaluation']['autonomous_factor']
          assert f['profile_is_repository_autonomous'] is True
          assert f['formal_theorem_machine_bump_identity_claimed'] is False
          assert f['formal_missing_weight_equality_claimed'] is False
          b = r['truth_boundary']
          assert b['raw_same_cycle_providers_required'] is True
          assert b['caller_supplied_precomputed_defect_allowed'] is False
          assert b['caller_supplied_mean_source_allowed'] is False
          assert b['caller_supplied_stress_allowed'] is False
          assert b['caller_supplied_finite_head_factor_allowed'] is False
          assert b['forbidden_public_parameters_absent'] is True
          assert b['typed_actual_stress_fed_directly_to_frozen_finite_head_factor'] is True
          assert b['typed_actual_state_finite_head_debt_executable'] is True
          assert b['formal_theorem_machine_bump_identity_claimed'] is False
          assert b['formal_missing_weight_materialized'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['full_same_cycle_composite_requested_stress_materialized'] is False
          assert b['candidate_finite_head_mean_debt_materialized'] is False
          assert b['signed_mean_inverse_input_ready'] is False
          assert b['public_velocity_correction_materialized'] is False
          assert b['real_candidate_finite_correction_cycle_run'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed'] is False
          assert b['pde_validated'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-typed-mean-finite-head-debt-v1
          path: artifacts/kokuno_agent3_typed_mean_finite_head_debt_v1.json
          if-no-files-found: error
      - name: Comment exact typed debt receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_typed_mean_finite_head_debt_v1.json', 'utf8'));
            const q = r.analytic_regression;
            const d = q.evaluation.finite_head_mean_debt;
            const lines = [
              '### Kokuno Agent 3 exact-head typed actual-mean -> finite-head debt seam',
              '',
              `frozen autonomous finite-head weight: **${q.autonomous_missing_weight}**`,
              `requested-stress vector RMS: **${d.requested_stress_rms}**`,
              `finite-head debt vector RMS: **${d.debt_rms}**`,
              `debt/stress RMS ratio: **${q.debt_to_requested_stress_rms_ratio}**`,
              `scalar-weight identity closure max abs: **${d.identity_closure_max_abs}**`,
              '',
              'This receipt recomputes a nonzero actual defect from raw same-cycle providers with fixed f=0, passes it through the existing typed mean/radial-stress seam, and applies the frozen repository-autonomous #514/#586 finite-head factor. It is not the formal theorem-machine missingWeight, not a real full Kokuno composite correction, not a held-out normalized NS residual reduction, and not a blow-up proof.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
