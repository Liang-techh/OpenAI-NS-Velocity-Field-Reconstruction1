name: kokuno-agent5-numeric-prerequisites-routing

on:
  push:
    branches:
      - codex/kokuno-a5-numeric-prerequisites-routing-035
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_numeric_prerequisites_routing_checkpoint.py"
      - "tests/test_constrained_kokuno_numeric_prerequisites_routing_checkpoint.py"
      - ".github/workflows/kokuno-agent5-numeric-prerequisites-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-numeric-prerequisites-routing-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  numeric-prerequisites-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent-5 checkpoint
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_numeric_prerequisites_routing_checkpoint.py
      - name: Focused warnings-as-errors regressions
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_audited_geometry_leading_routing_checkpoint.py \
            tests/test_constrained_kokuno_numeric_prerequisites_routing_checkpoint.py
      - name: Generate deterministic v35 checkpoint
        run: |
          python -m openai_ns_reconstruction.kokuno_numeric_prerequisites_routing_checkpoint \
            --output artifacts/kokuno_agent5/numeric_prerequisites_routing_checkpoint_v35.json
      - name: Validate frozen truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/kokuno_agent5/numeric_prerequisites_routing_checkpoint_v35.json")
          report = json.loads(path.read_text())
          state = report["states"]
          a1 = report["upstream"]["agent1_pa10_screen_sibling"]
          a2 = report["upstream"]["agent2_signed_mass_sibling"]
          a3 = report["upstream"]["agent3_autonomous_mean_sibling"]

          assert state["leading_pa10_required_band_executable"] is True
          assert state["candidate_signed_h_sigma_mass_executable"] is True
          assert state["autonomous_finite_head_mean_factor_executable"] is True
          assert state["same_cycle_requested_stress_materialized"] is False
          assert state["leading_ready"] is False
          assert state["oscillatory_ready"] is False
          assert state["correction_ready"] is False
          assert state["candidate_artifact_instantiated"] is False
          assert state["formal_full_domain_pde_gate_assessed"] is False
          assert state["pde_validated"] is False

          assert a1["selected_realization_excluded"] is True
          assert a1["passing_pointwise_screen_is_source_T_sh_certificate"] is False
          assert a2["candidate_h_sigma_numerically_materializable"] is True
          assert a2["actual_source_pulse_samples_recovered"] is False
          assert a2["public_provenance_labelled_xyz_t_oscillatory_velocity_ready"] is False
          assert a3["autonomous_missing_weight"] == 0.28410624176179694
          assert a3["theorem_missing_weight_materialized"] is False
          assert a3["requested_stress_actual_state_values_materialized"] is False
          assert a3["finite_correction_cycle_rerun_allowed"] is False

          assert report["formal_gates"]["held_out_normalized_momentum_max"] == 1.0e-3
          assert report["formal_gates"]["held_out_normalized_momentum_l2"] == 1.0e-3
          assert report["formal_gates"]["held_out_divergence_max"] == 1.0e-5
          assert report["baseline_vs_kokuno"]["kokuno_current_comparable_full_domain_receipt"] is None
          print("checkpoint_sha256=", report["checkpoint_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-numeric-prerequisites-routing-checkpoint-v35
          path: artifacts/kokuno_agent5/numeric_prerequisites_routing_checkpoint_v35.json
