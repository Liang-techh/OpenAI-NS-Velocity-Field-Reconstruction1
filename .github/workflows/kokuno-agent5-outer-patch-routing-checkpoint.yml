name: kokuno-agent5-outer-patch-routing-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_outer_patch_routing_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_outer_patch_independent_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_outer_reserved_patch_schedule.py'
      - 'src/openai_ns_reconstruction/kokuno_heat_v2_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_outer_patch_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_outer_patch_independent_audit.py'
      - 'tests/test_constrained_kokuno_outer_reserved_patch_schedule.py'
      - '.github/workflows/kokuno-agent5-outer-patch-routing-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-1/4/5 outer-patch routing tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_outer_patch_routing_checkpoint.py
          tests/test_constrained_kokuno_outer_patch_independent_audit.py
          tests/test_constrained_kokuno_outer_reserved_patch_schedule.py
      - name: Generate outer-patch routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_outer_patch_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/outer_patch_routing_checkpoint_v11
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/outer_patch_routing_checkpoint_v11/outer_patch_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-outer-patch-routing-checkpoint-v11
          path: artifacts/kokuno_agent5/outer_patch_routing_checkpoint_v11
