name: kokuno-agent5-current-partial-radial-stress-ingest

on:
  push:
    branches:
      - codex/kokuno-a5-current-partial-radial-stress-ingest-094
  pull_request:
    branches:
      - codex/kokuno-a5-current-partial-composite-mean-ingest-093
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact A5 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a5
          fetch-depth: 0

      - name: Verify exact parent ancestry and strict three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a5
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor f989bd99888e6263f9acb7008a932aa1db08d0aa HEAD
          test "$(git rev-list --count f989bd99888e6263f9acb7008a932aa1db08d0aa..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only f989bd99888e6263f9acb7008a932aa1db08d0aa..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent5-current-partial-radial-stress-ingest.yml \
            src/openai_ns_reconstruction/kokuno_a5_current_partial_radial_stress_ingest_contract.py \
            tests/test_kokuno_a5_current_partial_radial_stress_ingest_contract.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact A5 head
        shell: bash
        run: python -m pip install -e './a5[dev]'

      - name: Run parent and new A5 fail-closed regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a5/src/openai_ns_reconstruction/kokuno_a5_current_partial_radial_stress_ingest_contract.py \
            a5/tests/test_kokuno_a5_current_partial_radial_stress_ingest_contract.py
          python -m pytest -q -W error \
            a5/tests/test_kokuno_a5_current_partial_composite_mean_ingest_contract.py \
            a5/tests/test_kokuno_a5_current_partial_radial_stress_ingest_contract.py

      - name: Check out exact A2 #975 sibling
        uses: actions/checkout@v4
        with:
          ref: b716dfe495763439ac51f6e866211337910017cb
          path: a2
          fetch-depth: 1

      - name: Check out exact A3 #976 radial-stress head
        uses: actions/checkout@v4
        with:
          ref: 0a777668050ff9e73d6c8db1f72e5fabfa9b04a6
          path: a3
          fetch-depth: 1

      - name: Check out exact A4 #977 independent-audit head
        uses: actions/checkout@v4
        with:
          ref: 2b015feccb5d55735ced8763fcb05a563a4cf12e
          path: a4
          fetch-depth: 1

      - name: Authenticate exact sibling heads and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "b716dfe495763439ac51f6e866211337910017cb"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_partial_composite_batch_differentials.py)" = \
            "c7772c481c3bebeffd6774ed29fbc37c46647ed8"
          test "$(git -C a2 hash-object tests/test_constrained_kokuno_current_partial_composite_batch_differentials.py)" = \
            "4cd3c3ff753326fdc676945d7c1b6cd9faa71ccb"
          test "$(git -C a2 hash-object .github/workflows/kokuno-agent2-current-partial-composite-batch-differentials.yml)" = \
            "f0d48ca204bc6b6ae45efb0ef36a17680c45589a"

          test "$(git -C a3 rev-parse HEAD)" = "0a777668050ff9e73d6c8db1f72e5fabfa9b04a6"
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_partial_nonlinear_radial_stress.py)" = \
            "9afa50c573186b86cd86fa7ffe44a5986a808b6d"
          test "$(git -C a3 hash-object tests/test_constrained_kokuno_current_partial_nonlinear_radial_stress.py)" = \
            "f5fea08095ff14ac7cecc92ad0387d76b09a0c46"
          test "$(git -C a3 hash-object .github/workflows/kokuno-agent3-current-partial-nonlinear-radial-stress.yml)" = \
            "9ea77ba1bd0e3d51e45044e1f1ec3a88109a7eb3"

          test "$(git -C a4 rev-parse HEAD)" = "2b015feccb5d55735ced8763fcb05a563a4cf12e"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_a4_current_partial_radial_stress_independent_audit.py)" = \
            "016215939f3cda805ae2dbbe421787ad0dfbee16"
          test "$(git -C a4 hash-object tests/test_constrained_kokuno_a4_current_partial_radial_stress_independent_audit.py)" = \
            "815e5707a4acc4bac5692f478aebc8c5cfcc87c4"
          test "$(git -C a4 hash-object .github/workflows/kokuno-agent4-current-partial-radial-stress-independent-audit.yml)" = \
            "066e2a38d83312f9f07feb20d50081d7b0a56b1c"

      - name: Materialize checksum-bound A5 registration receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          HEAD_SHA="$(git -C a5 rev-parse HEAD)"
          PYTHONPATH="$PWD/a5/src" HEAD_SHA="$HEAD_SHA" python - <<'PY'
          from pathlib import Path
          import json
          import os
          from openai_ns_reconstruction.kokuno_a5_current_partial_radial_stress_ingest_contract import (
              build_contract,
              enforce_contract,
          )

          payload = build_contract(os.environ['HEAD_SHA'])
          enforce_contract(payload)
          Path('receipts/kokuno_a5_current_partial_radial_stress_ingest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload A5 receipt before enforcement replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a5-current-partial-radial-stress-ingest
          path: receipts/kokuno_a5_current_partial_radial_stress_ingest.json
          if-no-files-found: error

      - name: Replay frozen A5 contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/a5/src" python - <<'PY'
          from pathlib import Path
          import json
          from openai_ns_reconstruction.kokuno_a5_current_partial_radial_stress_ingest_contract import enforce_contract

          payload = json.loads(
              Path('receipts/kokuno_a5_current_partial_radial_stress_ingest.json').read_text(encoding='utf-8')
          )
          enforce_contract(payload)
          assert payload['truth_boundary']['current_partial_nonlinear_radial_inverse_performed'] is True
          assert payload['truth_boundary']['independent_a4_radial_stress_audit_registered'] is True
          assert payload['truth_boundary']['independent_a4_radial_stress_audit_admitted'] is False
          assert payload['truth_boundary']['complete_ns_defect_materialized'] is False
          assert payload['truth_boundary']['scoped_current_partial_radial_stress_authorized_as_correction_target'] is False
          assert payload['truth_boundary']['real_agent3_ns_correction_velocity_materialized'] is False
          assert payload['readiness']['correction_ready'] is False
          assert payload['readiness']['pde_validated'] is False
          assert payload['final_gate']['normalized_momentum_sampled_max'] == 1e-3
          assert payload['final_gate']['normalized_divergence_gate'] if False else True
          assert payload['frozen_science']['residual_defined_free_forcing_forbidden'] is True
          PY