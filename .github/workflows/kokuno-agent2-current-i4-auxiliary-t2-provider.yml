name: kokuno-agent2-current-i4-auxiliary-t2-provider

on:
  push:
    branches: [kokuno-agent2/current-i4-aux-t2-provider-111]
  pull_request:
    branches: [agent3/current-i4-rf34-rf39-correction-20260922]
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Verify exact A3 bridge parent and minimal A2 scope
        shell: bash
        run: |
          set -euo pipefail
          base=21b0ade966fda3b7344273c7bff2efe7e7b9a93e
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-list --count "$base"..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only "$base"..HEAD | sort)
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent2-current-i4-auxiliary-t2-provider.yml"
            "src/openai_ns_reconstruction/kokuno_current_i4_auxiliary_t2_provider.py"
            "tests/test_constrained_kokuno_current_i4_auxiliary_t2_provider.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_rf30_auxiliary_t2_haar_bridge.py | git hash-object --stdin)" = 5b20d4945f3aeb177e327e8d6b5709a6726c885a
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_public_z_pullback_velocity.py | git hash-object --stdin)" = 4a3abc1a11f7e054f651dd7bace8ada6d5a6b653

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install branch
        run: python -m pip install -e '.[dev]'

      - name: Focused provider and parent bridge regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_current_i4_auxiliary_t2_provider.py \
            tests/test_constrained_kokuno_current_i4_auxiliary_t2_provider.py
          pytest -q \
            tests/test_constrained_kokuno_rf30_auxiliary_t2_haar_bridge.py \
            tests/test_constrained_kokuno_current_i4_auxiliary_t2_provider.py

      - uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Authenticate corrected 2026-09-09 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = 205a99807302e21a51c5eaf223390c0dfc42bcd0

      - name: Materialize raw auxiliary-T2 provider receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          import numpy as np

          from openai_ns_reconstruction.kokuno_current_i4_auxiliary_t2_provider import truth_boundary
          from openai_ns_reconstruction.kokuno_rf30_auxiliary_t2_haar_bridge import (
              materialize_current_i4_rf30_auxiliary_haar_bridge,
          )

          ns = runpy.run_path("tests/test_constrained_kokuno_current_i4_auxiliary_t2_provider.py")
          backend = ns["_backend"]()
          radius, z, t = ns["_inputs"]()
          provider = ns["bind_current_i4_auxiliary_t2_provider"](backend, radius, z, t)
          chart = provider.chart
          y = np.arange(12, dtype=float) / 12.0
          y1, y2 = np.meshgrid(y, y, indexing="ij")
          raw = provider.sample_auxiliary_wave(
              R=np.asarray(chart.radius_R), Z=chart.Z, T=chart.T, y1=y1, y2=y2
          )
          wave = np.stack((raw.w_r, raw.w_theta, raw.w_z), axis=-1)
          dR = np.stack((raw.dR_w_r, raw.dR_w_theta, raw.dR_w_z), axis=-1)
          dZ = np.stack((raw.dZ_w_r, raw.dZ_w_theta, raw.dZ_w_z), axis=-1)
          bridge = materialize_current_i4_rf30_auxiliary_haar_bridge(
              backend, provider, radius, z, t
          )
          receipt = {
              "task": "K2-OSC-111",
              "provider_semantic_sha256": provider.semantic_sha256,
              "provider_source_blob_sha1": provider.metadata.source_blob_sha1,
              "candidate_semantic_sha256": provider.metadata.candidate_semantic_sha256,
              "oscillatory_runtime_sha256": provider.metadata.oscillatory_runtime_sha256,
              "leading_semantic_sha256": provider.metadata.leading_semantic_sha256,
              "raw_wave_rms": float(np.sqrt(np.mean(wave * wave))),
              "dR_wave_rms": float(np.sqrt(np.mean(dR * dR))),
              "dZ_wave_rms": float(np.sqrt(np.mean(dZ * dZ))),
              "torus_order_observation": 12,
              "bridge_torus_orders": list(bridge.torus_orders),
              "bridge_successive_covariance_relative_differences": list(
                  bridge.successive_covariance_relative_differences
              ),
              "provider_checksum_pinned_in_agent3_bridge": bridge.provider_checksum_pinned_for_repository_candidate,
              "rf30_repository_candidate_state_authorized": bridge.rf30_repository_candidate_state_authorized,
              "truth_boundary": truth_boundary(),
          }
          Path("receipts/current_i4_auxiliary_t2_provider.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload raw receipt before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-current-i4-auxiliary-t2-provider
          path: receipts
          if-no-files-found: error

      - name: Enforce provider truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_current_i4_auxiliary_t2_provider import truth_boundary

          receipt = json.loads(Path("receipts/current_i4_auxiliary_t2_provider.json").read_text())
          assert receipt["raw_wave_rms"] > 1e-12
          assert receipt["dR_wave_rms"] >= 0.0
          assert receipt["dZ_wave_rms"] >= 0.0
          assert receipt["provider_checksum_pinned_in_agent3_bridge"] is False
          assert receipt["rf30_repository_candidate_state_authorized"] is False
          c = truth_boundary()
          assert c["same_identity_current_i4_candidate_bound"] is True
          assert c["actual_sign_resolved_complete_curl_runtime_reused"] is True
          assert c["raw_auxiliary_t2_wave_materialized"] is True
          assert c["preaveraged_covariance_supplied"] is False
          assert c["physical_theta_mean_relabelled_as_auxiliary_haar"] is False
          assert c["auxiliary_sign_phase_lift_repository_autonomous"] is True
          assert c["source_exact_auxiliary_t2_mode_family_recovered"] is False
          assert c["source_exact_auxiliary_phase_assignment_recovered"] is False
          assert c["agent3_rf30_defect_materialized_here"] is False
          assert c["agent3_mean_correction_materialized_here"] is False
          assert c["heldout_ns_residual_assessed"] is False
          assert c["residual_reduction_claimed"] is False
          assert c["paper_exact"] is False
          assert c["pde_validated"] is False
          assert c["forbidden_scientific_controls_exposed"] is False
          PY
