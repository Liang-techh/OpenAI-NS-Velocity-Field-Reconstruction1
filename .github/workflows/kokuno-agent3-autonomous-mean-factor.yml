name: kokuno-agent3-autonomous-mean-factor

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_autonomous_mean_factor.py'
      - 'src/openai_ns_reconstruction/kokuno_actual_mean_factor_dependency.py'
      - 'tests/test_constrained_kokuno_autonomous_mean_factor.py'
      - 'tests/test_constrained_kokuno_actual_mean_factor_dependency.py'
      - '.github/workflows/kokuno-agent3-autonomous-mean-factor.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_autonomous_mean_factor.py'
      - 'src/openai_ns_reconstruction/kokuno_actual_mean_factor_dependency.py'
      - 'tests/test_constrained_kokuno_autonomous_mean_factor.py'
      - 'tests/test_constrained_kokuno_actual_mean_factor_dependency.py'
      - '.github/workflows/kokuno-agent3-autonomous-mean-factor.yml'

permissions:
  contents: read

jobs:
  autonomous-mean-factor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-3 factor tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_actual_mean_factor_dependency.py
          tests/test_constrained_kokuno_autonomous_mean_factor.py
      - name: Compile autonomous factor module
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_autonomous_mean_factor.py
      - name: Deterministic autonomous factor receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_autonomous_mean_factor
          --prepared-n 5
          --band 5
          --coordinate-q 1.3
          --output artifacts/kokuno_agent3/autonomous_mean_factor_receipt.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-autonomous-mean-factor
          path: artifacts/kokuno_agent3/autonomous_mean_factor_receipt.json
