name: kokuno-agent1-rescaled-tsh-certificate

on:
  push:
    branches:
      - codex/kokuno-a1-rescaled-tsh-certificate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-rescaled-tsh-certificate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  rescaled-tsh-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate shared-C PA10 receipt
        run: |
          python -m openai_ns_reconstruction.kokuno_rescaled_inner_join_tsh_certificate \
            --eta-nodes 5 \
            --axis-quadrature-points 64 \
            --output artifacts/kokuno_agent1/rescaled_tsh_certificate/report.json
      - name: Validate fail-closed receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/kokuno_agent1/rescaled_tsh_certificate/report.json").read_text()
          )
          selected = report["selected_B0"]
          geometry = report["geometry"]
          truth = report["truth_boundary"]

          assert selected["disjoint_holdout_within_envelope"] is True
          assert geometry["separation_geometry_feasible"] is False
          assert geometry["separation_geometry_margin"] < 0.0
          assert report["selected_pa16_handoff_allowed"] is False
          assert truth["source_T_sh_lower_bound_verified"] is False
          assert truth["inner_to_outer_join_completed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False

          print("construction_max_abs_ell_i=", selected["construction_max_abs_ell_i"])
          print("holdout_max_abs_ell_i=", selected["holdout_max_abs_ell_i"])
          print("selected_numerical_B0_envelope=", selected["selected_numerical_B0_envelope"])
          print(
              "T_sh_lower_bound_from_selected_numerical_B0=",
              geometry["T_sh_lower_bound_from_selected_numerical_B0"],
          )
          print("selected_log_C=", geometry["selected_log_C"])
          print("selected_log_X_R=", geometry["selected_log_X_R"])
          print(
              "max_T_sh_for_current_shared_C_scale=",
              geometry["max_T_sh_for_current_shared_C_scale"],
          )
          print("selected_log_x_sep=", geometry["selected_log_x_sep"])
          print("separation_geometry_margin=", geometry["separation_geometry_margin"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-rescaled-tsh-certificate-v1
          path: artifacts/kokuno_agent1/rescaled_tsh_certificate/report.json
