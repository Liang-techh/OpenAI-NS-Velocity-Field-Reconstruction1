name: kokuno-agent1-pa10-source-pair-mk

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-source-pair-mk-064
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_pair_mk.py"
      - "tests/test_constrained_kokuno_pa10_source_pair_mk.py"
      - ".github/workflows/kokuno-agent1-pa10-source-pair-mk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-source-pair-mk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-pair-mk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        run: echo "exact_head=$(git rev-parse HEAD)"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_phi_ball.py \
            src/openai_ns_reconstruction/kokuno_pa10_post_j_remainder_bridge.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_derivative_ordinary_slots.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_du_phi_eta_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_pair_mk.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_derivative_ordinary_slots.py \
            tests/test_constrained_kokuno_pa10_source_r1_du_phi_eta_ordinary_slot.py \
            tests/test_constrained_kokuno_pa10_source_pair_mk.py
      - name: Generate exact-head Agent-1 receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_pair_mk \
            --output artifacts/kokuno_agent1/pa10_source_pair_mk_v1/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent1/pa10_source_pair_mk_v1/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)

          cert = payload['operator_certificate']
          assert cert['R1_input_is_already_post_J2'] is True
          assert cert['R2_input_is_already_post_J1'] is True
          assert cert['J2_reapplied_in_this_increment'] is False
          assert cert['J1_reapplied_in_this_increment'] is False
          assert cert['pair_factor_one_half_applied_exactly_once'] is True
          assert cert['bridge_post_J_replay_exact_match'] is True
          assert cert['diagnostic_unit_ordinary_fixture_used'] is False

          pair = payload['source_compatible_pair_MK_agent1_self_certificate']
          for value in pair.values():
              assert math.isfinite(float(value))
              assert float(value) > 0.0
          replay = payload['post_J_bridge_arithmetic_replay']
          assert pair['M_phi_component'] == replay['diagnostic_M_phi_component']
          assert pair['M_u_component'] == replay['diagnostic_M_u_component']
          assert pair['M_pair_max'] == replay['diagnostic_M_pair_max']
          assert pair['K_phi_component'] == replay['diagnostic_K_phi_component']
          assert pair['K_u_component'] == replay['diagnostic_K_u_component']
          assert pair['K_pair_max'] == replay['diagnostic_K_pair_max']

          progress = payload['progress']
          assert progress['R1_ordinary_post_J2_source_bound_count'] == 11
          assert progress['R2_ordinary_post_J1_source_bound_count'] == 11
          assert progress['pair_M_agent1_self_certificate_materialized'] is True
          assert progress['pair_K_agent1_self_certificate_materialized'] is True
          assert progress['M_K_independent_admission_still_open'] is True
          assert progress['contraction_not_promoted'] is True
          assert progress['fixed_point_not_promoted'] is True

          truth = payload['truth_boundary']
          assert truth[
              'source_compatible_pair_M_agent1_self_certificate_machine_bound'
          ] is True
          assert truth[
              'source_compatible_pair_K_agent1_self_certificate_machine_bound'
          ] is True
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['source_contraction_invariant_ball_machine_verified'] is False
          assert truth['source_fixed_point_distance_machine_bound'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False

          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('pair_MK=', pair)
          print('progress=', progress)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-source-pair-mk-v1
          path: artifacts/kokuno_agent1/pa10_source_pair_mk_v1/report.json
          if-no-files-found: error
