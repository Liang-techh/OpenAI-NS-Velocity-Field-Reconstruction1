name: kokuno-agent3-bounded-coordinate-covariance

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_bounded_coordinate_covariance.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'src/openai_ns_reconstruction/kokuno_family_bounded_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_family_covariance_cross_terms.py'
      - 'tests/test_constrained_kokuno_bounded_coordinate_covariance.py'
      - 'tests/test_constrained_kokuno_family_bounded_inverse.py'
      - '.github/workflows/kokuno-agent3-bounded-coordinate-covariance.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_bounded_coordinate_covariance.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'src/openai_ns_reconstruction/kokuno_family_bounded_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_family_covariance_cross_terms.py'
      - 'tests/test_constrained_kokuno_bounded_coordinate_covariance.py'
      - 'tests/test_constrained_kokuno_family_bounded_inverse.py'
      - '.github/workflows/kokuno-agent3-bounded-coordinate-covariance.yml'

permissions:
  contents: read

jobs:
  bounded-coordinate-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused bounded-coordinate covariance tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_bounded_coordinate_covariance.py
          tests/test_constrained_kokuno_family_bounded_inverse.py
      - name: Real-defect bounded-coordinate report
        run: >-
          python -m openai_ns_reconstruction.kokuno_bounded_coordinate_covariance
          --output artifacts/kokuno_agent3/bounded_coordinate_covariance_report.json
          --target-output artifacts/kokuno_agent3/bounded_coordinate_covariance_target.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-bounded-coordinate-covariance
          path: |
            artifacts/kokuno_agent3/bounded_coordinate_covariance_report.json
            artifacts/kokuno_agent3/bounded_coordinate_covariance_target.json
