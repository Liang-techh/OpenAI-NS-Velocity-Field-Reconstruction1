name: kokuno-agent2-inner-leading-oscillatory-time

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_time_derivative.py'
      - 'tests/test_constrained_kokuno_public_inner_leading_oscillatory_time_derivative.py'
      - '.github/workflows/kokuno-agent2-inner-leading-oscillatory-time.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_inner_leading_oscillatory_time_derivative.py

      - name: Fetch exact Agent-1 inner velocity-dt head
        run: |
          git fetch origin 6f16e837c3a95a6e54af5c2cb7725d094f667026
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-811" 6f16e837c3a95a6e54af5c2cb7725d094f667026
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-811" rev-parse HEAD)" = "6f16e837c3a95a6e54af5c2cb7725d094f667026"

      - name: Exact A1 inner-dt plus A2 oscillatory-dt receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-811
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_time_derivative import (
              AGENT1_HEAD,
              AGENT1_PR,
              FD4_TIME_STEPS,
              evaluate_inner_leading_oscillatory_time_derivative,
              public_contract,
          )
          from openai_ns_reconstruction.kokuno_public_z_pullback_velocity import velocity_osc

          a1 = Path(os.environ['A1_WORKTREE'])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_velocity_dt import KokunoPA10CartesianCenterVelocityTimeDerivative
          field = KokunoPA10CartesianCenterVelocityTimeDerivative()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'derivative_sha256': field.derivative_sha256,
                      'source_X_interval': list(field.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op == 'velocity':
                  out = field.velocity(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              elif op == 'velocity_dt':
                  out = field.velocity_dt(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''

          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1TimeBackend:
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def velocity(self, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  out = ask({'op':'velocity','x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)
              def velocity_dt(self, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  out = ask({'op':'velocity_dt','x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)

          meta = ask({'op':'meta'})
          if meta['source_X_interval'][1] < 0.39:
              raise RuntimeError('unexpected Agent-1 inner X domain')
          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 time interval')

          X = np.asarray([0.18,0.21,0.24,0.27,0.30,0.33,0.19,0.22,0.25,0.28,0.31,0.34], dtype=float)
          eta = np.asarray([-0.53,-0.39,-0.24,-0.08,0.11,0.27,0.43,0.52,-0.46,-0.19,0.21,0.45], dtype=float)
          t = np.asarray([0.46,0.46,0.48,0.48,0.50,0.50,0.52,0.52,0.54,0.54,0.50,0.50], dtype=float)
          theta = np.asarray([0.23,0.76,1.31,1.83,2.37,2.88,-2.66,-2.03,-1.49,-0.86,-0.31,0.49], dtype=float)
          forward = ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),'t':t.tolist(),'theta':theta.tolist()})
          x = np.asarray(forward['x'], dtype=float)
          y = np.asarray(forward['y'], dtype=float)
          z = np.asarray(forward['z'], dtype=float)
          tt = np.asarray(forward['t'], dtype=float)

          backend = ExactAgent1TimeBackend()
          production = evaluate_inner_leading_oscillatory_time_derivative(backend, x, y, z, tt)

          def direct_total(time):
              return np.asarray(backend.velocity(x,y,z,time), dtype=float) + np.asarray(velocity_osc(x,y,z,time), dtype=float)

          def fd4(step):
              h = float(step)
              return (
                  direct_total(tt - 2*h) - 8.0*direct_total(tt - h)
                  + 8.0*direct_total(tt + h) - direct_total(tt + 2*h)
              ) / (12.0*h)

          numerical = [fd4(h) for h in FD4_TIME_STEPS]
          reference = np.asarray(production.inner_plus_oscillatory_velocity_dt, dtype=float)

          def vrms(a):
              a = np.asarray(a, dtype=float)
              return float(np.sqrt(np.mean(np.sum(a*a, axis=-1))))

          def relative_rms(a,b):
              return vrms(np.asarray(a)-np.asarray(b)) / max(vrms(a), np.finfo(float).tiny)

          def relative_max(a,b):
              a=np.asarray(a,dtype=float); b=np.asarray(b,dtype=float)
              return float(np.max(np.linalg.norm(a-b,axis=-1)) / max(np.max(np.linalg.norm(a,axis=-1)), np.finfo(float).tiny))

          coarse = vrms(numerical[0]-numerical[1])
          fine = vrms(numerical[1]-numerical[2])
          refinement = coarse / max(fine, np.finfo(float).tiny)
          finest_rms = relative_rms(reference, numerical[-1])
          finest_max = relative_max(reference, numerical[-1])
          velocity_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_velocity
              - production.inner_leading_velocity
              - production.oscillatory_velocity
          )))
          dt_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_velocity_dt
              - production.inner_leading_velocity_dt
              - production.oscillatory_velocity_dt
          )))

          failed=[]
          if refinement < 8.0: failed.append('fd4_time_refinement')
          if finest_rms > 2.0e-3: failed.append('finest_relative_rms')
          if finest_max > 5.0e-3: failed.append('finest_relative_sampled_max')
          if vrms(reference) < 1.0e-10: failed.append('composite_dt_nontrivial')
          if vrms(production.inner_plus_oscillatory_velocity) < 1.0e-8: failed.append('composite_velocity_nontrivial')
          if velocity_closure > 1.0e-14: failed.append('velocity_additive_closure')
          if dt_closure > 1.0e-13: failed.append('dt_additive_closure')

          contract=public_contract()
          if contract['forbidden_public_inputs_present']: failed.append('forbidden_public_inputs')
          truth=contract['truth_boundary']
          required_false=(
              'agent1_exact_head_ci_assumed_passed','agent4_inner_field_independent_admission_assumed',
              'inner_leading_is_final_corrected_fixed_point','global_leading_velocity_materialized',
              'outer_join_materialized','matched_pressure_included','restricted_forcing_included',
              'agent3_mean_radial_chain_reimplemented','complete_kokuno_candidate_assembled',
              'heldout_ns_residual_assessed','residual_reduction_claimed','paper_exact','pde_validated',
          )
          if any(truth[k] for k in required_false): failed.append('truth_boundary_promotion')

          receipt={
              'schema':'kokuno-a2-inner-leading-oscillatory-time-receipt-v1',
              'agent1_pr':AGENT1_PR,
              'agent1_head':AGENT1_HEAD,
              'agent1_field_sha256':meta['field_sha256'],
              'agent1_derivative_sha256':meta['derivative_sha256'],
              'sample_count':int(x.size),
              'sample_times':sorted({float(v) for v in tt}),
              'source_X_range':[float(np.min(X)),float(np.max(X))],
              'fd4_time_steps':list(FD4_TIME_STEPS),
              'fd4_successive_refinement_ratio':refinement,
              'finest_fd4_relative_rms':finest_rms,
              'finest_fd4_relative_sampled_max':finest_max,
              'composite_velocity_dt_rms':vrms(reference),
              'composite_velocity_rms':vrms(production.inner_plus_oscillatory_velocity),
              'velocity_additive_closure_abs_max':velocity_closure,
              'dt_additive_closure_abs_max':dt_closure,
              'failed_guards':failed,
              'truth_boundary':truth,
          }
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/kokuno_agent2_inner_leading_oscillatory_time_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True)+'\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None: proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if failed:
              raise SystemExit('failed guards: '+', '.join(failed))
          PY

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-inner-leading-oscillatory-time-v1
          path: artifacts/kokuno_agent2_inner_leading_oscillatory_time_receipt.json
          if-no-files-found: error
