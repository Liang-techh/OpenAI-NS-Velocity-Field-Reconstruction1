name: kokuno-agent4-pa10-cartesian-center-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-cartesian-center-independent-audit-070
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a4_pa10_cartesian_center_independent_audit.py"
      - "tests/test_kokuno_a4_pa10_cartesian_center_independent_audit.py"
      - ".github/workflows/kokuno-agent4-pa10-cartesian-center-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-cartesian-center-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-cartesian-center-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile audited candidate and independent validator
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_velocity.py \
            src/openai_ns_reconstruction/kokuno_a4_pa10_cartesian_center_independent_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_cartesian_center_velocity.py \
            tests/test_kokuno_a4_pa10_cartesian_center_independent_audit.py
      - name: Generate exact-head independent receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_a4_pa10_cartesian_center_independent_audit \
            --output artifacts/kokuno_agent4/pa10_cartesian_center_independent_audit_v1/receipt.json
      - name: Bind exact head and validate fail-closed truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_cartesian_center_independent_audit_v1/receipt.json')
          payload = json.loads(path.read_text())
          assert payload['passed'] is True
          assert payload['failed_guards'] == []
          assert payload['protocol']['fd4_spatial_steps'] == [0.004, 0.002, 0.001]
          assert payload['protocol']['final_project_momentum_gate'] == 1e-3
          assert payload['protocol']['final_project_divergence_gate'] == 1e-5
          assert payload['protocol']['free_residual_defined_forcing_forbidden'] is True
          truth = payload['truth_boundary']
          assert truth['inner_cartesian_center_velocity_independently_audited'] is True
          assert truth['global_cartesian_spacetime_leading_velocity_materialized'] is False
          assert truth['matched_global_pressure_materialized'] is False
          assert truth['complete_restricted_forcing_materialized'] is False
          assert truth['complete_kokuno_composite_velocity'] is False
          assert truth['leading_only_ns_residual_assessed'] is False
          assert truth['leading_plus_oscillatory_ns_residual_assessed'] is False
          assert truth['after_correction_ns_residual_assessed'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['pde_validated'] is False

          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          print('candidate_field_sha256=', payload['candidate']['field_sha256'])
          print('receipt_sha256=', payload['receipt_sha256'])
          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('measurements=', payload['measurements'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-cartesian-center-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_cartesian_center_independent_audit_v1/
          if-no-files-found: error
