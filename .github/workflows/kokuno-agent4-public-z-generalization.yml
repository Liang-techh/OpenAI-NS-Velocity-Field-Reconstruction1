name: kokuno-agent4-public-z-generalization

on:
  push:
    branches:
      - codex/kokuno-a4-public-z-generalization-041
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_z_agent4_generalization.py"
      - "tests/test_constrained_kokuno_public_z_agent4_generalization.py"
      - ".github/workflows/kokuno-agent4-public-z-generalization.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  independent-generalization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile independent validator
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_public_z_agent4_generalization.py
      - name: Run public provider and Agent-4 focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_z_pullback_velocity.py
          tests/test_constrained_kokuno_public_z_agent4_generalization.py
      - name: Generate independent generalization receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_public_z_agent4_generalization
          --output outputs/kokuno_agent4_public_z_generalization.json
      - name: Check immutable truth boundary and print metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/kokuno_agent4_public_z_generalization.json')
          r = json.loads(p.read_text())
          assert r['schema'] == 'kokuno-agent4-public-z-generalization-v1'
          assert r['audited_agent2_head'] == '732800ce4990464b49c8aa32d0dff4580f6684d4'
          assert r['parent_agent4_head'] == '9b0f86012c53fa8e32a19f766dbc150931870425'
          assert r['seed'] == 9173251
          assert r['fd6_steps'] == [0.016, 0.008, 0.004]
          assert r['truth_boundary']['formal_full_domain_pde_gate_assessed'] is False
          assert r['truth_boundary']['heldout_ns_residual_assessed'] is False
          assert r['truth_boundary']['pde_validated'] is False
          print('divergence_rows=', r['divergence']['rows'])
          print('refinement=', r['divergence']['refinement_ratios'])
          print('finest_strata=', r['divergence']['finest_stratum_relative_rms'])
          print('support_exterior=', r['support_exterior'])
          print('heldout_velocity_rms=', r['heldout_velocity_rms'])
          print('parameter_perturbations=', r['parameter_perturbations'])
          print('mutation_relative_rms=', r['divergence']['mutation_relative_rms'])
          print('failed_guards=', r['failed_guards'])
          print('public_z_generalization_passed=', r['public_z_generalization_passed'])
          PY
      - name: Publish exact receipt to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kokuno-a4-public-z-generalization-receipt -->';
            const receipt = fs.readFileSync('outputs/kokuno_agent4_public_z_generalization.json', 'utf8');
            const body = `${marker}\n## Agent 4 exact cross-seed FD6 receipt\n\n\`\`\`json\n${receipt}\`\`\``;
            const issue_number = context.payload.pull_request?.number;
            if (!issue_number) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-public-z-generalization-v1
          path: outputs/kokuno_agent4_public_z_generalization.json
          if-no-files-found: error
