name: kokuno-agent1-pa10-selected-pressure-primitive

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-selected-pressure-primitive
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-selected-pressure-primitive-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  selected-pressure-primitive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile selected pressure primitive
        run: python -m compileall -q src/openai_ns_reconstruction/kokuno_pa10_selected_pressure_primitive.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_operator_primitives.py \
            tests/test_constrained_kokuno_pa10_chi_multiplier.py \
            tests/test_constrained_kokuno_pa10_remainder_ball_bounds.py \
            tests/test_constrained_kokuno_pa10_selected_pressure_primitive.py
      - name: Generate selected pressure primitive receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          from openai_ns_reconstruction.kokuno_pa10_selected_pressure_primitive import (
              KokunoPA10SelectedPressurePrimitive,
          )

          primitive = KokunoPA10SelectedPressurePrimitive(quadrature_points=64)
          envelope = primitive.engineering_envelope(y_count=13, eta_count=25)
          eta0 = primitive.core.phase_stationary_eta
          sample = primitive.evaluate(
              np.asarray([0.0, 1.0, 2.0, 4.1]),
              np.full(4, eta0),
          )
          payload = {
              "candidate": primitive.to_payload(),
              "selected_lambda": primitive.core.rescaling_lambda,
              "phase_stationary_eta": eta0,
              "stationary_sample_p": sample["p"].tolist(),
              "stationary_sample_p_eta": sample["p_eta"].tolist(),
              "engineering_envelope": envelope,
              "truth_boundary": primitive.truth_boundary,
          }
          out = Path("artifacts/kokuno_agent1/pa10_selected_pressure_primitive/report.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print("selected_lambda=", payload["selected_lambda"])
          print("phase_stationary_eta=", eta0)
          for name, value in envelope["engineering_abs_envelope"].items():
              print(f"selected_center_{name}_engineering_envelope=", value)
          print("candidate_sha256=", primitive.sha256)
          PY
      - name: Validate fail-closed scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(
              "artifacts/kokuno_agent1/pa10_selected_pressure_primitive/report.json"
          ).read_text())
          truth = payload["truth_boundary"]
          envelope = payload["engineering_envelope"]
          assert truth["selected_center_pressure_primitive_executable"] is True
          assert truth["selected_center_pressure_eta_derivative_executable"] is True
          assert truth["selected_center_Y_p_Y_executable"] is True
          assert truth["selected_center_Y_Phi_Y_executable"] is True
          assert envelope["continuum_supremum_certified"] is False
          assert envelope["source_radius_one_ball_bound"] is False
          assert truth["source_pressure_radius_one_ball_norm_machine_bound"] is False
          assert truth["source_pressure_radius_one_ball_lipschitz_machine_bound"] is False
          assert truth["source_mixed_Y_Phi_Y_radius_one_ball_bound_machine_bound"] is False
          assert truth["source_operator_constant_M_machine_bound"] is False
          assert truth["source_operator_constant_K_machine_bound"] is False
          assert truth["source_T_sh_lower_bound_verified"] is False
          assert truth["selected_pa16_handoff_allowed"] is False
          assert truth["global_pressure_matched"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-selected-pressure-primitive-v1
          path: artifacts/kokuno_agent1/pa10_selected_pressure_primitive/report.json
