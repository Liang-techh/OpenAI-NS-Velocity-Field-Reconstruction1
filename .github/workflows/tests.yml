name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_legacy_full:
        description: Run the legacy full test and wheel checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slice:
    name: slice-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: coordinates
            path: tests/test_coordinates.py
          - case: velocity
            path: tests/test_velocity.py
          - case: forcing
            path: tests/test_forcing.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test ${{ matrix.case }}
        run: python -m pytest -q -W error "${{ matrix.path }}"

  import-cli:
    name: import-and-cli-help
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Import package
        run: python -c "import openai_ns_reconstruction"
      - name: Check CLI help
        run: ns-reconstruct --help

  constrained:
    name: constrained-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test constrained reconstruction lane
        run: python -m pytest -q -W error tests/test_constrained_*.py
      - name: Report supported Eq45 vorticity revalidation
        run: python -m openai_ns_reconstruction.constrained_eq45_supported_vorticity
      - name: Report supported Eq45 restricted-force projection
        run: python -m openai_ns_reconstruction.constrained_eq45_supported_force_projection | tee supported-force-projection.json
      - name: Upload supported Eq45 restricted-force report
        uses: actions/upload-artifact@v4
        with:
          name: eq45-supported-force-projection-${{ github.sha }}
          path: supported-force-projection.json

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_legacy_full == true }}
    name: full-${{ matrix.python }}-${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: 'numpy<2'
          - python: '3.13'
            numpy: 'numpy>=2,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '${{ matrix.numpy }}' -e '.[dev]' build
      - name: Test full suite and dependencies
        run: |
          python -m pip check
          python -m pytest -q -W error
      - name: Build wheel
        run: python -m build --wheel
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/ns-wheel
          /tmp/ns-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ns-wheel/bin/ns-reconstruct audit
          if /tmp/ns-wheel/bin/ns-reconstruct audit --require-paper-exact; then
            echo 'Incomplete reconstruction incorrectly passed the exact gate'
            exit 1
          else
            code=$?
            test "$code" -eq 2
          fi
          /tmp/ns-wheel/bin/ns-reconstruct demo --output "$GITHUB_WORKSPACE/artifacts"
      - name: Upload numerical diagnostics (not proof certificates)
        uses: actions/upload-artifact@v4
        with:
          name: ns-diagnostics-python-${{ matrix.python }}
          path: artifacts/
