name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_legacy_full:
        description: Run the legacy full test and wheel checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slice:
    name: slice-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: coordinates
            path: tests/test_coordinates.py
          - case: velocity
            path: tests/test_velocity.py
          - case: forcing
            path: tests/test_forcing.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test ${{ matrix.case }}
        run: python -m pytest -q -W error "${{ matrix.path }}"

  import-cli:
    name: import-and-cli-help
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Import package
        run: python -c "import openai_ns_reconstruction"
      - name: Check CLI help
        run: ns-reconstruct --help

  constrained:
    name: constrained-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test constrained reconstruction lane
        run: python -m pytest -q -W error tests/test_constrained_*.py
      - name: Report cubic Phi10 temporal derivative convergence
        run: python -m openai_ns_reconstruction.constrained_eq45_supported_phi10_cubic_temporal_derivative
      - name: Report quartic Phi10 restricted-force cross-check
        run: python -m openai_ns_reconstruction.constrained_eq45_supported_phi10_quartic_force_crosscheck
      - name: Report C2 compact Phi10 restricted-force cross-check
        shell: bash
        run: |
          python -m openai_ns_reconstruction.constrained_eq45_supported_phi10_c2_compact_force_crosscheck --output /tmp/c2-compact-force.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/c2-compact-force.json', encoding='utf-8'))
          fit = r['compact_projection']['fit']
          finest = r['finest_holdout_comparison']
          message = (
              f"a={fit['a']:.12g}; c={fit['c']:.12g}; "
              f"train_rms={fit['before']['rms']:.12g}->{fit['after']['rms']:.12g}; "
              f"finest_zero={finest['compact_zero_force_rms']:.12g}; "
              f"finest_forced={finest['compact_projected_force_rms']:.12g}; "
              f"vs_static_zero={finest['compact_vs_static_zero_force_fractional_change']:.12g}; "
              f"vs_quartic_zero={finest['compact_vs_quartic_zero_force_fractional_change']:.12g}; "
              f"force_reduction={finest['compact_force_reduction_fraction']:.12g}"
          )
          print(f"::notice title=C2 compact force cross-check::{message}")
          PY

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_legacy_full == true }}
    name: full-${{ matrix.python }}-${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: 'numpy<2'
          - python: '3.13'
            numpy: 'numpy>=2,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '${{ matrix.numpy }}' -e '.[dev]' build
      - name: Test full suite and dependencies
        run: |
          python -m pip check
          python -m pytest -q -W error
      - name: Build wheel
        run: python -m build --wheel
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/ns-wheel
          /tmp/ns-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ns-wheel/bin/ns-reconstruct audit
          if /tmp/ns-wheel/bin/ns-reconstruct audit --require-paper-exact; then
            echo 'Incomplete reconstruction incorrectly passed the exact gate'
            exit 1
          else
            code=$?
            test "$code" -eq 2
          fi
          /tmp/ns-wheel/bin/ns-reconstruct demo --output "$GITHUB_WORKSPACE/artifacts"
      - name: Upload numerical diagnostics (not proof certificates)
        uses: actions/upload-artifact@v4
        with:
          name: ns-diagnostics-python-${{ matrix.python }}
          path: artifacts/
