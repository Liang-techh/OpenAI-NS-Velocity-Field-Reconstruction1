name: kokuno-agent2-source-oriented-multiharmonic-diagnostics

on:
  push:
    branches: [kokuno-agent2-oriented-multiharmonic-diagnostics-109]
  pull_request:
    branches: [kokuno-agent2-azimuthal-frame-orientation-108]
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Verify exact A2 parent and minimal scope
        shell: bash
        run: |
          set -euo pipefail
          base=59d3e6d64fcdfeaf145cbee67e68b8a25e89489c
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-list --count "$base"..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only "$base"..HEAD | sort)
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent2-source-oriented-multiharmonic-diagnostics.yml"
            "src/openai_ns_reconstruction/kokuno_source_oriented_multiharmonic_diagnostics.py"
            "tests/test_constrained_kokuno_source_oriented_multiharmonic_diagnostics.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity.py | git hash-object --stdin)" = ca8acae2c3a53b79528cb55f45502443f6ffb2b6
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py | git hash-object --stdin)" = d95265098a9a9eb95ee673fecb3e7b115f2866e6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install branch
        run: python -m pip install -e '.[dev]'

      - name: Focused A2 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_source_oriented_multiharmonic_diagnostics.py \
            tests/test_constrained_kokuno_source_oriented_multiharmonic_diagnostics.py
          pytest -q \
            tests/test_constrained_kokuno_source_pulse_coordinate_support_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_oriented_multiharmonic_diagnostics.py

      - uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Authenticate corrected 2026-09-09 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = 205a99807302e21a51c5eaf223390c0dfc42bcd0

      - name: Materialize oriented three-resolution diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          import numpy as np

          from openai_ns_reconstruction.kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity import (
              KokunoAzimuthalFrameOrientedBoundedMultiHarmonicPhysicalVelocity,
          )
          from openai_ns_reconstruction.kokuno_source_oriented_multiharmonic_diagnostics import (
              CHART_FD_STEPS,
              audit_oriented_multiharmonic_field,
              oriented_multiharmonic_diagnostics_contract,
              public_contract,
          )

          ns = runpy.run_path(
              "tests/test_constrained_kokuno_source_azimuthal_frame_oriented_multiharmonic_velocity.py"
          )
          parent = ns["_parent_field"]()
          field = KokunoAzimuthalFrameOrientedBoundedMultiHarmonicPhysicalVelocity(
              parent, frame_azimuth=0.63
          )
          report = audit_oriented_multiharmonic_field(field)
          contract = oriented_multiharmonic_diagnostics_contract()
          public = public_contract()

          assert [row["chart_step"] for row in report["resolutions"]] == list(CHART_FD_STEPS)
          assert report["velocity_covariance_observation"]["nonzero_oriented_probe_count"] > 0
          assert report["velocity_covariance_observation"]["base_probe_max_abs"] <= 5e-14
          assert report["offgrid_observation"]["velocity_covariance_max_abs"] <= 5e-14
          assert report["support_observation"]["common_axis_core_exact_zero"] is True
          assert report["support_observation"]["outer_spatial_support_exact_zero"] is True
          for row in report["resolutions"]:
              assert all(np.isfinite(float(row[key])) for key in (
                  "reference_divergence_max_abs",
                  "oriented_divergence_max_abs",
                  "divergence_covariance_normalized_rms",
                  "gradient_covariance_relative_rms",
                  "vorticity_covariance_relative_rms",
                  "oriented_vorticity_rms",
                  "oriented_vorticity_max",
              ))
          assert contract["rigid_rotation_vorticity_covariance_numerically_assessed"] is True
          assert contract["complete_ns_residual_assessed"] is False
          assert contract["paper_exact"] is False
          assert contract["pde_validated"] is False
          assert public["forbidden_audit_inputs_present"] == []

          receipt = {
              "task": "K2-OSC-109",
              "field_semantic_sha256": field.semantic_sha256,
              "frame_azimuth": field.frame_azimuth,
              "diagnostic": report,
              "contract": contract,
              "public_contract": public,
          }
          Path("receipts/oriented_multiharmonic_diagnostics.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload raw receipt before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-source-oriented-multiharmonic-diagnostics
          path: receipts
          if-no-files-found: error

      - name: Enforce scientific truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_source_oriented_multiharmonic_diagnostics import (
              oriented_multiharmonic_diagnostics_contract,
              public_contract,
          )
          c = oriented_multiharmonic_diagnostics_contract()
          p = public_contract()
          assert c["oriented_public_velocity_three_resolution_diagnostic_materialized"] is True
          assert c["public_velocity_only_cartesian_derivatives_materialized"] is True
          assert c["rigid_rotation_divergence_covariance_numerically_assessed"] is True
          assert c["rigid_rotation_gradient_covariance_numerically_assessed"] is True
          assert c["rigid_rotation_vorticity_covariance_numerically_assessed"] is True
          assert c["offgrid_rigid_velocity_covariance_assessed"] is True
          assert c["provider_certified_axis_zero_support_checked"] is True
          assert c["provider_certified_outer_spatial_support_checked"] is True
          assert c["analytic_divergence_identity_proved_by_this_increment"] is False
          assert c["source_exact_frame_vectors_recovered"] is False
          assert c["source_exact_orientation_recovered"] is False
          assert c["self_contained_velocity_xyzt_provider"] is False
          assert c["complete_ns_residual_assessed"] is False
          assert c["oscillation_before_after_ns_residual_compared"] is False
          assert c["residual_reduction_claimed"] is False
          assert c["paper_exact"] is False
          assert c["pde_validated"] is False
          assert p["forbidden_audit_inputs_present"] == []
          PY
