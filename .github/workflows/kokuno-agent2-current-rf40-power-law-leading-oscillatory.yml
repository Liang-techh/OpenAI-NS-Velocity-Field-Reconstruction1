name: kokuno-agent2-current-rf40-power-law-leading-oscillatory

on:
  push:
    branches:
      - codex/kokuno-a2-rf40-power-law-composite-087
  pull_request:
    branches:
      - codex/kokuno-a2-rf40-lambda-turn-composite-086
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact A2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a2
          fetch-depth: 0

      - name: Verify exact parent ancestry and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a2
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor e9697cdfe2249e1b8bc2f9241bd16d456c60418f HEAD
          test "$(git rev-list --count e9697cdfe2249e1b8bc2f9241bd16d456c60418f..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only e9697cdfe2249e1b8bc2f9241bd16d456c60418f..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent2-current-rf40-power-law-leading-oscillatory.yml \
            src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py \
            tests/test_constrained_kokuno_current_rf40_power_law_leading_oscillatory_identity.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install A2 test dependencies
        shell: bash
        run: python -m pip install -e './a2[dev]'

      - name: Compile and run A2 scoped contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a2/src/openai_ns_reconstruction/kokuno_current_rf40_power_law_leading_oscillatory_identity.py \
            a2/tests/test_constrained_kokuno_current_rf40_power_law_leading_oscillatory_identity.py
          PYTHONPATH="$PWD/a2/src" python -m pytest -q \
            a2/tests/test_constrained_kokuno_current_rf40_power_law_leading_oscillatory_identity.py

      - name: Check out exact Agent-1 RF40 power-law sibling
        uses: actions/checkout@v4
        with:
          ref: 2c76ebdc41d6c566f43a1305034ba2ff9dce410b
          path: a1
          fetch-depth: 1

      - name: Authenticate and regression-test exact Agent-1 RF40 power-law sibling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a1 rev-parse HEAD)" = "2c76ebdc41d6c566f43a1305034ba2ff9dce410b"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_rf40_power_law.py)" = \
            "36a0183352a2005bd0b5f477594e05a2e4fe3868"
          test "$(git -C a1 hash-object tests/test_kokuno_pa16_current_cartesian_rf40_power_law.py)" = \
            "9c88ab44c3a195b42f6f600b54563491869be64f"
          test "$(git -C a1 hash-object .github/workflows/kokuno-agent1-current-cartesian-rf40-power-law.yml)" = \
            "2f871a63034ca0284761e97cdd014766c9820d94"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_rf40_lambda_turn_leading_oscillatory_identity.py)" = \
            "def2998256b2339115c2400c75b6db6ab58dfe95"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_public_z_pullback_velocity.py)" = \
            "4a3abc1a11f7e054f651dd7bace8ada6d5a6b653"
          PYTHONPATH="$PWD/a1/src" python -m pytest -q \
            a1/tests/test_kokuno_pa16_current_cartesian_rf40_power_law.py

      - name: Materialize exact RF40 power-law identity-bound candidate and receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          PYTHONPATH="$PWD/a1/src" python - <<'PY'
          from pathlib import Path
          import json
          import openai_ns_reconstruction

          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_rf40_power_law import (
              KokunoPA16CurrentCartesianRF40PowerLaw,
          )
          assert KokunoPA16CurrentCartesianRF40PowerLaw.__module__ == (
              "openai_ns_reconstruction.kokuno_pa16_current_cartesian_rf40_power_law"
          )

          a2_pkg = str((Path("a2/src/openai_ns_reconstruction")).resolve())
          openai_ns_reconstruction.__path__.insert(0, a2_pkg)

          import openai_ns_reconstruction.kokuno_current_rf40_power_law_leading_oscillatory_identity as mod

          field = mod.default_field()
          candidate_path = Path("receipts/kokuno_a2_current_rf40_power_law_candidate.json")
          saved = field.save_candidate(candidate_path)
          loaded = mod.CurrentRF40PowerLawLeadingOscillatoryField.load_candidate(candidate_path)
          assert loaded.semantic_sha256 == field.semantic_sha256 == saved["semantic_sha256"]
          assert loaded.oscillatory_runtime_sha256 == field.oscillatory_runtime_sha256
          assert loaded.X_3 == field.X_3
          assert loaded.X_4 == field.X_4
          assert loaded.T_w == field.T_w

          receipt = mod.materialize_rf40_power_law_composite_receipt()
          Path("receipts/kokuno_a2_current_rf40_power_law_composite_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload candidate and receipt before gate enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a2-current-rf40-power-law-leading-oscillatory
          path: |
            receipts/kokuno_a2_current_rf40_power_law_candidate.json
            receipts/kokuno_a2_current_rf40_power_law_composite_receipt.json
          if-no-files-found: error

      - name: Enforce frozen RF40 power-law identity and truth gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/a1/src" python - <<'PY'
          from pathlib import Path
          import copy
          import json
          import openai_ns_reconstruction

          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_rf40_power_law import (
              KokunoPA16CurrentCartesianRF40PowerLaw,
          )
          assert KokunoPA16CurrentCartesianRF40PowerLaw.__module__ == (
              "openai_ns_reconstruction.kokuno_pa16_current_cartesian_rf40_power_law"
          )

          a2_pkg = str((Path("a2/src/openai_ns_reconstruction")).resolve())
          openai_ns_reconstruction.__path__.insert(0, a2_pkg)

          import openai_ns_reconstruction.kokuno_current_rf40_power_law_leading_oscillatory_identity as mod

          receipt = json.loads(
              Path("receipts/kokuno_a2_current_rf40_power_law_composite_receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          mod.enforce_receipt(receipt)

          candidate_path = Path("receipts/kokuno_a2_current_rf40_power_law_candidate.json")
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))

          mutated_osc = copy.deepcopy(candidate)
          osc = mutated_osc["configuration"]["oscillatory_runtime"]
          osc["payload"]["parameters"]["mode_imaginary_ratio"] += 0.125
          osc["payload_sha256"] = mod._identity._sha256(osc["payload"])
          mutated_osc["semantic_sha256"] = mod._identity._sha256(mutated_osc["configuration"])
          p = Path("receipts/mutated_osc_candidate.json")
          p.write_text(json.dumps(mutated_osc, indent=2, sort_keys=True) + "\n")
          try:
              mod.CurrentRF40PowerLawLeadingOscillatoryField.load_candidate(p)
          except ValueError as exc:
              assert "oscillatory runtime" in str(exc)
          else:
              raise AssertionError("rehash-consistent oscillatory runtime mutation was accepted")

          mutated_source = copy.deepcopy(candidate)
          mutated_source["configuration"]["source_provenance"]["corrected_release_date"] = "2099-01-01"
          mutated_source["semantic_sha256"] = mod._identity._sha256(mutated_source["configuration"])
          p = Path("receipts/mutated_source_candidate.json")
          p.write_text(json.dumps(mutated_source, indent=2, sort_keys=True) + "\n")
          try:
              mod.CurrentRF40PowerLawLeadingOscillatoryField.load_candidate(p)
          except ValueError as exc:
              assert "provenance" in str(exc)
          else:
              raise AssertionError("rehash-consistent corrected-source provenance mutation was accepted")

          mutated_parent = copy.deepcopy(candidate)
          mutated_parent["configuration"]["agent1_leading"]["semantic_sha256"] = "a" * 64
          mutated_parent["semantic_sha256"] = mod._identity._sha256(mutated_parent["configuration"])
          p = Path("receipts/mutated_agent1_semantic_candidate.json")
          p.write_text(json.dumps(mutated_parent, indent=2, sort_keys=True) + "\n")
          try:
              mod.CurrentRF40PowerLawLeadingOscillatoryField.load_candidate(p)
          except ValueError as exc:
              assert "semantic identity" in str(exc)
          else:
              raise AssertionError("rehash-consistent Agent-1 semantic mutation was accepted")
          PY
