name: kokuno-agent5-leading-profile-ingest-contract

on:
  push:
    branches:
      - codex/kokuno-a5-leading-profile-ingest-contract-067
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_candidate_artifact_contract.py"
      - "src/openai_ns_reconstruction/kokuno_a5_leading_profile_ingest_contract.py"
      - "tests/test_kokuno_a5_leading_profile_ingest_contract.py"
      - ".github/workflows/kokuno-agent5-leading-profile-ingest-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-leading-profile-ingest-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-leading-profile-ingest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          echo "exact_head=$ACTUAL_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile integration seam
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_a5_candidate_artifact_contract.py \
            src/openai_ns_reconstruction/kokuno_a5_leading_profile_ingest_contract.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_a5_candidate_artifact_contract.py \
            tests/test_kokuno_a5_leading_profile_ingest_contract.py
      - name: Generate exact-head ingest artifact
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python -W error -m openai_ns_reconstruction.kokuno_a5_leading_profile_ingest_contract \
            --exact-head "$HEAD_SHA" \
            --output artifacts/kokuno_agent5/leading_profile_ingest_contract_v1/report.json
      - name: Validate frozen sibling evidence and truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent5/leading_profile_ingest_contract_v1/report.json')
          payload = json.loads(path.read_text())
          exact_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert payload['exact_head'] == exact_head
          assert payload['schema'] == 'kokuno-a5-leading-profile-ingest-contract-v1'
          assert payload['parent_a5'] == {
              'pr': 764,
              'head': '2c91fd48f178fecbd7a151c5767818f805afcc14',
          }
          assert payload['pipeline_stage'] == 'source_profile_ingest'
          assert payload['pipeline_order'][0] == 'source_profile_ingest'

          binding = payload['agent1_profile_binding']
          assert binding['pr'] == 768
          assert binding['head'] == '67f3c2670920bb160a23931ce113b0f05cd1b748'
          assert binding['schema'] == 'kokuno-pa10-leading-axis-profile-contract-v1'
          assert binding['coordinate_contract']['native_similarity_coordinates'] == ['Y', 'eta']
          assert binding['coordinate_contract']['source_Y_interval'] == [0.0, 4.1]
          assert binding['coordinate_contract']['repository_X_identification_asserted'] is False

          evidence = payload['independent_evidence_pin']
          assert evidence['agent1_pr'] == 768
          assert evidence['agent1_dedicated_run'] == 35489353259
          assert evidence['agent1_exact_head_ci_passed'] is False
          assert evidence['agent4_pr'] == 771
          assert evidence['agent4_head'] == '8bc24386b71f9361df851de3d1d2de492003f4a4'
          assert evidence['agent4_independent_audit_passed'] is False

          status = payload['ingest_status']
          assert status['typed_profile_interface_registered'] is True
          assert status['source_profile_ingest_admitted'] is False
          assert status['repository_X_to_source_Y_mapping_resolved'] is False
          assert status['global_leading_velocity_materialized'] is False
          assert status['leading_ready'] is False

          assert payload['stage_state'] == {
              'leading_ready': False,
              'oscillatory_ready': True,
              'correction_ready': False,
              'velocity_export_ready': False,
              'pde_validated': False,
          }
          assert payload['baseline_vs_kokuno']['kokuno_same_protocol_full_candidate_residual_available'] is False
          assert payload['baseline_vs_kokuno']['comparison_performed'] is False
          assert payload['final_project_gates_unchanged'] == {
              'normalized_momentum_max': 1e-3,
              'normalized_momentum_L2': 1e-3,
              'divergence_max': 1e-5,
              'divergence_L2': 1e-5,
          }
          truth = payload['truth_boundary']
          for key in (
              'agent1_queued_ci_laundered_to_pass',
              'agent4_queued_audit_laundered_to_pass',
              'source_native_profile_promoted_to_global_velocity',
              'repository_X_identified_with_source_Y',
              'surrogate_promoted_to_candidate',
              'free_residual_defined_forcing_allowed',
              'threshold_relaxed',
              'kokuno_replay_used_as_final_independent_validation',
              'leading_ready',
              'correction_ready',
              'velocity_export_ready',
              'pde_validated',
          ):
              assert truth[key] is False
          print('artifact_sha256=', hashlib.sha256(path.read_bytes()).hexdigest())
          print('contract_sha256=', payload['contract_sha256'])
          print('exact_head=', exact_head)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-leading-profile-ingest-contract-v1
          path: artifacts/kokuno_agent5/leading_profile_ingest_contract_v1/report.json
          if-no-files-found: error
