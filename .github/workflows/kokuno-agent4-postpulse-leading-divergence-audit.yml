name: kokuno-agent4-postpulse-leading-divergence-audit

on:
  push:
    branches:
      - kokuno-agent4/postpulse-leading-divergence-118
  pull_request:
    branches:
      - codex/kokuno-a1-postpulse-eta-flattening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact A4 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          parent=c5442c11165d7f0976889b826bf58dce38a3d3dd
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-list --count "$parent"..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only "$parent"..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent4-postpulse-leading-divergence-audit.yml \
            src/openai_ns_reconstruction/kokuno_a4_postpulse_eta_flattening_leading_divergence_independent_audit.py \
            tests/test_constrained_kokuno_a4_postpulse_eta_flattening_leading_divergence_independent_audit.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_postpulse_eta_flattening.py)" = \
            "32cbfc00406aa8d47904e2492ad8916730541d28"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact A4 head
        run: python -m pip install -e '.[dev]'

      - name: Run focused software regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a4_postpulse_eta_flattening_leading_divergence_independent_audit.py \
            tests/test_constrained_kokuno_a4_postpulse_eta_flattening_leading_divergence_independent_audit.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_a4_postpulse_eta_flattening_leading_divergence_independent_audit.py

      - name: Materialize save-reloaded candidate and independent receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          from pathlib import Path
          import json
          import traceback
          from openai_ns_reconstruction import (
              kokuno_a4_postpulse_eta_flattening_leading_divergence_independent_audit as m,
          )

          out = Path('receipts')
          field = m.default_field()
          field.save_configuration(out / 'candidate.json')
          try:
              report = m.materialize_receipt()
          except Exception as exc:
              report = {
                  'schema': m.SCHEMA,
                  'task': m.TASK,
                  'upstream_pr': m.UPSTREAM_PR,
                  'upstream_head': m.UPSTREAM_HEAD,
                  'audit_pass': False,
                  'failures': ['materialization_or_audit_error'],
                  'error': f'{type(exc).__name__}: {exc}',
                  'traceback': traceback.format_exc(),
                  'truth_boundary': {
                      'leading_only_ns_residual_assessed': False,
                      'leading_plus_oscillatory_ns_residual_assessed': False,
                      'after_correction_ns_residual_assessed': False,
                      'pde_validated': False,
                  },
              }
          out.joinpath('independent_report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload raw candidate and scientific receipt before enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-postpulse-leading-divergence-audit
          path: receipts/
          if-no-files-found: error

      - name: Enforce preregistered scientific gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from openai_ns_reconstruction.kokuno_a4_postpulse_eta_flattening_leading_divergence_independent_audit import (
              enforce_preregistered_gates,
          )
          report = json.loads(Path('receipts/independent_report.json').read_text(encoding='utf-8'))
          enforce_preregistered_gates(report)
          assert report['truth_boundary']['leading_only_ns_residual_assessed'] is False
          assert report['truth_boundary']['leading_plus_oscillatory_ns_residual_assessed'] is False
          assert report['truth_boundary']['after_correction_ns_residual_assessed'] is False
          assert report['truth_boundary']['pde_validated'] is False
          assert report['gates']['final_project_momentum_gate_unchanged'] == 1e-3
          assert report['gates']['final_project_divergence_gate_unchanged'] == 1e-5
          PY
