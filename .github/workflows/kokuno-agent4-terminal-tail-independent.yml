name: Kokuno Agent4 terminal-tail independent audit

on:
  push:
    branches:
      - agent-kokuno-4/terminal-tail-independent-012
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_terminal_tail_schedule.py'
      - 'src/openai_ns_reconstruction/kokuno_outer_reserved_patch_schedule.py'
      - 'src/openai_ns_reconstruction/kokuno_independent_terminal_tail_audit.py'
      - 'tests/test_constrained_kokuno_terminal_tail_schedule.py'
      - 'tests/test_constrained_kokuno_independent_terminal_tail_audit.py'
      - '.github/workflows/kokuno-agent4-terminal-tail-independent.yml'
  workflow_dispatch:

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run focused independent tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_terminal_tail_schedule.py
          tests/test_constrained_kokuno_independent_terminal_tail_audit.py
      - name: Generate independent report
        run: >-
          python -m openai_ns_reconstruction.kokuno_independent_terminal_tail_audit
          --output artifacts/kokuno_agent4/independent_terminal_tail_audit.json
      - name: Display report
        run: cat artifacts/kokuno_agent4/independent_terminal_tail_audit.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-independent-terminal-tail-audit
          path: artifacts/kokuno_agent4/independent_terminal_tail_audit.json
          if-no-files-found: error
