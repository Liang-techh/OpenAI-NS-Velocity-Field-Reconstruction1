name: kokuno-agent4-inner-leading-oscillatory-full-advection-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-inner-leading-osc-full-advection-independent-audit-073
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_a4_inner_leading_oscillatory_full_advection_independent_audit.py'
      - 'tests/test_constrained_kokuno_a4_inner_leading_oscillatory_full_advection_independent_audit.py'
      - '.github/workflows/kokuno-agent4-inner-leading-oscillatory-full-advection-independent-audit.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_a4_inner_leading_oscillatory_full_advection_independent_audit.py

      - name: Verify exact Agent-2 source blob and fetch exact Agent-1 backend
        run: |
          test "$(git rev-parse HEAD:src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_full_advection.py)" = "e44ccbe993d08951f48cfb5b093ee02ea5642dcf"
          git fetch origin 177190d770e0306e116674c5a2e1cbf977628760
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-829" 177190d770e0306e116674c5a2e1cbf977628760
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-829" rev-parse HEAD)" = "177190d770e0306e116674c5a2e1cbf977628760"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-829" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_self_advection.py)" = "b75f3b08ef3f1853550d8dfdef912980c15287c3"

      - name: Generate independent exact-head receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-829
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_a4_inner_leading_oscillatory_full_advection_independent_audit import (
              AGENT1_SELF_ADVECTION_BLOB,
              AGENT1_SELF_ADVECTION_HEAD,
              AGENT1_SELF_ADVECTION_PR,
              AGENT2_FULL_ADVECTION_BLOB,
              AGENT2_FULL_ADVECTION_HEAD,
              AGENT2_FULL_ADVECTION_PR,
              FD6_STEPS,
              cartesian_fd6_self_advection,
              frozen_gate_failures,
              public_contract,
              relative_rms,
              relative_sampled_max,
              successive_refinement_ratio,
              vector_rms,
          )
          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_full_advection import (
              evaluate_inner_leading_oscillatory_full_advection,
          )
          from openai_ns_reconstruction.kokuno_public_z_pullback_velocity import velocity_osc

          a1 = Path(os.environ['A1_WORKTREE'])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_self_advection import KokunoPA10CartesianCenterSelfAdvection
          field = KokunoPA10CartesianCenterSelfAdvection()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'temporal_derivative_sha256': field.temporal_derivative_sha256,
                      'spatial_derivative_sha256': field.spatial_derivative_sha256,
                      'self_advection_sha256': field.self_advection_sha256,
                      'source_X_interval': list(field.spatial.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op == 'velocity':
                  out = field.velocity(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              elif op == 'self_advection':
                  out = field.self_advection(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''

          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1Backend:
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float),
                      np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float),
                      np.asarray(t, dtype=float),
                  )

              def velocity(self, x, y, z, t):
                  x, y, z, t = self._arrays(x, y, z, t)
                  out = ask({'op':'velocity','x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)

              def self_advection(self, x, y, z, t):
                  x, y, z, t = self._arrays(x, y, z, t)
                  out = ask({'op':'self_advection','x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)

          meta = ask({'op':'meta'})
          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 time interval')
          if float(meta['source_X_interval'][1]) < 0.30:
              raise RuntimeError('unexpected Agent-1 inner X domain')

          # Frozen fresh off-grid protocol.  The samples are generated only from
          # source coordinates and are disjoint from A2 #830's 12 fixed probes.
          rng = np.random.default_rng(9173491)
          n_random = 192
          X = rng.uniform(0.16, 0.30, n_random)
          eta = rng.uniform(-0.30, 0.30, n_random)
          tt = rng.uniform(0.44, 0.56, n_random)
          theta = rng.uniform(-np.pi, np.pi, n_random)

          # Exact-axis and axis-near probes are part of the same immutable audit.
          X = np.concatenate((X, np.asarray([0.0, 0.0, 0.0, 1e-18, 1e-18, 1e-18])))
          eta = np.concatenate((eta, np.asarray([-0.25, 0.0, 0.25, -0.18, 0.0, 0.18])))
          tt = np.concatenate((tt, np.asarray([0.46, 0.50, 0.54, 0.47, 0.51, 0.55])))
          theta = np.concatenate((theta, np.asarray([0.0, 1.0, 2.0, -1.2, 0.7, 2.4])))

          forward = ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),'t':tt.tolist(),'theta':theta.tolist()})
          x = np.asarray(forward['x'], dtype=float)
          y = np.asarray(forward['y'], dtype=float)
          z = np.asarray(forward['z'], dtype=float)
          t = np.asarray(forward['t'], dtype=float)

          backend = ExactAgent1Backend()
          production = evaluate_inner_leading_oscillatory_full_advection(
              backend,
              x, y, z, t,
              inner_leading_spatial_step=1.0e-3,
              oscillatory_spatial_step=1.0e-3,
          )

          def total_velocity(xx, yy, zz, time):
              return backend.velocity(xx, yy, zz, time) + np.asarray(
                  velocity_osc(xx, yy, zz, time), dtype=float
              )

          levels = tuple(
              cartesian_fd6_self_advection(total_velocity, x, y, z, t, step=h)
              for h in FD6_STEPS
          )
          reference = np.asarray(production.inner_plus_oscillatory_self_advection, dtype=float)
          total_u = np.asarray(production.inner_plus_oscillatory_velocity, dtype=float)
          failures = frozen_gate_failures(reference, levels, total_velocity=total_u)

          ratio, coarse_medium, medium_fine = successive_refinement_ratio(
              levels[0].self_advection,
              levels[1].self_advection,
              levels[2].self_advection,
          )
          fine = levels[-1].self_advection
          fine_error = fine - reference
          component_rms = np.sqrt(np.mean(fine_error * fine_error, axis=0))
          component_reference_rms = np.sqrt(np.mean(reference * reference, axis=0))
          component_relative_rms = component_rms / np.maximum(
              component_reference_rms, np.finfo(float).tiny
          )
          component_abs_max = np.max(np.abs(fine_error), axis=0)
          worst_flat = int(np.argmax(np.abs(fine_error)))
          worst_sample, worst_component = np.unravel_index(worst_flat, fine_error.shape)

          velocity_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_velocity
              - production.inner_leading_velocity
              - production.oscillatory_velocity
          )))
          full_decomposition_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_self_advection
              - production.inner_leading_self_advection
              - production.mixed_cross_advection
              - production.oscillatory_self_advection
          )))
          if velocity_closure > 1.0e-14:
              failures.append('velocity_additive_closure')
          if full_decomposition_closure > 1.0e-13:
              failures.append('full_advection_decomposition_closure')

          scaled_failures = frozen_gate_failures(
              0.99 * reference, levels, total_velocity=total_u
          )
          if not ({'fine_relative_rms', 'fine_relative_sampled_max'} & set(scaled_failures)):
              failures.append('scale_mutation_not_detected')

          flipped = reference.copy()
          flipped[..., 2] *= -1.0
          flipped_failures = frozen_gate_failures(flipped, levels, total_velocity=total_u)
          if not ({'fine_relative_rms', 'fine_relative_sampled_max'} & set(flipped_failures)):
              failures.append('axial_sign_mutation_not_detected')

          contract = public_contract()
          truth = contract['truth_boundary']
          required_false = (
              'global_leading_velocity_materialized',
              'outer_join_materialized',
              'matched_pressure_included',
              'restricted_forcing_included',
              'viscous_laplacian_included',
              'correction_velocity_included',
              'complete_kokuno_candidate_assembled',
              'leading_only_ns_residual_assessed',
              'leading_plus_oscillatory_ns_residual_assessed',
              'after_correction_ns_residual_assessed',
              'heldout_ns_momentum_residual_assessed',
              'formal_full_domain_pde_gate_assessed',
              'pde_validated',
              'paper_exact',
          )
          if any(truth[k] for k in required_false):
              failures.append('truth_boundary_promotion')

          receipt = {
              'schema': 'kokuno-a4-inner-leading-oscillatory-full-advection-independent-receipt-v1',
              'agent2_pr': AGENT2_FULL_ADVECTION_PR,
              'agent2_head': AGENT2_FULL_ADVECTION_HEAD,
              'agent2_source_blob': AGENT2_FULL_ADVECTION_BLOB,
              'agent1_pr': AGENT1_SELF_ADVECTION_PR,
              'agent1_head': AGENT1_SELF_ADVECTION_HEAD,
              'agent1_source_blob': AGENT1_SELF_ADVECTION_BLOB,
              'agent1_field_sha256': meta['field_sha256'],
              'agent1_self_advection_sha256': meta['self_advection_sha256'],
              'seed': 9173491,
              'random_sample_count': n_random,
              'axis_and_axis_near_probe_count': 6,
              'total_sample_count': int(x.size),
              'source_X_range_random': [float(np.min(X[:n_random])), float(np.max(X[:n_random]))],
              'source_eta_range_random': [float(np.min(eta[:n_random])), float(np.max(eta[:n_random]))],
              'time_range_random': [float(np.min(tt[:n_random])), float(np.max(tt[:n_random]))],
              'production_inner_fd4_step': 1.0e-3,
              'production_oscillatory_fd6_step': 1.0e-3,
              'independent_cartesian_fd6_steps': list(FD6_STEPS),
              'independent_relative_rms_by_step': [
                  relative_rms(reference, level.self_advection) for level in levels
              ],
              'independent_relative_sampled_max_by_step': [
                  relative_sampled_max(reference, level.self_advection) for level in levels
              ],
              'successive_refinement_ratio_coarse_to_fine': ratio,
              'coarse_medium_difference_rms': coarse_medium,
              'medium_fine_difference_rms': medium_fine,
              'fine_component_absolute_rms': component_rms.tolist(),
              'fine_component_relative_rms': component_relative_rms.tolist(),
              'fine_component_absolute_max': component_abs_max.tolist(),
              'worst_fine_error': {
                  'sample_index': int(worst_sample),
                  'component': int(worst_component),
                  'x': float(x[worst_sample]),
                  'y': float(y[worst_sample]),
                  'z': float(z[worst_sample]),
                  't': float(t[worst_sample]),
                  'absolute_error': float(abs(fine_error[worst_sample, worst_component])),
                  'production_value': float(reference[worst_sample, worst_component]),
                  'independent_fd6_value': float(fine[worst_sample, worst_component]),
              },
              'full_advection_rms': vector_rms(reference),
              'composite_velocity_rms': vector_rms(total_u),
              'velocity_additive_closure_abs_max': velocity_closure,
              'full_advection_decomposition_closure_abs_max': full_decomposition_closure,
              'scale_mutation_failed_guards': scaled_failures,
              'axial_sign_mutation_failed_guards': flipped_failures,
              'failed_guards': failures,
              'truth_boundary': truth,
          }

          Path('artifacts').mkdir(exist_ok=True)
          path = Path('artifacts/kokuno_agent4_inner_leading_oscillatory_full_advection_independent_receipt.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))

          if proc.stdin is not None:
              proc.stdin.close()
          proc.terminate()
          proc.wait(timeout=10)
          if failures:
              raise SystemExit('failed guards: ' + ', '.join(failures))
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-inner-leading-oscillatory-full-advection-independent-v1
          path: artifacts/kokuno_agent4_inner_leading_oscillatory_full_advection_independent_receipt.json
          if-no-files-found: warn
