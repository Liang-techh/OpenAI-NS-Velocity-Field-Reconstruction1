name: agent9-st052-transform-migration

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/st052_local_swirl_transform.py'
      - 'tests/test_st052_local_swirl_transform.py'
      - 'scripts/agent9_verify_st052_transform_migration.py'
      - '.github/workflows/agent9-st052-transform-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout exact PR 559 source head
        uses: actions/checkout@v4
        with:
          ref: 39b106ad8cb8df2064cabead3a12682089575e74
          path: source-exact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install candidate package
        working-directory: candidate
        run: python -m pip install -e '.[dev]'

      - name: Unit tests for migrated transform
        working-directory: candidate
        run: python -m pytest -q tests/test_st052_local_swirl_transform.py

      - name: Replay exact-source parity
        working-directory: candidate
        run: |
          mkdir -p artifacts/agent9/st052-transform-migration
          python scripts/agent9_verify_st052_transform_migration.py \
            --source-root ../source-exact \
            --out artifacts/agent9/st052-transform-migration/report.json
          python - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('artifacts/agent9/st052-transform-migration/report.json')
          obj = json.loads(p.read_text())
          assert obj['parity']['exact_source_parity'] is True
          assert obj['pde_validated'] is False
          assert obj['visualization_ready'] is False
          print('report_sha256=' + hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Upload parity receipt
        uses: actions/upload-artifact@v4
        with:
          name: ST052-M-local-swirl-transform-migration
          path: candidate/artifacts/agent9/st052-transform-migration/report.json
          if-no-files-found: error
