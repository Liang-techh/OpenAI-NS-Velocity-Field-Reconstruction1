name: kokuno-agent4-inner-leading-oscillatory-transport-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-inner-leading-osc-transport-independent-audit-074
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_a4_inner_leading_oscillatory_transport_independent_audit.py'
      - 'tests/test_constrained_kokuno_a4_inner_leading_oscillatory_transport_independent_audit.py'
      - '.github/workflows/kokuno-agent4-inner-leading-oscillatory-transport-independent-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: python -m pip install -e '.[dev]'

      - name: Compile focused files
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a4_inner_leading_oscillatory_transport_independent_audit.py \
            tests/test_constrained_kokuno_a4_inner_leading_oscillatory_transport_independent_audit.py

      - name: Run focused regressions with warnings as errors
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_a4_inner_leading_oscillatory_transport_independent_audit.py

      - name: Verify exact upstream source blobs and prepare Agent-1 worktree
        shell: bash
        run: |
          set -euo pipefail
          A2_HEAD='016e3c152d7d11e4fedcd79b819df337f8942983'
          A2_EXPECTED='d6082ebd346ba8150321bf3d62f104c107a70300'
          A1_HEAD='e96ee90144976a992b62d76d4361a94eb16bd91e'
          A1_EXPECTED='74b0e185e8e0bbb08695d493e0a091c305a03006'
          git fetch --no-tags origin "$A2_HEAD" "$A1_HEAD"
          A2_ACTUAL="$(git rev-parse "$A2_HEAD":src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport.py)"
          A1_ACTUAL="$(git rev-parse "$A1_HEAD":src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_laplacian.py)"
          test "$A2_ACTUAL" = "$A2_EXPECTED"
          test "$A1_ACTUAL" = "$A1_EXPECTED"
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-839" "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-839" rev-parse HEAD)" = "$A1_HEAD"

      - name: Generate exact-head independent held-out receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-839
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          from dataclasses import replace
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_a4_inner_leading_oscillatory_transport_independent_audit import (
              AGENT1_LAPLACIAN_BLOB,
              AGENT1_LAPLACIAN_HEAD,
              AGENT1_LAPLACIAN_PR,
              AGENT2_TRANSPORT_BLOB,
              AGENT2_TRANSPORT_HEAD,
              AGENT2_TRANSPORT_PR,
              FD8_STEPS,
              VISCOSITY,
              cartesian_fd8_transport,
              frozen_gate_failures,
              public_contract as a4_public_contract,
              relative_rms,
              relative_sampled_max,
              scalar_rms,
              successive_refinement_ratio,
              transport_at_viscosity,
              vector_rms,
          )
          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_transport import (
              evaluate_inner_leading_oscillatory_transport,
          )
          from openai_ns_reconstruction.kokuno_public_z_pullback_velocity import velocity_osc

          seed = 9173501
          random_count = 128
          axis_near_count = 6
          rng = np.random.default_rng(seed)

          a1 = Path(os.environ['A1_WORKTREE'])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_laplacian import KokunoPA10CartesianCenterLaplacian
          field = KokunoPA10CartesianCenterLaplacian()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'temporal_derivative_sha256': field.temporal_derivative_sha256,
                      'spatial_derivative_sha256': field.spatial_derivative_sha256,
                      'self_advection_sha256': field.self_advection_sha256,
                      'laplacian_sha256': field.laplacian_sha256,
                      'source_X_interval': list(field.spatial.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op in ('velocity','velocity_dt','self_advection','velocity_laplacian'):
                  method = getattr(field, op)
                  out = method(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''
          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1Backend:
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def _call(self, op, x, y, z, t):
                  x, y, z, t = self._arrays(x, y, z, t)
                  out = ask({
                      'op': op, 'x': x.tolist(), 'y': y.tolist(),
                      'z': z.tolist(), 't': t.tolist(),
                  })
                  return np.asarray(out['value'], dtype=float)
              def velocity(self, x, y, z, t):
                  return self._call('velocity', x, y, z, t)
              def velocity_dt(self, x, y, z, t):
                  return self._call('velocity_dt', x, y, z, t)
              def self_advection(self, x, y, z, t):
                  return self._call('self_advection', x, y, z, t)
              def velocity_laplacian(self, x, y, z, t):
                  return self._call('velocity_laplacian', x, y, z, t)

          meta = ask({'op': 'meta'})
          if meta['source_X_interval'][1] < 0.39:
              raise RuntimeError('unexpected Agent-1 inner X domain')
          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 time interval')

          # Fresh A4 held-out cloud, frozen before observing exact-head Actions.
          X_random = rng.uniform(0.15, 0.27, size=random_count)
          eta_random = rng.uniform(-0.28, 0.28, size=random_count)
          t_random = rng.uniform(0.44, 0.56, size=random_count)
          theta_random = rng.uniform(0.0, 2.0 * math.pi, size=random_count)

          X_axis = np.asarray((0.0, 0.0, 0.0, 1.0e-12, 1.0e-10, 1.0e-8), dtype=float)
          eta_axis = np.asarray((-0.22, 0.0, 0.22, -1.0e-8, 1.0e-8, 0.11), dtype=float)
          t_axis = np.asarray((0.46, 0.50, 0.54, 0.48, 0.52, 0.50), dtype=float)
          theta_axis = np.asarray((0.13, 1.10, 2.20, 0.70, 1.90, 2.70), dtype=float)

          X = np.concatenate((X_random, X_axis))
          eta = np.concatenate((eta_random, eta_axis))
          tt_source = np.concatenate((t_random, t_axis))
          theta = np.concatenate((theta_random, theta_axis))
          forward = ask({
              'op': 'forward', 'X': X.tolist(), 'eta': eta.tolist(),
              't': tt_source.tolist(), 'theta': theta.tolist(),
          })
          x = np.asarray(forward['x'], dtype=float)
          y = np.asarray(forward['y'], dtype=float)
          z = np.asarray(forward['z'], dtype=float)
          tt = np.asarray(forward['t'], dtype=float)
          if x.size != random_count + axis_near_count:
              raise RuntimeError('held-out sample count drifted')

          backend = ExactAgent1Backend()
          production = evaluate_inner_leading_oscillatory_transport(
              backend, x, y, z, tt
          )

          def total_public_velocity(xx, yy, zz, time):
              inner = backend.velocity(xx, yy, zz, time)
              osc = np.asarray(velocity_osc(xx, yy, zz, time), dtype=float)
              out = inner + osc
              if out.shape != inner.shape or not np.all(np.isfinite(out)):
                  raise RuntimeError('total public velocity became invalid')
              return out

          direct_total = total_public_velocity(x, y, z, tt)
          velocity_closure = float(np.max(np.abs(
              direct_total - production.inner_plus_oscillatory_velocity
          )))

          levels = tuple(
              cartesian_fd8_transport(
                  total_public_velocity, x, y, z, tt, step=h
              )
              for h in FD8_STEPS
          )
          failures = frozen_gate_failures(
              production.transport,
              levels,
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          if velocity_closure > 1.0e-14:
              failures.append('public_total_velocity_closure')

          fine = levels[-1]
          refinement_ratio, coarse_medium, medium_fine = successive_refinement_ratio(
              levels[0].transport, levels[1].transport, fine.transport
          )
          production_transport = np.asarray(production.transport, dtype=float)
          error = fine.transport - production_transport
          error_norm = np.linalg.norm(error, axis=-1)
          worst_flat = int(np.argmax(error_norm))
          worst_component = int(np.argmax(np.abs(error[worst_flat])))

          component_metrics = []
          for component in range(3):
              component_error = error[..., component]
              reference = production_transport[..., component]
              denom_rms = max(float(np.sqrt(np.mean(reference * reference))), np.finfo(float).tiny)
              denom_max = max(float(np.max(np.abs(reference))), np.finfo(float).tiny)
              component_metrics.append({
                  'component': component,
                  'absolute_rms_error': float(np.sqrt(np.mean(component_error * component_error))),
                  'relative_rms_error': float(np.sqrt(np.mean(component_error * component_error))) / denom_rms,
                  'absolute_max_error': float(np.max(np.abs(component_error))),
                  'relative_max_error': float(np.max(np.abs(component_error))) / denom_max,
              })

          level_metrics = []
          for level in levels:
              level_metrics.append({
                  'step': level.step,
                  'production_vs_independent_relative_rms': relative_rms(
                      production_transport, level.transport
                  ),
                  'production_vs_independent_relative_sampled_max': relative_sampled_max(
                      production_transport, level.transport
                  ),
                  'independent_divergence_sampled_max': float(np.max(np.abs(level.divergence))),
                  'independent_divergence_sampled_rms': scalar_rms(level.divergence),
              })

          # Frozen negative controls.
          scaled_failures = frozen_gate_failures(
              0.90 * production_transport,
              levels,
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          flipped = production_transport.copy()
          flipped[..., 2] *= -1.0
          sign_flip_failures = frozen_gate_failures(
              flipped,
              levels,
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          divergence_mutation = replace(
              fine, divergence=fine.divergence + 1.0e-3
          )
          divergence_mutation_failures = frozen_gate_failures(
              production_transport,
              (levels[0], levels[1], divergence_mutation),
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          mutations_detected = bool(
              scaled_failures
              and sign_flip_failures
              and 'divergence_sampled_max' in divergence_mutation_failures
              and 'divergence_sampled_rms' in divergence_mutation_failures
          )
          if not mutations_detected:
              failures.append('mutation_controls')

          # Diagnostic only: no viscosity retuning is authorized.
          nominal = transport_at_viscosity(fine, VISCOSITY)
          viscosity_minus = transport_at_viscosity(fine, VISCOSITY * 0.999)
          viscosity_plus = transport_at_viscosity(fine, VISCOSITY * 1.001)
          sensitivity = {
              'minus_0p1pct_relative_rms_from_nominal': relative_rms(nominal, viscosity_minus),
              'plus_0p1pct_relative_rms_from_nominal': relative_rms(nominal, viscosity_plus),
              'used_for_acceptance_or_retuning': False,
          }

          contract = a4_public_contract()
          truth = contract['truth_boundary']
          required_false = (
              'global_leading_velocity_materialized',
              'outer_join_materialized',
              'matched_pressure_included',
              'restricted_forcing_included',
              'correction_velocity_included',
              'complete_kokuno_candidate_assembled',
              'leading_only_ns_residual_assessed',
              'leading_plus_oscillatory_ns_residual_assessed',
              'after_correction_ns_residual_assessed',
              'heldout_ns_momentum_residual_assessed',
              'formal_full_domain_pde_gate_assessed',
              'boundary_support_gate_assessed',
              'pde_validated',
              'paper_exact',
          )
          if any(truth[key] for key in required_false):
              failures.append('truth_boundary_promotion')

          axis_slice = slice(random_count, random_count + axis_near_count)
          axis_near_finite = bool(
              np.all(np.isfinite(direct_total[axis_slice]))
              and np.all(np.isfinite(fine.transport[axis_slice]))
              and np.all(np.isfinite(fine.divergence[axis_slice]))
          )
          if not axis_near_finite:
              failures.append('axis_near_nonfinite')

          receipt = {
              'schema': contract['schema'],
              'task': contract['task'],
              'exact_a4_head': os.environ['EXPECTED_HEAD'],
              'agent2_transport_pr': AGENT2_TRANSPORT_PR,
              'agent2_transport_head': AGENT2_TRANSPORT_HEAD,
              'agent2_transport_source_blob': AGENT2_TRANSPORT_BLOB,
              'agent1_laplacian_pr': AGENT1_LAPLACIAN_PR,
              'agent1_laplacian_head': AGENT1_LAPLACIAN_HEAD,
              'agent1_laplacian_source_blob': AGENT1_LAPLACIAN_BLOB,
              'agent1_field_sha256': meta['field_sha256'],
              'agent1_laplacian_sha256': meta['laplacian_sha256'],
              'seed': seed,
              'random_offgrid_points': random_count,
              'axis_and_axis_near_points': axis_near_count,
              'sample_count': int(x.size),
              'source_X_range': [float(np.min(X)), float(np.max(X))],
              'source_eta_range': [float(np.min(eta)), float(np.max(eta))],
              'time_range': [float(np.min(tt)), float(np.max(tt))],
              'viscosity': VISCOSITY,
              'independent_fd8_steps': list(FD8_STEPS),
              'resolution_metrics': level_metrics,
              'successive_transport_refinement_ratio': refinement_ratio,
              'coarse_medium_transport_rms_difference': coarse_medium,
              'medium_fine_transport_rms_difference': medium_fine,
              'fine_component_metrics': component_metrics,
              'worst_error': {
                  'sample_index': worst_flat,
                  'component': worst_component,
                  'x': float(x[worst_flat]),
                  'y': float(y[worst_flat]),
                  'z': float(z[worst_flat]),
                  't': float(tt[worst_flat]),
                  'source_X': float(X[worst_flat]),
                  'source_eta': float(eta[worst_flat]),
                  'production': float(production_transport[worst_flat, worst_component]),
                  'independent_fd8': float(fine.transport[worst_flat, worst_component]),
                  'absolute_component_error': float(abs(error[worst_flat, worst_component])),
                  'vector_error_norm': float(error_norm[worst_flat]),
              },
              'production_transport_rms': vector_rms(production_transport),
              'composite_velocity_rms': vector_rms(production.inner_plus_oscillatory_velocity),
              'public_total_velocity_closure_abs_max': velocity_closure,
              'axis_near_finite': axis_near_finite,
              'mutation_controls': {
                  'transport_scale_0p90_failures': scaled_failures,
                  'axial_sign_flip_failures': sign_flip_failures,
                  'divergence_plus_1e3_failures': divergence_mutation_failures,
                  'all_detected': mutations_detected,
              },
              'viscosity_sensitivity': sensitivity,
              'frozen_gates': contract['frozen_gates'],
              'norm_scope': contract['norm_scope'],
              'truth_boundary': truth,
              'failed_guards': sorted(set(failures)),
          }

          out = Path('artifacts/kokuno_agent4')
          out.mkdir(parents=True, exist_ok=True)
          path = out / 'inner_leading_oscillatory_transport_independent_audit.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))

          if proc.stdin is not None:
              proc.stdin.close()
          proc.terminate()
          proc.wait(timeout=10)

          if receipt['failed_guards']:
              raise SystemExit('scientific/validation guards failed: ' + ', '.join(receipt['failed_guards']))
          PY

      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-inner-leading-oscillatory-transport-independent-audit-v1
          path: artifacts/kokuno_agent4/inner_leading_oscillatory_transport_independent_audit.json
          if-no-files-found: warn
