name: kokuno-agent3-typed-mean-radial-stress

on:
  push:
    branches:
      - codex/kokuno-a3-typed-radial-stress-052
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py"
      - "src/openai_ns_reconstruction/kokuno_actual_oscillatory_mean_stress.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py"
      - "tests/test_kokuno_typed_mean_defect_projection.py"
      - "tests/test_kokuno_typed_mean_radial_stress.py"
      - ".github/workflows/kokuno-agent3-typed-mean-radial-stress.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-typed-mean-radial-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typed-mean-radial-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile typed defect, mean projection and radial-stress seam
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py
          src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_kokuno_typed_mean_defect_projection.py
          tests/test_kokuno_typed_mean_radial_stress.py
      - name: Emit deterministic typed mean radial-stress receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_typed_mean_radial_stress
          --output artifacts/kokuno_agent3_typed_mean_radial_stress_v1.json
      - name: Check no-surrogate stress handoff and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/kokuno_agent3_typed_mean_radial_stress_v1.json').read_text())
          assert r['schema'] == 'kokuno-a3-typed-mean-radial-stress-v1'
          assert r['provenance']['parent_agent3_pr'] == 670
          assert r['provenance']['parent_agent3_head'] == '56833156dc0db1ac03ceb42bf49fa2c55935c85e'
          q = r['analytic_regression']
          assert q['maximum_theta_mean_error'] <= 2e-12
          assert q['maximum_radial_mean_error'] <= 2e-12
          assert q['maximum_axial_mean_error'] <= 2e-12
          e = q['evaluation']
          assert e['theta_e2']['exponent'] == 2
          assert e['axial_e1']['exponent'] == 1
          assert abs(e['theta_e2']['moment_complement_weighted_moment']) <= 2e-12
          assert abs(e['axial_e1']['moment_complement_weighted_moment']) <= 2e-12
          assert abs(e['theta_e2']['stress_inner_edge']) <= 2e-12
          assert abs(e['theta_e2']['stress_outer_edge']) <= 2e-12
          assert abs(e['axial_e1']['stress_inner_edge']) <= 2e-12
          assert abs(e['axial_e1']['stress_outer_edge']) <= 2e-12
          b = r['truth_boundary']
          assert b['raw_same_cycle_providers_required'] is True
          assert b['caller_supplied_precomputed_defect_allowed'] is False
          assert b['caller_supplied_mean_source_allowed'] is False
          assert b['caller_supplied_stress_allowed'] is False
          assert b['forbidden_public_parameters_absent'] is True
          assert b['actual_mean_channels_fed_directly_to_existing_radial_operator'] is True
          assert b['radial_operator_revalidated_here'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['full_same_cycle_composite_requested_stress_materialized'] is False
          assert b['candidate_finite_head_mean_debt_materialized'] is False
          assert b['signed_mean_inverse_input_ready'] is False
          assert b['public_velocity_correction_materialized'] is False
          assert b['real_candidate_finite_correction_cycle_run'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed'] is False
          assert b['pde_validated'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-typed-mean-radial-stress-v1
          path: artifacts/kokuno_agent3_typed_mean_radial_stress_v1.json
          if-no-files-found: error
      - name: Comment exact typed stress receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_typed_mean_radial_stress_v1.json', 'utf8'));
            const q = r.analytic_regression;
            const e = q.evaluation;
            const lines = [
              '### Kokuno Agent 3 exact-head typed actual-mean -> radial-stress seam',
              '',
              `max theta-mean error: **${q.maximum_theta_mean_error}**`,
              `max radial-mean error: **${q.maximum_radial_mean_error}**`,
              `max axial-mean error: **${q.maximum_axial_mean_error}**`,
              `theta/e=2 complement moment: **${e.theta_e2.moment_complement_weighted_moment}**`,
              `axial/e=1 complement moment: **${e.axial_e1.moment_complement_weighted_moment}**`,
              '',
              'This receipt recomputes a nonzero actual defect from raw same-cycle providers with fixed f=0, projects the theta/axial means, and feeds them directly into the existing compact radial-stress operator. It is an interface/mechanics regression, not a real full Kokuno candidate correction, held-out normalized NS residual reduction, or blow-up proof.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
