name: kokuno-agent3-public-z-pass-admission

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_public_z_pass_admission.py'
      - 'tests/test_constrained_kokuno_public_z_pass_admission.py'
      - 'artifacts/constrained/kokuno_agent3/agent4_563_public_z_pullback_independent_audit.json'
      - '.github/workflows/kokuno-agent3-public-z-pass-admission.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_public_z_pass_admission.py'
      - 'tests/test_constrained_kokuno_public_z_pass_admission.py'
      - 'artifacts/constrained/kokuno_agent3/agent4_563_public_z_pullback_independent_audit.json'
      - '.github/workflows/kokuno-agent3-public-z-pass-admission.yml'

permissions:
  contents: read

jobs:
  public-z-pass-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-3 admission tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_carrier_resolved_audit_admission.py
          tests/test_constrained_kokuno_public_z_pass_admission.py
      - name: Compile Agent-3 public-z PASS admission module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_public_z_pass_admission.py
      - name: Generate public-z PASS admission receipt
        run: >-
          python -m openai_ns_reconstruction.kokuno_public_z_pass_admission
          --audit artifacts/constrained/kokuno_agent3/agent4_563_public_z_pullback_independent_audit.json
          --output kokuno_agent3_public_z_pass_admission.json
      - name: Check narrow promotion and fail-closed correction boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('kokuno_agent3_public_z_pass_admission.json').read_text())
          assert r['execution_identity_bound'] is True
          assert r['correction_receipt_identity_pinned_to_current_pass'] is True
          assert r['local_divergence_passed'] is True
          assert r['covariance_rank_preflight_passed'] is True
          assert r['project_support_preflight_passed'] is True
          assert r['public_oscillatory_preflight_passed'] is True
          assert r['correction_ingest_allowed'] is True
          assert r['same_cycle_requested_stress_materialization_allowed'] is True
          assert r['candidate_finite_head_mean_debt_materialization_allowed'] is True
          assert r['requested_stress_actual_state_values_materialized'] is False
          assert r['finite_head_mean_debt_materialized'] is False
          assert r['real_candidate_defect_consumed'] is False
          assert r['signed_mean_inverse_input_ready'] is False
          assert r['public_velocity_correction_materialized'] is False
          assert r['finite_correction_cycle_rerun_allowed'] is False
          assert r['finite_correction_cycle_run'] is False
          assert r['heldout_ns_residual_assessed'] is False
          assert r['residual_reduction_claimed'] is False
          assert r['pde_validated'] is False
          assert r['surrogate_defect_used'] is False
          PY
      - name: Upload Agent-3 admission receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-public-z-pass-admission-v1
          path: kokuno_agent3_public_z_pass_admission.json
