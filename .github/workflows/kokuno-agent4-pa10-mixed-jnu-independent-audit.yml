name: kokuno-agent4-pa10-mixed-jnu-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-mixed-jnu-independent-audit-052
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-mixed-jnu-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-mixed-jnu-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_mixed_jnu_seams.py \
            src/openai_ns_reconstruction/kokuno_agent4_pa10_mixed_jnu_independent_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_mixed_jnu_seams.py \
            tests/test_constrained_kokuno_agent4_pa10_mixed_jnu_independent_audit.py
      - name: Generate exact-head independent receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_agent4_pa10_mixed_jnu_independent_audit \
            --output artifacts/kokuno_agent4/pa10_mixed_jnu_audit/report.json
      - name: Bind exact head and enforce truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_mixed_jnu_audit/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          assert payload['mixed_jnu_independent_preflight_passed'] is True
          assert payload['failed_guards'] == []
          assert all(payload['guards'].values())
          truth = payload['truth_boundary']
          assert truth['conditional_mixed_operator_algebra_independently_audited'] is True
          assert truth['source_u_ball_independently_audited'] is False
          assert truth['full_R1_R2_independently_audited'] is False
          assert truth['M_K_independently_audited'] is False
          assert truth['global_pressure_independently_audited'] is False
          assert truth['global_leading_velocity_independently_audited'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['formal_full_domain_pde_gate_assessed'] is False
          assert truth['pde_validated'] is False
          protocol = payload['protocol']
          assert protocol['final_momentum_gate_unchanged'] == 1.0e-3
          assert protocol['final_divergence_gate_unchanged'] == 1.0e-5
          print('receipt_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('operator_constant=', payload['operator_constant'])
          print('random_ball_stress=', payload['random_ball_stress'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-mixed-jnu-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_mixed_jnu_audit/report.json
