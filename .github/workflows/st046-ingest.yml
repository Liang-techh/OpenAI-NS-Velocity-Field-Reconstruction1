name: st046-source-ingest
on:
  push:
    branches: [research/st046-acceleration-pressure]
    paths: [.github/workflows/st046-ingest.yml]
permissions:
  contents: write
jobs:
  restore-source:
    if: github.repository == 'Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/st046-acceleration-pressure
      - name: Restore verified new source only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,urllib.request
          from pathlib import Path
          repo='Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1'
          ids=['3dc90bed14f7cf2cf52663fa24d7237958188063','493aff5a9c32b91e0a7f1aa72390b1011606263d','cc063e7c65dcb400f892b267f2fd0a2d81ec4f3b','ceb59b1417b843ac73ca45dcfd2f0bae87cfa893']
          def gh(b):return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          parts=[]
          for sha in ids:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ST046-publication'})
              with urllib.request.urlopen(req,timeout=60) as r:data=json.load(r)
              raw=base64.b64decode(data['content']);assert gh(raw)==sha
              parts.append(raw.decode('ascii'))
          # Repair two transport transcription substitutions; original part and
          # complete payload checksums must match before writing any source.
          parts[2]=parts[2].replace('GvXhoX1V1VYI3','GvXhoX1Q1VYI3').replace('W34YtjZ8Wxv760N2','W34tjZ8Wxv+360N2')
          assert gh(parts[2].encode())=='d3297dece0a87961ca1518152a6ecc219fe5c02b'
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='e20fe76b249e0a997c2d882aa1619179ff33f5904cf57515aad4e15187285461'
          entries=json.loads(gzip.decompress(packed))
          names={'acceleration_fit.py','mechanism_audit.py','independent_checks.py','replay_st046.py','test_acceleration.py','recipes.json'}
          assert set(entries)=={'experiments/root_st046/'+n for n in names}
          root=Path.cwd().resolve()
          for name,text in entries.items():
              p=(root/name).resolve();assert p.is_relative_to(root) and '..' not in Path(name).parts
              payload=text.encode('utf-8')
              if p.exists():assert p.read_bytes()==payload,'Refusing different existing source'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(payload)
              print(name,hashlib.sha256(payload).hexdigest())
          print('Six exact source/recipe files restored; no scientific acceptance implied.')
          PY
      - name: Commit on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/root_st046
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish ST046 coupled acceleration-pressure source and four frozen recipes'
          git push origin HEAD:research/st046-acceleration-pressure
