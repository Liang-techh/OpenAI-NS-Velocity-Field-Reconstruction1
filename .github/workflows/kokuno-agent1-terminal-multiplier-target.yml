name: kokuno-agent1-terminal-multiplier-target

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_terminal_multiplier_target.py"
      - "tests/test_kokuno_public_terminal_multiplier_target.py"
      - ".github/workflows/kokuno-agent1-terminal-multiplier-target.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert exact A1 ancestry and minimal three-file scope
        shell: bash
        run: |
          git merge-base --is-ancestor 18e75e6e2df43206147db34788c68ee6a7fa0f37 HEAD
          mapfile -t changed < <(git diff --name-only 18e75e6e2df43206147db34788c68ee6a7fa0f37...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent1-terminal-multiplier-target.yml"
            "src/openai_ns_reconstruction/kokuno_public_terminal_multiplier_target.py"
            "tests/test_kokuno_public_terminal_multiplier_target.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Verify pinned corrected-source terminal target and bridge ordering
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://raw.githubusercontent.com/KokunoYumeto/yang-mills-interacting-workbench/143f6773feb424ad9ed3a8d116653200f20346b7/navier-stokes/navier_stokes_workbench.tex"
          data = urllib.request.urlopen(url, timeout=30).read()
          digest = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          expected = "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          if digest != expected:
              raise SystemExit(f"corrected source blob drifted: {digest} != {expected}")
          text = data.decode("utf-8")
          required = (
              "The terminal multiplier is",
              "$f_o(y)=1-\\rho_o\\psi_o(y)$",
              "$\\psi_o=1-\\sigma((y-1)/2)$",
              "$\\rho_o=c_oh>0$",
              "$0\\le f_o'/f_o<h/4$",
              "Hold $l=-h$ before it until $Q_s$ reaches $Q_p$.",
              "The intervening $l=-h$ solution is $Q_{\\rm in}e^{-(1-h)y}$",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"terminal target/bridge statements missing from pinned source: {missing}")
          print("corrected source terminal target and intervening l=-h bridge order pinned")
          PY

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_public_terminal_multiplier_target.py
          python -m py_compile tests/test_kokuno_public_terminal_multiplier_target.py

      - name: Run parent and new focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa16_current_cartesian_postswirl_release2.py \
            tests/test_kokuno_public_terminal_multiplier_target.py

      - name: Emit deterministic terminal target receipt
        run: |
          mkdir -p artifacts/kokuno_agent1_terminal_multiplier_target
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_public_terminal_multiplier_target import (
              KokunoPublicTerminalMultiplierTarget,
          )

          root = Path("artifacts/kokuno_agent1_terminal_multiplier_target")
          target = KokunoPublicTerminalMultiplierTarget()
          receipt = target.target_report()
          config = target.configuration()
          truth = receipt["truth_boundary"]
          inequality = receipt["source_inequality"]

          assert receipt["q_p_reduced"] > 0.0
          assert receipt["q_p_relative_replay_error"] < 2e-14
          assert inequality["sampled_inequality_satisfied"] is True
          assert inequality["certificate_inequality_satisfied"] is True
          assert truth["public_terminal_multiplier_target_api_materialized"] is True
          assert truth["repository_autonomous_terminal_c_o_materialized"] is True
          assert truth["source_exact_terminal_c_o_recovered"] is False
          assert truth["current_q_s_release2_endpoint_materialized"] is False
          assert truth["current_l_minus_h_matching_bridge_materialized"] is False
          assert truth["current_cartesian_terminal_multiplier_composed"] is False
          assert truth["source_terminal_multiplier_materialized"] is False
          assert truth["source_exterior_heat_replacement_materialized"] is False
          assert truth["outer_global_leading_velocity_materialized"] is False
          assert truth["unified_global_cartesian_velocity_export_ready"] is False
          assert truth["heldout_ns_residual_assessed"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False
          assert truth["openai_field_identified"] is False

          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload terminal target receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-terminal-multiplier-target
          path: artifacts/kokuno_agent1_terminal_multiplier_target/
