name: kokuno-agent4-current-i4-radial-stress-independent-audit

on:
  push:
    branches:
      - kokuno-agent4/current-i4-radial-stress-independent-audit-115
  pull_request:
    branches:
      - agent3/current-i4-radial-stress-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact A4 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a4
          fetch-depth: 0

      - name: Verify exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a4
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          parent=49590ff311fef1dec4bd850b3013fd989485c87a
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-list --count "$parent"..HEAD)" -eq 3
          git diff --name-only "$parent"..HEAD | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/kokuno-agent4-current-i4-radial-stress-independent-audit.yml
          src/openai_ns_reconstruction/kokuno_a4_current_i4_radial_stress_independent_audit.py
          tests/test_constrained_kokuno_a4_current_i4_radial_stress_independent_audit.py
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact A4 head
        run: python -m pip install -e './a4[dev]'

      - name: Authenticate exact A3 parent sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_current_i4_nonlinear_radial_stress.py)" = \
            "b8d9928934d4df74b52e8cd0d2c27c468257cdc9"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_current_i4_nonlinear_mean_attribution.py)" = \
            "10d067570ddba834db3f19c9859c2efdad16b3e8"
          test "$(git -C a4 hash-object src/openai_ns_reconstruction/kokuno_strict_inner_transport_first_cell_polynomial_radial_stress.py)" = \
            "19f8cf9fa909fef7be2cf53c84df269e696b647c"

      - name: Run focused A4 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a4/src/openai_ns_reconstruction/kokuno_a4_current_i4_radial_stress_independent_audit.py \
            a4/tests/test_constrained_kokuno_a4_current_i4_radial_stress_independent_audit.py
          python -m pytest -q -W error \
            a4/tests/test_constrained_kokuno_current_i4_nonlinear_radial_stress.py \
            a4/tests/test_constrained_kokuno_a4_current_i4_radial_stress_independent_audit.py

      - name: Check out exact A2 current-I4 composite
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: c40d8ddecd2971544a6e07dab093436b423cf326
          path: a2
          fetch-depth: 1

      - name: Check out exact A1 current-I4 leading
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: b06742ca6e189499192ede3cce40f62cdc1e35ca
          path: a1
          fetch-depth: 1

      - name: Authenticate sibling heads and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "c40d8ddecd2971544a6e07dab093436b423cf326"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_i4_leading_oscillatory_identity.py)" = \
            "2a0a5aa5966b02da856bdcf51940f3c186042802"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = \
            "12df3bf6c949baeebf609b366f2973e7f515a157"
          test "$(git -C a1 rev-parse HEAD)" = "b06742ca6e189499192ede3cce40f62cdc1e35ca"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_i4_leading_preservation.py)" = \
            "6f04ce0a856b44430402576dad88438da90d1ebb"

      - name: Save/reload candidate and audit real current-I4 stress receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          from pathlib import Path
          import copy
          import importlib
          import json
          import numpy as np
          import openai_ns_reconstruction as pkg

          root = Path.cwd()
          for sibling in (
              root / 'a1' / 'src' / 'openai_ns_reconstruction',
              root / 'a2' / 'src' / 'openai_ns_reconstruction',
          ):
              text = str(sibling.resolve())
              if text not in pkg.__path__:
                  pkg.__path__.append(text)

          a2_field_mod = importlib.import_module(
              'openai_ns_reconstruction.kokuno_current_i4_leading_oscillatory_identity'
          )
          a2_diff_mod = importlib.import_module(
              'openai_ns_reconstruction.kokuno_oscillatory_batch_differentials'
          )
          a3_mean_mod = importlib.import_module(
              'openai_ns_reconstruction.kokuno_current_i4_nonlinear_mean_attribution'
          )
          a3_stress_mod = importlib.import_module(
              'openai_ns_reconstruction.kokuno_current_i4_nonlinear_radial_stress'
          )
          geometry_mod = importlib.import_module(
              'openai_ns_reconstruction.kokuno_strict_inner_transport_radial_stress'
          )
          audit_mod = importlib.import_module(
              'openai_ns_reconstruction.kokuno_a4_current_i4_radial_stress_independent_audit'
          )

          original = a2_field_mod.default_field()
          candidate_path = Path('receipts/current_i4_candidate.json')
          original.save_candidate(candidate_path)
          field = a2_field_mod.CurrentI4LeadingOscillatoryField.load_candidate(candidate_path)
          if field.semantic_sha256 != original.semantic_sha256:
              raise AssertionError('save/reload semantic identity drifted')
          probe = np.asarray([[0.32, 0.11, -0.20, 0.39], [-0.36, 0.24, 0.05, 0.55]])
          before = np.asarray(original.velocity(probe[:,0], probe[:,1], probe[:,2], probe[:,3]), dtype=float)
          after = np.asarray(field.velocity(probe[:,0], probe[:,1], probe[:,2], probe[:,3]), dtype=float)
          replay = float(np.max(np.abs(before-after)))
          if replay > 2e-12:
              raise AssertionError(f'save/reload velocity replay drifted: {replay}')

          backend = a3_mean_mod.ExactCurrentI4NonlinearBackend.bind(
              field, a2_diff_mod.evaluate_oscillatory_batch_differentials
          )
          public_receipts = []
          for index, radii in enumerate(audit_mod.frozen_radial_grids()):
              geometry = geometry_mod.StrictInnerTransportRadialGeometry(
                  time=audit_mod.FROZEN_TIME,
                  axial_z=audit_mod.FROZEN_Z,
                  radii=tuple(float(v) for v in radii),
                  bump_center=audit_mod.FROZEN_BUMP_CENTER,
                  bump_halfwidth=audit_mod.FROZEN_BUMP_HALFWIDTH,
              )
              witness = a3_stress_mod.materialize_current_i4_nonlinear_radial_stress(
                  backend, geometry
              )
              public = json.loads(json.dumps(witness.to_receipt(), sort_keys=True))
              public_receipts.append(public)
              Path(f'receipts/a3_current_i4_stress_level_{index}.json').write_text(
                  json.dumps(public, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )

          report = audit_mod.audit_serialized_receipts(public_receipts)
          report['candidate_save_reload_velocity_max_abs'] = replay
          Path('receipts/a4_current_i4_stress_independent_report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          mutated = copy.deepcopy(public_receipts)
          r = np.asarray(mutated[2]['geometry']['radii'], dtype=float)
          stress = np.asarray(mutated[2]['theta_e2']['aggregate']['stress'], dtype=float)
          scale = max(float(np.max(np.abs(stress))), 1e-12)
          stress = stress + 0.35 * scale * np.sin(np.pi * (r-r[0])/(r[-1]-r[0]))
          mutated[2]['theta_e2']['aggregate']['stress'] = stress.tolist()
          mutation_report = audit_mod.audit_serialized_receipts(mutated)
          if mutation_report['audit_pass'] is not False:
              raise AssertionError('endpoint-preserving stress corruption escaped A4 gate')

          mutated = copy.deepcopy(public_receipts)
          mean = mutated[2]['current_i4_mean_witness']
          aggregate = np.asarray(mean['mean_aggregate_nonlinear_cylindrical'], dtype=float)
          aggregate[len(aggregate)//2, 1] += 1e-4
          mean['mean_aggregate_nonlinear_cylindrical'] = aggregate.tolist()
          try:
              audit_mod.audit_serialized_receipts(mutated)
          except ValueError:
              pass
          else:
              raise AssertionError('aggregate-mean mutation escaped fail-closed parser')

          for label, mutate in (
              ('bump geometry', lambda x: x[2]['geometry'].__setitem__('bump_center', audit_mod.FROZEN_BUMP_CENTER + 0.005)),
              ('provenance', lambda x: x[2]['provenance'].__setitem__('agent2_composite_head', '0'*40)),
              ('truth state', lambda x: x[2]['truth_boundary'].__setitem__('pde_validated', True)),
          ):
              mutated = copy.deepcopy(public_receipts)
              mutate(mutated)
              try:
                  audit_mod.audit_serialized_receipts(mutated)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f'{label} mutation escaped fail-closed parser')
          PY

      - name: Upload candidate and receipts before scientific enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-current-i4-radial-stress-independent-audit
          path: receipts/*.json
          if-no-files-found: error

      - name: Enforce preregistered scoped scientific gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_a4_current_i4_radial_stress_independent_audit import (
              enforce_scientific_gates,
          )

          report = json.loads(
              Path('receipts/a4_current_i4_stress_independent_report.json').read_text(encoding='utf-8')
          )
          enforce_scientific_gates(report)
          boundary = report['truth_boundary']
          assert boundary['complete_ns_defect'] is False
          assert boundary['authorized_correction_target'] is False
          assert boundary['cartesian_correction_velocity_materialized'] is False
          assert boundary['after_correction_ns_residual_assessed'] is False
          assert boundary['same_protocol_comparable_to_st006'] is False
          assert boundary['pde_validated'] is False
          assert boundary['final_normalized_momentum_gate'] == 1e-3
          assert boundary['final_normalized_divergence_gate'] == 1e-5
          PY
