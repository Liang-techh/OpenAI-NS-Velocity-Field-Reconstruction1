name: kokuno-agent3-current-exterior-xr-nonlinear-mean

on:
  push:
    branches:
      - codex/kokuno-a3-current-exterior-xr-nonlinear-mean-105
  pull_request:
    branches:
      - codex/kokuno-a3-current-partial-nonlinear-radial-force-104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact A3 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: a3
          fetch-depth: 0

      - name: Verify A3 parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          cd a3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor dd11348e8eecf298656d7da58aee4526c6102306 HEAD
          test "$(git rev-list --count dd11348e8eecf298656d7da58aee4526c6102306..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only dd11348e8eecf298656d7da58aee4526c6102306..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent3-current-exterior-xr-nonlinear-mean.yml \
            src/openai_ns_reconstruction/kokuno_current_exterior_xr_nonlinear_mean_attribution.py \
            tests/test_constrained_kokuno_current_exterior_xr_nonlinear_mean_attribution.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact A3 head
        shell: bash
        run: python -m pip install -e './a3[dev]'

      - name: Run focused A3 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            a3/src/openai_ns_reconstruction/kokuno_current_exterior_xr_nonlinear_mean_attribution.py \
            a3/tests/test_constrained_kokuno_current_exterior_xr_nonlinear_mean_attribution.py
          python -m pytest -q -W error \
            a3/tests/test_constrained_kokuno_current_partial_nonlinear_mean_attribution.py \
            a3/tests/test_constrained_kokuno_current_exterior_xr_nonlinear_mean_attribution.py

      - name: Check out exact A2 through-XR composite
        uses: actions/checkout@v4
        with:
          ref: 4be2c9ee898c44dd1ad2217e90601b161fe81964
          path: a2
          fetch-depth: 1

      - name: Check out exact A1 current leading through XR
        uses: actions/checkout@v4
        with:
          ref: d3c971f2c62e272333e124e532212d23cca4908d
          path: a1
          fetch-depth: 1

      - name: Authenticate sibling heads and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = "4be2c9ee898c44dd1ad2217e90601b161fe81964"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_exterior_xr_leading_oscillatory_identity.py)" = \
            "93a3da5c3aed4be8310cc510edfab6af940b64dc"
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = \
            "12df3bf6c949baeebf609b366f2973e7f515a157"
          test "$(git -C a1 rev-parse HEAD)" = "d3c971f2c62e272333e124e532212d23cca4908d"
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_exterior_to_xr.py)" = \
            "2ba28636a56b252fa485719e7b3e8da754d7e588"

      - name: Materialize real current-lineage through-XR nonlinear mean receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import numpy as np
          import openai_ns_reconstruction

          pkg = openai_ns_reconstruction
          a1_pkg = str(Path('a1/src/openai_ns_reconstruction').resolve())
          a2_pkg = str(Path('a2/src/openai_ns_reconstruction').resolve())
          a3_pkg = str(Path('a3/src/openai_ns_reconstruction').resolve())

          pkg.__path__.insert(0, a1_pkg)
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_exterior_to_xr import (
              KokunoPA16CurrentCartesianExteriorToXR,
          )
          leading = KokunoPA16CurrentCartesianExteriorToXR()

          pkg.__path__.insert(0, a2_pkg)
          from openai_ns_reconstruction.kokuno_current_exterior_xr_leading_oscillatory_identity import (
              CurrentExteriorXRLeadingOscillatoryField,
          )
          from openai_ns_reconstruction.kokuno_oscillatory_batch_differentials import (
              evaluate_oscillatory_batch_differentials,
          )
          field = CurrentExteriorXRLeadingOscillatoryField(leading)

          pkg.__path__.insert(0, a3_pkg)
          from openai_ns_reconstruction.kokuno_current_exterior_xr_nonlinear_mean_attribution import (
              ExactCurrentExteriorXRNonlinearBackend,
              materialize_current_exterior_xr_nonlinear_mean_attribution,
              truth_boundary,
          )

          backend = ExactCurrentExteriorXRNonlinearBackend.bind(
              field, evaluate_oscillatory_batch_differentials
          )

          inner = materialize_current_exterior_xr_nonlinear_mean_attribution(
              backend,
              np.asarray([math.hypot(0.41, -0.17)], dtype=float),
              np.asarray([-0.08], dtype=float),
              np.asarray([0.39], dtype=float),
          )

          X_ext = field.X_h * math.exp(2.3)
          eta_ext = 0.17
          t_ext = 0.53
          q_ext = (1.0 - t_ext) / (1.0 - eta_ext * eta_ext)
          r_ext = math.sqrt(2.0 * q_ext * X_ext)
          z_ext = (q_ext ** field.D) * eta_ext
          exterior = materialize_current_exterior_xr_nonlinear_mean_attribution(
              backend,
              np.asarray([r_ext], dtype=float),
              np.asarray([z_ext], dtype=float),
              np.asarray([t_ext], dtype=float),
          )

          receipt = {
              "inner": inner.to_receipt(),
              "exterior": exterior.to_receipt(),
              "exterior_probe": {
                  "X_over_Xh": X_ext / field.X_h,
                  "X_over_XR": X_ext / field.X_R,
                  "eta": eta_ext,
                  "time": t_ext,
              },
              "a3_truth_boundary": truth_boundary(),
          }
          Path('receipts/kokuno_a3_current_exterior_xr_nonlinear_mean.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload receipt before gate enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a3-current-exterior-xr-nonlinear-mean
          path: receipts/kokuno_a3_current_exterior_xr_nonlinear_mean.json
          if-no-files-found: error

      - name: Enforce scoped scientific gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          receipt = json.loads(
              Path('receipts/kokuno_a3_current_exterior_xr_nonlinear_mean.json').read_text()
          )
          inner = receipt['inner']
          exterior = receipt['exterior']
          expected_kind = 'exact-current-a2-pr987-through-xr-nonlinear-attribution'
          assert inner['backend_kind'] == expected_kind
          assert exterior['backend_kind'] == expected_kind

          assert inner['pointwise_three_piece_closure_absolute_max'] <= 5e-13
          assert inner['projected_three_piece_closure_absolute_max'] <= 1e-12
          assert inner['quadratic_mean_rms'] > 1e-12
          assert exterior['pointwise_three_piece_closure_absolute_max'] <= 5e-13
          assert exterior['projected_three_piece_closure_absolute_max'] <= 1e-12

          probe = receipt['exterior_probe']
          assert probe['X_over_Xh'] > 1.0
          assert probe['X_over_XR'] < 1.0

          backend = inner['agent2_backend']
          assert backend['agent2_composite_pr'] == 987
          assert backend['agent2_composite_head'] == '4be2c9ee898c44dd1ad2217e90601b161fe81964'
          assert backend['agent1_leading_pr'] == 980
          assert backend['agent1_leading_head'] == 'd3c971f2c62e272333e124e532212d23cca4908d'

          boundary = receipt['a3_truth_boundary']
          assert boundary['current_leading_plus_oscillation_through_XR_consumed'] is True
          assert boundary['velocity_beyond_Xh_through_XR_materialized'] is True
          assert boundary['current_through_XR_mixed_nonlinear_mean_materialized'] is True
          assert boundary['current_through_XR_quadratic_nonlinear_mean_materialized'] is True
          for key in (
              'post_XR_velocity_materialized',
              'outer_global_leading_velocity_materialized',
              'radial_inverse_performed_in_this_increment',
              'pressure_gradient_included',
              'restricted_forcing_included',
              'complete_ns_defect',
              'scoped_nonlinear_mean_authorized_as_correction_target',
              'mean_correction_velocity_materialized',
              'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed',
              'residual_reduction_claimed',
              'same_protocol_comparable_to_st006',
              'pde_validated',
              'blowup_proved',
          ):
              assert boundary[key] is False, key
          assert boundary['final_normalized_momentum_gate'] == 1e-3
          assert boundary['final_normalized_divergence_gate'] == 1e-5
          PY
