name: kokuno-agent4-actual-final-bridge-xi110-independent-audit

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a4_actual_final_bridge_xi110_independent_audit.py"
      - "tests/test_constrained_kokuno_a4_actual_final_bridge_xi110_independent_audit.py"
      - ".github/workflows/kokuno-agent4-actual-final-bridge-xi110-independent-audit.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert stacked Agent-1 ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor f430f8f97df3bfafce56bf094047c769ecec922d HEAD

      - name: Verify exact Agent-1 source blob
        shell: bash
        run: |
          test "$(git rev-parse f430f8f97df3bfafce56bf094047c769ecec922d:src/openai_ns_reconstruction/kokuno_pa10_actual_final_bridge_xi110.py)" = "0cbd49ad0726c1573f2e649c96a3b516d8df053e"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a4_actual_final_bridge_xi110_independent_audit.py
          python -m py_compile tests/test_constrained_kokuno_a4_actual_final_bridge_xi110_independent_audit.py

      - name: Materialize real save-reload independent receipt
        id: real_audit
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/kokuno_a4
          python -m openai_ns_reconstruction.kokuno_a4_actual_final_bridge_xi110_independent_audit \
            --output artifacts/kokuno_a4/actual_final_bridge_xi110_independent_receipt.json

      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a4-actual-final-bridge-xi110-independent-receipt
          path: artifacts/kokuno_a4/actual_final_bridge_xi110_independent_receipt.json
          if-no-files-found: warn

      - name: Run parent and Agent-4 focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_actual_final_bridge_xi110.py \
            tests/test_constrained_kokuno_a4_actual_final_bridge_xi110_independent_audit.py

      - name: Enforce real audit receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/kokuno_a4/actual_final_bridge_xi110_independent_receipt.json")
          if not path.exists():
              raise SystemExit("real independent receipt was not materialized")
          receipt = json.loads(path.read_text())
          if receipt.get("passed") is not True:
              raise SystemExit(
                  "frozen A4 actual-final-bridge audit failed:\n"
                  + json.dumps(
                      {
                          "gates": receipt.get("gates"),
                          "interior_resolution_metrics": receipt.get(
                              "interior_resolution_metrics"
                          ),
                          "interior_resolution_stability": receipt.get(
                              "interior_resolution_stability"
                          ),
                          "endpoint_results": receipt.get("endpoint_results"),
                          "interior_worst_witness": receipt.get(
                              "interior_worst_witness"
                          ),
                          "mutation_checks": receipt.get("mutation_checks"),
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )
          truth = receipt["truth_boundary"]
          if truth.get("pde_validated") is not False:
              raise SystemExit("scoped bridge audit illegally promoted pde_validated")
          if truth.get("heldout_complete_ns_residual_assessed") is not False:
              raise SystemExit("scoped bridge audit illegally claimed full NS residual")
          print(
              json.dumps(
                  {
                      "passed": receipt["passed"],
                      "artifact_semantic_sha256": receipt[
                          "artifact_semantic_sha256"
                      ],
                      "receipt_sha256": receipt["receipt_sha256"],
                      "gates": receipt["gates"],
                      "Xi_endpoint": receipt["endpoint_results"]["Xi"],
                      "Xi_independent_final_slope_abs_max": receipt[
                          "Xi_independent_final_slope_abs_max"
                      ],
                      "Xi_independent_Ux_scale_normalized": receipt[
                          "Xi_independent_Ux_scale_normalized"
                      ],
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
