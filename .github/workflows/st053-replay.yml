name: st053-replay
on:
  pull_request:
    paths:
      - 'experiments/root_st053/**'
      - '.github/workflows/st053-replay.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/root_st053/**'
      - '.github/workflows/st053-replay.yml'
permissions:
  contents: read
jobs:
  frozen-moment-field:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Test original published artifact and moment identities
        run: |
          python scripts/ns_candidate.py verify
          python -m pytest -q -W error experiments/root_st053/test_moment.py
      - name: Independently replay frozen field and finite core structure
        shell: bash
        run: |
          set +e
          python experiments/root_st053/replay_st053.py --out outputs/ST053-Q --seed 9175391 --validate --structure
          code=$?
          set -e
          test "$code" = 1
          python experiments/root_st053/weak_audit.py outputs/ST053-Q/candidate.json --out outputs/ST053-Q/weak.json
          python - <<'PY'
          import json
          from pathlib import Path
          recorded=json.loads(Path('experiments/root_st053/results.json').read_text())
          expected=next(r for r in recorded['paired_results'] if r['id']=='ST053-Q' and r['seed']==9175391)
          actual=json.loads(Path('outputs/ST053-Q/validation.json').read_text())
          assert actual['pde_validated'] is False and actual['all_numeric_gates_pass'] is False
          assert actual['gates']==expected['gates']
          fine=[r for r in actual['spatial_refinement'] if r['space_step']==.005]
          assert len(fine)==6
          maximum=max(r['momentum_max'] for r in fine)
          l2=max(r['momentum_L2'] for r in fine)
          assert abs(maximum-expected['max'])<1e-5
          assert abs(l2-expected['volume_L2'])<1e-5
          structure=json.loads(Path('outputs/ST053-Q/structure.json').read_text())
          assert structure['source_correspondence_verified'] is False
          for case in structure['cases']:
              for row in case['rows']:
                  for key in ('inward_fraction','positive_swirl_fraction','bipolar_fraction','radial_pressure_inward_fraction','axial_pressure_toward_fraction'):
                      assert row[key]==1.
          assert structure['shear']['sign_reversals']==0
          assert structure['shear']['minimum_signed_ratio_to_P']>=.999
          assert structure['shear']['minimum_signed_ratio_to_S']>=.995
          weak=json.loads(Path('outputs/ST053-Q/weak.json').read_text())
          rows=[r for r in weak['rows'] if r['order']==[80,120]]
          assert len(rows)==6
          assert abs(rows[0]['axial_fraction']-.3198833940436233)<1e-7
          assert abs(rows[0]['weak_L2_lower_estimate']-.004203256891330283)<1e-7
          assert max(abs(r['D']-r['residual_pairing']) for r in rows)<1e-7
          print(maximum,l2,'Frozen field, finite structure and weak moment reproduced; full NS momentum acceptance still FAILED.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST053-Q-independent-replay
          path: outputs/ST053-Q/
          if-no-files-found: error
