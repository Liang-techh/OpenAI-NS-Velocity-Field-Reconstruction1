name: kokuno-agent3-typed-mean-defect-projection

on:
  push:
    branches:
      - codex/kokuno-a3-typed-mean-projector-051
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py"
      - "tests/test_kokuno_typed_mean_defect_projection.py"
      - ".github/workflows/kokuno-agent3-typed-mean-defect-projection.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-typed-mean-defect-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typed-mean-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile typed defect and mean projection
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_kokuno_typed_mean_defect_projection.py
      - name: Emit deterministic typed mean-defect receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_typed_mean_defect_projection
          --output artifacts/kokuno_agent3_typed_mean_defect_projection_v1.json
      - name: Check actual-defect projection truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/kokuno_agent3_typed_mean_defect_projection_v1.json').read_text())
          assert r['schema'] == 'kokuno-a3-typed-mean-defect-projection-v1'
          assert r['provenance']['parent_agent3_pr'] == 654
          assert r['provenance']['parent_agent3_head'] == 'b0c94639b3d4e83ff9c786e0c4f7b68a6bd6dae7'
          q = r['analytic_regression']
          assert q['maximum_theta_mean_error'] <= 2e-12
          assert q['maximum_radial_mean_error'] <= 2e-12
          assert q['maximum_axial_mean_error'] <= 2e-12
          observed = [x['theta_mean'] for x in q['split']['held_in'] + q['split']['held_out']]
          expected = [.20, .34, .27, .41]
          assert all(abs(a-b) <= 2e-12 for a, b in zip(observed, expected))
          b = r['truth_boundary']
          assert b['raw_same_cycle_providers_required'] is True
          assert b['caller_supplied_precomputed_defect_allowed'] is False
          assert b['forbidden_public_parameters_absent'] is True
          assert b['heldin_heldout_ring_points_disjoint'] is True
          assert b['mean_channels_materialized_from_actual_defect'] is True
          assert b['ready_as_typed_input_for_radial_stress_reconstruction'] is True
          assert b['restricted_forcing_semantics_independently_validated_here'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed'] is False
          assert b['pde_validated'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-typed-mean-defect-projection-v1
          path: artifacts/kokuno_agent3_typed_mean_defect_projection_v1.json
          if-no-files-found: error
      - name: Comment exact projection receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_typed_mean_defect_projection_v1.json', 'utf8'));
            const q = r.analytic_regression;
            const lines = [
              '### Kokuno Agent 3 exact-head typed actual-defect mean projection',
              '',
              `max theta-mean error: **${q.maximum_theta_mean_error}**`,
              `max radial-mean error: **${q.maximum_radial_mean_error}**`,
              `max axial-mean error: **${q.maximum_axial_mean_error}**`,
              '',
              'Regression uses u=t*(-y,x,0), u_t=(-y,x,0), p=0, f=0 at t=0, so the nonzero actual defect is R=(-y,x,0) and mean(R_theta)=r. The forcing is fixed zero and independent of the residual. This validates the typed actual-defect -> mean-channel bridge only; it is not a real composite-candidate residual reduction, final held-out normalized NS validation, or blow-up proof.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
