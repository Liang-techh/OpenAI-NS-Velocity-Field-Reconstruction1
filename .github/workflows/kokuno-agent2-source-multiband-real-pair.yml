name: kokuno-agent2-source-multiband-real-pair

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_multiband_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_band_covering.py'
      - 'src/openai_ns_reconstruction/kokuno_source_support_localized_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'tests/test_constrained_kokuno_source_multiband_real_pair_family.py'
      - 'tests/test_constrained_kokuno_source_band_covering.py'
      - 'tests/test_constrained_kokuno_bounded_family_coefficients.py'
      - '.github/workflows/kokuno-agent2-source-multiband-real-pair.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_source_multiband_real_pair_family.py'
      - 'src/openai_ns_reconstruction/kokuno_source_band_covering.py'
      - 'src/openai_ns_reconstruction/kokuno_source_support_localized_curl.py'
      - 'src/openai_ns_reconstruction/kokuno_bounded_family_coefficients.py'
      - 'tests/test_constrained_kokuno_source_multiband_real_pair_family.py'
      - 'tests/test_constrained_kokuno_source_band_covering.py'
      - 'tests/test_constrained_kokuno_bounded_family_coefficients.py'
      - '.github/workflows/kokuno-agent2-source-multiband-real-pair.yml'

permissions:
  contents: read

jobs:
  source-multiband-real-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused source-scheduled multi-band tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_source_multiband_real_pair_family.py
          tests/test_constrained_kokuno_source_band_covering.py
          tests/test_constrained_kokuno_bounded_family_coefficients.py
