name: kokuno-agent3-radial-aware-damping-holdout

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_radial_aware_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_spacetime_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_quadratic_covariance_gain_guard.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_force_completeness_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_force_spacetime_envelope.py'
      - 'tests/test_constrained_kokuno_radial_aware_damping_holdout.py'
      - 'tests/test_constrained_kokuno_spacetime_damping_holdout.py'
      - 'tests/test_constrained_kokuno_radial_force_completeness_audit.py'
      - '.github/workflows/kokuno-agent3-radial-aware-damping-holdout.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_radial_aware_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_spacetime_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_quadratic_covariance_gain_guard.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_force_completeness_audit.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_force_spacetime_envelope.py'
      - 'tests/test_constrained_kokuno_radial_aware_damping_holdout.py'
      - 'tests/test_constrained_kokuno_spacetime_damping_holdout.py'
      - 'tests/test_constrained_kokuno_radial_force_completeness_audit.py'
      - '.github/workflows/kokuno-agent3-radial-aware-damping-holdout.yml'

permissions:
  contents: read

jobs:
  radial-aware-damping-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused radial-aware holdout tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_radial_aware_damping_holdout.py
          tests/test_constrained_kokuno_spacetime_damping_holdout.py
          tests/test_constrained_kokuno_radial_force_completeness_audit.py
      - name: Real-defect radial-aware frozen-damping report
        run: >-
          python -m openai_ns_reconstruction.kokuno_radial_aware_damping_holdout
          --output artifacts/kokuno_agent3/radial_aware_damping_holdout_report.json
          --parent-output artifacts/kokuno_agent3/radial_aware_damping_parent_431.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-radial-aware-damping-holdout
          path: |
            artifacts/kokuno_agent3/radial_aware_damping_holdout_report.json
            artifacts/kokuno_agent3/radial_aware_damping_parent_431.json
