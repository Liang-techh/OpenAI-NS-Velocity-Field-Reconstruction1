name: kokuno-agent4-common-scalar-refutation-independent-audit

on:
  push:
    branches:
      - kokuno-agent4/current-common-scalar-refutation-audit-130
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a4_common_scalar_refutation_independent_audit.py"
      - "tests/test_constrained_kokuno_a4_common_scalar_refutation_independent_audit.py"
      - ".github/workflows/kokuno-agent4-common-scalar-refutation-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact A1 ancestry and minimal scope
        shell: bash
        run: |
          set -euo pipefail
          parent=7e987ff0a3bea743fe3f0fe9d02d5b3c8c593ea3
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-list --count "$parent"..HEAD)" -eq 3
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent4-common-scalar-refutation-independent-audit.yml"
            "src/openai_ns_reconstruction/kokuno_a4_common_scalar_refutation_independent_audit.py"
            "tests/test_constrained_kokuno_a4_common_scalar_refutation_independent_audit.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Compile A4 validator and focused regression
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_a4_common_scalar_refutation_independent_audit.py
          python -m py_compile tests/test_constrained_kokuno_a4_common_scalar_refutation_independent_audit.py

      - name: Materialize save-reloaded candidate and raw independent receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kokuno_agent4_common_scalar_refutation_independent_audit
          python - <<'PY'
          import json
          import traceback
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_a4_common_scalar_refutation_independent_audit import (
              TASK,
              UPSTREAM_HEAD,
              audit_loaded_common_scalar_refutation,
              default_candidate,
          )
          from openai_ns_reconstruction.kokuno_current_bridge_common_scalar_refutation import (
              KokunoCurrentBridgeCommonScalarRefutation,
          )

          root = Path("artifacts/kokuno_agent4_common_scalar_refutation_independent_audit")
          candidate_path = root / "candidate.json"
          report_path = root / "independent_report.json"
          candidate = default_candidate()
          candidate.save_configuration(candidate_path)
          loaded = KokunoCurrentBridgeCommonScalarRefutation.load_configuration(candidate_path)
          try:
              report = audit_loaded_common_scalar_refutation(loaded, candidate)
          except Exception as exc:
              report = {
                  "schema": "kokuno-a4-common-scalar-refutation-independent-audit-exception-v1",
                  "task": TASK,
                  "upstream_head": UPSTREAM_HEAD,
                  "candidate_semantic_sha256": loaded.semantic_sha256,
                  "audit_exception_type": type(exc).__name__,
                  "audit_exception": str(exc),
                  "traceback": traceback.format_exc(),
                  "pde_validated": False,
              }
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True, allow_nan=False))
          PY

      - name: Upload raw candidate and independent receipt before enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-common-scalar-refutation-independent-audit
          path: artifacts/kokuno_agent4_common_scalar_refutation_independent_audit/

      - name: Run parent and A4 focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_current_bridge_common_scalar_refutation.py \
            tests/test_constrained_kokuno_a4_common_scalar_refutation_independent_audit.py

      - name: Enforce preregistered K4-VAL-130 gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_a4_common_scalar_refutation_independent_audit import (
              enforce_preregistered_gates,
              public_api_has_no_scientific_tuning_knobs,
          )

          path = Path(
              "artifacts/kokuno_agent4_common_scalar_refutation_independent_audit/"
              "independent_report.json"
          )
          report = json.loads(path.read_text(encoding="utf-8"))
          if "audit_exception" in report:
              raise AssertionError(
                  f"K4-VAL-130 audit raised {report.get('audit_exception_type')}: "
                  f"{report['audit_exception']}"
              )
          enforce_preregistered_gates(report)
          assert public_api_has_no_scientific_tuning_knobs() is True
          truth = report["truth_boundary"]
          assert truth["full_eta_interval_target_totality_established"] is False
          assert truth["full_eta_interval_root_uniqueness_established"] is False
          assert truth["full_eta_interval_transversality_established"] is False
          assert truth["smooth_eta_target_time_map_established"] is False
          assert truth["full_eta_interval_common_scalar_bridge_length_established"] is False
          assert truth["current_l_minus_h_matching_bridge_materialized"] is False
          assert truth["eta_dependent_cartesian_matching_boundary_materialized"] is False
          assert truth["complete_ns_admission_ready"] is False
          assert truth["pde_validated"] is False
          assert report["final_project_admission_ready"] is False
          assert report["gates"]["final_project_momentum_gate_unchanged"] == 1.0e-3
          assert report["gates"]["final_project_divergence_gate_unchanged"] == 1.0e-5
          assert report["gates"]["final_project_quadrature_unchanged"] == [24, 48, 96]
          PY
