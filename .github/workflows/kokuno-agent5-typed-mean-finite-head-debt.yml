name: kokuno-agent5-typed-mean-finite-head-debt

on:
  push:
    branches:
      - codex/kokuno-a5-integrate-typed-mean-debt
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py"
      - "src/openai_ns_reconstruction/kokuno_compact_radial_stress_adapter.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py"
      - "src/openai_ns_reconstruction/kokuno_autonomous_finite_head_factor_adapter.py"
      - "src/openai_ns_reconstruction/kokuno_typed_mean_finite_head_debt.py"
      - "tests/test_kokuno_typed_mean_radial_stress.py"
      - "tests/test_kokuno_typed_mean_finite_head_debt.py"
      - ".github/workflows/kokuno-agent5-typed-mean-finite-head-debt.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent5-typed-mean-finite-head-debt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-a5-typed-mean-finite-head-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile A5 typed actual-defect to finite-head chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_typed_mean_defect_projection.py
          src/openai_ns_reconstruction/kokuno_compact_radial_stress_adapter.py
          src/openai_ns_reconstruction/kokuno_typed_mean_radial_stress.py
          src/openai_ns_reconstruction/kokuno_autonomous_finite_head_factor_adapter.py
          src/openai_ns_reconstruction/kokuno_typed_mean_finite_head_debt.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_kokuno_typed_mean_radial_stress.py
          tests/test_kokuno_typed_mean_finite_head_debt.py
      - name: Emit deterministic A5 typed finite-head mean-debt receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_typed_mean_finite_head_debt
          --output artifacts/kokuno_agent5_typed_mean_finite_head_debt_v1.json
      - name: Check no-surrogate handoff and fail-closed truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/kokuno_agent5_typed_mean_finite_head_debt_v1.json').read_text())
          assert r['schema'] == 'kokuno-a5-typed-mean-finite-head-debt-v1'
          assert r['provenance']['upstream_agent3_pr'] == 686
          assert r['provenance']['upstream_agent3_head'] == 'df05669aaee94cd8de2463a35c99a73c476118c1'
          assert r['provenance']['parent_a5_pr'] == 679
          assert r['provenance']['parent_a5_head'] == 'b97907632d5d9255045faa530eb00b8849cc25ac'
          q = r['analytic_regression']
          assert abs(q['autonomous_missing_weight'] - 0.28410624176179694) <= 5e-15
          assert abs(q['debt_to_requested_stress_rms_ratio'] - q['autonomous_missing_weight']) <= 2e-15
          d = q['evaluation']['finite_head_mean_debt']
          assert d['requested_stress_rms'] > 0.0
          assert d['debt_rms'] > 0.0
          assert d['identity_closure_max_abs'] <= 1e-14
          f = q['evaluation']['autonomous_factor']
          assert f['profile_is_repository_autonomous'] is True
          assert f['integration_adapter_only'] is True
          assert f['formal_theorem_machine_bump_identity_claimed'] is False
          assert f['formal_missing_weight_equality_claimed'] is False
          b = r['truth_boundary']
          assert b['raw_same_cycle_providers_required'] is True
          assert b['caller_supplied_precomputed_defect_allowed'] is False
          assert b['caller_supplied_mean_source_allowed'] is False
          assert b['caller_supplied_stress_allowed'] is False
          assert b['caller_supplied_finite_head_factor_allowed'] is False
          assert b['forbidden_public_parameters_absent'] is True
          assert b['typed_actual_stress_fed_directly_to_frozen_finite_head_factor'] is True
          assert b['typed_actual_state_finite_head_debt_executable'] is True
          assert b['integration_adapter_only'] is True
          assert b['formal_theorem_machine_bump_identity_claimed'] is False
          assert b['formal_missing_weight_materialized'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['full_same_cycle_composite_requested_stress_materialized'] is False
          assert b['candidate_finite_head_mean_debt_materialized'] is False
          assert b['signed_mean_inverse_input_ready'] is False
          assert b['public_velocity_correction_materialized'] is False
          assert b['real_candidate_finite_correction_cycle_run'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed'] is False
          assert b['pde_validated'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-typed-mean-finite-head-debt-v1
          path: artifacts/kokuno_agent5_typed_mean_finite_head_debt_v1.json
          if-no-files-found: error
