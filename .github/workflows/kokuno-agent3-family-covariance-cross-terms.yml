name: kokuno-agent3-family-covariance-cross-terms

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_family_covariance_cross_terms.py'
      - 'src/openai_ns_reconstruction/kokuno_velocity_column_preflight.py'
      - 'src/openai_ns_reconstruction/kokuno_covariance_tangent_preflight.py'
      - 'src/openai_ns_reconstruction/kokuno_missing_covariance_column_target.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'tests/test_constrained_kokuno_family_covariance_cross_terms.py'
      - '.github/workflows/kokuno-agent3-family-covariance-cross-terms.yml'

permissions:
  contents: read

jobs:
  family-covariance-cross-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_family_covariance_cross_terms.py
          tests/test_constrained_kokuno_velocity_column_preflight.py
          tests/test_constrained_kokuno_covariance_tangent_preflight.py
      - name: Measure real one-label family calibration
        run: >-
          python -m openai_ns_reconstruction.kokuno_family_covariance_cross_terms
          --output artifacts/kokuno_agent3/family_covariance_cross_terms_report.json
          --target-output artifacts/kokuno_agent3/family_covariance_cross_terms_target.json
      - name: Show report
        run: cat artifacts/kokuno_agent3/family_covariance_cross_terms_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-family-covariance-cross-terms
          path: |
            artifacts/kokuno_agent3/family_covariance_cross_terms_report.json
            artifacts/kokuno_agent3/family_covariance_cross_terms_target.json
