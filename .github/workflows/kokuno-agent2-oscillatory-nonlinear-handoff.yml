name: kokuno-agent2-oscillatory-nonlinear-handoff

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_nonlinear_handoff.py'
      - 'tests/test_constrained_kokuno_oscillatory_nonlinear_handoff.py'
      - '.github/workflows/kokuno-agent2-oscillatory-nonlinear-handoff.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert pinned A2 ancestry
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 4a78b06afbab95c108c184a32cb5951e66f42991 HEAD
          test "$(git rev-parse 4a78b06afbab95c108c184a32cb5951e66f42991:src/openai_ns_reconstruction/kokuno_oscillatory_transport_handoff.py)" = "57932afda3b65e4cb63e9ae7c8ceeb0aba141cc5"
          test "$(git rev-parse HEAD:src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_full_advection.py)" = "e44ccbe993d08951f48cfb5b093ee02ea5642dcf"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_oscillatory_nonlinear_handoff.py
          tests/test_constrained_kokuno_oscillatory_transport_handoff.py

      - name: Fetch exact Agent-1 strict-inner backend
        run: |
          git fetch origin 300919075c07396e4e466f553be78eaae0707df2
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" 300919075c07396e4e466f553be78eaae0707df2
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD)" = "300919075c07396e4e466f553be78eaae0707df2"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = "5076ffa69748c2d7e68289a155b67288eab6dab4"

      - name: Exact strict-inner nonlinear attribution receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, subprocess, sys
          from pathlib import Path
          import numpy as np
          from openai_ns_reconstruction.kokuno_oscillatory_nonlinear_handoff import (
              KokunoOscillatoryNonlinearHandoff, public_contract,
          )

          a1 = Path(os.environ['A1_WORKTREE'])
          server = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous
          field=KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              q=json.loads(line); op=q['op']
              if op=='meta': out={'field_sha256':field.field_sha256}
              elif op=='forward':
                  r=field.field.cartesian_from_similarity(np.asarray(q['X']),np.asarray(q['eta']),np.asarray(q['t']),np.asarray(q['theta']))
                  out={k:np.asarray(r[k],dtype=float).tolist() for k in ('x','y','z','t')}
              else:
                  r=getattr(field,op)(np.asarray(q['x']),np.asarray(q['y']),np.asarray(q['z']),np.asarray(q['t']))
                  out={'value':np.asarray(r,dtype=float).tolist()}
              print(json.dumps(out,sort_keys=True),flush=True)
          '''
          env=os.environ.copy(); env['PYTHONPATH']=str(a1/'src')
          p=subprocess.Popen([sys.executable,'-u','-c',server],cwd=a1,env=env,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
          def ask(q):
              p.stdin.write(json.dumps(q,separators=(',',':'))+'\n'); p.stdin.flush()
              line=p.stdout.readline()
              if not line: raise RuntimeError(p.stderr.read())
              return json.loads(line)
          meta=ask({'op':'meta'})
          class Backend:
              field_sha256=meta['field_sha256']
              def _call(self,op,x,y,z,t):
                  x,y,z,t=np.broadcast_arrays(np.asarray(x,dtype=float),np.asarray(y,dtype=float),np.asarray(z,dtype=float),np.asarray(t,dtype=float))
                  return np.asarray(ask({'op':op,'x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})['value'],dtype=float)
              def velocity(self,x,y,z,t): return self._call('velocity',x,y,z,t)
              def velocity_dt(self,x,y,z,t): return self._call('velocity_dt',x,y,z,t)
              def self_advection(self,x,y,z,t): return self._call('self_advection',x,y,z,t)
              def velocity_laplacian(self,x,y,z,t): return self._call('velocity_laplacian',x,y,z,t)

          X=np.asarray([0.178,0.198,0.218,0.238,0.258,0.278],dtype=float)
          eta=np.asarray([-0.24,-0.14,-0.04,0.06,0.16,0.26],dtype=float)
          tt=np.asarray([0.476,0.488,0.500,0.512,0.524,0.536],dtype=float)
          theta=np.asarray([0.37,0.91,1.43,1.97,2.51,-2.77],dtype=float)
          m=ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),'t':tt.tolist(),'theta':theta.tolist()})
          x,y,z,t=(np.asarray(m[k],dtype=float) for k in ('x','y','z','t'))
          h=KokunoOscillatoryNonlinearHandoff(Backend())
          r=h.evaluate(x,y,z,t)
          recon=r.inner_advects_oscillation+r.oscillation_advects_inner+r.oscillatory_self_advection
          closure=float(np.max(np.abs(recon-r.oscillatory_nonlinear_increment)))
          mixed=float(np.max(np.abs(r.mixed_cross_advection-r.inner_advects_oscillation-r.oscillation_advects_inner)))
          def vrms(v):
              v=np.asarray(v,dtype=float); return float(np.sqrt(np.mean(np.sum(v*v,axis=-1))))
          contract=public_contract(); failed=[]
          if closure>5e-13: failed.append('three_piece_closure')
          if mixed>5e-13: failed.append('mixed_closure')
          if vrms(r.oscillatory_nonlinear_increment)<=1e-12: failed.append('aggregate_degenerate')
          if vrms(r.oscillatory_self_advection)<=1e-12: failed.append('quadratic_piece_degenerate')
          if contract['forbidden_evaluate_inputs_present']: failed.append('forbidden_inputs')
          if contract['mean_projection_performed']: failed.append('agent3_mean_lane_crossed')
          if contract['correction_velocity_constructed']: failed.append('agent3_correction_lane_crossed')
          Path('artifacts').mkdir(exist_ok=True)
          receipt={
              'schema':'kokuno-a2-oscillatory-nonlinear-handoff-receipt-v1',
              'parent_agent2_head':'4a78b06afbab95c108c184a32cb5951e66f42991',
              'agent1_reference_head':'300919075c07396e4e466f553be78eaae0707df2',
              'agent1_field_sha256':meta['field_sha256'],
              'handoff_sha256':h.handoff_sha256,
              'source_contract_sha256':h.source_contract_sha256,
              'sample_count':int(x.size),
              'source_X_range':[float(X.min()),float(X.max())],
              'three_piece_closure_abs_max':closure,
              'mixed_closure_abs_max':mixed,
              'inner_advects_oscillation_rms':vrms(r.inner_advects_oscillation),
              'oscillation_advects_inner_rms':vrms(r.oscillation_advects_inner),
              'oscillatory_self_advection_rms':vrms(r.oscillatory_self_advection),
              'aggregate_nonlinear_increment_rms':vrms(r.oscillatory_nonlinear_increment),
              'mean_projection_performed':False,
              'complete_ns_residual':False,
              'same_protocol_st006_comparison_valid':False,
              'paper_exact':False,
              'pde_validated':False,
              'failed_guards':failed,
          }
          Path('artifacts/kokuno_agent2_oscillatory_nonlinear_handoff_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          p.stdin.close(); p.terminate(); p.wait(timeout=10)
          if failed: raise SystemExit('failed guards: '+', '.join(failed))
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-oscillatory-nonlinear-handoff-v1
          path: artifacts/kokuno_agent2_oscillatory_nonlinear_handoff_receipt.json
          if-no-files-found: warn
