name: agent7-st051b-redistribution-headroom
on:
  pull_request:
    paths:
      - 'experiments/root_st051/agent7_st051b_redistribution_headroom.py'
      - 'experiments/root_st051/test_agent7_st051b_redistribution_headroom.py'
      - '.github/workflows/agent7-st051b-redistribution-headroom.yml'
permissions:
  contents: read
jobs:
  headroom-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Focused contract tests
        run: python -m pytest -q -W error experiments/root_st051/test_agent7_st051b_redistribution_headroom.py experiments/root_st051/test_agent7_st051b_frozen_redistribution_transfer.py
      - name: Execute preregistered headroom screen
        run: |
          mkdir -p outputs/agent7-st051b-redistribution-headroom
          python experiments/root_st051/agent7_st051b_redistribution_headroom.py \
            --out outputs/agent7-st051b-redistribution-headroom/report.json
      - name: Verify frozen identity and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/agent7-st051b-redistribution-headroom/report.json').read_text())
          assert r['prereg_issue']==479
          assert r['parent_id']=='ST051-B'
          assert r['parent_head']=='4b784f1b8457af2ead49295631d834d4e882000b'
          assert r['source_profile_pr']==458
          assert r['transfer_pr']==469
          assert abs(r['frozen_profile']['alpha']-2.520520814687742)<1e-15
          assert r['preregistered_gains']==[0.0,0.015,0.025,0.035,0.05]
          assert r['gains_outside_preregistered_grid_evaluated'] is False
          assert r['diagnostic_added_velocity_degrees']==0
          assert r['existing_velocity_degree_screened'] is True
          assert r['canonical_velocity_changed'] is False
          assert r['candidate_artifact_changed'] is False
          assert r['pressure_or_force_changed'] is False
          assert r['held_out_pde_residual_evaluated'] is False
          assert r['material_paths_integrated'] is False
          assert r['public_image_used'] is False
          assert r['production_redistribution_gain_selected'] is False
          assert r['visualization_ready'] is False
          assert r['visual_correspondence_verified'] is False
          assert r['pde_validated'] is False
          assert r['source_correspondence_verified'] is False
          print('first_clean_higher_gain=',r['smallest_preregistered_clean_higher_gain_capacity'])
          for row in r['rows']:
              print('gain',row['gain'],'scale',row['normalization'],'inner/mid/outer',row['angular_gain_r06'],row['angular_gain_r09'],row['angular_gain_r12'],'clean',row['clean_higher_gain_capacity'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-st051b-redistribution-headroom
          path: outputs/agent7-st051b-redistribution-headroom/
          if-no-files-found: error
