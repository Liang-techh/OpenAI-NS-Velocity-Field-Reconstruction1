name: kokuno-agent3-mean-defect-report

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'tests/test_constrained_kokuno_mean_defect.py'
      - 'docs/KOKUNO_MEAN_DEFECT_CONTRACT.md'
      - '.github/workflows/kokuno-agent3-mean-defect-report.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run focused mean-defect contract tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_mean_defect.py tests/test_constrained_kokuno_complete_curl.py
      - name: Generate real-candidate phase-mean defect report
        run: python -m openai_ns_reconstruction.kokuno_mean_defect --points 128
      - name: Show report
        run: cat artifacts/kokuno_agent3/mean_defect_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-mean-defect-report
          path: artifacts/kokuno_agent3/mean_defect_report.json
