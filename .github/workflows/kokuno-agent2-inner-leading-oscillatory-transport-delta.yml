name: kokuno-agent2-inner-leading-oscillatory-transport-delta

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport_delta.py'
      - 'tests/test_constrained_kokuno_public_inner_leading_oscillatory_transport_delta.py'
      - '.github/workflows/kokuno-agent2-inner-leading-oscillatory-transport-delta.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_inner_leading_oscillatory_transport_delta.py

      - name: Verify frozen parent and fetch exact Agent-1 head
        run: |
          test "$(git rev-parse 016e3c152d7d11e4fedcd79b819df337f8942983:src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport.py)" = "d6082ebd346ba8150321bf3d62f104c107a70300"
          git fetch origin e96ee90144976a992b62d76d4361a94eb16bd91e
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-839" e96ee90144976a992b62d76d4361a94eb16bd91e
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-839" rev-parse HEAD)" = "e96ee90144976a992b62d76d4361a94eb16bd91e"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-839" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_laplacian.py)" = "74b0e185e8e0bbb08695d493e0a091c305a03006"

      - name: Exact A1 plus A2 oscillatory transport-delta receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-839
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_transport_delta import (
              AGENT1_LAPLACIAN_BLOB,
              AGENT1_LAPLACIAN_HEAD,
              AGENT1_LAPLACIAN_PR,
              INDEPENDENT_FD4_STEPS,
              PARENT_AGENT2_HEAD,
              PARENT_AGENT2_TRANSPORT_BLOB,
              VISCOSITY,
              evaluate_inner_leading_oscillatory_transport_delta,
              independent_fd4_inner_transport,
              independent_fd4_oscillatory_transport_delta,
              public_contract,
          )

          a1 = Path(os.environ['A1_WORKTREE'])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_laplacian import KokunoPA10CartesianCenterLaplacian
          field = KokunoPA10CartesianCenterLaplacian()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'temporal_derivative_sha256': field.temporal_derivative_sha256,
                      'spatial_derivative_sha256': field.spatial_derivative_sha256,
                      'self_advection_sha256': field.self_advection_sha256,
                      'laplacian_sha256': field.laplacian_sha256,
                      'source_X_interval': list(field.spatial.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op in ('velocity','velocity_dt','self_advection','velocity_laplacian'):
                  method = getattr(field, op)
                  out = method(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''

          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1TransportBackend:
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def _call(self, op, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  out = ask({'op':op,'x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)
              def velocity(self, x, y, z, t):
                  return self._call('velocity', x, y, z, t)
              def velocity_dt(self, x, y, z, t):
                  return self._call('velocity_dt', x, y, z, t)
              def self_advection(self, x, y, z, t):
                  return self._call('self_advection', x, y, z, t)
              def velocity_laplacian(self, x, y, z, t):
                  return self._call('velocity_laplacian', x, y, z, t)

          meta = ask({'op':'meta'})
          if meta['source_X_interval'][1] < 0.39:
              raise RuntimeError('unexpected Agent-1 inner X domain')
          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 time interval')

          # Fresh source-interior probes frozen before observing Actions output.
          X = np.asarray([0.166,0.187,0.208,0.229,0.250,0.271,0.178,0.199,0.220,0.241,0.262,0.286], dtype=float)
          eta = np.asarray([-0.41,-0.29,-0.16,-0.02,0.13,0.26,0.40,0.32,-0.36,-0.21,0.08,0.23], dtype=float)
          t = np.asarray([0.464,0.476,0.488,0.500,0.512,0.524,0.536,0.528,0.516,0.504,0.492,0.480], dtype=float)
          theta = np.asarray([0.29,0.77,1.25,1.73,2.21,2.69,-2.84,-2.36,-1.88,-1.40,-0.92,-0.44], dtype=float)
          forward = ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),'t':t.tolist(),'theta':theta.tolist()})
          x = np.asarray(forward['x'], dtype=float)
          y = np.asarray(forward['y'], dtype=float)
          z = np.asarray(forward['z'], dtype=float)
          tt = np.asarray(forward['t'], dtype=float)

          backend = ExactAgent1TransportBackend()
          production = evaluate_inner_leading_oscillatory_transport_delta(
              backend, x, y, z, tt
          )
          independent_inner = [
              independent_fd4_inner_transport(backend, x, y, z, tt, step=h)
              for h in INDEPENDENT_FD4_STEPS
          ]
          independent_delta = [
              independent_fd4_oscillatory_transport_delta(
                  backend, x, y, z, tt, step=h
              )
              for h in INDEPENDENT_FD4_STEPS
          ]

          def vrms(a):
              a = np.asarray(a, dtype=float)
              return float(np.sqrt(np.mean(np.sum(a*a, axis=-1))))

          def relative_rms(reference, candidate):
              return vrms(np.asarray(reference)-np.asarray(candidate)) / max(
                  vrms(reference), np.finfo(float).tiny
              )

          def relative_max(reference, candidate):
              reference=np.asarray(reference,dtype=float)
              candidate=np.asarray(candidate,dtype=float)
              return float(
                  np.max(np.linalg.norm(reference-candidate,axis=-1))
                  / max(np.max(np.linalg.norm(reference,axis=-1)), np.finfo(float).tiny)
              )

          delta_reference = np.asarray(production.oscillatory_transport_increment, dtype=float)
          inner_reference = np.asarray(production.inner_leading_transport, dtype=float)
          total_reference = np.asarray(production.inner_plus_oscillatory_transport, dtype=float)

          coarse_diff = vrms(independent_delta[0]-independent_delta[1])
          fine_diff = vrms(independent_delta[1]-independent_delta[2])
          delta_refinement = coarse_diff / max(fine_diff, np.finfo(float).tiny)
          delta_finest_rms = relative_rms(delta_reference, independent_delta[-1])
          delta_finest_max = relative_max(delta_reference, independent_delta[-1])
          inner_finest_rms = relative_rms(inner_reference, independent_inner[-1])
          inner_finest_max = relative_max(inner_reference, independent_inner[-1])

          before_after_closure = float(np.max(np.abs(
              total_reference - inner_reference - delta_reference
          )))
          decomposition_closure = float(np.max(np.abs(
              delta_reference
              - production.oscillatory_time_increment
              - production.oscillatory_nonlinear_increment
              - production.oscillatory_viscous_increment
          )))
          velocity_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_velocity
              - production.inner_leading_velocity
              - production.oscillatory_velocity
          )))

          inner_rms = vrms(inner_reference)
          total_rms = vrms(total_reference)
          delta_rms = vrms(delta_reference)
          transport_rms_ratio = total_rms / max(inner_rms, np.finfo(float).tiny)

          failed=[]
          if delta_refinement < 3.0: failed.append('delta_independent_fd4_refinement')
          if delta_finest_rms > 5.0e-2: failed.append('delta_finest_relative_rms')
          if delta_finest_max > 1.0e-1: failed.append('delta_finest_relative_sampled_max')
          if inner_finest_rms > 2.0e-2: failed.append('inner_finest_relative_rms')
          if inner_finest_max > 5.0e-2: failed.append('inner_finest_relative_sampled_max')
          if delta_rms < 1.0e-10: failed.append('oscillatory_increment_nontrivial')
          if inner_rms < 1.0e-10: failed.append('inner_transport_nontrivial')
          if before_after_closure > 5.0e-13: failed.append('before_after_closure')
          if decomposition_closure > 5.0e-13: failed.append('increment_decomposition_closure')
          if velocity_closure > 1.0e-14: failed.append('velocity_additive_closure')

          contract=public_contract()
          if contract['forbidden_public_inputs_present']: failed.append('forbidden_public_inputs')
          if contract['viscosity'] != 0.01: failed.append('viscosity_drift')
          truth=contract['truth_boundary']
          required_false=(
              'diagnostic_is_complete_ns_residual','matched_pressure_included',
              'restricted_forcing_included','correction_velocity_included',
              'inner_leading_is_final_corrected_fixed_point','global_leading_velocity_materialized',
              'outer_join_materialized','agent3_mean_radial_chain_reimplemented',
              'complete_kokuno_candidate_assembled','heldout_ns_residual_assessed',
              'st006_same_protocol_comparison_valid','residual_reduction_claimed',
              'paper_exact','pde_validated',
          )
          if any(truth[k] for k in required_false): failed.append('truth_boundary_promotion')

          receipt={
              'schema':'kokuno-a2-inner-leading-oscillatory-transport-delta-receipt-v1',
              'parent_agent2_head':PARENT_AGENT2_HEAD,
              'parent_agent2_transport_blob':PARENT_AGENT2_TRANSPORT_BLOB,
              'agent1_pr':AGENT1_LAPLACIAN_PR,
              'agent1_head':AGENT1_LAPLACIAN_HEAD,
              'agent1_source_blob':AGENT1_LAPLACIAN_BLOB,
              'agent1_field_sha256':meta['field_sha256'],
              'agent1_laplacian_sha256':meta['laplacian_sha256'],
              'sample_count':int(x.size),
              'sample_times':sorted({float(v) for v in tt}),
              'source_X_range':[float(np.min(X)),float(np.max(X))],
              'viscosity':VISCOSITY,
              'independent_fd4_steps':list(INDEPENDENT_FD4_STEPS),
              'delta_successive_refinement_ratio':delta_refinement,
              'delta_finest_relative_rms':delta_finest_rms,
              'delta_finest_relative_sampled_max':delta_finest_max,
              'inner_finest_relative_rms':inner_finest_rms,
              'inner_finest_relative_sampled_max':inner_finest_max,
              'inner_transport_rms':inner_rms,
              'inner_plus_oscillatory_transport_rms':total_rms,
              'oscillatory_transport_increment_rms':delta_rms,
              'inner_plus_oscillatory_over_inner_transport_rms_ratio':transport_rms_ratio,
              'oscillation_reduces_pressure_forcing_free_transport_rms':bool(total_rms < inner_rms),
              'before_after_closure_abs_max':before_after_closure,
              'increment_decomposition_closure_abs_max':decomposition_closure,
              'velocity_additive_closure_abs_max':velocity_closure,
              'metric_scope':'strict-inner pressure/forcing-free transport only; not NS residual',
              'same_protocol_st006_comparison_valid':False,
              'failed_guards':failed,
              'truth_boundary':truth,
          }
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/kokuno_agent2_inner_leading_oscillatory_transport_delta_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True)+'\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None: proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if failed:
              raise SystemExit('failed guards: '+', '.join(failed))
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-inner-leading-oscillatory-transport-delta-v1
          path: artifacts/kokuno_agent2_inner_leading_oscillatory_transport_delta_receipt.json
          if-no-files-found: warn
