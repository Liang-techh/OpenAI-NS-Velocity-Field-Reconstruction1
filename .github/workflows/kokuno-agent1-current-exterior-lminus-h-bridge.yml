name: kokuno-agent1-current-exterior-lminus-h-bridge

on:
  push:
    branches:
      - agent1/current-exterior-lminus-h-bridge-20260922
  pull_request:
    paths:
      - src/openai_ns_reconstruction/kokuno_current_exterior_lminus_h_bridge.py
      - tests/test_kokuno_current_exterior_lminus_h_bridge.py
      - .github/workflows/kokuno-agent1-current-exterior-lminus-h-bridge.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact ancestry and bounded delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8503f2ede2dd604392198b31ffdeb79321822a30 HEAD
          changed="$(git diff --name-only 8503f2ede2dd604392198b31ffdeb79321822a30...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/kokuno-agent1-current-exterior-lminus-h-bridge.yml' \
            'src/openai_ns_reconstruction/kokuno_current_exterior_lminus_h_bridge.py' \
            'tests/test_kokuno_current_exterior_lminus_h_bridge.py' | sort)"
          test "$changed" = "$expected"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Syntax compile
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_current_exterior_lminus_h_bridge.py \
            tests/test_kokuno_current_exterior_lminus_h_bridge.py

      - name: Focused regressions
        run: |
          pytest -q \
            tests/test_kokuno_current_exterior_qs_release2_state.py \
            tests/test_kokuno_current_exterior_lminus_h_bridge.py

      - name: Emit deterministic eta-resolved bridge receipt
        run: |
          python - <<'PY'
          import json
          from openai_ns_reconstruction.kokuno_current_exterior_lminus_h_bridge import (
              KokunoCurrentExteriorLMinusHBridge,
          )
          bridge = KokunoCurrentExteriorLMinusHBridge()
          report = bridge.pointwise_target_report()
          print(json.dumps(report, indent=2, sort_keys=True, allow_nan=False))
          truth = bridge.truth_boundary
          assert truth['current_l_minus_h_q_s_transport_materialized'] is True
          assert truth['full_eta_interval_common_scalar_bridge_length_established'] is False
          assert truth['current_l_minus_h_matching_bridge_materialized'] is False
          assert truth['eta_dependent_cartesian_matching_boundary_materialized'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False
          PY
