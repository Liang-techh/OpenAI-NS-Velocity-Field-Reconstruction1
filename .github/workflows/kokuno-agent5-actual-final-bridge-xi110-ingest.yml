name: kokuno-agent5-actual-final-bridge-xi110-ingest

on:
  push:
    branches:
      - codex/kokuno-a5-actual-final-bridge-xi110-ingest-088
  pull_request:
    branches:
      - codex/kokuno-a5-reference-stress-xi110-ingest-087
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_actual_final_bridge_xi110_ingest_contract.py"
      - "tests/test_kokuno_a5_actual_final_bridge_xi110_ingest_contract.py"
      - ".github/workflows/kokuno-agent5-actual-final-bridge-xi110-ingest.yml"

permissions:
  contents: read

jobs:
  actual-final-bridge-xi110-ingest-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Agent-5 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out head, parent ancestry, and bounded diff
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT_HEAD: 44b9349ef07d947d0da7eff053ae2409348374b8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT_HEAD" HEAD
          test "$(git ls-tree "$PARENT_HEAD" -- src/openai_ns_reconstruction/kokuno_a5_reference_stress_xi110_ingest_contract.py | awk '{print $3}')" = "531106d200b4163018f0331537b7bf6706042bd0"
          test "$(git ls-tree "$PARENT_HEAD" -- tests/test_kokuno_a5_reference_stress_xi110_ingest_contract.py | awk '{print $3}')" = "32864416a1270cfacb5cd896a36ecec28a64dda8"
          test "$(git ls-tree "$PARENT_HEAD" -- .github/workflows/kokuno-agent5-reference-stress-xi110-ingest.yml | awk '{print $3}')" = "7fee1034269a6dd7cb2c183c2d5e16ec4c3a285d"
          mapfile -t changed < <(git diff --name-only "$PARENT_HEAD" HEAD | sort)
          expected=(
            ".github/workflows/kokuno-agent5-actual-final-bridge-xi110-ingest.yml"
            "src/openai_ns_reconstruction/kokuno_a5_actual_final_bridge_xi110_ingest_contract.py"
            "tests/test_kokuno_a5_actual_final_bridge_xi110_ingest_contract.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          echo "exact_head=$EXPECTED_HEAD"

      - name: Fetch and verify pinned Agent-1 and Agent-4 actual Xi110 artifacts
        shell: bash
        run: |
          set -euo pipefail
          A1_HEAD=f430f8f97df3bfafce56bf094047c769ecec922d
          A4_HEAD=d090572fdc766626c417cb53b8acc8632b2bdb63
          git fetch --no-tags origin \
            codex/kokuno-a1-actual-final-bridge-xi110-086 \
            codex/kokuno-a4-actual-final-bridge-xi110-independent-audit-088
          test "$(git rev-parse "$A1_HEAD")" = "$A1_HEAD"
          test "$(git rev-parse "$A4_HEAD")" = "$A4_HEAD"
          test "$(git ls-tree "$A1_HEAD" -- src/openai_ns_reconstruction/kokuno_pa10_actual_final_bridge_xi110.py | awk '{print $3}')" = "0cbd49ad0726c1573f2e649c96a3b516d8df053e"
          test "$(git ls-tree "$A1_HEAD" -- tests/test_kokuno_pa10_actual_final_bridge_xi110.py | awk '{print $3}')" = "227d132a7ef1ea74323cfeb6c94f0deda490d3c1"
          test "$(git ls-tree "$A1_HEAD" -- .github/workflows/kokuno-agent1-actual-final-bridge-xi110.yml | awk '{print $3}')" = "99c03716ac33a029931a67bc90d9511401963f89"
          test "$(git ls-tree "$A4_HEAD" -- src/openai_ns_reconstruction/kokuno_a4_actual_final_bridge_xi110_independent_audit.py | awk '{print $3}')" = "afe00af9274408051bb01ec9924ac287c538fe5f"
          test "$(git ls-tree "$A4_HEAD" -- tests/test_constrained_kokuno_a4_actual_final_bridge_xi110_independent_audit.py | awk '{print $3}')" = "0a5de622f718321c74de8733718daf989928a97b"
          test "$(git ls-tree "$A4_HEAD" -- .github/workflows/kokuno-agent4-actual-final-bridge-xi110-independent-audit.yml | awk '{print $3}')" = "2e96ff193b603cd283ac8e342434a0336a9df931"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile and run parent plus actual-bridge Agent-5 contract tests
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a5_actual_final_bridge_xi110_ingest_contract.py \
            tests/test_kokuno_a5_actual_final_bridge_xi110_ingest_contract.py
          python -m pytest -q -W error \
            tests/test_kokuno_a5_reference_stress_xi110_ingest_contract.py \
            tests/test_kokuno_a5_actual_final_bridge_xi110_ingest_contract.py

      - name: Materialize fail-closed Agent-5 actual-bridge ingest receipt
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m openai_ns_reconstruction.kokuno_a5_actual_final_bridge_xi110_ingest_contract \
            --exact-head "$EXACT_HEAD" \
            --output artifacts/kokuno_a5_actual_final_bridge_xi110_ingest_contract.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/kokuno_a5_actual_final_bridge_xi110_ingest_contract.json")
          contract = json.loads(path.read_text(encoding="utf-8"))
          a1 = contract["agent1_actual_final_bridge_xi110"]
          a4 = contract["agent4_actual_final_bridge_audit"]
          seam = contract["actual_final_bridge_ingest_seam"]
          truth = contract["truth_boundary"]
          assert a1["source_coordinate_range"] == [100.0, 110.0]
          assert a1["candidate_side_actual_final_interpolation_materialized"] is True
          assert a1["G_i_registered"] is True
          assert a1["ell_i_registered"] is True
          assert a4["audited_agent1_head"] == a1["head"]
          assert a4["saved_reloaded_public_values_only"] is True
          assert a4["production_derivatives_used_as_reference"] is False
          assert a4["endpoint_safe_independent_method_registered"] is True
          assert a4["actual_final_bridge_independent_a4_audit_registered"] is True
          assert a4["actual_final_bridge_independent_a4_audit_admitted"] is False
          assert a4["actual_Xi_endpoint_derivative_independently_verified"] is False
          assert seam["matching_independent_a4_audit_protocol_registered"] is True
          assert seam["queued_or_unresolved_ci_is_pass"] is False
          assert seam["profile_success_substitutes_for_cartesian_delivery"] is False
          assert truth["actual_final_bridge_independent_a4_audit_registered"] is True
          assert truth["actual_final_bridge_independent_a4_audit_admitted"] is False
          assert truth["actual_inner_to_outer_global_join_materialized"] is False
          assert truth["corrected_global_cartesian_leading_velocity_materialized"] is False
          assert truth["matched_cartesian_pressure_materialized"] is False
          assert truth["restricted_forcing_materialized"] is False
          assert truth["real_agent3_correction_velocity_materialized"] is False
          assert truth["complete_candidate_api_ready"] is False
          assert truth["same_protocol_full_ns_residual_available"] is False
          assert contract["final_gate"]["normalized_momentum_volume_l2"] == 1e-3
          assert contract["final_gate"]["divergence_volume_l2"] == 1e-5
          assert contract["readiness"]["leading_ready"] is False
          assert contract["readiness"]["pde_validated"] is False
          PY

      - name: Upload Agent-5 actual-final-bridge ingest contract
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-a5-actual-final-bridge-xi110-ingest-contract
          path: artifacts/kokuno_a5_actual_final_bridge_xi110_ingest_contract.json
          if-no-files-found: error
