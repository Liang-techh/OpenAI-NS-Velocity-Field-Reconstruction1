name: kokuno-agent5-phi0-profile-ingest-contract

on:
  push:
    branches:
      - codex/kokuno-a5-phi0-profile-ingest-contract-068
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_candidate_artifact_contract.py"
      - "src/openai_ns_reconstruction/kokuno_a5_leading_profile_ingest_contract.py"
      - "src/openai_ns_reconstruction/kokuno_a5_phi0_profile_ingest_contract.py"
      - "tests/test_kokuno_a5_candidate_artifact_contract.py"
      - "tests/test_kokuno_a5_leading_profile_ingest_contract.py"
      - "tests/test_kokuno_a5_phi0_profile_ingest_contract.py"
      - ".github/workflows/kokuno-agent5-phi0-profile-ingest-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-phi0-profile-ingest-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-phi0-profile-ingest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          echo "exact_head=$ACTUAL_HEAD"
      - name: Verify frozen Agent-1 Phi0 source blob
        env:
          AGENT1_HEAD: 1deec8fb36bd9f8058d179ae3e6895f92aa9ecb3
          EXPECTED_BLOB: 43198ab5b10331525820d62191a4e79c0873a735
        run: |
          git fetch --no-tags origin "$AGENT1_HEAD"
          ACTUAL_BLOB="$(git rev-parse "$AGENT1_HEAD:src/openai_ns_reconstruction/kokuno_pa10_phi0_profile_contract.py")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "agent1_phi0_blob=$ACTUAL_BLOB"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile integration seam
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_a5_candidate_artifact_contract.py \
            src/openai_ns_reconstruction/kokuno_a5_leading_profile_ingest_contract.py \
            src/openai_ns_reconstruction/kokuno_a5_phi0_profile_ingest_contract.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_a5_candidate_artifact_contract.py \
            tests/test_kokuno_a5_leading_profile_ingest_contract.py \
            tests/test_kokuno_a5_phi0_profile_ingest_contract.py
      - name: Generate exact-head Phi0 ingest artifact
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python -W error -m openai_ns_reconstruction.kokuno_a5_phi0_profile_ingest_contract \
            --exact-head "$HEAD_SHA" \
            --output artifacts/kokuno_agent5/phi0_profile_ingest_contract_v1/report.json
      - name: Validate frozen evidence and truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent5/phi0_profile_ingest_contract_v1/report.json')
          payload = json.loads(path.read_text())
          exact_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert payload['exact_head'] == exact_head
          assert payload['schema'] == 'kokuno-a5-phi0-profile-ingest-contract-v1'
          assert payload['parent_a5'] == {
              'pr': 772,
              'head': 'bd5e0d11224327f5b1cd674843e17e8f2d45d642',
          }
          binding = payload['agent1_phi0_binding']
          assert binding['pr'] == 778
          assert binding['head'] == '1deec8fb36bd9f8058d179ae3e6895f92aa9ecb3'
          assert binding['source_blob_sha'] == '43198ab5b10331525820d62191a4e79c0873a735'
          assert binding['schema'] == 'kokuno-pa10-phi0-profile-contract-v1'
          assert binding['coordinate_contract']['repository_X_identification_asserted'] is False
          assert binding['coordinate_contract']['physical_F_from_Phi_mapping_resolved'] is False
          assert binding['numerical_realization']['f0_series_terms'] == 64

          assert payload['evidence'] == {
              'agent1_exact_head_ci_passed': False,
              'agent4_phi0_independent_audit_present': False,
              'agent4_phi0_independent_audit_passed': False,
          }
          status = payload['ingest_status']
          assert status['axis_profile_ingest_admitted'] is False
          assert status['typed_phi0_profile_interface_registered'] is True
          assert status['phi0_profile_ingest_admitted'] is False
          assert status['repository_X_to_source_Y_mapping_resolved'] is False
          assert status['physical_F_from_Phi_mapping_resolved'] is False
          assert status['fixed_point_correction_materialized'] is False
          assert status['global_leading_velocity_materialized'] is False
          assert status['leading_ready'] is False

          assert payload['stage_state'] == {
              'leading_ready': False,
              'oscillatory_ready': True,
              'correction_ready': False,
              'velocity_export_ready': False,
              'pde_validated': False,
          }
          assert payload['baseline_vs_kokuno']['kokuno_same_protocol_full_candidate_residual_available'] is False
          assert payload['baseline_vs_kokuno']['comparison_performed'] is False
          assert payload['final_project_gates_unchanged'] == {
              'normalized_momentum_max': 1e-3,
              'normalized_momentum_L2': 1e-3,
              'divergence_max': 1e-5,
              'divergence_L2': 1e-5,
          }
          truth = payload['truth_boundary']
          for key in (
              'queued_or_missing_evidence_promoted',
              'repository_X_identified_with_source_Y',
              'physical_F_from_Phi_mapping_invented',
              'Phi0_promoted_to_final_corrected_Phi',
              'source_native_profile_promoted_to_global_velocity',
              'free_residual_defined_forcing_allowed',
              'threshold_relaxed',
              'kokuno_replay_used_as_final_independent_validation',
              'leading_ready',
              'correction_ready',
              'velocity_export_ready',
              'pde_validated',
          ):
              assert truth[key] is False
          print('artifact_sha256=', hashlib.sha256(path.read_bytes()).hexdigest())
          print('contract_sha256=', payload['contract_sha256'])
          print('exact_head=', exact_head)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-phi0-profile-ingest-contract-v1
          path: artifacts/kokuno_agent5/phi0_profile_ingest_contract_v1/report.json
          if-no-files-found: error
