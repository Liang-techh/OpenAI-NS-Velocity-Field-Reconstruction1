name: kokuno-agent3-strict-inner-transport-mean

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_strict_inner_transport_mean.py'
      - 'tests/test_constrained_kokuno_strict_inner_transport_mean.py'
      - '.github/workflows/kokuno-agent3-strict-inner-transport-mean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: python -m pip install -e '.[dev]'

      - name: Compile and run focused regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_strict_inner_transport_mean.py \
            tests/test_constrained_kokuno_strict_inner_transport_mean.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_strict_inner_transport_mean.py

      - name: Generate mechanics-only receipt
        run: |
          mkdir -p artifacts/kokuno_agent3
          python -m openai_ns_reconstruction.kokuno_strict_inner_transport_mean \
            --output artifacts/kokuno_agent3/strict_inner_transport_mean_mechanics.json

      - name: Fetch exact Agent-2 and Agent-1 heads
        run: |
          set -euo pipefail
          A2_HEAD='016e3c152d7d11e4fedcd79b819df337f8942983'
          A1_HEAD='e96ee90144976a992b62d76d4361a94eb16bd91e'
          git fetch --no-tags --depth=1 origin "$A2_HEAD"
          git fetch --no-tags --depth=1 origin "$A1_HEAD"
          git worktree add --detach "$RUNNER_TEMP/kokuno-a2-840" "$A2_HEAD"
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-839" "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a2-840" rev-parse HEAD)" = "$A2_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-839" rev-parse HEAD)" = "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a2-840" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport.py)" = 'd6082ebd346ba8150321bf3d62f104c107a70300'
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-839" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_laplacian.py)" = '74b0e185e8e0bbb08695d493e0a091c305a03006'

      - name: Build exact A2 runtime with exact A1 PA10 modules
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP"/kokuno-a1-839/src/openai_ns_reconstruction/kokuno_pa10_*.py \
             "$RUNNER_TEMP"/kokuno-a2-840/src/openai_ns_reconstruction/
          test "$(git hash-object "$RUNNER_TEMP/kokuno-a2-840/src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_laplacian.py")" = '74b0e185e8e0bbb08695d493e0a091c305a03006'
          test "$(git hash-object "$RUNNER_TEMP/kokuno-a2-840/src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport.py")" = 'd6082ebd346ba8150321bf3d62f104c107a70300'

      - name: Exact cross-head strict-inner transport mean receipt
        env:
          COMPOSITE_WORKTREE: ${{ runner.temp }}/kokuno-a2-840
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_strict_inner_transport_mean import (
              AGENT1_HEAD,
              AGENT1_SOURCE_BLOB_SHA,
              AGENT2_HEAD,
              AGENT2_SOURCE_BLOB_SHA,
              ANGULAR_ORDERS,
              _materialize_from_transport_provider,
              truth_boundary,
          )

          worktree = Path(os.environ['COMPOSITE_WORKTREE'])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_laplacian import KokunoPA10CartesianCenterLaplacian
          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_transport import evaluate_inner_leading_oscillatory_transport

          inner = KokunoPA10CartesianCenterLaplacian()
          for line in sys.stdin:
              req = json.loads(line)
              op = req['op']
              if op == 'meta':
                  out = {
                      'field_sha256': inner.field_sha256,
                      'laplacian_sha256': inner.laplacian_sha256,
                      'source_X_interval': list(inner.spatial.source_X_interval),
                      'time_interval': list(inner.field.time_interval),
                  }
              elif op == 'forward':
                  mapped = inner.field.cartesian_from_similarity(
                      np.asarray(req['X'], dtype=float),
                      np.asarray(req['eta'], dtype=float),
                      np.asarray(req['t'], dtype=float),
                      np.asarray(req['theta'], dtype=float),
                  )
                  out = {k: np.asarray(mapped[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op == 'transport':
                  x = np.asarray(req['x'], dtype=float)
                  y = np.asarray(req['y'], dtype=float)
                  z = np.asarray(req['z'], dtype=float)
                  t = np.asarray(req['t'], dtype=float)
                  result = evaluate_inner_leading_oscillatory_transport(inner, x, y, z, t)
                  out = {
                      'time': np.asarray(result.inner_plus_oscillatory_velocity_dt, dtype=float).tolist(),
                      'advection': np.asarray(result.inner_plus_oscillatory_self_advection, dtype=float).tolist(),
                      'viscous': np.asarray(result.viscous_term, dtype=float).tolist(),
                      'transport': np.asarray(result.transport, dtype=float).tolist(),
                      'viscosity': float(result.viscosity),
                  }
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(out, sort_keys=True), flush=True)
          '''

          env = os.environ.copy()
          env['PYTHONPATH'] = str(worktree / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=worktree,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('exact cross-head backend exited: ' + proc.stderr.read())
              return json.loads(line)

          meta = ask({'op': 'meta'})
          if meta['source_X_interval'][1] < 0.35:
              raise RuntimeError('unexpected strict-inner X interval')
          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected strict-inner time interval')

          X = np.asarray([0.20, 0.24, 0.28, 0.32, 0.22, 0.30], dtype=float)
          eta = np.asarray([-0.45, -0.20, 0.00, 0.25, 0.42, -0.35], dtype=float)
          tt = np.asarray([0.46, 0.48, 0.50, 0.52, 0.54, 0.50], dtype=float)
          mapped = ask({
              'op': 'forward',
              'X': X.tolist(), 'eta': eta.tolist(), 't': tt.tolist(),
              'theta': np.zeros_like(X).tolist(),
          })
          x0 = np.asarray(mapped['x'], dtype=float)
          y0 = np.asarray(mapped['y'], dtype=float)
          z = np.asarray(mapped['z'], dtype=float)
          t = np.asarray(mapped['t'], dtype=float)
          radius = np.sqrt(x0*x0 + y0*y0)

          def provider(x, y, z, t):
              xb, yb, zb, tb = np.broadcast_arrays(
                  np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                  np.asarray(z, dtype=float), np.asarray(t, dtype=float),
              )
              out = ask({
                  'op': 'transport',
                  'x': xb.tolist(), 'y': yb.tolist(),
                  'z': zb.tolist(), 't': tb.tolist(),
              })
              return (
                  np.asarray(out['time'], dtype=float),
                  np.asarray(out['advection'], dtype=float),
                  np.asarray(out['viscous'], dtype=float),
                  np.asarray(out['transport'], dtype=float),
                  float(out['viscosity']),
              )

          witness = _materialize_from_transport_provider(
              provider, radius, z, t,
              agent1_backend=None,
              agent2_backend=None,
              backend_kind='exact-cross-head-a2-840-plus-a1-839',
          )

          failed = []
          if tuple(witness.angular_orders) != tuple(ANGULAR_ORDERS):
              failed.append('angular_ladder')
          if any(v > 1.0e-5 for v in witness.successive_transport_mean_relative_differences):
              failed.append('angular_convergence')
          if witness.pointwise_component_closure_absolute_max > 5.0e-13:
              failed.append('pointwise_component_closure')
          if witness.projected_component_closure_absolute_max > 1.0e-12:
              failed.append('projected_component_closure')
          if witness.viscosity != 0.01:
              failed.append('viscosity_drift')
          if witness.transport_mean_rms > witness.full_ring_transport_rms + 1.0e-12:
              failed.append('jensen_consistency')
          if witness.transport_mean_to_full_rms_ratio > 1.0 + 1.0e-12:
              failed.append('mean_to_full_ratio')
          if witness.transport_mean_rms < 1.0e-12:
              failed.append('nonzero_transport_mean_floor')

          boundary = truth_boundary()
          required_false = [
              'pressure_gradient_included', 'restricted_forcing_included',
              'correction_transport_included', 'complete_ns_defect',
              'source_center_is_final_corrected_fixed_point',
              'global_corrected_leading_join_materialized',
              'real_agent3_delta_a_bound',
              'mean_correction_velocity_materialized_from_this_witness',
              'real_full_candidate_bound', 'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed', 'residual_reduction_claimed',
              'caller_supplied_residual_allowed', 'caller_supplied_mean_values_allowed',
              'caller_supplied_derivative_resolution_allowed',
              'caller_supplied_scientific_threshold_allowed',
              'pde_validated', 'paper_exact', 'openai_field_identified', 'blowup_proved',
          ]
          if any(boundary[name] for name in required_false):
              failed.append('truth_boundary_promotion')
          if not boundary['strict_inner_pressure_forcing_free_transport_mean_materialized']:
              failed.append('missing_scoped_transport_truth')

          receipt = witness.to_receipt()
          receipt.update({
              'schema': 'kokuno-a3-strict-inner-transport-mean-exact-receipt-v1',
              'exact_agent1_head': AGENT1_HEAD,
              'exact_agent1_source_blob_sha': AGENT1_SOURCE_BLOB_SHA,
              'exact_agent2_head': AGENT2_HEAD,
              'exact_agent2_source_blob_sha': AGENT2_SOURCE_BLOB_SHA,
              'agent1_field_sha256': meta['field_sha256'],
              'agent1_laplacian_sha256': meta['laplacian_sha256'],
              'source_X': X.tolist(),
              'source_eta': eta.tolist(),
              'sample_times': t.tolist(),
              'failed_guards': failed,
              'complete_ns_defect': False,
              'same_protocol_comparable_to_st006': False,
          })
          Path('artifacts/kokuno_agent3').mkdir(parents=True, exist_ok=True)
          out_path = Path('artifacts/kokuno_agent3/strict_inner_transport_mean_exact.json')
          out_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if failed:
              raise SystemExit('failed preregistered guards: ' + ', '.join(failed))

          if proc.stdin is not None:
              proc.stdin.close()
          proc.terminate()
          PY

      - name: Reassert mechanics receipt truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          report = json.loads(Path('artifacts/kokuno_agent3/strict_inner_transport_mean_mechanics.json').read_text())
          assert report['mechanics_only'] is True
          assert report['angular_orders'] == [32, 64, 128]
          assert report['viscosity'] == 0.01
          np.testing.assert_allclose(report['expected_transport_mean'], [0.415, 0.0, 0.44])
          tb = report['truth_boundary']
          assert tb['complete_ns_defect'] is False
          assert tb['pressure_gradient_included'] is False
          assert tb['restricted_forcing_included'] is False
          assert tb['real_candidate_finite_correction_cycle_run'] is False
          assert tb['heldout_normalized_ns_residual_assessed'] is False
          assert tb['residual_reduction_claimed'] is False
          assert tb['pde_validated'] is False
          assert tb['final_normalized_momentum_gate'] == 1.0e-3
          assert tb['final_normalized_divergence_gate'] == 1.0e-5
          PY

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-strict-inner-transport-mean-v1
          path: artifacts/kokuno_agent3/*.json
          if-no-files-found: warn
