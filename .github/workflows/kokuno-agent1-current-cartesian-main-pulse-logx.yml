name: kokuno-agent1-current-cartesian-main-pulse-logx

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_main_pulse_logx.py"
      - "tests/test_kokuno_pa16_current_cartesian_main_pulse_logx.py"
      - ".github/workflows/kokuno-agent1-current-cartesian-main-pulse-logx.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Authenticate exact #1100 parent
        shell: bash
        run: |
          git merge-base --is-ancestor 2a6c58ff6bf6d1ba6b875bca0e6abf9d1118e156 HEAD
          test "$(git show -s --format=%H 2a6c58ff6bf6d1ba6b875bca0e6abf9d1118e156)" = "2a6c58ff6bf6d1ba6b875bca0e6abf9d1118e156"
          echo "authenticated #1100 parent 2a6c58ff6bf6d1ba6b875bca0e6abf9d1118e156"

      - name: Enforce minimal three-file increment
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only 2a6c58ff6bf6d1ba6b875bca0e6abf9d1118e156...HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent1-current-cartesian-main-pulse-logx.yml"
            "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_main_pulse_logx.py"
            "tests/test_kokuno_pa16_current_cartesian_main_pulse_logx.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_main_pulse_logx.py
          python -m py_compile tests/test_kokuno_pa16_current_cartesian_main_pulse_logx.py

      - name: Run parent and log-X main-pulse regressions
        run: |
          python -m pytest -q \
            tests/test_kokuno_pa16_current_cartesian_main_pulse.py \
            tests/test_kokuno_pa16_current_cartesian_main_pulse_logx.py

      - name: Emit deterministic scoped receipt
        run: |
          mkdir -p artifacts/kokuno_agent1_current_cartesian_main_pulse_logx
          python - <<'PY'
          import copy
          import json
          import math
          import numpy as np
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_main_pulse_logx import (
              KokunoPA16CurrentCartesianMainPulseLogX,
          )

          root = Path("artifacts/kokuno_agent1_current_cartesian_main_pulse_logx")
          candidate = KokunoPA16CurrentCartesianMainPulseLogX()
          receipt = candidate.receipt()
          config = candidate.configuration()
          truth = receipt["truth_boundary"]
          assert truth["overflow_safe_logX_similarity_materialized"] is True
          assert truth["full_source_xi_11_current_cartesian_materialized"] is True
          assert truth["source_exact_amplitude_root_materialized"] is False
          assert truth["source_pulse_end_MJ_corrections_materialized"] is False
          assert truth["pde_validated"] is False
          assert truth["paper_exact"] is False
          assert receipt["log_X_source_end"] > math.log(np.finfo(float).max)
          assert receipt["log_radius_q1_source_end"] < math.log(np.finfo(float).max)

          log_X = candidate.log_X_from_xi(11.0)
          p = candidate.similarity_profile_values_logX(log_X, 0.0)
          assert np.isfinite(float(p["F_current_leading_with_main_pulse_logX"]))
          assert np.isfinite(float(p["M_over_X_current_leading_with_main_pulse_logX"]))

          mutated = copy.deepcopy(config)
          mutated["bound_scope"]["amplitude_role"] = "source_exact"
          try:
              KokunoPA16CurrentCartesianMainPulseLogX.from_configuration(mutated)
          except ValueError:
              pass
          else:
              raise SystemExit("source-exact amplitude mutation did not fail closed")

          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload scoped receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-current-cartesian-main-pulse-logx
          path: artifacts/kokuno_agent1_current_cartesian_main_pulse_logx/
