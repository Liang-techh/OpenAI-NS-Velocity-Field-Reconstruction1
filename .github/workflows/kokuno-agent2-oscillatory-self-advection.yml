name: kokuno-agent2-oscillatory-self-advection

on:
  push:
    branches:
      - codex/kokuno-a2-oscillatory-self-advection-055
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_self_advection.py"
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py"
      - "src/openai_ns_reconstruction/kokuno_public_z_pullback_velocity.py"
      - "tests/test_constrained_kokuno_public_oscillatory_self_advection.py"
      - ".github/workflows/kokuno-agent2-oscillatory-self-advection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent2-oscillatory-self-advection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oscillatory-self-advection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile frozen oscillatory nonlinear seam
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_public_oscillatory_vorticity_diagnostic.py
          src/openai_ns_reconstruction/kokuno_public_oscillatory_self_advection.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_oscillatory_vorticity_diagnostic.py
          tests/test_constrained_kokuno_public_oscillatory_self_advection.py
      - name: Generate immutable self-advection receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_public_oscillatory_self_advection
          --output artifacts/kokuno_agent2_public_oscillatory_self_advection_v1.json
      - name: Check preregistered gates and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent2_public_oscillatory_self_advection_v1.json')
          r = json.loads(p.read_text())
          assert r['schema'] == 'kokuno-a2-public-oscillatory-self-advection-v1'
          assert r['sample_count'] == 18
          assert r['sample_times'] == [0.42, 0.50, 0.58]
          assert r['gradient_fd6_step'] == 0.001
          assert r['directional_fd4_steps'] == [0.008, 0.004, 0.002]
          assert r['failed_guards'] == []
          assert r['self_advection_rms'] >= 1.0e-8
          assert min(r['directional_refinement_ratios']) >= 8.0
          assert r['directional_relative_rms'][-1] <= 1.0e-3
          assert r['directional_relative_sampled_max'][-1] <= 2.0e-3
          assert r['manufactured_algebra']['absolute_max_error'] <= 1.0e-14
          assert r['support_exterior_absolute_max'] <= 1.0e-12
          t = r['truth_boundary']
          assert t['oscillatory_velocity_candidate_changed'] is False
          assert t['amplitude_phase_carrier_support_retuned'] is False
          assert t['self_advection_executable'] is True
          assert t['self_advection_is_ns_residual'] is False
          assert t['agent3_mean_radial_chain_reimplemented'] is False
          assert t['agent3_mean_defect_contract_emitted'] is False
          assert t['real_global_leading_field_bound'] is False
          assert t['full_composite_velocity_available'] is False
          assert t['heldout_ns_momentum_residual_assessed'] is False
          assert t['residual_reduction_claimed'] is False
          assert t['paper_exact'] is False
          assert t['pde_validated'] is False
          print('oscillatory_self_advection=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-public-oscillatory-self-advection-v1
          path: artifacts/kokuno_agent2_public_oscillatory_self_advection_v1.json
          if-no-files-found: error
