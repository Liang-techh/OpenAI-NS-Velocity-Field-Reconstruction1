name: kokuno-agent4-pa10-source-algebraic-slots-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-algebraic-ordinary-slots-independent-audit-057
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-source-algebraic-slots-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-source-algebraic-slots-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_algebraic_ordinary_slots.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_algebraic_slots_independent_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_algebraic_ordinary_slots.py \
            tests/test_constrained_kokuno_pa10_source_algebraic_slots_independent_audit.py
      - name: Generate exact-head independent receipt
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_algebraic_slots_independent_audit \
            --output artifacts/kokuno_agent4/pa10_source_algebraic_slots_audit/report.json \
            --pr-head "$HEAD_SHA" \
            --checkout-head "$HEAD_SHA"
      - name: Bind exact head and enforce truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_source_algebraic_slots_audit/report.json')
          payload = json.loads(path.read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert payload['pr_head'] == head
          assert payload['checkout_head'] == head
          assert payload['source_R2_algebraic_ordinary_slots_independent_preflight_passed'] is True
          assert payload['failed_guards'] == []
          axis = payload['fresh_axis_value_audit']
          assert axis['value_path_passed'] is True
          assert axis['value_path_mutation_detected'] is True
          mutation = payload['mutation']
          assert all(mutation['multiplier_0p999_detected'].values())
          assert all(mutation['numerator_0p99_detected'].values())
          assert all(mutation['post_J1_0p99_detected'].values())
          assert mutation['axis_value_slope_mutation_detected'] is True
          truth = payload['truth_boundary']
          assert truth['source_R2_algebraic_ordinary_slots_independently_audited'] is True
          assert truth['all_R2_ordinary_slots_source_bound'] is False
          assert truth['all_R2_ordinary_slots_independently_audited'] is False
          assert truth['all_R1_ordinary_slots_source_bound'] is False
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['formal_full_domain_pde_gate_assessed'] is False
          assert truth['pde_validated'] is False
          assert payload['latest_agent1_derivative_R2_subset_independently_audited_here'] is False
          gates = payload['final_project_gates_unchanged']
          assert gates['normalized_momentum_max'] == 1e-3
          assert gates['normalized_momentum_L2'] == 1e-3
          assert gates['divergence_max'] == 1e-5
          assert gates['divergence_L2'] == 1e-5
          raw = path.read_bytes()
          print('artifact_file_sha256=', hashlib.sha256(raw).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('ratios=', payload['public_to_independent_ratios'])
          print('axis=', payload['fresh_axis_value_audit'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-source-algebraic-slots-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_source_algebraic_slots_audit/report.json
