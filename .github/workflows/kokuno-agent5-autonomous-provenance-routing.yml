name: kokuno-agent5-autonomous-provenance-routing
on:
  push:
    branches: [codex/kokuno-a5-autonomous-provenance-routing-033]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_actual_mean_factor_dependency.py tests/test_constrained_kokuno_autonomous_provenance_routing_checkpoint.py
      - name: Generate checkpoint
        run: python -m openai_ns_reconstruction.kokuno_autonomous_provenance_routing_checkpoint --output artifacts/kokuno_agent5/autonomous_provenance_routing_checkpoint_v33/checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-autonomous-provenance-routing-checkpoint-v33
          path: artifacts/kokuno_agent5/autonomous_provenance_routing_checkpoint_v33
          if-no-files-found: error
