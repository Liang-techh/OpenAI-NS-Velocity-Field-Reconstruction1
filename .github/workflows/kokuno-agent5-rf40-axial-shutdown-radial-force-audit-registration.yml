name: kokuno-agent5-rf40-axial-shutdown-radial-force-audit-registration

on:
  push:
    branches:
      - codex/kokuno-a5-rf40-axial-shutdown-radial-force-audit-reg-103
  pull_request:
    branches:
      - codex/kokuno-a5-rf40-axial-shutdown-radial-force-ingest-102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact A5 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 931bf8ae11c7ed0f7118c2f868a657d2ee16863b HEAD
          test "$(git rev-list --count 931bf8ae11c7ed0f7118c2f868a657d2ee16863b..HEAD)" -eq 4
          mapfile -t files < <(git diff --name-only 931bf8ae11c7ed0f7118c2f868a657d2ee16863b..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent5-rf40-axial-shutdown-radial-force-audit-registration.yml \
            src/openai_ns_reconstruction/kokuno_a5_rf40_axial_shutdown_radial_force_audit_registration.py \
            tests/test_kokuno_a5_rf40_axial_shutdown_radial_force_audit_registration.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run parent and current Agent-5 contract tests
        run: |
          pytest -q -W error \
            tests/test_kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract.py \
            tests/test_kokuno_a5_rf40_axial_shutdown_radial_force_audit_registration.py

      - name: Authenticate exact parent, A3 and A4 source/test/workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local commit="$1" path="$2" expected="$3"
            git fetch --no-tags origin "$commit" >/dev/null 2>&1 || true
            actual="$(git rev-parse "${commit}:${path}")"
            test "$actual" = "$expected" || { echo "blob mismatch for $commit:$path: $actual != $expected"; exit 1; }
          }
          check_blob 931bf8ae11c7ed0f7118c2f868a657d2ee16863b src/openai_ns_reconstruction/kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract.py 3bcdb6f3b3d1ee16f6e4c9e2bd53590bf9bbdb51
          check_blob 931bf8ae11c7ed0f7118c2f868a657d2ee16863b tests/test_kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract.py 5181287fe5db7244a8c9146292c024c69f995b7a
          check_blob 931bf8ae11c7ed0f7118c2f868a657d2ee16863b .github/workflows/kokuno-agent5-rf40-axial-shutdown-radial-force-ingest.yml fa140eff1ed63b0fa4cde1a8e5fae5442982d7bb
          check_blob 93200f28deae4372c2338e0620b785543af892d4 src/openai_ns_reconstruction/kokuno_current_rf40_axial_shutdown_nonlinear_radial_force.py 222e75ab5ecb1f0625ed3b25d4e2defe6f780b8f
          check_blob 6865031eb5084d2bcbfe6832c23c73b22b2f8c21 src/openai_ns_reconstruction/kokuno_a4_current_rf40_axial_shutdown_radial_force_independent_audit.py 9dc41bcc1bacffb714acbcaada0ab64423c8d446
          check_blob 6865031eb5084d2bcbfe6832c23c73b22b2f8c21 tests/test_constrained_kokuno_a4_current_rf40_axial_shutdown_radial_force_independent_audit.py 9f1aa8ae19fc711845bb4662207bc2cc3e15b154
          check_blob 6865031eb5084d2bcbfe6832c23c73b22b2f8c21 .github/workflows/kokuno-agent4-current-rf40-axial-shutdown-radial-force-independent-audit.yml 45e3c611a1da5e05d7a37f25f82204c3f0929c5f

      - name: Materialize frozen integration receipt
        run: |
          mkdir -p artifacts/kokuno-agent5
          python -m openai_ns_reconstruction.kokuno_a5_rf40_axial_shutdown_radial_force_audit_registration \
            --output artifacts/kokuno-agent5/rf40_axial_shutdown_radial_force_audit_registration.json
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction import kokuno_a5_rf40_axial_shutdown_radial_force_audit_registration as c
          p = Path('artifacts/kokuno-agent5/rf40_axial_shutdown_radial_force_audit_registration.json')
          receipt = json.loads(p.read_text())
          c.enforce_registration_receipt(receipt)
          r = receipt['registration']
          assert r['agent4_radial_force_audit']['pr'] == 1023
          assert r['agent4_radial_force_audit']['audited_agent3_pr'] == 1022
          assert r['truth_boundary']['agent4_dedicated_axial_shutdown_radial_force_audit_present'] is True
          assert r['truth_boundary']['agent4_independent_axial_shutdown_radial_force_audit_registered'] is True
          assert r['truth_boundary']['agent4_independent_axial_shutdown_radial_force_audit_admitted'] is False
          assert r['truth_boundary']['scoped_axial_shutdown_radial_force_authorized_as_ns_correction_target'] is False
          assert r['readiness']['correction_ready'] is False
          assert r['readiness']['pde_validated'] is False
          assert r['frozen_science']['residual_defined_free_forcing_forbidden'] is True
          PY

      - name: Upload registration receipt before any future scientific admission
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-rf40-axial-shutdown-radial-force-audit-registration
          path: artifacts/kokuno-agent5/rf40_axial_shutdown_radial_force_audit_registration.json
          if-no-files-found: error
