name: kokuno-agent5-disjoint-validation-routing

on:
  push:
    branches:
      - codex/kokuno-a5-disjoint-validation-routing-026
  pull_request:
    branches:
      - codex/kokuno-a3-damping-holdout-transfer-024
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-disjoint-validation-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-3/5 disjoint-validation tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_spacetime_damping_holdout.py
          tests/test_constrained_kokuno_disjoint_validation_routing_checkpoint.py
      - name: Generate deterministic Agent-5 checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_disjoint_validation_routing_checkpoint
          --output artifacts/kokuno_agent5/disjoint_validation_routing_checkpoint_v26/checkpoint.json
      - name: Show checkpoint
        run: cat artifacts/kokuno_agent5/disjoint_validation_routing_checkpoint_v26/checkpoint.json
      - name: Upload routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-disjoint-validation-routing-checkpoint-v26
          path: artifacts/kokuno_agent5/disjoint_validation_routing_checkpoint_v26
