name: agent9-candidate-identity-bound-morphology
on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/candidate_cylindrical_morphology.py'
      - 'src/openai_ns_reconstruction/st054_cylindrical_morphology.py'
      - 'tests/test_candidate_cylindrical_morphology.py'
      - 'tests/test_st054_cylindrical_morphology.py'
      - '.github/workflows/agent9-candidate-identity-bound-morphology.yml'
  push:
    branches: [main, 'agent9/candidate-identity-bound-morphology-083']
    paths:
      - 'src/openai_ns_reconstruction/candidate_cylindrical_morphology.py'
      - 'src/openai_ns_reconstruction/st054_cylindrical_morphology.py'
      - 'tests/test_candidate_cylindrical_morphology.py'
      - 'tests/test_st054_cylindrical_morphology.py'
      - '.github/workflows/agent9-candidate-identity-bound-morphology.yml'
permissions:
  contents: read
concurrency:
  group: agent9-candidate-identity-bound-morphology-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate-identity-bound-fingerprint:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository package
        run: python -m pip install -e '.[dev]'
      - name: Compile and run focused regressions
        run: |
          python -m py_compile src/openai_ns_reconstruction/candidate_cylindrical_morphology.py
          python -m pytest -q -W error \
            tests/test_candidate_cylindrical_morphology.py \
            tests/test_st054_cylindrical_morphology.py
      - name: Emit deterministic mechanics receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a9-candidate-morphology
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          from openai_ns_reconstruction.candidate_cylindrical_morphology import (
              fingerprint_identified_velocity_field,
              validate_candidate_morphology_receipt,
          )

          class Field:
              def velocity(self, x, y, z, t):
                  x, y, z = np.broadcast_arrays(np.asarray(x, float), np.asarray(y, float), np.asarray(z, float))
                  r = np.hypot(x, y)
                  inward = 0.2 + 0.05 * float(t)
                  omega = 0.7 + 0.2 * r
                  return np.stack((-inward*x-omega*y, -inward*y+omega*x, 0.3*z), axis=-1)

          receipt = fingerprint_identified_velocity_field(
              Field(),
              candidate_id='mechanics-only-synthetic-v1',
              candidate_sha256='a' * 64,
              velocity_identity_sha256='b' * 64,
              radii=(0.5, 1.0),
              z_magnitudes=(0.4,),
              times=(0.25, 0.75),
              azimuth_count=8,
              core_radii=(0.25, 0.5, 0.75, 1.0),
          )
          validate_candidate_morphology_receipt(receipt)
          assert receipt['candidate_identity_bound'] is True
          assert receipt['visualization_ready'] is False
          assert receipt['visual_correspondence_verified'] is False
          assert receipt['source_correspondence_verified'] is False
          assert receipt['pde_validated'] is False
          Path('/tmp/a9-candidate-morphology/receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'schema': receipt['schema'],
              'candidate_id': receipt['candidate_identity']['candidate_id'],
              'measurement_sha256': receipt['measurement_sha256'],
              'visualization_ready': receipt['visualization_ready'],
              'pde_validated': receipt['pde_validated'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A9-candidate-identity-bound-morphology
          path: /tmp/a9-candidate-morphology/
          if-no-files-found: error
