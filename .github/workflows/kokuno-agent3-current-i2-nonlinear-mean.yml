name: kokuno-agent3-current-i2-nonlinear-mean

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_current_i2_nonlinear_mean_attribution.py'
      - 'tests/test_constrained_kokuno_current_i2_nonlinear_mean_attribution.py'
      - '.github/workflows/kokuno-agent3-current-i2-nonlinear-mean.yml'

permissions:
  contents: read

jobs:
  current-i2-nonlinear-mean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Agent-3 PR head
        uses: actions/checkout@v4
        with:
          path: a3
          fetch-depth: 0

      - name: Verify one-increment Agent-3 stack
        shell: bash
        run: |
          set -euo pipefail
          parent=e6ac8bed0ef775232e18e81e87f6a7572dcba8fb
          git -C a3 merge-base --is-ancestor "$parent" HEAD
          test "$(git -C a3 rev-list --count "$parent"..HEAD)" -eq 3
          git -C a3 diff --name-only "$parent"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/kokuno-agent3-current-i2-nonlinear-mean.yml
          src/openai_ns_reconstruction/kokuno_current_i2_nonlinear_mean_attribution.py
          tests/test_constrained_kokuno_current_i2_nonlinear_mean_attribution.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Checkout exact Agent-2 current-I2 composite
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 48d69e37e78e7f7f0e4e9936f28ff7974719288d
          path: a2
          fetch-depth: 1

      - name: Checkout exact Agent-1 current-I2 leading
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 9c2abbc69ba1ef8c8a9e8d1699a466a75d0293c3
          path: a1
          fetch-depth: 1

      - name: Authenticate sibling source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C a2 rev-parse HEAD)" = 48d69e37e78e7f7f0e4e9936f28ff7974719288d
          test "$(git -C a1 rev-parse HEAD)" = 9c2abbc69ba1ef8c8a9e8d1699a466a75d0293c3
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_current_i2_leading_oscillatory_identity.py)" = be68248aca97173a15474324f63efff2c9ffce56
          test "$(git -C a2 hash-object src/openai_ns_reconstruction/kokuno_oscillatory_batch_differentials.py)" = 12df3bf6c949baeebf609b366f2973e7f515a157
          test "$(git -C a1 hash-object src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_i2_heat_repair.py)" = bfeff163d304c4cf1fb84eb8ff1cdfcf430870b4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent-3 tree
        run: python -m pip install -e a3

      - name: Run focused contract tests
        run: python -m pytest -q a3/tests/test_constrained_kokuno_current_i2_nonlinear_mean_attribution.py

      - name: Materialize exact current-I2 mean receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations
          import json
          from math import exp, hypot, log, sqrt
          from pathlib import Path
          import importlib
          import numpy as np
          import openai_ns_reconstruction as pkg

          root = Path.cwd()
          for sibling in (root / 'a1' / 'src' / 'openai_ns_reconstruction', root / 'a2' / 'src' / 'openai_ns_reconstruction'):
              text = str(sibling)
              if text not in pkg.__path__:
                  pkg.__path__.append(text)

          a2_field_mod = importlib.import_module('openai_ns_reconstruction.kokuno_current_i2_leading_oscillatory_identity')
          a2_diff_mod = importlib.import_module('openai_ns_reconstruction.kokuno_oscillatory_batch_differentials')
          a3_mod = importlib.import_module('openai_ns_reconstruction.kokuno_current_i2_nonlinear_mean_attribution')

          field = a2_field_mod.default_field()
          backend = a3_mod.ExactCurrentI2NonlinearBackend.bind(
              field,
              a2_diff_mod.evaluate_oscillatory_batch_differentials,
          )

          inner = a3_mod.materialize_current_i2_nonlinear_mean_attribution(
              backend,
              np.asarray([hypot(0.41, -0.17)], dtype=float),
              np.asarray([-0.08], dtype=float),
              np.asarray([0.39], dtype=float),
          )

          fraction = 0.57
          eta = 0.08
          time = 0.55
          X = exp(log(field.X_I2_start) + fraction * (log(field.X_I2_end) - log(field.X_I2_start)))
          q = (1.0 - time) / (1.0 - eta * eta)
          radius = sqrt(2.0 * q * X)
          z = (q ** field.D) * eta
          stage = a3_mod.materialize_current_i2_nonlinear_mean_attribution(
              backend,
              np.asarray([radius], dtype=float),
              np.asarray([z], dtype=float),
              np.asarray([time], dtype=float),
          )

          payload = {
              'schema': 'kokuno-a3-current-i2-nonlinear-mean-receipt-v1',
              'backend': backend.to_receipt(),
              'truth_boundary': a3_mod.truth_boundary(),
              'inner': inner.to_receipt(),
              'i2_probe': {
                  'fraction': fraction,
                  'eta': eta,
                  'time': time,
                  'X': X,
                  'X_I2_start': field.X_I2_start,
                  'X_I2_end': field.X_I2_end,
                  'radius': radius,
                  'z': z,
                  'witness': stage.to_receipt(),
              },
          }
          Path('artifacts/current_i2_nonlinear_mean_receipt.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          gates = {
              'inner_pointwise_three_piece_closure_absolute_max': float(inner.pointwise_three_piece_closure_absolute_max),
              'inner_projected_three_piece_closure_absolute_max': float(inner.projected_three_piece_closure_absolute_max),
              'inner_quadratic_mean_rms': float(inner.quadratic_mean_rms),
              'i2_pointwise_three_piece_closure_absolute_max': float(stage.pointwise_three_piece_closure_absolute_max),
              'i2_projected_three_piece_closure_absolute_max': float(stage.projected_three_piece_closure_absolute_max),
              'i2_domain_strictly_inside': bool(field.X_I2_start < X < field.X_I2_end),
          }
          Path('artifacts/gates.json').write_text(json.dumps(gates, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload receipt before scientific gate enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-current-i2-nonlinear-mean-receipt
          path: artifacts/

      - name: Enforce scoped mean-attribution gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          g = json.loads(Path('artifacts/gates.json').read_text(encoding='utf-8'))
          assert g['i2_domain_strictly_inside'] is True
          assert g['inner_pointwise_three_piece_closure_absolute_max'] <= 5.0e-13
          assert g['inner_projected_three_piece_closure_absolute_max'] <= 1.0e-12
          assert g['i2_pointwise_three_piece_closure_absolute_max'] <= 5.0e-13
          assert g['i2_projected_three_piece_closure_absolute_max'] <= 1.0e-12
          assert g['inner_quadratic_mean_rms'] > 1.0e-12
          PY
