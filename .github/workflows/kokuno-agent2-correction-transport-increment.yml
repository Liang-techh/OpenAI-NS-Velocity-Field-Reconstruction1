name: kokuno-agent2-correction-transport-increment

on:
  push:
    branches:
      - codex/kokuno-a2-correction-transport-increment-058
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_correction_transport_increment.py"
      - "src/openai_ns_reconstruction/kokuno_public_correction_self_advection.py"
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_correction_cross_advection.py"
      - "src/openai_ns_reconstruction/kokuno_public_signed_amplitude_complete_curl.py"
      - "src/openai_ns_reconstruction/kokuno_public_signed_amplitude_spatial_laplacian.py"
      - "tests/test_constrained_kokuno_public_correction_transport_increment.py"
      - ".github/workflows/kokuno-agent2-correction-transport-increment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent2-correction-transport-increment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correction-transport-increment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile correction transport stack
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_public_correction_transport_increment.py
          src/openai_ns_reconstruction/kokuno_public_correction_self_advection.py
          src/openai_ns_reconstruction/kokuno_public_oscillatory_correction_cross_advection.py
          src/openai_ns_reconstruction/kokuno_public_signed_amplitude_complete_curl.py
          src/openai_ns_reconstruction/kokuno_public_signed_amplitude_spatial_laplacian.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_signed_amplitude_spatial_laplacian.py
          tests/test_constrained_kokuno_public_oscillatory_correction_cross_advection.py
          tests/test_constrained_kokuno_public_correction_self_advection.py
          tests/test_constrained_kokuno_public_correction_transport_increment.py
      - name: Generate immutable correction-transport receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_public_correction_transport_increment
          --output artifacts/kokuno_agent2_correction_transport_increment_v1.json
      - name: Check preregistered gates and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('artifacts/kokuno_agent2_correction_transport_increment_v1.json')
          r = json.loads(p.read_text())
          assert r['schema'] == 'kokuno-a2-correction-transport-increment-v1'
          assert r['sample_count'] == 18
          assert r['sample_times'] == [0.45, 0.50, 0.55]
          assert r['repository_physical_contract']['viscosity'] == 0.01
          assert r['repository_physical_contract']['viscosity_caller_tunable'] is False
          assert r['oscillatory_fd6_step'] == 0.001
          assert r['correction_fd4_step'] == 0.001
          assert r['correction_laplacian_fd6_step'] == 0.001
          assert r['independent_fd4_steps'] == [0.004, 0.002, 0.001]
          assert r['failed_guards'] == []
          assert r['correction_transport_increment_rms'] >= 1.0e-10
          assert r['independent_refinement_ratio'] >= 6.0
          assert r['independent_finest_relative_rms'] <= 1.0e-2
          assert r['independent_finest_relative_sampled_max'] <= 2.0e-2
          assert r['termwise_assembly_absolute_max'] <= 1.0e-13
          assert r['support_exterior_absolute_max'] <= 1.0e-12
          h = r['handoff_contract']
          assert h['consumer_lane'] == 'Kokuno Agent 3 mean/radial bookkeeping'
          assert h['complete_ns_defect'] is False
          assert h['includes_correction_time_derivative'] is True
          assert h['includes_oscillation_correction_cross_advection'] is True
          assert h['includes_correction_self_advection'] is True
          assert h['includes_correction_viscosity'] is True
          assert h['includes_leading_cross_terms'] is False
          assert h['includes_pressure_gradient'] is False
          assert h['includes_restricted_forcing'] is False
          t = r['truth_boundary']
          assert t['oscillatory_or_correction_candidate_changed'] is False
          assert t['amplitude_phase_carrier_support_retuned'] is False
          assert t['vector_potential_complete_curl_reused'] is True
          assert t['correction_transport_increment_executable'] is True
          assert t['agent3_raw_transport_handoff_available'] is True
          assert t['agent3_mean_radial_chain_reimplemented'] is False
          assert t['real_agent3_delta_a_bound'] is False
          assert t['real_global_leading_field_bound'] is False
          assert t['leading_cross_terms_included'] is False
          assert t['pressure_gradient_included'] is False
          assert t['restricted_forcing_included'] is False
          assert t['complete_ns_defect'] is False
          assert t['full_composite_velocity_available'] is False
          assert t['heldout_ns_momentum_residual_assessed'] is False
          assert t['residual_reduction_claimed'] is False
          assert t['paper_exact'] is False
          assert t['openai_field_identified'] is False
          assert t['pde_validated'] is False
          print('correction_transport_increment=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-correction-transport-increment-v1
          path: artifacts/kokuno_agent2_correction_transport_increment_v1.json
          if-no-files-found: error
