name: kokuno-agent1-actual-final-bridge-xi110

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_actual_final_bridge_xi110.py"
      - "tests/test_kokuno_pa10_actual_final_bridge_xi110.py"
      - ".github/workflows/kokuno-agent1-actual-final-bridge-xi110.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert stacked A1 ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 15791891fbbcfdaa614930791a843983afde2b4d HEAD

      - name: Verify pinned corrected-source blob and bridge text
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          import hashlib
          url = "https://raw.githubusercontent.com/KokunoYumeto/yang-mills-interacting-workbench/143f6773feb424ad9ed3a8d116653200f20346b7/navier-stokes/navier_stokes_workbench.tex"
          data = urllib.request.urlopen(url, timeout=30).read()
          digest = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          expected = "205a99807302e21a51c5eaf223390c0dfc42bcd0"
          if digest != expected:
              raise SystemExit(f"corrected source blob drifted: {digest} != {expected}")
          text = data.decode("utf-8")
          required = [
              "Starting at \\(X=100\\), multiply the axial prescription",
              "Then hold \\(D_XU=0\\) and interpolate \\(a\\) convexly",
              "Both intervals can fit strictly between 100 and 110",
              "On the final interval, \\(a=0.8\\), \\(l=0.6\\), \\(D_XU=0\\)",
          ]
          for phrase in required:
              if phrase not in text:
                  raise SystemExit(f"required corrected-source phrase missing: {phrase}")
          print("corrected source blob and final-bridge text pinned")
          PY

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_pa10_actual_final_bridge_xi110.py
          python -m py_compile tests/test_kokuno_pa10_actual_final_bridge_xi110.py

      - name: Run parent and new focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_fixed_kappa_x100.py \
            tests/test_kokuno_pa10_autonomous_reference_stress_xi110.py \
            tests/test_kokuno_pa10_actual_final_bridge_xi110.py

      - name: Emit deterministic scoped receipt
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_actual_final_bridge_xi110 import KokunoPA10ActualFinalBridgeToXi110
          obj = KokunoPA10ActualFinalBridgeToXi110()
          eta = np.array([-0.6, -0.25, 0.0, 0.25, 0.6])
          out = obj.handoff_at_Xi(eta)
          receipt = {
              "schema": "kokuno-agent1-actual-final-bridge-xi110-receipt-v1",
              "semantic_sha256": obj.semantic_sha256,
              "eta": eta.tolist(),
              "G_i": out["G_i"].tolist(),
              "ell_i": out["ell_i"].tolist(),
              "F_i": out["F_final_bridge"].tolist(),
              "a_Xi": out["a"].tolist(),
              "l_profile_Xi": out["l_profile"].tolist(),
              "truth_boundary": obj.truth_boundary,
          }
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
