name: st054-pressure-replay
on:
  pull_request:
    paths:
      - 'experiments/root_st054/**'
      - '.github/workflows/st054-pressure-replay.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/root_st054/**'
      - '.github/workflows/st054-pressure-replay.yml'
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - run: |
          python scripts/ns_candidate.py verify
          python -m pytest -q -W error experiments/root_st054/test_pressure.py
  frozen-pressure-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [ST054-M3, ST054-Q2]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FIELD_ID: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2'
      - name: Rebuild frozen field and replay full original validation and pressure audit
        shell: bash
        run: |
          set +e
          python experiments/root_st054/replay_st054.py --id "$FIELD_ID" --out "outputs/$FIELD_ID" --seed 9175491 --validate --structure
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json,os
          from pathlib import Path
          ident=os.environ['FIELD_ID']
          rec=json.loads(Path('experiments/root_st054/results.json').read_text())
          ref=next(r for r in rec['paired_results'] if r['id']==ident and r['seed']==9175491)
          actual=json.loads(Path(f'outputs/{ident}/validation.json').read_text())
          assert actual['pde_validated'] is False and actual['all_numeric_gates_pass'] is False
          assert actual['gates']==rec['common_gates']
          fine=[r for r in actual['spatial_refinement'] if r['space_step']==.005]
          assert len(fine)==6
          maximum=max(r['momentum_max'] for r in fine)
          l2=max(r['momentum_L2'] for r in fine)
          assert abs(maximum-ref['max'])<1e-5
          assert abs(l2-ref['volume_L2'])<1e-5
          audit=json.loads(Path(f'outputs/{ident}/structure.json').read_text())
          assert audit['velocity_coefficients_identical'] and audit['force_coefficients_identical']
          assert audit['shear_probe_count']==1025
          assert audit['shear_max_difference']==0. and audit['midplane_velocity_max_difference']==0.
          assert audit['azimuthal_residual_difference']<1e-12
          for case in audit['cases']:
              for row in case['rows']:
                  assert row['velocity_difference_max']==0.
                  for k in ('inward_fraction','swirl_fraction','bipolar_fraction','radial_pressure_inward_fraction','axial_pressure_toward_fraction'):
                      assert row[k]==1.
          print(ident,maximum,l2,'Frozen pressure completion reproduced. Original NS momentum gates still FAILED.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.candidate }}-independent-replay
          path: outputs/${{ matrix.candidate }}/
          if-no-files-found: error
