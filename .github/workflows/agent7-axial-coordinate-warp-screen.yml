name: agent7-axial-coordinate-warp-screen

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_eq45_axial_coordinate_warp_screen.py'
      - 'tests/test_constrained_eq45_axial_coordinate_warp_screen.py'
      - '.github/workflows/agent7-axial-coordinate-warp-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test axial coordinate warp screen
        run: python -m pytest -q -W error tests/test_constrained_eq45_axial_coordinate_warp_screen.py
      - name: Generate axial coordinate warp report
        run: |
          python -m openai_ns_reconstruction.constrained_eq45_axial_coordinate_warp_screen \
            --output artifacts/axial_coordinate_warp_screen/report.json
          cat artifacts/axial_coordinate_warp_screen/report.json
      - name: Upload axial coordinate warp report
        uses: actions/upload-artifact@v4
        with:
          name: agent7-axial-coordinate-warp-screen
          path: artifacts/axial_coordinate_warp_screen/report.json
