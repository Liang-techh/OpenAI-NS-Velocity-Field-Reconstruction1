name: kokuno-agent5-relative-swirl-support-rf30preflight-routing

on:
  push:
    branches:
      - kokuno-agent5/relative-swirl-support-rf30preflight-routing-118
  pull_request:
    branches:
      - kokuno-agent5/holdprefix-multiharmonic-rf49-audit-routing-117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Authenticate exact parent and fresh sibling deliveries
        shell: bash
        run: |
          set -euo pipefail
          fetch_commit_and_check() {
            local expected_head="$1" path="$2" expected_blob="$3"
            git fetch --no-tags --depth=1 origin "${expected_head}"
            actual_blob="$(git rev-parse "${expected_head}:${path}")"
            test "${actual_blob}" = "${expected_blob}"
          }

          parent='eb15089a312b9ea1a3c4632145d501d244ec1324'
          git merge-base --is-ancestor "${parent}" HEAD
          test "$(git rev-parse "${parent}:src/openai_ns_reconstruction/kokuno_a5_holdprefix_multiharmonic_rf49_audit_routing.py")" = \
            'd119425a1564616e1778a72fd9d814318bc01970'

          fetch_commit_and_check \
            '6ddf35b9dc726c720033ee44161e29efc77d755e' \
            'src/openai_ns_reconstruction/kokuno_current_relative_swirl_angular_correction.py' \
            '37e6b0814fbad14084a8c8c4815122111252ac9b'
          fetch_commit_and_check \
            'f2b7ddb909b8fc2bcf575942ed63ec4a1fbc98bf' \
            'src/openai_ns_reconstruction/kokuno_source_support_certified_multiharmonic_velocity.py' \
            '5b2bdab4e7fff24ecec8f8cb0fbd8d118a862381'
          fetch_commit_and_check \
            'cafab2098f00c3dc2ed5668e1b12bdb38a1f31e8' \
            'src/openai_ns_reconstruction/kokuno_current_i4_rf30_fixedq_preflight.py' \
            'b2fac4318a40342d6c08170bf7093c31685c53ab'
          fetch_commit_and_check \
            '47a241732b667b02f2294670d37f32650491f7e3' \
            'src/openai_ns_reconstruction/kokuno_a4_relative_swirl_compensator_independent_audit.py' \
            'c279371898a75cfcf7d2aa39861eba4cba432cc2'
          fetch_commit_and_check \
            'caaf740af357fd6741da5118a1254c2b945caad0' \
            'src/openai_ns_reconstruction/kokuno_a4_postpulse_hold_prefix_leading_divergence_independent_audit.py' \
            '89da19c5d1fcd3335ba97b6e5e21f9c8bb472721'

      - name: Authenticate corrected public source provenance
        uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Verify corrected source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = '143f6773feb424ad9ed3a8d116653200f20346b7'
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = '205a99807302e21a51c5eaf223390c0dfc42bcd0'

      - name: Enforce minimal three-file Agent-5 delta
        shell: bash
        run: |
          set -euo pipefail
          parent='eb15089a312b9ea1a3c4632145d501d244ec1324'
          git merge-base --is-ancestor "${parent}" HEAD
          test "$(git rev-list --count "${parent}"..HEAD)" -eq 10
          mapfile -t changed < <(git diff --name-only "${parent}..HEAD" | sort)
          expected=(
            '.github/workflows/kokuno-agent5-relative-swirl-support-rf30preflight-routing.yml'
            'src/openai_ns_reconstruction/kokuno_a5_relative_swirl_support_rf30preflight_routing.py'
            'tests/test_kokuno_a5_relative_swirl_support_rf30preflight_routing.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --diff-filter=D --name-only "${parent}..HEAD")"

      - name: Run focused parent and new Agent-5 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a5_relative_swirl_support_rf30preflight_routing.py \
            tests/test_kokuno_a5_relative_swirl_support_rf30preflight_routing.py
          pytest -q \
            tests/test_kokuno_a5_holdprefix_multiharmonic_rf49_audit_routing.py \
            tests/test_kokuno_a5_relative_swirl_support_rf30preflight_routing.py

      - name: Materialize deterministic routing artifact
        run: |
          mkdir -p artifacts/kokuno/agent5
          python -m openai_ns_reconstruction.kokuno_a5_relative_swirl_support_rf30preflight_routing \
            --output artifacts/kokuno/agent5/relative_swirl_support_rf30preflight_routing.json

      - name: Upload registration artifact before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-relative-swirl-support-rf30preflight-routing-v118
          path: artifacts/kokuno/agent5/relative_swirl_support_rf30preflight_routing.json
          if-no-files-found: error

      - name: Final fail-closed truth enforcement
        run: |
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_a5_relative_swirl_support_rf30preflight_routing import load_registration
          reg = load_registration('artifacts/kokuno/agent5/relative_swirl_support_rf30preflight_routing.json')
          truth = reg['truth_boundary']
          state = reg['core_state']
          f = reg['frontiers']
          gates = reg['frozen_gates']

          assert f['latest_cartesian_leading']['pr'] == 1148
          assert f['current_angular_target_correction']['pr'] == 1159
          assert f['current_angular_target_correction']['imported_base_absolute_angular_target_materialized'] is False
          assert f['current_angular_target_correction']['current_cartesian_relative_swirl_composed'] is False

          a4alg = f['relative_swirl_compensator_validator']
          assert a4alg['pr'] == 1160
          assert a4alg['audited_agent1_pr'] == 1154
          assert a4alg['audits_agent1_1159_current_correction'] is False
          assert a4alg['scoped_gate_passed'] is None

          assert f['support_certified_multiharmonic']['pr'] == 1158
          assert f['support_certified_multiharmonic']['source_provider_self_contained'] is False
          assert f['latest_self_contained_project_composite']['pr'] == 1117

          pre = f['current_i4_rf30_fixedq_preflight']
          assert pre['pr'] == 1161
          assert pre['fixed_q_coordinate_map_materialized'] is True
          assert pre['normalized_physical_azimuthal_mean_used'] is True
          assert pre['source_auxiliary_t2_provider_available'] is False
          assert pre['normalized_source_auxiliary_t2_haar_mean_used'] is False
          assert pre['rf30_repository_candidate_state_authorized'] is False
          assert pre['current_i4_rf30_defect_materialized'] is False

          assert f['holdprefix_leading_validator']['audited_agent1_pr'] == 1148
          assert f['holdprefix_leading_validator']['scoped_gate_passed'] is None
          assert state == {
              'leading_ready': False,
              'oscillatory_ready': True,
              'correction_ready': False,
              'velocity_export_ready': False,
              'pde_validated': False,
          }
          assert truth['current_relative_swirl_total_target_materialized'] is False
          assert truth['current_cartesian_relative_swirl_composed'] is False
          assert truth['agent4_1160_audits_agent1_1159_current_correction'] is False
          assert truth['current_i4_fixedq_coordinate_observable_preflight_materialized'] is True
          assert truth['current_i4_source_auxiliary_t2_provider_materialized'] is False
          assert truth['current_i4_source_auxiliary_t2_haar_mean_materialized'] is False
          assert truth['current_i4_rf30_repository_candidate_state_authorized'] is False
          assert truth['current_i4_rf30_defect_materialized'] is False
          assert truth['complete_identity_bound_ns_defect_materialized'] is False
          assert truth['heldout_complete_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert gates['normalized_momentum_sampled_max'] == 1e-3
          assert gates['normalized_momentum_volume_l2'] == 1e-3
          assert gates['normalized_divergence_sampled_max'] == 1e-5
          assert gates['normalized_divergence_volume_l2'] == 1e-5
          assert gates['canonical_quadrature'] == [24, 48, 96]
          assert gates['residual_defined_free_forcing_allowed'] is False
          PY
