name: kokuno-agent3-joint-gain-margin

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_joint_gain_margin.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_aware_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_spacetime_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_quadratic_covariance_gain_guard.py'
      - 'tests/test_constrained_kokuno_joint_gain_margin.py'
      - 'tests/test_constrained_kokuno_radial_aware_damping_holdout.py'
      - 'tests/test_constrained_kokuno_spacetime_damping_holdout.py'
      - '.github/workflows/kokuno-agent3-joint-gain-margin.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_joint_gain_margin.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_aware_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_spacetime_damping_holdout.py'
      - 'src/openai_ns_reconstruction/kokuno_quadratic_covariance_gain_guard.py'
      - 'tests/test_constrained_kokuno_joint_gain_margin.py'
      - 'tests/test_constrained_kokuno_radial_aware_damping_holdout.py'
      - 'tests/test_constrained_kokuno_spacetime_damping_holdout.py'
      - '.github/workflows/kokuno-agent3-joint-gain-margin.yml'

permissions:
  contents: read

jobs:
  joint-gain-margin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused gain-margin tests
        run: >-
          python -m pytest -q -s -W error
          tests/test_constrained_kokuno_joint_gain_margin.py
          tests/test_constrained_kokuno_radial_aware_damping_holdout.py
          tests/test_constrained_kokuno_spacetime_damping_holdout.py
      - name: Real-defect joint gain-margin report
        run: >-
          python -m openai_ns_reconstruction.kokuno_joint_gain_margin
          --output artifacts/kokuno_agent3/joint_gain_margin_report.json
          --parent-output artifacts/kokuno_agent3/joint_gain_margin_parent_431.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-joint-gain-margin
          path: |
            artifacts/kokuno_agent3/joint_gain_margin_report.json
            artifacts/kokuno_agent3/joint_gain_margin_parent_431.json
