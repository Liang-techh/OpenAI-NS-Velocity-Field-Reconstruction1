name: kokuno-agent4-segmented-public-contract-audit

on:
  push:
    branches:
      - codex/kokuno-a4-segmented-public-contract-audit-016
  pull_request:
    branches:
      - kokuno-agent1-segmented-leading-assembly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a4-segmented-public-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused independent tests
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_segmented_leading_assembly.py \
            tests/test_constrained_kokuno_segmented_leading_independent.py
      - name: Generate independent public-contract report
        run: |
          python -m openai_ns_reconstruction.kokuno_segmented_leading_independent \
            --output artifacts/kokuno_agent4/segmented_leading_independent_audit.json
          cat artifacts/kokuno_agent4/segmented_leading_independent_audit.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-segmented-leading-independent-audit
          path: artifacts/kokuno_agent4/segmented_leading_independent_audit.json
