name: kokuno-agent1-current-i1-frozen-gate

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_i1_frozen_gate.py"
      - "tests/test_kokuno_pa16_current_cartesian_i1_frozen_gate.py"
      - ".github/workflows/kokuno-agent1-current-i1-frozen-gate.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Assert exact A1 I1 parent ancestry and source blob
        shell: bash
        run: |
          git merge-base --is-ancestor 5dc51d8d7ca48fed2a68d597f6e1a80e23becac2 HEAD
          actual="$(git rev-parse 5dc51d8d7ca48fed2a68d597f6e1a80e23becac2:src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_i1_repair.py)"
          expected="ba585032cf751f524d38bfb4c0e1f6f8aabc9cc3"
          test "$actual" = "$expected"
          echo "authenticated exact #1043 current-I1 parent source blob $actual"

      - name: Compile focused files
        run: |
          python -m py_compile src/openai_ns_reconstruction/kokuno_pa16_current_cartesian_i1_frozen_gate.py
          python -m py_compile tests/test_kokuno_pa16_current_cartesian_i1_frozen_gate.py

      - name: Run parent and frozen-gate regressions
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa16_current_cartesian_i1_repair.py \
            tests/test_kokuno_pa16_current_cartesian_i1_frozen_gate.py

      - name: Emit deterministic scoped receipt
        run: |
          mkdir -p artifacts/kokuno_agent1_current_i1_frozen_gate
          python -m openai_ns_reconstruction.kokuno_pa16_current_cartesian_i1_frozen_gate \
            --output artifacts/kokuno_agent1_current_i1_frozen_gate/receipt.json \
            --config-output artifacts/kokuno_agent1_current_i1_frozen_gate/config.json
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_pa16_current_cartesian_i1_frozen_gate import (
              KokunoPA16CurrentCartesianI1FrozenGate,
          )

          root = Path("artifacts/kokuno_agent1_current_i1_frozen_gate")
          receipt = json.loads((root / "receipt.json").read_text())
          config = json.loads((root / "config.json").read_text())
          assert receipt["frozen_i1_closure_gate"] == {
              "closure_tolerance": 5e-7,
              "mutable": False,
              "parent_runtime_value": 5e-7,
          }
          mutated = copy.deepcopy(config)
          mutated["parent_i1_candidate"]["i1_repair"]["closure_tolerance"] = 1e-5
          try:
              KokunoPA16CurrentCartesianI1FrozenGate.from_configuration(mutated)
          except ValueError:
              pass
          else:
              raise SystemExit("serialized 5e-7 -> 1e-5 gate mutation did not fail closed")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload scoped receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-current-i1-frozen-gate
          path: artifacts/kokuno_agent1_current_i1_frozen_gate/
