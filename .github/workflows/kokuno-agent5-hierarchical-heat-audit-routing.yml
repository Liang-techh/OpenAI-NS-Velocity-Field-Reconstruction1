name: kokuno-agent5-hierarchical-heat-audit-routing

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_hierarchical_heat_repair.py'
      - 'src/openai_ns_reconstruction/kokuno_hierarchical_heat_repair_independent.py'
      - 'src/openai_ns_reconstruction/kokuno_hierarchical_heat_audit_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_hierarchical_heat_repair.py'
      - 'tests/test_constrained_kokuno_hierarchical_heat_repair_independent.py'
      - 'tests/test_constrained_kokuno_hierarchical_heat_audit_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-hierarchical-heat-audit-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-1/4/5 hierarchical heat routing tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_hierarchical_heat_repair.py
          tests/test_constrained_kokuno_hierarchical_heat_repair_independent.py
          tests/test_constrained_kokuno_hierarchical_heat_audit_routing_checkpoint.py
      - name: Generate hierarchical heat audit routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_hierarchical_heat_audit_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/hierarchical_heat_audit_routing_checkpoint_v14
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/hierarchical_heat_audit_routing_checkpoint_v14/hierarchical_heat_audit_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-hierarchical-heat-audit-routing-checkpoint-v14
          path: artifacts/kokuno_agent5/hierarchical_heat_audit_routing_checkpoint_v14
