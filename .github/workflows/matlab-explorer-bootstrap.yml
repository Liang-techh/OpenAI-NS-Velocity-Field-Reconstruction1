name: matlab-explorer-bootstrap
on:
  push:
    branches: [visualization/matlab-interactive-st054]
    paths: [.github/workflows/matlab-explorer-bootstrap.yml]
permissions:
  contents: read
jobs:
  native-matlab-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visualization/matlab-interactive-st054
      - uses: actions/checkout@v4
        with:
          ref: c77492a48e9c0f13d4d51244987c57c28519409b
          path: .source_st054
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export exact-source coefficients and reference vectors
        run: |
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2'
          python visualization/matlab/export_st054.py --source-root .source_st054 --out visualization/matlab/data/st054_models.mat
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('visualization/matlab'); ns_selftest(fullfile(pwd,'visualization','matlab','data','st054_models.mat'),true,fullfile(pwd,'visualization','matlab','tests','output'));
      - name: Commit only verified data and native test receipt to own branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visualization/matlab/data/st054_models.mat visualization/matlab/data/st054_models.json visualization/matlab/tests/output
          git commit -m 'Publish ST054 MATLAB data and actual native numerical/GUI test evidence'
          git push origin HEAD:visualization/matlab-interactive-st054
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST054-MATLAB-explorer
          path: visualization/matlab/
          if-no-files-found: error
