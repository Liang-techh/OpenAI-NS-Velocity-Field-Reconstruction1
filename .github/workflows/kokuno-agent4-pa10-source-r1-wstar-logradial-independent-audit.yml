name: kokuno-agent4-pa10-source-r1-wstar-logradial-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-pa10-r1-wstar-logradial-independent-audit-061
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_source_r1_wstar_logradial_ordinary_slot.py"
      - "src/openai_ns_reconstruction/kokuno_pa10_source_r1_wstar_logradial_independent_audit.py"
      - "tests/test_constrained_kokuno_pa10_source_r1_wstar_logradial_ordinary_slot.py"
      - "tests/test_constrained_kokuno_pa10_source_r1_wstar_logradial_independent_audit.py"
      - ".github/workflows/kokuno-agent4-pa10-source-r1-wstar-logradial-independent-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent4-pa10-source-r1-wstar-logradial-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-r1-wstar-logradial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact checked-out head
        run: |
          git rev-parse HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_wstar_logradial_ordinary_slot.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_r1_wstar_logradial_independent_audit.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_source_r1_wstar_logradial_ordinary_slot.py \
            tests/test_constrained_kokuno_pa10_source_r1_wstar_logradial_independent_audit.py
      - name: Generate exact-head Agent-4 receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_source_r1_wstar_logradial_independent_audit \
            --output artifacts/kokuno_agent4/pa10_source_r1_wstar_logradial_independent_audit_v1/report.json
      - name: Bind exact head and validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent4/pa10_source_r1_wstar_logradial_independent_audit_v1/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)

          assert payload['agent1_pr'] == 724
          assert payload['agent1_exact_head'] == 'd62461a873936500fcc5b125179f593433295e17'
          assert payload['failed_guards'] == []
          assert payload['source_R1_Wstar_logradial_ordinary_slot_independent_preflight_passed'] is True

          ratios = payload['public_over_independent_ratios']
          assert min(ratios.values()) >= 1.0
          assert max(ratios.values()) <= 1.01

          stress = payload['fresh_offgrid_Wstar_stress']
          assert stress['seed'] == 9173401
          assert stress['fresh_random_offgrid_points'] == 8192
          assert stress['finite'] is True
          assert stress['dominated'] is True
          assert stress['nontrivial'] is True
          assert 0.0 < stress['value_over_public_bound'] <= 1.0
          assert stress['j0_pm_0p1_percent_max_abs_response'] > 1e-12

          weights = payload['single_logradial_weight_ratio_stress']
          assert weights['alpha_max'] == 512
          assert weights['beta_max'] == 128
          assert weights['envelope_dominates'] is True
          assert 0.0 < weights['max_single_logradial_ratio'] <= 80.0

          neg = payload['negative_controls']
          assert all(neg.values())

          truth = payload['truth_boundary']
          assert truth['source_R1_Wstar_logradial_ordinary_slot_independently_audited'] is True
          assert truth['source_R1_zeta_ordinary_slot_independently_audited'] is True
          assert truth['source_R1_averaged_eta_ordinary_slot_independent_audit_pending'] is True
          assert truth['source_R1_prior_five_algebraic_slots_independently_audited'] is False
          assert truth['all_R1_ordinary_slots_independently_audited'] is False
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['global_pressure_matched'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert truth['heldout_ns_momentum_residual_assessed'] is False
          assert truth['pde_validated'] is False

          gates = payload['immutable_project_gates']
          assert gates['normalized_momentum_max'] == 1e-3
          assert gates['normalized_momentum_L2'] == 1e-3
          assert gates['divergence_max'] == 1e-5
          assert gates['divergence_L2'] == 1e-5

          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('ratios=', ratios)
          print('offgrid=', stress)
          print('weight_ratio=', weights)
          print('negative_controls=', neg)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-pa10-source-r1-wstar-logradial-independent-audit-v1
          path: artifacts/kokuno_agent4/pa10_source_r1_wstar_logradial_independent_audit_v1/report.json
          if-no-files-found: error
