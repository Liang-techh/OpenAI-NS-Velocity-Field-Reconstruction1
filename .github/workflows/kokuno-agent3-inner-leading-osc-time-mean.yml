name: kokuno-agent3-inner-leading-osc-time-mean

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_inner_leading_oscillatory_time_mean.py'
      - 'tests/test_constrained_kokuno_inner_leading_oscillatory_time_mean.py'
      - '.github/workflows/kokuno-agent3-inner-leading-osc-time-mean.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_inner_leading_oscillatory_time_mean.py

      - name: Fetch exact Agent-2 and Agent-1 heads
        run: |
          git fetch origin 110c7150df73114c482e9f1673ef3a928b95053e
          git fetch origin 6f16e837c3a95a6e54af5c2cb7725d094f667026
          git worktree add --detach "$RUNNER_TEMP/kokuno-a2-821" 110c7150df73114c482e9f1673ef3a928b95053e
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-811" 6f16e837c3a95a6e54af5c2cb7725d094f667026
          test "$(git -C "$RUNNER_TEMP/kokuno-a2-821" rev-parse HEAD)" = "110c7150df73114c482e9f1673ef3a928b95053e"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-811" rev-parse HEAD)" = "6f16e837c3a95a6e54af5c2cb7725d094f667026"

      - name: Exact inner-leading plus oscillatory time-mean receipt
        env:
          A2_WORKTREE: ${{ runner.temp }}/kokuno-a2-821
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-811
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np
          import openai_ns_reconstruction as package

          from openai_ns_reconstruction.kokuno_inner_leading_oscillatory_time_mean import (
              AGENT1_DT_SOURCE_BLOB_SHA,
              AGENT1_HEAD,
              AGENT1_PR,
              AGENT2_HEAD,
              AGENT2_PR,
              AGENT2_SOURCE_BLOB_SHA,
              ANGULAR_ORDERS,
              ExactAgent2InnerLeadingOscillatoryTimeBackend,
              _git_blob_sha,
              materialize_agent2_inner_leading_oscillatory_time_mean,
              truth_boundary,
          )

          a2 = Path(os.environ["A2_WORKTREE"])
          a1 = Path(os.environ["A1_WORKTREE"])

          a1_dt_source = (
              a1 / "src" / "openai_ns_reconstruction" /
              "kokuno_pa10_cartesian_center_velocity_dt.py"
          )
          a1_dt_blob = _git_blob_sha(a1_dt_source.read_bytes())
          if a1_dt_blob != AGENT1_DT_SOURCE_BLOB_SHA:
              raise RuntimeError("exact Agent-1 velocity_dt source blob mismatch")

          package.__path__.insert(0, str(a2 / "src" / "openai_ns_reconstruction"))
          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_time_derivative import (
              evaluate_inner_leading_oscillatory_time_derivative,
          )

          backend_a2 = ExactAgent2InnerLeadingOscillatoryTimeBackend.bind(
              evaluate_inner_leading_oscillatory_time_derivative
          )
          if backend_a2.source_blob_sha != AGENT2_SOURCE_BLOB_SHA:
              raise RuntimeError("exact Agent-2 source blob mismatch")

          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_velocity_dt import KokunoPA10CartesianCenterVelocityTimeDerivative
          field = KokunoPA10CartesianCenterVelocityTimeDerivative()
          for line in sys.stdin:
              request = json.loads(line)
              op = request["op"]
              if op == "meta":
                  result = {
                      "field_sha256": field.field.field_sha256,
                      "source_X_interval": list(field.source_X_interval),
                      "time_interval": list(field.field.time_interval),
                  }
              elif op == "forward":
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request["X"], dtype=float),
                      np.asarray(request["eta"], dtype=float),
                      np.asarray(request["t"], dtype=float),
                      np.asarray(request["theta"], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ("x","y","z","t","X","eta")}
              elif op == "velocity":
                  out = field.velocity(
                      np.asarray(request["x"], dtype=float),
                      np.asarray(request["y"], dtype=float),
                      np.asarray(request["z"], dtype=float),
                      np.asarray(request["t"], dtype=float),
                  )
                  result = {"value": np.asarray(out, dtype=float).tolist()}
              elif op == "velocity_dt":
                  out = field.velocity_dt(
                      np.asarray(request["x"], dtype=float),
                      np.asarray(request["y"], dtype=float),
                      np.asarray(request["z"], dtype=float),
                      np.asarray(request["t"], dtype=float),
                  )
                  result = {"value": np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f"unknown op {op}")
              print(json.dumps(result, sort_keys=True), flush=True)
          '''
          env = os.environ.copy()
          env["PYTHONPATH"] = str(a1 / "src")
          proc = subprocess.Popen(
              [sys.executable, "-u", "-c", server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(",", ":")) + "\n")
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError("Agent-1 backend exited: " + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1Backend:
              def _call(self, op, x, y, z, t):
                  x, y, z, t = np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
                  out = ask({
                      "op": op,
                      "x": x.tolist(), "y": y.tolist(),
                      "z": z.tolist(), "t": t.tolist(),
                  })
                  return np.asarray(out["value"], dtype=float)

              def velocity(self, x, y, z, t):
                  return self._call("velocity", x, y, z, t)

              def velocity_dt(self, x, y, z, t):
                  return self._call("velocity_dt", x, y, z, t)

          meta = ask({"op": "meta"})
          if meta["source_X_interval"][1] < 0.39:
              raise RuntimeError("unexpected Agent-1 inner X domain")
          if meta["time_interval"] != [0.25, 0.75]:
              raise RuntimeError("unexpected Agent-1 time interval")

          X = np.asarray([0.20, 0.24, 0.28, 0.32, 0.22, 0.30], dtype=float)
          eta = np.asarray([-0.45, -0.20, 0.00, 0.25, 0.42, -0.35], dtype=float)
          tt = np.asarray([0.46, 0.48, 0.50, 0.52, 0.54, 0.50], dtype=float)
          theta0 = np.zeros_like(X)
          forward = ask({
              "op": "forward",
              "X": X.tolist(), "eta": eta.tolist(),
              "t": tt.tolist(), "theta": theta0.tolist(),
          })
          x0 = np.asarray(forward["x"], dtype=float)
          y0 = np.asarray(forward["y"], dtype=float)
          z = np.asarray(forward["z"], dtype=float)
          t = np.asarray(forward["t"], dtype=float)
          radius = np.sqrt(x0 * x0 + y0 * y0)

          witness = materialize_agent2_inner_leading_oscillatory_time_mean(
              backend_a2, ExactAgent1Backend(), radius, z, t
          )

          projected_sum = (
              witness.mean_inner_leading_velocity_dt_cylindrical
              + witness.mean_oscillatory_velocity_dt_cylindrical
          )
          projected_closure = float(np.max(np.abs(
              witness.mean_inner_plus_oscillatory_velocity_dt_cylindrical
              - projected_sum
          )))

          failed = []
          if tuple(witness.angular_orders) != tuple(ANGULAR_ORDERS):
              failed.append("angular_ladder")
          if any(v > 1.0e-5 for v in witness.successive_total_dt_mean_relative_differences):
              failed.append("angular_convergence")
          if witness.additive_mean_closure_absolute_max > 1.0e-12:
              failed.append("additive_projected_closure")
          if projected_closure > 1.0e-12:
              failed.append("projected_sum_closure")
          if witness.total_dt_mean_rms > witness.full_ring_total_dt_rms + 1.0e-12:
              failed.append("jensen_consistency")
          if witness.total_dt_mean_to_full_rms_ratio > 1.0 + 1.0e-12:
              failed.append("mean_to_full_ratio")
          if witness.total_dt_mean_rms < 1.0e-12:
              failed.append("nonzero_total_dt_mean_floor")

          boundary = truth_boundary()
          required_false = [
              "inner_leading_is_final_corrected_fixed_point",
              "outer_global_leading_join_materialized",
              "global_leading_velocity_materialized",
              "inner_leading_oscillatory_velocity_dt_mean_is_complete_ns_defect",
              "inner_leading_self_advection_included_here",
              "inner_leading_oscillatory_cross_advection_included_here",
              "oscillatory_self_advection_mean_included_here",
              "base_viscous_term_included_here",
              "correction_transport_mean_included_here",
              "pressure_gradient_included",
              "restricted_forcing_included",
              "real_agent3_delta_a_bound",
              "mean_correction_velocity_materialized_from_this_witness",
              "real_full_candidate_bound",
              "real_candidate_finite_correction_cycle_run",
              "heldout_normalized_ns_residual_assessed",
              "residual_reduction_claimed",
              "caller_supplied_residual_allowed",
              "caller_supplied_mean_values_allowed",
              "caller_supplied_derivative_resolution_allowed",
              "caller_supplied_scientific_threshold_allowed",
              "pde_validated",
              "paper_exact",
              "openai_field_identified",
              "blowup_proved",
          ]
          if any(boundary[name] for name in required_false):
              failed.append("truth_boundary_promotion")

          receipt = {
              "schema": "kokuno-a3-inner-leading-oscillatory-time-mean-receipt-v1",
              "agent2_pr": AGENT2_PR,
              "agent2_head": AGENT2_HEAD,
              "agent2_source_blob_sha": backend_a2.source_blob_sha,
              "agent1_pr": AGENT1_PR,
              "agent1_head": AGENT1_HEAD,
              "agent1_velocity_dt_source_blob_sha": a1_dt_blob,
              "agent1_field_sha256": meta["field_sha256"],
              "source_X": X.tolist(),
              "source_eta": eta.tolist(),
              "sample_times": t.tolist(),
              "radius": radius.tolist(),
              "z": z.tolist(),
              "angular_orders": list(witness.angular_orders),
              "successive_total_dt_mean_relative_differences": list(
                  witness.successive_total_dt_mean_relative_differences
              ),
              "additive_mean_closure_absolute_max": witness.additive_mean_closure_absolute_max,
              "projected_sum_closure_absolute_max": projected_closure,
              "total_dt_mean_rms": witness.total_dt_mean_rms,
              "full_ring_total_dt_rms": witness.full_ring_total_dt_rms,
              "total_dt_mean_to_full_rms_ratio": witness.total_dt_mean_to_full_rms_ratio,
              "mean_inner_leading_velocity_dt_cylindrical": witness.mean_inner_leading_velocity_dt_cylindrical.tolist(),
              "mean_oscillatory_velocity_dt_cylindrical": witness.mean_oscillatory_velocity_dt_cylindrical.tolist(),
              "mean_inner_plus_oscillatory_velocity_dt_cylindrical": witness.mean_inner_plus_oscillatory_velocity_dt_cylindrical.tolist(),
              "failed_guards": failed,
              "truth_boundary": boundary,
          }
          Path("artifacts/kokuno_agent3_inner_leading_oscillatory_time_mean_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))

          if proc.stdin is not None:
              proc.stdin.close()
          proc.terminate()
          proc.wait(timeout=10)
          if failed:
              raise SystemExit("failed guards: " + ", ".join(failed))
          PY

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-inner-leading-oscillatory-time-mean-v1
          path: artifacts/kokuno_agent3_inner_leading_oscillatory_time_mean_receipt.json
          if-no-files-found: error
