name: agent7-f20-theta-overlap-report

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_eq45_bipolar_f20_capacity.py'
      - 'src/openai_ns_reconstruction/constrained_eq45_bipolar_f20_theta_overlap.py'
      - 'tests/test_constrained_eq45_bipolar_f20_theta_overlap.py'
      - '.github/workflows/agent7-f20-theta-overlap-report.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate F20 theta-error overlap report
        run: python -m openai_ns_reconstruction.constrained_eq45_bipolar_f20_theta_overlap
      - name: Upload overlap report
        uses: actions/upload-artifact@v4
        with:
          name: agent7-f20-theta-overlap-report
          path: artifacts/bipolar_f20_theta_overlap/report.json
