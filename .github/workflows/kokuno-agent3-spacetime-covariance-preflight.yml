name: kokuno-agent3-spacetime-covariance-preflight

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_spacetime_covariance_preflight.py'
      - 'src/openai_ns_reconstruction/kokuno_multislice_covariance_preflight.py'
      - 'src/openai_ns_reconstruction/kokuno_velocity_column_preflight.py'
      - 'src/openai_ns_reconstruction/kokuno_covariance_tangent_preflight.py'
      - 'src/openai_ns_reconstruction/kokuno_second_column_bounded_inverse.py'
      - 'src/openai_ns_reconstruction/kokuno_missing_covariance_column_target.py'
      - 'src/openai_ns_reconstruction/kokuno_radial_stress.py'
      - 'src/openai_ns_reconstruction/kokuno_mean_defect.py'
      - 'src/openai_ns_reconstruction/kokuno_complete_curl.py'
      - 'tests/test_constrained_kokuno_spacetime_covariance_preflight.py'
      - '.github/workflows/kokuno-agent3-spacetime-covariance-preflight.yml'

permissions:
  contents: read

jobs:
  spacetime-covariance-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_spacetime_covariance_preflight.py
          tests/test_constrained_kokuno_multislice_covariance_preflight.py
          tests/test_constrained_kokuno_velocity_column_preflight.py
          tests/test_constrained_kokuno_covariance_tangent_preflight.py
          tests/test_constrained_kokuno_missing_covariance_column_target.py
          tests/test_constrained_kokuno_second_column_bounded_inverse.py
      - name: Measure real spacetime covariance preflight
        run: >-
          python -m openai_ns_reconstruction.kokuno_spacetime_covariance_preflight
          --output artifacts/kokuno_agent3/spacetime_covariance_preflight_report.json
      - name: Show report
        run: cat artifacts/kokuno_agent3/spacetime_covariance_preflight_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-spacetime-covariance-preflight
          path: artifacts/kokuno_agent3/spacetime_covariance_preflight_report.json
