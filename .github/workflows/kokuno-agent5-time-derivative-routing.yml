name: kokuno-agent5-time-derivative-routing

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_time_derivative_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_time_derivative_routing_checkpoint.py'
      - '.github/workflows/kokuno-agent5-time-derivative-routing.yml'
  workflow_dispatch:

jobs:
  time-derivative-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent-5 v42 module
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_time_derivative_routing_checkpoint.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_correction_ingest_routing_checkpoint.py
          tests/test_constrained_kokuno_time_derivative_routing_checkpoint.py
      - name: Generate deterministic v42 checkpoint
        run: >-
          python -m openai_ns_reconstruction.kokuno_time_derivative_routing_checkpoint
          --output artifacts/constrained/kokuno_agent5_time_derivative_routing_checkpoint_v42.json
          > /tmp/kokuno_agent5_v42_stdout.json
      - name: Validate deterministic checkpoint and truth boundary
        run: |
          python -m openai_ns_reconstruction.kokuno_time_derivative_routing_checkpoint \
            --check artifacts/constrained/kokuno_agent5_time_derivative_routing_checkpoint_v42.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/constrained/kokuno_agent5_time_derivative_routing_checkpoint_v42.json')
          d = json.loads(p.read_text())
          s = d['states']
          assert s['public_oscillatory_time_derivative_independently_validated'] is True
          assert s['correction_ingest_allowed'] is True
          assert s['oscillatory_requested_stress_component_materialized'] is False
          assert s['correction_ready'] is False
          assert s['formal_full_domain_pde_gate_assessed'] is False
          assert s['pde_validated'] is False
          assert d['formal_gates_unchanged']['held_out_normalized_momentum_max'] == 1e-3
          assert d['formal_gates_unchanged']['held_out_divergence_max'] == 1e-5
          a3 = d['upstream']['agent3_latest_mean_stress_attempt']
          assert a3['dedicated_workflow_conclusion'] == 'failure'
          assert a3['receipt_generated'] is False
          assert a3['artifact_uploaded'] is False
          print(d['checkpoint_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-time-derivative-routing-checkpoint-v42
          path: artifacts/constrained/kokuno_agent5_time_derivative_routing_checkpoint_v42.json
