name: kokuno-agent3-agent2-backend-binding

on:
  push:
    branches:
      - codex/kokuno-a3-agent2-backend-binding-059
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_agent2_complete_curl_binding.py"
      - "tests/test_constrained_kokuno_agent2_complete_curl_binding.py"
      - ".github/workflows/kokuno-agent3-agent2-backend-binding.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-agent2-backend-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-agent2-backend-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      A2_HEAD: c535eeec3267869f630c1327506b3683d0417969
      A2_WORKTREE: /tmp/kokuno-a2-exact
      KOKUNO_A2_EXACT_PACKAGE_PATH: /tmp/kokuno-a2-exact/src/openai_ns_reconstruction
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Agent-3 package
        run: python -m pip install -e '.[dev]'
      - name: Verify exact Agent-3 head
        run: |
          git rev-parse HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Fetch exact Agent-2 backend without copying its curl code
        run: |
          git fetch --no-tags origin "$A2_HEAD"
          git worktree add --detach "$A2_WORKTREE" "$A2_HEAD"
          test "$(git -C "$A2_WORKTREE" rev-parse HEAD)" = "$A2_HEAD"
          test -f "$KOKUNO_A2_EXACT_PACKAGE_PATH/kokuno_typed_delta_a_complete_curl_backend.py"
      - name: Compile Agent-3 binding and parent handoff chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_agent2_complete_curl_binding.py
          src/openai_ns_reconstruction/kokuno_typed_mean_velocity_correction_handoff.py
          src/openai_ns_reconstruction/kokuno_typed_mean_amplitude_differential.py
          src/openai_ns_reconstruction/kokuno_typed_mean_reference_inverse.py
      - name: Run focused cross-lineage and parent regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_agent2_complete_curl_binding.py
          tests/test_constrained_kokuno_typed_mean_velocity_correction_handoff.py
          tests/test_kokuno_typed_mean_amplitude_differential.py
          tests/test_kokuno_typed_mean_reference_inverse.py
      - name: Emit exact cross-lineage receipt
        run: |
          python - <<'PY'
          import importlib
          import json
          import math
          import os
          import subprocess
          from pathlib import Path
          from types import SimpleNamespace
          import numpy as np
          from openai_ns_reconstruction.kokuno_agent2_complete_curl_binding import (
              AGENT2_BACKEND_HEAD,
              bind_agent2_complete_curl_backend,
              truth_boundary,
          )
          from openai_ns_reconstruction.kokuno_same_cycle_defect_contract import CycleIdentity
          import openai_ns_reconstruction as package

          a2_path = os.environ['KOKUNO_A2_EXACT_PACKAGE_PATH']
          package.__path__.insert(0, a2_path)
          a2 = importlib.import_module('openai_ns_reconstruction.kokuno_typed_delta_a_complete_curl_backend')
          assert AGENT2_BACKEND_HEAD == os.environ['A2_HEAD']

          radii = np.linspace(0.24, 1.26, 17)
          s = (radii-radii[0])/(radii[-1]-radii[0])
          bump = np.sin(math.pi*s)**6
          delta_a = np.stack((0.010*bump*(1+0.12*np.cos(2*math.pi*s)),
                              -0.008*bump*(1-0.09*np.sin(2*math.pi*s))), axis=-1)
          delta_a[[0,-1],:] = 0.0
          amplitude = SimpleNamespace(delta_a=delta_a,
              base_amplitudes=SimpleNamespace(radii=tuple(float(v) for v in radii)))
          identity = CycleIdentity('a2-a3-exact-backend-binding-v1',0,'s0')
          backend = a2.TypedDeltaACompleteCurlBackend(
              radii=tuple(float(v) for v in radii), reference_time=0.50,
              provenance=f'exact Agent-2 backend {AGENT2_BACKEND_HEAD}')
          adapter = bind_agent2_complete_curl_backend(backend, identity)
          points = ((0.41,0.07,-0.31,0.37),(0.58,-0.13,0.17,0.50),(0.76,0.11,0.29,0.63))
          u_err=[]; ut_err=[]; norms=[]; dt_norms=[]
          for point in points:
              direct=np.asarray(backend.velocity_evaluator(amplitude,*point),float)
              bound=np.asarray(adapter.velocity_evaluator(amplitude,*point),float)
              direct_t=np.asarray(backend.velocity_dt_evaluator(amplitude,*point),float)
              bound_t=np.asarray(adapter.velocity_dt_evaluator(amplitude,*point),float)
              u_err.append(float(np.max(np.abs(bound-direct))))
              ut_err.append(float(np.max(np.abs(bound_t-direct_t))))
              norms.append(float(np.linalg.norm(bound)))
              dt_norms.append(float(np.linalg.norm(bound_t)))
          boundary=truth_boundary()
          assert max(u_err)==0.0 and max(ut_err)==0.0
          assert max(norms)>0.0
          assert adapter.source_agent2_complete_curl_certified is False
          assert boundary['agent2_complete_curl_reimplemented_by_agent3'] is False
          assert boundary['real_candidate_finite_correction_cycle_run'] is False
          assert boundary['heldout_normalized_ns_residual_assessed'] is False
          assert boundary['pde_validated'] is False
          receipt={
              'schema':'kokuno-a3-agent2-complete-curl-binding-v1',
              'agent3_exact_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'agent2_exact_head':AGENT2_BACKEND_HEAD,
              'sample_count':len(points),
              'velocity_exact_replay_max_abs':max(u_err),
              'velocity_dt_exact_replay_max_abs':max(ut_err),
              'correction_velocity_max_norm':max(norms),
              'correction_velocity_dt_max_norm':max(dt_norms),
              'agent2_self_certification_bit':adapter.source_agent2_complete_curl_certified,
              'agent3_reimplemented_agent2_curl':False,
              'real_full_candidate_bound':False,
              'real_finite_correction_cycle_run':False,
              'heldout_normalized_ns_residual_assessed':False,
              'residual_reduction_claimed':False,
              'pde_validated':False,
          }
          out=Path('artifacts/kokuno_agent3_agent2_backend_binding_v1.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-agent2-backend-binding-v1
          path: artifacts/kokuno_agent3_agent2_backend_binding_v1.json
          if-no-files-found: error
