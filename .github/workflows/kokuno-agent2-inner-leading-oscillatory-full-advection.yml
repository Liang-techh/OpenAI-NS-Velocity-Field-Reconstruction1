name: kokuno-agent2-inner-leading-oscillatory-full-advection

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_full_advection.py'
      - 'tests/test_constrained_kokuno_public_inner_leading_oscillatory_full_advection.py'
      - '.github/workflows/kokuno-agent2-inner-leading-oscillatory-full-advection.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_inner_leading_oscillatory_full_advection.py

      - name: Fetch exact Agent-1 inner self-advection head
        run: |
          git fetch origin 177190d770e0306e116674c5a2e1cbf977628760
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-829" 177190d770e0306e116674c5a2e1cbf977628760
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-829" rev-parse HEAD)" = "177190d770e0306e116674c5a2e1cbf977628760"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-829" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_self_advection.py)" = "b75f3b08ef3f1853550d8dfdef912980c15287c3"

      - name: Exact A1 plus A2 full-convective receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-829
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_full_advection import (
              AGENT1_SELF_ADVECTION_BLOB,
              AGENT1_SELF_ADVECTION_HEAD,
              AGENT1_SELF_ADVECTION_PR,
              DIRECTIONAL_FD4_STEPS,
              directional_fd4_inner_plus_oscillatory_self_advection,
              evaluate_inner_leading_oscillatory_full_advection,
              public_contract,
          )

          a1 = Path(os.environ['A1_WORKTREE'])
          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_self_advection import KokunoPA10CartesianCenterSelfAdvection
          field = KokunoPA10CartesianCenterSelfAdvection()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'temporal_derivative_sha256': field.temporal_derivative_sha256,
                      'spatial_derivative_sha256': field.spatial_derivative_sha256,
                      'self_advection_sha256': field.self_advection_sha256,
                      'source_X_interval': list(field.spatial.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op == 'velocity':
                  out = field.velocity(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              elif op == 'self_advection':
                  out = field.self_advection(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''

          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1SelfBackend:
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def velocity(self, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  out = ask({'op':'velocity','x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)
              def self_advection(self, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  out = ask({'op':'self_advection','x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})
                  return np.asarray(out['value'], dtype=float)

          meta = ask({'op':'meta'})
          if meta['source_X_interval'][1] < 0.39:
              raise RuntimeError('unexpected Agent-1 inner X domain')
          if meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 time interval')

          # Fresh source-interior probes, frozen before observing Actions.
          X = np.asarray([0.185,0.215,0.245,0.275,0.305,0.335,0.195,0.225,0.255,0.285,0.315,0.325], dtype=float)
          eta = np.asarray([-0.49,-0.34,-0.18,-0.03,0.14,0.31,0.47,0.38,-0.42,-0.25,0.07,0.26], dtype=float)
          t = np.asarray([0.465,0.465,0.485,0.485,0.505,0.505,0.525,0.525,0.535,0.535,0.495,0.515], dtype=float)
          theta = np.asarray([0.19,0.69,1.22,1.76,2.31,2.84,-2.72,-2.16,-1.61,-1.04,-0.47,0.37], dtype=float)
          forward = ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),'t':t.tolist(),'theta':theta.tolist()})
          x = np.asarray(forward['x'], dtype=float)
          y = np.asarray(forward['y'], dtype=float)
          z = np.asarray(forward['z'], dtype=float)
          tt = np.asarray(forward['t'], dtype=float)

          backend = ExactAgent1SelfBackend()
          production = evaluate_inner_leading_oscillatory_full_advection(
              backend, x, y, z, tt,
              inner_leading_spatial_step=1.0e-3,
              oscillatory_spatial_step=1.0e-3,
          )
          numerical = [
              directional_fd4_inner_plus_oscillatory_self_advection(
                  backend, x, y, z, tt, directional_step=h
              )
              for h in DIRECTIONAL_FD4_STEPS
          ]
          reference = np.asarray(production.inner_plus_oscillatory_self_advection, dtype=float)

          def vrms(a):
              a = np.asarray(a, dtype=float)
              return float(np.sqrt(np.mean(np.sum(a*a, axis=-1))))

          def relative_rms(a,b):
              return vrms(np.asarray(a)-np.asarray(b)) / max(vrms(a), np.finfo(float).tiny)

          def relative_max(a,b):
              a=np.asarray(a,dtype=float); b=np.asarray(b,dtype=float)
              return float(np.max(np.linalg.norm(a-b,axis=-1)) / max(np.max(np.linalg.norm(a,axis=-1)), np.finfo(float).tiny))

          coarse_diff = vrms(numerical[0]-numerical[1])
          fine_diff = vrms(numerical[1]-numerical[2])
          refinement = coarse_diff / max(fine_diff, np.finfo(float).tiny)
          finest_rms = relative_rms(reference, numerical[-1])
          finest_max = relative_max(reference, numerical[-1])
          velocity_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_velocity
              - production.inner_leading_velocity
              - production.oscillatory_velocity
          )))
          cross_closure = float(np.max(np.abs(
              production.mixed_cross_advection
              - production.inner_advects_oscillation
              - production.oscillation_advects_inner
          )))
          full_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_self_advection
              - production.inner_leading_self_advection
              - production.mixed_cross_advection
              - production.oscillatory_self_advection
          )))

          failed=[]
          if refinement < 6.0: failed.append('directional_fd4_refinement')
          if finest_rms > 1.0e-2: failed.append('finest_relative_rms')
          if finest_max > 2.0e-2: failed.append('finest_relative_sampled_max')
          if vrms(reference) < 1.0e-10: failed.append('full_advection_nontrivial')
          if vrms(production.inner_plus_oscillatory_velocity) < 1.0e-8: failed.append('composite_velocity_nontrivial')
          if velocity_closure > 1.0e-14: failed.append('velocity_additive_closure')
          if cross_closure > 1.0e-13: failed.append('cross_term_closure')
          if full_closure > 1.0e-13: failed.append('full_advection_closure')

          contract=public_contract()
          if contract['forbidden_public_inputs_present']: failed.append('forbidden_public_inputs')
          truth=contract['truth_boundary']
          required_false=(
              'agent1_exact_head_ci_assumed_passed','agent4_inner_field_independent_admission_assumed',
              'agent4_a2_oscillatory_independent_admission_assumed',
              'inner_leading_is_final_corrected_fixed_point','global_leading_velocity_materialized',
              'outer_join_materialized','matched_pressure_included','restricted_forcing_included',
              'agent3_mean_radial_chain_reimplemented','correction_velocity_included',
              'complete_kokuno_candidate_assembled','heldout_ns_residual_assessed',
              'residual_reduction_claimed','paper_exact','pde_validated',
          )
          if any(truth[k] for k in required_false): failed.append('truth_boundary_promotion')

          receipt={
              'schema':'kokuno-a2-inner-leading-oscillatory-full-advection-receipt-v1',
              'agent1_pr':AGENT1_SELF_ADVECTION_PR,
              'agent1_head':AGENT1_SELF_ADVECTION_HEAD,
              'agent1_source_blob':AGENT1_SELF_ADVECTION_BLOB,
              'agent1_field_sha256':meta['field_sha256'],
              'agent1_self_advection_sha256':meta['self_advection_sha256'],
              'sample_count':int(x.size),
              'sample_times':sorted({float(v) for v in tt}),
              'source_X_range':[float(np.min(X)),float(np.max(X))],
              'production_inner_fd4_step':1.0e-3,
              'production_oscillatory_fd6_step':1.0e-3,
              'directional_fd4_steps':list(DIRECTIONAL_FD4_STEPS),
              'directional_successive_refinement_ratio':refinement,
              'finest_directional_relative_rms':finest_rms,
              'finest_directional_relative_sampled_max':finest_max,
              'full_advection_rms':vrms(reference),
              'composite_velocity_rms':vrms(production.inner_plus_oscillatory_velocity),
              'velocity_additive_closure_abs_max':velocity_closure,
              'cross_term_closure_abs_max':cross_closure,
              'full_advection_closure_abs_max':full_closure,
              'failed_guards':failed,
              'truth_boundary':truth,
          }
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/kokuno_agent2_inner_leading_oscillatory_full_advection_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True)+'\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None: proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if failed:
              raise SystemExit('failed guards: '+', '.join(failed))
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-inner-leading-oscillatory-full-advection-v1
          path: artifacts/kokuno_agent2_inner_leading_oscillatory_full_advection_receipt.json
          if-no-files-found: warn
