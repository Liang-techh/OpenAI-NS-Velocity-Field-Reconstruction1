name: kokuno-agent2-oscillatory-source-contract

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_oscillatory_source_contract.py"
      - "tests/test_constrained_kokuno_oscillatory_source_contract.py"
      - ".github/workflows/kokuno-agent2-oscillatory-source-contract.yml"
  workflow_dispatch:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_constrained_kokuno_oscillatory_source_contract.py

      - name: Materialize immutable source-contract receipt before validation
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_oscillatory_source_contract import (
              default_kokuno_oscillatory_source_contract,
          )

          contract = default_kokuno_oscillatory_source_contract()
          receipt = {
              "contract_sha256": contract.contract_sha256,
              "source_date": contract.source_date,
              "source_path": contract.source_path,
              "source_version": contract.source_version,
              "parent_exact_head": contract.parent_exact_head,
              "complete_curl_terms": list(contract.complete_curl_terms),
              "cutoff_gradient_term_required": contract.cutoff_gradient_term_required,
              "paper_exact": contract.paper_exact,
              "pde_validated": contract.pde_validated,
              "source_bound_keys": sorted(contract.source_bound_payload()),
              "repository_realization_keys": sorted(contract.repository_realization_payload()),
          }
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/kokuno_agent2_source_contract_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Fail closed on scientific-boundary promotion
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_oscillatory_source_contract import (
              default_kokuno_oscillatory_source_contract,
          )

          c = default_kokuno_oscillatory_source_contract()
          c.validate()
          assert c.complete_curl_terms == (
              "chi_k curl(B^(k))",
              "grad(chi_k) x B^(k)",
          )
          assert c.cutoff_gradient_term_required is True
          assert c.paper_exact is False
          assert c.pde_validated is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokuno-agent2-oscillatory-source-contract-receipt
          path: artifacts/kokuno_agent2_source_contract_receipt.json
          if-no-files-found: error
