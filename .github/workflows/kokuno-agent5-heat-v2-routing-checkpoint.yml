name: kokuno-agent5-heat-v2-routing-checkpoint

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_heat_v2_routing_checkpoint.py'
      - 'src/openai_ns_reconstruction/kokuno_heat_discrepancy_v2_robustness.py'
      - 'src/openai_ns_reconstruction/kokuno_heat_replacement_discrepancy_v2.py'
      - 'src/openai_ns_reconstruction/kokuno_heat_replacement_discrepancy_independent.py'
      - 'tests/test_constrained_kokuno_heat_v2_routing_checkpoint.py'
      - 'tests/test_constrained_kokuno_heat_v2_robustness.py'
      - 'tests/test_constrained_kokuno_heat_replacement_discrepancy_v2.py'
      - '.github/workflows/kokuno-agent5-heat-v2-routing-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Agent-1/4/5 heat-v2 routing tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_heat_v2_routing_checkpoint.py
          tests/test_constrained_kokuno_heat_v2_robustness.py
          tests/test_constrained_kokuno_heat_replacement_discrepancy_v2.py
      - name: Generate heat-v2 routing bundle
        run: >-
          python -m openai_ns_reconstruction.kokuno_heat_v2_routing_checkpoint
          --output-dir artifacts/kokuno_agent5/heat_v2_routing_checkpoint_v10
      - name: Show receipt
        run: cat artifacts/kokuno_agent5/heat_v2_routing_checkpoint_v10/heat_v2_routing_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-heat-v2-routing-checkpoint-v10
          path: artifacts/kokuno_agent5/heat_v2_routing_checkpoint_v10
