name: kokuno-agent3-oscillatory-transport-mean

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_transport_mean.py'
      - 'tests/test_constrained_kokuno_oscillatory_transport_mean.py'
      - '.github/workflows/kokuno-agent3-oscillatory-transport-mean.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and Agent-3 ancestry
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor d305b64edcdde4f16dd8a48908f53fa23c2b9baf HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent-3 head
        run: python -m pip install -e '.[dev]'

      - name: Focused Agent-3 regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_oscillatory_transport_mean.py

      - name: Fetch exact Agent-2 handoff and Agent-1 backend
        run: |
          git fetch origin 4a78b06afbab95c108c184a32cb5951e66f42991
          git worktree add --detach "$RUNNER_TEMP/kokuno-a2-901" 4a78b06afbab95c108c184a32cb5951e66f42991
          test "$(git -C "$RUNNER_TEMP/kokuno-a2-901" rev-parse HEAD)" = "4a78b06afbab95c108c184a32cb5951e66f42991"
          test "$(git -C "$RUNNER_TEMP/kokuno-a2-901" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_oscillatory_transport_handoff.py)" = "57932afda3b65e4cb63e9ae7c8ceeb0aba141cc5"
          git fetch origin 300919075c07396e4e466f553be78eaae0707df2
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" 300919075c07396e4e466f553be78eaae0707df2
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD)" = "300919075c07396e4e466f553be78eaae0707df2"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = "5076ffa69748c2d7e68289a155b67288eab6dab4"

      - name: Exact A2 to A3 cylindrical mean receipt
        env:
          A2_WORKTREE: ${{ runner.temp }}/kokuno-a2-901
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import numpy as np

          # Import the Agent-3 module before extending the package path with A2.
          from openai_ns_reconstruction.kokuno_oscillatory_transport_mean import (
              AGENT2_HEAD,
              AGENT2_SOURCE_BLOB_SHA,
              ANGULAR_ORDERS,
              ExactAgent2OscillatoryTransportHandoff,
              materialize_oscillatory_transport_mean,
          )
          import openai_ns_reconstruction as package

          a2 = Path(os.environ['A2_WORKTREE'])
          a1 = Path(os.environ['A1_WORKTREE'])
          package.__path__.insert(0, str(a2 / 'src' / 'openai_ns_reconstruction'))
          from openai_ns_reconstruction.kokuno_oscillatory_transport_handoff import (
              KokunoOscillatoryTransportHandoff,
          )

          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous
          field = KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {'field_sha256': field.field_sha256}
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t')}
              elif op in ('velocity','velocity_dt','self_advection','velocity_laplacian'):
                  out = getattr(field, op)(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''
          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code],
              cwd=a1,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          meta = ask({'op':'meta'})

          class ExactAgent1Backend:
              field_sha256 = meta['field_sha256']
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def _call(self, op, x, y, z, t):
                  x,y,z,t = self._arrays(x,y,z,t)
                  result = ask({
                      'op':op, 'x':x.tolist(), 'y':y.tolist(),
                      'z':z.tolist(), 't':t.tolist(),
                  })
                  return np.asarray(result['value'], dtype=float)
              def velocity(self, x, y, z, t): return self._call('velocity', x, y, z, t)
              def velocity_dt(self, x, y, z, t): return self._call('velocity_dt', x, y, z, t)
              def self_advection(self, x, y, z, t): return self._call('self_advection', x, y, z, t)
              def velocity_laplacian(self, x, y, z, t): return self._call('velocity_laplacian', x, y, z, t)

          # Six source-interior rings frozen before observing this workflow's output.
          X = np.asarray([0.182, 0.202, 0.222, 0.242, 0.262, 0.282], dtype=float)
          eta = np.asarray([-0.24, -0.14, -0.04, 0.06, 0.16, 0.26], dtype=float)
          source_t = np.asarray([0.478, 0.486, 0.494, 0.502, 0.510, 0.518], dtype=float)
          mapped = ask({
              'op':'forward',
              'X':X.tolist(),
              'eta':eta.tolist(),
              't':source_t.tolist(),
              'theta':np.zeros_like(X).tolist(),
          })
          radius = np.hypot(np.asarray(mapped['x'], dtype=float), np.asarray(mapped['y'], dtype=float))
          z = np.asarray(mapped['z'], dtype=float)
          t = np.asarray(mapped['t'], dtype=float)

          raw_handoff = KokunoOscillatoryTransportHandoff(ExactAgent1Backend())
          exact = ExactAgent2OscillatoryTransportHandoff.bind(raw_handoff)
          witness = materialize_oscillatory_transport_mean(exact, radius, z, t)
          receipt = witness.to_receipt()

          failed=[]
          if AGENT2_HEAD != '4a78b06afbab95c108c184a32cb5951e66f42991': failed.append('agent2_head_constant')
          if AGENT2_SOURCE_BLOB_SHA != '57932afda3b65e4cb63e9ae7c8ceeb0aba141cc5': failed.append('agent2_blob_constant')
          if tuple(witness.angular_orders) != (32,64,128): failed.append('angular_ladder')
          if max(witness.successive_transport_mean_relative_differences) > 1.0e-5: failed.append('angular_convergence')
          if witness.pointwise_decomposition_closure_absolute_max > 5.0e-13: failed.append('pointwise_decomposition')
          if witness.pointwise_before_after_closure_absolute_max > 1.0e-12: failed.append('pointwise_before_after')
          if witness.projected_decomposition_closure_absolute_max > 1.0e-12: failed.append('projected_decomposition')
          if witness.projected_before_after_closure_absolute_max > 1.0e-12: failed.append('projected_before_after')
          if witness.transport_increment_mean_to_full_rms_ratio > 1.0 + 1.0e-12: failed.append('jensen')
          if witness.transport_increment_mean_rms < 1.0e-12: failed.append('nonzero_mean_floor')
          if witness.viscosity != 0.01: failed.append('viscosity')
          truth = receipt['truth_boundary']
          forbidden_true = (
              'pressure_gradient_included', 'restricted_forcing_included',
              'global_corrected_leading_join_materialized', 'complete_ns_defect',
              'radial_inverse_performed', 'scoped_transport_mean_authorized_as_correction_target',
              'mean_correction_velocity_materialized', 'real_candidate_finite_correction_cycle_run',
              'heldout_normalized_ns_residual_assessed', 'residual_reduction_claimed',
              'same_protocol_comparable_to_st006', 'pde_validated',
          )
          if any(truth[key] for key in forbidden_true): failed.append('truth_boundary_promotion')

          receipt.update({
              'schema':'kokuno-a3-oscillatory-transport-mean-exact-receipt-v1',
              'agent2_exact_head':AGENT2_HEAD,
              'agent1_reference_head':'300919075c07396e4e466f553be78eaae0707df2',
              'source_X':X.tolist(),
              'source_eta':eta.tolist(),
              'source_t':source_t.tolist(),
              'engineering_gates':{
                  'angular_relative_difference_max':1.0e-5,
                  'pointwise_decomposition_abs_max':5.0e-13,
                  'before_after_abs_max':1.0e-12,
                  'projected_abs_max':1.0e-12,
                  'nonzero_mean_floor':1.0e-12,
              },
              'failed_guards':failed,
              'classification':'strict-inner pressure/forcing-free oscillatory transport cylindrical mean',
              'candidate_residual_evidence':False,
          })
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/kokuno_agent3_oscillatory_transport_mean_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None: proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if failed:
              raise SystemExit('failed guards: ' + ', '.join(failed))
          PY

      - name: Upload exact mean receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-oscillatory-transport-mean-v1
          path: artifacts/kokuno_agent3_oscillatory_transport_mean_receipt.json
          if-no-files-found: warn
