name: kokuno-agent2-carrier-resolved-public

on:
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_carrier_resolved_velocity.py"
      - "tests/test_constrained_kokuno_public_carrier_resolved_velocity.py"
      - ".github/workflows/kokuno-agent2-carrier-resolved-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier-resolved-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile new source
        run: python -W error -m py_compile src/openai_ns_reconstruction/kokuno_public_carrier_resolved_velocity.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_carrier_resolved_velocity.py
          tests/test_constrained_kokuno_public_candidate_velocity.py
          tests/test_constrained_kokuno_candidate_mass_bound_phase_curl.py
          tests/test_constrained_kokuno_source_phase_bound_signed_curl.py
          tests/test_constrained_kokuno_source_signed_complete_curl_family.py
