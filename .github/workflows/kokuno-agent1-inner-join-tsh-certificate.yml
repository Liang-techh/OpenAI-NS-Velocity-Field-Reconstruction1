name: kokuno-agent1-inner-join-tsh-certificate

on:
  push:
    branches:
      - codex/kokuno-a1-inner-join-tsh-certificate-014
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a1-inner-join-tsh-certificate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inner-join-tsh-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused regressions
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_appendix_b_boundary.py \
            tests/test_constrained_kokuno_appendix_b_incoming_moments.py \
            tests/test_constrained_kokuno_inner_join_tsh_certificate.py
      - name: Generate selected PA10 receipt
        run: |
          python -m openai_ns_reconstruction.kokuno_inner_join_tsh_certificate \
            --eta-nodes 17 \
            --output artifacts/kokuno_agent1/inner_join_tsh_certificate/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-inner-join-tsh-certificate-v1
          path: artifacts/kokuno_agent1/inner_join_tsh_certificate/report.json
