name: kokuno-agent3-source-correction-cycle-gain

on:
  push:
    branches:
      - codex/kokuno-a3-source-cycle-gain-062
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_correction_cycle_gain_diagnostic.py"
      - "tests/test_constrained_kokuno_correction_cycle_gain_diagnostic.py"
      - ".github/workflows/kokuno-agent3-source-correction-cycle-gain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent3-source-correction-cycle-gain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-correction-cycle-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Verify exact Agent-3 head
        run: |
          git rev-parse HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Compile source-gain and inherited finite-cycle chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_correction_cycle_gain_diagnostic.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
      - name: Run focused warnings-as-errors regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_correction_cycle_gain_diagnostic.py
          tests/test_constrained_kokuno_finite_correction_cycle_ledger.py
          tests/test_constrained_kokuno_finite_correction_cycle_contract.py
      - name: Emit exact-head source-gain receipt
        run: >-
          python -W error -m
          openai_ns_reconstruction.kokuno_correction_cycle_gain_diagnostic
          --output artifacts/kokuno_agent3_source_correction_cycle_gain_v1.json
      - name: Freeze source arithmetic and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(
              Path("artifacts/kokuno_agent3_source_correction_cycle_gain_v1.json").read_text()
          )
          assert r["schema"] == "kokuno-a3-source-correction-cycle-gain-v1"
          q = r["analytic_mechanics_regression"]
          a = q["report"]
          assert a["step_count"] == 2
          assert a["source_gain_bounds_passed"] is True
          assert a["empirical_actual_defect_cycle_passed"] is True
          assert a["admitted"] is True
          assert abs(a["minimum_source_wave_gain"] - 0.39999) <= 1e-12
          assert abs(a["minimum_source_mean_gain"] - 0.17) <= 1e-12
          assert abs(a["minimum_source_defect_gain"] - 0.89996) <= 1e-12
          assert q["empirical_expansion_mutation_rejected"] is True
          assert q["negative_source_stage_rejected"] is True
          stage0 = a["source_stages"][0]
          assert abs(stage0["kappa_s"] - 1e-5) <= 1e-15
          assert abs(stage0["B_j"] - 0.7) <= 1e-15
          assert abs(stage0["C_j"] - 1.2) <= 1e-15
          assert abs(stage0["covariance_min_gain"] - 0.17998) <= 1e-12
          assert abs(stage0["H_minus_B_gain"] - 0.49998) <= 1e-12
          assert abs(stage0["signed_increment_budget"] - 0.69999) <= 1e-12
          b = r["truth_boundary"]
          assert b["source_kappa_s_frozen"] == 1e-5
          assert b["source_required_stage_gain_frozen"] == 0.1
          assert b["source_exponent_gain_arithmetic_executable"] is True
          assert b["source_gain_composed_with_actual_defect_ledger"] is True
          assert b["each_step_actual_defect_recomputed_from_raw_providers"] is True
          assert b["divergent_empirical_step_rejected"] is True
          assert b["caller_supplied_residual_allowed"] is False
          assert b["caller_supplied_source_gain_allowed"] is False
          assert b["formal_kokuno_correction_cycle_theorem_claimed"] is False
          assert b["real_candidate_finite_correction_cycle_run"] is False
          assert b["heldout_normalized_ns_residual_assessed"] is False
          assert b["pde_validated"] is False
          assert b["final_normalized_momentum_gate"] == 1e-3
          assert b["final_normalized_divergence_gate"] == 1e-5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-source-correction-cycle-gain-v1
          path: artifacts/kokuno_agent3_source_correction_cycle_gain_v1.json
          if-no-files-found: error
