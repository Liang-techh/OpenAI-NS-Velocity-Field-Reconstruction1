name: agent9-st052m-linear-ramp-fixed-render

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/constrained_st052m_linear_ramp_fixed_render.py'
      - 'tests/test_constrained_st052m_linear_ramp_fixed_render.py'
      - 'docs/external_methods/CR-A9-066-st052m-linear-ramp-fixed-render.md'
      - '.github/workflows/agent9-st052m-linear-ramp-fixed-render.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout Agent 9 branch
        uses: actions/checkout@v4

      - name: Checkout exact temporal child source
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: 0b93819095f6c8576a7571bdc2d2fbef4154944d
          path: _source/temporal

      - name: Checkout exact Agent 9 fixed-render helper
        uses: actions/checkout@v4
        with:
          repository: Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction1
          ref: ee80de11775bd45157d114000378b6ee3422ff46
          path: _source/render

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install governed render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10' 'matplotlib==3.10.6'
          python -m pip install -e . --no-deps

      - name: Verify exact source checkouts
        run: |
          test "$(git -C _source/temporal rev-parse HEAD)" = "0b93819095f6c8576a7571bdc2d2fbef4154944d"
          test "$(git -C _source/render rev-parse HEAD)" = "ee80de11775bd45157d114000378b6ee3422ff46"

      - name: Run warning-clean focused regressions
        run: |
          python -W error -m py_compile src/openai_ns_reconstruction/constrained_st052m_linear_ramp_fixed_render.py
          python -W error -m pytest -q tests/test_constrained_st052m_linear_ramp_fixed_render.py

      - name: Execute frozen five-time render comparison
        run: |
          set -o pipefail
          mkdir -p artifacts/agent9_st052m_linear_ramp_render
          python -m openai_ns_reconstruction.constrained_st052m_linear_ramp_fixed_render \
            --source-root _source/temporal \
            --render-root _source/render \
            --output-dir artifacts/agent9_st052m_linear_ramp_render \
            | tee artifacts/agent9_st052m_linear_ramp_render/console-summary.json

      - name: Verify fail-closed receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/agent9_st052m_linear_ramp_render/report.json').read_text())
          assert r['task_id'] == 'CR-A9-066'
          assert r['identities']['base_main_sha'] == 'f0193d66c9d92948b4820ebcb70263673995b324'
          assert r['identities']['temporal_head'] == '0b93819095f6c8576a7571bdc2d2fbef4154944d'
          assert r['identities']['temporal_convergence_head'] == 'b8d45d5d04a03e57739b0b3847c0994f4ade8642'
          assert r['identities']['static_render_head'] == 'ee80de11775bd45157d114000378b6ee3422ff46'
          assert r['source_replay']['source_checkout_expected_head'] == '0b93819095f6c8576a7571bdc2d2fbef4154944d'
          assert r['source_replay']['render_helper_expected_head'] == 'ee80de11775bd45157d114000378b6ee3422ff46'
          assert abs(r['source_replay']['redistribution_scale'] - 1.0032534663681094) < 5e-10
          assert abs(r['source_replay']['beta'] - 0.08837490297155456) < 5e-10
          assert abs(r['source_replay']['post_transform_common_scale'] - 1.0) < 1e-15
          assert r['contract']['times'] == [0.25, 0.375, 0.5, 0.625, 0.75]
          assert r['contract']['grid_resolution'] == 33
          assert r['contract']['streamline_count'] == 48
          assert r['contract']['image_or_openai_numeric_target_used'] is False
          assert r['contract']['visual_acceptance_threshold_used'] is False
          assert r['endpoint_identity']['ramp_vs_control_t025_max_abs'] <= 1e-11
          assert r['endpoint_identity']['ramp_vs_static_t075_max_abs'] <= 1e-11
          assert len(r['render_files']) == 5
          assert len(r['ramp_vs_control']) == 5
          assert len(r['static_vs_control']) == 5
          assert len(r['effect_retention']) == 5
          assert not any(r['truth'].values())
          for row in r['ramp_vs_control']:
              assert row['control']['streamlines']['line_count'] == 48
              assert row['child']['streamlines']['line_count'] == 48
              assert row['control']['vorticity']['enstrophy_aspect'] > 0
              assert row['child']['vorticity']['enstrophy_aspect'] > 0
              print(row['time'], row['relative'])
          PY

      - name: Publish exact numeric receipt to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/agent9-linear-ramp-render-receipt.md
          import hashlib
          import json
          from pathlib import Path

          path = Path('artifacts/agent9_st052m_linear_ramp_render/report.json')
          body = path.read_bytes()
          r = json.loads(body)
          retention = {row['time']: row for row in r['effect_retention']}
          print('### CR-A9-066 exact-head five-time render receipt')
          print()
          print(f"Report SHA-256: `{hashlib.sha256(body).hexdigest()}`")
          print(f"Endpoint identity max abs: control@.25 `{r['endpoint_identity']['ramp_vs_control_t025_max_abs']}`; static@.75 `{r['endpoint_identity']['ramp_vs_static_t075_max_abs']}`.")
          print()
          print('| t | g(t) | ramp mean turns | ramp axial span | ramp enstrophy aspect | ramp tip radial RMS | aspect effect retained vs static | tip effect retained vs static |')
          print('|---:|---:|---:|---:|---:|---:|---:|---:|')
          for row in r['ramp_vs_control']:
              t = row['time']
              q = row['relative']
              er = retention[t]['retention_ramp_over_static']
              a = er['enstrophy_aspect']
              tip = er['tip_vorticity_radial_rms']
              af = 'n/a' if a is None else f'{100*a:.4f}%'
              tf = 'n/a' if tip is None else f'{100*tip:.4f}%'
              print(f"| {t:.3f} | {2*(t-.25):.2f} | {100*q['mean_absolute_turns']:+.6f}% | {100*q['mean_axial_span']:+.6f}% | {100*q['enstrophy_aspect']:+.6f}% | {100*q['tip_vorticity_radial_rms']:+.6f}% | {af} | {tf} |")
          print()
          print('Truth boundary: target-free visualization diagnostics only; no production selection, pressure/forcing transfer, held-out NS momentum assessment, visual-correspondence claim, or PDE promotion.')
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/agent9-linear-ramp-render-receipt.md

      - name: Upload exact render artifact
        uses: actions/upload-artifact@v4
        with:
          name: ST052-M-linear-ramp-fixed-render
          path: artifacts/agent9_st052m_linear_ramp_render/
          if-no-files-found: error
          retention-days: 30
