name: kokuno-agent2-autonomous-signed-rectangle-geometry

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_autonomous_signed_rectangle_geometry.py'
      - 'src/openai_ns_reconstruction/kokuno_rational_rectangle_separation.py'
      - 'src/openai_ns_reconstruction/kokuno_source_band_covering.py'
      - 'src/openai_ns_reconstruction/kokuno_source_compatible_partition.py'
      - 'tests/test_constrained_kokuno_autonomous_signed_rectangle_geometry.py'
      - '.github/workflows/kokuno-agent2-autonomous-signed-rectangle-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous-signed-rectangle-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile new source
        run: python -m py_compile src/openai_ns_reconstruction/kokuno_autonomous_signed_rectangle_geometry.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_autonomous_signed_rectangle_geometry.py
          tests/test_constrained_kokuno_rational_rectangle_separation.py
          tests/test_constrained_kokuno_source_band_covering.py
          tests/test_constrained_kokuno_source_compatible_partition.py
