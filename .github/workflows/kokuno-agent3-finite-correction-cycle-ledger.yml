name: kokuno-agent3-finite-correction-cycle-ledger

on:
  push:
    branches:
      - codex/kokuno-a3-finite-cycle-ledger-048
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py"
      - "src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py"
      - "tests/test_constrained_kokuno_same_cycle_defect_contract.py"
      - "tests/test_constrained_kokuno_finite_correction_cycle_contract.py"
      - "tests/test_constrained_kokuno_finite_correction_cycle_ledger.py"
      - ".github/workflows/kokuno-agent3-finite-correction-cycle-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kokuno-agent3-finite-correction-cycle-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-finite-correction-cycle-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent-3 finite-cycle chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_same_cycle_defect_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_same_cycle_defect_contract.py
          tests/test_constrained_kokuno_finite_correction_cycle_contract.py
          tests/test_constrained_kokuno_finite_correction_cycle_ledger.py
      - name: Emit deterministic finite-cycle ledger receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_finite_correction_cycle_ledger
          --output artifacts/kokuno_agent3_finite_correction_cycle_ledger_v1.json
      - name: Check finite-cycle ledger truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/kokuno_agent3_finite_correction_cycle_ledger_v1.json').read_text())
          assert r['schema'] == 'kokuno-a3-finite-correction-cycle-ledger-v1'
          assert r['provenance']['parent_agent3_head'] == 'f7830a34784127a9ad7894047039b0ea1e8795eb'
          q = r['analytic_mechanics_regression']
          a = q['report']
          assert a['state_count'] == 3
          assert a['step_count'] == 2
          assert a['every_step_nontrivial'] is True
          assert a['every_step_actual_defect_gain_guard_passed'] is True
          assert a['empirical_cycle_contraction_passed'] is True
          assert all(abs(x - .5) <= 2e-10 for x in a['held_in_rms_contraction_factors'])
          assert all(abs(x - .5) <= 2e-10 for x in a['held_out_rms_contraction_factors'])
          assert abs(a['cumulative_held_in_rms_ratio'] - .25) <= 2e-10
          assert abs(a['cumulative_held_out_rms_ratio'] - .25) <= 2e-10
          assert q['expansion_mutation_rejected'] is True
          b = r['truth_boundary']
          assert b['finite_correction_cycle_ledger_executable'] is True
          assert b['each_step_actual_defect_recomputed_from_raw_providers'] is True
          assert b['one_disjoint_heldin_heldout_split_preserved_across_cycle'] is True
          assert b['empirical_actual_defect_contraction_diagnostic_executable'] is True
          assert b['divergent_intermediate_step_rejected'] is True
          assert b['caller_supplied_residual_allowed'] is False
          assert b['caller_supplied_defect_allowed'] is False
          assert b['caller_supplied_stress_allowed'] is False
          assert b['caller_supplied_target_allowed'] is False
          assert b['caller_supplied_gain_allowed'] is False
          assert b['caller_supplied_normalized_score_allowed'] is False
          assert b['caller_supplied_scientific_threshold_allowed'] is False
          assert b['formal_kokuno_correction_cycle_gain_bound_claimed'] is False
          assert b['real_full_candidate_defect_consumed'] is False
          assert b['real_candidate_finite_correction_cycle_run'] is False
          assert b['heldout_normalized_ns_residual_assessed'] is False
          assert b['residual_reduction_claimed_for_real_candidate'] is False
          assert b['pde_validated'] is False
          assert b['final_normalized_momentum_gate'] == 1e-3
          assert b['final_normalized_divergence_gate'] == 1e-5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-finite-correction-cycle-ledger-v1
          path: artifacts/kokuno_agent3_finite_correction_cycle_ledger_v1.json
          if-no-files-found: error
      - name: Comment exact finite-cycle ledger receipt on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/kokuno_agent3_finite_correction_cycle_ledger_v1.json', 'utf8'));
            const a = r.analytic_mechanics_regression.report;
            const lines = [
              '### Kokuno Agent 3 exact-head finite correction-cycle ledger',
              '',
              `steps: **${a.step_count}**`,
              `held-in RMS factors: **${JSON.stringify(a.held_in_rms_contraction_factors)}**`,
              `held-out RMS factors: **${JSON.stringify(a.held_out_rms_contraction_factors)}**`,
              `cumulative held-in RMS ratio: **${a.cumulative_held_in_rms_ratio}**`,
              `cumulative held-out RMS ratio: **${a.cumulative_held_out_rms_ratio}**`,
              `cumulative correction RMS budget: **${a.cumulative_correction_rms_budget}**`,
              `maximum correction divergence: **${a.maximum_correction_divergence_max}**`,
              `all actual-defect step guards pass: **${a.every_step_actual_defect_gain_guard_passed}**`,
              '',
              'This is an analytic mechanics regression for the multi-step ledger, not a real Kokuno candidate residual reduction or formal correction-cycle theorem. Real full-candidate defect consumption, public correction materialization, held-out normalized NS assessment and `pde_validated` remain false.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
