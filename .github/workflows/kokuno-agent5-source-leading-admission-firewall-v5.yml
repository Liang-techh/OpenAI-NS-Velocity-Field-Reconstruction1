name: kokuno-agent5-source-leading-admission-firewall-v5

on:
  push:
    branches:
      - codex/kokuno-a5-admit-r1-wstar-a4-pass-065
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall.py"
      - "src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v2.py"
      - "src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v3.py"
      - "src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v4.py"
      - "src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v5.py"
      - "tests/test_kokuno_a5_source_leading_admission_firewall.py"
      - "tests/test_kokuno_a5_source_leading_admission_firewall_v2.py"
      - "tests/test_kokuno_a5_source_leading_admission_firewall_v3.py"
      - "tests/test_kokuno_a5_source_leading_admission_firewall_v4.py"
      - "tests/test_kokuno_a5_source_leading_admission_firewall_v5.py"
      - ".github/workflows/kokuno-agent5-source-leading-admission-firewall-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-source-leading-admission-firewall-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-r1-wstar-logradial-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          echo "exact_head=$ACTUAL_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile admission firewall stack
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall.py \
            src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v2.py \
            src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v3.py \
            src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v4.py \
            src/openai_ns_reconstruction/kokuno_a5_source_leading_admission_firewall_v5.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_a5_source_leading_admission_firewall.py \
            tests/test_kokuno_a5_source_leading_admission_firewall_v2.py \
            tests/test_kokuno_a5_source_leading_admission_firewall_v3.py \
            tests/test_kokuno_a5_source_leading_admission_firewall_v4.py \
            tests/test_kokuno_a5_source_leading_admission_firewall_v5.py
      - name: Generate exact-head Agent-5 receipt
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python -W error -m openai_ns_reconstruction.kokuno_a5_source_leading_admission_firewall_v5 \
            --exact-head "$HEAD_SHA" \
            --output artifacts/kokuno_agent5/source_leading_admission_firewall_v5/report.json
      - name: Validate immutable truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent5/source_leading_admission_firewall_v5/report.json')
          payload = json.loads(path.read_text())
          exact_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert payload['exact_head'] == exact_head

          evidence = payload['new_independent_receipt']
          assert evidence['pr'] == 727
          assert evidence['head'] == '279de4c794935bcb3331627046be3c96b865bac7'
          assert evidence['workflow_id'] == 35477137066
          assert evidence['workflow_conclusion'] == 'success'
          assert evidence['artifact_id'] == 10596193830
          assert evidence['artifact_digest'] == 'sha256:08b514794efa085297ce9ab14d6e8eebc0e9d737b1a753e3ffd2dfd03baaa2b7'
          assert evidence['report_sha256'] == '76488aa1440e9651ded65480a529eac7b1fed86ea299e698eb5e6d8c4a315c6e'
          assert evidence['receipt_sha256'] == 'f0816da8a9c1264ef6822ed99034bfed9a15e6a5d1200fae1d9b378426da60ec'
          assert evidence['failed_guards'] == []
          assert evidence['independent_preflight_passed'] is True

          state = payload['derived_state']
          assert state['source_r2_all_ordinary_slots_independently_admitted'] is True
          assert state['source_r1_zeta_ordinary_slot_independently_admitted'] is True
          assert state['source_r1_averaged_eta_ordinary_slot_independently_admitted'] is True
          assert state['source_r1_wstar_logradial_ordinary_slot_independently_admitted'] is True
          assert state['source_r1_averaged_logradial_ordinary_slot_independently_admitted'] is False
          assert state['source_r1_hstar_phi_eta_ordinary_slot_independently_admitted'] is False
          assert state['source_r1_du_phi_eta_ordinary_slot_independently_admitted'] is False
          assert state['source_r1_all_ordinary_slots_independently_admitted'] is False
          assert state['source_full_post_J2_R1_machine_bound'] is False
          assert state['leading_ready'] is False
          assert state['correction_ready'] is False
          assert state['velocity_export_ready'] is False
          assert state['pde_validated'] is False

          progress = payload['upstream_agent1_r1_progress']
          assert progress['latest_pr'] == 751
          assert progress['ordinary_r1_source_bound_slots'] == 11
          assert progress['ordinary_r1_remaining_slots'] == 0
          assert progress['agent1_full_post_J2_R1_self_envelope_materialized'] is True
          assert progress['agent1_self_certificate_is_not_independent_admission'] is True
          assert progress['agent1_dedicated_workflow_conclusion_at_freeze'] == 'queued'

          pending = payload['pending_agent4_r1_audits']
          assert pending['averaged_logradial']['workflow_conclusion_at_freeze'] == 'queued'
          assert pending['hstar_phi_eta']['workflow_conclusion_at_freeze'] == 'queued'
          assert pending['du_phi_eta']['workflow_conclusion_at_freeze'] == 'queued'
          assert pending['earlier_algebraic_r1_slots']['independent_agent4_coverage_complete_at_freeze'] is False

          parent = payload['parent_a5_ci_at_freeze']
          assert parent['head'] == '069fdd19c7c6a7d63117c84f8db9f486a74c213d'
          assert parent['dedicated_workflow_id'] == 35482609891
          assert parent['dedicated_workflow_conclusion_at_freeze'] == 'queued'
          assert parent['parent_queued_ci_treated_as_success'] is False

          baseline = payload['baseline_vs_kokuno']
          assert baseline['retained_repository_baseline']['same_protocol_momentum_sampled_max'] == 0.1082289305112118
          assert baseline['retained_repository_baseline']['same_protocol_momentum_volume_L2'] == 0.10758432876230622
          assert baseline['kokuno_same_protocol_full_candidate_residual_available'] is False

          gates = payload['final_project_gates_unchanged']
          assert gates['normalized_momentum_max'] == 1e-3
          assert gates['normalized_momentum_L2'] == 1e-3
          assert gates['divergence_max'] == 1e-5
          assert gates['divergence_L2'] == 1e-5

          truth = payload['truth_boundary']
          assert truth['prior_r1_slots_retroactively_admitted'] is False
          assert truth['free_residual_defined_forcing_allowed'] is False
          assert truth['threshold_relaxed'] is False
          assert truth['pde_validated'] is False

          raw = path.read_bytes()
          print('artifact_sha256=', hashlib.sha256(raw).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('exact_head=', exact_head)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-source-leading-admission-firewall-v5
          path: artifacts/kokuno_agent5/source_leading_admission_firewall_v5/report.json
          if-no-files-found: error
