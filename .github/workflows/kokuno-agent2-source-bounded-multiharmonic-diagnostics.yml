name: kokuno-agent2-source-bounded-multiharmonic-diagnostics

on:
  push:
    branches: [kokuno-agent2-source-multiharmonic-diagnostics-105]
  pull_request:
    branches: [codex/k2-osc-104-bounded-multiharmonic]
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Verify exact A2 parent and minimal scope
        shell: bash
        run: |
          set -euo pipefail
          base=4241b0b4fcdc36e750798133101baaf803ba8c44
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-list --count "$base"..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only "$base"..HEAD | sort)
          test "${#files[@]}" -eq 3
          expected=(
            ".github/workflows/kokuno-agent2-source-bounded-multiharmonic-diagnostics.yml"
            "src/openai_ns_reconstruction/kokuno_source_bounded_multiharmonic_diagnostics.py"
            "tests/test_constrained_kokuno_source_bounded_multiharmonic_diagnostics.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_bounded_multiharmonic_velocity.py | git hash-object --stdin)" = 06bc24722b4219419e91cd2d5b08cb1294665f24
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_axis_safe_physical_velocity.py | git hash-object --stdin)" = 9067cb68dc49e08a3da7aaa429366f11d2073cdd
          test "$(git show "$base":src/openai_ns_reconstruction/kokuno_source_physicalized_localized_harmonic.py | git hash-object --stdin)" = b19805fc2e78d6a51b6ead6c141125a662d3ec4c

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install branch
        run: python -m pip install -e '.[dev]'

      - name: Focused A2 regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_source_bounded_multiharmonic_diagnostics.py \
            tests/test_constrained_kokuno_source_bounded_multiharmonic_diagnostics.py
          pytest -q \
            tests/test_constrained_kokuno_source_physicalized_localized_harmonic.py \
            tests/test_constrained_kokuno_source_axis_safe_physical_velocity.py \
            tests/test_constrained_kokuno_source_bounded_multiharmonic_velocity.py \
            tests/test_constrained_kokuno_source_bounded_multiharmonic_diagnostics.py

      - uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: corrected-source
          fetch-depth: 1

      - name: Authenticate corrected 2026-09-09 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C corrected-source rev-parse HEAD)" = 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C corrected-source hash-object navier-stokes/navier_stokes_workbench.tex)" = 205a99807302e21a51c5eaf223390c0dfc42bcd0

      - name: Materialize diagnostics receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          from openai_ns_reconstruction.kokuno_source_bounded_multiharmonic_diagnostics import (
              audit_bounded_multiharmonic_field,
              bounded_multiharmonic_diagnostics_contract,
              public_contract,
          )

          ns = runpy.run_path("tests/test_constrained_kokuno_source_bounded_multiharmonic_diagnostics.py")
          field = ns["_field"]()
          report = audit_bounded_multiharmonic_field(field)
          contract = bounded_multiharmonic_diagnostics_contract()
          public = public_contract()

          assert report["axis_support_observation"]["common_axis_core_exact_zero"] is True
          assert report["offgrid_observation"]["finite"] is True
          assert len(report["resolutions"]) == 3
          assert contract["complete_ns_residual_assessed"] is False
          assert contract["oscillation_before_after_ns_residual_compared"] is False
          assert contract["paper_exact"] is False
          assert contract["pde_validated"] is False
          assert public["forbidden_audit_inputs_present"] == []

          receipt = {
              "task": "K2-OSC-105",
              "field_semantic_sha256": field.semantic_sha256,
              "diagnostic": report,
              "contract": contract,
              "public_contract": public,
          }
          Path("receipts/bounded_multiharmonic_diagnostics.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload raw receipt before truth enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-source-bounded-multiharmonic-diagnostics
          path: receipts
          if-no-files-found: error

      - name: Enforce scientific truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from openai_ns_reconstruction.kokuno_source_bounded_multiharmonic_diagnostics import (
              bounded_multiharmonic_diagnostics_contract,
              public_contract,
          )
          c = bounded_multiharmonic_diagnostics_contract()
          p = public_contract()
          assert c["public_velocity_only_cartesian_derivatives_materialized"] is True
          assert c["three_resolution_divergence_observation_materialized"] is True
          assert c["three_resolution_vorticity_morphology_observation_materialized"] is True
          assert c["offgrid_velocity_observation_materialized"] is True
          assert c["certified_axis_zero_support_checked"] is True
          assert c["outer_support_boundary_assessed"] is False
          assert c["analytic_divergence_identity_proved_by_this_increment"] is False
          assert c["source_provider_self_contained"] is False
          assert c["complete_ns_residual_assessed"] is False
          assert c["oscillation_before_after_ns_residual_compared"] is False
          assert c["residual_reduction_claimed"] is False
          assert c["paper_exact"] is False
          assert c["pde_validated"] is False
          assert p["forbidden_audit_inputs_present"] == []
          PY
