name: kokuno-agent2-public-vector-potential

on:
  push:
    branches:
      - codex/kokuno-a2-public-vector-potential-042
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_public_oscillatory_vector_potential.py"
      - "tests/test_constrained_kokuno_public_oscillatory_vector_potential.py"
      - ".github/workflows/kokuno-agent2-public-vector-potential.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent2-public-vector-potential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-vector-potential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile vector-potential module
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_public_oscillatory_vector_potential.py
      - name: Run focused warnings-as-errors tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_public_oscillatory_vector_potential.py
          tests/test_constrained_kokuno_public_z_pullback_velocity.py
          tests/test_constrained_kokuno_public_oscillatory_time_derivative.py
      - name: Generate public-vector-potential curl receipt
        run: >-
          python -W error -m openai_ns_reconstruction.kokuno_public_oscillatory_vector_potential
          --output artifacts/kokuno_agent2_public_vector_potential_v1.json
      - name: Check immutable truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/kokuno_agent2_public_vector_potential_v1.json')
          r = json.loads(p.read_text())
          assert r['parent_agent2_head'] == '6c8e71c800a17c0e9df1802042f9feebf9dbce04'
          assert r['admitted_agent2_head'] == '732800ce4990464b49c8aa32d0dff4580f6684d4'
          assert r['truth_boundary']['velocity_candidate_changed'] is False
          assert r['truth_boundary']['source_formula_changed'] is False
          assert r['truth_boundary']['public_vector_potential_materialized'] is True
          assert r['truth_boundary']['independent_agent4_vector_potential_audit_required'] is True
          assert r['truth_boundary']['heldout_ns_momentum_residual_assessed'] is False
          assert r['truth_boundary']['pde_validated'] is False
          assert r['truth_boundary']['paper_exact'] is False
          assert r['support_exterior_absolute_max'] == 0.0
          print('curl_comparison=', r['curl_comparison'])
          print('rms_refinement_ratios=', r['rms_refinement_ratios'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-public-vector-potential-v1
          path: artifacts/kokuno_agent2_public_vector_potential_v1.json
          if-no-files-found: error
