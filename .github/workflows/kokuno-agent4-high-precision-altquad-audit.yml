name: kokuno-agent4-high-precision-altquad-audit

on:
  push:
    branches:
      - codex/kokuno-a4-highprec-altquad-audit-015
  pull_request:
    branches:
      - codex/kokuno-a1-highprec-moment-tensor-015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a4-highprec-altquad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused independent tests
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_high_precision_heat_repair.py \
            tests/test_constrained_kokuno_high_precision_heat_repair_independent.py
      - name: Generate alternate-quadrature audit report
        run: |
          python -m openai_ns_reconstruction.kokuno_high_precision_heat_repair_independent \
            --output artifacts/kokuno_agent4/high_precision_altquad_audit.json \
            || test -s artifacts/kokuno_agent4/high_precision_altquad_audit.json
          cat artifacts/kokuno_agent4/high_precision_altquad_audit.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-high-precision-altquad-audit
          path: artifacts/kokuno_agent4/high_precision_altquad_audit.json
