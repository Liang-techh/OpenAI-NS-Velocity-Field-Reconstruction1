name: kokuno-agent3-typed-selected-state

on:
  push:
    branches:
      - codex/kokuno-a3-selected-state-propagation-061
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_typed_mean_selected_state.py"
      - "tests/test_constrained_kokuno_typed_mean_selected_state.py"
      - ".github/workflows/kokuno-agent3-typed-selected-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent3-typed-selected-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-typed-selected-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Verify exact Agent-3 head
        run: |
          git rev-parse HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Compile selected-state and inherited finite-cycle chain
        run: >-
          python -W error -m py_compile
          src/openai_ns_reconstruction/kokuno_typed_mean_selected_state.py
          src/openai_ns_reconstruction/kokuno_typed_mean_damped_cycle_bridge.py
          src/openai_ns_reconstruction/kokuno_finite_correction_damping.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_contract.py
          src/openai_ns_reconstruction/kokuno_finite_correction_cycle_ledger.py
      - name: Run focused warnings-as-errors regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_typed_mean_selected_state.py
          tests/test_constrained_kokuno_typed_mean_damped_cycle_bridge.py
          tests/test_constrained_kokuno_finite_correction_damping.py
          tests/test_constrained_kokuno_finite_correction_cycle_ledger.py
      - name: Emit exact-head truth-boundary receipt
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_typed_mean_selected_state import truth_boundary

          boundary = truth_boundary()
          assert boundary['selected_damped_after_state_materialized'] is True
          assert boundary['selected_correction_provider_materialized'] is True
          assert boundary['selected_alpha_caller_supplied'] is False
          assert boundary['heldout_used_for_alpha_selection'] is False
          assert boundary['heldout_evaluated_again_during_state_materialization'] is False
          assert boundary['restricted_forcing_identity_preserved'] is True
          assert boundary['caller_supplied_residual_allowed'] is False
          assert boundary['caller_supplied_defect_allowed'] is False
          assert boundary['caller_supplied_scientific_threshold_allowed'] is False
          assert boundary['real_candidate_finite_correction_cycle_run'] is False
          assert boundary['heldout_normalized_ns_residual_assessed'] is False
          assert boundary['pde_validated'] is False
          receipt = {
              'schema': 'kokuno-a3-typed-selected-state-propagation-v1',
              'agent3_exact_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'parent_agent3_pr': 743,
              'mechanics_chain': 'typed-admitted-step->selected-after-state+correction-provider',
              'selected_alpha_caller_supplied': False,
              'heldout_evaluated_again_during_state_materialization': False,
              'real_full_candidate_bound': False,
              'real_finite_correction_cycle_run': False,
              'heldout_normalized_ns_residual_assessed': False,
              'residual_reduction_claimed_for_real_candidate': False,
              'pde_validated': False,
              'final_normalized_momentum_gate': 1.0e-3,
              'final_normalized_divergence_gate': 1.0e-5,
          }
          out = Path('artifacts/kokuno_agent3_typed_selected_state_v1.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-typed-selected-state-propagation-v1
          path: artifacts/kokuno_agent3_typed_selected_state_v1.json
          if-no-files-found: error
