name: kokuno-agent3-current-i4-exact-backend-firewall

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_current_i4_exact_backend_correction_firewall.py'
      - 'tests/test_constrained_kokuno_current_i4_exact_backend_correction_firewall.py'
      - '.github/workflows/kokuno-agent3-current-i4-exact-backend-firewall.yml'

permissions:
  contents: read

jobs:
  current-i4-exact-backend-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact Agent-3 PR head
        uses: actions/checkout@v4
        with:
          path: a3
          fetch-depth: 0

      - name: Verify bounded successor stack and parent bytes
        shell: bash
        run: |
          set -euo pipefail
          parent=e75940c33127b0725ddc703eaae97590158f2a56
          git -C a3 merge-base --is-ancestor "$parent" HEAD
          test "$(git -C a3 rev-list --count "$parent"..HEAD)" -eq 3
          git -C a3 diff --name-only "$parent"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/kokuno-agent3-current-i4-exact-backend-firewall.yml
          src/openai_ns_reconstruction/kokuno_current_i4_exact_backend_correction_firewall.py
          tests/test_constrained_kokuno_current_i4_exact_backend_correction_firewall.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_i4_rf34_rf39_pinned_provider.py)" = b99b3bee2b2dad6003c11acae7946c9be53347fb
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_i4_rf30_pinned_provider.py)" = 82009711a2e80dfb5afbd2b262f3258e0b2f4ac6
          test "$(git -C a3 hash-object src/openai_ns_reconstruction/kokuno_current_i4_auxiliary_t2_provider.py)" = 96168ac6583ad5e71aa044bd558c6feeadf051f4

      - name: Checkout corrected Kokuno reader
        uses: actions/checkout@v4
        with:
          repository: KokunoYumeto/yang-mills-interacting-workbench
          ref: 143f6773feb424ad9ed3a8d116653200f20346b7
          path: kokuno
          fetch-depth: 1

      - name: Authenticate corrected-source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C kokuno rev-parse HEAD)" = 143f6773feb424ad9ed3a8d116653200f20346b7
          test "$(git -C kokuno hash-object navier-stokes/navier_stokes_workbench.tex)" = 205a99807302e21a51c5eaf223390c0dfc42bcd0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent-3 tree
        run: python -m pip install -e a3

      - name: Compile and run focused firewall regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile a3/src/openai_ns_reconstruction/kokuno_current_i4_exact_backend_correction_firewall.py
          python -m py_compile a3/tests/test_constrained_kokuno_current_i4_exact_backend_correction_firewall.py
          python -m pytest -q -W error \
            a3/tests/test_constrained_kokuno_current_i4_rf30_pinned_provider.py \
            a3/tests/test_constrained_kokuno_current_i4_rf34_rf39_pinned_provider.py \
            a3/tests/test_constrained_kokuno_current_i4_exact_backend_correction_firewall.py

      - name: Materialize current exact-backend availability receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction.kokuno_current_i4_exact_backend_correction_firewall import truth_boundary

          root = Path('a3/src/openai_ns_reconstruction')
          composite_path = root / 'kokuno_current_i4_leading_oscillatory_identity.py'
          differential_path = root / 'kokuno_oscillatory_batch_differentials.py'
          composite_present = composite_path.exists()
          differential_present = differential_path.exists()
          real_rebind_executable = composite_present and differential_present

          payload = {
              'schema': 'kokuno-a3-current-i4-exact-backend-firewall-ci-receipt-v1',
              'truth_boundary': truth_boundary(),
              'current_exact_stack': {
                  'exact_a2_1080_composite_module_present': composite_present,
                  'exact_a2_960_differential_module_present': differential_present,
                  'real_exact_backend_rebind_numerically_executable_from_this_stack': real_rebind_executable,
                  'parent_1210_fixture_promotion_is_scientific_evidence': False,
                  'real_rf30_rf34_rf39_correction_numerically_executed_here': False,
                  'blocker': None if real_rebind_executable else (
                      'exact concrete A2 #1080/#960 runtime modules are not both present on this A3 stack; '
                      'do not substitute a directly-constructed dataclass fixture'
                  ),
              },
          }
          Path('artifacts/current_i4_exact_backend_firewall_receipt.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload['current_exact_stack'], sort_keys=True))
          PY

      - name: Upload receipt before enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent3-current-i4-exact-backend-firewall
          path: artifacts/

      - name: Enforce truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/current_i4_exact_backend_firewall_receipt.json').read_text())
          t = p['truth_boundary']
          assert t['exact_backend_rebind_required'] is True
          assert t['exact_backend_bind_authenticates_concrete_module_class_function_and_blobs'] is True
          assert t['manual_ExactCurrentI4NonlinearBackend_dataclass_construction_is_sufficient'] is False
          assert t['zero_or_synthetic_backend_fixture_is_scientific_correction_evidence'] is False
          assert t['parent_1210_promotion_without_exact_rebind_is_sufficient'] is False
          assert t['parent_rf30_rf31_rf34_rf39_formulas_changed'] is False
          assert t['agent2_curl_or_jacobian_reimplemented'] is False
          assert t['forbidden_scientific_controls_exposed'] is False
          assert t['final_normalized_momentum_gate'] == 1.0e-3
          assert t['final_normalized_divergence_gate'] == 1.0e-5
          assert t['residual_defined_free_forcing_allowed'] is False
          assert t['pde_validated'] is False

          c = p['current_exact_stack']
          assert c['parent_1210_fixture_promotion_is_scientific_evidence'] is False
          assert c['real_rf30_rf34_rf39_correction_numerically_executed_here'] is False
          if not c['real_exact_backend_rebind_numerically_executable_from_this_stack']:
              assert c['blocker']
          PY
