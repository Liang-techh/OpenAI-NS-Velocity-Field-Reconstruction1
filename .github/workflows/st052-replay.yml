name: st052-replay
on:
  pull_request:
    paths:
      - 'experiments/root_st052/**'
      - '.github/workflows/st052-replay.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/root_st052/**'
      - '.github/workflows/st052-replay.yml'
permissions:
  contents: read
jobs:
  frozen-minimax-field:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Test immutable parent and numerical identities
        run: |
          python scripts/ns_candidate.py verify
          python -m pytest -q -W error experiments/root_st052/test_minimax.py experiments/root_st052/test_frozen.py
      - name: Independently replay original full momentum and finite-grid structure
        shell: bash
        run: |
          set +e
          python experiments/root_st052/replay_st052.py --out outputs/ST052-M --seed 9175291 --validate --structure
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('outputs/ST052-M/validation.json').read_text())
          assert actual['pde_validated'] is False and actual['all_numeric_gates_pass'] is False
          assert actual['gates']['momentum_max'] is False and actual['gates']['momentum_L2'] is False
          assert all(v for k,v in actual['gates'].items() if k not in ('momentum_max','momentum_L2'))
          fine=[r for r in actual['spatial_refinement'] if r['space_step']==.005]
          assert len(fine)==6
          maximum=max(r['momentum_max'] for r in fine);l2=max(r['momentum_L2'] for r in fine)
          assert abs(maximum-.03681687198184801)<1e-5
          assert abs(l2-.05179943624413842)<1e-5
          s=json.loads(Path('outputs/ST052-M/structure.json').read_text())
          assert s['source_correspondence_verified'] is False
          for case in s['cases']:
              for row in case['rows']:
                  for key in ('inward_fraction','positive_swirl_fraction','bipolar_fraction','radial_pressure_inward_fraction','axial_pressure_toward_fraction'):
                      assert row[key]==1.
          # Legacy report key 'to_P' denotes this round's ST051-B parent.
          assert s['shear']['minimum_signed_ratio_to_P']>=.999
          assert s['shear']['minimum_signed_ratio_to_S']>=.995
          assert s['shear']['sign_reversals']==0
          print(maximum,l2,'Frozen field/structure replay matched; original NS momentum acceptance remains FAILED.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST052-M-independent-replay
          path: outputs/ST052-M/
          if-no-files-found: error
