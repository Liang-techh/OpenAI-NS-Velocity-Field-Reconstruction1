name: agent7-st048s-piola-temporal-screen

on:
  pull_request:
    paths:
      - 'experiments/root_st048/agent7_st048s_piola_temporal_screen.py'
      - 'experiments/root_st048/test_agent7_st048s_piola_temporal_screen.py'
      - '.github/workflows/agent7-st048s-piola-temporal-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'sympy>=1.12,<2' 'pytest>=8,<10'
      - name: Test temporal Piola screen
        working-directory: experiments/root_st048
        run: python -m pytest -q -W error test_agent7_st048s_piola_temporal_screen.py
      - name: Generate temporal Piola report
        working-directory: experiments/root_st048
        run: |
          python agent7_st048s_piola_temporal_screen.py --output ../../artifacts/st048_agent7_piola_temporal_screen/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../../artifacts/st048_agent7_piola_temporal_screen/report.json').read_text())
          print('smallest_crossing_gamma=',r['smallest_preregistered_temporal_endpoint_crossing_gamma'])
          print('sensitivity=',json.dumps(r['two_column_velocity_sensitivity'],sort_keys=True))
          for row in r['rows']:
              print(json.dumps({
                  'gamma':row['gamma'],
                  'beta_by_time':row['beta_by_time'],
                  'scale':row['common_energy_normalization_scale'],
                  'preflight':row['preflight_pass'],
                  'clean':row['temporal_endpoint_extension_rule_pass'],
                  'axial':row['axial_rms_relative_changes_vs_fixed_beta075'],
                  'radial':row['radial_rms_relative_changes_vs_fixed_beta075'],
                  'q90':row['q90_deltas_over_support_vs_fixed_beta075'],
                  'q99':row['q99_deltas_over_support_vs_fixed_beta075'],
                  'collar':row['collar_enstrophy_ratios_vs_fixed_beta075'],
                  'tail075':row['outer_075_enstrophy_relative_changes_vs_fixed_beta075'],
              },sort_keys=True))
          print(r['routing'])
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: agent7-st048s-piola-temporal-screen
          path: artifacts/st048_agent7_piola_temporal_screen/report.json
