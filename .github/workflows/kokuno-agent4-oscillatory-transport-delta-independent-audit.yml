name: kokuno-agent4-oscillatory-transport-delta-independent-audit

on:
  push:
    branches:
      - codex/kokuno-a4-oscillatory-transport-delta-independent-audit-075
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_a4_oscillatory_transport_delta_independent_audit.py'
      - 'tests/test_constrained_kokuno_a4_oscillatory_transport_delta_independent_audit.py'
      - '.github/workflows/kokuno-agent4-oscillatory-transport-delta-independent-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository
        run: python -m pip install -e '.[dev]'

      - name: Compile and run focused regressions
        run: |
          python -m py_compile \
            src/openai_ns_reconstruction/kokuno_a4_oscillatory_transport_delta_independent_audit.py \
            tests/test_constrained_kokuno_a4_oscillatory_transport_delta_independent_audit.py
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_a4_oscillatory_transport_delta_independent_audit.py

      - name: Verify pinned upstreams and prepare exact Agent-1 worktree
        shell: bash
        run: |
          set -euo pipefail
          A2_DELTA_HEAD='616e61abd2420a7c7aff3590a08393360039cd1a'
          A2_DELTA_EXPECTED='0f4d1614945688a6f5d0d6f4192979cabbbe9da8'
          A2_TRANSPORT_HEAD='016e3c152d7d11e4fedcd79b819df337f8942983'
          A2_TRANSPORT_EXPECTED='d6082ebd346ba8150321bf3d62f104c107a70300'
          A1_HEAD='e96ee90144976a992b62d76d4361a94eb16bd91e'
          A1_EXPECTED='74b0e185e8e0bbb08695d493e0a091c305a03006'
          git fetch --no-tags origin "$A2_DELTA_HEAD" "$A2_TRANSPORT_HEAD" "$A1_HEAD"
          test "$(git rev-parse "$A2_DELTA_HEAD":src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport_delta.py)" = "$A2_DELTA_EXPECTED"
          test "$(git rev-parse "$A2_TRANSPORT_HEAD":src/openai_ns_reconstruction/kokuno_public_inner_leading_oscillatory_transport.py)" = "$A2_TRANSPORT_EXPECTED"
          test "$(git rev-parse "$A1_HEAD":src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_laplacian.py)" = "$A1_EXPECTED"
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-839" "$A1_HEAD"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-839" rev-parse HEAD)" = "$A1_HEAD"

      - name: Generate exact-head independent before-after receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-839
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          from dataclasses import replace
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import sys
          import numpy as np

          from openai_ns_reconstruction.kokuno_a4_oscillatory_transport_delta_independent_audit import (
              AGENT1_LAPLACIAN_BLOB, AGENT1_LAPLACIAN_HEAD, AGENT1_LAPLACIAN_PR,
              AGENT2_DELTA_BLOB, AGENT2_DELTA_HEAD, AGENT2_DELTA_PR,
              AGENT2_TRANSPORT_BLOB, AGENT2_TRANSPORT_HEAD, AGENT2_TRANSPORT_PR,
              FD8_STEPS, VISCOSITY, before_after_fd8_transport,
              frozen_gate_failures, public_contract as a4_public_contract,
              relative_rms, relative_sampled_max, scalar_rms,
              successive_refinement_ratio, transports_at_viscosity, vector_rms,
          )
          from openai_ns_reconstruction.kokuno_public_inner_leading_oscillatory_transport_delta import (
              evaluate_inner_leading_oscillatory_transport_delta,
          )
          from openai_ns_reconstruction.kokuno_public_z_pullback_velocity import velocity_osc

          seed = 9173511
          random_count = 96
          axis_near_count = 6
          rng = np.random.default_rng(seed)
          a1 = Path(os.environ['A1_WORKTREE'])

          server_code = r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_laplacian import KokunoPA10CartesianCenterLaplacian
          field = KokunoPA10CartesianCenterLaplacian()
          for line in sys.stdin:
              request = json.loads(line)
              op = request['op']
              if op == 'meta':
                  result = {
                      'field_sha256': field.field_sha256,
                      'laplacian_sha256': field.laplacian_sha256,
                      'source_X_interval': list(field.spatial.source_X_interval),
                      'time_interval': list(field.field.time_interval),
                  }
              elif op == 'forward':
                  out = field.field.cartesian_from_similarity(
                      np.asarray(request['X'], dtype=float),
                      np.asarray(request['eta'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                      np.asarray(request['theta'], dtype=float),
                  )
                  result = {k: np.asarray(out[k], dtype=float).tolist() for k in ('x','y','z','t','X','eta')}
              elif op in ('velocity','velocity_dt','self_advection','velocity_laplacian'):
                  method = getattr(field, op)
                  out = method(
                      np.asarray(request['x'], dtype=float),
                      np.asarray(request['y'], dtype=float),
                      np.asarray(request['z'], dtype=float),
                      np.asarray(request['t'], dtype=float),
                  )
                  result = {'value': np.asarray(out, dtype=float).tolist()}
              else:
                  raise RuntimeError(f'unknown op {op}')
              print(json.dumps(result, sort_keys=True), flush=True)
          '''
          env = os.environ.copy()
          env['PYTHONPATH'] = str(a1 / 'src')
          proc = subprocess.Popen(
              [sys.executable, '-u', '-c', server_code], cwd=a1, env=env,
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1,
          )

          def ask(payload):
              assert proc.stdin is not None and proc.stdout is not None
              proc.stdin.write(json.dumps(payload, separators=(',', ':')) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  assert proc.stderr is not None
                  raise RuntimeError('Agent-1 backend exited: ' + proc.stderr.read())
              return json.loads(line)

          class ExactAgent1Backend:
              @staticmethod
              def _arrays(x, y, z, t):
                  return np.broadcast_arrays(
                      np.asarray(x, dtype=float), np.asarray(y, dtype=float),
                      np.asarray(z, dtype=float), np.asarray(t, dtype=float),
                  )
              def _call(self, op, x, y, z, t):
                  x, y, z, t = self._arrays(x, y, z, t)
                  out = ask({'op': op, 'x': x.tolist(), 'y': y.tolist(),
                             'z': z.tolist(), 't': t.tolist()})
                  return np.asarray(out['value'], dtype=float)
              def velocity(self, x, y, z, t): return self._call('velocity', x, y, z, t)
              def velocity_dt(self, x, y, z, t): return self._call('velocity_dt', x, y, z, t)
              def self_advection(self, x, y, z, t): return self._call('self_advection', x, y, z, t)
              def velocity_laplacian(self, x, y, z, t): return self._call('velocity_laplacian', x, y, z, t)

          meta = ask({'op': 'meta'})
          if meta['source_X_interval'][1] < 0.39 or meta['time_interval'] != [0.25, 0.75]:
              raise RuntimeError('unexpected Agent-1 domain metadata')

          X_random = rng.uniform(0.155, 0.265, size=random_count)
          eta_random = rng.uniform(-0.26, 0.26, size=random_count)
          t_random = rng.uniform(0.445, 0.555, size=random_count)
          theta_random = rng.uniform(0.0, 2.0 * math.pi, size=random_count)
          X_axis = np.asarray((0.0, 0.0, 0.0, 1.0e-12, 1.0e-10, 1.0e-8))
          eta_axis = np.asarray((-0.20, 0.0, 0.20, -1.0e-8, 1.0e-8, 0.10))
          t_axis = np.asarray((0.46, 0.50, 0.54, 0.48, 0.52, 0.50))
          theta_axis = np.asarray((0.21, 1.17, 2.31, 0.77, 1.83, 2.63))
          X = np.concatenate((X_random, X_axis))
          eta = np.concatenate((eta_random, eta_axis))
          source_t = np.concatenate((t_random, t_axis))
          theta = np.concatenate((theta_random, theta_axis))
          forward = ask({'op': 'forward', 'X': X.tolist(), 'eta': eta.tolist(),
                         't': source_t.tolist(), 'theta': theta.tolist()})
          x = np.asarray(forward['x'], dtype=float)
          y = np.asarray(forward['y'], dtype=float)
          z = np.asarray(forward['z'], dtype=float)
          tt = np.asarray(forward['t'], dtype=float)
          if x.size != random_count + axis_near_count:
              raise RuntimeError('held-out sample count drifted')

          backend = ExactAgent1Backend()
          production = evaluate_inner_leading_oscillatory_transport_delta(
              backend, x, y, z, tt
          )

          def inner_public_velocity(xx, yy, zz, time):
              return backend.velocity(xx, yy, zz, time)

          def total_public_velocity(xx, yy, zz, time):
              inner = backend.velocity(xx, yy, zz, time)
              osc = np.asarray(velocity_osc(xx, yy, zz, time), dtype=float)
              out = inner + osc
              if out.shape != inner.shape or not np.all(np.isfinite(out)):
                  raise RuntimeError('total public velocity became invalid')
              return out

          direct_inner = inner_public_velocity(x, y, z, tt)
          direct_total = total_public_velocity(x, y, z, tt)
          inner_velocity_closure = float(np.max(np.abs(direct_inner - production.inner_leading_velocity)))
          total_velocity_closure = float(np.max(np.abs(direct_total - production.inner_plus_oscillatory_velocity)))
          production_closure = float(np.max(np.abs(
              production.inner_plus_oscillatory_transport
              - production.inner_leading_transport
              - production.oscillatory_transport_increment
          )))

          levels = tuple(
              before_after_fd8_transport(
                  inner_public_velocity, total_public_velocity, x, y, z, tt, step=h
              ) for h in FD8_STEPS
          )
          failures = frozen_gate_failures(
              production.inner_leading_transport,
              production.oscillatory_transport_increment,
              levels,
              inner_velocity=production.inner_leading_velocity,
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          if inner_velocity_closure > 1.0e-14: failures.append('inner_velocity_closure')
          if total_velocity_closure > 1.0e-14: failures.append('total_velocity_closure')
          if production_closure > 5.0e-13: failures.append('production_before_after_closure')

          fine = levels[-1]
          inner_ref = np.asarray(production.inner_leading_transport, dtype=float)
          delta_ref = np.asarray(production.oscillatory_transport_increment, dtype=float)
          delta_error = fine.delta_transport - delta_ref
          delta_error_norm = np.linalg.norm(delta_error, axis=-1)
          worst = int(np.argmax(delta_error_norm))
          worst_component = int(np.argmax(np.abs(delta_error[worst])))

          resolution_metrics = []
          for level in levels:
              resolution_metrics.append({
                  'step': level.step,
                  'inner_relative_rms': relative_rms(inner_ref, level.inner.transport),
                  'inner_relative_sampled_max': relative_sampled_max(inner_ref, level.inner.transport),
                  'delta_relative_rms': relative_rms(delta_ref, level.delta_transport),
                  'delta_relative_sampled_max': relative_sampled_max(delta_ref, level.delta_transport),
                  'inner_divergence_sampled_max': float(np.max(np.abs(level.inner.divergence))),
                  'inner_divergence_sampled_rms': scalar_rms(level.inner.divergence),
                  'total_divergence_sampled_max': float(np.max(np.abs(level.total.divergence))),
                  'total_divergence_sampled_rms': scalar_rms(level.total.divergence),
              })

          refinements = {}
          for name, values in (
              ('inner', tuple(level.inner.transport for level in levels)),
              ('total', tuple(level.total.transport for level in levels)),
              ('delta', tuple(level.delta_transport for level in levels)),
          ):
              ratio, coarse_medium, medium_fine = successive_refinement_ratio(*values)
              refinements[name] = {'ratio': ratio, 'coarse_medium_rms': coarse_medium,
                                   'medium_fine_rms': medium_fine}

          independent_inner_rms = vector_rms(fine.inner.transport)
          independent_total_rms = vector_rms(fine.total.transport)
          independent_ratio = independent_total_rms / max(independent_inner_rms, np.finfo(float).tiny)
          production_inner_rms = vector_rms(production.inner_leading_transport)
          production_total_rms = vector_rms(production.inner_plus_oscillatory_transport)
          production_ratio = production_total_rms / max(production_inner_rms, np.finfo(float).tiny)

          scaled_delta_failures = frozen_gate_failures(
              inner_ref, 0.90 * delta_ref, levels,
              inner_velocity=production.inner_leading_velocity,
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          reversed_delta_failures = frozen_gate_failures(
              inner_ref, -delta_ref, levels,
              inner_velocity=production.inner_leading_velocity,
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          mutated_total = replace(fine.total, divergence=fine.total.divergence + 1.0e-3)
          mutated_fine = replace(fine, total=mutated_total)
          divergence_mutation_failures = frozen_gate_failures(
              inner_ref, delta_ref, (levels[0], levels[1], mutated_fine),
              inner_velocity=production.inner_leading_velocity,
              total_velocity=production.inner_plus_oscillatory_velocity,
          )
          mutations_detected = bool(
              'delta_fine_relative_rms' in scaled_delta_failures
              and 'delta_fine_relative_rms' in reversed_delta_failures
              and 'total_divergence_sampled_max' in divergence_mutation_failures
              and 'total_divergence_sampled_rms' in divergence_mutation_failures
          )
          if not mutations_detected: failures.append('mutation_controls')

          _, nominal_total, nominal_delta = transports_at_viscosity(fine, VISCOSITY)
          _, minus_total, minus_delta = transports_at_viscosity(fine, VISCOSITY * 0.999)
          _, plus_total, plus_delta = transports_at_viscosity(fine, VISCOSITY * 1.001)
          sensitivity = {
              'minus_0p1pct_total_relative_rms': relative_rms(nominal_total, minus_total),
              'plus_0p1pct_total_relative_rms': relative_rms(nominal_total, plus_total),
              'minus_0p1pct_delta_relative_rms': relative_rms(nominal_delta, minus_delta),
              'plus_0p1pct_delta_relative_rms': relative_rms(nominal_delta, plus_delta),
              'used_for_acceptance_or_retuning': False,
          }

          contract = a4_public_contract()
          truth = contract['truth_boundary']
          required_false = (
              'global_leading_velocity_materialized', 'outer_join_materialized',
              'matched_pressure_included', 'restricted_forcing_included',
              'correction_velocity_included', 'complete_kokuno_candidate_assembled',
              'leading_only_ns_residual_assessed',
              'leading_plus_oscillatory_ns_residual_assessed',
              'after_correction_ns_residual_assessed',
              'heldout_ns_momentum_residual_assessed',
              'formal_full_domain_pde_gate_assessed', 'boundary_support_gate_assessed',
              'pde_validated', 'paper_exact',
          )
          if any(truth[key] for key in required_false): failures.append('truth_boundary_promotion')

          axis_slice = slice(random_count, random_count + axis_near_count)
          axis_near_finite = bool(
              np.all(np.isfinite(fine.inner.transport[axis_slice]))
              and np.all(np.isfinite(fine.total.transport[axis_slice]))
              and np.all(np.isfinite(fine.delta_transport[axis_slice]))
          )
          if not axis_near_finite: failures.append('axis_near_nonfinite')

          receipt = {
              'schema': contract['schema'], 'task': contract['task'],
              'exact_a4_head': os.environ['EXPECTED_HEAD'],
              'agent2_delta_pr': AGENT2_DELTA_PR, 'agent2_delta_head': AGENT2_DELTA_HEAD,
              'agent2_delta_source_blob': AGENT2_DELTA_BLOB,
              'agent2_transport_pr': AGENT2_TRANSPORT_PR,
              'agent2_transport_head': AGENT2_TRANSPORT_HEAD,
              'agent2_transport_source_blob': AGENT2_TRANSPORT_BLOB,
              'agent1_laplacian_pr': AGENT1_LAPLACIAN_PR,
              'agent1_laplacian_head': AGENT1_LAPLACIAN_HEAD,
              'agent1_laplacian_source_blob': AGENT1_LAPLACIAN_BLOB,
              'agent1_field_sha256': meta['field_sha256'],
              'agent1_laplacian_sha256': meta['laplacian_sha256'],
              'seed': seed, 'random_offgrid_points': random_count,
              'axis_and_axis_near_points': axis_near_count, 'sample_count': int(x.size),
              'source_X_range': [float(np.min(X)), float(np.max(X))],
              'source_eta_range': [float(np.min(eta)), float(np.max(eta))],
              'time_range': [float(np.min(tt)), float(np.max(tt))],
              'viscosity': VISCOSITY, 'independent_fd8_steps': list(FD8_STEPS),
              'resolution_metrics': resolution_metrics, 'refinement_metrics': refinements,
              'independent_before_after_rms': {
                  'inner': independent_inner_rms, 'inner_plus_oscillatory': independent_total_rms,
                  'ratio_after_over_before': independent_ratio,
                  'oscillation_lowers_scoped_transport_rms': bool(independent_ratio < 1.0),
                  'observation_only_not_ns_acceptance': True,
              },
              'production_before_after_rms': {
                  'inner': production_inner_rms, 'inner_plus_oscillatory': production_total_rms,
                  'ratio_after_over_before': production_ratio,
              },
              'worst_delta_error': {
                  'sample_index': worst, 'component': worst_component,
                  'x': float(x[worst]), 'y': float(y[worst]), 'z': float(z[worst]),
                  't': float(tt[worst]), 'source_X': float(X[worst]),
                  'source_eta': float(eta[worst]),
                  'production_delta': float(delta_ref[worst, worst_component]),
                  'independent_fd8_delta': float(fine.delta_transport[worst, worst_component]),
                  'absolute_component_error': float(abs(delta_error[worst, worst_component])),
                  'vector_error_norm': float(delta_error_norm[worst]),
              },
              'closures': {
                  'inner_velocity_abs_max': inner_velocity_closure,
                  'total_velocity_abs_max': total_velocity_closure,
                  'production_before_after_abs_max': production_closure,
              },
              'axis_near_finite': axis_near_finite,
              'mutation_controls': {
                  'delta_scale_0p90_failures': scaled_delta_failures,
                  'delta_sign_reverse_failures': reversed_delta_failures,
                  'total_divergence_plus_1e3_failures': divergence_mutation_failures,
                  'all_detected': mutations_detected,
              },
              'viscosity_sensitivity': sensitivity,
              'frozen_gates': contract['frozen_gates'], 'norm_scope': contract['norm_scope'],
              'truth_boundary': truth, 'failed_guards': sorted(set(failures)),
          }

          out = Path('artifacts/kokuno_agent4')
          out.mkdir(parents=True, exist_ok=True)
          path = out / 'oscillatory_transport_delta_independent_audit.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if proc.stdin is not None: proc.stdin.close()
          proc.terminate(); proc.wait(timeout=10)
          if receipt['failed_guards']:
              raise SystemExit('scientific/validation guards failed: ' + ', '.join(receipt['failed_guards']))
          PY

      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-oscillatory-transport-delta-independent-audit-v1
          path: artifacts/kokuno_agent4/oscillatory_transport_delta_independent_audit.json
          if-no-files-found: warn
