name: kokuno-agent5-cartesian-center-ingest-contract

on:
  push:
    branches:
      - codex/kokuno-a5-cartesian-center-ingest-contract-071
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_a5_source_c_normalization_ingest_contract.py"
      - "src/openai_ns_reconstruction/kokuno_a5_cartesian_center_ingest_contract.py"
      - "tests/test_kokuno_a5_source_c_normalization_ingest_contract.py"
      - "tests/test_kokuno_a5_cartesian_center_ingest_contract.py"
      - ".github/workflows/kokuno-agent5-cartesian-center-ingest-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent5-cartesian-center-ingest-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-cartesian-center-ingest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          echo "exact_head=$ACTUAL_HEAD"
      - name: Verify frozen Agent-1 Cartesian-center source blob
        env:
          AGENT1_HEAD: 0666fff748d7c2659774b0aacba70042d045aab5
          EXPECTED_BLOB: f404eff536b91248f76095c111d788482a19f6a3
        run: |
          git fetch --no-tags origin "$AGENT1_HEAD"
          ACTUAL_BLOB="$(git rev-parse "$AGENT1_HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_velocity.py")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "agent1_cartesian_center_blob=$ACTUAL_BLOB"
      - name: Verify frozen Agent-4 Cartesian-center audit blob
        env:
          AGENT4_HEAD: 1f2c121483dac630a51d95823df59303a56e78da
          EXPECTED_BLOB: ef913488dee576ffe79dd359a55d881e62127bb6
        run: |
          git fetch --no-tags origin "$AGENT4_HEAD"
          ACTUAL_BLOB="$(git rev-parse "$AGENT4_HEAD:src/openai_ns_reconstruction/kokuno_a4_pa10_cartesian_center_independent_audit.py")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "agent4_cartesian_center_audit_blob=$ACTUAL_BLOB"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile integration seam
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_a5_source_c_normalization_ingest_contract.py \
            src/openai_ns_reconstruction/kokuno_a5_cartesian_center_ingest_contract.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_a5_source_c_normalization_ingest_contract.py \
            tests/test_kokuno_a5_cartesian_center_ingest_contract.py
      - name: Generate exact-head Cartesian-center ingest artifact
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python -W error -m openai_ns_reconstruction.kokuno_a5_cartesian_center_ingest_contract \
            --exact-head "$HEAD_SHA" \
            --output artifacts/kokuno_agent5/cartesian_center_ingest_contract_v1/report.json
      - name: Validate frozen evidence and truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent5/cartesian_center_ingest_contract_v1/report.json')
          payload = json.loads(path.read_text())
          exact_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert payload['exact_head'] == exact_head
          assert payload['schema'] == 'kokuno-a5-cartesian-center-ingest-contract-v1'
          assert payload['parent_a5'] == {
              'pr': 799,
              'head': 'a4fe0ab22b4f8ef499751453963502706f9e2d66',
          }

          a1 = payload['agent1_cartesian_center_binding']
          assert a1['pr'] == 803
          assert a1['head'] == '0666fff748d7c2659774b0aacba70042d045aab5'
          assert a1['source_blob_sha'] == 'f404eff536b91248f76095c111d788482a19f6a3'
          assert a1['schema'] == 'kokuno-pa10-cartesian-center-velocity-v1'
          assert a1['public_velocity_signature'] == 'velocity(x,y,z,t)->[...,3]'
          assert a1['registered_time_interval'] == [0.25, 0.75]
          assert a1['domain_boundary']['inner_source_X_only'] is True
          assert a1['domain_boundary']['outer_global_continuation_materialized'] is False
          assert a1['identity_boundary']['field_semantic_sha256_exposed'] is True
          assert a1['identity_boundary']['field_identity_separate_from_evidence_receipt'] is True

          a4 = payload['agent4_cartesian_center_binding']
          assert a4['pr'] == 806
          assert a4['head'] == '1f2c121483dac630a51d95823df59303a56e78da'
          assert a4['source_blob_sha'] == 'ef913488dee576ffe79dd359a55d881e62127bb6'
          assert a4['schema'] == 'kokuno-a4-pa10-cartesian-center-independent-audit-v1'
          assert a4['fd4_spatial_steps'] == [0.004, 0.002, 0.001]
          assert a4['mapping_sample_count'] == 2048
          assert a4['divergence_sample_count'] == 48

          assert payload['evidence'] == {
              'agent1_exact_head_ci_conclusion': None,
              'agent4_exact_head_ci_conclusion': None,
              'agent4_inner_cartesian_center_independently_audited': False,
              'source_C_independent_admission_inherited': False,
          }

          api = payload['candidate_api_handoff']
          assert api['velocity'] == 'Agent1#803.KokunoPA10CartesianCenterVelocity.velocity'
          assert api['velocity_dt'] is None
          assert api['pressure'] is None
          assert api['forcing'] is None
          assert api['complete_candidate_api_ready'] is False

          status = payload['ingest_status']
          assert status['typed_inner_cartesian_center_velocity_interface_registered'] is True
          assert status['typed_inner_cartesian_center_independent_audit_registered'] is True
          assert status['inner_cartesian_center_velocity_ingest_admitted'] is False
          assert status['inner_cartesian_center_field_identity_registered'] is True
          assert status['outer_global_leading_join_materialized'] is False
          assert status['global_leading_velocity_materialized'] is False
          assert status['matched_global_pressure_materialized'] is False
          assert status['restricted_forcing_composite_validated'] is False
          assert status['leading_ready'] is False

          assert payload['stage_state'] == {
              'leading_ready': False,
              'oscillatory_ready': True,
              'correction_ready': False,
              'velocity_export_ready': False,
              'pde_validated': False,
          }
          assert payload['baseline_vs_kokuno']['kokuno_same_protocol_full_candidate_residual_available'] is False
          assert payload['baseline_vs_kokuno']['comparison_performed'] is False
          assert payload['final_project_gates_unchanged'] == {
              'normalized_momentum_max': 1e-3,
              'normalized_momentum_L2': 1e-3,
              'divergence_max': 1e-5,
              'divergence_L2': 1e-5,
          }

          truth = payload['truth_boundary']
          assert truth['interface_registration_not_scientific_admission'] is True
          for key, value in truth.items():
              if key == 'interface_registration_not_scientific_admission':
                  continue
              assert value is False, (key, value)

          print('artifact_sha256=', hashlib.sha256(path.read_bytes()).hexdigest())
          print('contract_sha256=', payload['contract_sha256'])
          print('exact_head=', exact_head)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-cartesian-center-ingest-contract-v1
          path: artifacts/kokuno_agent5/cartesian_center_ingest_contract_v1/report.json
          if-no-files-found: error
