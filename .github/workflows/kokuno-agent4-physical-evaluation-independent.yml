name: kokuno-agent4-physical-evaluation-independent

on:
  push:
    branches:
      - codex/kokuno-a4-physical-evaluation-independent-023
  pull_request:
    branches:
      - codex/kokuno-a2-physical-evaluation-map-024
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a4-physical-evaluation-independent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused parent and independent tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_physical_evaluation.py
          tests/test_constrained_kokuno_physical_evaluation_independent.py
      - name: Generate independent physical-evaluation report
        run: |
          python -m openai_ns_reconstruction.kokuno_physical_evaluation_independent \
            --output artifacts/kokuno_agent4/physical_evaluation_independent_audit.json
          cat artifacts/kokuno_agent4/physical_evaluation_independent_audit.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-physical-evaluation-independent-audit
          path: artifacts/kokuno_agent4/physical_evaluation_independent_audit.json
