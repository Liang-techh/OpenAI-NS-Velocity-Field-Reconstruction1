name: kokuno-agent1-pa10-post-j-remainder-bridge

on:
  push:
    branches:
      - codex/kokuno-a1-pa10-post-j-remainder-bridge-053
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-pa10-post-j-remainder-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-j-remainder-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_operator_primitives.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_axis_domain.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_phi_ball.py \
            src/openai_ns_reconstruction/kokuno_pa10_mixed_jnu_seams.py \
            src/openai_ns_reconstruction/kokuno_pa10_source_u_ball.py \
            src/openai_ns_reconstruction/kokuno_pa10_post_j_remainder_bridge.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_constrained_kokuno_pa10_operator_primitives.py \
            tests/test_constrained_kokuno_pa10_source_axis_domain.py \
            tests/test_constrained_kokuno_pa10_source_phi_ball.py \
            tests/test_constrained_kokuno_pa10_mixed_jnu_seams.py \
            tests/test_constrained_kokuno_pa10_source_u_ball.py \
            tests/test_constrained_kokuno_pa10_post_j_remainder_bridge.py
      - name: Generate exact-head post-J receipt
        run: |
          python -W error -m openai_ns_reconstruction.kokuno_pa10_post_j_remainder_bridge \
            --output artifacts/kokuno_agent1/pa10_post_j_remainder_bridge/report.json
      - name: Bind exact head and validate truth boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path
          import subprocess

          path = Path('artifacts/kokuno_agent1/pa10_post_j_remainder_bridge/report.json')
          payload = json.loads(path.read_text())
          payload['exact_head'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          raw = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)

          fixed = payload['source_compatible_fixed_inputs']
          mixed = payload['source_compatible_full_mixed_terms']
          diagnostic = payload['diagnostic_unit_ordinary_fixture']
          truth = payload['truth_boundary']
          assert fixed['rho'] == 1e-6
          assert fixed['L_inverse_coefficient_ball']['norm'] > 1.0
          assert fixed['Lambda_inverse_uniform_upper_for_Lambda_ge_1'] == 1.0
          for key in (
              'lambda_inv_Linv_d_detaAu_Y_Phi_Y_after_J2',
              'lambda_inv_Linv_d_detaAu_Y_u_Y_after_J1',
          ):
              assert math.isfinite(mixed[key]['norm']) and mixed[key]['norm'] > 0
              assert math.isfinite(mixed[key]['lipschitz']) and mixed[key]['lipschitz'] > 0
          assembly = diagnostic['assembly']
          assert len(assembly['R1_ordinary_after_J2']) == 11
          assert len(assembly['R2_ordinary_after_J1']) == 11
          assert assembly['ordinary_inputs_source_certified'] is False
          assert math.isfinite(assembly['post_J2_R1']['norm'])
          assert math.isfinite(assembly['post_J1_R2']['norm'])
          assert truth['termwise_post_J_remainder_bridge_executable'] is True
          assert truth['source_compatible_full_R1_mixed_post_J2_term_executable'] is True
          assert truth['source_compatible_full_R2_mixed_post_J1_term_executable'] is True
          assert truth['ordinary_term_inputs_are_source_certified'] is False
          assert truth['source_full_post_J2_R1_radius_one_ball_bound_machine_bound'] is False
          assert truth['source_full_post_J1_R2_radius_one_ball_bound_machine_bound'] is False
          assert truth['source_operator_constant_M_machine_bound'] is False
          assert truth['source_operator_constant_K_machine_bound'] is False
          assert truth['global_leading_profile_reconstructed'] is False
          assert payload['heldout_ns_residual_assessed'] is False
          assert payload['pde_validated'] is False
          print('artifact_sha256=', hashlib.sha256(raw.encode()).hexdigest())
          print('receipt_sha256=', payload['receipt_sha256'])
          print('L_inverse_ball=', fixed['L_inverse_coefficient_ball'])
          print('mixed_full_after_Jnu=', mixed)
          print('diagnostic_post_J2_R1=', assembly['post_J2_R1'])
          print('diagnostic_post_J1_R2=', assembly['post_J1_R2'])
          print('diagnostic_pair=', diagnostic['pair_envelope'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent1-pa10-post-j-remainder-bridge-v1
          path: artifacts/kokuno_agent1/pa10_post_j_remainder_bridge/report.json
