name: kokuno-agent5-rf40-axial-shutdown-radial-force-ingest

on:
  push:
    branches:
      - codex/kokuno-a5-rf40-axial-shutdown-radial-force-ingest-102
  pull_request:
    branches:
      - codex/kokuno-a5-rf40-axial-shutdown-radial-stress-ingest-101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact A5 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor b5b9b30f6a209e13f22eb8aa3b7f0a251637cc42 HEAD
          test "$(git rev-list --count b5b9b30f6a209e13f22eb8aa3b7f0a251637cc42..HEAD)" -eq 3
          mapfile -t files < <(git diff --name-only b5b9b30f6a209e13f22eb8aa3b7f0a251637cc42..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            .github/workflows/kokuno-agent5-rf40-axial-shutdown-radial-force-ingest.yml \
            src/openai_ns_reconstruction/kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract.py \
            tests/test_kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract.py \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run parent and current Agent-5 contract tests
        run: |
          pytest -q \
            tests/test_kokuno_a5_rf40_axial_shutdown_radial_stress_ingest_contract.py \
            tests/test_kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract.py

      - name: Authenticate exact parent and sibling source/test/workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local commit="$1" path="$2" expected="$3"
            git fetch --no-tags origin "$commit" >/dev/null 2>&1 || true
            actual="$(git rev-parse "${commit}:${path}")"
            test "$actual" = "$expected" || { echo "blob mismatch for $commit:$path: $actual != $expected"; exit 1; }
          }
          check_blob b5b9b30f6a209e13f22eb8aa3b7f0a251637cc42 src/openai_ns_reconstruction/kokuno_a5_rf40_axial_shutdown_radial_stress_ingest_contract.py b5d3c845dd8daffc7cd3dc2634d7532acd1435b6
          check_blob b5b9b30f6a209e13f22eb8aa3b7f0a251637cc42 tests/test_kokuno_a5_rf40_axial_shutdown_radial_stress_ingest_contract.py 8d9e8f581efa79f7a7c93b4f586155ade960f2f9
          check_blob b5b9b30f6a209e13f22eb8aa3b7f0a251637cc42 .github/workflows/kokuno-agent5-rf40-axial-shutdown-radial-stress-ingest.yml 57ed5d6e5169a332041c66136879f2ee08948777
          check_blob 93200f28deae4372c2338e0620b785543af892d4 src/openai_ns_reconstruction/kokuno_current_rf40_axial_shutdown_nonlinear_radial_force.py 222e75ab5ecb1f0625ed3b25d4e2defe6f780b8f
          check_blob 93200f28deae4372c2338e0620b785543af892d4 tests/test_constrained_kokuno_current_rf40_axial_shutdown_nonlinear_radial_force.py 5c4aeb46ad229e94c43a3a5ebc94746363eea01a
          check_blob 93200f28deae4372c2338e0620b785543af892d4 .github/workflows/kokuno-agent3-current-rf40-axial-shutdown-nonlinear-radial-force.yml a70cf9b5d04d368ad886cce3fe4a35f0521a4c30
          check_blob cc3109bd17d518f3414d972f2303a20f2dabc1b1 src/openai_ns_reconstruction/kokuno_a4_current_rf40_axial_shutdown_radial_stress_independent_audit.py c886a7e9d222313125f5e242ca9cc9828babdb23
          check_blob cc3109bd17d518f3414d972f2303a20f2dabc1b1 tests/test_constrained_kokuno_a4_current_rf40_axial_shutdown_radial_stress_independent_audit.py 102f5072c97815e808dacf9b9faf03bbb351a6a6
          check_blob cc3109bd17d518f3414d972f2303a20f2dabc1b1 .github/workflows/kokuno-agent4-current-rf40-axial-shutdown-radial-stress-independent-audit.yml 9e9ff1b12e3acd42753be5abd3b8cc97fe9771fe

      - name: Materialize frozen integration receipt
        run: |
          mkdir -p artifacts/kokuno-agent5
          python -m openai_ns_reconstruction.kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract \
            --output artifacts/kokuno-agent5/rf40_axial_shutdown_radial_force_ingest.json
          python - <<'PY'
          import json
          from pathlib import Path
          from openai_ns_reconstruction import kokuno_a5_rf40_axial_shutdown_radial_force_ingest_contract as c
          p = Path('artifacts/kokuno-agent5/rf40_axial_shutdown_radial_force_ingest.json')
          receipt = json.loads(p.read_text())
          c.enforce_registration_receipt(receipt)
          r = receipt['registration']
          assert r['readiness']['pde_validated'] is False
          assert r['readiness']['correction_ready'] is False
          assert r['truth_boundary']['current_nonlinear_radial_force_through_axial_shutdown_materialized'] is True
          assert r['truth_boundary']['agent4_dedicated_axial_shutdown_radial_force_audit_present'] is False
          assert r['truth_boundary']['agent4_independent_axial_shutdown_radial_force_audit_registered'] is False
          assert r['truth_boundary']['scoped_axial_shutdown_radial_force_authorized_as_ns_correction_target'] is False
          assert r['truth_boundary']['heldout_normalized_ns_residual_assessed'] is False
          assert r['frozen_science']['residual_defined_free_forcing_forbidden'] is True
          PY

      - name: Upload registration receipt before any future scientific admission
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent5-rf40-axial-shutdown-radial-force-ingest
          path: artifacts/kokuno-agent5/rf40_axial_shutdown_radial_force_ingest.json
          if-no-files-found: error
