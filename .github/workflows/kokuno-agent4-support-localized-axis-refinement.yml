name: kokuno-agent4-support-localized-axis-refinement

on:
  push:
    branches:
      - codex/kokuno-a4-support-localized-axis-refinement-018
  pull_request:
    branches:
      - codex/kokuno-a4-support-localized-cartesian-audit-017
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-a4-support-localized-axis-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused parent and independent tests
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_source_support_localized_curl.py
          tests/test_constrained_kokuno_support_localized_cartesian_independent.py
          tests/test_constrained_kokuno_support_localized_axis_refinement.py
      - name: Generate independent small-radius refinement report
        run: |
          python -m openai_ns_reconstruction.kokuno_support_localized_axis_refinement \
            --output artifacts/kokuno_agent4/support_localized_axis_refinement.json
          cat artifacts/kokuno_agent4/support_localized_axis_refinement.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent4-support-localized-axis-refinement
          path: artifacts/kokuno_agent4/support_localized_axis_refinement.json
