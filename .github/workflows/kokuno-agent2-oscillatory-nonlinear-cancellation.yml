name: kokuno-agent2-oscillatory-nonlinear-cancellation

on:
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_nonlinear_cancellation.py'
      - 'tests/test_constrained_kokuno_oscillatory_nonlinear_cancellation.py'
      - '.github/workflows/kokuno-agent2-oscillatory-nonlinear-cancellation.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert pinned A2 ancestry
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor b8159807d53c362bbdd691b56bdcd4c03456cff0 HEAD
          test "$(git rev-parse b8159807d53c362bbdd691b56bdcd4c03456cff0:src/openai_ns_reconstruction/kokuno_oscillatory_nonlinear_attribution.py)" = "ff74ef1d12da5b5e5bb4291e949d0150c1b59148"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused regressions
        run: >-
          python -m pytest -q -W error
          tests/test_constrained_kokuno_oscillatory_nonlinear_cancellation.py
          tests/test_constrained_kokuno_oscillatory_nonlinear_attribution.py
          tests/test_constrained_kokuno_oscillatory_nonlinear_handoff.py

      - name: Fetch exact Agent-1 strict-inner backend
        run: |
          git fetch origin 300919075c07396e4e466f553be78eaae0707df2
          git worktree add --detach "$RUNNER_TEMP/kokuno-a1-848" 300919075c07396e4e466f553be78eaae0707df2
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD)" = "300919075c07396e4e466f553be78eaae0707df2"
          test "$(git -C "$RUNNER_TEMP/kokuno-a1-848" rev-parse HEAD:src/openai_ns_reconstruction/kokuno_pa10_cartesian_center_transport_viscous.py)" = "5076ffa69748c2d7e68289a155b67288eab6dab4"

      - name: Materialize exact strict-inner nonlinear cancellation receipt
        env:
          A1_WORKTREE: ${{ runner.temp }}/kokuno-a1-848
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, subprocess, sys
          from pathlib import Path
          import numpy as np
          from openai_ns_reconstruction.kokuno_oscillatory_nonlinear_cancellation import (
              KokunoOscillatoryNonlinearCancellation, public_contract,
          )

          a1=Path(os.environ['A1_WORKTREE'])
          server=r'''
          import json, sys
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_cartesian_center_transport_viscous import KokunoPA10CartesianCenterTransportViscous
          field=KokunoPA10CartesianCenterTransportViscous()
          for line in sys.stdin:
              q=json.loads(line); op=q['op']
              if op=='meta': out={'field_sha256':field.field_sha256}
              elif op=='forward':
                  r=field.field.cartesian_from_similarity(np.asarray(q['X']),np.asarray(q['eta']),np.asarray(q['t']),np.asarray(q['theta']))
                  out={k:np.asarray(r[k],dtype=float).tolist() for k in ('x','y','z','t')}
              else:
                  r=getattr(field,op)(np.asarray(q['x']),np.asarray(q['y']),np.asarray(q['z']),np.asarray(q['t']))
                  out={'value':np.asarray(r,dtype=float).tolist()}
              print(json.dumps(out,sort_keys=True),flush=True)
          '''
          env=os.environ.copy(); env['PYTHONPATH']=str(a1/'src')
          p=subprocess.Popen([sys.executable,'-u','-c',server],cwd=a1,env=env,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
          def ask(q):
              p.stdin.write(json.dumps(q,separators=(',',':'))+'\n'); p.stdin.flush()
              line=p.stdout.readline()
              if not line: raise RuntimeError(p.stderr.read())
              return json.loads(line)
          meta=ask({'op':'meta'})
          class Backend:
              field_sha256=meta['field_sha256']
              def _call(self,op,x,y,z,t):
                  x,y,z,t=np.broadcast_arrays(np.asarray(x,float),np.asarray(y,float),np.asarray(z,float),np.asarray(t,float))
                  return np.asarray(ask({'op':op,'x':x.tolist(),'y':y.tolist(),'z':z.tolist(),'t':t.tolist()})['value'],float)
              def velocity(self,x,y,z,t): return self._call('velocity',x,y,z,t)
              def velocity_dt(self,x,y,z,t): return self._call('velocity_dt',x,y,z,t)
              def self_advection(self,x,y,z,t): return self._call('self_advection',x,y,z,t)
              def velocity_laplacian(self,x,y,z,t): return self._call('velocity_laplacian',x,y,z,t)

          # Fresh preregistered strict-inner probes. Values are frozen before Actions output.
          X=np.asarray([0.186,0.201,0.217,0.234,0.251,0.268,0.284,0.297],float)
          eta=np.asarray([-0.21,-0.15,-0.08,-0.01,0.06,0.12,0.18,0.23],float)
          tt=np.asarray([0.479,0.487,0.495,0.503,0.511,0.519,0.527,0.535],float)
          theta=np.asarray([0.37,0.81,1.25,1.69,2.13,2.57,3.01,-2.83],float)
          m=ask({'op':'forward','X':X.tolist(),'eta':eta.tolist(),'t':tt.tolist(),'theta':theta.tolist()})
          x,y,z,t=(np.asarray(m[k],float) for k in ('x','y','z','t'))

          diagnostic=KokunoOscillatoryNonlinearCancellation(Backend())
          result=diagnostic.evaluate(x,y,z,t)
          contract=public_contract()
          payload=result.to_payload()
          cosines=np.asarray([payload[k] for k in (
              'inner_to_osc_vs_osc_to_inner_cosine','inner_to_osc_vs_self_cosine',
              'osc_to_inner_vs_self_cosine','mixed_vs_self_cosine')],float)
          ratios=np.asarray([payload['mixed_cancellation_ratio'],payload['aggregate_cancellation_ratio']],float)
          failed=[]
          if not np.all(np.isfinite(cosines)): failed.append('nonfinite_cosines')
          if np.min(cosines)<-1.0-1e-12 or np.max(cosines)>1.0+1e-12: failed.append('cosine_bounds')
          if not np.all(np.isfinite(ratios)): failed.append('nonfinite_ratios')
          if np.min(ratios)<-1e-12 or np.max(ratios)>1.0+1e-12: failed.append('triangle_ratio_bounds')
          if payload['gram_reconstruction_relative_error']>1e-12: failed.append('gram_reconstruction')
          if payload['parent_attribution_replay_relative_error']>1e-14: failed.append('parent_attribution_replay')
          if contract['forbidden_evaluate_inputs_present']: failed.append('forbidden_inputs')
          if contract['mean_projection_performed']: failed.append('agent3_mean_lane_crossed')
          if contract['correction_velocity_constructed']: failed.append('agent3_correction_lane_crossed')
          if contract['cancellation_metrics_are_acceptance_gates']: failed.append('diagnostic_promoted_to_gate')

          Path('artifacts').mkdir(exist_ok=True)
          receipt={
              'schema':'kokuno-a2-oscillatory-nonlinear-cancellation-receipt-v1',
              'parent_agent2_head':'b8159807d53c362bbdd691b56bdcd4c03456cff0',
              'agent1_reference_head':'300919075c07396e4e466f553be78eaae0707df2',
              'agent1_field_sha256':meta['field_sha256'],
              'cancellation_sha256':diagnostic.cancellation_sha256,
              'parent_attribution_sha256':diagnostic.parent_attribution_sha256,
              'parent_handoff_sha256':diagnostic.parent_handoff_sha256,
              'source_contract_sha256':diagnostic.source_contract_sha256,
              'sample_count':int(x.size),
              'source_X_range':[float(X.min()),float(X.max())],
              'metrics':payload,
              'interpretation':'raw Cartesian directional cancellation/alignment diagnostic only',
              'mean_projection_performed':False,
              'correction_velocity_constructed':False,
              'complete_ns_residual':False,
              'same_protocol_st006_comparison_valid':False,
              'paper_exact':False,
              'pde_validated':False,
              'failed_guards':failed,
          }
          Path('artifacts/kokuno_agent2_oscillatory_nonlinear_cancellation_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          p.stdin.close(); p.terminate(); p.wait(timeout=10)
          if failed: raise SystemExit('failed guards: '+', '.join(failed))
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokuno-agent2-oscillatory-nonlinear-cancellation-v1
          path: artifacts/kokuno_agent2_oscillatory_nonlinear_cancellation_receipt.json
          if-no-files-found: warn
