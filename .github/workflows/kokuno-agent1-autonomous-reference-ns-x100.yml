name: kokuno-agent1-autonomous-reference-ns-x100

on:
  push:
    branches:
      - codex/kokuno-a1-autonomous-reference-ns-x100-083
  pull_request:
    paths:
      - "src/openai_ns_reconstruction/kokuno_pa10_autonomous_reference_ns_x100.py"
      - "tests/test_kokuno_pa10_autonomous_reference_ns_x100.py"
      - ".github/workflows/kokuno-agent1-autonomous-reference-ns-x100.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokuno-agent1-autonomous-reference-ns-x100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous-reference-ns-x100:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile autonomous reference ns seam
        run: |
          python -m compileall -q \
            src/openai_ns_reconstruction/kokuno_pa10_autonomous_reference_ns_x100.py
      - name: Focused warnings-as-errors regression
        run: |
          python -m pytest -q -W error \
            tests/test_kokuno_pa10_reference_p1_x100.py \
            tests/test_kokuno_pa10_autonomous_axis_pressure_seed_x100.py \
            tests/test_kokuno_pa10_autonomous_reference_ns_x100.py
      - name: Emit autonomous reference ns receipt
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from openai_ns_reconstruction.kokuno_pa10_autonomous_reference_ns_x100 import (
              KokunoPA10AutonomousReferenceNsToX100,
          )

          stress = KokunoPA10AutonomousReferenceNsToX100()
          report = stress.report()
          truth = report['truth_boundary']
          initial = report['initial_probe']
          probe = report['X100_handoff_probe']

          assert np.max(np.abs(np.asarray(initial['n_s_initial'], dtype=float))) > 1.0e-12
          assert np.max(np.abs(np.asarray(probe['n_s_reference_autonomous'], dtype=float))) > 1.0e-12
          assert np.all(np.isfinite(np.asarray(probe['S_n_reference_autonomous'], dtype=float)))
          assert truth['public_Sn_formula_executable'] is True
          assert truth['public_Ns_ode_executable_to_X100'] is True
          assert truth['autonomous_pressure_reference_ns_to_X100_executable'] is True
          assert truth['autonomous_pressure_reference_stress_pair_p1r_nsr_executable'] is True
          assert truth['source_prepared_appendixA_Pi0_materialized'] is False
          assert truth['source_prepared_reference_nsr_materialized'] is False
          assert truth['source_prepared_full_reference_stress_pair_materialized'] is False
          assert truth['selected_kappa0_global_source_smallness_admitted'] is False
          assert truth['kappa0_continuation_to_X100_materialized'] is False
          assert truth['outer_global_leading_velocity_materialized'] is False
          assert truth['matched_global_pressure_materialized'] is False
          assert truth['heldout_ns_residual_assessed'] is False
          assert truth['pde_validated'] is False
          assert truth['paper_exact'] is False
          assert truth['openai_field_identified'] is False

          print(json.dumps({
              'semantic_sha256': report['semantic_sha256'],
              'initial_probe': initial,
              'X100_handoff_probe': probe,
          }, indent=2, sort_keys=True))
          PY
