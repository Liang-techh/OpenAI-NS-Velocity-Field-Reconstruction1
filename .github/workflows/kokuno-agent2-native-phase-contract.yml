name: kokuno-agent2-native-phase-contract

on:
  push:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_phase.py'
      - 'tests/test_constrained_kokuno_oscillatory_phase.py'
      - '.github/workflows/kokuno-agent2-native-phase-contract.yml'
  pull_request:
    paths:
      - 'src/openai_ns_reconstruction/kokuno_oscillatory_phase.py'
      - 'tests/test_constrained_kokuno_oscillatory_phase.py'
      - '.github/workflows/kokuno-agent2-native-phase-contract.yml'

permissions:
  contents: read

jobs:
  source-phase-covector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused source phase/covector tests
        run: python -m pytest -q -W error tests/test_constrained_kokuno_oscillatory_phase.py
