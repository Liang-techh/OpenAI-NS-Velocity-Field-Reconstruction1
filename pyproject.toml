[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-ns-velocity-field-reconstruction"
version = "0.2.0"
description = "Constrained independent Navier-Stokes candidate construction and validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
symbolic = ["sympy==1.14.0"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
ns-reconstruct = "openai_ns_reconstruction.__main__:main"
ns-velocity = "openai_ns_reconstruction.velocity_components:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
openai_ns_reconstruction = ["data/*.json"]
